# This file instructs Redocly's linter to ignore the rules contained for specific parts of your API.
# See https://redocly.com/docs/cli/ for more information.
#
# Multi-Provider E-Sign §G — the external-provider OAuth callback is a browser
# redirect target: 302 back to Settings is its only success response (the same
# reason auth.yaml turns this rule off for /auth/{consumer}/login).
openapi/ats.yaml:
  operation-2xx-response:
    - '#/paths/~1v1~1integrations~1esignature~1{provider}~1callback/get/responses'
# Apple Go-Live R-8 / W6 — the web/Android Apple revocation start and callback are browser
# redirect targets: 302 is their only success response (same reason as above).
openapi/sign.yaml:
  operation-2xx-response:
    - '#/paths/~1v1~1sign~1me~1apple~1revoke~1start/get/responses'
    - '#/paths/~1v1~1sign~1me~1apple~1revoke~1callback/post/responses'
