# Sign Personal (Free) — MaxMind's supported updater (official image, exact tag).
# Keeps the GeoLite2 Country + ASN databases in /opt/aramo/geoip current; it
# replaces each file in place, so obsolete versions are not retained, and the
# platform-admin and sign-service readers pick up a replaced file without a restart
# (they mount /opt/aramo/geoip read-only — see docker-compose.prod.yml).
# Architect ruling 2026-10-21: GeoLite2 is a risk signal only.
#
# A SEPARATE compose project (not a service of the prod stack): the prod stack
# never starts it, so unset credentials cannot break `compose up`, and the prod
# file stays free of profiles. Run on the box once the credentials are in
# /opt/aramo/.env (never Git):
#   docker compose -p aramo-geoip --env-file /opt/aramo/.env \
#     -f deploy/geoip/docker-compose.geoip.yml up -d
services:
  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:v7.1.0
    container_name: aramo-prod-geoipupdate
    restart: unless-stopped
    environment:
      - GEOIPUPDATE_ACCOUNT_ID=${GEOIPUPDATE_ACCOUNT_ID:?GEOIPUPDATE_ACCOUNT_ID must be set}
      - GEOIPUPDATE_LICENSE_KEY=${GEOIPUPDATE_LICENSE_KEY:?GEOIPUPDATE_LICENSE_KEY must be set}
      - GEOIPUPDATE_EDITION_IDS=GeoLite2-Country GeoLite2-ASN
      # Hours between update checks (72 = every 3 days); the container keeps running.
      - GEOIPUPDATE_FREQUENCY=72
    volumes:
      - /opt/aramo/geoip:/usr/share/GeoIP
