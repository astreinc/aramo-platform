# Aramo Core CI — CI-Velocity lanes (Aramo-CI-Velocity-Directive-v1_0-LOCKED §PR-2;
# CI-Velocity-2 PR-throughput slice).
#
# THREE lanes, ONE workflow:
#   • pull_request  — the FAST lane: nx `affected` for test/lint/build; a dynamic
#                     integration MATRIX over only the affected registry roots
#                     (each root on its own runner, fanning into the stable
#                     `tests:integration` gate); docker images built only for the
#                     nx-affected deployables; the cheap governance walls collapse
#                     into ONE `static-governance` job (one `npm ci`, one runner).
#   • merge_group   — the FULL gate: run-many --all unit/lint/build + EVERY
#                     integration root (matrix) + full pact + all governed walls +
#                     ALL docker images, on the queued merge result before it lands
#                     on main. deployment-gate requires it.
#   • schedule      — nightly full drift run on main (never blocks a PR).
#
# Invariant: no job is skipped-to-blocked. Affected/path-filtered work NO-OPS
# INTERNALLY (exits 0) when not applicable, so every required check still reports
# success/failure — never "skipped" — keeping branch protection + deployment-gate
# valid. Walls are NEVER affected-scoped (Charter). deployment-gate is the SOLE
# branch-protection required check; every governed job is (transitively) a member
# of its `needs`.
#
# Integration isolation: the harness-hardening invariant (one Postgres container
# per box, --no-file-parallelism) is preserved in every mode — each matrix leg is
# its OWN runner running exactly one registry root serially. Root SELECTION stays
# registry-driven (ci/integration-roots.json is the sole source; the discovery job
# derives the matrix from it via ci/scripts/run-integration.ts — no embedded list,
# no frozen count).

name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '0 7 * * *' # nightly full drift detector (07:00 UTC)

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path + affected helper (PR lane only). Non-PR events run everything full, so
  # its outputs are read solely under `github.event_name == 'pull_request'`
  # guards. On a PR it computes the docker image set from the Nx project graph:
  #   image affected  ⇔  a global dep changed (package-lock/package.json/
  #                       tsconfig.base) OR the app is nx-affected (its own source
  #                       or ANY transitive lib dependency changed) OR its
  #                       Dockerfile changed.
  # nginx is not an Nx project — it stays path-filtered to deploy/nginx/.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      docker: ${{ steps.dockerjson.outputs.json }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # nx affected needs history (PR lane)
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            terraform:
              - 'infrastructure/**'
            global:
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
            api_dockerfile:
              - 'apps/api/Dockerfile'
            auth_dockerfile:
              - 'apps/auth-service/Dockerfile'
            padmin_dockerfile:
              - 'apps/platform-admin/Dockerfile'
            nginx:
              - 'deploy/nginx/**'
      - name: Install (PR lane only — nx affected needs the project graph)
        if: github.event_name == 'pull_request'
        run: npm ci || npm ci || npm ci # retry: free-email-domains postinstall fetches 3 third-party hosts and hard-exits on a transient ETIMEDOUT
      - uses: nrwl/nx-set-shas@v4
        if: github.event_name == 'pull_request'
      - id: dockerjson
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # merge_group / push / schedule — ALL images build (full release set).
            echo 'json={"api":"true","auth-service":"true","platform-admin":"true","nginx":"true"}' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # PR fast lane — sound, dependency-aware affected detection.
          if [ "${{ steps.filter.outputs.global }}" = "true" ]; then
            # A global dependency changed → conservatively rebuild every app image.
            api=true; auth=true; padmin=true
            echo "::notice::global dependency changed — all app images affected."
          else
            AFFECTED_JSON=$(npx nx show projects --affected --type app --base="$NX_BASE" --head="$NX_HEAD" --json)
            echo "nx-affected apps: $AFFECTED_JSON"
            aff() { echo "$AFFECTED_JSON" | grep -q "\"$1\""; }
            # image affected = nx-affected (transitive libs included) OR its Dockerfile changed.
            if aff api || [ "${{ steps.filter.outputs.api_dockerfile }}" = "true" ]; then api=true; else api=false; fi
            if aff auth-service || [ "${{ steps.filter.outputs.auth_dockerfile }}" = "true" ]; then auth=true; else auth=false; fi
            if aff platform-admin || [ "${{ steps.filter.outputs.padmin_dockerfile }}" = "true" ]; then padmin=true; else padmin=false; fi
          fi
          nginx="${{ steps.filter.outputs.nginx }}"; nginx="${nginx:-false}"
          printf 'json={"api":"%s","auth-service":"%s","platform-admin":"%s","nginx":"%s"}\n' \
            "$api" "$auth" "$padmin" "$nginx" >> "$GITHUB_OUTPUT"

  install:
    name: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci || npm ci || npm ci # retry: free-email-domains postinstall fetches 3 third-party hosts and hard-exits on a transient ETIMEDOUT

  prisma-validate:
    name: prisma:validate
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci || npm ci || npm ci # retry: free-email-domains postinstall fetches 3 third-party hosts and hard-exits on a transient ETIMEDOUT
      - run: npm run prisma:validate

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # nx affected needs history
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci || npm ci || npm ci # retry: free-email-domains postinstall fetches 3 third-party hosts and hard-exits on a transient ETIMEDOUT
      # Nx local task cache — restore prior task results (nx re-validates every
      # task hash, so a restored cache can only produce identical outputs).
      - name: Nx cache (lint)
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nx-lint-${{ runner.os }}-
      - uses: nrwl/nx-set-shas@v4
        if: github.event_name == 'pull_request'
      - name: lint (affected on PR, all otherwise)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx nx affected -t lint
          else
            npx nx run-many -t lint --all
          fi

  build:
    name: build
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci || npm ci || npm ci # retry: free-email-domains postinstall fetches 3 third-party hosts and hard-exits on a transient ETIMEDOUT
      - uses: ./.github/actions/prisma-generate
      - name: Nx cache (build)
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nx-build-${{ runner.os }}-
      - uses: nrwl/nx-set-shas@v4
        if: github.event_name == 'pull_request'
      - name: build (affected on PR, all otherwise)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx nx affected -t build
          else
            npx nx run-many -t build --all
          fi

  # Builds every deployable image through its real Dockerfile — the artifact that
  # actually ships. On a PR the images are AFFECTED-FILTERED via the `changes` job
  # (nx project graph for the app images; deploy/nginx path filter for nginx). On
  # merge_group / push / schedule ALL images build. On push to main they are also
  # pushed SHA-tagged + :latest to GHCR (deploy provenance).
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: [install, changes]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, dockerfile: apps/api/Dockerfile }
          - { name: auth-service, dockerfile: apps/auth-service/Dockerfile }
          - { name: platform-admin, dockerfile: apps/platform-admin/Dockerfile }
          - { name: nginx, dockerfile: deploy/nginx/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      # Committed RED-first proof of the prod-deps boot-smoke guard: it MUST go RED on a
      # missing runtime module and GREEN on a present one. Runs once per CI run (api leg,
      # ungated by the docker filter), so the guard's own correctness is always exercised
      # regardless of whether any image is rebuilt. Pure loader logic — no Docker, no deps.
      - name: Boot-smoke guard self-test (RED/GREEN)
        if: ${{ matrix.name == 'api' }}
        run: bash ci/scripts/service-boot-smoke.sh --self-test
      - uses: docker/setup-buildx-action@v3
        if: ${{ fromJSON(needs.changes.outputs.docker)[matrix.name] == 'true' }}
      - name: Log in to GHCR (main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON(needs.changes.outputs.docker)[matrix.name] == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image (and push on main)
        id: build
        if: ${{ fromJSON(needs.changes.outputs.docker)[matrix.name] == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # GLH-2-A (GLH-2 Release Integrity, R3) — stamp the exact SOURCE revision.
          # On push→main this is github.sha (the merge-of-record commit). On a
          # pull_request, github.sha is GitHub's synthetic merge commit, so use the
          # true PR head SHA instead — one value, passed once, no `git rev-parse`.
          build-args: |
            GIT_REVISION=${{ github.event.pull_request.head.sha || github.sha }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/aramo-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/aramo-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      # GLH-2-B (GLH-2 Release Integrity, R3/R4) — on the governed release build (push→main,
      # images pushed), capture the IMMUTABLE digest from the build output and upload one
      # per-component manifest-input for the release-manifest job to fan in. The digest is the
      # artifact identity; the tags above are informational aliases only.
      - name: Capture release-manifest input (main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON(needs.changes.outputs.docker)[matrix.name] == 'true' }}
        run: |
          mkdir -p manifest-inputs
          cat > "manifest-inputs/${{ matrix.name }}.json" <<'JSON'
          {
            "component": "${{ matrix.name }}",
            "image": "ghcr.io/${{ github.repository_owner }}/aramo-${{ matrix.name }}",
            "digest": "${{ steps.build.outputs.digest }}",
            "revision": "${{ github.sha }}",
            "tags": ["${{ github.sha }}", "latest"]
          }
          JSON
      - name: Upload release-manifest input (main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON(needs.changes.outputs.docker)[matrix.name] == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: manifest-input-${{ matrix.name }}
          path: manifest-inputs/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 7
      # Front-door BOOT smoke (D-FRONTDOOR-CUTOVER-1 R3) — nginx leg ONLY, right
      # after its build. Loads the just-built image locally (cache-fast; same gha
      # scope) and boots it the way production does, catching E18/E19 that nginx -t
      # and conf-check cannot see. A SKIPPED smoke on the nginx leg is a finding.
      - name: Boot smoke (nginx front door — E18/E19)
        if: ${{ matrix.name == 'nginx' && fromJSON(needs.changes.outputs.docker)['nginx'] == 'true' }}
        run: |
          docker buildx build --load \
            --cache-from type=gha,scope=nginx \
            -f deploy/nginx/Dockerfile -t aramo/nginx:local .
          bash ci/scripts/frontdoor-boot-smoke.sh aramo/nginx:local
      # Production-dependency BOOT smoke (Node services: api / auth-service /
      # platform-admin) — the decimal.js class (2026-09-02). Loads the just-built,
      # prod-pruned image (cache-fast; same gha scope, so no rebuild cost) and proves its
      # runtime entry module graph resolves with PRODUCTION dependencies ONLY. A runtime
      # import left in devDependencies (stripped by `npm prune --omit=dev`) fails HERE, in
      # CI, not on the box. Mirrors the nginx front-door boot-smoke leg above; runs exactly
      # when the image builds. A SKIPPED smoke on a Node leg is a finding.
      - name: Boot smoke (prod deps — MODULE_NOT_FOUND)
        if: ${{ matrix.name != 'nginx' && fromJSON(needs.changes.outputs.docker)[matrix.name] == 'true' }}
        run: |
          docker buildx build --load \
            --build-arg GIT_REVISION=${{ github.event.pull_request.head.sha || github.sha }} \
            --cache-from type=gha,scope=${{ matrix.name }} \
            -f ${{ matrix.dockerfile }} -t aramo/${{ matrix.name }}:local .
          bash ci/scripts/service-boot-smoke.sh aramo/${{ matrix.name }}:local ${{ matrix.name }}
      - name: No-op (image unaffected on PR)
        if: ${{ fromJSON(needs.changes.outputs.docker)[matrix.name] != 'true' }}
        run: echo "::notice::${{ matrix.name }} image unaffected on this PR — build skipped (merge queue rebuilds it)."

  # GLH-2-B (GLH-2 Release Integrity, R4) — release-manifest generation-logic gate. Runs the
  # generator/validator selftest on every event so the fail-closed logic cannot regress.
  # Folded into `static-governance` on all lanes (see that job).

  # GLH-2-B (GLH-2 Release Integrity, R2/R3/R4) — on the governed release build (push→main),
  # fan in the per-component immutable digests, generate + validate ONE release manifest
  # binding exact source SHA → CI run → all governed artifacts → digests, and store it as CI
  # evidence. NOT a merge gate (main-only); no deployment (promotion = GLH-2-D).
  release-manifest:
    name: release-manifest
    runs-on: ubuntu-latest
    needs: [install, docker-build]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci || npm ci || npm ci # retry: free-email-domains postinstall fetches 3 third-party hosts and hard-exits on a transient ETIMEDOUT
      - name: Download per-component manifest inputs (immutable digests)
        uses: actions/download-artifact@v4
        with:
          pattern: manifest-input-*
          path: manifest-inputs
          merge-multiple: true
      - name: Generate + validate release manifest
        env:
          RELEASE_SOURCE_REVISION: ${{ github.sha }}
          RELEASE_CREATED_AT: ${{ github.event.head_commit.timestamp }}
        run: |
          node --import jiti/register ci/scripts/release-manifest.ts \
            --generate --inputs manifest-inputs --out "release-manifest-${{ github.sha }}.json"
          node --import jiti/register ci/scripts/release-manifest.ts \
            --validate "release-manifest-${{ github.sha }}.json"
      - name: Upload release manifest (CI evidence)
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 90

  test-unit:
    name: test:unit
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci || npm ci || npm ci # retry: free-email-domains postinstall fetches 3 third-party hosts and hard-exits on a transient ETIMEDOUT
      - uses: ./.github/actions/prisma-generate
      - name: Nx cache (test)
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nx-test-${{ runner.os }}-
      - uses: nrwl/nx-set-shas@v4
        if: github.event_name == 'pull_request'
      - name: test:unit (affected on PR, all otherwise)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx nx affected -t test
          else
            npx nx run-many -t test --all
          fi

  # ---------------------------------------------------------------------------
  # static-governance — CONSOLIDATED cheap governance walls (CI-Velocity-2 §PR-2).
  #
  # These deterministic static checks each ran ~1s–15s but paid a full `npm ci`
  # (~70s) on a dedicated runner. They now share ONE checkout + ONE `npm ci` on
  # ONE runner, each as its own NAMED step so a failure names the exact wall.
  # `if: ${{ !cancelled() }}` on every check step means one red does NOT mask the
  # others — every wall still reports independently (stronger visibility than the
  # prior parallel jobs, which stopped at their own first failure). The job fails
  # if ANY step fails; it is a member of deployment-gate.needs, so every folded
  # wall still gates the merge exactly as before. Self-tests run before their
  # check (unchanged), keeping each guard non-vacuous.
  #
  # NOT folded (kept as standalone jobs by governance): build, verify-vocabulary,
  # env-passthrough-check, contract-parity-check, aggregate-gate-check — the five
  # GLH-1 REQUIRED_AGGREGATE_MEMBERS that verify-aggregate-gate.ts pins as distinct
  # job IDs inside deployment-gate.needs.
  # ---------------------------------------------------------------------------
  static-governance:
    name: static-governance
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci || npm ci || npm ci # retry: free-email-domains postinstall fetches 3 third-party hosts and hard-exits on a transient ETIMEDOUT
      - name: openapi:validate
        if: ${{ !cancelled() }}
        run: npm run openapi:validate
      - name: openapi:lint
        if: ${{ !cancelled() }}
        run: npm run openapi:lint
      - name: openapi:drift-check
        if: ${{ !cancelled() }}
        run: npm run openapi:drift-check
      - name: portal:refusal-check
        if: ${{ !cancelled() }}
        run: npm run portal:refusal-check
      - name: ats:refusal-check
        if: ${{ !cancelled() }}
        run: npm run ats:refusal-check
      - name: ingestion:refusal-check
        if: ${{ !cancelled() }}
        run: npm run ingestion:refusal-check
      - name: frontdoor:conf-check
        if: ${{ !cancelled() }}
        run: node --import jiti/register ci/scripts/verify-frontdoor-conf.ts
      - name: version:sync-check
        if: ${{ !cancelled() }}
        run: npm run version:sync-check
      - name: error-codes:check
        if: ${{ !cancelled() }}
        run: npm run error-codes:check
      - name: orphan-scopes:self-test
        if: ${{ !cancelled() }}
        run: npm run orphan-scopes:self-test
      - name: orphan-scopes:check
        if: ${{ !cancelled() }}
        run: npm run orphan-scopes:check
      - name: dead-error-codes:self-test
        if: ${{ !cancelled() }}
        run: npm run dead-error-codes:self-test
      - name: dead-error-codes:check
        if: ${{ !cancelled() }}
        run: npm run dead-error-codes:check
      - name: pipeline:write-authority:self-test
        if: ${{ !cancelled() }}
        run: npm run pipeline:write-authority:self-test
      - name: pipeline:write-authority:check
        if: ${{ !cancelled() }}
        run: npm run pipeline:write-authority:check
      - name: integration-roots:check
        if: ${{ !cancelled() }}
        run: npm run tests:integration:check
      - name: repo-map:check
        if: ${{ !cancelled() }}
        run: npm run repo-map:check
      - name: scripts:test
        if: ${{ !cancelled() }}
        run: npm run scripts:test
      - name: release-manifest:check
        if: ${{ !cancelled() }}
        run: npm run release-manifest:selftest

  # identity-index:privacy-wall is deliberately NOT folded into static-governance.
  # Its LOCKED directives (Aramo-TR2b-DDR §I14 line 83; Aramo-TR2b-B1 line 41) mandate a
  # "first-class named CI gate … visible in the required-checks list, not folded" — a
  # visibility rationale that exceeds CI execution topology, so the CI-Velocity-2 governed-
  # aggregate equivalence amendment (which is topology-only) does not cover it. It stays a
  # standalone job in deployment-gate.needs, honoring TR2b literally. (identity_index carries
  # a hard privacy invariant: no tenant_id, no PII, ever.)
  identity-index-privacy-wall:
    name: identity-index:privacy-wall
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci || npm ci || npm ci # retry: free-email-domains postinstall fetches 3 third-party hosts and hard-exits on a transient ETIMEDOUT
      - run: npm run identity-index:privacy-wall

  verify-vocabulary:
    name: verify:vocabulary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: |
          # ripgrep is not preinstalled on ubuntu-latest. Install it from the
          # runner's prepopulated Ubuntu apt index. Do NOT run apt-get update here:
          # that refreshes unrelated third-party repos and can fail this gate before
          # the vocabulary scan starts.
          sudo apt-get install -y ripgrep
          rg --version
      - run: bash scripts/verify-vocabulary.sh

  # ---------------------------------------------------------------------------
  # GLH-1 REQUIRED_AGGREGATE_MEMBERS kept as standalone jobs (verify-aggregate-gate.ts
  # pins these exact job IDs into deployment-gate.needs). Unconditional walls.
  # ---------------------------------------------------------------------------

  # GLH-1 D — production env-passthrough parity.
  env-passthrough-check:
    name: env:passthrough-check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci || npm ci || npm ci # retry: free-email-domains postinstall fetches 3 third-party hosts and hard-exits on a transient ETIMEDOUT
      - run: npm run env:passthrough-check

  # GLH-1-C — governed API contract-parity (route <-> OpenAPI).
  contract-parity-check:
    name: contract-parity:check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci || npm ci || npm ci # retry: free-email-domains postinstall fetches 3 third-party hosts and hard-exits on a transient ETIMEDOUT
      - run: npm run contract-parity:check

  # GLH-1 A+B — aggregate-gate membership wall. Pins build, verify-vocabulary, the GLH-1
  # walls, and itself INTO deployment-gate.needs so a job that runs but does not gate merges
  # cannot silently reappear. Unconditional wall.
  aggregate-gate-check:
    name: aggregate-gate:check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci || npm ci || npm ci # retry: free-email-domains postinstall fetches 3 third-party hosts and hard-exits on a transient ETIMEDOUT
      - run: npm run aggregate-gate:check

  # Placement generated-SQL parity wall (standalone; unchanged — currently not a
  # deployment-gate member, preserved as-is to avoid changing gating semantics).
  placement-sql-check:
    name: placement:sql:check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci || npm ci || npm ci # retry: free-email-domains postinstall fetches 3 third-party hosts and hard-exits on a transient ETIMEDOUT
      - run: npm run placement:sql:check

  lint-nx-boundaries:
    name: lint:nx-boundaries
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci || npm ci || npm ci # retry: free-email-domains postinstall fetches 3 third-party hosts and hard-exits on a transient ETIMEDOUT
      - run: npm run lint:nx-boundaries

  pact-consumer:
    name: pact:consumer
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci || npm ci || npm ci # retry: free-email-domains postinstall fetches 3 third-party hosts and hard-exits on a transient ETIMEDOUT
      # M6 PR-1 — bounded retry for the irreducible pact-rust mock-server
      # port-reuse race. k=3 projects job failure to < 0.5%.
      - name: Run pact:consumer (with bounded retry for pact-rust race)
        run: |
          set -e
          ATTEMPTS=3
          for attempt in $(seq 1 $ATTEMPTS); do
            if npm run pact:consumer; then
              echo "pact:consumer passed on attempt $attempt"
              exit 0
            fi
            echo "::warning::pact:consumer failed attempt $attempt of $ATTEMPTS (suspected pact-rust race; HK-M6)"
          done
          echo "::error::pact:consumer failed after $ATTEMPTS attempts"
          exit 1
      - name: Upload pact files
        uses: actions/upload-artifact@v4
        with:
          name: pact-files
          path: pact/pacts/
          if-no-files-found: error
          retention-days: 1

  pact-provider:
    name: pact:provider
    runs-on: ubuntu-latest
    needs: [install, pact-consumer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci || npm ci || npm ci # retry: free-email-domains postinstall fetches 3 third-party hosts and hard-exits on a transient ETIMEDOUT
      - uses: ./.github/actions/prisma-generate
      - name: Download pact files
        uses: actions/download-artifact@v4
        with:
          name: pact-files
          path: pact/pacts/
      - run: npm run pact:provider

  # ---------------------------------------------------------------------------
  # Integration — a DYNAMIC MATRIX over the affected (PR) / all (else) registry
  # roots. Discovery derives the matrix from the sole canonical registry
  # (ci/integration-roots.json) via ci/scripts/run-integration.ts (CI_EMIT_MATRIX);
  # each matrix leg runs EXACTLY ONE root on its OWN runner (CI_ROOT), serially
  # with --no-file-parallelism — so the one-Postgres-per-box harness-hardening
  # invariant holds per leg while roots run in PARALLEL across legs. The stable
  # `tests:integration` job fans them in and is the member deployment-gate needs.
  # An affected-empty PR yields an empty matrix → the run job is skipped → the
  # fan-in reports SUCCESS (not skipped).
  # ---------------------------------------------------------------------------
  integration-discovery:
    name: integration-discovery
    runs-on: ubuntu-latest
    needs: install
    outputs:
      matrix: ${{ steps.emit.outputs.matrix }}
      has_roots: ${{ steps.emit.outputs.has_roots }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # nx affected needs history (PR lane)
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci || npm ci || npm ci # retry: free-email-domains postinstall fetches 3 third-party hosts and hard-exits on a transient ETIMEDOUT
      - uses: nrwl/nx-set-shas@v4
        if: github.event_name == 'pull_request'
      - name: Emit affected (PR) / full (else) integration matrix
        id: emit
        env:
          CI_EMIT_MATRIX: '1'
          CI_AFFECTED: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: node --import jiti/register ci/scripts/run-integration.ts

  integration:
    name: integration (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [install, integration-discovery]
    if: ${{ needs.integration-discovery.outputs.has_roots == 'true' }}
    strategy:
      fail-fast: false
      # Bounded burst (CI-Velocity-2 R2, Architect-ruled): the full lane otherwise
      # makes every registry leg simultaneously eligible, worsening runner-queue
      # contention. Measured distribution — apps/api ≈ 659 s dominates, the remaining
      # leaf legs sum to ≈ 583 s (median ≈ 7.6 s) — makes apps/api the hard floor;
      # K=8 lands within ~7% of the unconstrained floor while capping the integration
      # runner burst, leaving headroom for build/test/docker/pact. K=4 is slower than
      # the old serial job (per-leg setup overhead dominates); K>8 buys ~nothing (api-bound).
      max-parallel: 8
      matrix: ${{ fromJSON(needs.integration-discovery.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci || npm ci || npm ci # retry: free-email-domains postinstall fetches 3 third-party hosts and hard-exits on a transient ETIMEDOUT
      - uses: ./.github/actions/prisma-generate
      # CI-Velocity-2 harness fix (diagnosed root cause of settings/skills-taxonomy failing
      # under per-leg execution): Testcontainers pulls its base image in beforeAll; under the
      # matrix each leg pulls independently, and the contaminated-main run hit Docker Hub
      # HTTP 500s (transient), leaving the container undefined → teardown "$disconnect/close"
      # on undefined. This best-effort pre-pull with backoff warms the small common base
      # images so beforeAll finds them cached; combined with max-parallel: 8 (which caps the
      # concurrent-pull burst) it removes the observed failure. Best-effort by design — if a
      # pull ultimately fails, Testcontainers still retries on demand, so this never masks a
      # real test failure. (localstack/localstack:3 is large and used by a single root, so it
      # is intentionally left to on-demand pull rather than warmed in every leg.)
      - name: Pre-warm Testcontainers base images (absorb Docker Hub transient 5xx)
        run: |
          for img in postgres:17 postgres:17-alpine redis:7; do
            for i in 1 2 3 4 5; do
              if docker pull "$img"; then break; fi
              echo "::warning::docker pull $img attempt $i failed (suspected Docker Hub transient 5xx); backing off"
              sleep $((i * 6))
            done
          done
      - name: integration root (serial, one Postgres on this box)
        env:
          CI_ROOT: ${{ matrix.root }}
        run: bash ci/scripts/ci-integration.sh

  # Stable fan-in gate. Name + job ID unchanged (`tests:integration` /
  # tests-integration) so branch protection + deployment-gate.needs are unaffected.
  # always() so it never reports "skipped": PASS when every leg is green OR the
  # matrix was empty (no affected roots); FAIL if discovery failed or any leg failed.
  tests-integration:
    name: tests:integration
    runs-on: ubuntu-latest
    needs: [integration-discovery, integration]
    if: always()
    steps:
      - name: Aggregate integration matrix result
        run: |
          set -euo pipefail
          D='${{ needs.integration-discovery.result }}'
          R='${{ needs.integration.result }}'
          echo "discovery=$D  integration-matrix=$R  has_roots=${{ needs.integration-discovery.outputs.has_roots }}"
          if [ "$D" != "success" ]; then
            echo "::error::integration discovery did not succeed (result=$D)."
            exit 1
          fi
          # R is 'skipped' when the affected set was empty (expected PASS), 'success'
          # when every leg was green, or 'failure'/'cancelled' when a root failed.
          if [ "$R" = "failure" ] || [ "$R" = "cancelled" ]; then
            echo "::error::one or more integration roots failed (matrix result=$R)."
            exit 1
          fi
          echo "All affected integration roots passed (or none were affected)."

  # ---------------------------------------------------------------------------
  # Terraform IaC gates — PATH-FILTERED to infrastructure/ on a PR (no-op when
  # unchanged, so the required check still reports success); full on other lanes.
  # ---------------------------------------------------------------------------

  terraform-fmt:
    name: terraform:fmt
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '>= 1.6.0'
      - name: Terraform fmt check
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.terraform == 'true' }}
        run: terraform fmt -check -recursive infrastructure/
      - name: No-op (infrastructure/ unchanged on PR)
        if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.terraform != 'true' }}
        run: echo "::notice::infrastructure/ unchanged on this PR — terraform:fmt skipped (merge queue runs it)."

  terraform-validate:
    name: terraform:validate
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      matrix:
        environment: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '>= 1.6.0'
      - name: Terraform init + validate
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.terraform == 'true' }}
        run: |
          cd infrastructure/environments/${{ matrix.environment }}
          terraform init -backend=false
          terraform validate
      - name: No-op (infrastructure/ unchanged on PR)
        if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.terraform != 'true' }}
        run: echo "::notice::infrastructure/ unchanged on this PR — terraform:validate (${{ matrix.environment }}) skipped."

  terraform-lint:
    name: terraform:lint
    runs-on: ubuntu-latest
    needs: changes
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.terraform == 'true' }}
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=warning
      - name: No-op (infrastructure/ unchanged on PR)
        if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.terraform != 'true' }}
        run: echo "::notice::infrastructure/ unchanged on this PR — terraform:lint skipped."

  terraform-sec:
    name: terraform:sec
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v4
      # tfsec via direct binary install (M5 HK-M5). Version pinned v1.28.14
      # (ADR-0014 #2); checksum-verified.
      - name: tfsec install + verify + scan
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.terraform == 'true' }}
        run: |
          set -euo pipefail
          TFSEC_VERSION=v1.28.14
          TFSEC_BIN_URL="https://github.com/aquasecurity/tfsec/releases/download/${TFSEC_VERSION}/tfsec-linux-amd64"
          TFSEC_CHECKSUM_URL="https://github.com/aquasecurity/tfsec/releases/download/${TFSEC_VERSION}/tfsec_checksums.txt"
          curl -sSL -o tfsec "${TFSEC_BIN_URL}"
          curl -sSL -o tfsec_checksums.txt "${TFSEC_CHECKSUM_URL}"
          EXPECTED_SHA=$(grep "tfsec-linux-amd64$" tfsec_checksums.txt | awk '{print $1}')
          ACTUAL_SHA=$(sha256sum tfsec | awk '{print $1}')
          if [ "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
            echo "::error title=tfsec checksum mismatch::expected=${EXPECTED_SHA} actual=${ACTUAL_SHA}"
            exit 1
          fi
          chmod +x tfsec
          ./tfsec infrastructure --minimum-severity=HIGH
      - name: No-op (infrastructure/ unchanged on PR)
        if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.terraform != 'true' }}
        run: echo "::notice::infrastructure/ unchanged on this PR — terraform:sec skipped."

  npm-audit:
    name: npm:audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --omit=dev || npm ci --omit=dev || npm ci --omit=dev # retry: transient free-email-domains postinstall ETIMEDOUT
      - run: bash scripts/audit-check.sh

  # ---------------------------------------------------------------------------
  # Deployment-gate aggregator (PR-M0R-3 §4.1, VARIANT B). One PASS/FAIL check
  # that branch protection requires. On merge_group it is the FULL-suite gate; on
  # a PR it aggregates the fast lane (affected/path-filtered jobs report success
  # even when they no-op internally — no "skipped" ever reaches this grep).
  # Override-label discipline (Plan v1.5 §4 Stage 4) preserved.
  #
  # CI-Velocity-2 membership note: the 16 cheap governance walls that formerly
  # appeared here individually now gate via the single `static-governance` member
  # (each is a named step inside it); the integration matrix gates via the stable
  # `tests-integration` fan-in. The five GLH-1 REQUIRED_AGGREGATE_MEMBERS remain
  # explicit members (verify-aggregate-gate.ts enforces their presence).
  # ---------------------------------------------------------------------------
  deployment-gate:
    name: deployment-gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build # GLH-1 A — the CI-simulated nx build now gates merges
      - verify-vocabulary # GLH-1 B — the trust-output vocabulary wall now gates merges
      - env-passthrough-check # GLH-1 D — prod env-passthrough parity
      - contract-parity-check # GLH-1-C — governed API route<->OpenAPI parity
      - aggregate-gate-check # GLH-1 A+B — pins the above INTO this needs list
      - static-governance # CI-Velocity-2 — consolidated cheap governance walls (named steps)
      - identity-index-privacy-wall # TR2b-DDR/B1 — kept standalone (visibility rationale, not folded)
      - pact-consumer
      - pact-provider
      - test-unit
      - tests-integration # stable fan-in over the affected/full integration matrix
      - lint-nx-boundaries
      - docker-build
      - terraform-fmt
      - terraform-validate
      - terraform-lint
      - terraform-sec
      - npm-audit
    steps:
      - name: Evaluate override label and justification
        id: override
        uses: actions/github-script@v7
        with:
          script: |
            // Override applies only on pull_request events.
            if (context.eventName !== 'pull_request') {
              core.setOutput('override_active', 'false');
              core.info('Not a pull_request event; override path skipped.');
              return;
            }
            const labels = (context.payload.pull_request?.labels ?? [])
              .map((l) => l.name);
            const hasOverrideLabel = labels.includes('override:ok-to-merge');
            const body = context.payload.pull_request?.body ?? '';
            const justifMatch = body.match(
              /^Override-Justification:\s*(.{40,})$/m,
            );
            if (hasOverrideLabel && justifMatch) {
              core.notice(
                `Override active per PR label override:ok-to-merge with valid justification: ${justifMatch[1].slice(0, 100)}…`,
              );
              core.setOutput('override_active', 'true');
              return;
            }
            if (hasOverrideLabel && !justifMatch) {
              core.setFailed(
                'override:ok-to-merge label present but Override-Justification (≥40 chars) line is missing or too short in PR body. Add a single line beginning "Override-Justification: " followed by ≥40 characters of rationale.',
              );
              return;
            }
            core.setOutput('override_active', 'false');
      - name: Verify all required deployment gates succeeded
        if: steps.override.outputs.override_active != 'true'
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "Needs results: $NEEDS_RESULTS"
          # Fail if any needed job did not succeed (failure, cancelled, or skipped).
          if echo "$NEEDS_RESULTS" | grep -qE '"result":[[:space:]]*"(failure|cancelled|skipped)"'; then
            echo "ERROR: One or more required deployment gates did not succeed."
            exit 1
          fi
          echo "All required deployment gates passed."
