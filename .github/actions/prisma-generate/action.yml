# CI-Velocity — per-module Prisma client generation with a content-keyed cache.
#
# Priority 3 (repeated prisma:generate). The generated clients are a pure function
# of (every libs/*/prisma/schema.prisma) × (the Prisma generator version, pinned by
# package-lock.json) × (Node version, .nvmrc). The cache key hashes exactly those
# inputs, so a hit is byte-identical to a fresh generate — NO stale-client risk.
#
# Safety belt: the cache is used ONLY on the pull_request fast lane. On
# merge_group / push→main / schedule (the lanes that gate the merge and produce
# the deploy artifacts) the client is ALWAYS regenerated fresh, so even a
# hypothetical cache defect cannot reach a governed merge or a shipped image.
name: prisma-generate
description: Generate per-module Prisma clients, restoring a content-keyed cache on the PR fast lane only.
runs:
  using: composite
  steps:
    - name: Restore Prisma client cache (PR fast lane only)
      id: prisma-cache
      if: github.event_name == 'pull_request'
      uses: actions/cache@v4
      with:
        path: |
          libs/*/prisma/generated
          libs/*/node_modules/.prisma
        key: prisma-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('libs/*/prisma/schema.prisma', 'package-lock.json') }}
    - name: prisma:generate (skipped only on a PR cache hit)
      if: ${{ github.event_name != 'pull_request' || steps.prisma-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: npm run prisma:generate
