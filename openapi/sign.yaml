                $ref: '#/components/schemas/SignBranding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/sender/branding/logo:
    put:
      operationId: setSenderBrandingLogo
      summary: Upload or replace the organization's logo (PNG or JPEG, at most 256 KB, 16 to 4096 pixels a side).
      description: >-
        Requires sign:settings:manage; the same availability and plan refusals as PUT branding.
        The type is checked from the bytes and must match content_type; SVG and other types are
        refused (400 details.reason logo_type_unsupported, logo_type_mismatch, logo_too_large,
        logo_dimensions_invalid, logo_encoding_invalid or logo_empty).
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: true
