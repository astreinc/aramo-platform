  /v1/sign/sender/envelopes/from-template:
    post:
      operationId: createSenderEnvelopeFromTemplate
      summary: Create a DRAFT envelope from a document template (DOC-TEMPLATE-LIB-1 T-5).
      description: >
        Requires sign:envelope:create and document_template:read; refused for a PERSONAL tenant and while sign.templates is not available. Feature-Parity 1.1 (Catalog v2 P-6) — then the plan: ESIGN_FEATURE_NOT_AVAILABLE (403, details.reason templates_not_in_plan) on the Free plan, details.reason subscription_inactive for a subscription that does not send, ESIGN_NOT_SUBSCRIBED (403) without one. Templates are adopted and edited in Org Home; Aramo Sign never creates one. Documents (apps/api) renders the template with the organization's branding and the sender's values into a frozen revision pinned to the exact template version; the draft's document references it (CORE_REF) and records the template + version (template provenance, M-A6 §3.6). With `signer`, that first signer is added and the template's signature area is placed for them. Amendment M-A6 §3.5 — with `recipients` (mutually exclusive with `signer`; only for a template with signing roles) each SIGNER role is bound to exactly one recipient (signing order = role order) and its signature blocks are placed for them; `cc` binds CC roles as copy recipients (delivery at completion); emails are distinct across all of them; `routing_mode`, `message` and `subject` default to the template's. Every refusal (details.reason: signer_and_recipients, recipients_required, template_has_roles, template_has_no_roles, unknown_role, role_not_signer, role_not_cc, role_bound_twice, role_unbound, duplicate_email, routing_mode_invalid, too_many_signers, too_many_copy_recipients) happens before the render. Idempotent on idempotency_key for the render.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_id]
              properties:
                template_id:
                  type: string
                  format: uuid
                values:
                  type: object
                  additionalProperties:
                    type: string
                subject:
                  type: string
                  maxLength: 200
                idempotency_key:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{8,128}$'
                signer:
                  type: object
                  required: [name, email]
                  properties:
                    name:
                      type: string
                    email:
                      type: string
                recipients:
                  type: array
                  maxItems: 10
                  description: M-A6 §3.5 — one recipient per SIGNER role of the template (mutually exclusive with signer).
                  items:
                    $ref: '#/components/schemas/SenderTemplateRoleBinding'
                cc:
                  type: array
                  maxItems: 10
                  description: M-A6 §3.5 / M-A5 — copy recipients for CC roles of the template (delivery at completion).
                  items:
                    $ref: '#/components/schemas/SenderTemplateRoleBinding'
                routing_mode:
                  type: string
                  enum: [PARALLEL, SEQUENTIAL]
                message:
                  type: [string, 'null']
                  maxLength: 1000
                mode:
                  type: string
                  enum: [standard, self]
                  default: standard
                  description: >-
                    Aramo Sign Mobile M-A12 W1-A — self ("Sign a document" from a template): a SELF draft whose one
                    recipient is the caller (verified account email, bound to them). The template's single signer
                    role (the first needed one, when there are several) is bound to the caller and its fields are
                    placed for them. signer, recipients, cc and routing_mode are refused (422
                    self_sign_single_recipient); a template whose fields need more than one signer role is 422
                    self_sign_single_recipient; no verified account email is 403 self_sign_email_unverified. No
                    invitation and no allowance use at send (an active subscription is still required).
      responses:
        '201':
          description: The draft envelope (detail), the pinned template version, the template's signature areas and its signing roles.
          content:
            application/json:
              schema:
                type: object
                required: [envelope, template, suggested_fields, field_definitions, signing]
                properties:
                  envelope:
                    type: object
                  template:
                    type: object
                    required: [template_id, version_id, version_number]
                    properties:
                      template_id:
                        type: string
                        format: uuid
                      version_id:
                        type: string
                        format: uuid
                      version_number:
                        type: integer
                  suggested_fields:
                    type: array
                    items:
                      $ref: '#/components/schemas/SenderTemplateSignatureField'
                  field_definitions:
                    type: array
                    items:
                      type: object
                  signing:
                    oneOf:
                      - $ref: '#/components/schemas/SenderTemplateSigning'
                      - type: 'null'
                  mode:
                    type: string
                    enum: [self]
                    description: M-A12 — present for a self-mode create.
                  bound_role_key:
                    type: [string, 'null']
                    description: M-A12 — the template signer role bound to the caller (null for a template without roles).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: A template value the Documents API refused, or (M-A12 self mode) self_sign_single_recipient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/oauth/token:
    post:
      operationId: issueSignAccessToken
      summary: Issue a short-lived Sign API access token.
      description: >
        client_credentials (APPLICATION mode; installation-bound credential) or
        urn:ietf:params:oauth:grant-type:token-exchange (USER mode; subject_token = the user's Aramo access token,
        verified and authority-resolved server-side). Client credentials in the body or HTTP Basic. Tokens live at most
        300 seconds and never beyond the subject token; they are audience-bound (aramo-sign-api), tenant-scoped and
        revoked with their installation or credential. Refusals never reveal whether a client exists (401 invalid_client).
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignTokenRequest'
      responses:
        '200':
          description: The access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
