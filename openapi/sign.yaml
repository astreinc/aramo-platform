    BillingPlan:
      type: object
      description: A catalog plan (Commercial Plans Amendment A1). Prices are display values in minor units; the charge is the provider price. reference_price is present only when substantiated.
      required: [key, name, sales_model, status, price, reference_price, commitment_months, eligibility, eligible, allowances, capacities, features, purchasable, price_unit]
      properties:
        price_unit:
          type: string
          enum: [ACCOUNT, SEAT]
          description: Sign Business per-seat pricing — SEAT when price is per seat (per Sign-sending member) per interval; ACCOUNT when per organization.
        key:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        tenant_kind:
          type: [string, 'null']
        sales_model:
          type: string
          enum: [SELF_SERVICE, FREE, CONTACT_SALES, OPERATOR]
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        price:
          type: [object, 'null']
          properties:
            amount_minor:
              type: integer
            currency:
              type: string
            interval:
              type: [string, 'null']
        reference_price:
          type: [object, 'null']
          properties:
            amount_minor:
              type: integer
            currency:
              type: string
        commitment_months:
          type: [integer, 'null']
        eligibility:
          type: [string, 'null']
        eligible:
          type: boolean
        support_tier:
          type: [string, 'null']
        activation_note:
          type: [string, 'null']
        allowances:
          type: array
          items:
            type: object
            required: [allowance_key, included_quantity, unlimited, period, available]
            properties:
              allowance_key:
                type: string
              included_quantity:
                type: [integer, 'null']
              unlimited:
                type: boolean
              period:
                type: string
                enum: [MONTHLY]
              available:
                type: boolean
                description: The capability is built and operational (an entitlement that is not available is never advertised).
        capacities:
          type: array
          items:
            type: object
            required: [capacity_key, limit, unlimited, available]
            properties:
              capacity_key:
                type: string
              limit:
                type: [integer, 'null']
              unlimited:
                type: boolean
              available:
                type: boolean
        features:
          type: array
          items:
            type: object
            required: [feature_key, enabled, available]
            properties:
              feature_key:
                type: string
              enabled:
                type: boolean
                description: Included by the plan (entitlement).
              available:
                type: boolean
                description: Built and operational (launch availability).
        purchasable:
          type: boolean
        store_products:
          type: array
          description: M-A12 W1-G — the store products pinned to the plan's published version (empty while store billing is off). The interval comes from the pin.
          items:
            type: object
            required: [platform, product_id, interval]
            properties:
              platform:
                type: string
                enum: [ios, android]
              product_id:
                type: string
              interval:
                type: string
                enum: [MONTH, YEAR]
        regional_price:
          description: M-A12 A1-3 — the published regional list price for the caller's billing country (the monthly one when both exist); null when none. Display only; the store charges its own localized price.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/BillingRegionalPrice'
        regional_prices:
          type: array
          description: M-A12 A1-3 — every published regional price for the caller's billing country (MONTH and YEAR).
          items:
            $ref: '#/components/schemas/BillingRegionalPrice'
    BillingRegionalPrice:
      type: object
      required: [country, currency, amount_minor, interval]
      properties:
        country:
          type: string
        currency:
          type: string
        amount_minor:
          type: integer
        interval:
          type: string
          enum: [MONTH, YEAR]
    BillingSeatChange:
      type: object
      additionalProperties: false
      description: Sign Business per-seat pricing — the seats after a change (POST /v1/sign/billing/seats).
      required: [purchased, used, pending_purchased, effective]
      properties:
        purchased:
          type: integer
          minimum: 1
        used:
          type: integer
          minimum: 0
        pending_purchased:
          type: [integer, 'null']
          minimum: 1
        effective:
          type: string
          enum: [NOW, PERIOD_END]
    TaxAvailability:
      type: object
      additionalProperties: false
      description: >-
        CCP-C5 (PBD §5.2 row C5, §10) — tax is a designed disabled state until Stripe Tax
        registration. Always enabled=false with reason STRIPE_TAX_NOT_REGISTERED; no setting enables
        it, and no tax is calculated, collected or shown.
      required: [enabled, reason]
      properties:
        enabled:
          type: boolean
          enum: [false]
        reason:
          type: string
          enum: [STRIPE_TAX_NOT_REGISTERED]
    BillingAccount:
      type: object
      required: [subscription, allowance, storage, billing_available, tax, tenant_kind, self_service_eligible, can_manage_billing, price_unit, seats, can_manage_seats]
      properties:
        price_unit:
          type: [string, 'null']
          enum: [ACCOUNT, SEAT, null]
          description: Sign Business per-seat pricing — the shown subscription's pinned price unit (null without a subscription).
        seats:
          type: [object, 'null']
          description: >-
            Sign Business per-seat pricing — null unless the open subscription is priced per seat. purchased is the
            seat limit now; used the active, accepted members holding Sign send access (S-4); pending_purchased a
            decrease scheduled for the end of the current period (null when none).
          required: [purchased, used, pending_purchased]
          properties:
            purchased:
              type: integer
              minimum: 1
            used:
              type: integer
              minimum: 0
            pending_purchased:
              type: [integer, 'null']
              minimum: 1
        can_manage_seats:
          type: boolean
          description: The caller is the owner or an admin and the per-seat subscription is billed through Stripe (POST seats).
        tax:
          $ref: '#/components/schemas/TaxAvailability'
        pending_activation:
          type: [object, 'null']
          description: >-
            CCP-A6-R (Conversion Rule C-8) — a self-service activation is held because the organization's
            subscription is managed by Aramo. A safe billing-support state only: it never reports an
            activation and exposes no internal reason.
          required: [state, message]
          properties:
            state:
              type: string
              enum: [PENDING]
            message:
              type: string
              enum: ['Subscription activation pending — contact support']
        subscription:
          type: [object, 'null']
          required: [plan_key, plan_name, source, status, sending, started_at, cancel_at_period_end, billing_managed]
          properties:
            plan_key:
              type: string
            plan_name:
              type: string
            source:
              type: string
              enum: [MANUAL, DEVELOPMENT, SELF_SERVICE, FREE]
              description: FREE — the system-opened Free Personal subscription (no billing provider).
            status:
              type: string
              enum: [TRIALING, ACTIVE, PAST_DUE, CANCELED, INCOMPLETE]
            sending:
              type: boolean
            started_at:
              type: string
              format: date-time
            ended_at:
              type: [string, 'null']
              format: date-time
            current_period_end:
              type: [string, 'null']
              format: date-time
            cancel_at_period_end:
              type: boolean
            grace_until:
              type: [string, 'null']
              format: date-time
            billing_managed:
              type: boolean
            commitment_months:
              type: [integer, 'null']
            commitment_end:
              type: [string, 'null']
              format: date-time
            cancel_requested_within_commitment:
              type: boolean
            eligibility_state:
              type: [string, 'null']
              enum: [OK, LAPSED, null]
            list_price:
              type: [object, 'null']
            features:
              type: array
              items:
                type: object
            export_access_until:
              type: [string, 'null']
              format: date-time
        allowance:
          type: object
          description: >
            Subscribed allowance status (limit — null when unlimited, unlimited, used, remaining — null when unlimited,
            period_start, period_end, threshold, and — only when the plan has a day window, e.g. Free Personal — daily)
            or { subscribed false, state }.
          properties:
            daily:
              type: object
              description: Personal Free v1.1 §4 — the day window (any 24 hours) on top of the monthly allowance. Absent for plans without one.
              required: [window, limit, used, remaining, next_available_at]
              properties:
                window:
                  type: string
                  enum: [DAY]
                limit:
                  type: integer
                used:
                  type: integer
                remaining:
                  type: integer
                next_available_at:
                  type: [string, 'null']
                  format: date-time
                  description: When the oldest counted send leaves the window (null while under the cap).
        storage:
          type: [object, 'null']
          description: Storage used against the plan (capacity_key, limit — null when not limited, unlimited, used); null without a subscription.
        billing_available:
          type: boolean
        tenant_kind:
          type: string
          enum: [BUSINESS, PERSONAL]
        self_service_eligible:
          type: boolean
        can_manage_billing:
          type: boolean
        managed_by:
          type: [string, 'null']
          enum: [STRIPE, APP_STORE, GOOGLE_PLAY, null]
          description: M-A12 W1-G item 5 — where the open self-service plan is billed (null without one).
        store_purchase_eligible:
          type: boolean
          description: M-A12 A1-2 — the caller may buy a plan in the app now.
        store_purchase_block_reason:
          type: [string, 'null']
          enum: [store_billing_disabled, not_billing_manager, store_purchase_seats_unsupported, billing_managed_elsewhere, null]
        manage_url:
          type: [string, 'null']
          description: The store subscription-management page (App Store / Google Play) or the web billing page (Stripe); null without a self-service plan.
    SelfServiceActionState:
      type: object
      additionalProperties: false
      required: [available, reason]
      properties:
        available:
          type: boolean
        reason:
          type: [string, 'null']
          enum: [PRODUCT_NOT_SELF_SERVICE, SELF_SERVICE_TERMS_NOT_APPROVED, GOVERNED_SUBSCRIPTION_OPEN, ACTIVATION_PENDING, CONVERSION_IN_PROGRESS, NO_SELF_SERVICE_SUBSCRIPTION, PROVIDER_CHANGE_PENDING, ALREADY_CANCELING, PLAN_NOT_AVAILABLE, FINANCIAL_TREATMENT_UNDEFINED, null]
    BillingUsage:
