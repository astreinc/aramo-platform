                  download_url:
                    type: string
                    description: The signed-copy link (holds an access token - keep it in memory only; never persist or log it).
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A signed copy is available once everyone has signed (ENVELOPE_ILLEGAL_TRANSITION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/inbox/{id}/report:
    post:
      operationId: reportFromInbox
      summary: 'Report this envelope from the recipient inbox (the app''s received-envelope view).'
      description: >
        Aramo-Sign-Mobile-Amendment-M-A7 §5.2 (R-11). Session (esign consumer) only; no Sign scope required; keyed by the
        signed-in user's own inbox item, so no signing token travels. The same report flow as "Report this email"
        (POST /v1/sign/report): one report per recipient per envelope (409 details.reason already_reported); a Business
        sender's report is recorded for Aramo operators and never pauses the sender; a Personal sender's report follows the
        Personal automatic pause rules. Bounded per user; over the budget the answer is the same 202 and nothing is recorded.
      tags: [inbox]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: [string, 'null']
                  enum: [phishing, impersonation, spam, unknown_sender, other, null]
                note:
                  type: [string, 'null']
                  maxLength: 1000
      responses:
        '202':
          description: The report was received.
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received:
                    type: boolean
                    enum: [true]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: This recipient already reported this envelope (details.reason = already_reported).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/inbox/{id}:
    delete:
      operationId: removeFromInbox
      summary: 'Remove the binding (the user’s own only).'
      description: Session (esign consumer) only; no Sign scope required; every read is keyed by the signed-in user.
      tags: [inbox]
      security:
