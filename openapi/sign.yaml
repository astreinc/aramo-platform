    post:
      operationId: previewSenderTemplate
      summary: Organization-branded preview of a template with the sender's values (DOC-TEMPLATE-LIB-1 T-5).
      description: >
        Requires document_template:read; refused while sign.templates is not available. Writes nothing.
      tags: [sender]
      security:
