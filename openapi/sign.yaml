      summary: Suggested signature and date boxes for a document (M-A14 R-3, "Auto suggest fields").
      description: >
        Aramo Sign Mobile M-A14 R-3 / §2. Deterministic, no model: the server reads the document's existing text layer (the
        text-layer route's extraction and cache) and proposes SIGNATURE and SIGN_DATE boxes on or after signature and date
        labels ("Signature", "Signed", "Signed by", "Sign here", "Date", "Dated", "Date signed"; whole words, any case; on
        the underline that follows or sits above the label when there is one). Only pages that hold a signature suggestion,
        the last such pages first; overlaps removed; at most 6. Boxes use the PUT fields frame (SenderFieldInput):
        page_number 0-based, PDF points, origin bottom-left, (x, y) the lower-left corner, inside the page's MediaBox;
        `page` is the same page 1-based. A rotated page gets none. Requires sign:envelope:read and the same visibility as
        the source route (another tenant's envelope, an envelope the caller may not see, or a document not in the envelope
        is 404); after that, any failure is 200 with an empty list. No document text leaves the platform or is logged.
