  /v1/sign/sender/envelopes/{id}/remind:
    post:
      operationId: remindSenderEnvelope
      summary: Send a reminder to one signer, or to every signer who may sign now.
      description: >
        Same envelope; prior links are revoked and a fresh link is emailed. With signer_id, only that signer; without, every
        unsigned signer who may sign now (when signing in order, only the signer whose turn it is). Requires sign:envelope:send.
        Sign Mobile M-A3 §7 — at least 60 minutes between reminders to the same signer and at most 5 reminders per envelope in any
        rolling 24 hours, web and mobile alike, enforced atomically under the envelope row lock (429 reminder_cooldown |
        reminder_daily_limit, with retry_after_seconds and retry_at). Without signer_id, signers still in their cooldown are skipped.
        With an Idempotency-Key a replay returns the first response and does not count again.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                signer_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: OK.
          content:
