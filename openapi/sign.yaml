                type: string
                enum: [sign.terms_of_service, sign.personal_terms_of_service, aramo.privacy_notice, aramo.acceptable_use_policy]
              version:
                type: string
              url:
                type: string
                format: uri
                description: The published text on the Sign host (https://sign.aramo.ai/legal/<slug>/<version>).
              title:
                type: string
    SignLegalNotices:
      type: object
      required: [notices]
      properties:
        notices:
          type: array
          description: Upcoming legal-document versions (future effective date) this user has not dismissed.
          items:
            type: object
            required: [key, title, version, effective_date, url, current_version, current_url]
            properties:
              key:
                type: string
              title:
                type: string
              version:
                type: string
              effective_date:
                type: string
                format: date
                description: The first day the new version applies.
              url:
                type: string
                format: uri
                description: The new version on the Sign host (https://sign.aramo.ai/legal/<slug>/<version>).
              current_version:
                type: string
              current_url:
                type: string
                format: uri
    SignAccountStatus:
      type: object
      required: [closable, closed, closed_at]
      properties:
        closable:
          type: boolean
          description: True only for the owner of an open PERSONAL account.
        closed:
          type: boolean
        closed_at:
          type: [string, 'null']
          format: date-time
    SignPrivacyRequest:
      type: object
      description: Aramo-Sign-Mobile-Amendment-M-A7 §3.1 — a privacy request as its requester sees it.
      required: [reference, request_type, subject_kind, channel, status, status_label, referred_to_organization, due_at, created_at, updated_at, completed_at, outcome_code, outcome_text, retained, organization_decides, privacy_contact]
      properties:
        reference:
          type: string
          example: PR-7K3M-9QX2-H4TD
        request_type:
          type: string
          enum: [DELETION, ACCESS, EXPORT, CORRECTION]
        subject_kind:
          type: string
          enum: [ACCOUNT_HOLDER, BUSINESS_MEMBER, GUEST_SIGNER, FORMER_USER, AUTHORIZED_REPRESENTATIVE]
        channel:
          type: string
          enum: [IN_APP, WEB, OPERATOR]
        status:
          type: string
          enum: [RECEIVED, IDENTITY_VALIDATED, DATA_INVENTORY, REFERRED_TO_ORGANIZATION, EXECUTING, COMPLETED, DENIED_WITH_REASON, CANCELLED]
        status_label:
          type: string
        referred_to_organization:
          type: boolean
        due_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        outcome_code:
          type: [string, 'null']
        outcome_text:
          type: [string, 'null']
        retained:
          type: array
          description: What is kept, and why (DELETION only).
          items:
            type: object
            required: [key, label, why]
            properties:
              key:
                type: string
              label:
                type: string
              why:
                type: string
        organization_decides:
          type: [string, 'null']
        privacy_contact:
          type: string
    SignAccountClosed:
      type: object
      required: [state, closed_at]
      properties:
        state:
          type: string
          enum: [closed]
        closed_at:
          type: string
          format: date-time
    SenderContext:
      type: object
      required: [user, tenant, workspace, permissions, can_send, personal_sending_enabled]
      properties:
        user:
          type: object
          required: [id, email, display_name, identity_provider]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: [string, 'null']
            display_name:
              type: [string, 'null']
            identity_provider:
              type: [string, 'null']
              enum: [google, microsoft, null]
              description: >-
                Sign Mobile B-11 — the federated provider the user signs in with ("Signed in with Google/Microsoft"), from the
                provider recorded on the user's sign-in link (or the enforced pin of the tenant for a link made before
                providers were recorded). null when not known; never a guess.
        tenant:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            kind:
              type: string
              enum: [BUSINESS, PERSONAL]
        workspace:
          type: string
          enum: [sign, personal]
        permissions:
          type: object
          description: >
            The caller's effective Sign permissions (Sign permission contract). read_all, manage_all, members and billing are false for a PERSONAL account.
          properties:
            read:
              type: boolean
            read_all:
              type: boolean
            create:
              type: boolean
            send:
              type: boolean
            manage_all:
              type: boolean
            contacts:
              type: boolean
            members:
              type: boolean
            billing:
              type: boolean
            templates:
              type: boolean
              description: DOC-TEMPLATE-LIB-1 T-5 — the session holds document_template:read (start envelopes from templates).
            reports:
              type: boolean
              description: Feature-Parity §1.13 — the session holds sign:report:read in a BUSINESS tenant (organization reports).
        features:
          type: object
          description: >
            DOC-TEMPLATE-LIB-1 T-5 — plan capabilities by launch availability. templates = the sign.templates capability is available; while false every template route answers ESIGN_FEATURE_NOT_AVAILABLE (403).
          properties:
            templates:
              type: boolean
            in_person_signing:
              type: boolean
              description: Aramo-Sign-Unified-Product-Amendment-M-A5 §3.7 — the sign.in_person_signing capability (hosted signing) is available.
            reports:
              type: boolean
              description: Feature-Parity §1.13 — the sign.reports capability is available for this BUSINESS tenant (always false for PERSONAL); while false every reports route answers ESIGN_FEATURE_NOT_AVAILABLE (403).
            custom_roles:
              type: boolean
              description: Sign Feature-Parity §1.21 — the sign.custom_roles capability is available (launch availability) and the tenant is an organization. The plan entitlement is checked by every custom-role route.
            witness_signing:
              type: boolean
              description: Feature-Parity §1.17 — sign.witness_signing is available and the tenant is a BUSINESS tenant (B+ plans).
            delegate_signing:
              type: boolean
              description: Feature-Parity §1.17 — sign.delegate_signing is available and the tenant is a BUSINESS tenant (B+ plans).
            access_code:
              type: boolean
              description: Feature-Parity §1.9 — sign.access_code (per-recipient access code, every plan) is available.
            sms_delivery:
              type: boolean
              description: Consolidated Directive v1.0 B2 — sign.sms_delivery is available (the signing link also goes by SMS; launch availability only, no plan rule).
            whatsapp_delivery:
              type: boolean
              description: Consolidated Directive v1.0 B2 — sign.whatsapp_delivery is available (the signing link also goes by WhatsApp; launch availability only, no plan rule).
            sms_otp:
              type: boolean
              description: Consolidated Directive v1.0 B2 — sign.sms_otp is available (the recipient enters an SMS code before acting; launch availability only, no plan rule).
            id_verification:
              type: boolean
              description: Consolidated Directive v1.0 B2 — sign.id_verification is available and the tenant is a BUSINESS tenant (government-ID check per recipient).
            kba:
              type: boolean
              description: Consolidated Directive v1.0 B2 — sign.kba is available and the tenant is a BUSINESS tenant (knowledge-based questions per recipient).
            payments:
              type: boolean
              description: >-
                Sign 1.14 — payment collection is available: sign.payments is available, Stripe Connect is
                configured and the plan is Standard Professional or Enterprise.
            qes:
              type: boolean
              description: Feature-Parity §1.16 (Amendment A1) — the sign.qes capability (signing through a QTSP) is available. False until the PO authorizes it.
            india_estamp:
              type: boolean
              description: Feature-Parity §1.19 (Amendment A1) — the sign.india_estamp capability is available. False until the PO authorizes it.
        can_send:
          type: boolean
        personal_sending_enabled:
          type: boolean
          description: True only for a bound (ACTIVE) PERSONAL tenant while Personal sending is switched on (SIGN_PERSONAL_SIGNUP_MODE not off).
        organization_url:
          type: [string, 'null']
        app_home_url:
          type: [string, 'null']
        org_admin:
          type: boolean
          description: >-
            ORG-UX-1 (LOCKED §4.3/§6) — the caller holds an organization role (tenant_owner or
            tenant_admin) in this BUSINESS tenant. Role-based; navigation only.
        organization_roles_url:
          type: [string, 'null']
          description: ORG-UX-1 §6 — Organization → Users & product access (the single role-assignment surface), or null.
        personal_account_owner:
          type: boolean
          description: >-
            Aramo-Sign-Mobile-Amendment-M-A8 §2.1 — true only for the tenant_owner of a PERSONAL
            tenant, who may delete their own account. Every other subject is a Business user:
            the organization manages the account; privacy requests stay available.
        template_plan:
          type: [string, 'null']
          enum: [INCLUDED, FREE_PLAN, SUBSCRIPTION_INACTIVE, NOT_SUBSCRIBED, null]
          description: >-
            TEMPLATE-PRODUCT-1 §8.1 — the plan side of templates (Catalog v2 P-6: FREE_PLAN never
            has templates; the app shows an upgrade prompt). null while sign.templates is not
            available or the session cannot read templates.
        template_studio:
          type: boolean
          description: TEMPLATE-PRODUCT-1 §8.2 — a PERSONAL account's own template Studio in Aramo Sign (the owner holds author + approve). Always false for BUSINESS (Org Home).
        template_use_as_is:
          type: boolean
          description: TEMPLATE-PRODUCT-1 §8.5 — "Use as it is" is offered (the person holds document_template:manage and the plan includes templates).
        word_conversion_enabled:
          type: boolean
          description: >-
            Aramo-Sign-Mobile-Amendment-M-A13 R-4 — the sender document upload accepts Word files
            (.docx, .doc), converted to PDF on the server. False unless SIGN_WORD_CONVERSION_ENABLED=1
            and a converter is configured; the apps offer Word files only when true.
    SenderTemplateGallery:
      type: object
      description: TEMPLATE-PRODUCT-1 §8.5 — the Aramo templates for Aramo Sign (live defaults tagged sign).
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [template_id, name, description, document_type, products, version_id, version_number, updated_at, adopted_template_id]
            properties:
              template_id:
                type: string
                format: uuid
              name:
                type: string
              description:
                type: [string, 'null']
              document_type:
                type: object
                required: [id, name]
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: [string, 'null']
              products:
                type: array
                items:
                  type: string
                  enum: [ats, sign]
              version_id:
                type: string
                format: uuid
              version_number:
                type: [integer, 'null']
              updated_at:
                type: string
                format: date-time
              adopted_template_id:
                type: [string, 'null']
                format: uuid
                description: The account's own copy of this template, or null while it is not adopted.
    SenderTemplateAdopted:
      type: object
      description: TEMPLATE-PRODUCT-1 §8.3 / §8.5 — an adopted copy (Documents-owned) and its version.
      required: [template, version]
      properties:
        template:
          type: object
          required: [id, status]
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [DRAFT, ACTIVE, RETIRED]
            current_version_id:
              type: [string, 'null']
              format: uuid
        version:
          type: object
          required: [id, status]
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [DRAFT, ACTIVE, RETIRED]
    SenderTemplateRole:
      type: object
      description: Amendment M-A6 §3.2 — a template signing role. SIGNER roles sign; CC roles receive a copy.
      required: [role_key, label, kind, order]
      properties:
        role_key:
          type: string
        label:
          type: string
        kind:
          type: string
          enum: [SIGNER, CC]
        order:
          type: integer
          minimum: 1
    SenderTemplateSigning:
      type: object
      required: [roles, routing_mode]
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/SenderTemplateRole'
        routing_mode:
          type: string
          enum: [PARALLEL, SEQUENTIAL]
        default_subject:
          type: string
        default_message:
          type: string
    SignerTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    QesSignatureView:
      type: object
      description: >-
        Feature-Parity §1.16 (Amendment A1) — one signer's qualified electronic signature through a Qualified Trust
        Service Provider. Aramo is not a QTSP; the certificate and signature are the QTSP's evidence.
      required: [signer_id, signature_level, state]
      properties:
        signer_id:
          type: string
          format: uuid
        signature_level:
          type: string
          enum: [QES]
        state:
          type: string
          enum: [REQUIRED, IDENTITY_PROOFING_PENDING, AUTHORIZED, SIGNED, FAILED]
        provider:
          type: [string, 'null']
        certificate:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                subject:
                  type: string
                issuer:
                  type: string
                serial_number:
                  type: string
                valid_from:
                  type: string
                  format: date-time
                valid_to:
                  type: string
                  format: date-time
                fingerprint_sha256:
                  type: string
        certificate_chain_sha256:
          type: [string, 'null']
        signature_sha256:
          type: [string, 'null']
        qtsp_reference:
          type: [string, 'null']
        failure_reason:
          type: [string, 'null']
        identity_started_at:
          type: [string, 'null']
          format: date-time
        authorized_at:
          type: [string, 'null']
          format: date-time
        signed_at:
          type: [string, 'null']
          format: date-time
    QesStepResult:
      type: object
      required: [state, redirect_url]
      properties:
        state:
          type: string
          enum: [REQUIRED, IDENTITY_PROOFING_PENDING, AUTHORIZED, SIGNED, FAILED]
        redirect_url:
          type: [string, 'null']
          description: The QTSP page to send the signer to next; null when the flow is finished.
    EstampRequest:
      type: object
      description: Feature-Parity §1.19 (Amendment A1) — Indian e-stamp paper for the envelope. Amounts are paise (INR × 100).
      required: [state_code, article_code, stamp_duty_amount_paise, first_party, second_party, purchaser]
      properties:
        state_code:
          type: string
          pattern: '^IN-[A-Z]{2}$'
          description: ISO 3166-2:IN code of the stamping state, e.g. IN-KA.
        article_code:
          type: string
          maxLength: 120
          description: The article of that state's stamp act, as the aggregator names it.
        stamp_duty_amount_paise:
          type: integer
          minimum: 1
        consideration_amount_paise:
          type: [integer, 'null']
          minimum: 0
        first_party:
          type: string
          maxLength: 200
        second_party:
          type: string
          maxLength: 200
        purchaser:
          type: string
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 500
    EstampOrderView:
      type: object
      required: [id, state, provider, state_code, article_code, stamp_duty_amount_paise, currency, first_party, second_party, purchaser, created_at]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [REQUESTED, ORDERED, ISSUED, ATTACHED, FAILED]
        provider:
          type: string
        provider_order_ref:
          type: [string, 'null']
        state_code:
          type: string
        article_code:
          type: string
        stamp_duty_amount_paise:
          type: integer
        consideration_amount_paise:
          type: [integer, 'null']
        currency:
          type: string
          enum: [INR]
        first_party:
          type: string
        second_party:
          type: string
        purchaser:
          type: string
        description:
          type: [string, 'null']
        certificate_number:
          type: [string, 'null']
        certificate_issued_at:
          type: [string, 'null']
          format: date-time
        certificate_sha256:
          type: [string, 'null']
        attached_document_id:
          type: [string, 'null']
          format: uuid
        failure_reason:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        ordered_at:
          type: [string, 'null']
          format: date-time
        attached_at:
          type: [string, 'null']
          format: date-time
    EstampOrderResponse:
      type: object
      required: [order]
      properties:
        order:
          oneOf:
            - $ref: '#/components/schemas/EstampOrderView'
            - type: 'null'
    SenderTemplateRoleBinding:
      type: object
      required: [role_key, name, email]
      properties:
        role_key:
          type: string
          maxLength: 40
        name:
          type: string
          maxLength: 200
        email:
          type: string
          maxLength: 254
    SenderTemplateSignatureField:
      type: object
      required: [field_type, page_number, x, y, width, height]
      properties:
        field_type:
          type: string
          enum: [SIGNATURE, SIGNER_NAME, SIGN_DATE]
        role_key:
          type: string
          description: The SIGNER role of the block (templates with signing roles only).
        page_number:
          type: integer
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
    SenderTemplateVariable:
      type: object
      required: [key, label, group, source, value]
      properties:
        key:
          type: string
        label:
          type: string
        group:
          type: string
        source:
          type: string
          enum: [ORGANIZATION, SENDER]
        value:
          type: [string, 'null']
    SenderTemplateList:
      type: object
      required: [items, unavailable]
      properties:
        items:
          type: array
          items:
            type: object
            required:
              [template_id, name, description, document_type, owner_scope, resolution, is_default, version_id, version_number, updated_at, variables, category, signer_role_count, cc_role_count, document_count, routing_mode, signing]
            properties:
              template_id:
                type: string
                format: uuid
              favorite:
                type: boolean
                description: Aramo Sign Mobile M-A12 W1-F — the signed-in user marked this template a favorite.
              ownership:
                type: string
                enum: [mine, shared]
                description: >-
                  Aramo Sign Mobile M-A12 W1-F — from owner_scope - TENANT (the organization's or account's own template) is
                  mine, PLATFORM (an Aramo default shared with every account) is shared.
              name:
                type: string
              description:
                type: [string, 'null']
              document_type:
                type: object
                required: [id, key, name]
                properties:
                  id:
                    type: string
                    format: uuid
                  key:
                    type: string
                  name:
                    type: string
              owner_scope:
                type: string
                enum: [PLATFORM, TENANT]
              resolution:
                type: string
                enum: [CLIENT_SELECTION, TENANT_SELECTION, PLATFORM_DEFAULT, WITHDRAWAL_FALLBACK, AVAILABLE]
              is_default:
                type: boolean
                description: The template the automatic per-type resolution picks (M-A6 §3.1).
              version_id:
                type: string
                format: uuid
              version_number:
                type: integer
              updated_at:
                type: string
                format: date-time
              variables:
                type: array
                items:
                  $ref: '#/components/schemas/SenderTemplateVariable'
              category:
                type: string
                description: The document type's name (M-A6 §3.7).
              signer_role_count:
                type: integer
              cc_role_count:
                type: integer
              document_count:
                type: integer
              routing_mode:
                type: string
                enum: [PARALLEL, SEQUENTIAL]
              signing:
                oneOf:
                  - $ref: '#/components/schemas/SenderTemplateSigning'
                  - type: 'null'
        unavailable:
          type: array
          items:
            type: object
            required: [document_type_id, reason]
            properties:
              document_type_id:
                type: string
                format: uuid
              reason:
                type: string
    SignTokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: [client_credentials, 'urn:ietf:params:oauth:grant-type:token-exchange', 'urn:aramo:params:oauth:grant-type:sign-event']
        client_id:
          type: string
        client_secret:
          type: string
        scope:
          type: string
          description: Space-separated subset of the effective permissions.
        subject_token:
          type: string
          description: token-exchange only — the user's Aramo access token.
        subject_token_type:
          type: string
          enum: ['urn:ietf:params:oauth:token-type:access_token']
        external_role:
          type: string
          description: client_credentials only — honoured only if the installation may assert it and a mapping exists.
        external_actor:
          type: string
          description: client_credentials only — the platform's own actor reference, recorded for audit.
        event_id:
          type: string
          format: uuid
          description: >
            sign-event only (Addendum S6) — the id of a completion event Sign delivered to the AUTHENTICATED
            application's subscription. Yields a read grant (≤ 5 minutes) for that event's envelope's executed
            documents and evidence only; tenant and envelope come from Sign's records, never from the caller.
    SignTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope, tenant_id, installation_id, mode]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
        scope:
          type: string
        tenant_id:
          type: string
          format: uuid
        installation_id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [USER, APPLICATION]
        envelope_id:
          type: string
          format: uuid
          description: Set on an event-bound grant — the only envelope it can read.
    SignAvailability:
      type: object
      required: [available, reason, allowance]
      properties:
        available:
          type: boolean
        reason:
          type: [string, 'null']
          enum: [NOT_SUBSCRIBED, LIMIT_REACHED, null]
        allowance:
          type: [object, 'null']
    SignApiCreateEnvelope:
      type: object
      required: [subject, documents, signers]
      properties:
        subject:
          type: string
        documents:
          type: array
          items:
            type: object
            description: Either content_base64 (+ title, filename) or, for Aramo applications, document_ref + document_revision_ref + source_sha256.
        signers:
          type: array
          minItems: 1
          maxItems: 10
          description: Distinct emails; signing_order values 1 to N with no gaps or repeats (list position when omitted).
          items:
            type: object
            required: [name, email]
            properties:
              name:
                type: string
              email:
                type: string
              signing_order:
                type: integer
                minimum: 1
        routing_mode:
          type: string
          enum: [PARALLEL, SEQUENTIAL]
          description: PARALLEL (default) - every signer may sign at once. SEQUENTIAL - only the signer whose turn it is may act; the next is invited when they sign.
        fields:
          type: array
          items:
            type: object
        send:
          type: boolean
    SenderEnvelopeList:
      type: object
      required: [items, counts]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SenderEnvelopeListItem'
        counts:
          $ref: '#/components/schemas/SenderEnvelopeCounts'
    SenderEnvelopeListItem:
      type: object
      required: [id, subject, status, created_at, sent_at, completed_at, last_activity_at, document_count, source_application, recipients, awaiting_you]
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: string
        status:
          $ref: '#/components/schemas/SenderEnvelopeStatus'
        created_at:
          type: string
          format: date-time
        sent_at:
          type: [string, 'null']
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        last_activity_at:
          type: [string, 'null']
          format: date-time
          description: The latest ledger event, or the last update when there is none.
        document_count:
          type: integer
          minimum: 0
        source_application:
          type: string
          description: Where the envelope came from (aramo-sign, aramo-ats or a registered application); only aramo-sign envelopes are editable here.
        recipients:
          type: array
          items:
            type: object
            required: [id, name, email, status, recipient_kind]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              email:
                type: [string, 'null']
                description: Null only for an in-person signer without an email (M-A5 §3.5).
              status:
                $ref: '#/components/schemas/SenderRecipientStatus'
              recipient_kind:
                $ref: '#/components/schemas/SenderRecipientKind'
        awaiting_you:
          type: boolean
          description: >-
            Aramo Sign W2 - true when the only recipient steps that can act now belong to the signed-in user (assigned to them, or
            addressed to their verified current account email on an envelope sent at or after that proof). Shown as "Waiting
            for you", with a Sign action through the inbox.
        my_inbox_item_id:
          type: [string, 'null']
          description: >-
            Aramo Sign W2 - present (non-null) only when awaiting_you is true and the signed-in user has an inbox item for that
            step - the binding id when bound, otherwise a fresh discovered-item handle issued to this same user (the same
            verified current email rule; valid 30 minutes; refused for any other user). Use it with POST
            /v1/sign/inbox/{id}/sign. Null or absent otherwise.
        mode:
          $ref: '#/components/schemas/SenderEnvelopeMode'
        can_self_sign_now:
          type: boolean
          description: >-
            Aramo Sign Mobile M-A12 W1-A.4 — true when the caller may open a self-sign session on this envelope now (a signing
            recipient bound to them, still to sign, their turn, an Aramo Sign envelope they may act on, and sign:envelope:send).
            Drives "Sign now"; POST /v1/sign/sender/envelopes/{id}/self-sign-session re-checks everything, including the
            verified email.
    SenderEnvelopeCounts:
      type: object
      description: >-
        Envelopes the caller may see, by status, over every tab (the same visibility as the list). A status with no envelope
        is absent (read it as 0).
      properties:
        DRAFT: { type: integer, minimum: 0 }
        SENT: { type: integer, minimum: 0 }
        IN_PROGRESS: { type: integer, minimum: 0 }
        COMPLETED: { type: integer, minimum: 0 }
        DECLINED: { type: integer, minimum: 0 }
        VOIDED: { type: integer, minimum: 0 }
        EXPIRED: { type: integer, minimum: 0 }
      additionalProperties:
        type: integer
        minimum: 0
    SenderEnvelopeStatus:
      type: string
      enum: [DRAFT, SENT, IN_PROGRESS, COMPLETED, DECLINED, VOIDED, EXPIRED]
    SenderRecipientStatus:
      type: string
      enum: [PENDING, VIEWED, SIGNED, DECLINED]
    SenderRecipientKind:
      type: string
      enum: [SIGNER, IN_PERSON_SIGNER, RECEIVES_COPY, WITNESS]
      description: >-
        Aramo-Sign-Unified-Product-Amendment-M-A5 §1 — SIGNER signs through an emailed link; IN_PERSON_SIGNER signs on the
        host's device (hosted session); RECEIVES_COPY never signs (no fields, no session, no turn, never reminded, never blocks
        completion). Feature-Parity §1.17 — WITNESS signs (attests) through an emailed link for one other signer, only after
        that signer has signed.
    SenderCopyDelivery:
      type: string
      enum: [ON_SEND, ON_COMPLETION, BOTH]
      description: M-A5 §2.1 — when a copy recipient receives their copy.
    SenderIssuedSigningSession:
      type: object
      description: >-
        M-A5 §3.2 / §4.2 — a hosted or self-sign session. The token is a signing capability for the guest signing routes
        (/v1/sign/signing/*); it is returned only to the authenticated caller and must never be logged or shared.
      required: [session_origin, signer_id, token, expires_at]
      properties:
        session_origin:
          type: string
          enum: [HOSTED, SELF]
        signer_id:
          type: string
          format: uuid
        token:
          type: string
        expires_at:
          type: string
          format: date-time
    SenderPageSize:
      type: object
      description: >-
        One page of a source PDF in PDF points - the page's MediaBox, the frame field geometry is placed and validated in
        (origin bottom-left). Pages are 0-based by position (pages[page_number]).
      required: [width, height]
      properties:
        width:
          type: number
          exclusiveMinimum: 0
        height:
          type: number
          exclusiveMinimum: 0
    SenderEnvelopeDocument:
      type: object
      required: [id, title, ordinal, content_type, byte_size, source_sha256, field_count, page_count, pages]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        ordinal:
          type: integer
          minimum: 0
        content_type:
          type: [string, 'null']
        byte_size:
          type: [integer, 'null']
        source_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        field_count:
          type: integer
          minimum: 0
        page_count:
          type: [integer, 'null']
          minimum: 1
          description: Sign Mobile D-W6-2 — the number of pages; null only when the source could not be read.
        pages:
          type: [array, 'null']
          description: >-
            Sign Mobile D-W6-2 — each page's size (computed from the source at upload; measured on first read for older
            documents). null only when the source could not be read.
          items:
            $ref: '#/components/schemas/SenderPageSize'
    SenderEnvelopeRecipient:
      type: object
      required: [id, name, email, status, signing_order, recipient_kind, copy_delivery, assigned_to_me, viewed_at, signed_at, declined_at, decline_reason, can_remind, reminder_available_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: [string, 'null']
          description: Null only for an in-person signer without an email (M-A5 §3.5).
        recipient_kind:
          $ref: '#/components/schemas/SenderRecipientKind'
        copy_delivery:
          oneOf:
            - $ref: '#/components/schemas/SenderCopyDelivery'
            - type: 'null'
          description: M-A5 §2.1 — set only for RECEIVES_COPY.
        assigned_to_me:
          type: boolean
          description: M-A5 §4.1 — this recipient is bound to the caller (Assign to me). The bound user id itself is never returned.
        status:
          $ref: '#/components/schemas/SenderRecipientStatus'
        signing_order:
          type: integer
          minimum: 1
          description: The position in the signing order (used when the envelope signs in order).
        viewed_at:
          type: [string, 'null']
          format: date-time
        signed_at:
          type: [string, 'null']
          format: date-time
        declined_at:
          type: [string, 'null']
          format: date-time
        decline_reason:
          type: [string, 'null']
        can_remind:
          type: boolean
          description: An unsigned signer who may sign now (in an open envelope). Never a copy recipient or an in-person signer (M-A5).
        reminder_available_at:
          type: [string, 'null']
          format: date-time
          description: Sign Mobile M-A3 §7 — when a reminder to this signer is next allowed; null when allowed now or not remindable.
        witness_for_signer_id:
          type: [string, 'null']
          format: uuid
          description: Feature-Parity §1.17 — for a WITNESS, the recipient it attests for; null otherwise.
        access_code_set:
          type: boolean
          description: Feature-Parity §1.9 — an access code is set for this recipient (the code itself is never returned).
        access_code_locked:
          type: boolean
          description: Feature-Parity §1.9 — the recipient is locked out after too many wrong access codes.
        delegated_from:
          type: [object, 'null']
          description: Feature-Parity §1.17 — the original recipient when this signature was delegated (the row now names the delegate).
          required: [name, email, delegated_at]
          properties:
            name:
              type: [string, 'null']
            email:
              type: [string, 'null']
            delegated_at:
              type: string
              format: date-time
        role_key:
          type: [string, 'null']
          description: Amendment M-A6 §3.5 — the template role this recipient was bound to (an envelope started from a template with roles); null otherwise.
        identity_verification_method:
          type: [string, 'null']
          enum: [ID_VERIFICATION, KBA, null]
          description: >-
            Aramo-Sign-Feature-Parity-Program-Directive-v1_0-LOCKED §1.9 — the identity check the sender requires before
            this recipient sees the envelope (government ID or knowledge-based questions); null when none.
        identity_verification_locked:
          type: boolean
          description: §1.9 — true when identity verification locked this recipient out (a document in another name, or every attempt used).
    SignerIdentityVerificationStatus:
      type: object
      description: >-
        Aramo-Sign-Feature-Parity-Program-Directive-v1_0-LOCKED §1.9 — the recipient's identity-verification state.
        Outcome only: no document data, image or verified name is ever returned or stored (R-5).
      required: [method, state, attempts_remaining, last_failure]
      properties:
        method:
          type: [string, 'null']
          enum: [ID_VERIFICATION, KBA, null]
        state:
          type: string
          enum: [NOT_REQUIRED, REQUIRED, PENDING, VERIFIED, LOCKED]
        attempts_remaining:
          type: [integer, 'null']
          minimum: 0
        last_failure:
          type: [string, 'null']
          description: The last attempt's failure reason (for example name_mismatch or document_expired).
    SenderExecutedDocuments:
      type: object
      required: [envelope_id, documents, certificate]
      properties:
        envelope_id:
          type: string
          format: uuid
        documents:
          type: array
          items:
            type: object
            required: [envelope_document_id, title, executed_sha256, byte_size, executed_base64]
            properties:
              envelope_document_id:
                type: string
                format: uuid
              title:
                type: string
              executed_sha256:
                type: string
                pattern: '^[0-9a-f]{64}$'
              byte_size:
                type: integer
              executed_base64:
                type: string
                description: The executed PDF, base64.
        certificate:
          type: [object, 'null']
          required: [certificate_sha256, byte_size, certificate_base64]
          properties:
            certificate_sha256:
              type: string
              pattern: '^[0-9a-f]{64}$'
            byte_size:
              type: integer
            certificate_base64:
              type: string
              description: The certificate of completion (PDF), base64.
    RecipientInbox:
      type: object
      description: >-
        The signed-in user's bound and discovered documents, split by what they can do now. Aramo Sign W2 - discovered items
        are recipient rows addressed to the user's current account email, listed without a binding when the user holds a
        verified federated link for that email recorded no later than the envelope was sent. A recipient reachable through a
        binding is listed once, as bound.
      required: [waiting, completed, other]
      properties:
        waiting:
          type: array
          description: Documents the user can sign now (can_sign), and upcoming ones (my_status upcoming, can_sign false) whose turn is later.
          items:
            $ref: '#/components/schemas/RecipientInboxItem'
        completed:
          type: array
          description: Completed documents the user signed (can_download).
          items:
            $ref: '#/components/schemas/RecipientInboxItem'
        other:
          type: array
          description: Everything else (declined, voided, expired, or someone else's turn).
          items:
            $ref: '#/components/schemas/RecipientInboxItem'
    RecipientInboxItem:
      type: object
      description: >-
        Recipient facts only (Sign Unified Product §4.6) - never other recipients' data, sender administration or the
        activity log.
      required: [id, source, i_am_sender, subject, from, envelope_status, my_status, sent_at, expires_at, envelope_expires_at, signing_link_valid_days, completed_at, signed_at, can_sign, can_download]
      properties:
        id:
          type: string
          description: >-
            bound - the binding id (UUID; path parameter of /v1/sign/inbox/{id}/*). discovered - an opaque handle (base64url),
            accepted only by POST /v1/sign/inbox/{id}/sign, for the signed-in user only, valid 30 minutes; every list issues
            fresh handles.
        source:
          type: string
          enum: [bound, discovered]
          description: Aramo Sign W2 - bound (a recipient binding) or discovered (the user's verified current email; no binding).
        i_am_sender:
          type: boolean
          description: Aramo Sign W2 - true when the signed-in user sent this envelope.
        subject:
          type: string
        from:
          type: [string, 'null']
          description: The sending organization's name.
        envelope_status:
          $ref: '#/components/schemas/SenderEnvelopeStatus'
        my_status:
          type: string
          enum: [PENDING, VIEWED, SIGNED, DECLINED, upcoming]
          description: The recipient's status; upcoming (Aramo Sign W2) - signable later, once earlier recipients have signed (sequential order or a witness waiting for its signer). Shown under Upcoming, never as needing the user.
        sent_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
          deprecated: true
          description: Deprecated - the same value as envelope_expires_at.
        envelope_expires_at:
          type: [string, 'null']
          format: date-time
          description: Sign Mobile C-14 — when the envelope itself expires.
        signing_link_valid_days:
          type: integer
          description: Sign Mobile C-14 — the constant signing-link TTL (7 days).
        completed_at:
          type: [string, 'null']
          format: date-time
        signed_at:
          type: [string, 'null']
          format: date-time
        can_sign:
          type: boolean
          description: True only when the user may act now (turn and witness readiness), the envelope is signable and unexpired, and a live emailed link backs inbox signing.
        can_download:
          type: boolean
          description: A completed envelope the user signed, on a bound item (a discovered item's signed copy comes through the emailed link).
    SenderDraftCreated:
      type: object
      required: [id, status, subject]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        subject:
          type: string
        mode:
          $ref: '#/components/schemas/SenderEnvelopeMode'
    SenderEnvelopeMode:
      type: string
      enum: [standard, self]
      description: >-
        Aramo Sign Mobile M-A12 W1-A — standard, or self (a self-sign envelope - one recipient, the caller; no invitation;
        not counted against the sign.envelopes allowance).
    DocumentTextLayer:
      type: object
      description: >-
        Aramo Sign Mobile M-A12 W1-C.2 — a document's words for Find in document. Boxes are normalised to 0..1 of the page,
        origin top-left (x, y the top-left corner; w, h the size). An image-only page has no words; an unreadable document
        has no pages. Extracted server-side from the stored PDF, cached per document version; the text is never logged.
      required: [document_id, pages]
      properties:
        document_id:
          type: string
          format: uuid
        pages:
          type: array
          items:
            type: object
            required: [page, words]
            properties:
              page:
                type: integer
                minimum: 1
                description: 1-based page number.
              words:
                type: array
                items:
                  type: object
                  required: [t, x, y, w, h]
                  properties:
                    t: { type: string }
                    x: { type: number, minimum: 0, maximum: 1 }
                    y: { type: number, minimum: 0, maximum: 1 }
                    w: { type: number, minimum: 0, maximum: 1 }
                    h: { type: number, minimum: 0, maximum: 1 }
    DocumentFieldSuggestions:
      type: object
      description: >-
        Aramo Sign Mobile M-A14 R-3 — deterministic SIGNATURE / SIGN_DATE suggestions for one document, in the PUT fields
        frame (page_number 0-based, PDF points, origin bottom-left, (x, y) the box's lower-left corner). At most 6; empty
        when nothing was found or the document could not be read.
      required: [suggestions]
      properties:
        suggestions:
          type: array
          maxItems: 6
          items:
            type: object
            required: [type, page, page_number, x, y, width, height]
            properties:
              type:
                type: string
                enum: [SIGNATURE, SIGN_DATE]
              page:
                type: integer
                minimum: 1
                description: 1-based page number (as in the text layer).
              page_number:
                type: integer
                minimum: 0
                description: 0-based page index, exactly the PUT fields page_number.
              x: { type: number, minimum: 0 }
              y: { type: number, minimum: 0 }
              width: { type: number, exclusiveMinimum: 0 }
              height: { type: number, exclusiveMinimum: 0 }
    SignSigningStats:
      type: object
      description: >-
        Aramo Sign Mobile M-A14 R-4 — the signed-in account's own counts: envelopes it signed (self-signed in its tenant and
        received at its verified identity, as the inbox matches them) and their pages. Counts only.
      required: [documents_signed, pages_signed]
      properties:
        documents_signed: { type: integer, minimum: 0 }
        pages_signed: { type: integer, minimum: 0 }
    SignUserProfileInput:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        title: { type: [string, 'null'], maxLength: 200 }
        company: { type: [string, 'null'], maxLength: 200 }
        address_line1: { type: [string, 'null'], maxLength: 200 }
        address_line2: { type: [string, 'null'], maxLength: 200 }
        city: { type: [string, 'null'], maxLength: 200 }
        region: { type: [string, 'null'], maxLength: 200 }
        postal_code: { type: [string, 'null'], maxLength: 200 }
        country:
          type: [string, 'null']
          pattern: '^[A-Za-z]{2}$'
          description: ISO 3166-1 alpha-2 (stored upper-case).
        phone:
          type: [string, 'null']
          maxLength: 200
          description: E.164 (+ and up to 15 digits; spaces, dots, dashes and brackets are removed).
    SignUserProfile:
      description: >-
        Aramo Sign Mobile M-A12 W1-E.1 — the signed-in user's own Sign profile (stored in the sign schema, owned by the user,
        in the M-A8 deletion scope and the privacy inventory). Before the first save, display_name is the account's name and
        every optional field is null (updated_at null). email is the account email, read-only (for EMAIL field auto-fill).
      allOf:
        - $ref: '#/components/schemas/SignUserProfileInput'
        - type: object
          required: [email, updated_at]
          properties:
            email: { type: [string, 'null'], readOnly: true }
            updated_at: { type: [string, 'null'], format: date-time }
    SignUserSettings:
      type: object
      additionalProperties: false
      required: [date_format, default_field_size]
      description: >-
        Aramo Sign Mobile M-A12 W1-E.2 — date_format is stamped on envelopes the user sends and applies to SIGN_DATE;
        default_field_size is the editor's default. Defaults MM/DD/YYYY and M.
      properties:
        date_format:
          type: string
          enum: [MM/DD/YYYY, DD/MM/YYYY, YYYY-MM-DD]
        default_field_size:
          type: string
          enum: [S, M, L]
    SignAppIssueInput:
      type: object
      additionalProperties: false
      required: [message, app_version, os, os_version, device_model]
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }
        app_version: { type: string, minLength: 1, maxLength: 50 }
        os: { type: string, enum: [ios, android] }
        os_version: { type: string, minLength: 1, maxLength: 50 }
        device_model: { type: string, minLength: 1, maxLength: 100 }
        screen: { type: [string, 'null'], maxLength: 100 }
    SenderEnvelopeDetail:
      type: object
      required: [id, subject, status, documents, recipients, fields, editable]
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: string
        status:
          type: string
          enum: [DRAFT, SENT, IN_PROGRESS, COMPLETED, DECLINED, VOIDED, EXPIRED]
        created_at:
          type: string
          format: date-time
        sent_at:
          type: [string, 'null']
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        declined_at:
          type: [string, 'null']
          format: date-time
        voided_at:
          type: [string, 'null']
          format: date-time
        signing_window_days:
          type: integer
        sender:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: [string, 'null']
        source_application:
          type: string
        editable:
          type: boolean
        routing_mode:
          type: string
          enum: [PARALLEL, SEQUENTIAL]
        next_signer_id:
          type: [string, 'null']
          description: When signing in order and the envelope is open, the signer whose turn it is.
        allow_delegation:
          type: boolean
          description: Feature-Parity §1.17 — a signer may hand their signature to another person (set in DRAFT, fixed at send).
        mode:
          $ref: '#/components/schemas/SenderEnvelopeMode'
        can_self_sign_now:
          type: boolean
          description: >-
            Aramo Sign Mobile M-A12 W1-A.4 — true when the caller may open a self-sign session on this envelope now (a signing
            recipient bound to them, still to sign, their turn, an Aramo Sign envelope they may act on, and sign:envelope:send).
            Drives "Sign now"; POST /v1/sign/sender/envelopes/{id}/self-sign-session re-checks everything, including the
            verified email.
        date_format:
          type: [string, 'null']
          enum: [MM/DD/YYYY, DD/MM/YYYY, YYYY-MM-DD, null]
          description: M-A12 W1-E.2 — the SIGN_DATE format stamped at send from the sender's settings (null before send).
        revision:
          type: integer
          minimum: 1
          description: Sign Mobile M-A3 §6 — raised by every change to the envelope or its children; the ETag is "{id}.{revision}".
        message:
          type: [string, 'null']
          maxLength: 1000
          description: Sign Mobile M-A3 §3 — the sender's plain-text message (settable in DRAFT, immutable after send).
        signing_link_valid_days:
          type: integer
          description: Sign Mobile C-14 — the constant signing-link TTL (7 days).
        envelope_expires_at:
          type: [string, 'null']
          format: date-time
          description: Sign Mobile C-14 — when the envelope itself expires (default 30 days after send).
        expires_at:
          type: [string, 'null']
          format: date-time
          deprecated: true
          description: Deprecated - sent_at + the 7-day link window. Use signing_link_valid_days and envelope_expires_at.
        documents:
          type: array
          items:
            $ref: '#/components/schemas/SenderEnvelopeDocument'
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/SenderEnvelopeRecipient'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SenderEnvelopeField'
    SenderEnvelopeField:
      type: object
      description: >-
        A stored field of the envelope, as the sender detail returns it. Any of the seven engine
        types (fields from the service-to-service, Sign API and template paths keep theirs).
        PDF-native geometry - page_number 0-based, points, origin bottom-left. M-A6 §2 configuration
        is null where it does not apply. Other recipients' values are never returned.
      required: [id, envelope_document_id, signer_id, field_type, page_number, x, y, width, height, required, filled]
      properties:
        id:
          type: string
          format: uuid
        envelope_document_id:
          type: string
          format: uuid
        signer_id:
          type: [string, 'null']
          format: uuid
        field_type:
          type: string
          enum: [SIGNATURE, INITIALS, SIGN_DATE, SIGNER_NAME, TEXT, CHECKBOX, ACKNOWLEDGEMENT, PAYMENT, FIRST_NAME, LAST_NAME, EMAIL, COMPANY, TITLE]
        page_number:
          type: integer
          minimum: 0
        x:
          type: number
        y:
          type: number
        width:
          type: [number, 'null']
        height:
          type: [number, 'null']
        required:
          type: boolean
        filled:
          type: boolean
        payment_amount_minor:
          type: [integer, 'null']
          description: Sign 1.14 — PAYMENT only; the amount in cents.
        payment_currency:
          type: [string, 'null']
          enum: [USD, null]
          description: Sign 1.14 — PAYMENT only.
        name_mode:
          type: [string, 'null']
          enum: [SIGNER_PROFILE, SIGNER_ENTERED, null]
        label:
          type: [string, 'null']
        group_key:
          type: [string, 'null']
        group_rule:
          type: [string, 'null']
          enum: [SELECT_ONE, SELECT_ANY, null]
        min_selected:
          type: [integer, 'null']
          minimum: 1
    SenderFieldPassthrough:
      type: object
      description: >-
        M-A6 §2 — an engine-only field (a type a sender cannot author, e.g. ACKNOWLEDGEMENT) sent
        back unchanged on the replace-all PUT. Kept as stored only when `id` names an existing field
        of the envelope and every other property is identical to the stored row (exactly as the
        detail returned it); otherwise refused with 400 v1_field_type. Omitting it removes it.
      required: [id, envelope_document_id, signer_id, field_type, page_number, x, y, width, height]
      properties:
        id:
          type: string
          format: uuid
        envelope_document_id:
          type: string
          format: uuid
        signer_id:
          type: [string, 'null']
          format: uuid
        field_type:
          type: string
          enum: [SIGNATURE, INITIALS, SIGN_DATE, SIGNER_NAME, TEXT, CHECKBOX, ACKNOWLEDGEMENT, FIRST_NAME, LAST_NAME, EMAIL, COMPANY, TITLE]
        page_number:
          type: integer
          minimum: 0
        x:
          type: number
        y:
          type: number
        width:
          type: [number, 'null']
        height:
          type: [number, 'null']
        required:
          type: boolean
        name_mode:
          type: [string, 'null']
          enum: [SIGNER_PROFILE, SIGNER_ENTERED, null]
        label:
          type: [string, 'null']
        group_key:
          type: [string, 'null']
        group_rule:
          type: [string, 'null']
          enum: [SELECT_ONE, SELECT_ANY, null]
        min_selected:
          type: [integer, 'null']
    SenderFieldInput:
      type: object
      description: PDF-native geometry - page_number 0-based, points, origin bottom-left, (x, y) the box lower-left corner.
      required: [envelope_document_id, signer_id, field_type, page_number, x, y, width, height]
      properties:
        envelope_document_id:
          type: string
          format: uuid
        signer_id:
          type: string
          format: uuid
        field_type:
          type: string
          description: >-
            M-A6 §2.1 — the sender authoring types. ACKNOWLEDGEMENT is engine-only (the
            service-to-service and Sign API paths keep all seven engine types). Sign 1.14 — PAYMENT
            is accepted only while payments are available to the organization (403
            ESIGN_FEATURE_NOT_AVAILABLE otherwise); it is always required, one per recipient. Aramo Sign Mobile M-A12 W1-C.4 —
            FIRST_NAME, LAST_NAME, EMAIL, COMPANY and TITLE are text fields the signer fills (apps prefill them from the
            signer's own Sign profile; the signer may edit). A filled value is at most 200 characters; an EMAIL value is an
            email address (400 details.reason profile_field_value_invalid / email_field_value_invalid on fill).
          enum: [SIGNATURE, INITIALS, SIGN_DATE, TEXT, SIGNER_NAME, CHECKBOX, PAYMENT, FIRST_NAME, LAST_NAME, EMAIL, COMPANY, TITLE]
        page_number:
          type: integer
          minimum: 0
        x:
          type: number
          minimum: 0
        y:
          type: number
          minimum: 0
        width:
          type: number
          exclusiveMinimum: 0
        height:
          type: number
          exclusiveMinimum: 0
        required:
          type: boolean
        name_mode:
          type: [string, 'null']
          enum: [SIGNER_PROFILE, SIGNER_ENTERED, null]
          description: >-
            M-A6 §2.2 — SIGNER_NAME only (default SIGNER_PROFILE: the server fills the signer's
            name; SIGNER_ENTERED: the signer types it). The sender never supplies a value.
        label:
          type: [string, 'null']
          maxLength: 200
          description: M-A6 §2.3 — CHECKBOX only; the caption printed in the certificate.
        group_key:
          type: [string, 'null']
          maxLength: 64
          description: >-
            M-A6 §2.3 — CHECKBOX only; boxes sharing a key form a group, which belongs to one
            recipient and shares one rule, minimum and required setting.
        group_rule:
          type: [string, 'null']
          enum: [SELECT_ONE, SELECT_ANY, null]
          description: M-A6 §2.3 — with group_key only (default SELECT_ANY).
        min_selected:
          type: [integer, 'null']
          minimum: 1
          description: M-A6 §2.3 — with group_key only; the boxes a required group needs checked (default 1; 1 for SELECT_ONE).
        payment_amount_minor:
          type: [integer, 'null']
          minimum: 50
          maximum: 99999999
          description: Sign 1.14 — PAYMENT only (required for it); the amount in cents.
        payment_currency:
          type: [string, 'null']
          enum: [USD, null]
          description: Sign 1.14 — PAYMENT only; USD (the default and the only currency).
    SenderUploadedDocument:
      type: object
      required: [id, envelope_id, title, ordinal, byte_size, page_count, pages, revision]
      properties:
        id:
          type: string
          format: uuid
        envelope_id:
          type: string
          format: uuid
        title:
          type: string
        ordinal:
          type: integer
          minimum: 0
        byte_size:
          type: [integer, 'null']
        page_count:
          type: integer
          minimum: 1
        pages:
          type: array
          items:
            $ref: '#/components/schemas/SenderPageSize'
        revision:
          type: integer
          minimum: 1
          description: >-
            Sign Mobile D-W6-1 — the envelope revision after this upload (the response's ETag is "{envelope_id}.{revision}");
            send it as the next If-Match. A replay with the same Idempotency-Key returns the first response unchanged.
    SenderLedgerEvent:
      type: object
      required: [id, event_type, occurred_at, actor, event_hash]
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        actor:
          type: string
        event_hash:
          type: string
    # Sign Mobile M-A3 §4/§5 (W2b)
    SenderContactInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 254
        organization:
          type: [string, 'null']
          maxLength: 200
    SenderContactPatch:
      type: object
      description: At least one of name, email or organization.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 254
        organization:
          type: [string, 'null']
          maxLength: 200
    SenderContact:
      type: object
      required: [id, name, email, organization, source, created_at, updated_at, last_used_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        organization:
          type: [string, 'null']
        source:
          type: string
          enum: [saved]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, 'null']
          format: date-time
    SenderContactListItem:
      type: object
      required: [id, name, email, organization, source, envelope_count, last_used_at]
      properties:
        id:
          type: [string, 'null']
          format: uuid
          description: The saved contact id; null for a recent recipient.
        name:
          type: string
        email:
          type: string
        organization:
          type: [string, 'null']
        source:
          type: string
          enum: [saved, recent]
        envelope_count:
          type: integer
        last_used_at:
          type: [string, 'null']
          format: date-time
    SavedSignatureInput:
      type: object
      required: [kind, image_data_url]
      properties:
        kind:
          type: string
          enum: [TYPED, DRAWN]
        typed_name:
          type: string
          maxLength: 100
          description: Required for TYPED.
        font_key:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,39}$'
          description: Required for TYPED.
        image_data_url:
          type: string
          pattern: '^data:image/(png|jpeg);base64,'
          description: The rendered image - PNG or JPEG only (drawn strokes are rasterized on the device).
    SavedSignature:
      type: object
      required: [kind, typed_name, font_key, image_data_url, updated_at]
      properties:
        kind:
          type: string
          enum: [TYPED, DRAWN]
        typed_name:
          type: [string, 'null']
        font_key:
          type: [string, 'null']
        image_data_url:
          type: string
        updated_at:
          type: string
          format: date-time
    # Feature-Parity §1.7–§1.9 (Amendment A1) — messaging and SMS one-time codes.
    SigningTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    RecipientVerificationStatus:
      type: object
      required: [required, method, verified, locked, phone]
      properties:
        required:
          type: boolean
        method:
          type: [string, 'null']
          enum: [SMS_OTP, null]
        verified:
          type: boolean
        locked:
          type: boolean
        phone:
          type: [string, 'null']
          description: The masked number.
    SenderRecipientMessaging:
      type: object
      required: [signer_id, delivery_channel, sms_otp_required, phone_e164, phone_masked, timezone]
      properties:
        signer_id:
          type: string
          format: uuid
        delivery_channel:
          type: [string, 'null']
          enum: [SMS, WHATSAPP, null]
        sms_otp_required:
          type: boolean
        phone_e164:
          type: [string, 'null']
        phone_masked:
          type: [string, 'null']
        timezone:
          type: [string, 'null']
    SenderEnvelopeMessaging:
      type: object
      required: [envelope_id, features, recipients, deliveries]
      properties:
        envelope_id:
          type: string
          format: uuid
        features:
          type: object
          required: [sms_delivery, whatsapp_delivery, sms_otp]
          properties:
            sms_delivery:
              type: boolean
            whatsapp_delivery:
              type: boolean
            sms_otp:
              type: boolean
        recipients:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/SenderRecipientMessaging'
              - type: object
                required: [updated_at]
                properties:
                  updated_at:
                    type: string
                    format: date-time
        deliveries:
          type: array
          items:
            type: object
            required: [id, signer_id, channel, purpose, status, suppressed_reason, phone_masked, error_code, created_at, sent_at, status_updated_at]
            properties:
              id:
                type: string
                format: uuid
              signer_id:
                type: [string, 'null']
                format: uuid
              channel:
                type: string
                enum: [SMS, WHATSAPP]
              purpose:
                type: string
                enum: [INVITATION, REMINDER, OTP]
              status:
                type: string
                enum: [SENT, DELIVERED, READ, UNDELIVERED, FAILED, SUPPRESSED]
              suppressed_reason:
                type: [string, 'null']
                enum: [opted_out, rate_limited, quiet_hours, channel_unavailable, null]
              phone_masked:
                type: [string, 'null']
              error_code:
                type: [string, 'null']
              created_at:
                type: string
                format: date-time
              sent_at:
                type: [string, 'null']
                format: date-time
              status_updated_at:
                type: [string, 'null']
                format: date-time
    ErrorResponse:
      type: object
      description: The canonical Aramo error envelope.
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    CreateEnvelopeRequest:
      type: object
      required:
        - tenant_id
        - subject
        - execution_mode
        - created_by
        - documents
        - signers
      properties:
        tenant_id:
          type: string
          format: uuid
        subject:
          type: string
        execution_mode:
          type: string
          enum: [ACKNOWLEDGEMENT, SINGLE_SIGNATURE, MULTI_SIGNATURE]
        created_by:
          type: string
          format: uuid
        idempotency_key:
          type: string
        documents:
          type: array
          items:
            type: object
            required: [document_ref, document_revision_ref, title, source_sha256, ordinal]
            properties:
              document_ref:
                type: string
                format: uuid
              document_revision_ref:
                type: string
                format: uuid
              title:
                type: string
              source_sha256:
                type: string
              ordinal:
                type: integer
        signers:
          type: array
          items:
            type: object
            required: [email, name, signing_order]
            properties:
              email:
                type: string
              name:
                type: string
              signing_order:
                type: integer
              signer_role:
                type: string
        fields:
          description: >-
            PX-V1 F2 — OPTIONAL positioned signature/date fields defined at
            envelope creation. Each references a document by ordinal and,
            optionally, a signer by signing_order. Omitted by ATS RTR/Offer
            callers, which remain valid unchanged.
          type: array
          items:
            type: object
            required: [document_ordinal, field_type, page_number, x, y]
            properties:
              document_ordinal:
                type: integer
              signer_signing_order:
                type: integer
              field_type:
                type: string
                enum: [SIGNATURE, INITIALS, SIGN_DATE, SIGNER_NAME, TEXT, CHECKBOX, ACKNOWLEDGEMENT]
              page_number:
                type: integer
              x:
                type: number
              y:
                type: number
              width:
                type: number
              height:
                type: number
              required:
                type: boolean
    EnvelopeSummary:
      type: object
      required:
        - envelope_id
        - status
        - signers
      properties:
        envelope_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [DRAFT, SENT, IN_PROGRESS, COMPLETED, DECLINED, VOIDED, EXPIRED]
        signers:
          type: array
          items:
            type: object
            properties:
              signer_id:
                type: string
                format: uuid
              email:
                type: string
              status:
                type: string
                enum: [PENDING, VIEWED, SIGNED, DECLINED]
    EvidenceSummary:
      type: object
      required:
        - envelope_id
        - status
      properties:
        envelope_id:
          type: string
          format: uuid
        status:
          type: string
        event_chain_hash:
          type: [string, 'null']
        signature:
          type: [string, 'null']
        signature_algorithm:
          type: [string, 'null']
        completed_at:
          type: [string, 'null']
          format: date-time
        trusted_timestamps:
          type: array
          description: >
            Feature-Parity Directive v1.0 §1.18 — RFC 3161 trusted timestamps on each executed document's SHA-256 and on
            the completed evidence manifest. Present only when at least one was recorded (the feature is off by default).
          items:
            $ref: '#/components/schemas/TrustedTimestampEvidence'
    # Sign Feature-Parity §1.21 — custom Sign roles.
    SignCustomRoleScopeKey:
      type: string
      description: A composable Sign permission (every sign:* permission except sign:billing:manage).
      enum:
        - sign:envelope:read
        - sign:envelope:read:all
        - sign:envelope:create
        - sign:envelope:send
        - sign:envelope:manage:all
        - sign:contact:read
        - sign:report:read
        - sign:member:manage
        - sign:settings:manage
        - sign:integration:manage
    SignCustomRole:
      type: object
      required: [id, name, description, scope_keys, member_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 60
        description:
          type: [string, 'null']
          maxLength: 500
        scope_keys:
          type: array
          items:
            $ref: '#/components/schemas/SignCustomRoleScopeKey'
        member_count:
          type: integer
          description: Active members holding the role.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SignCustomRoleEnvelope:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/SignCustomRole'
    SignCustomRoleList:
      type: object
      required: [permissions, roles]
      properties:
        permissions:
          type: array
          items:
            type: object
            required: [key, grantable]
            properties:
              key:
                $ref: '#/components/schemas/SignCustomRoleScopeKey'
              grantable:
                type: boolean
        roles:
          type: array
          items:
            $ref: '#/components/schemas/SignCustomRole'
    SignCustomRoleInput:
      type: object
      required: [name, scope_keys]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        description:
          type: [string, 'null']
          maxLength: 500
        scope_keys:
          type: array
          minItems: 1
          items:
            type: string
    SignCustomRolePatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        description:
          type: [string, 'null']
          maxLength: 500
        scope_keys:
          type: array
          minItems: 1
          items:
            type: string
    SignCustomRoleMembers:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            type: object
            required: [user_id, email, display_name, role_keys, custom_role_ids]
            properties:
              user_id:
                type: string
                format: uuid
              email:
                type: [string, 'null']
              display_name:
                type: [string, 'null']
              role_keys:
                type: array
                items:
                  type: string
              custom_role_ids:
                type: array
                items:
                  type: string
                  format: uuid
    TrustedTimestampEvidence:
      type: object
      description: >
        One RFC 3161 timestamp. PENDING means requested but not yet granted by the time-stamping authority; it is retried
        in the background and never blocks completion.
      required:
        - subject_kind
        - envelope_document_id
        - message_imprint_sha256
        - hash_algorithm
        - status
        - gen_time
        - tsa_name
        - tsa_url
        - serial_number
        - policy_oid
        - tsa_certificate_sha256
        - token_der_base64
        - subject_canonical
      properties:
        subject_kind:
          type: string
          enum: [EXECUTED_DOCUMENT, EVIDENCE_MANIFEST]
        envelope_document_id:
          type: [string, 'null']
          format: uuid
        message_imprint_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        hash_algorithm:
          type: string
          enum: [SHA-256]
        status:
          type: string
          enum: [PENDING, GRANTED]
        gen_time:
          type: [string, 'null']
          format: date-time
        tsa_name:
          type: [string, 'null']
        tsa_url:
          type: string
        serial_number:
          type: [string, 'null']
        policy_oid:
          type: [string, 'null']
        tsa_certificate_sha256:
          type: [string, 'null']
        token_der_base64:
          type: [string, 'null']
          description: The DER TimeStampToken (CMS SignedData), base64.
        subject_canonical:
          type: [string, 'null']
          description: EVIDENCE_MANIFEST only — the exact manifest JSON whose SHA-256 was time-stamped.
    # Aramo Sign 1.14 — payment collection (Stripe Connect).
    SignPaymentAccount:
      type: object
      required: [available, unavailable_reason, account, application_fee_minor, can_manage]
      properties:
        available:
          type: boolean
        unavailable_reason:
          type: [string, 'null']
          enum: [feature_not_available, payments_not_configured, plan_not_entitled, null]
        account:
          type: [object, 'null']
          required: [status, charges_enabled, details_submitted, payouts_enabled, live, connected_at, disconnected_at]
          properties:
            status:
              type: string
              enum: [CONNECTED, DISCONNECTED]
            charges_enabled:
              type: boolean
            details_submitted:
              type: boolean
            payouts_enabled:
              type: boolean
            live:
              type: boolean
              description: False while the Connect platform key is a test key.
            connected_at:
              type: string
              format: date-time
            disconnected_at:
              type: [string, 'null']
              format: date-time
        application_fee_minor:
          type: integer
          minimum: 0
          description: Aramo's fee per payment in cents (default 0).
        can_manage:
          type: boolean
    SignEnvelopePayment:
      type: object
      required: [id, signer_id, field_id, amount_minor, currency, status, amount_refunded_minor, refundable_minor, payment_ref, paid_at, live, refunds]
      properties:
        id:
          type: string
          format: uuid
        signer_id:
          type: string
          format: uuid
        field_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
        currency:
          type: string
          enum: [USD]
        status:
          type: string
          enum: [PENDING, PAID, FAILED, PARTIALLY_REFUNDED, REFUNDED]
        amount_refunded_minor:
          type: integer
        refundable_minor:
          type: integer
        payment_ref:
          type: [string, 'null']
          description: The Stripe payment reference (on the organization's connected account).
        paid_at:
          type: [string, 'null']
          format: date-time
        live:
          type: boolean
        refunds:
          type: array
          items:
            type: object
            required: [id, amount_minor, status, refund_ref, reason, created_at]
            properties:
              id:
                type: string
                format: uuid
              amount_minor:
                type: integer
              status:
                type: string
                enum: [REQUESTED, PENDING, SUCCEEDED, FAILED, CANCELED]
              refund_ref:
                type: [string, 'null']
              reason:
                type: [string, 'null']
              created_at:
                type: string
                format: date-time
