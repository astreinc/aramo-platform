                    enum: [sign.sms_message, sign.whatsapp_message, sign.sms_otp, sign.id_verification, sign.kba, sign.qes_signature, sign.india_estamp]
                  name:
                    type: string
                  quantity_label:
                    type: string
                    enum: [message, verification, signature, stamp]
                  quantity:
                    type: integer
                    minimum: 0
                  unit_price_minor:
                    type: [integer, 'null']
                    minimum: 0
                  amount_minor:
                    type: integer
                    minimum: 0
            total_amount_minor:
              type: integer
              minimum: 0
    SelfServiceBilling:
