  # Aramo-Sign-Feature-Parity-Program-Directive-v1_0-LOCKED §1.7 / §1.8 / §1.9 (Amendment A1) —
  # SMS / WhatsApp delivery and SMS one-time-code recipient verification. DARK: sign.sms_delivery,
  # sign.whatsapp_delivery and sign.sms_otp are NOT_AVAILABLE and every provider is off.
  /v1/sign/sender/envelopes/{id}/messaging:
    get:
      operationId: getEnvelopeMessaging
      summary: The envelope's SMS / WhatsApp / SMS-code choices and its message deliveries.
      description: >
        Feature-Parity §1.7–§1.9. Requires sign:envelope:read and visibility of the envelope. Refused with 403
        ESIGN_FEATURE_NOT_AVAILABLE while sign.sms_delivery, sign.whatsapp_delivery and sign.sms_otp are all NOT_AVAILABLE.
        Deliveries never carry the full number, the text or the signing link (phone_masked only).
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      responses:
        '200':
          description: The choices and deliveries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderEnvelopeMessaging'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sign/sender/envelopes/{id}/recipients/{signerId}/messaging:
    put:
      operationId: setRecipientMessaging
      summary: Set a recipient's text delivery channel and / or SMS one-time code.
      description: >
        Feature-Parity §1.7–§1.9. DRAFT only (409 envelope_not_draft), sign:envelope:create and the right to change the
        envelope. For a SIGNER who receives a link (400 recipient_kind_not_supported otherwise): delivery_channel SMS |
        WHATSAPP sends the signing link to the phone as well as by email (sign.sms_delivery / sign.whatsapp_delivery);
        sms_otp_required makes the recipient enter an SMS code before acting (sign.sms_otp). phone_e164 is required when
        either is set (400 invalid_phone); timezone is an optional IANA zone for quiet hours (400 invalid_timezone). A
        feature that is NOT_AVAILABLE is refused with 403 ESIGN_FEATURE_NOT_AVAILABLE; no provider for the number is 503
        messaging_provider_not_configured. delivery_channel null with sms_otp_required false clears the choice.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
        - name: signerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                delivery_channel:
                  type: [string, 'null']
                  enum: [SMS, WHATSAPP, null]
                sms_otp_required:
                  type: boolean
                phone_e164:
                  type: string
                  pattern: '^\+[1-9][0-9]{7,14}$'
                timezone:
                  type: [string, 'null']
      responses:
        '200':
          description: The recipient's choice now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderRecipientMessaging'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          description: 503 ESIGN_FEATURE_NOT_AVAILABLE — details.reason messaging_provider_not_configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/signing/verification:
    post:
      operationId: getRecipientVerificationStatus
      summary: The recipient-verification status of this signing session.
      description: >
        Feature-Parity §1.9 — token-authorized. When the sender set SMS_OTP on the recipient, every other signer action
        (exchange, disclosure-text, document, source, disclosure, fill, complete, decline) is refused with 403
        INSUFFICIENT_PERMISSIONS details.reason recipient_verification_required (or recipient_verification_locked) until
        a code is verified for this session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SigningTokenRequest'
      responses:
        '200':
          description: The status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientVerificationStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/sign/signing/verification/sms-otp/send:
    post:
      operationId: sendRecipientSmsOtp
      summary: Send a one-time code to the recipient's phone.
      description: >
        Feature-Parity §1.9 — 6 digits, valid 10 minutes, 5 attempts; at most one send per 60 seconds and 5 a day (429
        INVALID_REQUEST otp_resend_cooldown / otp_daily_limit). 400 otp_not_required; 403 otp_locked after 3 codes were
        used up; 409 / 503 ESIGN_SEND_UNAVAILABLE otp_opted_out / otp_delivery_failed. Appends RECIPIENT_OTP_SENT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SigningTokenRequest'
      responses:
        '200':
          description: The code was sent (or the session is already verified).
          content:
            application/json:
              schema:
                type: object
                required: [sent, verified, phone]
                properties:
                  sent:
                    type: boolean
                  verified:
                    type: boolean
                  phone:
                    type: string
                    description: The masked number.
                  expires_at:
                    type: [string, 'null']
                    format: date-time
                  resend_after_seconds:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 403 INSUFFICIENT_PERMISSIONS — details.reason otp_locked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: 429 INVALID_REQUEST — details.reason otp_resend_cooldown (retry_after_seconds, retry_at) or otp_daily_limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 503 ESIGN_SEND_UNAVAILABLE — details.reason otp_delivery_failed (or another otp_* suppression).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/signing/verification/sms-otp/verify:
    post:
      operationId: verifyRecipientSmsOtp
      summary: Check the one-time code.
      description: >
        Feature-Parity §1.9 — 400 otp_not_requested / otp_expired / otp_mismatch (attempts_remaining); 403 otp_code_locked
        (5 wrong attempts; ask for a new code) or otp_locked (3 codes used up; locked out of the envelope); 409 otp_retry.
        Appends RECIPIENT_OTP_VERIFIED / RECIPIENT_OTP_FAILED / RECIPIENT_OTP_LOCKED; the verification is printed on the
        certificate of completion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, code]
              properties:
                token:
                  type: string
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
      responses:
        '200':
          description: Verified for this session.
          content:
            application/json:
              schema:
                type: object
                required: [verified]
                properties:
                  verified:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 403 INSUFFICIENT_PERMISSIONS — details.reason otp_code_locked or otp_locked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/sign/messaging/whatsapp/webhook:
    get:
      operationId: verifyWhatsAppWebhook
      summary: Meta WhatsApp webhook subscription check.
      description: >
        Feature-Parity §1.8 — no session. Echoes hub.challenge when hub.mode is subscribe and hub.verify_token equals
        SIGN_WHATSAPP_VERIFY_TOKEN. 404 while the webhook is unconfigured or sign.whatsapp_delivery is NOT_AVAILABLE.
      security: []
      parameters:
        - name: hub.mode
          in: query
          schema:
            type: string
        - name: hub.verify_token
          in: query
          schema:
            type: string
        - name: hub.challenge
          in: query
          schema:
            type: string
      responses:
        '200':
          description: The challenge.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: The verify token does not match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: receiveWhatsAppWebhook
      summary: Meta WhatsApp webhook receiver (STOP / START and delivery statuses).
      description: >
        Feature-Parity §1.8 — no session. Authenticity is X-Hub-Signature-256 (HMAC-SHA256 of the raw body with
        SIGN_WHATSAPP_APP_SECRET). An inbound STOP / START updates the opt-out list; a delivered / read / failed status
        updates the delivery and, while the envelope is open, appends SIGNER_MESSAGE_STATUS. 404 while unconfigured or
        NOT_AVAILABLE.
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Received.
          content:
            application/json:
              schema:
                type: object
                required: [received, keywords, statuses]
                properties:
                  received:
                    type: boolean
                  keywords:
                    type: integer
                  statuses:
                    type: integer
        '401':
          description: The signature is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sign/messaging/sms/inbound/aws:
    post:
      operationId: receiveAwsInboundSms
      summary: Inbound SMS replies (STOP / START) from AWS End User Messaging through Amazon SNS.
      description: >
        Remaining-Work Directive §3 B5 — no session. Amazon SNS posts the message as JSON with Content-Type
        text/plain. Authenticity is the SNS message signature (SignatureVersion 1 or 2) checked with the
        certificate at SigningCertURL (https, an Amazon SNS host only); TopicArn must equal
        SIGN_SMS_AWS_INBOUND_TOPIC_ARN. A SubscriptionConfirmation is confirmed through its SubscribeURL (an
        Amazon SNS host only). A Notification carrying the AWS two-way SMS payload records STOP / START in the
        opt-out list. 404 unless SIGN_SMS_AWS_INBOUND_TOPIC_ARN is set, SIGN_SMS_PROVIDER includes a configured
        aws provider and sign.sms_delivery is AVAILABLE.
      security: []
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Received.
          content:
            application/json:
              schema:
                type: object
                required: [received, type, keywords]
                properties:
                  received:
                    type: boolean
                  type:
                    type: string
                    enum: [Notification, SubscriptionConfirmation, UnsubscribeConfirmation]
                  keywords:
                    type: integer
        '401':
          description: The SNS message is malformed, its signature is invalid, the topic or the certificate URL is not trusted, or it is stale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: The SNS signing certificate could not be fetched; SNS delivers again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  # ── Aramo Sign 1.14 — payment collection through Stripe Connect ──
  # (Aramo-Sign-Feature-Parity-Program-Directive-v1_0-LOCKED §1.14, R-6; Amendment A1). Dark:
  # sign.payments is NOT_AVAILABLE and SIGN_STRIPE_CONNECT_* unset. Aramo never holds the
  # funds: each payment is a direct charge on the organization's own connected Stripe account,
  # paid on Stripe's hosted Checkout page (no card data reaches Aramo).
  /v1/sign/signing/payment/checkout:
    post:
      operationId: startSignerPaymentCheckout
      security: []
      summary: Start (or resume) the payment of one of the signer's PAYMENT fields.
      description: >-
        Token-authorized and disclosure-gated, with the same guards as filling a field (live session,
        the signer's turn, a signable envelope). Returns the URL of Stripe's hosted Checkout page on the
        sending organization's connected account (a direct charge), or status PAID when the field is
        already paid. The signing token is never sent to Stripe: Stripe returns the payer to
        /s/payment-return. Refused 403 ESIGN_FEATURE_NOT_AVAILABLE (details.reason) while payments
        are not available, 409 details.reason payments_account_not_ready while the organization's
        account cannot take charges, 503 ESIGN_PAYMENTS_UNAVAILABLE when Stripe cannot be reached.
      tags: [sender]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, field_id]
              properties:
                token: { type: string }
                field_id: { type: string, format: uuid }
      responses:
        '200':
          description: The checkout to send the payer to, or PAID.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [CHECKOUT, PAID]
                  checkout_url:
                    type: string
                    format: uri
                    description: Present when status is CHECKOUT (a Stripe-hosted page).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: ESIGN_FEATURE_NOT_AVAILABLE — payments are not available (details.reason).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: SIGNER_NOT_FOUND — not one of this signer's PAYMENT fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          description: ESIGN_PAYMENTS_UNAVAILABLE — Stripe could not be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/signing/payment/confirm:
    post:
      operationId: confirmSignerPayment
      security: []
      summary: After the payer returns from Stripe, read the checkout through and record a paid payment.
      description: >-
        Token-authorized. The browser never asserts a payment: the server reads the checkout from
        Stripe and records it only when Stripe reports it paid (the Connect webhook records it too).
        Once PAID, the PAYMENT field is filled with the receipt line and the signer can complete.
      tags: [sender]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, field_id]
              properties:
                token: { type: string }
                field_id: { type: string, format: uuid }
      responses:
        '200':
          description: The payment's status.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [PENDING, PAID, EXPIRED, FAILED, PARTIALLY_REFUNDED, REFUNDED]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: ESIGN_FEATURE_NOT_AVAILABLE — payments are not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: ESIGN_PAYMENTS_UNAVAILABLE — Stripe could not be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/payments/webhook/stripe:
    post:
      operationId: receiveStripeConnectWebhook
      summary: Stripe Connect webhook receiver (payments collected for organizations).
      description: >
        No session. A Connect endpoint SEPARATE from the Aramo billing webhook, with its own signing
        secret (SIGN_STRIPE_CONNECT_WEBHOOK_SECRET). Authenticity is the Stripe-Signature header
        (HMAC-SHA256 over the raw body, 300 second tolerance). Handles account.updated,
        account.application.deauthorized, checkout.session.completed / async_payment_succeeded /
        async_payment_failed / expired, charge.refunded and refund.created / updated / failed. Each
        event is processed at most once; a processing failure returns 5xx so Stripe redelivers.
        404 while payments are not configured (dark).
      tags: [sender]
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Received.
          content:
            application/json:
              schema:
                type: object
                required: [received, outcome]
                properties:
                  received:
                    type: boolean
                  outcome:
                    type: string
                    enum: [APPLIED, IGNORED, DUPLICATE, FAILED]
        '401':
          description: The signature is missing, stale or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sign/sender/payments/account:
    get:
      operationId: getSenderPaymentAccount
      summary: The organization's payment availability and connected Stripe account.
      description: >-
        Requires sign:envelope:read. available is true only while sign.payments is available, Stripe
        Connect is configured and the plan is Standard Professional or Enterprise; unavailable_reason
        names the first refusal. can_manage is true for sign:settings:manage (Sign Admin).
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignPaymentAccount'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/sender/payments/account/onboarding-link:
    post:
      operationId: createSenderPaymentOnboardingLink
      summary: Create the organization's Stripe Standard account (first time) and return Stripe's hosted onboarding link.
      description: >-
        Requires sign:settings:manage. The account is a Stripe Standard account owned by the
        organization (its funds, payouts and refunds stay with it). The link expires; Stripe returns
        the admin to Settings → Payments. 403 ESIGN_FEATURE_NOT_AVAILABLE while payments are not available.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: The Stripe-hosted onboarding link.
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at]
                properties:
                  url:
                    type: string
                    format: uri
                  expires_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '503':
          description: ESIGN_PAYMENTS_UNAVAILABLE — Stripe could not be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/sender/payments/account/refresh:
    post:
      operationId: refreshSenderPaymentAccount
      summary: Re-read the connected account from Stripe (charges enabled, details submitted).
      description: Requires sign:settings:manage.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignPaymentAccount'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '503':
          description: ESIGN_PAYMENTS_UNAVAILABLE — Stripe could not be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/sender/payments/account/disconnect:
    post:
      operationId: disconnectSenderPaymentAccount
      summary: Stop collecting payments through the connected account.
      description: >-
        Requires sign:settings:manage. Aramo stops using the account; the Stripe account itself, its
        balance and history stay the organization's. Earlier payments can still be refunded.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignPaymentAccount'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/sign/sender/envelopes/{id}/payments:
    get:
      operationId: listSenderEnvelopePayments
      summary: The payments collected on an envelope, with their refunds.
      description: Requires sign:envelope:read and visibility of the envelope. can_refund is true for sign:settings:manage.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [items, can_refund]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SignEnvelopePayment'
                  can_refund:
                    type: boolean
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sign/sender/envelopes/{id}/payments/{paymentId}/refund:
    post:
      operationId: refundSenderEnvelopePayment
      summary: Refund a payment (in full or in part) through Stripe, on the account that collected it.
      description: >-
        Requires sign:settings:manage and visibility of the envelope. amount_minor omitted refunds
        everything still refundable. The refund is a Stripe refund on the organization's connected
        account; a refusal by Stripe answers 400 details.reason payment_provider_refused, an amount
        above what remains 409 details.reason refund_amount_invalid. Every request and result is a
        ledger event on the envelope.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amount_minor:
                  type: [integer, 'null']
                  minimum: 1
                reason:
                  type: [string, 'null']
                  maxLength: 500
      responses:
        '200':
          description: The payment after the refund request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignEnvelopePayment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          description: ESIGN_PAYMENTS_UNAVAILABLE — Stripe could not be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    senderSession:
      type: apiKey
      in: cookie
      name: aramo_access_token_sign
      description: The HttpOnly esign consumer session cookie (sent with X-Aramo-Consumer sign).
    senderBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The shared auth-service access token for the esign consumer.
    atsClientBasic:
      type: http
      scheme: basic
      description: The first-party aramo-ats Sign API client credential (service-to-service only).
    signApiToken:
      type: http
      scheme: bearer
      bearerFormat: opaque (sgt_…)
      description: A short-lived Sign API access token from /v1/sign/oauth/token (never a session token).
  parameters:
    RegulatedEnvelopeId:
      name: id
      in: path
      required: true
      description: The envelope id (UUID).
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      description: The envelope document id (UUID).
      schema:
        type: string
        format: uuid
    SenderTab:
      name: tab
      in: query
      required: false
      description: Status tab.
      schema:
        type: string
        enum: [all, drafts, waiting, completed, declined, voided, expired, follow_up]
    SenderQuery:
      name: q
      in: query
      required: false
      description: Free text matched against subject and recipient name or email.
      schema:
        type: string
    SenderDays:
      name: days
      in: query
      required: false
      description: Only envelopes created within this many days.
      schema:
        type: integer
        minimum: 1
    SenderLimit:
      name: limit
      in: query
      required: false
      description: Maximum rows.
      schema:
        type: integer
        minimum: 1
        maximum: 500
    EnvelopeId:
      name: id
      in: path
      required: true
      description: The signature envelope id (UUID).
      schema:
        type: string
        format: uuid
    # Aramo Sign W2 — an inbox item: a binding id (UUID) or a discovered item's opaque handle.
    InboxItemId:
      name: id
      in: path
      required: true
      description: The inbox item id from GET /v1/sign/inbox - a binding id (UUID) for a bound item, or an opaque handle (base64url, valid 30 minutes, for the signed-in user only) for a discovered item.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    # Sign Mobile M-A3 §5–§8 (W2b)
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >
        The envelope's last-read ETag "{envelope_id}.{revision}". Required for native (mobile) tokens on draft writes, send and
        void (428 precondition_required); enforced whenever sent (412 revision_mismatch, details.current_revision).
      schema:
        type: string
        example: '"e5000000-0000-7000-8000-0000000000a1.3"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        1 to 255 printable characters, scoped to (tenant, authenticated user, operation, key) for 24 hours. A replay with the same
        body returns the first response; a different body is 422 idempotency_key_reuse; 409 idempotency_request_in_progress while
        the first request runs.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    ContactId:
      name: contactId
      in: path
      required: true
      description: A saved contact id (UUID).
      schema:
        type: string
        format: uuid
  headers:
    # Sign Mobile M-A3 §6 (W2b)
    EnvelopeETag:
      description: The strong validator "{envelope_id}.{revision}" - send it back as If-Match.
      schema:
        type: string
  responses:
    EnvelopePurged:
      description: The envelope's documents were purged (ENVELOPE_PURGED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    # Sign Mobile M-A3 §6–§8 (W2b)
    RevisionMismatch:
      description: 412 — details.reason revision_mismatch; details.current_revision is the envelope's revision now. Re-read and retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionRequired:
      description: 428 — details.reason precondition_required; a native token must send If-Match on this write.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdempotencyKeyReuse:
      description: 422 — details.reason idempotency_key_reuse; the Idempotency-Key was used with a different request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    # Aramo-Sign-Mobile-Amendment-M-A13 R-4
    WordTooLarge:
      description: 413 — details.reason word_too_large; the Word file is over 20 MB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ReminderLimited:
      description: >
        429 ESIGN_REMINDER_NOT_ALLOWED — details.reason reminder_cooldown (under 60 minutes since this signer was reminded) or
        reminder_daily_limit (5 reminders on this envelope in the rolling 24 hours); details.retry_after_seconds and
        details.retry_at (ISO 8601) tell when to try again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SenderUnauthorized:
      description: No valid esign session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SenderForbidden:
      description: Not the esign consumer, the tenant lacks the esign capability, the scope is missing, or a PERSONAL tenant attempted a write.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SelfSignSingleRecipient:
      description: >-
        Aramo Sign Mobile M-A12 W1-A — a self-sign envelope has exactly one recipient, the caller (details.reason
        self_sign_single_recipient).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The envelope was not found in the caller's tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: An illegal envelope transition.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: The signing capability token is invalid or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BillingConflict:
      description: >-
        ESIGN_BILLING_CONFLICT (details.reason) — already subscribed (ALREADY_SUBSCRIBED), no billing
        account yet (NO_BILLING_ACCOUNT), an incomplete or non-US organization profile, an unverified
        domain, a plan that needs ATS (PLAN_NOT_ELIGIBLE), or an open governed subscription managed by
        Aramo (governed_subscription_open; CCP-A6, Conversion Rule C-1 and C-4: a conversion is a
        governed change request, never a checkout). CCP-C7 self-service actions add (lower-case
        reasons): governed_subscription_open, activation_pending, conversion_in_progress,
        no_self_service_subscription, provider_change_pending, already_canceling and
        financial_treatment_undefined. Sign Business per-seat pricing adds seats_not_applicable,
        seats_below_usage (details used) and seats_unchanged (POST seats).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BillingUnavailable:
      description: ESIGN_BILLING_UNAVAILABLE — online billing is not configured or the provider is unreachable. CCP-C7 self-service actions also answer it with details.reason self_service_terms_not_approved (the designed disabled state while the Sign Terms of Service are not APPROVED) or product_not_self_service.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    SignPurgeLevel:
      type: string
      enum: [DOCUMENTS, DOCUMENTS_AND_METADATA, DOCUMENTS_AND_METADATA_AND_REDACT]
    SignReportStats:
      type: object
      required: [sent, completed, declined, voided, expired, in_flight, completion_rate, turnaround_average_hours, turnaround_median_hours, turnaround_p90_hours]
      properties:
        sent:
          type: integer
        completed:
          type: integer
        declined:
          type: integer
        voided:
          type: integer
        expired:
          type: integer
        in_flight:
          type: integer
          description: Sent or in progress.
        completion_rate:
          type: [number, 'null']
          description: Percent of the envelopes sent that completed (one decimal); null when none were sent.
        turnaround_average_hours:
          type: [number, 'null']
        turnaround_median_hours:
          type: [number, 'null']
        turnaround_p90_hours:
          type: [number, 'null']
    SignReportsOverview:
      type: object
      required: [range, totals, volume, by_sender, by_template]
      properties:
        range:
          type: object
          required: [from, to, period, timezone]
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
            period:
              type: string
              enum: [day, week, month]
            timezone:
              type: string
              enum: [UTC]
        totals:
          $ref: '#/components/schemas/SignReportStats'
        volume:
          type: array
          items:
            type: object
            required: [period_start, sent, completed, declined, voided]
            properties:
              period_start:
                type: string
                format: date
              sent:
                type: integer
              completed:
                type: integer
              declined:
                type: integer
              voided:
                type: integer
        by_sender:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/SignReportStats'
              - type: object
                required: [sender_id, sender_name]
                properties:
                  sender_id:
                    type: string
                    format: uuid
                  sender_name:
                    type: [string, 'null']
        by_template:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/SignReportStats'
              - type: object
                required: [template_ref, template_name]
                properties:
                  template_ref:
                    type: [string, 'null']
                    format: uuid
                    description: null = envelopes not started from a template.
                  template_name:
                    type: [string, 'null']
                    description: Reserved for the template library; null until it is wired.
    SignBranding:
      type: object
      required: [available, entitled, can_edit, display_name, primary_color, accent_color, logo, updated_at]
      properties:
        available:
          type: boolean
          description: The `sign.branding` launch availability (false = dark; every value null).
        entitled:
          type: boolean
          description: The organization's plan includes branding.
        can_edit:
          type: boolean
        display_name:
          type: [string, 'null']
          maxLength: 80
          description: Shown to recipients as "<display name> via Aramo Sign"; null = the organization name is not added.
        primary_color:
          type: [string, 'null']
          pattern: '^#[0-9A-F]{6}$'
        accent_color:
          type: [string, 'null']
          pattern: '^#[0-9A-F]{6}$'
        logo:
          oneOf:
            - type: object
              required: [url, content_type, byte_size, width, height]
              properties:
                url:
                  type: string
                  description: The public logo path (GET /v1/sign/signing/brand-logo/{logoId}).
                content_type:
                  type: string
                  enum: [image/png, image/jpeg]
                byte_size: { type: integer }
                width: { type: integer }
                height: { type: integer }
            - type: 'null'
        updated_at:
          type: [string, 'null']
          format: date-time
    SignBrandingInput:
      type: object
      properties:
        display_name:
          type: [string, 'null']
          maxLength: 80
          description: 1 to 80 printable Latin-1 characters; null or omitted = none.
        primary_color:
          type: [string, 'null']
          pattern: '^#[0-9A-Fa-f]{6}$'
        accent_color:
          type: [string, 'null']
          pattern: '^#[0-9A-Fa-f]{6}$'
    SignSignerBranding:
      type: object
      required: [display_name, primary_color, accent_color, logo_url]
      properties:
        display_name: { type: [string, 'null'] }
        primary_color: { type: [string, 'null'], pattern: '^#[0-9A-F]{6}$' }
