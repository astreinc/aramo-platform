        in front of the documents to sign, and the order becomes ATTACHED (ledger ESTAMP_ISSUED,
        ESTAMP_ATTACHED). Sending refuses an envelope whose live order is not attached first (409,
        details.reason estamp_not_attached / estamp_not_first). Refused while sign.india_estamp is not available.
