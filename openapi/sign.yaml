          type: string
          format: uuid
        action:
          type: string
          enum: [CANCEL_AT_PERIOD_END]
        status:
          type: string
          enum: [PENDING_PROVIDER, CONFIRMED]
        pending_provider:
          type: boolean
        replayed:
          type: boolean
    BillingRedirect:
      type: object
