                data_base64:
                  type: string
                  maxLength: 349528
                  description: The image bytes, standard base64.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignBranding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
    delete:
      operationId: deleteSenderBrandingLogo
      summary: Remove the organization's logo (the Aramo default is shown).
      description: Requires sign:settings:manage; the same availability and plan refusals as PUT branding.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignBranding'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  # Retention and Purge directive (ebd41d99) — DocuSign-parity retention and purge. Every write
  # answers 403 ESIGN_FEATURE_NOT_AVAILABLE (details.reason purge_not_enabled) unless the
  # service runs with SIGN_PURGE_ENABLED=1.
  # Aramo Sign Feature-Parity Program Directive v1.0 (LOCKED) §1.21 — custom roles and permissions.
  # DARK: every route answers 403 ESIGN_FEATURE_NOT_AVAILABLE while sign.custom_roles is NOT_AVAILABLE,
  # for a plan without the feature (details.reason not_in_plan); a PERSONAL tenant gets 403
  # INSUFFICIENT_PERMISSIONS (custom_roles_business_only).
  /v1/sign/sender/custom-roles:
    get:
      operationId: listSignCustomRoles
      summary: The organization's custom Sign roles and the Sign permissions a custom role may be composed of.
      description: Requires sign:member:manage. permissions[].grantable is true only for the permissions the caller holds (a custom role can never hold a permission its creator lacks).
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignCustomRoleList'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
    post:
      operationId: createSignCustomRole
      summary: Create a custom Sign role from existing Sign permissions.
      description: >
        Requires sign:member:manage. scope_keys must be non-empty composable Sign permissions (never billing, platform or
        ATS permissions — 400 scope_not_composable) that the caller holds (403 INSUFFICIENT_PERMISSIONS scope_exceeds_actor).
        409 SIGN_CUSTOM_ROLE_CONFLICT name_taken | custom_role_limit. Audited (identity.sign_custom_role.created).
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignCustomRoleInput'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignCustomRoleEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/sign/sender/custom-roles/members:
    get:
      operationId: listSignCustomRoleMembers
      summary: The organization's active members, their built-in Sign and organization roles, and the custom roles they hold.
      description: Requires sign:member:manage.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignCustomRoleMembers'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
