openapi: 3.1.0
info:
  title: Aramo Native E-Sign Service (DOC-3)
  version: 0.1.0
  description: >
    The ATS-neutral Native E-Sign Service Core (apps/sign-service). The
    `/v1/sign/envelopes` surface is the provider seam apps/api's
    SignatureProviderPort HTTP adapter calls (trusted service-to-service; the
    authoritative tenant_id is supplied by the caller). The `/v1/sign/signing`
    surface is the public signer transport — tenant context is resolved from the
    capability token, never accepted from the client. Transport only: no
    RTR/Submittal/Offer/recruiter-workflow logic (those consume this seam in DOC-5/6).
tags:
  - name: sender
    description: The Aramo Sign API — authenticated workspace, guest signing and billing on the one Sign host (sign.aramo.ai).
  - name: billing
    description: Aramo Sign self-service billing (plans, account, Stripe checkout and portal, provider webhook).
  - name: platform
    description: >
      The Aramo Sign API for integrating applications (Sign Unified Product S-4). Authenticate at
      /v1/sign/oauth/token, then call /v1/sign/api/* with the short-lived bearer token. Effective
      authority = principal authority ∩ installation grants ∩ delegated scope. First-party exposure first;
      public third-party activation is separately authorized.
  - name: integrations
    description: Installation administration in the Sign workspace (sign:integration:manage).
  - name: inbox
    description: >
      "Waiting for me" (Sign Unified Product S-7). A recipient right — any signed-in Sign user, with or without a Sign
      role. A document joins only through a recipient-specific binding (the recipient's live signing link AND the user's
      verified email); the binding grants no membership in the sender's organization.
paths:
  /v1/sign/envelopes:
    post:
      operationId: createSignatureEnvelope
      summary: Create a signature envelope (DRAFT) with documents + signers.
      description: Trusted service-to-service; the authoritative tenant_id is supplied by the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvelopeRequest'
      responses:
        '201':
          description: The created envelope summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/sign/envelopes/{id}/send:
    post:
      operationId: sendSignatureEnvelope
      summary: Send the envelope (DRAFT -> SENT); issues signer capability sessions.
      description: Transitions DRAFT to SENT and issues one signing capability session per signer.
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: The updated envelope summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSummary'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/sign/envelopes/for-document:
    get:
      operationId: findEnvelopeForDocument
      summary: Reverse-resolve the single NON-TERMINAL envelope for a document revision (COMM-RECRUITER-W1).
      description: >
        E-Sign owns envelope identity; Documents never store envelope_id. Returns the
        single non-terminal (DRAFT|SENT|IN_PROGRESS) envelope for the exact
        (tenant_id, document_ref, document_revision_ref), or null when none. Fails
        closed with ESIGN_ENVELOPE_AMBIGUOUS (409) when more than one exists.
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: document_ref
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: document_revision_ref
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The single non-terminal envelope, or null.
          content:
            application/json:
              schema:
                type: object
                required: [envelope]
                properties:
                  envelope:
                    oneOf:
                      - $ref: '#/components/schemas/EnvelopeSummary'
                      - type: 'null'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/sign/envelopes/{id}/remind:
    post:
      operationId: remindSignatureEnvelope
      summary: Send a reminder on an already-sent envelope (COMM-RECRUITER-W1); NOT a resend.
      description: >
        Same-envelope reminder for a SENT|IN_PROGRESS envelope. Revokes each
        incomplete signer's prior non-terminal session, issues exactly one new
        session + capability token, records a SIGNATURE_REMINDER_SENT event and a
        NotificationDelivery, and dispatches the reminder link. Never a DRAFT->SENT
        transition and never a new envelope. ESIGN_REMINDER_NOT_ALLOWED (409) when
        the envelope is not remindable.
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id: { type: string, format: uuid }
      responses:
        '200':
          description: The (unchanged-status) envelope summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSummary'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sign/envelopes/{id}:
    get:
      operationId: getSignatureEnvelope
      summary: Get an envelope summary.
      description: Returns the tenant-scoped envelope summary; a cross-tenant id is a 404.
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The envelope summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSummary'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sign/envelopes/{id}/void:
    post:
      operationId: voidSignatureEnvelope
      summary: Void an envelope.
      description: Voids a non-terminal envelope with a recorded reason.
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, reason]
              properties:
                tenant_id:
                  type: string
                  format: uuid
                reason:
                  type: string
      responses:
        '200':
          description: The voided envelope summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSummary'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/sign/envelopes/{id}/evidence:
    get:
      operationId: getSignatureEvidence
      summary: Retrieve envelope evidence metadata (event-chain hash + software signature).
      description: Returns evidence metadata (hashes + signature); verifiable independently of signing.
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The evidence summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceSummary'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sign/envelopes/{id}/executed:
    get:
      operationId: getExecutedArtifacts
      summary: Pull executed document bytes + certificate (base64) for the Documents write-back.
      description: Service-to-service pull for the Documents write-back; bytes are base64 (the event bus carries only refs).
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Executed artifacts (bytes never traverse the event bus).
          content:
            application/json:
              schema:
                type: object
                required: [envelope_id, documents, certificate]
                properties:
                  envelope_id:
                    type: string
                    format: uuid
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        envelope_document_id: { type: string, format: uuid }
                        document_ref: { type: [string, 'null'], format: uuid }
                        document_revision_ref: { type: [string, 'null'], format: uuid }
                        executed_sha256: { type: string }
                        byte_size: { type: integer }
                        executed_base64: { type: string }
                  certificate:
                    type: [object, 'null']
                    properties:
                      certificate_sha256: { type: string }
                      byte_size: { type: integer }
                      certificate_base64: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sign/signing/exchange:
    post:
      operationId: exchangeSigningToken
      summary: Exchange a raw capability token for an active signing session.
      description: The tenant is resolved server-side from the capability token; the client sends no tenant id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: The resolved signing session context.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                    format: uuid
                  envelope_id:
                    type: string
                    format: uuid
                  signer_id:
                    type: string
                    format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/sign/signing/document:
    post:
      operationId: getSignerDocumentView
      summary: The signer's document view — positioned fields + document metadata.
      description: >-
        PX-V1 F3 — token-authorized, disclosure-gated. Tenant is resolved
        server-side from the capability token; the response carries no tenant id
        and no source bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Document metadata + the signer's positioned fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        document_id: { type: string, format: uuid }
                        title: { type: string }
                        ordinal: { type: integer }
                  fields:
                    type: array
                    items:
                      type: object
                      properties:
                        field_id: { type: string, format: uuid }
                        document_id: { type: string, format: uuid }
                        field_type: { type: string }
                        page_number: { type: integer }
                        x: { type: number }
                        y: { type: number }
                        width: { type: [number, 'null'] }
                        height: { type: [number, 'null'] }
                        required: { type: boolean }
                        filled:
                          type: boolean
                          description: True once this signer has filled the field (lets the signer page restore progress).
                        value:
                          type: [string, 'null']
                          description: The signer's own entered value for their field (typed text, date, or drawn-signature data URL); null otherwise.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Disclosure not yet accepted for this signer.
  /v1/sign/signing/source:
    post:
      operationId: getSignerDocumentSource
      summary: The frozen source PDF bytes for a document in the signing session.
      description: >-
        PX-V1 F3 — token-authorized, disclosure-gated. Bytes are resolved
        mode-agnostically (OWNED → E-Sign object storage, CORE_REF → Documents
        pull) and returned base64; the response carries no tenant id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, document_id]
              properties:
                token: { type: string }
                document_id: { type: string, format: uuid }
      responses:
        '200':
          description: The base64-encoded source PDF plus its content type.
          content:
            application/json:
              schema:
                type: object
                properties:
                  source_base64: { type: string }
                  content_type: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Disclosure not yet accepted for this signer.
  /v1/sign/signing/disclosure-text:
    post:
      operationId: getSignerDisclosureText
      summary: The current server-held electronic-records-and-signature disclosure.
      description: >-
        Aramo Sign launch (A-7) — token-authorized. Returns the current disclosure
        version, its exact text and the sha256 of that text. The signer app shows
        the text and sends the version and hash back to /disclosure, which refuses
        any version E-Sign does not hold or any mismatching hash. No tenant id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: The current disclosure.
          content:
            application/json:
              schema:
                type: object
                required: [disclosure_version, text, text_sha256]
                properties:
                  disclosure_version: { type: string }
                  text: { type: string }
                  text_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The envelope is no longer signable (ENVELOPE_ALREADY_EXECUTED).
  /v1/sign/signing/executed:
    post:
      operationId: getSignerExecutedCopy
      summary: The signer's signed copy of a completed envelope.
      description: >-
        Aramo Sign launch — authorized by the time-limited access token from the
        completion email (not a signing session). Returns the executed document(s)
        and the certificate of completion of a COMPLETED envelope, base64. Only the
        token's hash is stored; tenant is resolved server-side; no tenant id in the
        response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: The signed documents and certificate.
          content:
            application/json:
              schema:
                type: object
                required: [subject, completed_at, documents, certificate_base64]
                properties:
                  subject: { type: string }
                  completed_at: { type: [string, 'null'], format: date-time }
                  documents:
                    type: array
                    items:
                      type: object
                      required: [title, content_type, executed_base64]
                      properties:
                        title: { type: string }
                        content_type: { type: string }
                        executed_base64: { type: string }
                  certificate_base64: { type: [string, 'null'] }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/sign/sender/context:
    get:
      operationId: getSenderContext
      summary: The authenticated sender context (user, tenant, kind, workspace, permissions).
      description: >
        Resolved entirely server-side from the verified esign session. BUSINESS tenants get workspace sign, PERSONAL tenants get workspace personal (sending not enabled). Requires sign:envelope:read.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderContext'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/sender/summary:
    get:
      operationId: getSenderSummary
      summary: Dashboard counts, six-month volume and expiring envelopes.
      description: >
        Counts of sender-authored envelopes by status, completed this month, monthly sent / completed / declined-or-expired for six months, and envelopes expiring within three days. Requires sign:envelope:read.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/sender/envelopes:
    get:
      operationId: listSenderEnvelopes
      summary: List the organization's envelopes visible to the caller.
      description: >
        Filter by tab (all, drafts, waiting, completed, declined, voided, expired), free-text q (subject or recipient), and days (created within). Requires sign:envelope:read. Visibility follows the Sign permission contract — own envelopes, or every envelope of the organization with sign:envelope:read:all. Envelopes sent by another Aramo application (e.g. the ATS) are included and carry source_application; they are read-only here.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/SenderTab'
        - $ref: '#/components/parameters/SenderQuery'
        - $ref: '#/components/parameters/SenderDays'
        - $ref: '#/components/parameters/SenderLimit'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderEnvelopeList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
    post:
      operationId: createSenderEnvelope
      summary: Create a DRAFT envelope.
      description: >
        Creates an empty DRAFT owned by the calling user. Refused for a PERSONAL tenant (personal_sending_not_enabled). Requires sign:envelope:create.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                  maxLength: 200
      responses:
        '201':
          description: The created draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderDraftCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/sender/envelopes/{id}:
    get:
      operationId: getSenderEnvelope
      summary: Envelope detail with documents, recipients and positioned fields.
      description: >
        Field geometry is PDF-native - page_number 0-based, points, bottom-left origin. Requires sign:envelope:read, plus ownership or sign:envelope:read:all. source_application names where the envelope came from; draft changes and send/remind/void need ownership or sign:envelope:manage:all, and an envelope from another application is refused (409 managed_by_source_application).
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderEnvelopeDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateSenderEnvelope
      summary: Rename a DRAFT envelope.
      description: >
        DRAFT only. Requires sign:envelope:create.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one of subject or routing_mode.
              properties:
                subject:
                  type: string
                  maxLength: 200
                routing_mode:
                  type: string
                  enum: [PARALLEL, SEQUENTIAL]
                  description: Multi-signer routing - PARALLEL (sign in any order, default) or SEQUENTIAL (sign in order).
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderEnvelopeDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/sign/sender/envelopes/{id}/events:
    get:
      operationId: listSenderEnvelopeEvents
      summary: The envelope hash-chained activity ledger.
      description: >
        Oldest first, with display-safe detail only. Requires sign:envelope:read.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SenderLedgerEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sign/sender/envelopes/{id}/documents:
    post:
      operationId: uploadSenderDocument
      summary: Upload a PDF to a DRAFT envelope (E-Sign-owned source).
      description: >
        Base64 PDF up to 25 MiB through the safe-PDF pipeline (type, size, encryption and active-content gates), stored as an OWNED source. DRAFT only. Requires sign:envelope:create.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_base64]
              properties:
                filename:
                  type: string
                title:
                  type: string
                content_base64:
                  type: string
      responses:
        '201':
          description: The attached document with its page geometry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderUploadedDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/sign/sender/envelopes/{id}/documents/order:
    put:
      operationId: reorderSenderDocuments
      summary: Reorder the documents of a DRAFT envelope.
      description: >
        The order lists every document id exactly once. DRAFT only. Requires sign:envelope:create.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderEnvelopeDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/sign/sender/envelopes/{id}/documents/{documentId}:
    patch:
      operationId: renameSenderDocument
      summary: Rename a document of a DRAFT envelope.
      description: >
        DRAFT only. Requires sign:envelope:create.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderEnvelopeDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: removeSenderDocument
      summary: Remove a document (and its fields) from a DRAFT envelope.
