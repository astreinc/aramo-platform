  /v1/sign/sender/envelopes/from-template:
    post:
      operationId: createSenderEnvelopeFromTemplate
      summary: Create a DRAFT envelope from a document template (DOC-TEMPLATE-LIB-1 T-5).
      description: >
        Requires sign:envelope:create and document_template:read; refused for a PERSONAL tenant and while sign.templates is not available. Documents (apps/api) renders the template with the organization's branding and the sender's values into a frozen revision pinned to the exact template version; the draft's document references it (CORE_REF). With `signer`, that first signer is added and the template's signature area is placed for them. Idempotent on idempotency_key for the render.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_id]
              properties:
                template_id:
                  type: string
                  format: uuid
                values:
                  type: object
                  additionalProperties:
                    type: string
                subject:
                  type: string
                  maxLength: 200
                idempotency_key:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{8,128}$'
                signer:
                  type: object
                  required: [name, email]
                  properties:
                    name:
                      type: string
                    email:
                      type: string
      responses:
        '201':
          description: The draft envelope (detail), the pinned template version and the template's signature areas.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
