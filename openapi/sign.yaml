      summary: Replace the positioned fields of a DRAFT envelope.
      description: >
        Each field box must lie inside its real source page. PDF-native geometry. DRAFT only. Requires sign:envelope:create.
        M-A6 §2 — field types SIGNATURE, INITIALS, SIGN_DATE, TEXT, SIGNER_NAME and CHECKBOX (400 v1_field_type otherwise),
        except that an engine-only field returned by the detail may be sent back unchanged with its id (SenderFieldPassthrough).
        A sender never supplies a value (400 sender_value_refused). name_mode applies to SIGNER_NAME only and label,
        group_key, group_rule and min_selected to CHECKBOX only (400 field_config_not_applicable); other 400 reasons:
        name_mode_invalid, checkbox_label_invalid, checkbox_group_invalid, checkbox_group_required,
        checkbox_group_inconsistent, checkbox_group_min_exceeds_size.
        Aramo-Sign-Unified-Product-Amendment-M-A5 §1.5 — a recipient who receives a copy has no fields (400 copy_recipient_has_fields).
        Sign Mobile M-A3 §6 — If-Match is required for native tokens (428 precondition_required) and enforced whenever sent (412 revision_mismatch).
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
