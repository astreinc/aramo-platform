        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signer_id]
              properties:
                signer_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: The hosted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderIssuedSigningSession'
