  /v1/sign/sender/envelopes/{id}/hosted-sessions:
    post:
      operationId: startHostedSigningSession
      summary: Start a hosted (in-person) signing session.
      description: >
        Aramo-Sign-Unified-Product-Amendment-M-A5 §3 — for an IN_PERSON_SIGNER of a SENT / IN_PROGRESS envelope whose turn it is.
        Requires sign:envelope:send, the right to change the envelope (owner, or sign:envelope:manage:all) and the
        sign.in_person_signing capability (403 ESIGN_FEATURE_NOT_AVAILABLE). Revokes the signer's other live sessions, mints a
        30-minute HOSTED session (never past the envelope's expiry) and appends HOSTED_SESSION_STARTED (actor SERVICE, the host).
        The token is returned only in this response; the signer then uses the guest signing routes with it, and a hosted
        session's disclosure needs attested_name. Refusals carry details.reason - 404 signer_not_found; 409
        not_in_person_signer / envelope_not_signable / signer_ineligible / not_your_turn.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signer_id]
              properties:
                signer_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: The hosted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderIssuedSigningSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/sign/sender/envelopes/{id}/self-sign-session:
    post:
      operationId: startSelfSignSession
      summary: Start a self-sign session for the recipient assigned to the caller.
      description: >
        Aramo-Sign-Unified-Product-Amendment-M-A5 §4 — "Sign a document". Requires sign:envelope:send and the right to change
        the envelope; the recipient must be bound to the caller by Assign to me (sign:envelope:manage:all never substitutes:
        403 not_bound_to_you) and the caller's verified account email must still equal the recipient email (403
        email_not_verified). The envelope must be signable and (in order) it must be that recipient's turn (409
        envelope_not_signable / signer_ineligible / not_your_turn). Mints a 30-minute SELF session and appends
        SELF_SIGN_SESSION_ISSUED; the emailed link stays valid. signer_id is optional (the first recipient bound to the caller).
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                signer_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: The self-sign session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderIssuedSigningSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
