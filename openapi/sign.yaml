  /v1/sign/sender/envelopes/from-template:
    post:
      operationId: createSenderEnvelopeFromTemplate
      summary: Create a DRAFT envelope from a document template (DOC-TEMPLATE-LIB-1 T-5).
      description: >
        Requires sign:envelope:create and document_template:read; refused for a PERSONAL tenant and while sign.templates is not available. Documents (apps/api) renders the template with the organization's branding and the sender's values into a frozen revision pinned to the exact template version; the draft's document references it (CORE_REF) and records the template + version (template provenance, M-A6 §3.6). With `signer`, that first signer is added and the template's signature area is placed for them. Amendment M-A6 §3.5 — with `recipients` (mutually exclusive with `signer`; only for a template with signing roles) each SIGNER role is bound to exactly one recipient (signing order = role order) and its signature blocks are placed for them; `cc` binds CC roles as copy recipients (delivery at completion); emails are distinct across all of them; `routing_mode`, `message` and `subject` default to the template's. Every refusal (details.reason: signer_and_recipients, recipients_required, template_has_roles, template_has_no_roles, unknown_role, role_not_signer, role_not_cc, role_bound_twice, role_unbound, duplicate_email, routing_mode_invalid, too_many_signers, too_many_copy_recipients) happens before the render. Idempotent on idempotency_key for the render.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_id]
              properties:
                template_id:
                  type: string
                  format: uuid
                values:
                  type: object
                  additionalProperties:
                    type: string
                subject:
                  type: string
                  maxLength: 200
                idempotency_key:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{8,128}$'
                signer:
                  type: object
                  required: [name, email]
                  properties:
                    name:
                      type: string
                    email:
                      type: string
                recipients:
                  type: array
                  maxItems: 10
                  description: M-A6 §3.5 — one recipient per SIGNER role of the template (mutually exclusive with signer).
                  items:
                    $ref: '#/components/schemas/SenderTemplateRoleBinding'
                cc:
                  type: array
                  maxItems: 10
                  description: M-A6 §3.5 / M-A5 — copy recipients for CC roles of the template (delivery at completion).
                  items:
                    $ref: '#/components/schemas/SenderTemplateRoleBinding'
                routing_mode:
                  type: string
                  enum: [PARALLEL, SEQUENTIAL]
                message:
                  type: [string, 'null']
                  maxLength: 1000
      responses:
        '201':
          description: The draft envelope (detail), the pinned template version, the template's signature areas and its signing roles.
          content:
            application/json:
              schema:
                type: object
                required: [envelope, template, suggested_fields, field_definitions, signing]
                properties:
                  envelope:
                    type: object
                  template:
                    type: object
                    required: [template_id, version_id, version_number]
                    properties:
                      template_id:
                        type: string
                        format: uuid
                      version_id:
                        type: string
                        format: uuid
                      version_number:
                        type: integer
                  suggested_fields:
                    type: array
                    items:
                      $ref: '#/components/schemas/SenderTemplateSignatureField'
                  field_definitions:
                    type: array
                    items:
                      type: object
                  signing:
                    oneOf:
                      - $ref: '#/components/schemas/SenderTemplateSigning'
                      - type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: A template value the Documents API refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
