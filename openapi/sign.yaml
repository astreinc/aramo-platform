  /v1/sign/inbox/{id}/sign:
    post:
      operationId: signFromInbox
      summary: 'A fresh short-lived signing link for this recipient while signable; the emailed link stays valid.'
      description: >
        Session (esign consumer) only; no Sign scope required; every read is keyed by the signed-in user. Sign Mobile M-A2 §2.2 —
        every call revalidates in one transaction - the association is active and the caller's, the envelope is signable, the
        signer is eligible (PENDING or VIEWED, same email as at claim), it is their turn when signing in order, and the link the
        claim was made with has not been replaced or expired. 409 details.reason association_inactive | envelope_not_signable |
        signer_ineligible | not_your_turn | session_revoked | link_expired. The session lasts at most 30 minutes, never outlives
        the claimed link or the envelope, and is recorded on the ledger (RECIPIENT_INBOX_SESSION_ISSUED).
        Aramo Sign W2 - {id} may also be a discovered item's opaque handle (source discovered). The handle only names the
        recipient; the server re-runs the discovery rule (verified current account email, sent at or after that proof, no
        binding) and the same revalidation (a discovered item has no binding, so its link check is a live emailed link of the
        recipient), then mints the same session, audited with discovery verified_account_email. A tampered, expired or another
        user's handle, or discovery being off, answers 404 details.reason inbox_item_not_found.
      tags: [inbox]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/InboxItemId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [signing_url, expires_at]
                properties:
                  signing_url:
                    type: string
                    description: The guest signing link (holds a capability token - keep it in memory only; never persist or log it).
                  expires_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/sign/inbox/{id}/signed-copy:
    post:
      operationId: signedCopyFromInbox
      summary: 'A short-lived signed-copy link once complete and signed by this recipient.'
      description: Session (esign consumer) only; no Sign scope required; every read is keyed by the signed-in user.
      tags: [inbox]
