    post:
      operationId: issueSignAccessToken
      summary: Issue a short-lived Sign API access token.
      description: >
        client_credentials (APPLICATION mode; installation-bound credential) or
        urn:ietf:params:oauth:grant-type:token-exchange (USER mode; subject_token = the user's Aramo access token,
        verified and authority-resolved server-side). Client credentials in the body or HTTP Basic. Tokens live at most
        300 seconds and never beyond the subject token; they are audience-bound (aramo-sign-api), tenant-scoped and
        revoked with their installation or credential. Refusals never reveal whether a client exists (401 invalid_client).
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignTokenRequest'
      responses:
        '200':
          description: The access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
