openapi: 3.1.0
info:
  title: Aramo Native E-Sign Service (DOC-3)
  version: 0.1.0
  description: >
    The ATS-neutral Native E-Sign Service Core (apps/sign-service). The
    `/v1/sign/envelopes` surface is the provider seam apps/api's
    SignatureProviderPort HTTP adapter calls (trusted service-to-service; the
    authoritative tenant_id is supplied by the caller). The `/v1/sign/signing`
    surface is the public signer transport — tenant context is resolved from the
    capability token, never accepted from the client. Transport only: no
    RTR/Submittal/Offer/recruiter-workflow logic (those consume this seam in DOC-5/6).
tags:
  - name: sender
    description: The Aramo Sign API — authenticated workspace, guest signing and billing on the one Sign host (sign.aramo.ai).
  - name: billing
    description: Aramo Sign self-service billing (plans, account, Stripe checkout and portal, provider webhook).
  - name: platform
    description: >
      The Aramo Sign API for integrating applications (Sign Unified Product S-4). Authenticate at
      /v1/sign/oauth/token, then call /v1/sign/api/* with the short-lived bearer token. Effective
      authority = principal authority ∩ installation grants ∩ delegated scope. First-party exposure first;
      public third-party activation is separately authorized.
  - name: integrations
    description: Installation administration in the Sign workspace (sign:integration:manage).
  - name: inbox
    description: >
      "Waiting for me" (Sign Unified Product S-7). A recipient right — any signed-in Sign user, with or without a Sign
      role. A document joins only through a recipient-specific binding (the recipient's live signing link AND the user's
      verified email); the binding grants no membership in the sender's organization.
paths:
  /v1/sign/envelopes:
    post:
      operationId: createSignatureEnvelope
      summary: Create a signature envelope (DRAFT) with documents + signers.
      description: Trusted service-to-service; the authoritative tenant_id is supplied by the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvelopeRequest'
      responses:
        '201':
          description: The created envelope summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/sign/envelopes/{id}/send:
    post:
      operationId: sendSignatureEnvelope
      summary: Send the envelope (DRAFT -> SENT); issues signer capability sessions.
      description: Transitions DRAFT to SENT and issues one signing capability session per signer.
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: The updated envelope summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSummary'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/sign/envelopes/for-document:
    get:
      operationId: findEnvelopeForDocument
      summary: Reverse-resolve the single NON-TERMINAL envelope for a document revision (COMM-RECRUITER-W1).
      description: >
        E-Sign owns envelope identity; Documents never store envelope_id. Returns the
        single non-terminal (DRAFT|SENT|IN_PROGRESS) envelope for the exact
        (tenant_id, document_ref, document_revision_ref), or null when none. Fails
        closed with ESIGN_ENVELOPE_AMBIGUOUS (409) when more than one exists.
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: document_ref
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: document_revision_ref
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The single non-terminal envelope, or null.
          content:
            application/json:
              schema:
                type: object
                required: [envelope]
                properties:
                  envelope:
                    oneOf:
                      - $ref: '#/components/schemas/EnvelopeSummary'
                      - type: 'null'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/sign/envelopes/{id}/remind:
    post:
      operationId: remindSignatureEnvelope
      summary: Send a reminder on an already-sent envelope (COMM-RECRUITER-W1); NOT a resend.
      description: >
        Same-envelope reminder for a SENT|IN_PROGRESS envelope. Revokes each
        incomplete signer's prior non-terminal session, issues exactly one new
        session + capability token, records a SIGNATURE_REMINDER_SENT event and a
        NotificationDelivery, and dispatches the reminder link. Never a DRAFT->SENT
        transition and never a new envelope. ESIGN_REMINDER_NOT_ALLOWED (409) when
        the envelope is not remindable.
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id: { type: string, format: uuid }
      responses:
        '200':
          description: The (unchanged-status) envelope summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSummary'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sign/envelopes/{id}:
    get:
      operationId: getSignatureEnvelope
      summary: Get an envelope summary.
      description: Returns the tenant-scoped envelope summary; a cross-tenant id is a 404.
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The envelope summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSummary'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sign/envelopes/{id}/void:
    post:
      operationId: voidSignatureEnvelope
      summary: Void an envelope.
      description: Voids a non-terminal envelope with a recorded reason.
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, reason]
              properties:
                tenant_id:
                  type: string
                  format: uuid
                reason:
                  type: string
      responses:
        '200':
          description: The voided envelope summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSummary'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/sign/envelopes/{id}/evidence:
    get:
      operationId: getSignatureEvidence
      summary: Retrieve envelope evidence metadata (event-chain hash + software signature).
      description: Returns evidence metadata (hashes + signature); verifiable independently of signing.
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The evidence summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceSummary'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sign/envelopes/{id}/executed:
    get:
      operationId: getExecutedArtifacts
      summary: Pull executed document bytes + certificate (base64) for the Documents write-back.
      description: Service-to-service pull for the Documents write-back; bytes are base64 (the event bus carries only refs).
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Executed artifacts (bytes never traverse the event bus).
          content:
            application/json:
              schema:
                type: object
                required: [envelope_id, documents, certificate]
                properties:
                  envelope_id:
                    type: string
                    format: uuid
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        envelope_document_id: { type: string, format: uuid }
                        document_ref: { type: [string, 'null'], format: uuid }
                        document_revision_ref: { type: [string, 'null'], format: uuid }
                        executed_sha256: { type: string }
                        byte_size: { type: integer }
                        executed_base64: { type: string }
                  certificate:
                    type: [object, 'null']
                    properties:
                      certificate_sha256: { type: string }
                      byte_size: { type: integer }
                      certificate_base64: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sign/signing/exchange:
    post:
      operationId: exchangeSigningToken
      summary: Exchange a raw capability token for an active signing session.
      description: The tenant is resolved server-side from the capability token; the client sends no tenant id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: The resolved signing session context.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                    format: uuid
                  envelope_id:
                    type: string
                    format: uuid
                  signer_id:
                    type: string
                    format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/sign/signing/document:
    post:
      operationId: getSignerDocumentView
      summary: The signer's document view — positioned fields + document metadata.
      description: >-
        PX-V1 F3 — token-authorized, disclosure-gated. Tenant is resolved
        server-side from the capability token; the response carries no tenant id
        and no source bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Document metadata + the signer's positioned fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        document_id: { type: string, format: uuid }
                        title: { type: string }
                        ordinal: { type: integer }
                  fields:
                    type: array
                    items:
                      type: object
                      properties:
                        field_id: { type: string, format: uuid }
                        document_id: { type: string, format: uuid }
                        field_type: { type: string }
                        page_number: { type: integer }
                        x: { type: number }
                        y: { type: number }
                        width: { type: [number, 'null'] }
                        height: { type: [number, 'null'] }
                        required: { type: boolean }
                        filled:
                          type: boolean
                          description: True once this signer has filled the field (lets the signer page restore progress).
                        value:
                          type: [string, 'null']
                          description: >-
                            The signer's own entered value for their field (typed text, date, or drawn-signature data URL);
                            null otherwise. M-A6 §2.4 — for a server-filled name (server_filled true) it is the name the
                            server fills. Other signers' values are never returned.
                        label:
                          type: [string, 'null']
                          description: M-A6 §2.3 — the check box caption (CHECKBOX only).
                        group_key:
                          type: [string, 'null']
                          description: M-A6 §2.3 — boxes sharing a key form a group (CHECKBOX only).
                        group_rule:
                          type: [string, 'null']
                          enum: [SELECT_ONE, SELECT_ANY, null]
                        min_selected:
                          type: [integer, 'null']
                          minimum: 1
                          description: M-A6 §2.3 — the boxes a required group needs checked (null means 1).
                        name_mode:
                          type: [string, 'null']
                          enum: [SIGNER_PROFILE, SIGNER_ENTERED, null]
                          description: M-A6 §2.2 — SIGNER_NAME only; null for engine name fields, which the signer types.
                        server_filled:
                          type: boolean
                          description: M-A6 §2.2 — true for a SIGNER_PROFILE name; shown read-only, never filled by the client.
                  message:
                    type: [string, 'null']
                    maxLength: 1000
                    description: Sign Mobile M-A3 §3 — the sender's plain-text message (sender-supplied; not part of the signed document). Render as text, never markup.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Disclosure not yet accepted for this signer.
  /v1/sign/signing/source:
    post:
      operationId: getSignerDocumentSource
      summary: The frozen source PDF bytes for a document in the signing session.
      description: >-
        PX-V1 F3 — token-authorized, disclosure-gated. Bytes are resolved
        mode-agnostically (OWNED → E-Sign object storage, CORE_REF → Documents
        pull) and returned base64; the response carries no tenant id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, document_id]
              properties:
                token: { type: string }
                document_id: { type: string, format: uuid }
      responses:
        '200':
          description: The base64-encoded source PDF plus its content type.
          content:
            application/json:
              schema:
                type: object
                properties:
                  source_base64: { type: string }
                  content_type: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Disclosure not yet accepted for this signer.
  /v1/sign/signing/disclosure-text:
    post:
      operationId: getSignerDisclosureText
      summary: The current server-held electronic-records-and-signature disclosure.
      description: >-
        Aramo Sign launch (A-7) — token-authorized. Returns the current disclosure
        version, its exact text and the sha256 of that text. The signer app shows
        the text and sends the version and hash back to /disclosure, which refuses
        any version E-Sign does not hold or any mismatching hash. No tenant id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: The current disclosure.
          content:
            application/json:
              schema:
                type: object
                required: [disclosure_version, text, text_sha256]
                properties:
                  disclosure_version: { type: string }
                  text: { type: string }
                  text_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
                  message:
                    type: [string, 'null']
                    maxLength: 1000
                    description: Sign Mobile M-A3 §3 — the sender's plain-text message for the consent screen (not part of the disclosure text or its hash). Render as text, never markup.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The envelope is no longer signable (ENVELOPE_ALREADY_EXECUTED).
  /v1/sign/signing/executed:
    post:
      operationId: getSignerExecutedCopy
      summary: The signer's signed copy of a completed envelope.
      description: >-
        Aramo Sign launch — authorized by the time-limited access token from the
        completion email (not a signing session). Returns the executed document(s)
        and the certificate of completion of a COMPLETED envelope, base64. Only the
        token's hash is stored; tenant is resolved server-side; no tenant id in the
        response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: The signed documents and certificate.
          content:
            application/json:
              schema:
                type: object
                required: [subject, completed_at, documents, certificate_base64]
                properties:
                  subject: { type: string }
                  completed_at: { type: [string, 'null'], format: date-time }
                  documents:
                    type: array
                    items:
                      type: object
                      required: [title, content_type, executed_base64]
                      properties:
                        title: { type: string }
                        content_type: { type: string }
                        executed_base64: { type: string }
                  certificate_base64: { type: [string, 'null'] }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/sign/signing/copy:
    post:
      operationId: getRecipientCopy
      security: []
      summary: A copy recipient's view of the documents sent for signature (ON_SEND copy).
      description: >-
        Aramo-Sign-Unified-Product-Amendment-M-A5 §2.2 — authorized by the COPY_VIEW access token from the RECIPIENT_COPY
        email (not a signing session). Returns the SOURCE documents only, base64: values are stamped only at completion,
        so they carry no signer data. No recipient list, signer data, tenant id or internal id is returned. Refused (401)
        for an unknown or expired token, an executed-copy token, and a draft, voided, declined or expired envelope. Only
        the token's hash is stored; tenant is resolved server-side; each use is counted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: The source documents.
          content:
            application/json:
              schema:
                type: object
                required: [subject, sent_at, documents]
                additionalProperties: false
                properties:
                  subject: { type: string }
                  sent_at: { type: [string, 'null'], format: date-time }
                  documents:
                    type: array
                    items:
                      type: object
                      required: [title, content_type, source_base64]
                      additionalProperties: false
                      properties:
                        title: { type: string }
                        content_type: { type: string }
                        source_base64: { type: string, description: 'The source PDF, base64.' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  # Sign Mobile B-12 — the signer operations the guest transport (web and the Aramo
  # Sign app) calls; tenant context comes from the capability token only.
  /v1/sign/signing/disclosure:
    post:
      operationId: acceptSignerDisclosure
      security: []
      summary: Accept the electronic-records-and-signature disclosure for this signer.
      description: >-
        Token-authorized. Send back the disclosure_version and the text_sha256 that
        /disclosure-text returned; a version E-Sign does not hold, or a hash that does
        not match, is refused 400. Records the acceptance (with the caller's IP and
        user agent) and DISCLOSURE_ACCEPTED on the ledger. Fields can be filled, and
        the signer can complete, only after this.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, disclosure_version, disclosure_text_hash]
              properties:
                token: { type: string }
                disclosure_version: { type: string }
                disclosure_text_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
                attested_name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: >-
                    Aramo-Sign-Unified-Product-Amendment-M-A5 §3.4 — required in a hosted (in-person) session: the name the
                    signer confirms (400 attested_name_required without it). Ignored for other sessions. Kept with the
                    acceptance; the ledger records only its sha256.
      responses:
        '200':
          description: The disclosure was accepted.
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: boolean, const: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: >-
            The envelope is no longer signable (ENVELOPE_ALREADY_EXECUTED / ENVELOPE_ILLEGAL_TRANSITION), or it is not this
            signer's turn in a sequential envelope (SIGNER_NOT_YET_ELIGIBLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/signing/fields/{fieldId}/fill:
    post:
      operationId: fillSignerField
      security: []
      summary: Fill one of the signer's own fields.
      description: >-
        Token-authorized and disclosure-gated, under the envelope row lock with a live
        session; only this signer's field can be filled, and the value replaces any
        earlier one until the signer completes. value is the typed text, the date, or
        the signature / initials image as a PNG or JPEG data URL; signature_method
        records how a SIGNATURE or INITIALS value was made. A saved signature (/v1/sign/me/signature)
        is a convenience only: the value is always sent here and copied into the signing record.
        M-A6 §2 — a CHECKBOX or ACKNOWLEDGEMENT value is 'true' (checked) or 'false' (unchecked;
        unchecking is allowed), anything else is refused with 400 reason checkbox_value_invalid.
        A SIGNER_NAME field with name_mode SIGNER_PROFILE is filled by the server and any value
        sent for it is refused with 400 reason signer_profile_name_server_filled.
      parameters:
        - name: fieldId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, value]
              properties:
                token: { type: string }
                value: { type: string }
                signature_method:
                  type: string
                  enum: [TYPED, DRAWN]
      responses:
        '200':
          description: The field was filled.
          content:
            application/json:
              schema:
                type: object
                required: [filled]
                properties:
                  filled: { type: boolean, const: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: SIGNER_NOT_FOUND — the field is not one of this signer's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            DISCLOSURE_NOT_ACCEPTED, SIGNER_NOT_YET_ELIGIBLE (not this signer's turn), or the envelope is no longer
            signable (ENVELOPE_ALREADY_EXECUTED / ENVELOPE_ILLEGAL_TRANSITION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/signing/complete:
    post:
      operationId: completeSigner
      security: []
      summary: Finish signing for this signer.
      description: >-
        Token-authorized and disclosure-gated. Every required field of this signer must
        be filled (409 SIGNATURE_FIELD_INCOMPLETE otherwise). M-A6 §2.3 — a required check
        box must be checked; a SELECT_ONE group needs exactly one box checked when required
        (never more than one); a required group needs at least min_selected boxes checked
        (default 1). The failing rule is details.reason: required_field_unfilled,
        checkbox_required_unchecked, checkbox_group_select_one or checkbox_group_min_selected
        (with details.group_key for a group). The server fills every SIGNER_PROFILE name field
        of the signer when they complete. When this was the last
        signer the envelope is executed and envelope_status is COMPLETED; otherwise it
        is IN_PROGRESS and, when signing in order, the next signer is invited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: The signer completed.
          content:
            application/json:
              schema:
                type: object
                required: [envelope_status]
                properties:
                  envelope_status:
                    type: string
                    enum: [IN_PROGRESS, COMPLETED]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: >-
            SIGNATURE_FIELD_INCOMPLETE, DISCLOSURE_NOT_ACCEPTED, SIGNER_NOT_YET_ELIGIBLE (not this signer's turn), or the
            envelope is no longer signable (ENVELOPE_ALREADY_EXECUTED / ENVELOPE_ILLEGAL_TRANSITION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/signing/decline:
    post:
      operationId: declineSigning
      security: []
      summary: Decline to sign, with a reason.
      description: >-
        Token-authorized. Ends the envelope as DECLINED with the signer's reason (shown to
        the sender; the other open signers learn the envelope ended). When signing in
        order, a signer may decline only on their turn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, reason]
              properties:
                token: { type: string }
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: The envelope was declined.
          content:
            application/json:
              schema:
                type: object
                required: [declined]
                properties:
                  declined: { type: boolean, const: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The envelope is no longer open (ENVELOPE_ILLEGAL_TRANSITION), or it is not this signer's turn (SIGNER_NOT_YET_ELIGIBLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/sender/context:
