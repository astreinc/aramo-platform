        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderEnvelopeDetail'
          headers:
            ETag:
              $ref: '#/components/headers/EnvelopeETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReuse'
