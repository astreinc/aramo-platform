        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A signed copy is available once everyone has signed (ENVELOPE_ILLEGAL_TRANSITION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/inbox/{id}/report:
    post:
      operationId: reportFromInbox
      summary: 'Report this envelope from the recipient inbox (the app''s received-envelope view).'
      description: >
        Aramo-Sign-Mobile-Amendment-M-A7 §5.2 (R-11). Session (esign consumer) only; no Sign scope required; keyed by the
        signed-in user's own inbox item, so no signing token travels. The same report flow as "Report this email"
        (POST /v1/sign/report): one report per recipient per envelope (409 details.reason already_reported); a Business
        sender's report is recorded for Aramo operators and never pauses the sender; a Personal sender's report follows the
        Personal automatic pause rules. Bounded per user; over the budget the answer is the same 202 and nothing is recorded.
      tags: [inbox]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: [string, 'null']
                  enum: [phishing, impersonation, spam, unknown_sender, other, null]
                note:
                  type: [string, 'null']
                  maxLength: 1000
      responses:
        '202':
          description: The report was received.
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received:
                    type: boolean
                    enum: [true]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: This recipient already reported this envelope (details.reason = already_reported).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/inbox/{id}:
    delete:
      operationId: removeFromInbox
      summary: 'Remove the binding (the user’s own only).'
      description: Session (esign consumer) only; no Sign scope required; every read is keyed by the signed-in user.
      tags: [inbox]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed: { type: boolean, const: true }
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/sender/activity:
    get:
      operationId: listSenderActivity
      summary: Tenant-wide envelope activity (newest first).
      description: >
        Requires sign:envelope:read.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/SenderLimit'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SenderLedgerEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/report:
    post:
      operationId: reportSigningEmail
      summary: Report a signing email ("Report this email").
      description: >
        Aramo-Sign-Personal-Free-Launch-Directive-v1_1-LOCKED §6.4 and Aramo-Sign-Mobile-Amendment-M-A7 §5.2.
        Public (no session): the recipient's own signing token (carried in the report link's URL
        fragment) is the only authority. One report per recipient per envelope; taken for every
        sender (since M-A7 every signing request and reminder email carries the link). Each report
        is weighted (severity × independence × credibility). A BUSINESS sender's report is recorded
        for Aramo operators (GET /platform/sign-abuse-reports) and never pauses the sender. For a
        PERSONAL sender, when the weighted total reaches the configured threshold, new sends from
        that account pause for 72 hours (existing envelopes and guest signing are unaffected) and
        the account is queued for review; the pause lapses unless an operator confirms it.
        Bounded per client address (edge and service); over the service budget the answer is
        the same 202 and nothing is recorded.
      tags: [sender]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: The recipient's signing token from the report link.
                reason:
                  type: [string, 'null']
                  enum: [phishing, impersonation, spam, unknown_sender, other, null]
                note:
                  type: [string, 'null']
                  maxLength: 1000
      responses:
        '202':
          description: The report was received.
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received:
                    type: boolean
                    enum: [true]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: The report link cannot be used (unknown or expired token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: This recipient already reported this envelope (details.reason = already_reported).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/legal/status:
    get:
      operationId: getSignLegalStatus
      summary: The legal documents the signed-in user still has to accept.
      description: >
        Aramo Sign Personal (Free). For the signed-in user of a PERSONAL tenant: every current
        APPROVED version of the Personal Terms of Service, the Aramo Privacy Notice and the Aramo
        Acceptable Use Policy that this user has not accepted (at signup or in the workspace) for
        that exact version and text. ToS v2.0: once the Aramo Sign Terms of Service
        (`sign.terms_of_service`) 2.0 is in effect it replaces the Personal Terms for PERSONAL
        tenants, and a user of a BUSINESS tenant owes it too until accepted (before then a
        BUSINESS tenant has nothing pending). Sending is refused (details.reason =
        legal_acceptance_required) while anything is pending. Requires a Sign session of a tenant
        entitled to `sign`.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignLegalStatus'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/legal/accept:
    post:
      operationId: acceptSignLegalDocuments
      summary: Accept the current versions of the legal documents owed.
      description: >
        Aramo Sign Personal (Free). Each item must name a legal document owed by the tenant's kind
        and its CURRENT approved version exactly; otherwise the whole request is refused
        (details.reason = legal_version_not_current) and nothing is recorded. Records one
        acceptance per user, document and version (idempotent) with the version, the text SHA-256,
        the time, the client address and the user agent. For a BUSINESS tenant it is refused
        (details.reason = legal_acceptance_not_applicable) while no Business document is in
        effect (ToS v2.0: the Aramo Sign Terms of Service once in effect). Answers the documents
        still pending.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accept]
              properties:
                accept:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    required: [key, version]
                    properties:
                      key:
                        type: string
                        maxLength: 100
                      version:
                        type: string
                        maxLength: 20
      responses:
        '200':
          description: Accepted; the documents still pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignLegalStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/legal/notices:
    get:
      operationId: getSignLegalNotices
      summary: Upcoming legal-document versions to show the signed-in user (in-service notice).
      description: >
        Privacy Notice 1.1 remediation E-6. Every announced change to a legal document whose new
        version takes effect after today (UTC date) and that concerns this account (a document
        that binds only Personal accounts is not listed for a BUSINESS tenant), minus the notices
        this user has dismissed. Empty while nothing is announced. Requires a Sign session of a
        tenant entitled to `sign`.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignLegalNotices'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/legal/notices/record:
    post:
      operationId: recordSignLegalNotice
      summary: Record that an upcoming-version notice was shown to, or dismissed by, the user.
      description: >
        Privacy Notice 1.1 remediation E-6 — in-service delivery evidence. SHOWN records the
        delivery once (channel IN_SERVICE, the first time it was shown); ACKNOWLEDGED records the
        dismissal once, after which the notice is no longer listed for this user. Idempotent. The
        notice must be one currently listed for this account, otherwise refused (details.reason =
        legal_notice_not_upcoming). Answers the notices still to show.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, version, event]
              properties:
                key:
                  type: string
                  maxLength: 100
                version:
                  type: string
                  maxLength: 20
                event:
                  type: string
                  enum: [SHOWN, ACKNOWLEDGED]
      responses:
        '200':
          description: Recorded; the notices still to show.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignLegalNotices'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/account/status:
    get:
      operationId: getSignAccountStatus
      summary: Whether the signed-in user's account can be closed, and whether it is closed.
      description: >
        Aramo Sign Personal (Free). closable is true only for the owner (tenant_owner) of an open
        PERSONAL account; a BUSINESS account is never closable here (its organization administrator
        or the operator closes it). closed is true once the account was closed (by its owner or the
        operator); closed_at is when. Requires a Sign session of a tenant entitled to `sign`.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignAccountStatus'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/account/close:
    post:
      operationId: closeSignAccount
      summary: Close the signed-in owner's Personal account.
      description: >
        Aramo Sign Personal (Free) — Settings → Close account. The owner (tenant_owner) of a
        PERSONAL account closes it: sending stops immediately and for good; envelopes already sent
        stay open for their signers. The same close the operator performs, audited with the owner as
        the actor. Requires confirm = CLOSE (else details.reason = account_close_confirmation_required).
        Refused for a BUSINESS account (details.reason = business_account_close_via_organization) and
        for a caller who is not the owner (details.reason = not_account_owner). A PERSONAL account
        without a Personal risk state cannot be closed here (404, details.reason =
        personal_account_not_closable). Closing a closed account answers its closed state.
        Requires a Sign session of a tenant entitled to `sign`.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: string
                  enum: [CLOSE]
                reason:
                  type: string
                  maxLength: 500
                  description: Optional note from the owner, kept with the audit record.
      responses:
        '200':
          description: The account is closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignAccountClosed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sign/me/privacy-requests:
    get:
      operationId: listMyPrivacyRequests
      summary: The signed-in user's privacy requests (newest first).
      description: >
        Aramo-Sign-Mobile-Amendment-M-A7 §3. Every account type (Personal and Business). Only the
        caller's own requests in the session's organization. Requires a Sign session of a tenant
        entitled to `sign`.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SignPrivacyRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
    post:
      operationId: createMyPrivacyRequest
      summary: Request deletion (or access, export, correction) of the signed-in user's Aramo Sign data.
      description: >
        Aramo-Sign-Mobile-Amendment-M-A7 §3. The session validates identity: the request is
        RECEIVED, IDENTITY_VALIDATED and inventoried (counts only), with a public reference and a
        30-day due date. DELETION needs confirm = DELETE (details.reason =
        deletion_confirmation_required). For the owner of a PERSONAL account the account is closed
        now (sending stops; saved signatures, contacts, notifications and push devices are
        deleted); for a Business member the request is referred to the organization for the
        documents it owns, Aramo remaining responsible. Further deletion (sessions, drafts and
        their stored files, the account lifecycle, Sign access) runs only while staged execution is
        enabled; otherwise the request waits for the Aramo privacy team. One open request per type:
        a repeat answers the open request with 200.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                request_type:
                  type: string
                  enum: [DELETION, ACCESS, EXPORT, CORRECTION]
                  default: DELETION
                confirm:
                  type: string
                  enum: [DELETE]
                  description: Required for DELETION.
      responses:
        '200':
          description: An open request of this type already exists; it is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignPrivacyRequest'
        '201':
          description: The request was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignPrivacyRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/me/privacy-requests/{reference}:
    get:
      operationId: getMyPrivacyRequest
      summary: One of the signed-in user's privacy requests, by its reference.
      description: >
        Aramo-Sign-Mobile-Amendment-M-A7 §3.3. A reference of another user or organization
        answers 404 (details.reason = privacy_request_not_found).
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
            example: PR-7K3M-9QX2-H4TD
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignPrivacyRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sign/privacy-requests/start:
    post:
      operationId: startPrivacyRequest
      summary: Start a privacy request on the web (no sign-in); a one-time link is emailed.
      description: >
        Aramo-Sign-Mobile-Amendment-M-A7 §3.3 (https://sign.aramo.ai/delete-account). Public. The
        answer is the same 202 whether or not the email has an account (no enumeration), and
        over the per-address or per-email budget nothing is sent. The emailed link carries a
        one-time token in its URL fragment, valid for one hour. 503 (details.reason =
        privacy_requests_unavailable) when the service key is not configured.
      tags: [sender]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 320
                request_type:
                  type: string
                  enum: [DELETION, ACCESS, EXPORT, CORRECTION]
                  default: DELETION
      responses:
        '202':
          description: Received (the same answer in every case).
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received:
                    type: boolean
                    enum: [true]
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: Online privacy requests are not available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/privacy-requests/verify:
    post:
      operationId: verifyPrivacyRequest
      summary: Prove ownership of the email with the one-time token; the request is created.
      description: >
        Aramo-Sign-Mobile-Amendment-M-A7 §3.1. The token (from the link's URL fragment) travels only
        in this body. The request is RECEIVED, IDENTITY_VALIDATED (email ownership) and inventoried,
        and waits for the Aramo privacy team. Reusing the token within its hour answers the same
        request. An unknown, expired or used token answers 404 (details.reason = privacy_link_invalid).
      tags: [sender]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignPrivacyRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sign/privacy-requests/status:
    post:
      operationId: getPrivacyRequestStatus
      summary: The status of a privacy request by its reference and the requester's email.
      description: >
        Aramo-Sign-Mobile-Amendment-M-A7 §3.3. Public. Both must match; anything else answers the
        same 404 (details.reason = privacy_request_not_found).
      tags: [sender]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, email]
              properties:
                reference:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignPrivacyRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sign/billing/plans:
    get:
      operationId: listBillingPlans
      summary: Sellable Aramo Sign plans and their included allowances.
      description: >
        Prices are held by the billing provider and shown on its checkout page. purchasable is false when online billing is not configured. Requires the esign consumer and the tenant esign capability.
        Sign Mobile M-A12 R-2 (A5) — filtered to the caller's tenant kind: a PERSONAL tenant sees PERSONAL plans only, a BUSINESS tenant BUSINESS plans only (plans of no kind are listed for both).
        Each plan carries its pinned store products (empty while store billing is off) and the regional list price for the caller's billing country (A1-3).
      tags: [billing]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - name: country
          in: query
          required: false
          description: M-A12 A1-3 — the caller's billing country (the app sends the store storefront country, ISO 3166-1 alpha-2). Absent ⇒ a PERSONAL tenant's declared residence; else none.
          schema:
            type: string
            pattern: '^[A-Za-z]{2}$'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [plans, terms, sales_contact_url]
                properties:
                  plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/BillingPlan'
                  terms:
                    type: [object, 'null']
                    description: The APPROVED Terms of Service a checkout must accept (version, url); null while none is approved.
                  sales_contact_url:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/billing/account:
    get:
      operationId: getBillingAccount
      summary: The organization's Aramo Sign plan, subscription status, period and usage.
      description: >
        Backend-authoritative. Requires sign:envelope:read or sign:billing:manage. can_manage_billing is true for a BUSINESS tenant principal holding sign:billing:manage (ROLES-1 §3.4 — the organization owner, tenant_owner; tenant:admin:settings alone no longer manages billing).
      tags: [billing]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccount'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/billing/checkout:
    post:
      operationId: startBillingCheckout
      summary: Start a Stripe Checkout session for a sellable plan.
      description: >
        Requires sign:billing:manage (the organization owner, tenant_owner — ROLES-1 §3.4) in a BUSINESS tenant. Return URLs are built by the server. The subscription opens only when the verified provider webhook (or reconciliation) confirms it; the subscribing user is the tenant's tenant_owner (no product-level owner role is granted).
      tags: [billing]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_key]
              properties:
                plan_key:
                  type: string
                  maxLength: 100
                accept_terms:
                  type: boolean
                  description: Required true when an approved Terms of Service version exists.
                seats:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  description: >-
                    Sign Business per-seat pricing (directive v1.0 §3.3.1) — the seats to buy on a plan whose
                    price_unit is SEAT (default 1; the provider line-item quantity). Given for a plan priced per
                    organization → 422 seats_not_applicable.
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingRedirect'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '409':
          $ref: '#/components/responses/BillingConflict'
        '422':
          description: VALIDATION_ERROR seats_not_applicable — `seats` was given for a plan priced per organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/BillingUnavailable'
  /v1/sign/billing/seats:
    post:
      operationId: changeBillingSeats
      summary: Sign Business per-seat pricing — change the organization's purchased seats.
      description: >
        Directive v1.0 §3.3.3 (O-2, O-3). The organization owner or an admin (tenant_owner / tenant_admin;
        else 403 seat_manage_role_required) of a BUSINESS tenant whose Stripe-billed self-service subscription
        is priced per seat. An increase changes the provider quantity with proration now (effective NOW); a
        decrease applies at the end of the current period with no refund (effective PERIOD_END;
        pending_purchased until then) and is refused below the seats in use (409 seats_below_usage, details
        used). A plan priced per organization, a store-billed or a contract subscription is refused (409
        seats_not_applicable); the current count is refused (409 seats_unchanged).
      tags: [billing]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seats]
              properties:
                seats:
                  type: integer
                  minimum: 1
                  maximum: 1000
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSeatChange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '409':
          $ref: '#/components/responses/BillingConflict'
        '503':
          $ref: '#/components/responses/BillingUnavailable'
  /v1/sign/billing/portal:
    post:
      operationId: openBillingPortal
      summary: Open the Stripe billing portal (payment method, invoices, cancellation).
      description: Requires sign:billing:manage (the organization owner, tenant_owner — ROLES-1 §3.4).
      tags: [billing]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingRedirect'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '409':
          $ref: '#/components/responses/BillingConflict'
        '503':
          $ref: '#/components/responses/BillingUnavailable'
  /v1/sign/billing/self-service:
    get:
      operationId: getSelfServiceBilling
      summary: CCP-C7 — the organization's Aramo Sign self-service state.
      description: >
        Requires sign:envelope:read or sign:billing:manage. Read only. The product's legal-terms state, its open self-service subscription, every self-service change still pending at the provider (pending_provider; Conversion Rule C-23) and, per action, whether it is available and the stable reason when it is not. The view and the actions run the same gates. While the Sign Terms of Service have no APPROVED version, every action reads available false with reason SELF_SERVICE_TERMS_NOT_APPROVED (the designed disabled state; PBD §10, NOT DELIVERED until approved legal terms).
      tags: [billing]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfServiceBilling'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '503':
          $ref: '#/components/responses/BillingUnavailable'
  /v1/sign/billing/self-service/cancel:
    post:
      operationId: cancelSelfServiceSubscription
      summary: CCP-C7 — the owner's at-period-end cancel of the self-service subscription.
      description: >
        Requires sign:billing:manage (tenant_owner only, ADR-0035 D-3) in a BUSINESS tenant. Refused 503 ESIGN_BILLING_UNAVAILABLE reason self_service_terms_not_approved while the Sign Terms of Service are not APPROVED. Otherwise it records the owner's request and a durable Stripe command (CCP-C1 outbox, idempotency key derived from the request) in one local transaction; the provider call happens later, outside it. 202: pending_provider is true until the applied provider state confirms the cancel. Refused 409 (details.reason) while a governed subscription is open, an activation is held, a conversion is in progress, a provider change is pending, the subscription already ends at the period end, or inside a commitment term (financial_treatment_undefined). A repeat returns the recorded request (replayed true).
      tags: [billing]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '202':
          description: Accepted; pending at the provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfServiceBillingAccepted'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '409':
          $ref: '#/components/responses/BillingConflict'
        '503':
          $ref: '#/components/responses/BillingUnavailable'
  /v1/sign/billing/self-service/upgrade:
    post:
      operationId: upgradeSelfServiceSubscription
      summary: CCP-C7 — the owner's plan change of the self-service subscription (gated; not yet available).
      description: >
        Requires sign:billing:manage (tenant_owner only) in a BUSINESS tenant. Refused 503 reason self_service_terms_not_approved while the Sign Terms of Service are not APPROVED; refused 400 plan_not_available for a plan that is not an eligible, active self-service plan other than the current one; otherwise refused 409 financial_treatment_undefined, because a provider price change has no approved proration or usage-transition treatment (decision request DR-C7-1). Nothing is written and no provider call is made. 202 is reserved for the ruled path.
      tags: [billing]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_key]
              properties:
                plan_key:
                  type: string
                  maxLength: 100
      responses:
        '202':
          description: Reserved (not returned until DR-C7-1 is ruled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfServiceBillingAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '409':
          $ref: '#/components/responses/BillingConflict'
        '503':
          $ref: '#/components/responses/BillingUnavailable'
  /v1/sign/billing/usage:
    get:
      operationId: getBillingUsage
      summary: Sign Feature Parity D-2 — the organization's metered usage this billing period.
      description: >
        Requires sign:envelope:read or sign:billing:manage. Read only. Per-unit usage (SMS and WhatsApp delivery, SMS one-time passcodes, ID verification, knowledge-based checks, qualified signatures, e-stamps) recorded in the usage ledger for the current billing period of the organization's open Sign subscription, priced at the unit prices of its pinned plan version. Amounts are minor units of currency. A unit_price_minor of null means the unit is not sold on the current plan version. While metered billing is off (SIGN_USAGE_BILLING_ENABLED unset, the default) it answers enabled false and period null. period is null when the organization has no open Sign subscription.
      tags: [billing]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingUsage'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '503':
          $ref: '#/components/responses/BillingUnavailable'
  /v1/sign/billing/store/intent:
    post:
      operationId: createStorePurchaseIntent
      summary: Sign Mobile M-A12 — the tenant-bound token for one in-app store purchase.
      description: >
        Requires sign:billing:manage. Dark unless SIGN_STORE_BILLING_ENABLED=1 (503 store_billing_disabled). A1-2 — the tenant must have exactly one active member (the purchaser): PERSONAL buys Personal plans only, BUSINESS Business self-service plans only. An open Stripe or governed subscription refuses (409 billing_managed_elsewhere).
        The app passes app_account_token to the store (iOS appAccountToken; Android obfuscatedAccountId). It equals intent_id.
      tags: [billing]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [platform, product_id]
              properties:
                platform:
                  type: string
                  enum: [ios, android]
                product_id:
                  type: string
                  maxLength: 150
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [intent_id, app_account_token]
                properties:
                  intent_id:
                    type: string
                    format: uuid
                  app_account_token:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '409':
          $ref: '#/components/responses/BillingConflict'
        '503':
          $ref: '#/components/responses/BillingUnavailable'
  /v1/sign/billing/store/verify:
    post:
      operationId: verifyStorePurchase
      summary: Sign Mobile M-A12 — verify one in-app store purchase server-side and apply it.
      description: >
        iOS — the signed transaction's x5c chain to Apple Root CA G3, bundle, environment and appAccountToken are verified, then the state is re-fetched from the App Store Server API. Android — purchases.subscriptionsv2.get for the package and the obfuscated account id (= intent_id); the purchase is acknowledged.
        Idempotent on the store reference. A purchase bound to another tenant → 409 store_purchase_bound_elsewhere; an unverifiable purchase → 422 store_purchase_invalid. Answers the account view.
      tags: [billing]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [platform, product_id, intent_id]
              properties:
                platform:
                  type: string
                  enum: [ios, android]
                product_id:
                  type: string
                  maxLength: 150
                intent_id:
                  type: string
                  format: uuid
                signed_transaction:
                  type: string
                  description: iOS — the StoreKit 2 signed transaction (JWS). Required for ios.
                purchase_token:
                  type: string
                  description: Android — the Play purchase token. Required for android.
      responses:
        '200':
          description: The account view after the purchase is applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '409':
          $ref: '#/components/responses/BillingConflict'
        '422':
          description: The purchase could not be verified (reason store_purchase_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/BillingUnavailable'
  /v1/sign/billing/store/restore:
    post:
      operationId: restoreStorePurchases
      summary: Sign Mobile M-A12 — verify and apply the store purchases the device holds.
      description: >
        Each signed transaction (iOS) or purchase token (Android) is verified as in store/verify and must be bound to this tenant. At most 10. Answers the account view.
      tags: [billing]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [platform]
              properties:
                platform:
                  type: string
                  enum: [ios, android]
                signed_transactions:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                purchase_tokens:
                  type: array
                  maxItems: 10
                  items:
                    type: string
      responses:
        '200':
          description: The account view after the purchases are applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '409':
          $ref: '#/components/responses/BillingConflict'
        '422':
          description: A purchase could not be verified (reason store_purchase_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/BillingUnavailable'
  /v1/sign/billing/webhook/app-store:
    post:
      operationId: receiveAppStoreNotification
      summary: App Store Server Notifications v2 receiver (Sign Mobile M-A12).
      description: >
        No session. Authenticity is the signedPayload's x5c chain to Apple Root CA G3 (and the bundle and environment). The verified event is recorded in the billing webhook inbox; the subscription state is re-fetched from the App Store Server API, never taken from the payload. 404 while store billing is off.
      tags: [billing]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signedPayload]
              properties:
                signedPayload:
                  type: string
      responses:
        '200':
          description: Received.
          content:
            application/json:
              schema:
                type: object
                required: [received, outcome]
                properties:
                  received:
                    type: boolean
                  outcome:
                    type: string
                    enum: [APPLIED, IGNORED, DUPLICATE]
        '401':
          description: The signed payload failed verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Store billing is off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/BillingUnavailable'
  /v1/sign/billing/webhook/google-play:
    post:
      operationId: receiveGooglePlayNotification
      summary: Google Play Real-time Developer Notifications receiver, Pub/Sub push (Sign Mobile M-A12).
      description: >
        No session. Authenticity is the Pub/Sub push OIDC bearer (Google keys, issuer accounts.google.com, the configured audience and service account) and the package name. The verified event is recorded in the billing webhook inbox; the state is re-fetched with purchases.subscriptionsv2.get. 404 while store billing is off.
      tags: [billing]
      security: []
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: object
                subscription:
                  type: string
      responses:
        '200':
          description: Received.
          content:
            application/json:
              schema:
                type: object
                required: [received, outcome]
                properties:
                  received:
                    type: boolean
                  outcome:
                    type: string
                    enum: [APPLIED, IGNORED, DUPLICATE]
        '401':
          description: The push token or message failed verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Store billing is off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/BillingUnavailable'
  /v1/sign/billing/webhook/stripe:
    post:
      operationId: receiveStripeBillingWebhook
      summary: Stripe webhook receiver.
      description: >
        No session. Authenticity is the Stripe-Signature header (HMAC-SHA256 over the raw body, 300 second tolerance). Each event is processed at most once; the subscription state is re-fetched from Stripe before it is applied. A processing failure returns 5xx so Stripe redelivers.
      tags: [billing]
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Received.
          content:
            application/json:
              schema:
                type: object
                required: [received, outcome]
                properties:
                  received:
                    type: boolean
                  outcome:
                    type: string
                    enum: [APPLIED, IGNORED, DUPLICATE]
        '401':
          description: The signature is missing, stale or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/BillingUnavailable'
  # ── Aramo Sign Mobile — saved signatures and private contacts (W2b) ──
  # (Aramo-Sign-Unified-Product-Amendment-M-A3-Mobile-Owned-Data-Contracts-v1_0-LOCKED §4, §5, §9)
  /v1/sign/me/signature:
    get:
      operationId: getSavedSignatures
      summary: The signed-in user's saved default signature and initials (null when none).
      description: >
        Sign Mobile M-A3 §4. Session (sign consumer) only, like the inbox - signing is a recipient right; keyed by the token's
        tenant and user. A convenience only - every signing still submits its value through the fill call, so deleting a saved
        value never changes an executed or in-progress document. Web and mobile alike.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [signature, initials]
                properties:
                  signature:
                    oneOf:
                      - $ref: '#/components/schemas/SavedSignature'
                      - type: 'null'
                  initials:
                    oneOf:
                      - $ref: '#/components/schemas/SavedSignature'
                      - type: 'null'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
    put:
      operationId: putSavedSignature
      summary: Save (or replace) the default signature.
      description: >
        PNG or JPEG data URL only (C-19), at most 256 KiB and 2048 x 2048 pixels. 400 details.reason invalid_signature_kind |
        invalid_typed_name | invalid_font_key | invalid_image | image_too_large.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedSignatureInput'
      responses:
        '200':
          description: The saved value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSignature'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
    delete:
      operationId: deleteSavedSignature
      summary: Delete the default signature (executed records keep the value they were signed with).
      description: >
        Removes only the convenience record (M-A3 §9). Idempotent.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '204':
          description: Deleted (or there was none).
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/me/initials:
    put:
      operationId: putSavedInitials
      summary: Save (or replace) the default initials.
      description: >
        Same body and refusals as PUT /v1/sign/me/signature.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedSignatureInput'
      responses:
        '200':
          description: The saved value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSignature'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
    delete:
      operationId: deleteSavedInitials
      summary: Delete the default initials (executed records keep the value they were signed with).
      description: >
        Removes only the convenience record (M-A3 §9). Idempotent.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '204':
          description: Deleted (or there were none).
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/sender/contacts/{contactId}:
    patch:
      operationId: updateSenderContact
      summary: Update one of the caller's saved contacts.
      description: >
        Requires sign:envelope:create. Owner-isolated - another user's or tenant's contact is 404. Refusals - 400 invalid_contact_name |
        invalid_contact_email | invalid_contact_organization | empty_contact_update; 409 contact_exists.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/ContactId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SenderContactPatch'
      responses:
        '200':
          description: The updated contact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderContact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteSenderContact
      summary: Delete one of the caller's saved contacts.
      description: >
        Requires sign:envelope:create. Owner-isolated - another user's or tenant's contact is 404.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/ContactId'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  # ── Aramo Sign Mobile — notification feed, push device, push preferences ──
  # (Aramo-Sign-Unified-Product-Amendment-M-A3-Mobile-Owned-Data-Contracts-v1_0-LOCKED §1, §2, §9)
  /v1/sign/me/profile:
    get:
      operationId: getSignProfile
      summary: The signed-in user's Sign profile (M-A12 W1-E.1).
      description: >
        Session (sign consumer) only, keyed by the token's tenant and user; web and mobile. Used to prefill FIRST_NAME,
        LAST_NAME, EMAIL, COMPANY and TITLE fields (the signer may edit).
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
