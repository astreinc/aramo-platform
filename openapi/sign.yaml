        Aramo-Sign-Feature-Parity-Program-Directive-v1_0-LOCKED §1.10. Requires sign:envelope:read.
        available reports the `sign.branding` launch availability (false in this release: every
        value is then null); entitled reports whether the organization's plan includes branding;
