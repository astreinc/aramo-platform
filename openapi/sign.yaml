  /v1/sign/billing/webhook/stripe:
    post:
      operationId: receiveStripeBillingWebhook
      summary: Stripe webhook receiver.
      description: >
        No session. Authenticity is the Stripe-Signature header (HMAC-SHA256 over the raw body, 300 second tolerance). Each event is processed at most once; the subscription state is re-fetched from Stripe before it is applied. A processing failure returns 5xx so Stripe redelivers.
      tags: [billing]
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Received.
          content:
            application/json:
              schema:
                type: object
                required: [received, outcome]
                properties:
                  received:
                    type: boolean
                  outcome:
                    type: string
                    enum: [APPLIED, IGNORED, DUPLICATE]
        '401':
          description: The signature is missing, stale or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/BillingUnavailable'
components:
  securitySchemes:
    senderSession:
      type: apiKey
      in: cookie
      name: aramo_access_token_sign
      description: The HttpOnly esign consumer session cookie (sent with X-Aramo-Consumer sign).
    senderBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The shared auth-service access token for the esign consumer.
    signApiToken:
      type: http
      scheme: bearer
      bearerFormat: opaque (sgt_…)
      description: A short-lived Sign API access token from /v1/sign/oauth/token (never a session token).
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      description: The envelope document id (UUID).
      schema:
        type: string
        format: uuid
    SenderTab:
      name: tab
      in: query
      required: false
      description: Status tab.
      schema:
        type: string
        enum: [all, drafts, waiting, completed, declined, voided, expired]
    SenderQuery:
      name: q
      in: query
      required: false
      description: Free text matched against subject and recipient name or email.
      schema:
        type: string
    SenderDays:
      name: days
      in: query
      required: false
      description: Only envelopes created within this many days.
      schema:
        type: integer
        minimum: 1
    SenderLimit:
      name: limit
      in: query
      required: false
      description: Maximum rows.
      schema:
        type: integer
        minimum: 1
        maximum: 500
    EnvelopeId:
      name: id
      in: path
      required: true
      description: The signature envelope id (UUID).
      schema:
        type: string
        format: uuid
  responses:
    SenderUnauthorized:
      description: No valid esign session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SenderForbidden:
      description: Not the esign consumer, the tenant lacks the esign capability, the scope is missing, or a PERSONAL tenant attempted a write.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The envelope was not found in the caller's tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: An illegal envelope transition.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: The signing capability token is invalid or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BillingConflict:
      description: >-
        ESIGN_BILLING_CONFLICT (details.reason) — already subscribed (ALREADY_SUBSCRIBED), no billing
        account yet (NO_BILLING_ACCOUNT), an incomplete or non-US organization profile, an unverified
        domain, a plan that needs ATS (PLAN_NOT_ELIGIBLE), or an open governed subscription managed by
        Aramo (governed_subscription_open; CCP-A6, Conversion Rule C-1 and C-4: a conversion is a
        governed change request, never a checkout).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BillingUnavailable:
      description: ESIGN_BILLING_UNAVAILABLE — online billing is not configured or the provider is unreachable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    BillingPlan:
      type: object
      description: A catalog plan (Commercial Plans Amendment A1). Prices are display values in minor units; the charge is the provider price. reference_price is present only when substantiated.
      required: [key, name, sales_model, status, price, reference_price, commitment_months, eligibility, eligible, allowances, capacities, features, purchasable]
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        tenant_kind:
          type: [string, 'null']
        sales_model:
          type: string
          enum: [SELF_SERVICE, FREE, CONTACT_SALES, OPERATOR]
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        price:
          type: [object, 'null']
          properties:
            amount_minor:
              type: integer
            currency:
              type: string
            interval:
              type: [string, 'null']
        reference_price:
          type: [object, 'null']
          properties:
            amount_minor:
              type: integer
            currency:
              type: string
        commitment_months:
          type: [integer, 'null']
        eligibility:
          type: [string, 'null']
        eligible:
          type: boolean
        support_tier:
          type: [string, 'null']
        activation_note:
          type: [string, 'null']
        allowances:
          type: array
          items:
            type: object
            required: [allowance_key, included_quantity, unlimited, period, available]
            properties:
              allowance_key:
                type: string
              included_quantity:
                type: [integer, 'null']
              unlimited:
                type: boolean
              period:
                type: string
                enum: [MONTHLY]
              available:
                type: boolean
                description: The capability is built and operational (an entitlement that is not available is never advertised).
        capacities:
          type: array
          items:
            type: object
            required: [capacity_key, limit, unlimited, available]
            properties:
              capacity_key:
                type: string
              limit:
                type: [integer, 'null']
              unlimited:
                type: boolean
              available:
                type: boolean
        features:
          type: array
          items:
            type: object
            required: [feature_key, enabled, available]
            properties:
              feature_key:
                type: string
              enabled:
                type: boolean
                description: Included by the plan (entitlement).
              available:
                type: boolean
                description: Built and operational (launch availability).
        purchasable:
          type: boolean
    BillingAccount:
      type: object
      required: [subscription, allowance, storage, billing_available, tenant_kind, self_service_eligible, can_manage_billing]
      properties:
        subscription:
          type: [object, 'null']
          required: [plan_key, plan_name, source, status, sending, started_at, cancel_at_period_end, billing_managed]
          properties:
            plan_key:
              type: string
            plan_name:
              type: string
            source:
              type: string
              enum: [MANUAL, DEVELOPMENT, SELF_SERVICE, FREE]
              description: FREE — the system-opened Free Personal subscription (no billing provider).
            status:
              type: string
              enum: [TRIALING, ACTIVE, PAST_DUE, CANCELED, INCOMPLETE]
            sending:
              type: boolean
            started_at:
              type: string
              format: date-time
            ended_at:
              type: [string, 'null']
              format: date-time
            current_period_end:
              type: [string, 'null']
              format: date-time
            cancel_at_period_end:
              type: boolean
            grace_until:
              type: [string, 'null']
              format: date-time
            billing_managed:
              type: boolean
            commitment_months:
              type: [integer, 'null']
            commitment_end:
              type: [string, 'null']
              format: date-time
            cancel_requested_within_commitment:
              type: boolean
            eligibility_state:
              type: [string, 'null']
              enum: [OK, LAPSED, null]
            list_price:
              type: [object, 'null']
            features:
              type: array
              items:
                type: object
            export_access_until:
              type: [string, 'null']
              format: date-time
        allowance:
          type: object
          description: >
            Subscribed allowance status (limit — null when unlimited, unlimited, used, remaining — null when unlimited,
            period_start, period_end, threshold, and — only when the plan has a day window, e.g. Free Personal — daily)
            or { subscribed false, state }.
          properties:
            daily:
              type: object
              description: Personal Free v1.1 §4 — the day window (any 24 hours) on top of the monthly allowance. Absent for plans without one.
              required: [window, limit, used, remaining, next_available_at]
              properties:
                window:
                  type: string
                  enum: [DAY]
                limit:
                  type: integer
                used:
                  type: integer
                remaining:
                  type: integer
                next_available_at:
                  type: [string, 'null']
                  format: date-time
                  description: When the oldest counted send leaves the window (null while under the cap).
        storage:
          type: [object, 'null']
          description: Storage used against the plan (capacity_key, limit — null when not limited, unlimited, used); null without a subscription.
        billing_available:
          type: boolean
        tenant_kind:
          type: string
          enum: [BUSINESS, PERSONAL]
        self_service_eligible:
          type: boolean
        can_manage_billing:
          type: boolean
    BillingRedirect:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
    SignLegalStatus:
      type: object
      required: [pending]
      properties:
        pending:
          type: array
          description: Current approved Personal legal documents the user has not accepted (empty for a BUSINESS tenant).
          items:
            type: object
            required: [key, version, url, title]
            properties:
              key:
                type: string
                enum: [sign.personal_terms_of_service, aramo.privacy_notice, aramo.acceptable_use_policy]
              version:
                type: string
              url:
                type: string
                format: uri
                description: The published text on the Sign host (https://sign.aramo.ai/legal/<slug>/<version>).
              title:
                type: string
    SignAccountStatus:
      type: object
      required: [closable, closed, closed_at]
      properties:
        closable:
          type: boolean
          description: True only for the owner of an open PERSONAL account.
        closed:
          type: boolean
        closed_at:
          type: [string, 'null']
          format: date-time
    SignAccountClosed:
      type: object
      required: [state, closed_at]
      properties:
        state:
          type: string
          enum: [closed]
        closed_at:
          type: string
          format: date-time
    SenderContext:
      type: object
      required: [user, tenant, workspace, permissions, can_send, personal_sending_enabled]
      properties:
        user:
          type: object
        tenant:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            kind:
              type: string
              enum: [BUSINESS, PERSONAL]
        workspace:
          type: string
          enum: [sign, personal]
        permissions:
          type: object
          description: >
            The caller's effective Sign permissions (Sign permission contract). read_all, manage_all, members and billing are false for a PERSONAL account.
          properties:
            read:
              type: boolean
            read_all:
              type: boolean
            create:
              type: boolean
            send:
              type: boolean
            manage_all:
              type: boolean
            contacts:
              type: boolean
            members:
              type: boolean
            billing:
              type: boolean
            templates:
              type: boolean
              description: DOC-TEMPLATE-LIB-1 T-5 — the session holds document_template:read (start envelopes from templates).
        features:
          type: object
          description: >
            DOC-TEMPLATE-LIB-1 T-5 — plan capabilities by launch availability. templates = the sign.templates capability is available; while false every template route answers ESIGN_FEATURE_NOT_AVAILABLE (403).
          properties:
            templates:
              type: boolean
        can_send:
          type: boolean
        personal_sending_enabled:
          type: boolean
          description: True only for a bound (ACTIVE) PERSONAL tenant while Personal sending is switched on (SIGN_PERSONAL_SIGNUP_MODE not off).
        organization_url:
          type: [string, 'null']
        app_home_url:
          type: [string, 'null']
        org_admin:
          type: boolean
          description: >-
            ORG-UX-1 (LOCKED §4.3/§6) — the caller holds an organization role (tenant_owner or
            tenant_admin) in this BUSINESS tenant. Role-based; navigation only.
        organization_roles_url:
          type: [string, 'null']
          description: ORG-UX-1 §6 — Organization → Users & product access (the single role-assignment surface), or null.
    SenderTemplateList:
      type: object
      required: [items, unavailable]
      properties:
        items:
          type: array
          items:
            type: object
            required: [template_id, name, document_type, owner_scope, version_id, version_number, variables]
            properties:
              template_id:
                type: string
                format: uuid
              name:
                type: string
              owner_scope:
                type: string
                enum: [PLATFORM, TENANT]
              version_number:
                type: integer
        unavailable:
          type: array
          items:
            type: object
    SignTokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: [client_credentials, 'urn:ietf:params:oauth:grant-type:token-exchange', 'urn:aramo:params:oauth:grant-type:sign-event']
        client_id:
          type: string
        client_secret:
          type: string
        scope:
          type: string
          description: Space-separated subset of the effective permissions.
        subject_token:
          type: string
          description: token-exchange only — the user's Aramo access token.
        subject_token_type:
          type: string
          enum: ['urn:ietf:params:oauth:token-type:access_token']
        external_role:
          type: string
          description: client_credentials only — honoured only if the installation may assert it and a mapping exists.
        external_actor:
          type: string
          description: client_credentials only — the platform's own actor reference, recorded for audit.
        event_id:
          type: string
          format: uuid
          description: >
            sign-event only (Addendum S6) — the id of a completion event Sign delivered to the AUTHENTICATED
            application's subscription. Yields a read grant (≤ 5 minutes) for that event's envelope's executed
            documents and evidence only; tenant and envelope come from Sign's records, never from the caller.
    SignTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope, tenant_id, installation_id, mode]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
        scope:
          type: string
        tenant_id:
          type: string
          format: uuid
        installation_id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [USER, APPLICATION]
        envelope_id:
          type: string
          format: uuid
          description: Set on an event-bound grant — the only envelope it can read.
    SignAvailability:
      type: object
      required: [available, reason, allowance]
      properties:
        available:
          type: boolean
        reason:
          type: [string, 'null']
          enum: [NOT_SUBSCRIBED, LIMIT_REACHED, null]
        allowance:
          type: [object, 'null']
    SignApiCreateEnvelope:
      type: object
      required: [subject, documents, signers]
      properties:
        subject:
          type: string
        documents:
          type: array
          items:
            type: object
            description: Either content_base64 (+ title, filename) or, for Aramo applications, document_ref + document_revision_ref + source_sha256.
        signers:
          type: array
          minItems: 1
          maxItems: 10
          description: Distinct emails; signing_order values 1 to N with no gaps or repeats (list position when omitted).
          items:
            type: object
            required: [name, email]
            properties:
              name:
                type: string
              email:
                type: string
              signing_order:
                type: integer
                minimum: 1
        routing_mode:
          type: string
          enum: [PARALLEL, SEQUENTIAL]
          description: PARALLEL (default) - every signer may sign at once. SEQUENTIAL - only the signer whose turn it is may act; the next is invited when they sign.
        fields:
          type: array
          items:
            type: object
        send:
          type: boolean
    SenderEnvelopeList:
      type: object
      required: [items, counts]
      properties:
        items:
          type: array
          items:
            type: object
        counts:
          type: object
    SenderDraftCreated:
      type: object
      required: [id, status, subject]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        subject:
          type: string
    SenderEnvelopeDetail:
      type: object
      required: [id, subject, status, documents, recipients, fields, editable]
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: string
        status:
          type: string
          enum: [DRAFT, SENT, IN_PROGRESS, COMPLETED, DECLINED, VOIDED, EXPIRED]
        editable:
          type: boolean
        routing_mode:
          type: string
          enum: [PARALLEL, SEQUENTIAL]
        next_signer_id:
          type: [string, 'null']
          description: When signing in order and the envelope is open, the signer whose turn it is.
        documents:
          type: array
          items:
            type: object
        recipients:
          type: array
          items:
            type: object
            description: Includes signing_order and can_remind (an unsigned signer who may sign now).
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SenderFieldInput'
    SenderFieldInput:
      type: object
      description: PDF-native geometry - page_number 0-based, points, origin bottom-left, (x, y) the box lower-left corner.
      required: [envelope_document_id, signer_id, field_type, page_number, x, y, width, height]
      properties:
        envelope_document_id:
          type: string
          format: uuid
        signer_id:
          type: string
          format: uuid
        field_type:
          type: string
          enum: [SIGNATURE, INITIALS, SIGN_DATE, SIGNER_NAME, TEXT, CHECKBOX, ACKNOWLEDGEMENT]
        page_number:
          type: integer
          minimum: 0
        x:
          type: number
          minimum: 0
        y:
          type: number
          minimum: 0
        width:
          type: number
          exclusiveMinimum: 0
        height:
          type: number
          exclusiveMinimum: 0
        required:
          type: boolean
    SenderUploadedDocument:
      type: object
      required: [id, title, page_count, pages]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        page_count:
          type: integer
        pages:
          type: array
          items:
            type: object
            properties:
              width:
                type: number
              height:
                type: number
    SenderLedgerEvent:
      type: object
      required: [id, event_type, occurred_at, actor, event_hash]
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        actor:
          type: string
        event_hash:
          type: string
    ErrorResponse:
      type: object
      description: The canonical Aramo error envelope.
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    CreateEnvelopeRequest:
      type: object
      required:
        - tenant_id
        - subject
        - execution_mode
        - created_by
        - documents
        - signers
      properties:
        tenant_id:
          type: string
          format: uuid
        subject:
          type: string
        execution_mode:
          type: string
          enum: [ACKNOWLEDGEMENT, SINGLE_SIGNATURE, MULTI_SIGNATURE]
        created_by:
          type: string
          format: uuid
        idempotency_key:
          type: string
        documents:
          type: array
          items:
            type: object
            required: [document_ref, document_revision_ref, title, source_sha256, ordinal]
            properties:
              document_ref:
                type: string
                format: uuid
              document_revision_ref:
                type: string
                format: uuid
              title:
                type: string
              source_sha256:
                type: string
              ordinal:
                type: integer
        signers:
          type: array
          items:
            type: object
            required: [email, name, signing_order]
            properties:
              email:
                type: string
              name:
                type: string
              signing_order:
                type: integer
              signer_role:
                type: string
        fields:
          description: >-
            PX-V1 F2 — OPTIONAL positioned signature/date fields defined at
            envelope creation. Each references a document by ordinal and,
            optionally, a signer by signing_order. Omitted by ATS RTR/Offer
            callers, which remain valid unchanged.
          type: array
          items:
            type: object
            required: [document_ordinal, field_type, page_number, x, y]
            properties:
              document_ordinal:
                type: integer
              signer_signing_order:
                type: integer
              field_type:
                type: string
                enum: [SIGNATURE, INITIALS, SIGN_DATE, SIGNER_NAME, TEXT, CHECKBOX, ACKNOWLEDGEMENT]
              page_number:
                type: integer
              x:
                type: number
              y:
                type: number
              width:
                type: number
              height:
                type: number
              required:
                type: boolean
    EnvelopeSummary:
      type: object
      required:
        - envelope_id
        - status
        - signers
      properties:
        envelope_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [DRAFT, SENT, IN_PROGRESS, COMPLETED, DECLINED, VOIDED, EXPIRED]
        signers:
          type: array
          items:
            type: object
            properties:
              signer_id:
                type: string
                format: uuid
              email:
                type: string
              status:
                type: string
                enum: [PENDING, VIEWED, SIGNED, DECLINED]
    EvidenceSummary:
      type: object
      required:
        - envelope_id
        - status
      properties:
        envelope_id:
          type: string
          format: uuid
        status:
          type: string
        event_chain_hash:
          type: [string, 'null']
        signature:
          type: [string, 'null']
        signature_algorithm:
          type: [string, 'null']
        completed_at:
          type: [string, 'null']
          format: date-time
