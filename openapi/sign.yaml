  /v1/sign/sender/envelopes/{id}/recipients:
    put:
      operationId: replaceSenderRecipients
      summary: Replace the recipients of a DRAFT envelope.
      description: >
        Keeps listed existing ids, creates new recipients, deletes the rest with their fields. List position is the signing order (used when the envelope signs in order). Up to 10 signing recipients and 10 copy recipients, with distinct emails across all kinds. DRAFT only. Requires sign:envelope:create.
        Aramo-Sign-Unified-Product-Amendment-M-A5 §1 / §2 / §4 — each item may carry recipient_kind (omitted = SIGNER), copy_delivery (required iff RECEIVES_COPY; 400 copy_delivery_required / copy_delivery_not_allowed) and assign_to_me (the server binds the caller only when this recipient's email is the caller's verified account email: 403 assign_to_me_email_mismatch; SIGNER only: 400 assign_to_me_not_signer). Email is optional for an IN_PERSON_SIGNER only. 400 too_many_signers / too_many_copy_recipients / invalid_recipient_kind.
        Sign Mobile M-A3 §6 — If-Match is required for native tokens (428 precondition_required) and enforced whenever sent (412 revision_mismatch).
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipients]
              properties:
                recipients:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [name]
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      email:
                        type: [string, 'null']
                        description: Required unless recipient_kind is IN_PERSON_SIGNER.
                      recipient_kind:
                        $ref: '#/components/schemas/SenderRecipientKind'
                      copy_delivery:
                        oneOf:
                          - $ref: '#/components/schemas/SenderCopyDelivery'
                          - type: 'null'
                      assign_to_me:
                        type: boolean
                        description: >-
                          M-A5 §4.1 — Assign to me. The server sets the binding to the caller (never client-supplied) when the
                          recipient email equals the caller's verified account email. Omitted or false clears it.
                      witness_for_index:
                        type: [integer, 'null']
                        minimum: 0
                        description: >-
                          Feature-Parity §1.17 — required for a WITNESS (400 witness_for_required / witness_for_invalid), refused
                          for any other kind (400 witness_for_not_allowed): the position in this list of the SIGNER or
                          IN_PERSON_SIGNER the witness attests for. One witness per signer (400 witness_duplicate). A witness is
                          invited and may sign only after that signer has signed; when signing in order it must come after
                          them (checked at send). WITNESS is refused 403 ESIGN_FEATURE_NOT_AVAILABLE while sign.witness_signing
                          is not available or for a PERSONAL account.
                      access_code:
                        type: [string, 'null']
                        minLength: 4
                        maxLength: 32
                        description: >-
                          Feature-Parity §1.9 — the access code the recipient must enter before viewing (SIGNER and WITNESS only:
                          400 access_code_not_allowed; 4 to 32 printable characters: 400 access_code_invalid). Stored only as a
                          salted hash and never returned. Omitted keeps the stored code of an existing recipient; null clears
                          it. Refused 403 ESIGN_FEATURE_NOT_AVAILABLE while sign.access_code is not available.
                      identity_verification_method:
                        type: [string, 'null']
                        enum: [ID_VERIFICATION, KBA, null]
                        description: >-
                          Aramo-Sign-Feature-Parity-Program-Directive-v1_0-LOCKED §1.9 — require an identity check before this
                          recipient sees the envelope. A value sets it, null clears it, omitted keeps it. Link signers only (400
                          identity_verification_not_link_signer; 400 invalid_identity_verification_method). Refused 403
                          ESIGN_FEATURE_NOT_AVAILABLE while sign.id_verification / sign.kba is not available or for a Personal
                          account (details.reason plan_not_eligible).
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderEnvelopeDetail'
          headers:
            ETag:
              $ref: '#/components/headers/EnvelopeETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/RevisionMismatch'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
