openapi: 3.1.0
info:
  title: Aramo Native E-Sign Service (DOC-3)
  version: 0.1.0
  description: >
    The ATS-neutral Native E-Sign Service Core (apps/sign-service). The
    `/v1/sign/envelopes` surface is the provider seam apps/api's
    SignatureProviderPort HTTP adapter calls (trusted service-to-service; the
    authoritative tenant_id is supplied by the caller). The `/v1/sign/signing`
    surface is the public signer transport — tenant context is resolved from the
    capability token, never accepted from the client. Transport only: no
    RTR/Submittal/Offer/recruiter-workflow logic (those consume this seam in DOC-5/6).
tags:
  - name: sender
    description: The Aramo Sign API — authenticated workspace, guest signing and billing on the one Sign host (sign.aramo.ai).
  - name: billing
    description: Aramo Sign self-service billing (plans, account, Stripe checkout and portal, provider webhook).
  - name: platform
    description: >
      The Aramo Sign API for integrating applications (Sign Unified Product S-4). Authenticate at
      /v1/sign/oauth/token, then call /v1/sign/api/* with the short-lived bearer token. Effective
      authority = principal authority ∩ installation grants ∩ delegated scope. First-party exposure first;
      public third-party activation is separately authorized.
  - name: integrations
    description: Installation administration in the Sign workspace (sign:integration:manage).
  - name: privacy-s2s
    description: Service-to-service privacy contracts (not publicly routed). The ATS erasure engine asks Sign to preflight and erase what Sign holds about a talent.
  - name: inbox
    description: >
      "Waiting for me" (Sign Unified Product S-7). A recipient right — any signed-in Sign user, with or without a Sign
      role. A document joins only through a recipient-specific binding (the recipient's live signing link AND the user's
      verified email); the binding grants no membership in the sender's organization.
paths:
  /v1/sign/envelopes:
    post:
      operationId: createSignatureEnvelope
      summary: Create a signature envelope (DRAFT) with documents + signers.
      description: Trusted service-to-service; the authoritative tenant_id is supplied by the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvelopeRequest'
      responses:
        '201':
          description: The created envelope summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/sign/envelopes/{id}/send:
    post:
      operationId: sendSignatureEnvelope
      summary: Send the envelope (DRAFT -> SENT); issues signer capability sessions.
      description: Transitions DRAFT to SENT and issues one signing capability session per signer.
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: The updated envelope summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSummary'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/sign/envelopes/for-document:
    get:
      operationId: findEnvelopeForDocument
      summary: Reverse-resolve the single NON-TERMINAL envelope for a document revision (COMM-RECRUITER-W1).
      description: >
        E-Sign owns envelope identity; Documents never store envelope_id. Returns the
        single non-terminal (DRAFT|SENT|IN_PROGRESS) envelope for the exact
        (tenant_id, document_ref, document_revision_ref), or null when none. Fails
        closed with ESIGN_ENVELOPE_AMBIGUOUS (409) when more than one exists.
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: document_ref
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: document_revision_ref
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The single non-terminal envelope, or null.
          content:
            application/json:
              schema:
                type: object
                required: [envelope]
                properties:
                  envelope:
                    oneOf:
                      - $ref: '#/components/schemas/EnvelopeSummary'
                      - type: 'null'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/sign/envelopes/{id}/remind:
    post:
      operationId: remindSignatureEnvelope
      summary: Send a reminder on an already-sent envelope (COMM-RECRUITER-W1); NOT a resend.
      description: >
        Same-envelope reminder for a SENT|IN_PROGRESS envelope. Revokes each
        incomplete signer's prior non-terminal session, issues exactly one new
        session + capability token, records a SIGNATURE_REMINDER_SENT event and a
        NotificationDelivery, and dispatches the reminder link. Never a DRAFT->SENT
        transition and never a new envelope. ESIGN_REMINDER_NOT_ALLOWED (409) when
        the envelope is not remindable.
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id: { type: string, format: uuid }
      responses:
        '200':
          description: The (unchanged-status) envelope summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSummary'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sign/envelopes/{id}:
    get:
      operationId: getSignatureEnvelope
      summary: Get an envelope summary.
      description: Returns the tenant-scoped envelope summary; a cross-tenant id is a 404.
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The envelope summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSummary'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sign/envelopes/{id}/void:
    post:
      operationId: voidSignatureEnvelope
      summary: Void an envelope.
      description: Voids a non-terminal envelope with a recorded reason.
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, reason]
              properties:
                tenant_id:
                  type: string
                  format: uuid
                reason:
                  type: string
      responses:
        '200':
          description: The voided envelope summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSummary'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/sign/envelopes/{id}/evidence:
    get:
      operationId: getSignatureEvidence
      summary: Retrieve envelope evidence metadata (event-chain hash + software signature).
      description: Returns evidence metadata (hashes + signature); verifiable independently of signing.
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The evidence summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceSummary'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sign/envelopes/{id}/executed:
    get:
      operationId: getExecutedArtifacts
      summary: Pull executed document bytes + certificate (base64) for the Documents write-back.
      description: Service-to-service pull for the Documents write-back; bytes are base64 (the event bus carries only refs).
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Executed artifacts (bytes never traverse the event bus).
          content:
            application/json:
              schema:
                type: object
                required: [envelope_id, documents, certificate]
                properties:
                  envelope_id:
                    type: string
                    format: uuid
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        envelope_document_id: { type: string, format: uuid }
                        document_ref: { type: [string, 'null'], format: uuid }
                        document_revision_ref: { type: [string, 'null'], format: uuid }
                        executed_sha256: { type: string }
                        byte_size: { type: integer }
                        executed_base64: { type: string }
                  certificate:
                    type: [object, 'null']
                    properties:
                      certificate_sha256: { type: string }
                      byte_size: { type: integer }
                      certificate_base64: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sign/signing/exchange:
    post:
      operationId: exchangeSigningToken
      summary: Exchange a raw capability token for an active signing session.
      description: The tenant is resolved server-side from the capability token; the client sends no tenant id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: The resolved signing session context.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                    format: uuid
                  envelope_id:
                    type: string
                    format: uuid
                  signer_id:
                    type: string
                    format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Feature-Parity §1.9 — the recipient has an access code and this session has not entered it
            (SIGNER_ACCESS_CODE_REQUIRED, details.reason access_code_required). The same refusal applies to every
            signer route (disclosure-text, document, source, disclosure, fill, complete, decline, delegate) until
            POST /v1/sign/signing/access-code succeeds for the session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            Not this signer's turn (SIGNER_NOT_YET_ELIGIBLE; details.reason witness_signer_not_signed for a witness whose
            signer has not signed), or the envelope is no longer signable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '423':
          description: The recipient is locked out after too many wrong access codes (SIGNER_ACCESS_CODE_LOCKED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/signing/documents/{documentId}/text-layer:
    post:
      operationId: getSignerDocumentTextLayer
      summary: The signer's document words with normalised boxes, for Find in document (M-A12 W1-C.2).
      description: >-
        Aramo Sign Mobile M-A12 W1-C.2. POST with the signing session token in the body, the same transport and gates as
        /v1/sign/signing/source (live session, any SMS code, accepted disclosure); LINK, INBOX, HOSTED and SELF sessions alike.
        A document outside this session's envelope is 404. Cached per document version; the text is never logged.
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTextLayer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Disclosure not yet accepted for this signer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/signing/document:
    post:
      operationId: getSignerDocumentView
      summary: The signer's document view — positioned fields + document metadata.
      description: >-
        PX-V1 F3 — token-authorized, disclosure-gated. Tenant is resolved
        server-side from the capability token; the response carries no tenant id
        and no source bytes. Feature-Parity §1.9 — when the sender requires an
        identity check, this route (and source, fill and complete) answers 403
        SIGNER_IDENTITY_VERIFICATION_REQUIRED (details.method) until the recipient
        has verified, and 423 SIGNER_IDENTITY_VERIFICATION_LOCKED once verification
        locked them out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Document metadata + the signer's positioned fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        document_id: { type: string, format: uuid }
                        title: { type: string }
                        ordinal: { type: integer }
                  fields:
                    type: array
                    items:
                      type: object
                      properties:
                        field_id: { type: string, format: uuid }
                        document_id: { type: string, format: uuid }
                        field_type: { type: string }
                        page_number: { type: integer }
                        x: { type: number }
                        y: { type: number }
                        width: { type: [number, 'null'] }
                        height: { type: [number, 'null'] }
                        required: { type: boolean }
                        filled:
                          type: boolean
                          description: True once this signer has filled the field (lets the signer page restore progress).
                        value:
                          type: [string, 'null']
                          description: >-
                            The signer's own entered value for their field (typed text, date, or drawn-signature data URL);
                            null otherwise. M-A6 §2.4 — for a server-filled name (server_filled true) it is the name the
                            server fills. Other signers' values are never returned.
                        label:
                          type: [string, 'null']
                          description: M-A6 §2.3 — the check box caption (CHECKBOX only).
                        group_key:
                          type: [string, 'null']
                          description: M-A6 §2.3 — boxes sharing a key form a group (CHECKBOX only).
                        group_rule:
                          type: [string, 'null']
                          enum: [SELECT_ONE, SELECT_ANY, null]
                        min_selected:
                          type: [integer, 'null']
                          minimum: 1
                          description: M-A6 §2.3 — the boxes a required group needs checked (null means 1).
                        name_mode:
                          type: [string, 'null']
                          enum: [SIGNER_PROFILE, SIGNER_ENTERED, null]
                          description: M-A6 §2.2 — SIGNER_NAME only; null for engine name fields, which the signer types.
                        server_filled:
                          type: boolean
                          description: >-
                            M-A6 §2.2 — true for a SIGNER_PROFILE name; shown read-only, never filled by the client.
                            Sign 1.14 — also true for a PAYMENT field, which is filled (with its receipt line) only
                            when the payment succeeds; the signer pays it through /v1/sign/signing/payment/checkout.
                        payment:
                          type: [object, 'null']
                          description: Sign 1.14 — the amount to pay for a PAYMENT field (null for every other type).
                          properties:
                            amount_minor: { type: integer }
                            currency: { type: string, enum: [USD] }
                  message:
                    type: [string, 'null']
                    maxLength: 1000
                    description: Sign Mobile M-A3 §3 — the sender's plain-text message (sender-supplied; not part of the signed document). Render as text, never markup.
                  can_delegate:
                    type: boolean
                    description: >-
                      Consolidated Directive v1.0 B3 (Feature-Parity §1.17) — true when sign.delegate_signing is
                      available, the sender allowed delegation and this recipient may still hand the envelope to
                      someone else (a signer with an email who has not delegated or signed). The signer page offers
                      the hand-off only then; POST /v1/sign/signing/delegate re-checks every rule.
                  date_format:
                    type: [string, 'null']
                    enum: [MM/DD/YYYY, DD/MM/YYYY, YYYY-MM-DD, null]
                    description: >-
                      Aramo Sign Mobile M-A12 W1-E.2 — the sender's format for SIGN_DATE values, stamped at send. Null for an
                      envelope sent before formats were stamped (the date stays YYYY-MM-DD).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Disclosure not yet accepted for this signer.
  /v1/sign/signing/qes/status:
    post:
      operationId: getSignerQesStatus
      summary: The signer's qualified-signature (QES) state (Feature-Parity §1.16, Amendment A1).
      description: >-
        Token-authorized like every signer route; the tenant is resolved server-side. qes is null when this
        signer signs at the standard level. Refused with ESIGN_FEATURE_NOT_AVAILABLE (403) while sign.qes is
        not available (today, always: no QTSP is contracted). Aramo is not a QTSP: the QTSP proofs the signer's
        identity, holds the key and signs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignerTokenRequest'
      responses:
        '200':
          description: The signer's QES state.
          content:
            application/json:
              schema:
                type: object
                required: [qes]
                properties:
                  qes:
                    oneOf:
                      - $ref: '#/components/schemas/QesSignatureView'
                      - type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/signing/qes/begin:
    post:
      operationId: beginSignerQes
      summary: Start the QTSP identity-proofing step of a QES signer (Feature-Parity §1.16).
      description: >-
        Moves the signer's QES row to IDENTITY_PROOFING_PENDING and returns the QTSP URL to send the signer to
        (OAuth 2.0 authorization, CSC API v2 shape). Restartable after FAILED. Refused (403
        ESIGN_FEATURE_NOT_AVAILABLE) while sign.qes is not available or no QTSP is configured
        (details.reason provider_not_configured); 409 ENVELOPE_ILLEGAL_TRANSITION when QES is not required for
        this signer (details.reason qes_not_required), already signed, or the envelope is not signable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignerTokenRequest'
      responses:
        '200':
          description: The next QTSP step.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QesStepResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/sign/signing/qes/complete:
    post:
      operationId: completeSignerQes
      summary: Hand the QTSP redirect (code, state) back to Aramo (Feature-Parity §1.16).
      description: >-
        After identity proofing the row becomes AUTHORIZED (the QTSP's credential and certificate chain are
        recorded) and redirect_url is the QTSP step where the signer authorizes signing exactly one digest; after
        that step the QTSP signs and the row becomes SIGNED (signature and certificate-chain evidence recorded,
        ledger QES_SIGNED). No OAuth code or token is stored. A QTSP refusal moves the row to FAILED (409,
        details.reason qes_provider_refused); a state that does not match is refused (qes_state_mismatch).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, code, state]
              properties:
                token:
                  type: string
                code:
                  type: string
                  maxLength: 2048
                state:
                  type: string
                  maxLength: 256
      responses:
        '200':
          description: The resulting state, and the next QTSP step when there is one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QesStepResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/sign/signing/source:
    post:
      operationId: getSignerDocumentSource
      summary: The frozen source PDF bytes for a document in the signing session.
      description: >-
        PX-V1 F3 — token-authorized, disclosure-gated. Bytes are resolved
        mode-agnostically (OWNED → E-Sign object storage, CORE_REF → Documents
        pull) and returned base64; the response carries no tenant id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, document_id]
              properties:
                token: { type: string }
                document_id: { type: string, format: uuid }
      responses:
        '200':
          description: The base64-encoded source PDF plus its content type.
          content:
            application/json:
              schema:
                type: object
                properties:
                  source_base64: { type: string }
                  content_type: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Disclosure not yet accepted for this signer.
  /v1/sign/signing/disclosure-text:
    post:
      operationId: getSignerDisclosureText
      summary: The current server-held electronic-records-and-signature disclosure.
      description: >-
        Aramo Sign launch (A-7) — token-authorized. Returns the current disclosure
        version, its exact text and the sha256 of that text. The signer app shows
        the text and sends the version and hash back to /disclosure, which refuses
        any version E-Sign does not hold or any mismatching hash. No tenant id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: The current disclosure.
          content:
            application/json:
              schema:
                type: object
                required: [disclosure_version, text, text_sha256]
                properties:
                  disclosure_version: { type: string }
                  text: { type: string }
                  text_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
                  message:
                    type: [string, 'null']
                    maxLength: 1000
                    description: Sign Mobile M-A3 §3 — the sender's plain-text message for the consent screen (not part of the disclosure text or its hash). Render as text, never markup.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The envelope is no longer signable (ENVELOPE_ALREADY_EXECUTED).
  /v1/sign/signing/branding:
    post:
      operationId: getSignerBranding
      summary: The sending organization's branding for the signer page.
      description: >-
        Aramo-Sign-Feature-Parity-Program-Directive-v1_0-LOCKED §1.10 — token-authorized (the
        signing capability token is the only authority; no tenant id is returned). branding is
        null — the default Aramo look — unless the `sign.branding` feature is available and the
        sending organization's plan includes it (dark in this release). A token that no longer
        signs also answers null.
      tags: [sender]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 512 }
      responses:
        '200':
          description: The branding, or null for the default look.
          content:
            application/json:
              schema:
                type: object
                required: [branding]
                properties:
                  branding:
                    oneOf:
                      - $ref: '#/components/schemas/SignSignerBranding'
                      - type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/sign/signing/brand-logo/{logoId}:
    get:
      operationId: getSignBrandLogo
      summary: An organization's branding logo (PNG or JPEG).
      description: >-
        Feature-Parity §1.10 — public, for the signing page and the notification emails. The id
        is random per upload (an old id stops working when the logo is replaced or removed).
        Served only while the organization's branding applies; otherwise 404.
      tags: [sender]
      security: []
      parameters:
        - name: logoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The logo image.
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sign/signing/executed:
    post:
      operationId: getSignerExecutedCopy
      summary: The signer's signed copy of a completed envelope.
      description: >-
        Aramo Sign launch — authorized by the time-limited access token from the
        completion email (not a signing session). Returns the executed document(s)
        and the certificate of completion of a COMPLETED envelope, base64. Only the
        token's hash is stored; tenant is resolved server-side; no tenant id in the
        response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: The signed documents and certificate.
          content:
            application/json:
              schema:
                type: object
                required: [subject, completed_at, documents, certificate_base64]
                properties:
                  subject: { type: string }
                  completed_at: { type: [string, 'null'], format: date-time }
                  documents:
                    type: array
                    items:
                      type: object
                      required: [title, content_type, executed_base64]
                      properties:
                        title: { type: string }
                        content_type: { type: string }
                        executed_base64: { type: string }
                  certificate_base64: { type: [string, 'null'] }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/sign/signing/copy:
    post:
      operationId: getRecipientCopy
      security: []
      summary: A copy recipient's view of the documents sent for signature (ON_SEND copy).
      description: >-
        Aramo-Sign-Unified-Product-Amendment-M-A5 §2.2 — authorized by the COPY_VIEW access token from the RECIPIENT_COPY
        email (not a signing session). Returns the SOURCE documents only, base64: values are stamped only at completion,
        so they carry no signer data. No recipient list, signer data, tenant id or internal id is returned. Refused (401)
        for an unknown or expired token, an executed-copy token, and a draft, voided, declined or expired envelope. Only
        the token's hash is stored; tenant is resolved server-side; each use is counted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: The source documents.
          content:
            application/json:
              schema:
                type: object
                required: [subject, sent_at, documents]
                additionalProperties: false
                properties:
                  subject: { type: string }
                  sent_at: { type: [string, 'null'], format: date-time }
                  documents:
                    type: array
                    items:
                      type: object
                      required: [title, content_type, source_base64]
                      additionalProperties: false
                      properties:
                        title: { type: string }
                        content_type: { type: string }
                        source_base64: { type: string, description: 'The source PDF, base64.' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  # Sign Mobile B-12 — the signer operations the guest transport (web and the Aramo
  # Sign app) calls; tenant context comes from the capability token only.
  /v1/sign/signing/disclosure:
    post:
      operationId: acceptSignerDisclosure
      security: []
      summary: Accept the electronic-records-and-signature disclosure for this signer.
      description: >-
        Token-authorized. Send back the disclosure_version and the text_sha256 that
        /disclosure-text returned; a version E-Sign does not hold, or a hash that does
        not match, is refused 400. Records the acceptance (with the caller's IP and
        user agent) and DISCLOSURE_ACCEPTED on the ledger. Fields can be filled, and
        the signer can complete, only after this.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, disclosure_version, disclosure_text_hash]
              properties:
                token: { type: string }
                disclosure_version: { type: string }
                disclosure_text_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
                attested_name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: >-
                    Aramo-Sign-Unified-Product-Amendment-M-A5 §3.4 — required in a hosted (in-person) session: the name the
                    signer confirms (400 attested_name_required without it). Ignored for other sessions. Kept with the
                    acceptance; the ledger records only its sha256.
      responses:
        '200':
          description: The disclosure was accepted.
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: boolean, const: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: >-
            The envelope is no longer signable (ENVELOPE_ALREADY_EXECUTED / ENVELOPE_ILLEGAL_TRANSITION), or it is not this
            signer's turn in a sequential envelope (SIGNER_NOT_YET_ELIGIBLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/signing/fields/{fieldId}/fill:
    post:
      operationId: fillSignerField
      security: []
      summary: Fill one of the signer's own fields.
      description: >-
        Token-authorized and disclosure-gated, under the envelope row lock with a live
        session; only this signer's field can be filled, and the value replaces any
        earlier one until the signer completes. value is the typed text, the date, or
        the signature / initials image as a PNG or JPEG data URL; signature_method
        records how a SIGNATURE or INITIALS value was made. A saved signature (/v1/sign/me/signature)
        is a convenience only: the value is always sent here and copied into the signing record.
        M-A6 §2 — a CHECKBOX or ACKNOWLEDGEMENT value is 'true' (checked) or 'false' (unchecked;
        unchecking is allowed), anything else is refused with 400 reason checkbox_value_invalid.
        A SIGNER_NAME field with name_mode SIGNER_PROFILE is filled by the server and any value
        sent for it is refused with 400 reason signer_profile_name_server_filled.
      parameters:
        - name: fieldId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, value]
              properties:
                token: { type: string }
                value: { type: string }
                signature_method:
                  type: string
                  enum: [TYPED, DRAWN]
      responses:
        '200':
          description: The field was filled.
          content:
            application/json:
              schema:
                type: object
                required: [filled]
                properties:
                  filled: { type: boolean, const: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: SIGNER_NOT_FOUND — the field is not one of this signer's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            DISCLOSURE_NOT_ACCEPTED, SIGNER_NOT_YET_ELIGIBLE (not this signer's turn), or the envelope is no longer
            signable (ENVELOPE_ALREADY_EXECUTED / ENVELOPE_ILLEGAL_TRANSITION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/signing/complete:
    post:
      operationId: completeSigner
      security: []
      summary: Finish signing for this signer.
      description: >-
        Token-authorized and disclosure-gated. Every required field of this signer must
        be filled (409 SIGNATURE_FIELD_INCOMPLETE otherwise). M-A6 §2.3 — a required check
        box must be checked; a SELECT_ONE group needs exactly one box checked when required
        (never more than one); a required group needs at least min_selected boxes checked
        (default 1). The failing rule is details.reason: required_field_unfilled,
        checkbox_required_unchecked, checkbox_group_select_one or checkbox_group_min_selected
        (with details.group_key for a group). The server fills every SIGNER_PROFILE name field
        of the signer when they complete. When this was the last
        signer the envelope is executed and envelope_status is COMPLETED; otherwise it
        is IN_PROGRESS and, when signing in order, the next signer is invited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: The signer completed.
          content:
            application/json:
              schema:
                type: object
                required: [envelope_status]
                properties:
                  envelope_status:
                    type: string
                    enum: [IN_PROGRESS, COMPLETED]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: >-
            SIGNATURE_FIELD_INCOMPLETE, DISCLOSURE_NOT_ACCEPTED, SIGNER_NOT_YET_ELIGIBLE (not this signer's turn), or the
            envelope is no longer signable (ENVELOPE_ALREADY_EXECUTED / ENVELOPE_ILLEGAL_TRANSITION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/signing/decline:
    post:
      operationId: declineSigning
      security: []
      summary: Decline to sign, with a reason.
      description: >-
        Token-authorized. Ends the envelope as DECLINED with the signer's reason (shown to
        the sender; the other open signers learn the envelope ended). When signing in
        order, a signer may decline only on their turn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, reason]
              properties:
                token: { type: string }
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: The envelope was declined.
          content:
            application/json:
              schema:
                type: object
                required: [declined]
                properties:
                  declined: { type: boolean, const: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The envelope is no longer open (ENVELOPE_ILLEGAL_TRANSITION), or it is not this signer's turn (SIGNER_NOT_YET_ELIGIBLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/signing/access-code:
    post:
      operationId: verifySigningAccessCode
      security: []
      summary: Enter the access code the sender set for this recipient.
      description: >-
        Aramo-Sign-Feature-Parity-Program-Directive-v1_0-LOCKED §1.9. Token-authorized. A recipient with an access
        code enters it once per signing session before anything of the envelope is shown. The code is stored only
        as a salted hash and is never logged, echoed or written to the ledger. A wrong code is counted
        (ACCESS_CODE_FAILED ledger event; 403 SIGNER_ACCESS_CODE_REQUIRED, details.reason access_code_incorrect,
        details.attempts_remaining); the fifth wrong code locks the recipient out of the envelope and revokes their
        sessions (ACCESS_CODE_LOCKED; 423 SIGNER_ACCESS_CODE_LOCKED). Success is recorded (ACCESS_CODE_VERIFIED) and
        printed on the certificate of completion. A recipient without an access code verifies trivially.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, access_code]
              properties:
                token: { type: string }
                access_code: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: The session may now view and sign.
          content:
            application/json:
              schema:
                type: object
                required: [verified]
                properties:
                  verified: { type: boolean, const: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The access code is not correct (SIGNER_ACCESS_CODE_REQUIRED, details.reason access_code_incorrect, details.attempts_remaining).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The envelope is no longer signable (ENVELOPE_ALREADY_EXECUTED / ENVELOPE_ILLEGAL_TRANSITION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '423':
          description: Too many wrong access codes (SIGNER_ACCESS_CODE_LOCKED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/signing/delegate:
    post:
      operationId: delegateSigning
      security: []
      summary: Hand this signature to another person.
      description: >-
        Aramo-Sign-Feature-Parity-Program-Directive-v1_0-LOCKED §1.17. Token-authorized; refused 403
        ESIGN_FEATURE_NOT_AVAILABLE while sign.delegate_signing is not available. Only a SIGNER who has not signed,
        on their turn and past any access code, of an envelope whose sender allowed delegation
        (allow_delegation), once per recipient. The recipient slot keeps its fields (values cleared) and now names
        the delegate; the original recipient is kept on the record and printed on the certificate; every session of
        the original recipient is revoked (this link stops working); SIGNER_DELEGATED is appended to the ledger
        (email hashes only); and the delegate receives a new signing link by email. 409 ENVELOPE_ILLEGAL_TRANSITION
        details.reason delegation_not_allowed | not_delegable_recipient | already_delegated | signer_not_awaiting;
        400 VALIDATION_ERROR details.reason delegate_invalid | delegate_email_on_envelope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, name, email]
              properties:
                token: { type: string }
                name: { type: string, minLength: 1, maxLength: 200 }
                email: { type: string, format: email, maxLength: 254 }
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Delegated. The delegate is emailed a signing link.
          content:
            application/json:
              schema:
                type: object
                required: [delegated]
                properties:
                  delegated: { type: boolean, const: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Delegate signing is not available (ESIGN_FEATURE_NOT_AVAILABLE), or the access code was not entered (SIGNER_ACCESS_CODE_REQUIRED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The signature cannot be delegated (ENVELOPE_ILLEGAL_TRANSITION with details.reason), or it is not this signer's turn (SIGNER_NOT_YET_ELIGIBLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/signing/identity-verification/status:
    post:
      operationId: getSignerIdentityVerificationStatus
      security: []
      summary: Where the recipient stands with the identity check the sender requires.
      description: >-
        Aramo-Sign-Feature-Parity-Program-Directive-v1_0-LOCKED §1.9 and Amendment A1 — token-authorized (tenant
        resolved server-side). NOT_REQUIRED when the sender asked for no identity check. A vendor session the
        recipient has finished is settled first (its result is read from the vendor). No document data is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: The recipient's identity-verification state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignerIdentityVerificationStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The envelope is no longer open (ENVELOPE_ALREADY_EXECUTED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/signing/identity-verification/start:
    post:
      operationId: startSignerIdentityVerification
      security: []
      summary: Open (or resume) the vendor's identity check for this recipient.
      description: >-
        Aramo-Sign-Feature-Parity-Program-Directive-v1_0-LOCKED §1.9 and Amendment A1 — token-authorized. Returns the
        vendor's hosted verification page (verification_url), which the signer app opens in a new tab; the URL is never
        stored. An open session is resumed rather than started again. Each new vendor session is one metered attempt;
        a recipient who uses every attempt (SIGN_ID_VERIFICATION_MAX_ATTEMPTS, default 3) is locked (423) and the sender
        is told. Refused 403 ESIGN_FEATURE_NOT_AVAILABLE while sign.id_verification is not available, and 503
        ESIGN_IDENTITY_VERIFICATION_UNAVAILABLE when no vendor is configured (details.reason provider_not_configured,
        kba_vendor_not_selected).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: The recipient's state and, while a session is open, the vendor's hosted page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SignerIdentityVerificationStatus'
                  - type: object
                    required: [verification_url]
                    properties:
                      verification_url:
                        type: [string, 'null']
                        format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The feature is not available (ESIGN_FEATURE_NOT_AVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The envelope is no longer open (ENVELOPE_ALREADY_EXECUTED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '423':
          description: Identity verification locked this recipient out (SIGNER_IDENTITY_VERIFICATION_LOCKED; details.reason).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: No identity-verification vendor is configured or reachable (ESIGN_IDENTITY_VERIFICATION_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/identity-verification/webhook/stripe:
    post:
      operationId: receiveStripeIdentityWebhook
      summary: Stripe Identity webhook receiver.
      description: >
        Aramo-Sign-Feature-Parity-Program-Directive-v1_0-LOCKED §1.9 and Amendment A1. No session. Authenticity is the
        Stripe-Signature header (HMAC-SHA256 over the raw body with SIGN_STRIPE_IDENTITY_WEBHOOK_SECRET, 300 second
        tolerance). Only the verification session id is taken from the event; the result is re-read from Stripe and
        recorded once. A vendor read failure returns 5xx so Stripe redelivers. Refused 401 while no webhook secret is set.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Received.
          content:
            application/json:
              schema:
                type: object
                required: [received, outcome]
                properties:
                  received:
                    type: boolean
                  outcome:
                    type: string
                    enum: [IGNORED, UNKNOWN_SESSION, PENDING, ALREADY_SETTLED, SETTLED]
        '401':
          description: The signature is missing, stale or invalid, or no webhook secret is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The vendor could not be read; Stripe redelivers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/sender/context:
    get:
      operationId: getSenderContext
      summary: The authenticated sender context (user, tenant, kind, workspace, permissions).
      description: >
        Resolved entirely server-side from the verified esign session. BUSINESS tenants get workspace sign, PERSONAL tenants get workspace personal (sending not enabled). Requires sign:envelope:read.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderContext'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/sender/summary:
    get:
      operationId: getSenderSummary
      summary: Dashboard counts, six-month volume and expiring envelopes.
      description: >
        Counts of sender-authored envelopes by status, completed this month, monthly sent / completed / declined-or-expired for six months, and envelopes expiring within three days. Requires sign:envelope:read.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/sender/envelopes:
    get:
      operationId: listSenderEnvelopes
      summary: List the organization's envelopes visible to the caller.
      description: >
        Filter by tab (all, drafts, waiting, completed, declined, voided, expired), free-text q (subject or recipient), and days (created within). Requires sign:envelope:read. Visibility follows the Sign permission contract — own envelopes, or every envelope of the organization with sign:envelope:read:all. Envelopes sent by another Aramo application (e.g. the ATS) are included and carry source_application; they are read-only here.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/SenderTab'
        - $ref: '#/components/parameters/SenderQuery'
        - $ref: '#/components/parameters/SenderDays'
        - $ref: '#/components/parameters/SenderLimit'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderEnvelopeList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
    post:
      operationId: createSenderEnvelope
      summary: Create a DRAFT envelope.
      description: >
        Creates an empty DRAFT owned by the calling user. Refused for a PERSONAL tenant (personal_sending_not_enabled). Requires sign:envelope:create.
        Aramo Sign Mobile M-A12 W1-A — `mode: "self"` creates a self-sign draft whose one recipient is the caller, created by
        the server (a SIGNER with the caller's verified account email, bound to the caller; never client-supplied). Recipients
        in the request, or any later recipient change, are refused 422 details.reason self_sign_single_recipient; without a
        verified account email 403 self_sign_email_unverified. Sending a self-sign envelope invites no one, is not counted
        against the sign.envelopes allowance (the "no sends left" refusal never applies; storage still does), and on
        completion the executed copy goes to the caller only. Sign it with POST /v1/sign/sender/envelopes/{id}/self-sign-session.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                  maxLength: 200
                mode:
                  type: string
                  enum: [standard, self]
                  default: standard
                  description: M-A12 W1-A — self creates a self-sign draft (one recipient, the caller).
      responses:
        '201':
          description: The created draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderDraftCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '422':
          $ref: '#/components/responses/SelfSignSingleRecipient'
  /v1/sign/sender/envelopes/{id}:
    get:
      operationId: getSenderEnvelope
      summary: Envelope detail with documents, recipients and positioned fields (ETag "{id}.{revision}").
      description: >
        Field geometry is PDF-native - page_number 0-based, points, bottom-left origin. Requires sign:envelope:read, plus ownership or sign:envelope:read:all. source_application names where the envelope came from; draft changes and send/remind/void need ownership or sign:envelope:manage:all, and an envelope from another application is refused (409 managed_by_source_application).
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderEnvelopeDetail'
          headers:
            ETag:
              $ref: '#/components/headers/EnvelopeETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateSenderEnvelope
      summary: Change a DRAFT envelope's subject, routing or sender message.
      description: >
        DRAFT only. Requires sign:envelope:create. Sign Mobile M-A3 §3/§6 — also sets the sender message (plain text,
        control characters stripped, at most 1000 characters; null or empty clears it; immutable after send). If-Match is
