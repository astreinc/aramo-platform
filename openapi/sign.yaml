          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUserProfile'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
    put:
      operationId: putSignProfile
      summary: Save (replace) the signed-in user's Sign profile.
      description: >
        Omitted optional fields are cleared. 400 details.reason invalid_body | unknown_field | invalid_display_name |
        invalid_profile_field | invalid_country | invalid_phone.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUserProfileInput'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/me/settings:
    get:
      operationId: getSignSettings
      summary: The signed-in user's Sign settings (M-A12 W1-E.2; defaults MM/DD/YYYY and M).
      description: Session (sign consumer) only, keyed by the token's tenant and user; the defaults until the first save.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUserSettings'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
    put:
      operationId: putSignSettings
      summary: Save the signed-in user's Sign settings.
      description: 400 details.reason invalid_body | unknown_field | invalid_date_format | invalid_default_field_size.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUserSettings'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUserSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/me/signing-stats:
    get:
      operationId: getSignSigningStats
      summary: The signed-in user's own signing counts (M-A14 R-4, "You're helping save paper").
      description: >
        Aramo Sign Mobile M-A14 R-4. Session (sign consumer) only, no Sign role scope; keyed by the token's tenant and user.
        Counts the envelopes this account signed (its own recipient row SIGNED): self-signed envelopes in the caller's
        tenant (a recipient bound to the caller) plus envelopes received at the caller's verified identity, matched exactly
        as the recipient inbox matches them (bindings, and discovered items while inbox discovery is on), deduplicated by
        envelope. documents_signed = those envelopes; pages_signed = the pages of their documents (a document whose page
        count was never measured counts as 1). Counts only - no titles, parties or other accounts' figures.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignSigningStats'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/me/app-issues:
    post:
      operationId: reportSignAppIssue
      summary: Report an app issue to Aramo support (M-A12 W1-E.3).
      description: >
        Emailed to support through the platform mailer; the message is never stored or logged (only its metadata, for the rate
        limit). No document data, tokens or logs are accepted. 5 per user per rolling hour (429 details.reason
        app_issue_rate_limited, retry_after_seconds). Extra properties are refused (400 unknown_field). 503
        app_issues_unavailable while the support address is not configured, app_issue_delivery_failed when the email fails.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignAppIssueInput'
      responses:
        '202':
          description: Received.
          content:
            application/json:
              schema:
                type: object
                required: [received, reference]
                properties:
                  received: { type: boolean, enum: [true] }
                  reference: { type: string, format: uuid }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '429':
          description: Too many reports in the last hour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Reporting is not available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/me/notifications:
    get:
      operationId: listSignNotifications
      summary: The signed-in user's notification feed, newest first (cursor-paged).
      description: >
        Aramo Sign Mobile (M-A3 §1). Web and mobile alike. Only the caller's own notifications
        (tenant and user from the token). Events the user caused, and routine create / attach /
        send events, are never listed. A recipient is notified only for envelopes they claimed in
        their inbox; their items carry inbox_item_id and never the sender's envelope_id. No document
        content and no capability token. Today / Earlier grouping is a client concern. Refusals:
        400 details.reason invalid_cursor | invalid_limit.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: The next_cursor of the previous page.
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: One page of the feed.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, type, envelope_id, inbox_item_id, envelope_subject, actor_name, created_at, read_at]
                      properties:
                        id:
                          type: string
                          format: uuid
                        type:
                          type: string
                          enum: [SIGNED, VIEWED, DECLINED, SIGNATURE_NEEDED, COMPLETED, EXPIRED, REMINDER]
                        envelope_id:
                          type: [string, 'null']
                          format: uuid
                          description: The caller's own envelope (sender items). Null on a recipient item.
                        inbox_item_id:
                          type: [string, 'null']
                          format: uuid
                          description: The recipient's inbox item (GET /v1/sign/inbox). Null on a sender item.
                        envelope_subject:
                          type: string
                        actor_name:
                          type: [string, 'null']
                          description: The signer (sender items) or the sending organization (recipient items).
                        created_at:
                          type: string
                          format: date-time
                        read_at:
                          type: [string, 'null']
                          format: date-time
                  next_cursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/me/notifications/unread-count:
    get:
      operationId: getSignNotificationUnreadCount
      summary: The number of unread notifications (the badge).
      description: Count of the caller's own unread feed items (tenant and user scoped). Drives the tab badge on every device.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count:
                    type: integer
                    minimum: 0
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/me/notifications/{id}/read:
    post:
      operationId: markSignNotificationRead
      summary: Mark one of the caller's notifications read (idempotent).
      description: Sets read_at on one of the caller's feed items. An item owned by another user or tenant answers 404.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Read.
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          description: No such notification for the caller (another user's id answers the same).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/me/notifications/read-all:
    post:
      operationId: markAllSignNotificationsRead
      summary: Mark every notification of the caller read.
      description: Sets read_at on all of the caller's unread feed items. Scoped to the caller's tenant and user.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '204':
          description: All read.
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/me/devices/current:
    put:
      operationId: registerSignPushDevice
      summary: Register or rotate the push token of the caller's own native device session.
      description: >
        Aramo Sign Mobile (M-A3 §2, M-A1 §3.6). Native access tokens only (client = native): the
        registration attaches to the token's own device session (dsid); no request field identifies
        a device. The token is stored encrypted; the same token registered on another device session
        is unregistered there. Refusals: 400 details.reason invalid_push_registration; 403
        native_session_required (not a native token) | session_revoked (the device session was
        signed out); 503 push_registration_unavailable (push is not configured).
      tags: [sender]
      security:
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, provider, push_token, app_version]
              properties:
                platform:
                  type: string
                  enum: [ios, android]
                provider:
                  type: string
                  enum: [apns, fcm]
                push_token:
                  type: string
                  maxLength: 4096
                  description: APNs device token (hex) or FCM registration token.
                app_version:
                  type: string
                  maxLength: 64
      responses:
        '204':
          description: Registered.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '503':
          description: Push notifications are not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: removeSignPushDevice
      summary: Remove the push registration of the caller's own native device session.
      description: >
        Revokes the registration, deletes its token and cancels its queued pushes. Idempotent.
        403 details.reason native_session_required for a non-native token.
      tags: [sender]
      security:
        - senderBearer: []
      responses:
        '204':
          description: Removed (or nothing was registered).
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/me/notification-preferences:
    get:
      operationId: getSignNotificationPreferences
      summary: The caller's push preferences.
      description: >
        Per type push on/off (default on) and whether the envelope subject may show on the lock
        screen (default off: pushes use generic text). COMPLETED follows `signed`; EXPIRED has no
        switch. The feed is written regardless of these.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [signed, viewed, declined, signature_needed, reminders, lock_screen_subject]
                additionalProperties: false
                properties:
                  signed:
                    type: boolean
                  viewed:
                    type: boolean
                  declined:
                    type: boolean
                  signature_needed:
                    type: boolean
                  reminders:
                    type: boolean
                  lock_screen_subject:
                    type: boolean
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
    put:
      operationId: putSignNotificationPreferences
      summary: Replace the caller's push preferences (all six fields).
      description: Refusal 400 details.reason invalid_notification_preferences.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signed, viewed, declined, signature_needed, reminders, lock_screen_subject]
              additionalProperties: false
              properties:
                signed:
                  type: boolean
                viewed:
                  type: boolean
                declined:
                  type: boolean
                signature_needed:
                  type: boolean
                reminders:
                  type: boolean
                lock_screen_subject:
                  type: boolean
      responses:
        '200':
          description: The saved preferences.
          content:
            application/json:
              schema:
                type: object
                required: [signed, viewed, declined, signature_needed, reminders, lock_screen_subject]
                additionalProperties: false
                properties:
                  signed:
                    type: boolean
                  viewed:
                    type: boolean
                  declined:
                    type: boolean
                  signature_needed:
                    type: boolean
                  reminders:
                    type: boolean
                  lock_screen_subject:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/s2s/talent-erasure/preflight:
    post:
      operationId: preflightTalentErasure
      summary: Which Aramo Sign records block erasing an ATS talent (read-only).
      description: >
        Aramo-Sign-Domain-Isolation-Reconciliation-V1 §2 R-3. Service-to-service only (no public
        route). The ATS erasure engine asks Sign what it holds about the talent instead of reading
        the sign schema. Authenticated as the first-party aramo-ats Sign API client (HTTP Basic);
        any other application is refused. Every holder returned blocks the erasure.
      tags: [privacy-s2s]
      security:
        - atsClientBasic: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignTalentErasureScope'
      responses:
        '200':
          description: The blocking holders (empty when nothing blocks).
          content:
            application/json:
              schema:
                type: object
                required: [holders, erasable]
                properties:
                  holders:
                    type: array
                    items:
                      $ref: '#/components/schemas/SignTalentErasureHolder'
                  erasable:
                    $ref: '#/components/schemas/SignTalentErasureCounts'
        '400':
          description: Invalid tenant or id lists.
        '401':
          description: Client authentication failed.
        '403':
          description: The client is not the first-party ATS application.
  /v1/sign/s2s/talent-erasure/erase:
    post:
      operationId: eraseTalentFromSign
      summary: Erase Sign's replay caches and delivered outbox events naming an ATS talent.
      description: >
        Aramo-Sign-Domain-Isolation-Reconciliation-V1 §2 R-3, §4 D-2. Service-to-service only.
        Re-checks every holder under a tenant lock; when one exists nothing is deleted and the
        holders are returned. Never touches an envelope, signer, signing event, executed document
        or certificate. Idempotent: a repeat deletes nothing.
      tags: [privacy-s2s]
      security:
        - atsClientBasic: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SignTalentErasureScope'
                - type: object
                  required: [run_id]
                  properties:
                    run_id:
                      type: string
                      format: uuid
      responses:
        '200':
          description: Erased (with counts) or blocked (nothing deleted).
          content:
            application/json:
              schema:
                type: object
                required: [status, run_id]
                properties:
                  status:
                    type: string
                    enum: [erased, blocked]
                  run_id:
                    type: string
                    format: uuid
                  counts:
                    $ref: '#/components/schemas/SignTalentErasureCounts'
                  holders:
                    type: array
                    items:
                      $ref: '#/components/schemas/SignTalentErasureHolder'
        '400':
          description: Invalid tenant, run or id lists.
        '401':
          description: Client authentication failed.
        '403':
          description: The client is not the first-party ATS application.
  /v1/sign/sender/reports/overview:
    get:
      operationId: getSenderReportsOverview
      summary: Organization reports — volume, turnaround, completion rate, by sender and by template.
      description: >
        Aramo-Sign-Feature-Parity-Program-Directive v1.0 §1.13 (basic reports). Totals, completion rate, turnaround and the breakdowns describe envelopes SENT in the range; the volume series counts each sent / completed / declined / voided event in the period it happened. Read-only, organization-wide. Requires sign:report:read and a BUSINESS tenant (plans B+). Refused with ESIGN_FEATURE_NOT_AVAILABLE (403) while the sign.reports capability is not available.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - name: from
          in: query
          required: false
          description: First day of the range (YYYY-MM-DD, UTC, inclusive). Default the first day of the month five months before `to`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Last day of the range (YYYY-MM-DD, UTC, inclusive). Default today. A range covers at most 731 days.
          schema:
            type: string
            format: date
        - name: period
          in: query
          required: false
          description: Volume series granularity (UTC; weeks start Monday). A daily series covers at most 366 days.
          schema:
            type: string
            enum: [day, week, month]
            default: month
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignReportsOverview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/sender/reports/export:
    get:
      operationId: exportSenderReport
      summary: One report table as CSV (summary, volume, senders or templates).
      description: >
        The same figures as the overview, as an RFC 4180 CSV attachment (text cells that a spreadsheet would read as a formula are prefixed with an apostrophe). Requires sign:report:read and a BUSINESS tenant (plans B+). Refused with ESIGN_FEATURE_NOT_AVAILABLE (403) while the sign.reports capability is not available.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - name: from
          in: query
          required: false
          description: First day of the range (YYYY-MM-DD, UTC, inclusive). Default the first day of the month five months before `to`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Last day of the range (YYYY-MM-DD, UTC, inclusive). Default today. A range covers at most 731 days.
          schema:
            type: string
            format: date
        - name: period
          in: query
          required: false
          description: Volume series granularity (UTC; weeks start Monday). A daily series covers at most 366 days.
          schema:
            type: string
            enum: [day, week, month]
            default: month
        - name: report
          in: query
          required: false
          schema:
            type: string
            enum: [summary, volume, senders, templates]
            default: summary
      responses:
        '200':
          description: CSV attachment.
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/sender/reports/envelopes/export:
    get:
      operationId: exportSenderEnvelopeAudit
      summary: Envelope audit export (CSV) — envelopes created in the range, with status and timestamps.
      description: >
        Columns envelope_id, subject, status, sender_id, sender_name, source_application, template_ref, created_at, sent_at, completed_at, declined_at, voided_at, recipients, signed, purge_state, purge_level, purge_executed_at. Never document contents, field values or recipient identities. A purged envelope's subject reads [purged] (metadata level and above) and a redacted envelope has no sender name. At most 10000 envelopes (400 VALIDATION_ERROR too_many_rows otherwise). Deleted drafts are excluded. Requires sign:report:read and a BUSINESS tenant (plans B+). Refused with ESIGN_FEATURE_NOT_AVAILABLE (403) while the sign.reports capability is not available.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - name: from
          in: query
          required: false
          description: First day of the range (YYYY-MM-DD, UTC, inclusive). Default the first day of the month five months before `to`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Last day of the range (YYYY-MM-DD, UTC, inclusive). Default today. A range covers at most 731 days.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: CSV attachment.
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/sender/branding:
