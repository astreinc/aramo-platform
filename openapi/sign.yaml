      description: >
        Requires sign:envelope:read.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/SenderLimit'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SenderLedgerEvent'
        '400':
