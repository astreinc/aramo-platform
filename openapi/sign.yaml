          application/json:
            schema:
              $ref: '#/components/schemas/SenderContactPatch'
      responses:
        '200':
          description: The updated contact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderContact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteSenderContact
      summary: Delete one of the caller's saved contacts.
      description: >
        Requires sign:envelope:create. Owner-isolated - another user's or tenant's contact is 404.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/ContactId'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  # ── Aramo Sign Mobile — notification feed, push device, push preferences ──
  # (Aramo-Sign-Unified-Product-Amendment-M-A3-Mobile-Owned-Data-Contracts-v1_0-LOCKED §1, §2, §9)
  /v1/sign/me/notifications:
    get:
      operationId: listSignNotifications
      summary: The signed-in user's notification feed, newest first (cursor-paged).
      description: >
        Aramo Sign Mobile (M-A3 §1). Web and mobile alike. Only the caller's own notifications
        (tenant and user from the token). Events the user caused, and routine create / attach /
        send events, are never listed. A recipient is notified only for envelopes they claimed in
        their inbox; their items carry inbox_item_id and never the sender's envelope_id. No document
        content and no capability token. Today / Earlier grouping is a client concern. Refusals:
        400 details.reason invalid_cursor | invalid_limit.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: The next_cursor of the previous page.
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: One page of the feed.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, type, envelope_id, inbox_item_id, envelope_subject, actor_name, created_at, read_at]
                      properties:
                        id:
                          type: string
                          format: uuid
                        type:
                          type: string
                          enum: [SIGNED, VIEWED, DECLINED, SIGNATURE_NEEDED, COMPLETED, EXPIRED, REMINDER]
                        envelope_id:
                          type: [string, 'null']
                          format: uuid
                          description: The caller's own envelope (sender items). Null on a recipient item.
                        inbox_item_id:
                          type: [string, 'null']
                          format: uuid
                          description: The recipient's inbox item (GET /v1/sign/inbox). Null on a sender item.
                        envelope_subject:
                          type: string
                        actor_name:
                          type: [string, 'null']
                          description: The signer (sender items) or the sending organization (recipient items).
                        created_at:
                          type: string
                          format: date-time
                        read_at:
                          type: [string, 'null']
                          format: date-time
                  next_cursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/me/notifications/unread-count:
    get:
      operationId: getSignNotificationUnreadCount
      summary: The number of unread notifications (the badge).
      description: Count of the caller's own unread feed items (tenant and user scoped). Drives the tab badge on every device.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count:
                    type: integer
                    minimum: 0
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/me/notifications/{id}/read:
    post:
      operationId: markSignNotificationRead
      summary: Mark one of the caller's notifications read (idempotent).
      description: Sets read_at on one of the caller's feed items. An item owned by another user or tenant answers 404.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Read.
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          description: No such notification for the caller (another user's id answers the same).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sign/me/notifications/read-all:
    post:
      operationId: markAllSignNotificationsRead
      summary: Mark every notification of the caller read.
      description: Sets read_at on all of the caller's unread feed items. Scoped to the caller's tenant and user.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '204':
          description: All read.
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/me/devices/current:
    put:
      operationId: registerSignPushDevice
      summary: Register or rotate the push token of the caller's own native device session.
      description: >
        Aramo Sign Mobile (M-A3 §2, M-A1 §3.6). Native access tokens only (client = native): the
        registration attaches to the token's own device session (dsid); no request field identifies
        a device. The token is stored encrypted; the same token registered on another device session
        is unregistered there. Refusals: 400 details.reason invalid_push_registration; 403
        native_session_required (not a native token) | session_revoked (the device session was
        signed out); 503 push_registration_unavailable (push is not configured).
      tags: [sender]
      security:
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, provider, push_token, app_version]
              properties:
                platform:
                  type: string
                  enum: [ios, android]
                provider:
                  type: string
                  enum: [apns, fcm]
                push_token:
                  type: string
                  maxLength: 4096
                  description: APNs device token (hex) or FCM registration token.
                app_version:
                  type: string
                  maxLength: 64
      responses:
        '204':
          description: Registered.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '503':
          description: Push notifications are not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: removeSignPushDevice
      summary: Remove the push registration of the caller's own native device session.
      description: >
        Revokes the registration, deletes its token and cancels its queued pushes. Idempotent.
        403 details.reason native_session_required for a non-native token.
      tags: [sender]
      security:
        - senderBearer: []
      responses:
        '204':
          description: Removed (or nothing was registered).
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/sign/me/notification-preferences:
    get:
      operationId: getSignNotificationPreferences
      summary: The caller's push preferences.
      description: >
        Per type push on/off (default on) and whether the envelope subject may show on the lock
        screen (default off: pushes use generic text). COMPLETED follows `signed`; EXPIRED has no
        switch. The feed is written regardless of these.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [signed, viewed, declined, signature_needed, reminders, lock_screen_subject]
                additionalProperties: false
                properties:
                  signed:
                    type: boolean
                  viewed:
                    type: boolean
                  declined:
                    type: boolean
                  signature_needed:
                    type: boolean
                  reminders:
                    type: boolean
                  lock_screen_subject:
                    type: boolean
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
    put:
      operationId: putSignNotificationPreferences
      summary: Replace the caller's push preferences (all six fields).
      description: Refusal 400 details.reason invalid_notification_preferences.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signed, viewed, declined, signature_needed, reminders, lock_screen_subject]
              additionalProperties: false
              properties:
                signed:
                  type: boolean
                viewed:
                  type: boolean
                declined:
                  type: boolean
                signature_needed:
                  type: boolean
                reminders:
                  type: boolean
                lock_screen_subject:
                  type: boolean
      responses:
        '200':
          description: The saved preferences.
          content:
            application/json:
              schema:
                type: object
                required: [signed, viewed, declined, signature_needed, reminders, lock_screen_subject]
                additionalProperties: false
                properties:
                  signed:
                    type: boolean
                  viewed:
                    type: boolean
                  declined:
                    type: boolean
                  signature_needed:
                    type: boolean
                  reminders:
                    type: boolean
                  lock_screen_subject:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
components:
  securitySchemes:
    senderSession:
      type: apiKey
      in: cookie
      name: aramo_access_token_sign
      description: The HttpOnly esign consumer session cookie (sent with X-Aramo-Consumer sign).
    senderBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The shared auth-service access token for the esign consumer.
    signApiToken:
      type: http
      scheme: bearer
      bearerFormat: opaque (sgt_…)
      description: A short-lived Sign API access token from /v1/sign/oauth/token (never a session token).
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      description: The envelope document id (UUID).
      schema:
        type: string
        format: uuid
    SenderTab:
      name: tab
      in: query
      required: false
      description: Status tab.
      schema:
        type: string
        enum: [all, drafts, waiting, completed, declined, voided, expired]
    SenderQuery:
      name: q
      in: query
      required: false
      description: Free text matched against subject and recipient name or email.
      schema:
        type: string
    SenderDays:
      name: days
      in: query
      required: false
      description: Only envelopes created within this many days.
      schema:
        type: integer
        minimum: 1
    SenderLimit:
      name: limit
      in: query
      required: false
      description: Maximum rows.
      schema:
        type: integer
        minimum: 1
        maximum: 500
    EnvelopeId:
      name: id
      in: path
      required: true
      description: The signature envelope id (UUID).
      schema:
        type: string
        format: uuid
    # Sign Mobile M-A3 §5–§8 (W2b)
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >
        The envelope's last-read ETag "{envelope_id}.{revision}". Required for native (mobile) tokens on draft writes, send and
        void (428 precondition_required); enforced whenever sent (412 revision_mismatch, details.current_revision).
      schema:
        type: string
        example: '"e5000000-0000-7000-8000-0000000000a1.3"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        1 to 255 printable characters, scoped to (tenant, authenticated user, operation, key) for 24 hours. A replay with the same
        body returns the first response; a different body is 422 idempotency_key_reuse; 409 idempotency_request_in_progress while
        the first request runs.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    ContactId:
      name: contactId
      in: path
      required: true
      description: A saved contact id (UUID).
      schema:
        type: string
        format: uuid
  headers:
    # Sign Mobile M-A3 §6 (W2b)
    EnvelopeETag:
      description: The strong validator "{envelope_id}.{revision}" - send it back as If-Match.
      schema:
        type: string
  responses:
    # Sign Mobile M-A3 §6–§8 (W2b)
    RevisionMismatch:
      description: 412 — details.reason revision_mismatch; details.current_revision is the envelope's revision now. Re-read and retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionRequired:
      description: 428 — details.reason precondition_required; a native token must send If-Match on this write.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdempotencyKeyReuse:
      description: 422 — details.reason idempotency_key_reuse; the Idempotency-Key was used with a different request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ReminderLimited:
      description: >
        429 ESIGN_REMINDER_NOT_ALLOWED — details.reason reminder_cooldown (under 60 minutes since this signer was reminded) or
        reminder_daily_limit (5 reminders on this envelope in the rolling 24 hours); details.retry_after_seconds and
        details.retry_at (ISO 8601) tell when to try again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SenderUnauthorized:
      description: No valid esign session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SenderForbidden:
      description: Not the esign consumer, the tenant lacks the esign capability, the scope is missing, or a PERSONAL tenant attempted a write.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The envelope was not found in the caller's tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: An illegal envelope transition.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: The signing capability token is invalid or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BillingConflict:
      description: >-
        ESIGN_BILLING_CONFLICT (details.reason) — already subscribed (ALREADY_SUBSCRIBED), no billing
        account yet (NO_BILLING_ACCOUNT), an incomplete or non-US organization profile, an unverified
        domain, a plan that needs ATS (PLAN_NOT_ELIGIBLE), or an open governed subscription managed by
        Aramo (governed_subscription_open; CCP-A6, Conversion Rule C-1 and C-4: a conversion is a
        governed change request, never a checkout). CCP-C7 self-service actions add (lower-case
        reasons): governed_subscription_open, activation_pending, conversion_in_progress,
        no_self_service_subscription, provider_change_pending, already_canceling and
        financial_treatment_undefined.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BillingUnavailable:
      description: ESIGN_BILLING_UNAVAILABLE — online billing is not configured or the provider is unreachable. CCP-C7 self-service actions also answer it with details.reason self_service_terms_not_approved (the designed disabled state while the Sign Terms of Service are not APPROVED) or product_not_self_service.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    BillingPlan:
      type: object
      description: A catalog plan (Commercial Plans Amendment A1). Prices are display values in minor units; the charge is the provider price. reference_price is present only when substantiated.
      required: [key, name, sales_model, status, price, reference_price, commitment_months, eligibility, eligible, allowances, capacities, features, purchasable]
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        tenant_kind:
          type: [string, 'null']
        sales_model:
          type: string
          enum: [SELF_SERVICE, FREE, CONTACT_SALES, OPERATOR]
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        price:
          type: [object, 'null']
          properties:
            amount_minor:
              type: integer
            currency:
              type: string
            interval:
              type: [string, 'null']
        reference_price:
          type: [object, 'null']
          properties:
            amount_minor:
              type: integer
            currency:
              type: string
        commitment_months:
          type: [integer, 'null']
        eligibility:
          type: [string, 'null']
        eligible:
          type: boolean
        support_tier:
          type: [string, 'null']
        activation_note:
          type: [string, 'null']
        allowances:
          type: array
          items:
            type: object
            required: [allowance_key, included_quantity, unlimited, period, available]
            properties:
              allowance_key:
                type: string
              included_quantity:
                type: [integer, 'null']
              unlimited:
                type: boolean
              period:
                type: string
                enum: [MONTHLY]
              available:
                type: boolean
                description: The capability is built and operational (an entitlement that is not available is never advertised).
        capacities:
          type: array
          items:
            type: object
            required: [capacity_key, limit, unlimited, available]
            properties:
              capacity_key:
                type: string
              limit:
                type: [integer, 'null']
              unlimited:
                type: boolean
              available:
                type: boolean
        features:
          type: array
          items:
            type: object
            required: [feature_key, enabled, available]
            properties:
              feature_key:
                type: string
              enabled:
                type: boolean
                description: Included by the plan (entitlement).
              available:
                type: boolean
                description: Built and operational (launch availability).
        purchasable:
          type: boolean
    TaxAvailability:
      type: object
      additionalProperties: false
      description: >-
        CCP-C5 (PBD §5.2 row C5, §10) — tax is a designed disabled state until Stripe Tax
        registration. Always enabled=false with reason STRIPE_TAX_NOT_REGISTERED; no setting enables
        it, and no tax is calculated, collected or shown.
      required: [enabled, reason]
      properties:
        enabled:
          type: boolean
          enum: [false]
        reason:
          type: string
          enum: [STRIPE_TAX_NOT_REGISTERED]
    BillingAccount:
      type: object
      required: [subscription, allowance, storage, billing_available, tax, tenant_kind, self_service_eligible, can_manage_billing]
      properties:
        tax:
          $ref: '#/components/schemas/TaxAvailability'
        pending_activation:
          type: [object, 'null']
          description: >-
            CCP-A6-R (Conversion Rule C-8) — a self-service activation is held because the organization's
            subscription is managed by Aramo. A safe billing-support state only: it never reports an
            activation and exposes no internal reason.
          required: [state, message]
          properties:
            state:
              type: string
              enum: [PENDING]
            message:
              type: string
              enum: ['Subscription activation pending — contact support']
        subscription:
          type: [object, 'null']
          required: [plan_key, plan_name, source, status, sending, started_at, cancel_at_period_end, billing_managed]
          properties:
            plan_key:
              type: string
            plan_name:
              type: string
            source:
              type: string
              enum: [MANUAL, DEVELOPMENT, SELF_SERVICE, FREE]
              description: FREE — the system-opened Free Personal subscription (no billing provider).
            status:
              type: string
              enum: [TRIALING, ACTIVE, PAST_DUE, CANCELED, INCOMPLETE]
            sending:
              type: boolean
            started_at:
              type: string
              format: date-time
            ended_at:
              type: [string, 'null']
              format: date-time
            current_period_end:
              type: [string, 'null']
              format: date-time
            cancel_at_period_end:
              type: boolean
            grace_until:
              type: [string, 'null']
              format: date-time
            billing_managed:
              type: boolean
            commitment_months:
              type: [integer, 'null']
            commitment_end:
              type: [string, 'null']
              format: date-time
            cancel_requested_within_commitment:
              type: boolean
            eligibility_state:
              type: [string, 'null']
              enum: [OK, LAPSED, null]
            list_price:
              type: [object, 'null']
            features:
              type: array
              items:
                type: object
            export_access_until:
              type: [string, 'null']
              format: date-time
        allowance:
          type: object
          description: >
            Subscribed allowance status (limit — null when unlimited, unlimited, used, remaining — null when unlimited,
            period_start, period_end, threshold, and — only when the plan has a day window, e.g. Free Personal — daily)
            or { subscribed false, state }.
          properties:
            daily:
              type: object
              description: Personal Free v1.1 §4 — the day window (any 24 hours) on top of the monthly allowance. Absent for plans without one.
              required: [window, limit, used, remaining, next_available_at]
              properties:
                window:
                  type: string
                  enum: [DAY]
                limit:
                  type: integer
                used:
                  type: integer
                remaining:
                  type: integer
                next_available_at:
                  type: [string, 'null']
                  format: date-time
                  description: When the oldest counted send leaves the window (null while under the cap).
        storage:
          type: [object, 'null']
          description: Storage used against the plan (capacity_key, limit — null when not limited, unlimited, used); null without a subscription.
        billing_available:
          type: boolean
        tenant_kind:
          type: string
          enum: [BUSINESS, PERSONAL]
        self_service_eligible:
          type: boolean
        can_manage_billing:
          type: boolean
    SelfServiceActionState:
      type: object
      additionalProperties: false
      required: [available, reason]
      properties:
        available:
          type: boolean
        reason:
          type: [string, 'null']
          enum: [PRODUCT_NOT_SELF_SERVICE, SELF_SERVICE_TERMS_NOT_APPROVED, GOVERNED_SUBSCRIPTION_OPEN, ACTIVATION_PENDING, CONVERSION_IN_PROGRESS, NO_SELF_SERVICE_SUBSCRIPTION, PROVIDER_CHANGE_PENDING, ALREADY_CANCELING, PLAN_NOT_AVAILABLE, FINANCIAL_TREATMENT_UNDEFINED, null]
    SelfServiceBilling:
      type: object
      additionalProperties: false
      description: CCP-C7 — the self-service state of one registered product (v1 registry, sign only).
      required: [product_key, terms, subscription, pending_provider, pending_changes, actions, can_manage_billing]
      properties:
        product_key:
          type: string
          enum: [sign]
        terms:
          type: object
          additionalProperties: false
          required: [state, document_key, version, url]
          properties:
            state:
              type: string
              enum: [APPROVED, NOT_APPROVED]
            document_key:
              type: string
            version:
              type: [string, 'null']
            url:
              type: [string, 'null']
        subscription:
          type: [object, 'null']
          additionalProperties: false
          required: [plan_key, status, current_period_end, cancel_at_period_end, commitment_end]
          properties:
            plan_key:
              type: string
            status:
              type: string
            current_period_end:
              type: [string, 'null']
              format: date-time
            cancel_at_period_end:
              type: boolean
            commitment_end:
              type: [string, 'null']
              format: date-time
        pending_provider:
          type: boolean
        pending_changes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [action, state, requested_at, confirmed_at]
            properties:
              action:
                type: string
                enum: [CANCEL_AT_PERIOD_END]
              state:
                type: string
                enum: [PENDING_PROVIDER, CONFIRMED]
              requested_at:
                type: string
                format: date-time
              confirmed_at:
                type: [string, 'null']
                format: date-time
        actions:
          type: object
          additionalProperties: false
          required: [cancel, upgrade]
          properties:
            cancel:
              $ref: '#/components/schemas/SelfServiceActionState'
            upgrade:
              $ref: '#/components/schemas/SelfServiceActionState'
        can_manage_billing:
          type: boolean
    SelfServiceBillingAccepted:
      type: object
      additionalProperties: false
      required: [request_id, action, status, pending_provider, replayed]
      properties:
        request_id:
          type: string
          format: uuid
        action:
          type: string
          enum: [CANCEL_AT_PERIOD_END]
        status:
          type: string
          enum: [PENDING_PROVIDER, CONFIRMED]
        pending_provider:
          type: boolean
        replayed:
          type: boolean
    BillingRedirect:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
    SignLegalStatus:
      type: object
      required: [pending]
      properties:
        pending:
          type: array
          description: Current approved Personal legal documents the user has not accepted (empty for a BUSINESS tenant).
          items:
            type: object
            required: [key, version, url, title]
            properties:
              key:
                type: string
                enum: [sign.personal_terms_of_service, aramo.privacy_notice, aramo.acceptable_use_policy]
              version:
                type: string
              url:
                type: string
                format: uri
                description: The published text on the Sign host (https://sign.aramo.ai/legal/<slug>/<version>).
              title:
                type: string
    SignLegalNotices:
      type: object
      required: [notices]
      properties:
        notices:
          type: array
          description: Upcoming legal-document versions (future effective date) this user has not dismissed.
          items:
            type: object
            required: [key, title, version, effective_date, url, current_version, current_url]
            properties:
              key:
                type: string
              title:
                type: string
              version:
                type: string
              effective_date:
                type: string
                format: date
                description: The first day the new version applies.
              url:
                type: string
                format: uri
                description: The new version on the Sign host (https://sign.aramo.ai/legal/<slug>/<version>).
              current_version:
                type: string
              current_url:
                type: string
                format: uri
    SignAccountStatus:
      type: object
      required: [closable, closed, closed_at]
      properties:
        closable:
          type: boolean
          description: True only for the owner of an open PERSONAL account.
        closed:
          type: boolean
        closed_at:
          type: [string, 'null']
          format: date-time
    SignPrivacyRequest:
      type: object
      description: Aramo-Sign-Mobile-Amendment-M-A7 §3.1 — a privacy request as its requester sees it.
      required: [reference, request_type, subject_kind, channel, status, status_label, referred_to_organization, due_at, created_at, updated_at, completed_at, outcome_code, outcome_text, retained, organization_decides, privacy_contact]
      properties:
        reference:
          type: string
          example: PR-7K3M-9QX2-H4TD
        request_type:
          type: string
          enum: [DELETION, ACCESS, EXPORT, CORRECTION]
        subject_kind:
          type: string
          enum: [ACCOUNT_HOLDER, BUSINESS_MEMBER, GUEST_SIGNER, FORMER_USER, AUTHORIZED_REPRESENTATIVE]
        channel:
          type: string
          enum: [IN_APP, WEB, OPERATOR]
        status:
          type: string
          enum: [RECEIVED, IDENTITY_VALIDATED, DATA_INVENTORY, REFERRED_TO_ORGANIZATION, EXECUTING, COMPLETED, DENIED_WITH_REASON, CANCELLED]
        status_label:
          type: string
        referred_to_organization:
          type: boolean
        due_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        outcome_code:
          type: [string, 'null']
        outcome_text:
          type: [string, 'null']
        retained:
          type: array
          description: What is kept, and why (DELETION only).
          items:
            type: object
            required: [key, label, why]
            properties:
              key:
                type: string
              label:
                type: string
              why:
                type: string
        organization_decides:
          type: [string, 'null']
        privacy_contact:
          type: string
    SignAccountClosed:
      type: object
      required: [state, closed_at]
      properties:
        state:
          type: string
          enum: [closed]
        closed_at:
          type: string
          format: date-time
    SenderContext:
      type: object
      required: [user, tenant, workspace, permissions, can_send, personal_sending_enabled]
      properties:
        user:
          type: object
          required: [id, email, display_name, identity_provider]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: [string, 'null']
            display_name:
              type: [string, 'null']
            identity_provider:
              type: [string, 'null']
              enum: [google, microsoft, null]
              description: >-
                Sign Mobile B-11 — the federated provider the user signs in with ("Signed in with Google/Microsoft"), from the
                provider recorded on the user's sign-in link (or the enforced pin of the tenant for a link made before
                providers were recorded). null when not known; never a guess.
        tenant:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            kind:
              type: string
              enum: [BUSINESS, PERSONAL]
        workspace:
          type: string
          enum: [sign, personal]
        permissions:
          type: object
          description: >
            The caller's effective Sign permissions (Sign permission contract). read_all, manage_all, members and billing are false for a PERSONAL account.
          properties:
            read:
              type: boolean
            read_all:
              type: boolean
            create:
              type: boolean
            send:
              type: boolean
            manage_all:
              type: boolean
            contacts:
              type: boolean
            members:
              type: boolean
            billing:
              type: boolean
            templates:
              type: boolean
              description: DOC-TEMPLATE-LIB-1 T-5 — the session holds document_template:read (start envelopes from templates).
        features:
          type: object
          description: >
            DOC-TEMPLATE-LIB-1 T-5 — plan capabilities by launch availability. templates = the sign.templates capability is available; while false every template route answers ESIGN_FEATURE_NOT_AVAILABLE (403).
          properties:
            templates:
              type: boolean
            in_person_signing:
              type: boolean
              description: Aramo-Sign-Unified-Product-Amendment-M-A5 §3.7 — the sign.in_person_signing capability (hosted signing) is available.
        can_send:
          type: boolean
        personal_sending_enabled:
          type: boolean
          description: True only for a bound (ACTIVE) PERSONAL tenant while Personal sending is switched on (SIGN_PERSONAL_SIGNUP_MODE not off).
        organization_url:
          type: [string, 'null']
        app_home_url:
          type: [string, 'null']
        org_admin:
          type: boolean
          description: >-
            ORG-UX-1 (LOCKED §4.3/§6) — the caller holds an organization role (tenant_owner or
            tenant_admin) in this BUSINESS tenant. Role-based; navigation only.
        organization_roles_url:
          type: [string, 'null']
          description: ORG-UX-1 §6 — Organization → Users & product access (the single role-assignment surface), or null.
        personal_account_owner:
          type: boolean
          description: >-
            Aramo-Sign-Mobile-Amendment-M-A8 §2.1 — true only for the tenant_owner of a PERSONAL
            tenant, who may delete their own account. Every other subject is a Business user:
            the organization manages the account; privacy requests stay available.
    SenderTemplateRole:
      type: object
      description: Amendment M-A6 §3.2 — a template signing role. SIGNER roles sign; CC roles receive a copy.
      required: [role_key, label, kind, order]
      properties:
        role_key:
          type: string
        label:
          type: string
        kind:
          type: string
          enum: [SIGNER, CC]
        order:
          type: integer
          minimum: 1
    SenderTemplateSigning:
      type: object
      required: [roles, routing_mode]
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/SenderTemplateRole'
        routing_mode:
          type: string
          enum: [PARALLEL, SEQUENTIAL]
        default_subject:
          type: string
        default_message:
          type: string
    SenderTemplateRoleBinding:
      type: object
      required: [role_key, name, email]
      properties:
        role_key:
          type: string
          maxLength: 40
        name:
          type: string
          maxLength: 200
        email:
          type: string
          maxLength: 254
    SenderTemplateSignatureField:
      type: object
      required: [field_type, page_number, x, y, width, height]
      properties:
        field_type:
          type: string
          enum: [SIGNATURE, SIGNER_NAME, SIGN_DATE]
        role_key:
          type: string
          description: The SIGNER role of the block (templates with signing roles only).
        page_number:
          type: integer
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
    SenderTemplateVariable:
      type: object
      required: [key, label, group, source, value]
      properties:
        key:
          type: string
        label:
          type: string
        group:
          type: string
        source:
          type: string
          enum: [ORGANIZATION, SENDER]
        value:
          type: [string, 'null']
    SenderTemplateList:
      type: object
      required: [items, unavailable]
      properties:
        items:
          type: array
          items:
            type: object
            required:
              [template_id, name, description, document_type, owner_scope, resolution, is_default, version_id, version_number, updated_at, variables, category, signer_role_count, cc_role_count, document_count, routing_mode, signing]
            properties:
              template_id:
                type: string
                format: uuid
              name:
                type: string
              description:
                type: [string, 'null']
              document_type:
                type: object
                required: [id, key, name]
                properties:
                  id:
                    type: string
                    format: uuid
                  key:
                    type: string
                  name:
                    type: string
              owner_scope:
                type: string
                enum: [PLATFORM, TENANT]
              resolution:
                type: string
                enum: [CLIENT_SELECTION, TENANT_SELECTION, PLATFORM_DEFAULT, WITHDRAWAL_FALLBACK, AVAILABLE]
              is_default:
                type: boolean
                description: The template the automatic per-type resolution picks (M-A6 §3.1).
              version_id:
                type: string
                format: uuid
              version_number:
                type: integer
              updated_at:
                type: string
                format: date-time
              variables:
                type: array
                items:
                  $ref: '#/components/schemas/SenderTemplateVariable'
              category:
                type: string
                description: The document type's name (M-A6 §3.7).
              signer_role_count:
                type: integer
              cc_role_count:
                type: integer
              document_count:
                type: integer
              routing_mode:
                type: string
                enum: [PARALLEL, SEQUENTIAL]
              signing:
                oneOf:
                  - $ref: '#/components/schemas/SenderTemplateSigning'
                  - type: 'null'
        unavailable:
          type: array
          items:
            type: object
            required: [document_type_id, reason]
            properties:
              document_type_id:
                type: string
                format: uuid
              reason:
                type: string
    SignTokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: [client_credentials, 'urn:ietf:params:oauth:grant-type:token-exchange', 'urn:aramo:params:oauth:grant-type:sign-event']
        client_id:
          type: string
        client_secret:
          type: string
        scope:
          type: string
          description: Space-separated subset of the effective permissions.
        subject_token:
          type: string
          description: token-exchange only — the user's Aramo access token.
        subject_token_type:
          type: string
          enum: ['urn:ietf:params:oauth:token-type:access_token']
        external_role:
          type: string
          description: client_credentials only — honoured only if the installation may assert it and a mapping exists.
        external_actor:
          type: string
          description: client_credentials only — the platform's own actor reference, recorded for audit.
        event_id:
          type: string
          format: uuid
          description: >
            sign-event only (Addendum S6) — the id of a completion event Sign delivered to the AUTHENTICATED
            application's subscription. Yields a read grant (≤ 5 minutes) for that event's envelope's executed
            documents and evidence only; tenant and envelope come from Sign's records, never from the caller.
    SignTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope, tenant_id, installation_id, mode]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
        scope:
          type: string
        tenant_id:
          type: string
          format: uuid
        installation_id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [USER, APPLICATION]
        envelope_id:
          type: string
          format: uuid
          description: Set on an event-bound grant — the only envelope it can read.
    SignAvailability:
      type: object
      required: [available, reason, allowance]
      properties:
        available:
          type: boolean
        reason:
          type: [string, 'null']
          enum: [NOT_SUBSCRIBED, LIMIT_REACHED, null]
        allowance:
          type: [object, 'null']
    SignApiCreateEnvelope:
      type: object
      required: [subject, documents, signers]
      properties:
        subject:
          type: string
        documents:
          type: array
          items:
            type: object
            description: Either content_base64 (+ title, filename) or, for Aramo applications, document_ref + document_revision_ref + source_sha256.
        signers:
          type: array
          minItems: 1
          maxItems: 10
          description: Distinct emails; signing_order values 1 to N with no gaps or repeats (list position when omitted).
          items:
            type: object
            required: [name, email]
            properties:
              name:
                type: string
              email:
                type: string
              signing_order:
                type: integer
                minimum: 1
        routing_mode:
          type: string
          enum: [PARALLEL, SEQUENTIAL]
          description: PARALLEL (default) - every signer may sign at once. SEQUENTIAL - only the signer whose turn it is may act; the next is invited when they sign.
        fields:
          type: array
          items:
            type: object
        send:
          type: boolean
    SenderEnvelopeList:
      type: object
      required: [items, counts]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SenderEnvelopeListItem'
        counts:
          $ref: '#/components/schemas/SenderEnvelopeCounts'
    SenderEnvelopeListItem:
      type: object
      required: [id, subject, status, created_at, sent_at, completed_at, last_activity_at, document_count, source_application, recipients]
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: string
        status:
          $ref: '#/components/schemas/SenderEnvelopeStatus'
        created_at:
          type: string
          format: date-time
        sent_at:
          type: [string, 'null']
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        last_activity_at:
          type: [string, 'null']
          format: date-time
          description: The latest ledger event, or the last update when there is none.
        document_count:
          type: integer
          minimum: 0
        source_application:
          type: string
          description: Where the envelope came from (aramo-sign, aramo-ats or a registered application); only aramo-sign envelopes are editable here.
        recipients:
          type: array
          items:
            type: object
            required: [id, name, email, status, recipient_kind]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              email:
                type: [string, 'null']
                description: Null only for an in-person signer without an email (M-A5 §3.5).
              status:
                $ref: '#/components/schemas/SenderRecipientStatus'
              recipient_kind:
                $ref: '#/components/schemas/SenderRecipientKind'
    SenderEnvelopeCounts:
      type: object
      description: >-
        Envelopes the caller may see, by status, over every tab (the same visibility as the list). A status with no envelope
        is absent (read it as 0).
      properties:
        DRAFT: { type: integer, minimum: 0 }
        SENT: { type: integer, minimum: 0 }
        IN_PROGRESS: { type: integer, minimum: 0 }
        COMPLETED: { type: integer, minimum: 0 }
        DECLINED: { type: integer, minimum: 0 }
        VOIDED: { type: integer, minimum: 0 }
        EXPIRED: { type: integer, minimum: 0 }
      additionalProperties:
        type: integer
        minimum: 0
    SenderEnvelopeStatus:
      type: string
      enum: [DRAFT, SENT, IN_PROGRESS, COMPLETED, DECLINED, VOIDED, EXPIRED]
    SenderRecipientStatus:
      type: string
      enum: [PENDING, VIEWED, SIGNED, DECLINED]
    SenderRecipientKind:
      type: string
      enum: [SIGNER, IN_PERSON_SIGNER, RECEIVES_COPY]
      description: >-
        Aramo-Sign-Unified-Product-Amendment-M-A5 §1 — SIGNER signs through an emailed link; IN_PERSON_SIGNER signs on the
        host's device (hosted session); RECEIVES_COPY never signs (no fields, no session, no turn, never reminded, never blocks
        completion).
    SenderCopyDelivery:
      type: string
      enum: [ON_SEND, ON_COMPLETION, BOTH]
      description: M-A5 §2.1 — when a copy recipient receives their copy.
    SenderIssuedSigningSession:
      type: object
      description: >-
        M-A5 §3.2 / §4.2 — a hosted or self-sign session. The token is a signing capability for the guest signing routes
        (/v1/sign/signing/*); it is returned only to the authenticated caller and must never be logged or shared.
      required: [session_origin, signer_id, token, expires_at]
      properties:
        session_origin:
          type: string
          enum: [HOSTED, SELF]
        signer_id:
          type: string
          format: uuid
        token:
          type: string
        expires_at:
          type: string
          format: date-time
    SenderPageSize:
      type: object
      description: >-
        One page of a source PDF in PDF points - the page's MediaBox, the frame field geometry is placed and validated in
        (origin bottom-left). Pages are 0-based by position (pages[page_number]).
      required: [width, height]
      properties:
        width:
          type: number
          exclusiveMinimum: 0
        height:
          type: number
          exclusiveMinimum: 0
    SenderEnvelopeDocument:
      type: object
      required: [id, title, ordinal, content_type, byte_size, source_sha256, field_count, page_count, pages]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        ordinal:
          type: integer
          minimum: 0
        content_type:
          type: [string, 'null']
        byte_size:
          type: [integer, 'null']
        source_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        field_count:
          type: integer
          minimum: 0
        page_count:
          type: [integer, 'null']
          minimum: 1
          description: Sign Mobile D-W6-2 — the number of pages; null only when the source could not be read.
        pages:
          type: [array, 'null']
          description: >-
            Sign Mobile D-W6-2 — each page's size (computed from the source at upload; measured on first read for older
            documents). null only when the source could not be read.
          items:
            $ref: '#/components/schemas/SenderPageSize'
    SenderEnvelopeRecipient:
      type: object
      required: [id, name, email, status, signing_order, recipient_kind, copy_delivery, assigned_to_me, viewed_at, signed_at, declined_at, decline_reason, can_remind, reminder_available_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: [string, 'null']
          description: Null only for an in-person signer without an email (M-A5 §3.5).
        recipient_kind:
          $ref: '#/components/schemas/SenderRecipientKind'
        copy_delivery:
          oneOf:
            - $ref: '#/components/schemas/SenderCopyDelivery'
            - type: 'null'
          description: M-A5 §2.1 — set only for RECEIVES_COPY.
        assigned_to_me:
          type: boolean
          description: M-A5 §4.1 — this recipient is bound to the caller (Assign to me). The bound user id itself is never returned.
        status:
          $ref: '#/components/schemas/SenderRecipientStatus'
        signing_order:
          type: integer
          minimum: 1
          description: The position in the signing order (used when the envelope signs in order).
        viewed_at:
          type: [string, 'null']
          format: date-time
        signed_at:
          type: [string, 'null']
          format: date-time
        declined_at:
          type: [string, 'null']
          format: date-time
        decline_reason:
          type: [string, 'null']
        can_remind:
          type: boolean
          description: An unsigned signer who may sign now (in an open envelope). Never a copy recipient or an in-person signer (M-A5).
        reminder_available_at:
          type: [string, 'null']
          format: date-time
          description: Sign Mobile M-A3 §7 — when a reminder to this signer is next allowed; null when allowed now or not remindable.
        role_key:
          type: [string, 'null']
          description: Amendment M-A6 §3.5 — the template role this recipient was bound to (an envelope started from a template with roles); null otherwise.
    SenderExecutedDocuments:
      type: object
      required: [envelope_id, documents, certificate]
      properties:
        envelope_id:
          type: string
          format: uuid
        documents:
          type: array
          items:
            type: object
            required: [envelope_document_id, title, executed_sha256, byte_size, executed_base64]
            properties:
              envelope_document_id:
                type: string
                format: uuid
              title:
                type: string
              executed_sha256:
                type: string
                pattern: '^[0-9a-f]{64}$'
              byte_size:
                type: integer
              executed_base64:
                type: string
                description: The executed PDF, base64.
        certificate:
          type: [object, 'null']
          required: [certificate_sha256, byte_size, certificate_base64]
          properties:
            certificate_sha256:
              type: string
              pattern: '^[0-9a-f]{64}$'
            byte_size:
              type: integer
            certificate_base64:
              type: string
              description: The certificate of completion (PDF), base64.
    RecipientInbox:
      type: object
      description: The signed-in user's bound documents, split by what they can do now.
      required: [waiting, completed, other]
      properties:
        waiting:
          type: array
          description: Documents the user can sign now (can_sign).
          items:
            $ref: '#/components/schemas/RecipientInboxItem'
        completed:
          type: array
          description: Completed documents the user signed (can_download).
          items:
            $ref: '#/components/schemas/RecipientInboxItem'
        other:
          type: array
          description: Everything else (declined, voided, expired, or someone else's turn).
          items:
            $ref: '#/components/schemas/RecipientInboxItem'
    RecipientInboxItem:
      type: object
      description: >-
        Recipient facts only (Sign Unified Product §4.6) - never other recipients' data, sender administration or the
        activity log.
      required: [id, subject, from, envelope_status, my_status, sent_at, expires_at, envelope_expires_at, signing_link_valid_days, completed_at, signed_at, can_sign, can_download]
      properties:
        id:
          type: string
          format: uuid
          description: The binding id (path parameter of /v1/sign/inbox/{id}/*).
        subject:
          type: string
        from:
          type: [string, 'null']
          description: The sending organization's name.
        envelope_status:
          $ref: '#/components/schemas/SenderEnvelopeStatus'
        my_status:
          $ref: '#/components/schemas/SenderRecipientStatus'
        sent_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
          deprecated: true
          description: Deprecated - the same value as envelope_expires_at.
        envelope_expires_at:
          type: [string, 'null']
          format: date-time
          description: Sign Mobile C-14 — when the envelope itself expires.
        signing_link_valid_days:
          type: integer
          description: Sign Mobile C-14 — the constant signing-link TTL (7 days).
        completed_at:
          type: [string, 'null']
          format: date-time
        signed_at:
          type: [string, 'null']
          format: date-time
        can_sign:
          type: boolean
        can_download:
          type: boolean
    SenderDraftCreated:
      type: object
      required: [id, status, subject]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        subject:
          type: string
    SenderEnvelopeDetail:
      type: object
      required: [id, subject, status, documents, recipients, fields, editable]
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: string
        status:
          type: string
          enum: [DRAFT, SENT, IN_PROGRESS, COMPLETED, DECLINED, VOIDED, EXPIRED]
        created_at:
          type: string
          format: date-time
        sent_at:
          type: [string, 'null']
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        declined_at:
          type: [string, 'null']
          format: date-time
        voided_at:
          type: [string, 'null']
          format: date-time
        signing_window_days:
          type: integer
        sender:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: [string, 'null']
        source_application:
          type: string
        editable:
          type: boolean
        routing_mode:
          type: string
          enum: [PARALLEL, SEQUENTIAL]
        next_signer_id:
          type: [string, 'null']
          description: When signing in order and the envelope is open, the signer whose turn it is.
        revision:
          type: integer
          minimum: 1
          description: Sign Mobile M-A3 §6 — raised by every change to the envelope or its children; the ETag is "{id}.{revision}".
        message:
          type: [string, 'null']
          maxLength: 1000
          description: Sign Mobile M-A3 §3 — the sender's plain-text message (settable in DRAFT, immutable after send).
        signing_link_valid_days:
          type: integer
          description: Sign Mobile C-14 — the constant signing-link TTL (7 days).
        envelope_expires_at:
          type: [string, 'null']
          format: date-time
          description: Sign Mobile C-14 — when the envelope itself expires (default 30 days after send).
        expires_at:
          type: [string, 'null']
          format: date-time
          deprecated: true
          description: Deprecated - sent_at + the 7-day link window. Use signing_link_valid_days and envelope_expires_at.
        documents:
          type: array
          items:
            $ref: '#/components/schemas/SenderEnvelopeDocument'
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/SenderEnvelopeRecipient'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SenderEnvelopeField'
    SenderEnvelopeField:
      type: object
      description: >-
        A stored field of the envelope, as the sender detail returns it. Any of the seven engine
        types (fields from the service-to-service, Sign API and template paths keep theirs).
        PDF-native geometry - page_number 0-based, points, origin bottom-left. M-A6 §2 configuration
        is null where it does not apply. Other recipients' values are never returned.
      required: [id, envelope_document_id, signer_id, field_type, page_number, x, y, width, height, required, filled]
      properties:
        id:
          type: string
          format: uuid
        envelope_document_id:
          type: string
          format: uuid
        signer_id:
          type: [string, 'null']
          format: uuid
        field_type:
          type: string
          enum: [SIGNATURE, INITIALS, SIGN_DATE, SIGNER_NAME, TEXT, CHECKBOX, ACKNOWLEDGEMENT]
        page_number:
          type: integer
          minimum: 0
        x:
          type: number
        y:
          type: number
        width:
          type: [number, 'null']
        height:
          type: [number, 'null']
        required:
          type: boolean
        filled:
          type: boolean
        name_mode:
          type: [string, 'null']
          enum: [SIGNER_PROFILE, SIGNER_ENTERED, null]
        label:
          type: [string, 'null']
        group_key:
          type: [string, 'null']
        group_rule:
          type: [string, 'null']
          enum: [SELECT_ONE, SELECT_ANY, null]
        min_selected:
          type: [integer, 'null']
          minimum: 1
    SenderFieldPassthrough:
      type: object
      description: >-
        M-A6 §2 — an engine-only field (a type a sender cannot author, e.g. ACKNOWLEDGEMENT) sent
        back unchanged on the replace-all PUT. Kept as stored only when `id` names an existing field
        of the envelope and every other property is identical to the stored row (exactly as the
        detail returned it); otherwise refused with 400 v1_field_type. Omitting it removes it.
      required: [id, envelope_document_id, signer_id, field_type, page_number, x, y, width, height]
      properties:
        id:
          type: string
          format: uuid
        envelope_document_id:
          type: string
          format: uuid
        signer_id:
          type: [string, 'null']
          format: uuid
        field_type:
          type: string
          enum: [SIGNATURE, INITIALS, SIGN_DATE, SIGNER_NAME, TEXT, CHECKBOX, ACKNOWLEDGEMENT]
        page_number:
          type: integer
          minimum: 0
        x:
          type: number
        y:
          type: number
        width:
          type: [number, 'null']
        height:
          type: [number, 'null']
        required:
          type: boolean
        name_mode:
          type: [string, 'null']
          enum: [SIGNER_PROFILE, SIGNER_ENTERED, null]
        label:
          type: [string, 'null']
        group_key:
          type: [string, 'null']
        group_rule:
          type: [string, 'null']
          enum: [SELECT_ONE, SELECT_ANY, null]
        min_selected:
          type: [integer, 'null']
    SenderFieldInput:
      type: object
      description: PDF-native geometry - page_number 0-based, points, origin bottom-left, (x, y) the box lower-left corner.
      required: [envelope_document_id, signer_id, field_type, page_number, x, y, width, height]
      properties:
        envelope_document_id:
          type: string
          format: uuid
        signer_id:
          type: string
          format: uuid
        field_type:
          type: string
          description: >-
            M-A6 §2.1 — the sender authoring types. ACKNOWLEDGEMENT is engine-only (the
            service-to-service and Sign API paths keep all seven engine types).
          enum: [SIGNATURE, INITIALS, SIGN_DATE, TEXT, SIGNER_NAME, CHECKBOX]
        page_number:
          type: integer
          minimum: 0
        x:
          type: number
          minimum: 0
        y:
          type: number
          minimum: 0
        width:
          type: number
          exclusiveMinimum: 0
        height:
          type: number
          exclusiveMinimum: 0
        required:
          type: boolean
        name_mode:
          type: [string, 'null']
          enum: [SIGNER_PROFILE, SIGNER_ENTERED, null]
          description: >-
            M-A6 §2.2 — SIGNER_NAME only (default SIGNER_PROFILE: the server fills the signer's
            name; SIGNER_ENTERED: the signer types it). The sender never supplies a value.
        label:
          type: [string, 'null']
          maxLength: 200
          description: M-A6 §2.3 — CHECKBOX only; the caption printed in the certificate.
        group_key:
          type: [string, 'null']
          maxLength: 64
          description: >-
            M-A6 §2.3 — CHECKBOX only; boxes sharing a key form a group, which belongs to one
            recipient and shares one rule, minimum and required setting.
        group_rule:
          type: [string, 'null']
          enum: [SELECT_ONE, SELECT_ANY, null]
          description: M-A6 §2.3 — with group_key only (default SELECT_ANY).
        min_selected:
          type: [integer, 'null']
          minimum: 1
          description: M-A6 §2.3 — with group_key only; the boxes a required group needs checked (default 1; 1 for SELECT_ONE).
    SenderUploadedDocument:
      type: object
      required: [id, envelope_id, title, ordinal, byte_size, page_count, pages, revision]
      properties:
        id:
          type: string
          format: uuid
        envelope_id:
          type: string
          format: uuid
        title:
          type: string
        ordinal:
          type: integer
          minimum: 0
        byte_size:
          type: [integer, 'null']
        page_count:
          type: integer
          minimum: 1
        pages:
          type: array
          items:
            $ref: '#/components/schemas/SenderPageSize'
        revision:
          type: integer
          minimum: 1
          description: >-
            Sign Mobile D-W6-1 — the envelope revision after this upload (the response's ETag is "{envelope_id}.{revision}");
            send it as the next If-Match. A replay with the same Idempotency-Key returns the first response unchanged.
    SenderLedgerEvent:
      type: object
      required: [id, event_type, occurred_at, actor, event_hash]
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        actor:
          type: string
        event_hash:
          type: string
    # Sign Mobile M-A3 §4/§5 (W2b)
    SenderContactInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 254
        organization:
          type: [string, 'null']
          maxLength: 200
    SenderContactPatch:
      type: object
      description: At least one of name, email or organization.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 254
        organization:
          type: [string, 'null']
          maxLength: 200
    SenderContact:
      type: object
      required: [id, name, email, organization, source, created_at, updated_at, last_used_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        organization:
          type: [string, 'null']
        source:
          type: string
          enum: [saved]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, 'null']
          format: date-time
    SenderContactListItem:
      type: object
      required: [id, name, email, organization, source, envelope_count, last_used_at]
      properties:
        id:
          type: [string, 'null']
          format: uuid
          description: The saved contact id; null for a recent recipient.
        name:
          type: string
        email:
          type: string
        organization:
          type: [string, 'null']
        source:
          type: string
          enum: [saved, recent]
        envelope_count:
          type: integer
        last_used_at:
          type: [string, 'null']
          format: date-time
    SavedSignatureInput:
      type: object
      required: [kind, image_data_url]
      properties:
        kind:
          type: string
          enum: [TYPED, DRAWN]
        typed_name:
          type: string
          maxLength: 100
          description: Required for TYPED.
        font_key:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,39}$'
          description: Required for TYPED.
        image_data_url:
          type: string
          pattern: '^data:image/(png|jpeg);base64,'
          description: The rendered image - PNG or JPEG only (drawn strokes are rasterized on the device).
    SavedSignature:
      type: object
      required: [kind, typed_name, font_key, image_data_url, updated_at]
      properties:
        kind:
          type: string
          enum: [TYPED, DRAWN]
        typed_name:
          type: [string, 'null']
        font_key:
          type: [string, 'null']
        image_data_url:
          type: string
        updated_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      description: The canonical Aramo error envelope.
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    CreateEnvelopeRequest:
      type: object
      required:
        - tenant_id
        - subject
        - execution_mode
        - created_by
        - documents
        - signers
      properties:
        tenant_id:
          type: string
          format: uuid
        subject:
          type: string
        execution_mode:
          type: string
          enum: [ACKNOWLEDGEMENT, SINGLE_SIGNATURE, MULTI_SIGNATURE]
        created_by:
          type: string
          format: uuid
        idempotency_key:
          type: string
        documents:
          type: array
          items:
            type: object
            required: [document_ref, document_revision_ref, title, source_sha256, ordinal]
            properties:
              document_ref:
                type: string
                format: uuid
              document_revision_ref:
                type: string
                format: uuid
              title:
                type: string
              source_sha256:
                type: string
              ordinal:
                type: integer
        signers:
          type: array
          items:
            type: object
            required: [email, name, signing_order]
            properties:
              email:
                type: string
              name:
                type: string
              signing_order:
                type: integer
              signer_role:
                type: string
        fields:
          description: >-
            PX-V1 F2 — OPTIONAL positioned signature/date fields defined at
            envelope creation. Each references a document by ordinal and,
            optionally, a signer by signing_order. Omitted by ATS RTR/Offer
            callers, which remain valid unchanged.
          type: array
          items:
            type: object
            required: [document_ordinal, field_type, page_number, x, y]
            properties:
              document_ordinal:
                type: integer
              signer_signing_order:
                type: integer
              field_type:
                type: string
                enum: [SIGNATURE, INITIALS, SIGN_DATE, SIGNER_NAME, TEXT, CHECKBOX, ACKNOWLEDGEMENT]
              page_number:
                type: integer
              x:
                type: number
              y:
                type: number
              width:
                type: number
              height:
                type: number
              required:
                type: boolean
    EnvelopeSummary:
      type: object
      required:
        - envelope_id
        - status
        - signers
      properties:
        envelope_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [DRAFT, SENT, IN_PROGRESS, COMPLETED, DECLINED, VOIDED, EXPIRED]
        signers:
          type: array
          items:
            type: object
            properties:
              signer_id:
                type: string
                format: uuid
              email:
                type: string
              status:
                type: string
                enum: [PENDING, VIEWED, SIGNED, DECLINED]
    EvidenceSummary:
      type: object
      required:
        - envelope_id
        - status
      properties:
        envelope_id:
          type: string
          format: uuid
        status:
          type: string
        event_chain_hash:
          type: [string, 'null']
        signature:
          type: [string, 'null']
        signature_algorithm:
          type: [string, 'null']
        completed_at:
          type: [string, 'null']
          format: date-time
