        - document_type_id
        - resource_type
        - resource_id
        - status
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        document_type_id:
          type: string
          format: uuid
        resource_type:
          type: string
        resource_id:
          type: string
          format: uuid
        relationship:
          type: [string, 'null']
        status:
          type: string
          enum: [UNSATISFIED, SATISFIED, WAIVED]
        satisfied_by_document_id:
          type: [string, 'null']
          format: uuid
    RequirementVerdict:
