openapi: 3.1.0
info:
  title: Aramo Documents API
  version: 0.0.0
  description: |
    DOC-1a — the canonical, workflow-neutral Documents domain. Documents own a
    single canonical identity, controlled polymorphic associations to business
    resources, an append-only lifecycle event ledger, and immutable artifacts.
    All operations are tenant-scoped and require the `core` capability. Reads
    require `document:read`; document creation/preparation/association require
    `document:create`; document-type management requires `document:manage`.
paths:
  /v1/document-types:
    post:
      operationId: createDocumentType
      summary: Create a tenant document type.
      description: Registers a tenant-scoped document type. Requires `document:manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentTypeRequest'
      responses:
        '201':
          description: The created document type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentType'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      operationId: listDocumentTypes
      summary: List document types available to the tenant.
      description: Returns the tenant's own types plus SYSTEM types. Requires `document:read`.
      responses:
        '200':
          description: The list of document types.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentType'
  /v1/documents:
    post:
      operationId: createDocument
      summary: Create a document.
      description: |
        Creates a canonical document (status DRAFT) with optional business
        associations. Supports the canonical idempotency pattern via the
        optional `Idempotency-Key` header. Requires `document:create`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional idempotency key. A replay with a different body is a 409.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '201':
          description: The created (or idempotently replayed) document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      operationId: listDocuments
      summary: List documents for the tenant.
      description: Returns the tenant's documents, newest first. Requires `document:read`.
      responses:
        '200':
          description: The list of documents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
  /v1/documents/{id}:
    get:
      operationId: getDocument
      summary: Get a document by id.
      description: Returns a tenant-scoped document. A cross-tenant id is a 404. Requires `document:read`.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/documents/{id}/prepare:
    post:
      operationId: prepareDocument
      summary: Prepare a document (DRAFT to PREPARED).
      description: |
        Transitions a DRAFT document to PREPARED. A no-op on an already-PREPARED
        document. Any other source state is a 409. Requires `document:create`.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The prepared document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/documents/{id}/associations:
    post:
      operationId: addDocumentAssociation
      summary: Associate a document with a business resource.
      description: Adds a controlled-vocabulary association. Requires `document:create`.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssociationRequest'
      responses:
        '201':
          description: The created association.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentAssociation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/documents/{id}/events:
    get:
      operationId: listDocumentEvents
      summary: List a document's append-only lifecycle events.
      description: Returns the document's events in chronological order. Requires `document:read`.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The document's events.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentEvent'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/documents/{id}/artifacts:
    get:
      operationId: listDocumentArtifacts
      summary: List a document's artifacts (optionally filtered to a specific role).
      description: >
        Returns the document's stored artifacts. Requires `document:read`. The optional
        `role` query filter resolves a SPECIFIC artifact role (e.g. EXECUTED vs
        EXECUTION_CERTIFICATE) rather than the undifferentiated collection.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - name: role
          in: query
          required: false
          description: Filter to a single artifact role.
          schema:
            type: string
            enum: [TEMPLATE_SOURCE, SOURCE_UPLOAD, RENDERED_UNSIGNED, EXECUTED, EXECUTION_CERTIFICATE, PREVIEW, ATTACHMENT]
      responses:
        '200':
          description: The document's artifacts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentArtifact'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/document-templates:
    post:
      operationId: createDocumentTemplate
      summary: Create a document template.
      description: Creates a DRAFT template (GENERATED, UPLOADED_PDF, or HYBRID). Requires `document_template:manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequest'
      responses:
        '201':
          description: The created template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      operationId: listDocumentTemplates
      summary: List document templates for the tenant.
      description: Requires `document_template:read`.
      responses:
        '200':
          description: The list of templates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentTemplate'
  /v1/document-templates/{id}:
    get:
      operationId: getDocumentTemplate
      summary: Get a document template.
      description: Requires `document_template:read`.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTemplate'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: renameDocumentTemplate
      summary: Rename a document template.
      description: |
        Saves the template name on the TEMPLATE (DocumentTemplate.name; shared by every
        version — not draft content, so it does not re-arm the preview gate). The name is
        trimmed and must be 1..120 characters. Tenant-scoped (unknown or cross-tenant ids
        are 404). Returns the same template view as GET. Requires `document_template:manage`.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameTemplateRequest'
      responses:
        '200':
          description: The renamed template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/document-templates/{id}/versions:
    post:
      operationId: createTemplateVersion
      summary: Create a DRAFT template version.
      description: Version numbers auto-increment. Requires `document_template:manage`.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVersionRequest'
      responses:
        '201':
          description: The created version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateVersion'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      operationId: listTemplateVersions
      summary: List versions of a template.
      description: Requires `document_template:read`.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplateVersion'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/document-templates/{id}/draft:
    post:
      operationId: createTemplateDraft
      summary: Open a new editable DRAFT by copying the current ACTIVE content.
      description: |
        Creates a DRAFT vN+1 whose editable content is copied from the template's
        current ACTIVE version. One DRAFT per template — refused (409) if one is already
        open. Requires `document_template:manage`.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '201':
          description: The created DRAFT version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateVersion'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/document-templates/{id}/allowed-bindings:
    get:
      operationId: listTemplateAllowedBindings
      summary: The governed Insert-field binding catalog for a template's document type.
      description: |
        The closed set of bindings the draft editor may insert (the single source the
        editor generates its Insert menu from). Empty for a non-configurable document
        type. Requires `document_template:read`.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The allowed bindings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowedBindingsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/document-templates/versions/{versionId}:
    get:
      operationId: getTemplateVersion
      summary: Get a single template version (content + provenance + preview-gate markers).
      description: Requires `document_template:read`.
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateVersion'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTemplateDraftVersion
      summary: Update a DRAFT version's editable content.
      description: |
        DRAFT-only (ACTIVE/RETIRED -> 409 TEMPLATE_IMMUTABLE). Editing re-arms the
        preview-before-approve gate. For `rtr-html-v1` content the html is sanitised server-side
        against the A1 allowlist and the sanitised form is stored and returned; an unknown field key →
        422 VALIDATION_ERROR (details.reason = unknown_field, details.keys); a misplaced / repeated logo
        node → 422 (logo_position); over 64 KB → 422 (content_too_large). Requires `document_template:manage`.
      parameters:
        - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVersionRequest'
      responses:
        '200':
          description: The updated DRAFT version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteTemplateDraftVersion
      summary: Discard the open DRAFT version.
      description: |
        Deletes a DRAFT version (and its field definitions). DRAFT-only — ACTIVE/RETIRED
        versions are immutable (409 TEMPLATE_IMMUTABLE). The template's current_version_id
        and ACTIVE version are unchanged; the one-DRAFT slot is freed. Tenant-scoped
        (unknown or cross-tenant ids are 404). Requires `document_template:manage`.
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '204':
          description: The DRAFT version was discarded.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/document-templates/versions/{versionId}/preview:
    post:
      operationId: previewTemplateVersion
      summary: Fixed-sample preview of the current DRAFT content.
      description: |
        Validates the content and substitutes safe sample values, then records the
        preview to arm the activation gate. Creates NO business document, association,
        requirement or envelope. Requires `document_template:manage`.
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: The resolved sample preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateSamplePreview'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/document-templates/versions/{versionId}/logo:
    post:
      operationId: captureTemplateVersionLogo
      summary: Capture the Tenant profile logo into a DRAFT version (letterhead).
      description: |
        Amendment A1 §2.4. DRAFT only. The server fetches the Tenant profile logo (Tenant.logo_url) ONCE, here
        (https only, no IP-literal/local hosts, no redirects, 5 s timeout, max 1 MB, image/png or image/jpeg
        verified by magic bytes), stores the bytes + sha256 as a LOGO TemplateAsset (bytes in documents object
        storage), references it from the version content and places the logo node first. The renderer never
        fetches the network. Activation freezes the asset reference with the version. No Tenant profile logo →
        409 VALIDATION_ERROR (details.reason = no_tenant_logo); an unusable logo → 422 (details.reason =
        logo_url_not_https | logo_url_host_refused | logo_url_invalid | logo_too_large | logo_type_invalid |
        logo_fetch_failed). Requires `document_template:manage`.
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '201':
          description: The captured logo asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateLogoCaptureResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: removeTemplateVersionLogo
      summary: Remove the logo from a DRAFT version.
      description: Removes the logo reference AND the logo node from the DRAFT content (the asset row is kept for versions that still reference it). DRAFT only. Requires `document_template:manage`.
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '204':
          description: The logo was removed.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/document-templates/versions/{versionId}/logo/content:
    get:
      operationId: getTemplateVersionLogoContent
      summary: The frozen logo image bytes of a version (editor letterhead).
      description: Returns the PNG/JPEG bytes of the version's frozen logo asset. 404 when the version has no logo. Requires `document_template:read`.
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: The logo image.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/document-templates/versions/{versionId}/activate:
    post:
      operationId: activateTemplateVersion
      summary: Activate a DRAFT template version (DRAFT -> ACTIVE).
      description: |
        Activates the version and retires any prior ACTIVE version of the same
        template. Once ACTIVE the version is immutable. Requires `document_template:manage`.
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: The activated version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateVersion'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/document-templates/versions/{versionId}/fields:
    post:
      operationId: addTemplateField
      summary: Add a field definition to a DRAFT version.
      description: Rejected once the version is ACTIVE (immutable). Requires `document_template:manage`.
      parameters:
        - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFieldRequest'
      responses:
        '201':
          description: The created field definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateFieldDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      operationId: listTemplateFields
      summary: List the field definitions of a version.
      description: Requires `document_template:read`.
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: The field definitions, ordered.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplateFieldDefinition'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/document-requirements:
    post:
      operationId: createDocumentRequirement
      summary: Create a document requirement.
      description: Creates an UNSATISFIED requirement bound to a business resource. Requires `document_requirement:manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequirementRequest'
      responses:
        '201':
          description: The created requirement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentRequirement'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      operationId: listDocumentRequirements
      summary: List document requirements (optionally filtered by resource).
      description: Requires `document_requirement:read`.
      parameters:
        - name: resource_type
          in: query
          required: false
          schema:
            type: string
        - name: resource_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requirements.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentRequirement'
  /v1/document-requirements/{id}/check:
    get:
      operationId: checkDocumentRequirement
      summary: Read a requirement's satisfaction verdict.
      description: |
        Read-only verdict, determined INDEPENDENTLY of any business transition.
        Requires `document_requirement:read`.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The verdict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementVerdict'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/document-requirements/{id}/satisfy:
    post:
      operationId: satisfyDocumentRequirement
      summary: Satisfy a requirement by linking a document.
      description: Requires `document_requirement:manage`.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SatisfyRequirementRequest'
      responses:
        '200':
          description: The satisfied requirement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentRequirement'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/document-requirements/{id}/waive:
    post:
      operationId: waiveDocumentRequirement
      summary: Waive a requirement.
      description: The waiver authority. Requires `document_requirement:manage`.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaiveRequirementRequest'
      responses:
        '200':
          description: The waived requirement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentRequirement'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/document-packets:
    post:
      operationId: createDocumentPacket
      summary: Create a document packet (a grouping of documents).
      description: A packet groups documents; it does not own their business state. Requires `document:create`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePacketRequest'
      responses:
        '201':
          description: The created packet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPacket'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      operationId: listDocumentPackets
      summary: List document packets for the tenant.
      description: Requires `document:read`.
      responses:
        '200':
          description: The packets with their items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentPacket'
  /v1/document-packets/{id}:
    get:
      operationId: getDocumentPacket
      summary: Get a document packet with its items.
      description: Requires `document:read`.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The packet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPacket'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/document-packets/{id}/items:
    post:
      operationId: addDocumentPacketItem
      summary: Add a document to a packet.
      description: Requires `document:create`.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPacketItemRequest'
      responses:
        '201':
          description: The created packet item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPacketItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/documents/revisions/{id}/source:
    get:
      operationId: getRevisionSource
      summary: Source PDF bytes (base64) for a frozen revision — pulled by esign-service for executed-document production and the signer document view (DOC-4).
      description: >
        Service-to-service read callable ONLY by esign-service (ES-2). Every request carries
        `X-Aramo-Esign-S2S-Timestamp` (unix seconds) and `X-Aramo-Esign-S2S-Signature`:
        base64 HMAC-SHA256, keyed by the shared E-Sign secret, over the newline-joined
        canonical string `aramo-esign-s2s-v1`, the upper-case method, the exact request path,
        the normalized query (pairs sorted by key, each component percent-encoded, joined by
        `&`; a repeated key is rejected) and the timestamp. The tag domain-separates it from
        the lifecycle-webhook signature. Core verifies it in constant time within ±300s. It
        authenticates the caller only; it is not a signer authorization. Residual: an
        identical captured request is replayable inside the window (no nonce store).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Aramo-Esign-S2S-Timestamp
          in: header
          required: true
          description: Unix epoch seconds when the request was signed. Rejected if outside ±300s of now.
          schema:
            type: string
        - name: X-Aramo-Esign-S2S-Signature
          in: header
          required: true
          description: base64(HMAC-SHA256(secret, canonical aramo-esign-s2s-v1 string)).
          schema:
            type: string
      responses:
        '200':
          description: The base64 source PDF.
          content:
            application/json:
              schema:
                type: object
                required: [revision_id, source_base64]
                properties:
                  revision_id: { type: string, format: uuid }
                  source_base64: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, malformed, stale or invalid esign-service request signature (AUTH_REQUIRED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: esign-service request authentication is not configured (ESIGN_SERVICE_AUTH_UNAVAILABLE); fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/integrations/esign/events:
    post:
      operationId: receiveEsignLifecycleEvent
      summary: Canonical E-Sign → Core lifecycle-event webhook receiver (Independent-Digital-Signature-Platform Directive §9).
      description: >
        Consumer-owned, authenticated receiver for GENERIC E-Sign lifecycle events. The E-Sign
        platform delivers each event with two headers: `X-Aramo-Esign-Timestamp` (unix seconds)
        and `X-Aramo-Esign-Signature` (base64 HMAC-SHA256 over the string `{timestamp}.{raw
        request body}`, keyed by the shared webhook secret). Core verifies the signature and a
        bounded timestamp window (±300s) before processing, then interprets the event
        idempotently (dedup by `event_id`). Delivery is at-least-once; a 2xx is returned ONLY
        after durable acceptance. This is the canonical (and only) E-Sign → Core callback; the
        transitional `/v1/documents/esign-writeback` HTTP endpoint was retired in ES-2.
      parameters:
        - name: X-Aramo-Esign-Timestamp
          in: header
          required: true
          description: Unix epoch seconds when the event was signed. Rejected if outside ±300s of now.
          schema:
            type: string
        - name: X-Aramo-Esign-Signature
          in: header
          required: true
          description: base64(HMAC-SHA256(secret, "{timestamp}.{raw body}")).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, event_type, event_version, occurred_at, tenant_id, envelope_id, correlation_id]
              properties:
                event_id: { type: string, description: Stable across every delivery retry (the durable outbox row id). }
                event_type: { type: string, description: 'Generic signing fact, e.g. esign.envelope.executed.v1.' }
                event_version: { type: integer }
                occurred_at: { type: string, format: date-time }
                tenant_id: { type: string, format: uuid }
                envelope_id: { type: string, format: uuid }
                correlation_id: { type: string }
                artifact_refs:
                  type: object
                  description: Identifier-only references (no bytes/PII).
                  properties:
                    executed_document_ids:
                      type: array
                      items: { type: string, format: uuid }
                    has_certificate: { type: boolean }
      responses:
        '200':
          description: Event durably accepted (or acknowledged-and-ignored for a non-completion event).
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received: { type: boolean }
                  event_id: { type: string }
                  ignored: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, stale, or invalid signature.
        '422':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: Webhook verification is not provisioned (signing secret unset).
components:
  parameters:
    DocumentId:
      name: id
      in: path
      required: true
      description: The document id (UUID).
      schema:
        type: string
        format: uuid
    VersionId:
      name: versionId
      in: path
      required: true
      description: The template version id (UUID).
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The document was not found in the caller's tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: An illegal transition or an idempotency-key conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: The content was refused by server-side validation (details.reason names why).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      description: The canonical Aramo error envelope.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: The stable error code.
        message:
          type: string
          description: A human-readable message.
    DocumentType:
      type: object
      description: A semantic business document type.
      required:
        - id
        - key
        - name
        - scope
        - execution_mode_default
        - retention_class
        - active
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: [string, 'null']
          format: uuid
        key:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        scope:
          type: string
          enum: [SYSTEM, TENANT, CLIENT]
        execution_mode_default:
          type: string
          enum: [NO_SIGNATURE, ACKNOWLEDGEMENT, SINGLE_SIGNATURE, MULTI_SIGNATURE]
        retention_class:
          type: string
        active:
          type: boolean
    Document:
      type: object
      description: The canonical business document aggregate.
      required:
        - id
        - tenant_id
        - document_type_id
        - title
        - status
        - execution_mode
        - source_kind
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        document_type_id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [DRAFT, PREPARED, EXECUTION_PENDING, EXECUTED, VOIDED, EXPIRED, ARCHIVED]
        execution_mode:
          type: string
          enum: [NO_SIGNATURE, ACKNOWLEDGEMENT, SINGLE_SIGNATURE, MULTI_SIGNATURE]
        source_kind:
          type: string
          enum: [TEMPLATE_GENERATED, UPLOADED, EXTERNAL_IMPORT]
        current_revision_id:
          type: [string, 'null']
          format: uuid
        prepared_at:
          type: [string, 'null']
          format: date-time
    CreateDocumentTypeRequest:
      type: object
      required:
        - key
        - name
        - scope
        - execution_mode_default
        - retention_class
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        scope:
          type: string
          enum: [SYSTEM, TENANT, CLIENT]
        execution_mode_default:
          type: string
          enum: [NO_SIGNATURE, ACKNOWLEDGEMENT, SINGLE_SIGNATURE, MULTI_SIGNATURE]
        retention_class:
          type: string
    CreateDocumentRequest:
      type: object
      required:
        - document_type_id
        - title
        - execution_mode
        - source_kind
      properties:
        document_type_id:
          type: string
          format: uuid
        title:
          type: string
        execution_mode:
          type: string
          enum: [NO_SIGNATURE, ACKNOWLEDGEMENT, SINGLE_SIGNATURE, MULTI_SIGNATURE]
        source_kind:
          type: string
          enum: [TEMPLATE_GENERATED, UPLOADED, EXTERNAL_IMPORT]
        associations:
          type: array
          items:
            $ref: '#/components/schemas/CreateAssociationRequest'
    CreateAssociationRequest:
      type: object
      required:
        - resource_type
        - resource_id
        - relationship
      properties:
        resource_type:
          type: string
          enum: [TALENT, REQUISITION, COMPANY, SUBMITTAL, OFFER, PLACEMENT, PURCHASE_ORDER, TENANT_ORGANIZATION, CONTACT]
        resource_id:
          type: string
          format: uuid
        relationship:
          type: string
          enum: [SUBJECT, REGARDING, CLIENT, SUPPORTS, OWNER, ISSUER, COUNTERPARTY]
    DocumentAssociation:
      type: object
      description: A polymorphic link from a document to a business resource.
      required:
        - id
        - document_id
        - resource_type
        - resource_id
        - relationship
      properties:
        id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        resource_type:
          type: string
        resource_id:
          type: string
          format: uuid
        relationship:
          type: string
    DocumentEvent:
      type: object
      description: An append-only document lifecycle event.
      required:
        - id
        - document_id
        - event_type
        - actor_type
        - occurred_at
      properties:
        id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        event_type:
          type: string
        actor_type:
          type: string
          enum: [USER, SYSTEM]
        occurred_at:
          type: string
          format: date-time
    DocumentArtifact:
      type: object
      description: An immutable stored document artifact.
      required:
        - id
        - revision_id
        - document_id
        - artifact_role
        - sha256
      properties:
        id:
          type: string
          format: uuid
        revision_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        artifact_role:
          type: string
        sha256:
          type: string
    DocumentTemplate:
      type: object
      description: A reusable document template (DOC-2).
      required:
        - id
        - tenant_id
        - document_type_id
        - name
        - template_kind
        - status
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        document_type_id:
          type: string
          format: uuid
        client_id:
          type: [string, 'null']
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        template_kind:
          type: string
          enum: [GENERATED, UPLOADED_PDF, HYBRID]
        status:
          type: string
          enum: [DRAFT, ACTIVE, RETIRED]
        current_version_id:
          type: [string, 'null']
          format: uuid
    TemplateVersion:
      type: object
      description: An immutable-after-activation template version (DOC-2).
      required:
        - id
        - tenant_id
        - template_id
        - version_number
        - status
        - render_schema_version
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        template_id:
          type: string
          format: uuid
        version_number:
          type: integer
        status:
          type: string
          enum: [DRAFT, ACTIVE, RETIRED]
        render_schema_version:
          type: string
        source_artifact_id:
          type: [string, 'null']
          format: uuid
        activated_at:
          type: [string, 'null']
          format: date-time
        internal_notes:
          type: [string, 'null']
          maxLength: 500
          description: Admin-only notes for this version (Document Templates slice 1). Never rendered into any document.
        field_schema:
          description: |
            The version content. `rtr-generated-v1`: { render_schema_version, title, blocks: [{type: HEADING|TEXT, text}] }.
            `rtr-html-v1` (Amendment A1): see RtrHtmlContent — the html is the server-sanitised allowlist form.
          oneOf:
            - $ref: '#/components/schemas/RtrHtmlContent'
            - type: object
              additionalProperties: true
            - type: 'null'
        logo:
          description: The version's frozen letterhead logo asset (rtr-html-v1), or null.
          oneOf:
            - type: object
              required: [asset_id, mime]
              properties:
                asset_id: { type: string, format: uuid }
                mime: { type: string, enum: [image/png, image/jpeg] }
            - type: 'null'
    RtrHtmlContent:
      type: object
      description: |
        Amendment A1 `rtr-html-v1` content. `html` is restricted to the allowlist p, h2, b/strong, i/em, u,
        ul, ol, li, br; `<span data-field="{closed catalog key}"></span>` (empty) field nodes; and at most one
        `<div data-asset="tenant.logo"></div>`, only as the first child. No other elements or attributes, no
        style/class, no URLs. Max 64 KB. The server re-serialises on every PATCH (strong→b, em→i, field spans
        emptied, unknown tags/attributes removed) and returns the sanitised html. `logo` is server-owned
        (set only by POST versions/{versionId}/logo); a client-supplied value is ignored.
      required: [render_schema_version, title, html]
      properties:
        render_schema_version: { type: string, enum: [rtr-html-v1] }
        title: { type: string }
        html: { type: string, maxLength: 65536 }
        logo:
          oneOf:
            - type: object
              required: [asset_id, sha256, mime]
              properties:
                asset_id: { type: string, format: uuid }
                sha256: { type: string }
                mime: { type: string, enum: [image/png, image/jpeg] }
            - type: 'null'
    TemplateLogoCaptureResponse:
      type: object
      required: [asset_id, sha256, mime]
      properties:
        asset_id: { type: string, format: uuid }
        sha256: { type: string }
        mime: { type: string, enum: [image/png, image/jpeg] }
    RenameTemplateRequest:
      type: object
      description: Template rename (Document Templates slice 1). The name is trimmed server-side.
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    UpdateVersionRequest:
      type: object
      description: |
        DRAFT-only update (DOC-TEMPLATE-ADMIN-RTR-1 §9). At least one of `field_schema` or
        `internal_notes` is required. A content edit (`field_schema` / `render_schema_version`)
        re-arms the preview gate; a notes-only edit does not (notes are never rendered).
        Immutable fields are rejected by the repository, not accepted here.
      properties:
        field_schema:
          type: object
          additionalProperties: true
        render_schema_version:
          type: string
        internal_notes:
          type: [string, 'null']
          maxLength: 500
          description: Trimmed server-side; blank is stored as null.
    TemplateSamplePreview:
      type: object
      description: A fixed-sample preview (§17) — the draft content with every binding substituted by its safe sample value. Structured resolved blocks; no business document is created.
      required:
        - title
        - blocks
      properties:
        title:
          type: string
        blocks:
          type: array
          items:
            type: object
            required:
              - type
              - text
            properties:
              type:
                type: string
              text:
                type: string
        signature_block:
          $ref: '#/components/schemas/SignatureBlockPreview'
        sample_values:
          type: array
          description: The fixed sample value of every catalog binding (both content versions).
          items:
            type: object
            required: [key, label, value]
            properties:
              key: { type: string }
              label: { type: string }
              value: { type: string }
        html:
          type: string
          description: rtr-html-v1 only — the content with each field node replaced by `<span data-sample="{key}">{escaped sample}</span>` (line breaks in a sample become `<br>`).
        logo:
          description: rtr-html-v1 only — the version's frozen logo asset, or null.
          oneOf:
            - type: object
              required: [asset_id]
              properties:
                asset_id: { type: string, format: uuid }
            - type: 'null'
    SignatureBlockPreview:
      type: object
      description: |
        The fixed RTR signature block the renderer appends after the template content
        (TALENT SIGNATURE · PRINTED NAME · DATE SIGNED). Not template content; admins cannot
        remove it. `printed_name` is the bound talent full name (sample value in an admin
        preview); DATE SIGNED is blank in the rendered document.
      required:
        - printed_name
      properties:
        printed_name:
          type: [string, 'null']
    AllowedBindingsResponse:
      type: object
      description: The governed Insert-field binding catalog (§15) for a template's document type.
      required:
        - bindings
      properties:
        bindings:
          type: array
          items:
            type: object
            required:
              - key
              - label
              - group
            properties:
              key:
                type: string
              label:
                type: string
              group:
                type: string
        tenant_logo:
          type: object
          description: A1 §2.4 — whether the Tenant profile has a logo the editor can add, and the organisation name the letterhead shows beside it (display name, else legal name, else workspace name).
          required: [available, tenant_name]
          properties:
            available: { type: boolean }
            tenant_name: { type: [string, 'null'] }
    TemplateFieldDefinition:
      type: object
      description: The canonical field model (a PDF AcroForm field is only one representation).
      required:
        - id
        - template_version_id
        - field_key
        - field_type
        - ordinal
      properties:
        id:
          type: string
          format: uuid
        template_version_id:
          type: string
          format: uuid
        field_key:
          type: string
        field_type:
          type: string
          enum: [TEXT, MULTILINE_TEXT, DATE, NUMBER, CURRENCY, CHECKBOX, IMAGE, SIGNATURE, INITIALS, SIGN_DATE, SIGNER_NAME, SIGNER_EMAIL]
        required:
          type: boolean
        page_number:
          type: [integer, 'null']
        ordinal:
          type: integer
    DocumentRequirement:
