openapi: 3.1.0
info:
  title: Aramo Auth API
  version: 0.1.0
  description: |
    Aramo Auth Service surface. Authored by PR-8.0a-Reground.

    OAuth-based session establishment via federated IdP (AWS Cognito);
    cookie-driven session lifecycle (login → callback → refresh →
    logout) plus introspection (session) and public-key publication
    (jwks). Per directive §3 Topic 4: all session cookies are
    `HttpOnly` + `Secure` (production) and bound by `SameSite` policy
    per cookie; the access cookie is verified RS256 by the issuer's
    public key.

    The shared error envelope is referenced from openapi/common.yaml
    (ErrorResponse, ErrorObject, ErrorCode). PR-8.0a-Reground extends
    the `ErrorCode` enum with `TENANT_SELECTION_REQUIRED` (HTTP 409)
    and `REFRESH_TOKEN_INVALID` (HTTP 401).

servers:
  - url: https://api.aramo.ai/v1
  - url: https://staging-api.aramo.ai/v1

tags:
  - name: Auth
    description: |
      Authentication endpoints. OAuth-based session establishment
      via federated IdP (Cognito); cookie-driven session lifecycle
      (refresh, logout, session, jwks).

paths:
  /auth/{consumer}/login:
    get:
      operationId: startLogin
      tags: [Auth]
      summary: Begin OAuth Authorization Code + PKCE flow
      description: |
        Issues a PKCE state cookie and redirects the user agent to
        the Cognito hosted-UI authorize endpoint. Per directive §8.1.
        Anonymous (no JWT or cookie required).
      security: []
      parameters:
        - name: consumer
          in: path
          required: true
          schema:
            type: string
            enum: [recruiter, portal, ingestion, platform, sign, org]
        - name: select_account
          in: query
          required: false
          description: |
            Host-binding SSO recovery. Exactly `1` adds the fixed value
            `prompt=select_account` to the Cognito authorize URL, which Cognito
            forwards to the Microsoft OIDC IdP so the user can pick a different
            Microsoft account. Any other value is ignored; no caller-supplied
            value is forwarded.
          schema:
            type: string
            enum: ['1']
        - name: idp
          in: query
          required: false
          description: |
            AUTH-SIGNIN-1 §3.1.1 — the provider button chosen on the Aramo
            sign-in page. Closed allowlist, case-insensitive: `google` maps to the
            Cognito provider `Google`, `microsoft` to `microsoft`; any other value
            is ignored and never forwarded. A tenant's pinned provider wins over
            this hint. The hint is UI routing only — provider policy is enforced
            at the callback.
          schema:
            type: string
            enum: [google, microsoft]
      responses:
        '302':
          description: Redirect to Cognito authorize endpoint; sets aramo_pkce_state cookie.
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: Cognito authorize URL with PKCE challenge.
            Set-Cookie:
              schema:
                type: string
              description: |
                aramo_pkce_state — HttpOnly; Secure (production);
                SameSite=Lax; Path=/auth; Max-Age=600.
            X-Request-ID:
              schema:
                type: string
                format: uuid
        '400':
          description: Invalid `consumer` path parameter
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '500':
          description: PKCE generation, encryption, or env failure
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'

  /auth/{consumer}/login-options:
    get:
      operationId: getLoginOptions
      tags: [Auth]
      summary: Sign-in providers to show on this host
      description: |
        AUTH-SIGNIN-1 §3.1.2. Anonymous, host-derived, no PII. Returns the
        federated providers the Aramo sign-in page shows on the request host:
        a host whose tenant pins a provider returns only that provider;
        every other host returns both. UI only — authorization is enforced at
        the callback, and a failed call falls back to showing both buttons.
      security: []
      parameters:
        - name: consumer
          in: path
          required: true
          schema:
            type: string
            enum: [recruiter, portal, ingestion, platform, sign, org]
      responses:
        '200':
          description: Providers to show, in display order.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [providers]
                properties:
                  providers:
                    type: array
                    minItems: 1
                    items:
                      type: string
                      enum: [microsoft, google]
        '400':
          description: Invalid `consumer` path parameter
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'

  /auth/{consumer}/callback:
    get:
      operationId: completeLogin
      tags: [Auth]
      summary: Cognito redirect target — completes the OAuth flow
      description: |
        Validates pkce_state cookie, exchanges Cognito `code` for an
        ID token, resolves the user, applies tenant resolution,
        issues a COMPACT access JWT (identity + authz_version, no
        scopes claim) + refresh token, sets cookies, and emits
        `identity.session.issued` audit event. Effective scopes are
        resolved server-side per request, not carried in the token.
        Per directive §8.2. Anonymous (the Cognito `code` is the
        auth credential).
      security: []
      parameters:
        - name: consumer
          in: path
          required: true
          schema:
            type: string
            enum: [recruiter, portal, ingestion, platform, sign, org]
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          schema:
            type: string
      responses:
        '204':
          description: Session established; sets access + refresh cookies; clears pkce_state.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: |
                Three Set-Cookie headers — aramo_access_token (Path=/,
                SameSite=Lax, Max-Age=900), aramo_refresh_token
                (Path=/auth, SameSite=Strict, Max-Age=2592000),
                aramo_pkce_state (Max-Age=0 to clear).
            X-Request-ID:
              schema:
                type: string
                format: uuid
        '400':
          description: |
            Validation error. Triggers: invalid consumer; Cognito-side
            error; missing/malformed pkce_state; state mismatch;
            consumer mismatch; expired pkce_state.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        # IC-2 PR-4 (Auth-Decoupling PR-4 Amendment A1 §2 item 2): the HTTP 409
        # TENANT_SELECTION_REQUIRED response is RETIRED — a User belongs to exactly
        # one tenant (IC-1), so no selection can be required. The code remains in
        # the ErrorCode enum as COMPATIBILITY_RESERVED. A defensive multi-tenant
        # resolution and every host-binding denial (host_tenant_mismatch,
        # host_class_consumer_mismatch, host_unbound under
        # AUTH_HOST_TENANT_BINDING=enforce) surface as 403 TENANT_ACCESS_DENIED
        # with `error.details.reason`, naming no tenant.
        # IC-2 PR-6: a consumer whose product capability the tenant does not hold
        # (recruiter/ingestion → ats, esign → esign) is refused with the existing
        # 403 TENANT_CAPABILITY_NOT_ENTITLED (reason consumer_not_entitled); the
        # portal consumer and unknown consumers are not minted on this path
        # (403 INSUFFICIENT_PERMISSIONS, reason consumer_not_supported). The
        # `platform` and `sign` consumer values are now documented (= code).
        '500':
          description: |
            Internal error. Triggers (carried in `error.details.reason`):
            cognito_exchange_failed, cognito_verification_failed,
            user_not_provisioned, no_active_tenant, JWT signing
            failure, DB write failure.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'

  /auth/{consumer}/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      summary: Rotate refresh token and issue a new access JWT
      description: |
        Validates the refresh cookie (presence, lookup, expiry,
        explicit revocation, consumer binding), detects reuse past
        the grace window (R.2 cascade), rotates the token under a
        FOR UPDATE lock with a conditional update guard, signs a
        new access JWT, and emits `identity.session.refreshed`
        audit event. Per directive §8.3.
      security:
        - CookieRefreshAuth: []
      parameters:
        - name: consumer
          in: path
          required: true
          schema:
            type: string
            enum: [recruiter, portal, ingestion, platform, sign, org]
      responses:
        '200':
          description: |
            Refresh succeeded; rotates access + refresh cookies.
            Empty body per directive RF.6 lock.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Two Set-Cookie headers (new access + new refresh).
            X-Request-ID:
              schema:
                type: string
                format: uuid
        '400':
          description: Invalid consumer path parameter.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '401':
          description: |
            Refresh token invalid. Triggers: cookie missing; token
            not found; token expired; token explicitly revoked;
            consumer mismatch; reuse detected (after R.2 cascade);
            rotation race (conditional update failed). On 401, BOTH
            access and refresh cookies are cleared via Max-Age=0.
            IC-2 PR-5 (Auth-Decoupling PR-4 Amendment A2): eligibility is
            re-proven before any re-mint — `error.details.reason` is one of
            `user_inactive`, `membership_inactive`, `tenant_suspended`,
            `tenant_closed`, `consumer_not_entitled` (IC-2 PR-6: the tenant no
            longer holds the consumer's product capability — ats for
            recruiter/ingestion, esign for esign) or `consumer_not_supported`
            (the presented token is revoked server-side), or,
            under AUTH_HOST_TENANT_BINDING=enforce, a host-binding reason
            (`host_tenant_mismatch`, `host_class_consumer_mismatch`,
            `host_unbound`). No tenant is named.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal error (DB write failure non-race; JWT signing failure).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'

  /auth/{consumer}/logout:
    post:
      operationId: logoutSession
      tags: [Auth]
      summary: Revoke the refresh token and clear session cookies
      description: |
        Idempotent. With cookie present and matching consumer:
        revokes the refresh token row, emits
        `identity.session.revoked` audit event, clears both cookies.
        With cookie missing or non-matching consumer: silently
        clears cookies (LO.2.s lenient lock). Per directive §8.4.
      security:
        - CookieRefreshAuth: []
      parameters:
        - name: consumer
          in: path
          required: true
          schema:
            type: string
            enum: [recruiter, portal, ingestion, platform, sign, org]
      responses:
        '204':
          description: Logout completed; access + refresh cookies cleared.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Two Set-Cookie clearing headers (Max-Age=0).
            X-Request-ID:
              schema:
                type: string
                format: uuid
        '400':
          description: Invalid consumer path parameter.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal error (DB write failure on revocation, rare).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
    get:
      operationId: logoutRedirect
      tags: [Auth]
      summary: Redirect to the Cognito hosted-UI /logout (SSO session termination)
      description: |
        §5 Auth-Hardening D3. After the local clear (POST above), the
        frontend navigates here; the browser is 302-redirected to the
        Cognito hosted-UI `/logout?client_id={clientId}&logout_uri=
        {registeredSignOutUrl}`, which clears Cognito's SSO session
        cookie and returns to the REGISTERED post-logout URL. This
        closes the re-entry-without-reauth hole (the local clear alone
        leaves the Cognito SSO session alive).

        The `logout_uri` is a registered/allowlisted config value
        (`AUTH_COGNITO_SIGNOUT_REDIRECT`), NEVER user-controllable —
        same open-redirect guard as the login redirect. Idempotent and
        cookie-less: an already-logged-out session is a clean no-op.
      security: []
      parameters:
        - name: consumer
          in: path
          required: true
          schema:
            type: string
            enum: [recruiter, portal, ingestion, platform, sign, org]
      responses:
        '302':
          description: Redirect to the Cognito hosted-UI /logout endpoint.
          headers:
            Location:
              schema:
                type: string
              description: |
                Cognito `https://{domain}/logout?client_id=...&logout_uri=
                {registered}` — the return URL is config, never input.
        '400':
          description: Invalid consumer path parameter.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '500':
          description: |
            Cognito config or registered sign-out URL not configured
            (cognito_env_missing / signout_redirect_missing).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'

  /auth/{consumer}/session:
    get:
      operationId: getSession
      tags: [Auth]
      summary: Introspect the current access JWT
      description: |
        Reads the `aramo_access_token` cookie, verifies it (RS256,
        AUTH_PUBLIC_KEY, issuer "Aramo Core Auth", audience
        AUTH_AUDIENCE, 0s clock tolerance), checks consumer binding
        (path consumer must match JWT claim), and returns the 6-field
        SessionResponse. No audit emission per SE.4.k lock. Per
        directive §8.5.
      security:
        - CookieAccessAuth: []
      parameters:
        - name: consumer
          in: path
          required: true
          schema:
            type: string
            enum: [recruiter, portal, ingestion, platform, sign, org]
      responses:
        '200':
          description: Session payload (6 fields; SE.3.g lock).
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: Invalid consumer path parameter.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '401':
          description: |
            Invalid token. Triggers: cookie missing; JWT
            invalid/expired/signature-bad/claim-missing; consumer
            mismatch (path vs JWT claim).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '403':
          description: |
            IC-2 PR-5 — tenant access denied for this host. Under
            AUTH_HOST_TENANT_BINDING=enforce the token's tenant is bound to
            the request host (session-surface host policy); a mismatch or an
            unbound host context is refused BEFORE any authorization detail
            is returned. `error.details.reason` is `host_tenant_mismatch`,
            `host_class_consumer_mismatch` or `host_unbound`; no tenant is
            named. Under the default `log` posture this response is never
            emitted.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Crypto failure during verification or missing AUTH_PUBLIC_KEY env.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'

  # ── AUTH-SIGNIN-1 Amendment M-A1 — native authentication consumer (sign) ──
  # Aramo Sign mobile. Tokens travel ONLY in JSON bodies (never cookies, never
  # URLs); every response is `Cache-Control: no-store`. No browser host binding
  # applies (no Host is resolved or simulated): the native-client context is
  # enforced instead — native-client audience, PKCE, nonce, redirect-URI binding,
  # single-use code, consumer `sign`, tenant/provider policy, device-session
  # ownership.
  /auth/native/sign/token:
    post:
      operationId: nativeSignTokenExchange
      tags: [Auth]
      summary: Exchange a native authorization code for an Aramo token pair
      description: |
        The app ran Authorization Code + PKCE (S256) against the public Cognito
        app client `aramo-sign-native` in the OS external authentication
        session and validated `state` itself. auth-service records a one-way
        hash of the code (and of the nonce) in the redeemed-code ledger BEFORE
        exchanging it — a second redemption, from any device, client or
        redirect URI, is refused. It exchanges the code with Cognito (native
        client id, no secret), validates the ID token (issuer, audience = the
        native client, nonce), runs the same principal resolution as the
        browser callback (provider pin — Personal is Google-only — no JIT,
        IC-1, capability `sign`), creates a server-owned device session and
        returns the existing Aramo access JWT (900 s, consumer `sign`) with the
        claims `client: "native"` and `dsid`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeTokenRequest'
      responses:
        '200':
          description: Token pair issued; a device session was created.
          headers:
            Cache-Control:
              schema:
                type: string
              description: 'no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeTokenResponse'
        '400':
          description: |
            `VALIDATION_ERROR`. `error.details.reason`: `invalid_request` (with
            `details.field`: a missing/malformed field, including a
            `code_verifier` outside RFC 7636's 43-128 unreserved characters) or
            `redirect_uri_not_allowed` (not byte-equal to an entry of
            SIGN_NATIVE_REDIRECT_URIS).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '401':
          description: |
            `INVALID_TOKEN`. `error.details.reason`: `code_already_redeemed`,
            `nonce_replayed`, `code_exchange_rejected` (Cognito refused the
            grant: PKCE verifier mismatch, used/expired code, redirect differing
            from the authorize request, another client's code; `details.oauth_error`
            carries the OAuth error code), `id_token_audience_mismatch`,
            `id_token_issuer_mismatch`, `id_token_expired`, `nonce_mismatch`,
            `nonce_missing`, `email_not_verified`, `missing_email`,
            `missing_sub`, `wrong_token_use`.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '403':
          description: |
            Principal resolution refused, with the browser callback's codes:
            `TENANT_ACCESS_DENIED` (`idp_not_permitted_for_tenant`,
            `idp_identity_conflict`, `no_active_tenant`,
            `tenant_resolution_ambiguous`), `TENANT_SUSPENDED`, `TENANT_CLOSED`,
            `TENANT_CAPABILITY_NOT_ENTITLED` (`consumer_not_entitled`),
            `INSUFFICIENT_PERMISSIONS` (`user_not_provisioned`, `user_inactive`).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '500':
          description: |
            `INTERNAL_ERROR`. `error.details.reason`: `native_client_not_configured`
            (SIGN_NATIVE_COGNITO_CLIENT_ID unset), `cognito_exchange_failed`,
            `cognito_verification_failed`, `refresh_token_persist_failed`,
            `jwt_sign_failed`.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'

  /auth/native/sign/refresh:
    post:
      operationId: nativeSignTokenRefresh
      tags: [Auth]
      summary: Rotate a native refresh token
      description: |
        The refresh token is the only credential; the device session is
        resolved server-side from it (no device id is read from the request).
        Single-use and bound to the device record: a successful call returns a
        rotated pair. Reuse of a rotated token past the grace window triggers
        the existing reuse cascade (every refresh token of the user is revoked,
        `identity.session.reuse_detected` is audited, and the user's native
        device sessions are closed). Eligibility and capability `sign` are
        re-proven at every refresh; a denial revokes the device session.
        Validity: 30 days sliding.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeRefreshTokenRequest'
      responses:
        '200':
          description: Rotated token pair.
          headers:
            Cache-Control:
              schema:
                type: string
              description: 'no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeTokenResponse'
        '400':
          description: '`VALIDATION_ERROR` (`invalid_request`, `details.field` = `refresh_token`).'
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '401':
          description: |
            `REFRESH_TOKEN_INVALID`. `error.details.reason`: `not_found`,
            `expired`, `consumer_mismatch` (not a native token), `explicitly_revoked`
            (logout / device revoke / eligibility revoke), `reuse_detected`,
            `rotation_race`, `device_session_revoked`, `client_mismatch`, or an
            eligibility reason (`user_inactive`, `membership_inactive`,
            `tenant_suspended`, `tenant_closed`, `consumer_not_entitled`,
            `consumer_not_supported`).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '500':
          description: '`INTERNAL_ERROR` (`native_client_not_configured`, `refresh_rotate_failed`, `jwt_sign_failed`).'
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'

  /auth/native/sign/logout:
    post:
      operationId: nativeSignLogout
      tags: [Auth]
      summary: Revoke this device's native session
      description: |
        Revokes the device session that owns the presented refresh token and
        its refresh-token family. Idempotent: an unknown, non-native or already
        revoked token is a silent 204.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeRefreshTokenRequest'
      responses:
        '204':
          description: Logged out (or nothing to revoke).
        '400':
          description: '`VALIDATION_ERROR` (`invalid_request`, `details.field` = `refresh_token`).'
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'

  /auth/native/callback:
    get:
      operationId: nativeCallbackFallbackPage
      tags: [Auth]
      summary: Browser fallback for the native OAuth callback
      description: |
        The registered https OAuth callback of the `aramo-sign-native` Cognito
        client. The app normally receives this URL before any page loads
        (verified app link on Android; the auth session on iOS 17.4+). A browser
        reaches the server only when the app did not open, and gets a fixed
        HTML page telling the user to sign in from the app. No query
        parameter (including `code` and `state`) is read, echoed or forwarded;
        the only link is the fixed app address `aramosign://`. Uncached, no
        script, cannot be framed, `Referrer-Policy: no-referrer`.
      security: []
      responses:
        '200':
          description: The fixed fallback page.
          content:
            text/html:
              schema:
                type: string

  /auth/native/signed-out:
    get:
      operationId: nativeSignedOutPage
      tags: [Auth]
      summary: Signed-out page for the native app
      description: |
        The registered sign-out URL of the `aramo-sign-native` Cognito client.
        A fixed HTML page confirming sign-out, with one link back to the fixed
        app address `aramosign://`. It accepts no redirect destination: no
        query parameter is read, echoed or followed. Uncached, no script,
        cannot be framed, `Referrer-Policy: no-referrer`. Revoking the device
        session and discarding local credentials is the app's job
        (`POST /auth/native/sign/logout`), done before sign-out completes.
      security: []
      responses:
        '200':
          description: The fixed signed-out page.
          content:
            text/html:
              schema:
                type: string

  /auth/native/sign/sessions:
    get:
      operationId: listNativeSignSessions
      tags: [Auth]
      summary: List the caller's native device sessions
      description: |
        Requires a native `sign` Bearer token whose own device session is still
        live. Returns only the caller's user + tenant sessions; `current` marks
        the caller's own device (`dsid`).
      security:
        - NativeBearerAuth: []
      responses:
        '200':
          description: The caller's live native device sessions.
          headers:
            Cache-Control:
              schema:
                type: string
              description: 'no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeSessionList'
        '401':
          description: |
            `AUTH_REQUIRED` (`bearer_required`) or `INVALID_TOKEN`
            (`native_token_required`, `native_context_invalid`,
            `device_session_revoked`, `consumer_header_mismatch`,
            `authz_version_stale`, `authz_unresolvable`).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'

  /auth/native/sign/sessions/{device_session_id}:
    delete:
      operationId: revokeNativeSignSession
      tags: [Auth]
      summary: Revoke one of the caller's native device sessions
      description: |
        Owner only. Revokes the device session and its refresh-token family.
        Any id that is not a live session of the caller's user + tenant
        (another user's, another tenant's, revoked, malformed, absent) is the
        same 404, revealing nothing.
      security:
        - NativeBearerAuth: []
      parameters:
        - name: device_session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Revoked.
        '401':
          description: 'Same as GET /auth/native/sign/sessions.'
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          description: '`NOT_FOUND` (`device_session_not_found`).'
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'

  /.well-known/jwks.json:
    get:
      operationId: getJwks
      tags: [Auth]
      summary: Public-key publication for Aramo-issued JWTs
      description: |
        Derives the JWKS from `AUTH_PRIVATE_KEY` (jose.exportJWK +
        SHA-256 fingerprint for `kid`). Single key, `use: "sig"`,
        `alg: "RS256"`. Cache-Control: public, max-age=300. Per
        directive §3 JWKS sub-block + §8.6. Anonymous.
      security: []
      responses:
        '200':
          description: JWKS document (single-key array).
          headers:
            Cache-Control:
              schema:
                type: string
              description: 'public, max-age=300'
            X-Request-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponse'
        '500':
          description: Missing AUTH_PRIVATE_KEY env, or key import/derivation failure.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    # PR-8.0a-Reground §3: cookie-based authentication. Two schemes — one
    # for the access cookie (introspection), one for the refresh cookie
    # (refresh + logout). No Bearer scheme; libs/auth's JwtAuthGuard
    # (Bearer-header) is unchanged and unused by auth-service.
    CookieAccessAuth:
      type: apiKey
      in: cookie
      name: aramo_access_token
    CookieRefreshAuth:
      type: apiKey
      in: cookie
      name: aramo_refresh_token
    # AUTH-SIGNIN-1 Amendment M-A1 — the native `sign` access JWT (claims
    # client: "native" + dsid) presented as a Bearer header, used ONLY by the
    # native device-session routes.
    NativeBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SessionResponse:
      type: object
      additionalProperties: false
      description: |
        /session response shape — locked at 6 fields per SE.3.g. The
        compact access JWT carries identity + an authz_version only; the
        verifier RESOLVES the effective scopes server-side and surfaces
        them here alongside the identity claims it echoes. The
        `actor_kind` claim is intentionally NOT surfaced here per
        directive §3 Topic 2 (libs/auth's AuthContext stays at 6
        fields; future PRs may extend).
      required:
        - sub
        - consumer_type
        - tenant_id
        - scopes
        - iat
        - exp
      properties:
        sub:
          type: string
          format: uuid
        consumer_type:
          type: string
          enum: [recruiter, portal, ingestion, platform, sign, org]
        tenant_id:
          type: string
          format: uuid
        scopes:
          type: array
          items:
            type: string
        iat:
          type: integer
          description: Issued-at, epoch seconds.
        exp:
          type: integer
          description: Expiry, epoch seconds.

    TenantSelectionRequiredDetails:
      type: object
      additionalProperties: false
      deprecated: true
      description: |
        RETIRED (IC-2 PR-4, Auth-Decoupling PR-4 Amendment A1): no
        /callback response carries this shape any more — a User belongs
        to exactly one tenant (IC-1), so TENANT_SELECTION_REQUIRED (409)
        is never emitted. Kept, deprecated, for historical contract
        readers only.
        Historically: embedded in `error.details` of a 409
        TENANT_SELECTION_REQUIRED response from /callback when the
        resolved user had more than one active membership (CB.2 lock).
      required:
        - tenants
      properties:
        tenants:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string

    JwksKey:
      type: object
      additionalProperties: false
      description: |
        Single JWK in the published JWKS. Always RSA + sig + RS256
        in PR-8.0a-Reground (single-key model; rotation deferred).
      required:
        - kty
        - use
        - alg
        - kid
        - n
        - e
      properties:
        kty:
          type: string
          const: RSA
        use:
          type: string
          const: sig
        alg:
          type: string
          const: RS256
        kid:
          type: string
          description: SHA-256 fingerprint of the public key (base64url).
        n:
          type: string
          description: RSA modulus (base64url).
        e:
          type: string
          description: RSA exponent (base64url).

    JwksResponse:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JwksKey'

    # AUTH-SIGNIN-1 Amendment M-A1 — native authentication consumer shapes.
    NativeDevice:
      type: object
      additionalProperties: false
      description: |
        Descriptive only (client supplied). `installation_id` is an identifier,
        not a credential: it never authorizes revoke, rotate, refresh or push
        registration.
      required: [installation_id, platform, app_version]
      properties:
        installation_id:
          type: string
          minLength: 1
          maxLength: 200
        platform:
          type: string
          enum: [ios, android]
        app_version:
          type: string
          minLength: 1
          maxLength: 64

    NativeTokenRequest:
      type: object
      additionalProperties: false
      required: [code, code_verifier, redirect_uri, nonce, device]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 2048
        code_verifier:
          type: string
          pattern: '^[A-Za-z0-9\-._~]{43,128}$'
          description: The PKCE verifier the app generated (RFC 7636, S256).
        redirect_uri:
          type: string
          description: |
            Byte-equal to an allow-listed native callback
            (SIGN_NATIVE_REDIRECT_URIS; default
            `https://sign.aramo.ai/auth/native/callback`,
            `aramosign://auth/callback`).
        nonce:
          type: string
          minLength: 1
          maxLength: 512
          description: The nonce sent on the authorize request; must equal the ID token's.
        device:
          $ref: '#/components/schemas/NativeDevice'

    NativeRefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 512

    NativeTokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, refresh_token, device_session_id]
      properties:
        access_token:
          type: string
          description: The Aramo access JWT (consumer `sign`, 900 s) with claims `client` = `native` and `dsid`.
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Access-token lifetime in seconds (900).
        refresh_token:
          type: string
          description: Opaque, single-use, rotated on every refresh; stored hashed server-side.
        device_session_id:
          type: string
          format: uuid
          description: The server-owned device session (equals the access token's `dsid`).

    NativeSessionItem:
      type: object
      additionalProperties: false
      required: [device_session_id, platform, app_version, created_at, last_seen_at, current]
      properties:
        device_session_id:
          type: string
          format: uuid
        platform:
          type: string
          enum: [ios, android]
        app_version:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the caller's own device session.

    NativeSessionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NativeSessionItem'
