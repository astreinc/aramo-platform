    BillingStatusAvailability:
      type: string
      enum: [AVAILABLE, BILLING_UNAVAILABLE, LIVE_MODE_HELD, NO_PROVIDER_SUBSCRIPTION, PROVIDER_UNAVAILABLE, TENANT_MISMATCH]
      description: |
        CCP-C3 designed states. `BILLING_UNAVAILABLE` — the provider is not configured for this
        service. `LIVE_MODE_HELD` — a live key is refused (Phase C runs in test mode until the
        live-billing release is authorized). `NO_PROVIDER_SUBSCRIPTION` — no Stripe-owned
        subscription. `PROVIDER_UNAVAILABLE` — a provider read failed. `TENANT_MISMATCH` — the
        provider data does not belong to this tenant and billing account (no data returned).

    BillingStatusInvoice:
      type: object
      additionalProperties: false
      description: |
        CCP-R3 (Aramo-CCP-A1-Amendment-A1-Finance-Amount-Scope-v1_0, LOCKED): an invoice is a set of
        tenant-specific Finance figures. It is sent only to a caller holding
        `platform:billing:amount:read` in addition to `platform:billing:read` (FA-1); see
        `TenantBillingStatusResponse.invoices`.
      required: [provider, invoice_ref, number, subscription_ref, provider_status, payment_state, currency, total_minor, amount_due_minor, amount_paid_minor, amount_remaining_minor, created_at, due_at, period_start, period_end, attempt_count, next_attempt_at, hosted_url, document_url]
      properties:
        provider:
          type: string
          enum: [STRIPE]
        invoice_ref:
          type: string
        number:
          type: [string, 'null']
        subscription_ref:
          type: [string, 'null']
        provider_status:
          type: string
          description: The provider's raw invoice status (draft, open, paid, uncollectible, void).
        payment_state:
          type: string
          enum: [DRAFT, DUE, OVERDUE, PAYMENT_FAILED, PAID, UNCOLLECTIBLE, VOID, UNKNOWN]
        currency:
          type: [string, 'null']
        total_minor:
          type: integer
          description: Amounts are the provider's, in the currency's minor unit (mirrored, never totalled).
        amount_due_minor:
          type: integer
        amount_paid_minor:
          type: integer
        amount_remaining_minor:
          type: integer
        created_at:
          type: [string, 'null']
          format: date-time
        due_at:
          type: [string, 'null']
          format: date-time
        period_start:
          type: [string, 'null']
          format: date-time
        period_end:
          type: [string, 'null']
          format: date-time
        attempt_count:
          type: integer
        next_attempt_at:
          type: [string, 'null']
          format: date-time
        hosted_url:
          type: [string, 'null']
          description: The provider-hosted invoice page (a link-out; Aramo renders no invoice).
        document_url:
          type: [string, 'null']

    FinanceAmountWithheld:
      type: string
      enum: [FINANCE_SCOPE_REQUIRED]
      description: |
        CCP-R3 (Aramo-CCP-A1-Amendment-A1-Finance-Amount-Scope-v1_0, LOCKED; FA-5) — the marker set
        where a tenant-specific monetary figure is omitted because the caller does not hold
        `platform:billing:amount:read` in addition to `platform:billing:read`. The figure is never
        sent. Holders: platform_owner, finance_admin, read_only_auditor. Catalog list prices (a plan
        version's published price) are governed by catalog read authority and never withheld (FA-3).

    TenantBillingStatusResponse:
      type: object
      additionalProperties: false
      description: |
        CCP-R3 (CCP-A1 Amendment A1): `payment_due` / `payment_overdue` (FA-4) are derived for every
        `platform:billing:read` holder from the newest 50 invoices (the same window for every caller,
        whatever `invoice_limit` is). `invoices` is present ONLY for a caller that also holds
        `platform:billing:amount:read`; otherwise it is absent (no amount, currency, line, link or
        count) and `amount_withheld` is `FINANCE_SCOPE_REQUIRED`, and a provider error's text is
        replaced by a fixed `detail` line (FA-6).
      required: [tenant_id, product_key, availability, provider, mode, subscription, provider_subscription, payment_due, payment_overdue, detail, read_at]
      properties:
        tenant_id:
          type: string
          format: uuid
        product_key:
          type: string
        availability:
          $ref: '#/components/schemas/BillingStatusAvailability'
        provider:
          type: [string, 'null']
          enum: [STRIPE, null]
        mode:
          type: [string, 'null']
          enum: [test, live, null]
        subscription:
          type: [object, 'null']
          additionalProperties: false
          required: [id, source, status, open, account_ref, subscription_ref]
          properties:
            id:
              type: string
              format: uuid
            source:
              type: string
            status:
              type: string
            open:
              type: boolean
            account_ref:
              type: string
            subscription_ref:
              type: string
        provider_subscription:
          type: [object, 'null']
          additionalProperties: false
          required: [provider_status, current_period_start, current_period_end, cancel_at_period_end]
          properties:
            provider_status:
              type: string
            current_period_start:
              type: string
              format: date-time
            current_period_end:
              type: string
              format: date-time
            cancel_at_period_end:
              type: boolean
        payment_due:
          type: boolean
          description: An invoice is open with an amount owed (payment_state DUE, OVERDUE or PAYMENT_FAILED).
        payment_overdue:
          type: boolean
          description: An open invoice is past its due date (payment_state OVERDUE).
        invoices:
          type: array
          description: Only with `platform:billing:amount:read` (FA-1).
          items:
            $ref: '#/components/schemas/BillingStatusInvoice'
        amount_withheld:
          $ref: '#/components/schemas/FinanceAmountWithheld'
        detail:
          type: [string, 'null']
        read_at:
          type: string
          format: date-time

