  # ATI-SEP-1 A2 A-c (P1) — the platform-owned MatchingPolicy. Served by apps/api (nginx
  # routes /platform/matching-policy to api:3000).
  /platform/matching-policy:
    get:
      operationId: getPlatformMatchingPolicy
      tags: [Platform Matching Policy]
      summary: Read the ACTIVE matching policy and the version history.
      description: '`active` is null only when the store holds no ACTIVE version (the engine then applies the compiled defaults). `versions` is newest first. Requires `platform:matching_policy:read`.'
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      responses:
        '200':
          description: The ACTIVE version and every version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingPolicyResponse'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'

  /platform/matching-policy/versions:
    post:
      operationId: createPlatformMatchingPolicyVersion
      tags: [Platform Matching Policy]
      summary: Create a DRAFT matching policy version.
      description: |
        Appends a DRAFT version with the next version number. What matching runs
        with does not change until the version is activated. `evidence_thresholds`
        must carry EVERY role family, each `{ count, requires_ingested }` with an
        integer count between 1 and 20; an unknown family or field is refused 400
        `VALIDATION_ERROR` (`details.errors`). Audited. Requires
        `platform:matching_policy:write`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMatchingPolicyVersionRequest'
      responses:
        '201':
          description: The created DRAFT version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingPolicyVersionView'
        '400':
          $ref: '#/components/responses/MatchingPolicyValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'

  /platform/matching-policy/versions/{id}/activate:
    post:
      operationId: activatePlatformMatchingPolicyVersion
      tags: [Platform Matching Policy]
      summary: Make a version the ONE ACTIVE matching policy.
      description: |
        One transaction: the current ACTIVE version becomes RETIRED, the target
        becomes ACTIVE. Re-activating a RETIRED version is the rollback path;
        activating the ACTIVE version is a no-op that returns it. Audited.
        Requires `platform:matching_policy:write`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/MatchingPolicyVersionIdParam'
      responses:
        '200':
          description: The now-ACTIVE version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingPolicyVersionView'
        '400':
          $ref: '#/components/responses/MatchingPolicyValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/MatchingPolicyNotFound'

  /platform/commercial/alerts/billing:
    get:
      operationId: listPlatformCommercialBillingAlerts
      tags: [Platform Commercial Observability]
      summary: List billing-family operational alerts (newest first, cursor-paged).
      description: |
        CCP-D3 — one page of the alert register, billing family, ordered
        `first_detected_at DESC, id DESC`. Types: a command pending at the provider past the
        configured threshold, a failed command, a held activation, a failed webhook inbox
        event, a usage roll-up that did not reconcile. Filters are ANDed; the opaque
        `next_cursor` pins the filter set. Read-only. Requires `platform:billing:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Only alerts in this status.
          schema:
            type: string
            enum: [OPEN, RESOLVED]
        - name: alert_type
          in: query
          required: false
          description: Only alerts of this type (a type of this route's family).
          schema:
            type: string
            enum: [COMMAND_PENDING_PROVIDER_STUCK, COMMAND_FAILED, HELD_ACTIVATION, WEBHOOK_INBOX_FAILED, USAGE_NOT_RECONCILED, ENTITLEMENT_WITHOUT_ACTIVE_SUBSCRIPTION]
        - name: tenant_id
          in: query
          required: false
          description: Only alerts about this tenant's subjects.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Page size (default 50, max 200).
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          description: Opaque continuation cursor from a prior page's next_cursor.
          schema:
            type: string
            maxLength: 2000
      responses:
        '200':
          description: A page of billing-family alerts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialAlertListResponse'
        '400':
          $ref: '#/components/responses/CommercialAlertValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'

  /platform/commercial/alerts/approvals:
    get:
      operationId: listPlatformCommercialApprovalAlerts
      tags: [Platform Commercial Observability]
      summary: List approval-family operational alerts (newest first, cursor-paged).
      description: |
        CCP-D3 — one page of the alert register, approval family, ordered
        `first_detected_at DESC, id DESC`. Types: a failed governed apply (retryable), a
        request awaiting approval within the configured lead time of its expiry, a request
        still awaiting approval after its expiry. Filters are ANDed; the opaque
        `next_cursor` pins the filter set. Read-only. Requires `platform:approval:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Only alerts in this status.
          schema:
            type: string
            enum: [OPEN, RESOLVED]
        - name: alert_type
          in: query
          required: false
          description: Only alerts of this type (a type of this route's family).
          schema:
            type: string
            enum: [APPLY_FAILED, APPROVAL_NEARING_EXPIRY, APPROVAL_PAST_EXPIRY]
        - name: tenant_id
          in: query
          required: false
          description: Only alerts about this tenant's subjects.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Page size (default 50, max 200).
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          description: Opaque continuation cursor from a prior page's next_cursor.
          schema:
            type: string
            maxLength: 2000
      responses:
        '200':
          description: A page of approval-family alerts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialAlertListResponse'
        '400':
          $ref: '#/components/responses/CommercialAlertValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'

  /platform/commercial/metrics/billing:
    get:
      operationId: getPlatformCommercialBillingMetrics
      tags: [Platform Commercial Observability]
      summary: Billing operations metrics (counts by state).
      description: |
        CCP-D3 — platform-wide counts: Stripe commands by state (and those pending at the
        provider past the configured threshold), webhook inbox events by status, open
        reconciliation flags by reason and open billing-family alerts by type. Never per
        tenant, never money. Takes no parameter. Read-only. Requires `platform:billing:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      responses:
        '200':
          description: The billing operations counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingOperationsMetrics'
        '400':
          $ref: '#/components/responses/CommercialAlertValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'

  /platform/commercial/metrics/approvals:
    get:
      operationId: getPlatformCommercialApprovalMetrics
      tags: [Platform Commercial Observability]
      summary: Approval operations metrics (counts by state).
      description: |
        CCP-D3 — platform-wide counts: change requests by state, requests awaiting approval
        within the configured expiry lead or past their expiry, and open approval-family
        alerts by type. Never per tenant, never money. Takes no parameter. Read-only.
        Requires `platform:approval:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      responses:
        '200':
          description: The approval operations counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalOperationsMetrics'
        '400':
          $ref: '#/components/responses/CommercialAlertValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'

  /platform/commercial/audit-events:
    get:
      operationId: listPlatformCommercialAuditEvents
      tags: [Platform Commercial Audit]
      summary: List commercial audit events (newest first, cursor-paged).
      description: |
        CCP-A2 — one page of the commercial audit stream, ordered
        `created_at DESC, id DESC`. Filters are ANDed. Live keyset paging: the opaque
        `next_cursor` pins the filter set, and replaying it under different filters
        is refused with 400. Read-only. Requires `platform:commercial:audit:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - name: actor_id
          in: query
          required: false
          description: Only events by this actor (user id).
          schema:
            type: string
            format: uuid
        - name: event_type
          in: query
          required: false
          description: Only events of this type (UPPER_SNAKE).
          schema:
            type: string
            pattern: '^[A-Z][A-Z0-9_]{2,99}$'
        - name: tenant_id
          in: query
          required: false
          description: Only events about this tenant.
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          description: Inclusive lower bound on `created_at` (ISO-8601).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Exclusive upper bound on `created_at` (ISO-8601). Must be later than `from`.
          schema:
            type: string
            format: date-time
        - name: exception_only
          in: query
          required: false
          description: '`true` returns only events recorded as a bounded exception (`is_exception`).'
          schema:
            type: string
            enum: ['true', 'false']
        - name: change_request_id
          in: query
          required: false
          description: CCP-B5 — only events about this change request.
          schema:
            type: string
            format: uuid
        - name: product_key
          in: query
          required: false
          description: CCP-B5 — only events whose payload names this product (`payload.product_key`).
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_]{0,39}$'
        - name: limit
          in: query
          required: false
          description: Page size (default 50, max 200).
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          description: Opaque continuation cursor from a prior page's next_cursor.
          schema:
            type: string
            maxLength: 2000
      responses:
        '200':
          description: A page of commercial audit events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialAuditListResponse'
        '400':
          $ref: '#/components/responses/CommercialAuditValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'

  /platform/commercial/usage/reconciliation:
    get:
      operationId: getPlatformCommercialUsageReconciliation
      tags: [Platform Commercial Usage]
      summary: Reconcile the usage roll-ups against the allowance ledger and raw events.
      description: |
        CCP-D1 — the live reconciliation, computed on one consistent snapshot. Status
        `NOT_RUN` (the worker has never run), `RECONCILED` (every compared bucket and
        tenant matches exactly) or `NOT_RECONCILED`. Buckets written after the last run
        are `pending` and are not compared. Read-only. Requires `platform:subscription:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - name: product_key
          in: query
          required: false
          description: The product (CCP-A4 registry). Default `sign`.
          schema:
            type: string
            enum: [sign]
      responses:
        '200':
          description: The reconciliation of every registered metric of the product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialUsageReconciliation'
        '400':
          $ref: '#/components/responses/CommercialUsageValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'

  /platform/commercial/usage/periods:
    get:
      operationId: listPlatformCommercialUsagePeriods
      tags: [Platform Commercial Usage]
      summary: List per-tenant consumption per billing period (only when reconciled).
      description: |
        CCP-D1 — the period roll-ups (tenant × metric × billing period, aligned to the
        tenant's subscription and the plan version in force at the period start), newest
        period first. Refused with 409 `USAGE_ROLLUP_NOT_RECONCILED` unless the live
        reconciliation is `RECONCILED`. A period written after the last run is returned with
        `stale: true`. Counts only. Read-only. Requires `platform:subscription:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - name: product_key
          in: query
          required: false
          description: The product (CCP-A4 registry). Default `sign`.
          schema:
            type: string
            enum: [sign]
        - name: metric_key
          in: query
          required: false
          description: One registered metric of the product (e.g. `sign.envelopes`).
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_]*\.[a-z0-9_.]+$'
        - name: tenant_id
          in: query
          required: false
          description: Only this tenant.
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          description: Inclusive lower bound on `period_start` (ISO-8601).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Exclusive upper bound on `period_start` (ISO-8601). Must be later than `from`.
          schema:
            type: string
            format: date-time
        - name: include_daily
          in: query
          required: false
          description: '`true` adds the per-day (UTC) breakdown of each period.'
          schema:
            type: string
            enum: ['true', 'false']
        - name: limit
          in: query
          required: false
          description: Maximum periods returned (default 100, max 500); `truncated` says more exist.
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: The period roll-ups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialUsagePeriodsResponse'
        '400':
          $ref: '#/components/responses/CommercialUsageValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '409':
          $ref: '#/components/responses/CommercialUsageNotReconciled'

  /platform/commercial/audit-events/export:
    post:
      operationId: exportPlatformCommercialAuditEvents
      tags: [Platform Commercial Audit]
      summary: Export the filtered commercial audit events as CSV (read-only; the export is audited).
      description: |
        CCP-B5 — renders every event matching the filters (newest first) as CSV with the
        columns `id,time_utc,event,actor,roles,tenant,product,change_request,exception,detail`
        and appends exactly ONE `COMMERCIAL_AUDIT_EXPORTED` event (filters, row count, the
        SHA-256 of the file). Nothing else is written. At most 10,000 events; a larger result
        is refused (details.reason `export_too_large`), never truncated. Requires
        `platform:commercial:audit:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommercialAuditExportRequest'
      responses:
        '200':
          description: The CSV document and the id of the audit event that records the export.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialAuditExport'
        '400':
          $ref: '#/components/responses/CommercialAuditValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '503':
          $ref: '#/components/responses/CommercialPolicyUnavailable'

  /platform/commercial/policy-versions:
    get:
      operationId: listPlatformCommercialPolicyVersions
      tags: [Platform Commercial Policy]
      summary: List commercial policy versions (newest first) with the open activation request.
      description: |
        CCP-B5 (B5-P) — every CommercialPolicyVersion with its parsed content, the one open
        (DRAFT / PENDING_APPROVAL) `POLICY_ACTIVATE` request, and what the caller may do
        (`can_author`: live platform_owner or finance_admin; `can_request_activation`: live,
        attested finance_admin). Activation and rollback are `POLICY_ACTIVATE` change
        requests. Requires `platform:approval:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      responses:
        '200':
          description: The policy versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialPolicyList'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
    post:
      operationId: createPlatformCommercialPolicyDraft
      tags: [Platform Commercial Policy]
      summary: Create a DRAFT policy version copied from a version.
      description: |
        CCP-B5 — one DRAFT at a time (details.reason `policy_draft_exists`). The author must
        hold the live platform_owner or finance_admin role (403 `requester_role_missing`).
        Audited (`COMMERCIAL_POLICY_VERSION_DRAFTED`). Requires `platform:approval:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommercialPolicyDraft'
      responses:
        '201':
          description: The new DRAFT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialPolicyVersionEnvelope'
        '400':
          $ref: '#/components/responses/CommercialChangeRequestValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/CommercialChangeRequestNotFound'
        '409':
          $ref: '#/components/responses/CommercialChangeRequestConflict'

  /platform/commercial/policy-versions/{id}:
    patch:
      operationId: updatePlatformCommercialPolicyDraft
      tags: [Platform Commercial Policy]
      summary: Edit a DRAFT policy version.
      description: |
        CCP-B5 — only a DRAFT changes (409 `policy_version_not_draft`), and not while an open
        activation request targets it (409 `policy_version_locked`). Each value must be in
        its allowed range (400 `policy_value_out_of_range`) and the document must pass the
        strict policy parser (400 `policy_value_invalid`). The author must hold the live
        platform_owner or finance_admin role. Audited (`COMMERCIAL_POLICY_DRAFT_UPDATED`).
        Requires `platform:approval:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The policy version's UUID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommercialPolicyDraft'
      responses:
        '200':
          description: The edited DRAFT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialPolicyVersionEnvelope'
        '400':
          $ref: '#/components/responses/CommercialChangeRequestValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/CommercialChangeRequestNotFound'
        '409':
          $ref: '#/components/responses/CommercialChangeRequestConflict'

  /platform/commercial/operators:
    get:
      operationId: listPlatformCommercialOperators
      tags: [Platform Commercial Roles]
      summary: The platform roster with commercial roles, and the fulfillability of each approval chain.
      description: |
        CCP-B5 — read-only. Each platform operator's live roles, D9 attestation, the
        last-owner flag and pending role-change requests; and, per approval chain, whether a
        maker plus distinct eligible approvers exist now (the same rule as the approve gate,
        409 `CCP_NOT_BOOTSTRAPPED`). Role changes are `ROLE_GRANT` / `ROLE_REVOKE` change
        requests only. Requires `platform:approval:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      responses:
        '200':
          description: The roster and chain state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialRoster'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '503':
          $ref: '#/components/responses/CommercialPolicyUnavailable'

  /platform/commercial/contracts:
    get:
      operationId: listPlatformCommercialContracts
      tags: [Platform Commercial Contracts]
      summary: List enterprise contract records (active first, then newest).
      description: |
        CCP-B4 — enterprise contracts: evidence-bearing records of governed MANUAL
        subscriptions (negotiated terms and hashed evidence documents). Read-only: a
        contract is recorded, amended or ended only by an applied change request
        (`SUBSCRIPTION_OPEN` / `SUBSCRIPTION_CHANGE` with a `contract` or
        `contract_amendment` block, `SUBSCRIPTION_END` with `contract_end`). `status`,
        plan, version and commitment are read through the governed subscription; the
        contract stores none of them. Requires `platform:subscription:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - name: tenant_id
          in: query
          required: false
          description: Only contracts of this tenant.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Only active (the governed subscription is open) or ended contracts.
          schema:
            type: string
            enum: [ACTIVE, ENDED]
        - name: limit
          in: query
          required: false
          description: Maximum rows (default 100, max 200).
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: The contract records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialContractListResponse'
        '400':
          $ref: '#/components/responses/CommercialContractValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'

  /platform/commercial/contracts/{id}:
    get:
      operationId: getPlatformCommercialContract
      tags: [Platform Commercial Contracts]
      summary: Get one contract record (terms, hashed documents, amendments).
      description: |
        CCP-B4 — the contract with its current negotiated terms, its evidence documents
        (name and SHA-256; no bytes are stored) and its amendment timeline. Contract
        invoicing is not enabled (`invoicing.enabled` is always false until the
        enterprise invoicing choice is made). Requires `platform:subscription:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The contract record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialContractDetail'
        '400':
          $ref: '#/components/responses/CommercialContractValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/CommercialContractNotFound'

  /platform/commercial/subscriptions:
    get:
      operationId: listPlatformCommercialSubscriptions
      tags: [Platform Commercial Subscriptions]
      summary: The Subscriptions workbench (latest base subscription per tenant and product).
      description: |
        CCP-B3 — for each tenant and product, the latest `BASE` subscription: the open row
        when one exists, else the most recently ended row. Ordered by tenant name (nulls
        last), product, id. Each row carries its plan and pinned plan version, the billing
        period containing `as_of` (null when ended), its contract reference, whether a
        provider subscription is linked (the reference itself is not returned), the reasons
        of the tenant's open reconciliation flags attributed to the product, and its active
        support extensions. Read-only; no money. Requires `platform:subscription:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - name: product_key
          in: query
          required: false
          description: Only this registered product (the v1 registry holds sign only).
          schema:
            type: string
            enum: [sign]
      responses:
        '200':
          description: The workbench rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialSubscriptionsResponse'
        '400':
          $ref: '#/components/responses/CommercialSubscriptionsValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'

  /platform/commercial/tenants/{tenant_id}/commercial:
    get:
      operationId: getPlatformCommercialTenantOverview
      tags: [Platform Commercial Subscriptions]
      summary: A tenant's commercial overview per product (the Commercial tab).
      description: |
        CCP-B3 — per product (`sign`, `ats`, `portal`, `intelligence`, in that order): whether
        it is in the product registry, the entitlement with its grant and revoke provenance
        (`NONE` when no row exists), the latest `BASE` subscription (same rule as the
        workbench), the open reconciliation flags attributed to the product with the newest
        `CONVERSION` change request naming the flag's held provider subscription, and the
        tenant and product's open change request (DRAFT, PENDING_APPROVAL, APPROVED,
        APPLYING or APPLY_FAILED). Read-only; no money. Requires
        `platform:subscription:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The tenant's commercial overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialTenantOverviewResponse'
        '400':
          $ref: '#/components/responses/CommercialSubscriptionsValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformTenantNotFound'

  /platform/commercial/billing-commands:
    get:
      operationId: listPlatformCommercialBillingCommands
      tags: [Platform Commercial Billing Operations]
      summary: List Stripe commands (newest first, cursor-paged).
      description: |
        CCP-C1 — one page of the Stripe command outbox, ordered `created_at DESC, id DESC`.
        Filters are ANDed. `pending_provider` is true until the provider-confirmed state is
        applied (Conversion Rule C-23). `state=FAILED` lists the failed commands (surfaced,
        retryable, never dropped). The opaque `next_cursor` pins the filter set. Read-only.
        Requires `platform:billing:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - name: state
          in: query
          required: false
          description: Only commands in this state.
          schema:
            $ref: '#/components/schemas/BillingProviderCommandState'
        - name: tenant_id
          in: query
          required: false
          description: Only commands of this tenant.
          schema:
            type: string
            format: uuid
        - name: change_request_id
          in: query
          required: false
          description: Only commands issued by this change request.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Page size (default 50, max 200).
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          description: Opaque continuation cursor from a prior page's next_cursor.
          schema:
            type: string
            maxLength: 2000
      responses:
        '200':
          description: A page of Stripe commands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingProviderCommandListResponse'
        '400':
          $ref: '#/components/responses/BillingOperationsValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'

  /platform/commercial/billing-webhook-inbox:
    get:
      operationId: listPlatformCommercialBillingWebhookInbox
      tags: [Platform Commercial Billing Operations]
      summary: List webhook inbox events (newest first, cursor-paged).
      description: |
        CCP-C1 — one page of the webhook inbox, ordered `received_at DESC, id DESC`. Each row
        is the verified envelope of one provider event (never its payload) and its processing
        state. `status=FAILED` lists the events whose processing failed (retried by the
        provider's redelivery and the inbox worker). Read-only. Requires
        `platform:billing:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Only events in this processing status.
          schema:
            type: string
            enum: [RECEIVED, PROCESSING, PROCESSED, FAILED]
        - name: limit
          in: query
          required: false
          description: Page size (default 50, max 200).
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          description: Opaque continuation cursor from a prior page's next_cursor.
          schema:
            type: string
            maxLength: 2000
      responses:
        '200':
          description: A page of webhook inbox events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingWebhookInboxListResponse'
        '400':
          $ref: '#/components/responses/BillingOperationsValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'

  /platform/commercial/billing-portal-configuration:
    get:
      operationId: getPlatformCommercialBillingPortalConfiguration
      tags: [Platform Commercial Billing Status]
      summary: Read the billing-portal configuration facts (read-through).
      description: |
        CCP-C3 — `STRIPE_PORTAL_CONFIGURATION` as set, and what the provider holds for it:
        `NOT_CONFIGURED`, `NOT_FOUND`, `INACTIVE` or `ACTIVE`, with its feature flags.
        `ACTIVE` is a provider fact only; it is NOT the verification of the external
        portal-configuration decision (Program Build Directive §10), which is recorded by a
        person. Takes no parameters (the id is never caller-supplied). Read-only. Requires
        `platform:billing:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      responses:
        '200':
          description: The portal-configuration facts (or a designed disabled state).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPortalConfigurationResponse'
        '400':
          $ref: '#/components/responses/BillingStatusValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'

  /platform/commercial/tenants/{tenant_id}/billing-status:
    get:
      operationId: getPlatformCommercialTenantBillingStatus
      tags: [Platform Commercial Billing Status]
      summary: Read a tenant's invoice and payment status for one product (read-through).
      description: |
        CCP-C3 — the tenant's Stripe-owned subscription for the product (the open one, else
        the most recent), the provider's subscription status, and its invoices (newest first)
        with a payment state derived from the provider's own status and dates. Invoices are
        read by subscription, so another product's invoices are never read. A provider
        subscription or invoice that does not belong to this tenant and billing account is
        `TENANT_MISMATCH`, and no provider data is returned. Governed (MANUAL) and contract
        subscriptions are `NO_PROVIDER_SUBSCRIPTION`. Read-only. Requires
        `platform:billing:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: product_key
          in: query
          required: true
          description: A registered product (the v1 registry holds sign only).
          schema:
            type: string
            enum: [sign]
        - name: invoice_limit
          in: query
          required: false
          description: Invoices to return (default 12, max 50).
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: The billing status (or a designed disabled state).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantBillingStatusResponse'
        '400':
          $ref: '#/components/responses/BillingStatusValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'

  /platform/commercial/finance/renewals:
    get:
      operationId: getPlatformCommercialFinanceRenewals
      tags: [Platform Commercial Finance]
      summary: The renewals queue (commitment ends and provider period ends).
      description: |
        CCP-C6 — every open MANUAL or SELF_SERVICE base subscription with a commitment end
        (`COMMITMENT_END`) or, when provider-billed, a period end (`PERIOD_END`) on or before
        `as_of + within_days`. A date already passed is listed with `lapsed: true`. Ordered by
        `renewal_at`. Each item carries the pinned version's USD list price. Read-only.
        Requires `platform:billing:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - name: within_days
          in: query
          required: false
          description: The horizon in days (default 90).
          schema:
            type: integer
            minimum: 1
            maximum: 365
        - name: tenant_id
          in: query
          required: false
          description: Only this tenant.
          schema:
            type: string
            format: uuid
        - name: product_key
          in: query
          required: false
          description: Only this product (the closed registry; `sign` in v1).
          schema:
            type: string
            enum: [sign]
      responses:
        '200':
          description: The renewals queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceRenewalsReport'
        '400':
          $ref: '#/components/responses/FinanceReportValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'

  /platform/commercial/finance/outstanding-payments:
    get:
      operationId: getPlatformCommercialFinanceOutstandingPayments
      tags: [Platform Commercial Finance]
      summary: Outstanding payments (past due or incomplete subscriptions).
      description: |
        CCP-C6 — every open MANUAL or SELF_SERVICE base subscription in `PAST_DUE` or
        `INCOMPLETE`, with its grace state from `grace_until` (`IN_GRACE`, `GRACE_ENDED`,
        `NO_GRACE_DATE`), ordered by the soonest grace end. `amount_due` is always null with
        `amount_due_reason: INVOICE_READ_NOT_DELIVERED`, and is sent only to a caller holding
        `platform:billing:amount:read` (otherwise `amount_withheld: FINANCE_SCOPE_REQUIRED`;
        CCP-A1 Amendment A1). List prices are the catalog's and are unchanged.
        Read-only. Requires `platform:billing:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - name: tenant_id
          in: query
          required: false
          description: Only this tenant.
          schema:
            type: string
            format: uuid
        - name: product_key
          in: query
          required: false
          description: Only this product (the closed registry; `sign` in v1).
          schema:
            type: string
            enum: [sign]
      responses:
        '200':
          description: The outstanding payments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceOutstandingPaymentsReport'
        '400':
          $ref: '#/components/responses/FinanceReportValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'

  /platform/commercial/finance/reconciliation-report:
    get:
      operationId: getPlatformCommercialFinanceReconciliationReport
      tags: [Platform Commercial Finance]
      summary: The billing reconciliation report (records vs effective entitlements; held activations).
      description: |
        CCP-C6 — every open base subscription reconciled against its pinned plan version and
        the tenant's effective entitlements (`discrepancies`), product capabilities held with
        no open subscription, every open reconciliation flag (the `governed_subscription_open`
        flags are listed as held activations, Conversion Rule C-8, with the governed row, the
        checkout intent, the held plan and any unconfirmed Stripe command), and the command
        and inbox exception counts. `status` is `RECONCILED` only when `counts.exceptions` is
        0. Read-only: a held activation is resolved only by a governed conversion, a governed
        end or a provider-confirmed end (C-9). Requires `platform:billing:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - name: tenant_id
          in: query
          required: false
          description: Only this tenant.
          schema:
            type: string
            format: uuid
        - name: product_key
          in: query
          required: false
          description: Only this product (the closed registry; `sign` in v1).
          schema:
            type: string
            enum: [sign]
      responses:
        '200':
          description: The billing reconciliation report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceReconciliationReport'
        '400':
          $ref: '#/components/responses/FinanceReportValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'

  /platform/commercial/finance/revenue:
    get:
      operationId: getPlatformCommercialFinanceRevenue
      tags: [Platform Commercial Finance]
      summary: Revenue reporting (MRR, ARR, renewal pipeline by month); amounts need the Finance amount scope.
      description: |
        CCP-D2 — platform-wide revenue derived from the commercial records at read time (no
        ledger, no stored figure): MRR is the sum, over open MANUAL or SELF_SERVICE base
        subscriptions in `ACTIVE` or `PAST_DUE`, of the pinned plan version's USD list price per
        `MONTH`; ARR is MRR × 12. Every other open commercial subscription is excluded and
        counted with exactly one reason (`counts.excluded_by_reason`). The renewal pipeline
        groups the renewal events (`COMMITMENT_END`; `PERIOD_END` for provider-billed rows) by
        UTC month from the current month; events on or before `as_of` are `LAPSED`.

        **Amounts need the Finance amount scope** (CCP-R3; Aramo-CCP-A1-Amendment-A1-Finance-
        Amount-Scope-v1_0, LOCKED, FA-1 / FA-5). A caller holding `platform:billing:read` AND
        `platform:billing:amount:read` (platform_owner, finance_admin, read_only_auditor) receives
        `mrr_minor` / `arr_minor` on the report and each product line and `mrr_minor` on each
        renewal bucket. For every other reader those fields are absent and each money-bearing
        object carries `amount_withheld: FINANCE_SCOPE_REQUIRED`. Counts, states and exclusion
        reasons are returned to every reader. No tenant filter and no per-tenant row.
        Read-only. Requires `platform:billing:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - name: product_key
          in: query
          required: false
          description: Only this product (the closed registry; `sign` in v1).
          schema:
            type: string
            enum: [sign]
        - name: months
          in: query
          required: false
          description: The renewal pipeline horizon in calendar months, from the current month (default 12).
          schema:
            type: integer
            minimum: 1
            maximum: 24
      responses:
        '200':
          description: The revenue report; amounts present only for a Finance amount scope holder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceRevenueReport'
        '400':
          $ref: '#/components/responses/FinanceRevenueValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'

  /platform/commercial/change-requests:
    post:
      operationId: createPlatformCommercialChangeRequest
      tags: [Platform Commercial Change Requests]
      summary: Create a commercial change request (DRAFT).
      description: |
        Creates a DRAFT request and snapshots its approval chain from the ACTIVE commercial
        policy. Requires the action's requester scope (for example
        `platform:subscription:request`). CCP-A9 (TD-A3-5): governance actions need the
        requester's live role plus an active D9 attestation — `POLICY_ACTIVATE` a
        `finance_admin`; `ROLE_GRANT` / `ROLE_REVOKE` (the governed role-change endpoint;
        payload `subject_user_id`, `role_key` of the 6 CCP roles, and for a grant to an
        unattested subject `human_ref_hash`) a `platform_owner`, approved by a different
        `platform_owner`; the approval completing the chain applies the role change.
        Otherwise 403 `requester_role_missing` / `not_human`. Tenant-scoped actions carry `tenant_id` and
        `product_key` (`sign`); at most one open request exists per tenant and product.
        Idempotent on `idempotency_key`: a replay of the same request returns 200 with
        `replayed: true`; the key reused for a different request returns 409
        `IDEMPOTENCY_KEY_CONFLICT`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommercialChangeRequest'
      responses:
        '201':
          description: The request was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialChangeRequestEnvelope'
        '200':
          description: Idempotent replay of an existing request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialChangeRequestEnvelope'
        '400':
          $ref: '#/components/responses/CommercialChangeRequestValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '409':
          $ref: '#/components/responses/CommercialChangeRequestConflict'
        '503':
          $ref: '#/components/responses/CommercialPolicyUnavailable'
    get:
      operationId: listPlatformCommercialChangeRequests
      tags: [Platform Commercial Change Requests]
      summary: List commercial change requests (newest first).
      description: |
        Keyset-paged, newest first; `next_cursor` pins the filters. `eligible_for_me=true`
        evaluates the caller's live eligibility over the open PENDING_APPROVAL set.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CommercialChangeRequestState'
        - name: requester
          in: query
          required: false
          description: '`me` or a user id.'
          schema:
            type: string
        - name: eligible_for_me
          in: query
          required: false
          description: '`true` returns only PENDING_APPROVAL requests the caller may approve now (not paged).'
          schema:
            type: string
            enum: ['true', 'false']
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 2000
      responses:
        '200':
          description: A page of change requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialChangeRequestListResponse'
        '400':
          $ref: '#/components/responses/CommercialChangeRequestValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'

  /platform/commercial/change-requests/{id}:
    get:
      operationId: getPlatformCommercialChangeRequest
      tags: [Platform Commercial Change Requests]
      summary: Get one change request with its approvals and the caller's per-step verdict.
      description: Read-only. The per-step verdict uses the caller's live roles, scopes and attestation.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/CommercialChangeRequestId'
      responses:
        '200':
          description: The change request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialChangeRequestDetail'
        '400':
          $ref: '#/components/responses/CommercialChangeRequestValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/CommercialChangeRequestNotFound'

  /platform/commercial/change-requests/{id}/submit:
    post:
      operationId: submitPlatformCommercialChangeRequest
      tags: [Platform Commercial Change Requests]
      summary: Submit a DRAFT for approval (requester only).
      description: DRAFT → PENDING_APPROVAL. `expires_at` is set from the request's own policy version (72 h in v1; expired at exactly that instant).
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/CommercialChangeRequestId'
      responses:
        '200':
          description: The submitted request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialChangeRequestStateEnvelope'
        '400':
          $ref: '#/components/responses/CommercialChangeRequestValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/CommercialChangeRequestNotFound'
        '409':
          $ref: '#/components/responses/CommercialChangeRequestConflict'
        '503':
          $ref: '#/components/responses/CommercialPolicyUnavailable'

  /platform/commercial/change-requests/{id}/withdraw:
    post:
      operationId: withdrawPlatformCommercialChangeRequest
      tags: [Platform Commercial Change Requests]
      summary: Withdraw a DRAFT or PENDING_APPROVAL request (requester only).
      description: Moves the request to WITHDRAWN (terminal). An expired request returns 409.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/CommercialChangeRequestId'
      responses:
        '200':
          description: The withdrawn request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialChangeRequestStateEnvelope'
        '400':
          $ref: '#/components/responses/CommercialChangeRequestValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/CommercialChangeRequestNotFound'
        '409':
          $ref: '#/components/responses/CommercialChangeRequestConflict'

  /platform/commercial/change-requests/{id}/approvals:
    post:
      operationId: approvePlatformCommercialChangeRequestStep
      tags: [Platform Commercial Change Requests]
      summary: Approve one step of the snapshotted chain.
      description: |
        Records an append-only approval of `step_index`, which must be the next unfilled
        step. The last step moves the request to APPROVED. Eligibility is read live in the
        transaction. One user fills at most one step of a request.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/CommercialChangeRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveCommercialChangeRequest'
      responses:
        '201':
          description: The approval was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialApprovalEnvelope'
        '400':
          $ref: '#/components/responses/CommercialChangeRequestValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/CommercialChangeRequestNotFound'
        '409':
          $ref: '#/components/responses/CommercialApprovalRefused'

  /platform/commercial/change-requests/{id}/reject:
    post:
      operationId: rejectPlatformCommercialChangeRequest
      tags: [Platform Commercial Change Requests]
      summary: Reject a PENDING_APPROVAL request (a checker eligible for the next step).
      description: Moves the request to REJECTED (terminal). The same eligibility refusals as approval apply.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/CommercialChangeRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectCommercialChangeRequest'
      responses:
        '200':
          description: The rejected request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialChangeRequestStateEnvelope'
        '400':
          $ref: '#/components/responses/CommercialChangeRequestValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/CommercialChangeRequestNotFound'
        '409':
          $ref: '#/components/responses/CommercialApprovalRefused'

  /platform/commercial/change-requests/{id}/apply:
    post:
      operationId: applyPlatformCommercialChangeRequest
      tags: [Platform Commercial Change Requests]
      summary: Apply an APPROVED Aramo-owned change request in one transaction (CCP-A6).
      description: |
        Applies an APPROVED (or APPLY_FAILED, retry) request of action type SUBSCRIPTION_OPEN,
        SUBSCRIPTION_CHANGE, SUBSCRIPTION_END or ENTITLEMENT_GRANT (CCP-A6), ENTITLEMENT_REVOKE (CCP-A7), or PLAN_VERSION_PUBLISH or
        PLAN_RETIRE (CCP-B2-backend: the catalog lifecycle; publishing or retiring never moves a
        subscription; PLAN_RETIRE retires the one plan version it names, never the whole plan), or POLICY_ACTIVATE (CCP-B5-R: APPROVED → APPLYING → APPLIED in the transaction
        that activates the policy version, after the NC-5 snapshot re-check; the requester must still
        hold finance_admin). Only the original requester, a person, with live requester authority may apply
        (CCP-A6-R). A6 actions run in ONE local transaction under the
        tenant's billing lock: the NC-5 re-check of every approval under the request's snapshotted
        chain, the governed (MANUAL) subscription write pinned to a PUBLISHED plan version, the
        entitlement grant (or the governed revoke, which keeps the row and stops the capability on the
        next request), the application record and the audit events, then APPLIED. Stripe-owned
        rows are refused (no external change is ever made or reported). Applying an APPLIED request
        replays it (idempotent, nothing written). The route requires `platform:approval:read`; the
        caller must also be the requester and hold the action's requester scope. Every refusal and
        failure carries a stable code and an operator-facing `details.explanation`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/CommercialChangeRequestId'
      responses:
        '200':
          description: The applied (or replayed) request and its application record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialApplyEnvelope'
        '400':
          $ref: '#/components/responses/CommercialChangeRequestValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/CommercialChangeRequestNotFound'
        '409':
          $ref: '#/components/responses/CommercialApplyConflict'

  /platform/commercial/catalog:
    get:
      operationId: getPlatformCommercialCatalog
      tags: [Platform Commercial Catalog]
      summary: Read the product and plan catalog (registry products, plans, versions, pin counts).
      description: |
        Read-only. Every registered product with its plans; each plan with its versions
        (newest first), their terms, the open-subscription pin count and the open
        publish/retire change requests; plus the approval chain a publish or retire request
        gets under the ACTIVE commercial policy (`publish_chain`, null when no valid policy).
        Requires `platform:catalog:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      responses:
        '200':
          description: The catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialCatalog'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'

