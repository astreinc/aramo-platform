      tags: [Platform Document Templates]
      summary: Cancel a pending withdrawal of an Aramo default.
      description: |
        Clears both withdrawal dates. Allowed only before the effective date, and not
        while a replacement default of the same document type is live (one live default
        per type) — 409 `TEMPLATE_PLATFORM_DEFAULT_CONFLICT` with `details.reason`
        `not_withdrawn` / `withdrawal_in_effect` / `platform_default_live`. Writes a
        global audit event before the change. Requires `platform:document_template:manage`
        and a platform session.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/PlatformTemplateIdParam'
      responses:
        '200':
          description: The template with its withdrawal cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformDocumentTemplate'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformTemplateNotFound'
