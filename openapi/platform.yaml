          type: [string, 'null']
        provider:
          type: string
          enum: [STRIPE]
        subscription_ref:
          type: string
        detected_at:
          type: string
          format: date-time
        intent_id:
          type: [string, 'null']
          format: uuid
        intent_status:
          type: [string, 'null']
        governed_subscription_id:
          type: [string, 'null']
          format: uuid
        governed_plan_key:
          type: [string, 'null']
        held_plan_key:
          type: [string, 'null']
        held_price:
          $ref: '#/components/schemas/FinancePriceFigure'
        unconfirmed_commands:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, command_kind, state, change_request_id]
            properties:
              id:
                type: string
                format: uuid
              command_kind:
                type: string
              state:
                type: string
              change_request_id:
                type: string
                format: uuid
        resolution:
          type: string
          enum: [UNRESOLVED, PENDING_PROVIDER]

    FinanceReconciliationReport:
      type: object
      additionalProperties: false
      required: [as_of, currency, billing_provider_mode, status, subscriptions, entitled_without_subscription, held_activations, other_open_flags, counts]
      properties:
        as_of:
          type: string
          format: date-time
        currency:
          type: string
          enum: [USD]
        billing_provider_mode:
          type: string
          enum: [test, live, unconfigured]
        status:
          type: string
          enum: [RECONCILED, EXCEPTIONS]
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/FinanceReconciledSubscription'
        entitled_without_subscription:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [tenant_id, tenant_name, product_key, capabilities, residual_authority, residual_authority_until]
            properties:
              tenant_id:
                type: string
                format: uuid
              tenant_name:
                type: [string, 'null']
              product_key:
                type: string
              capabilities:
                type: array
                items:
                  type: string
              residual_authority:
                type: [string, 'null']
                enum: [GRACE, SUPPORT_OVERLAY, null]
                description: |
                  CCP-R3 (TD-A7-5) — what still bounds the gap after `as_of`: the grace of an ended
                  base row, or a live support-extension overlay. null = none remains, which is
                  exactly the CCP-D3 `ENTITLEMENT_WITHOUT_ACTIVE_SUBSCRIPTION` alert condition (one
                  shared rule). Nothing is revoked automatically; access already fails closed
                  without an open sending subscription.
              residual_authority_until:
                type: [string, 'null']
                format: date-time
        held_activations:
          type: array
          items:
            $ref: '#/components/schemas/FinanceHeldActivation'
        other_open_flags:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [flag_id, tenant_id, reason, provider, subscription_ref, detected_at]
            properties:
              flag_id:
                type: string
                format: uuid
              tenant_id:
                type: string
                format: uuid
              reason:
                type: string
              provider:
                type: string
              subscription_ref:
                type: string
              detected_at:
                type: string
                format: date-time
        counts:
          type: object
          additionalProperties: false
          required: [open_subscriptions, by_source, by_status, subscriptions_with_discrepancy, discrepancies, entitled_without_subscription, held_activations, other_open_flags, unconfirmed_commands, failed_commands, failed_inbox_events, unprocessed_inbox_events, exceptions]
          properties:
            open_subscriptions:
              type: integer
            by_source:
              type: object
              additionalProperties:
                type: integer
            by_status:
              type: object
              additionalProperties:
                type: integer
            subscriptions_with_discrepancy:
              type: integer
            discrepancies:
              type: object
              additionalProperties:
                type: integer
            entitled_without_subscription:
              type: integer
            held_activations:
              type: integer
            other_open_flags:
              type: integer
            unconfirmed_commands:
              type: integer
            failed_commands:
              type: integer
            failed_inbox_events:
              type: integer
            unprocessed_inbox_events:
              type: integer
            exceptions:
              type: integer

    FinanceRevenueRenewalBucket:
      type: object
      additionalProperties: false
      required: [month, commitment_end, period_end, events, priced_events, unpriced_events]
      properties:
        month:
          type: string
          description: '`YYYY-MM` (UTC), or `LAPSED` for events on or before `as_of`.'
          pattern: '^(\d{4}-\d{2}|LAPSED)$'
        commitment_end:
          type: integer
        period_end:
          type: integer
        events:
          type: integer
        priced_events:
          type: integer
          description: Events of a subscription included in MRR.
        unpriced_events:
          type: integer
          description: Events of an excluded subscription.
        mrr_minor:
          type: integer
          description: The MRR (USD minor units) of the included subscriptions renewing in this bucket. Present only with `platform:billing:amount:read`.
        amount_withheld:
          $ref: '#/components/schemas/FinanceAmountWithheld'

    FinanceRevenueReport:
      type: object
      additionalProperties: false
      required: [as_of, currency, billing_interval, basis, billing_provider_mode, by_product, counts, renewal_pipeline]
      properties:
        as_of:
          type: string
          format: date-time
        currency:
          type: string
          enum: [USD]
        billing_interval:
          type: string
          enum: [MONTH]
        basis:
          type: string
          enum: [OPEN_SUBSCRIPTIONS_X_PINNED_LIST_PRICE]
        billing_provider_mode:
          type: string
          enum: [test, live, unconfigured]
        mrr_minor:
          type: integer
          description: MRR in USD minor units. Present only with `platform:billing:amount:read`.
        arr_minor:
          type: integer
          description: ARR (MRR × 12) in USD minor units. Present only with `platform:billing:amount:read`.
        amount_withheld:
          $ref: '#/components/schemas/FinanceAmountWithheld'
        by_product:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [product_key, subscriptions]
            properties:
              product_key:
                type: string
              subscriptions:
                type: integer
                description: Subscriptions included in MRR.
              mrr_minor:
                type: integer
                description: Present only with `platform:billing:amount:read`.
              arr_minor:
                type: integer
                description: Present only with `platform:billing:amount:read`.
              amount_withheld:
                $ref: '#/components/schemas/FinanceAmountWithheld'
        counts:
          type: object
          additionalProperties: false
          required: [open_commercial_subscriptions, included, excluded, excluded_by_reason, not_commercial_by_source]
          properties:
            open_commercial_subscriptions:
              type: integer
            included:
              type: integer
            excluded:
              type: integer
            excluded_by_reason:
              type: object
              description: |
                One reason per excluded subscription, first match in this order:
                STATUS_NOT_REVENUE_BEARING, PLAN_VERSION_INTEGRITY, CONTRACT_PRICED, NO_LIST_PRICE,
                NON_USD_CURRENCY, NON_MONTHLY_INTERVAL. Every reason is present (zero-filled).
              additionalProperties:
                type: integer
            not_commercial_by_source:
              type: object
              description: Open base rows of a non-commercial source (FREE, DEVELOPMENT); neither revenue nor an exclusion.
              additionalProperties:
                type: integer
        renewal_pipeline:
          type: object
          additionalProperties: false
          required: [months, from_month, through_month, lapsed, by_month]
          properties:
            months:
              type: integer
            from_month:
              type: string
            through_month:
              type: string
            lapsed:
              $ref: '#/components/schemas/FinanceRevenueRenewalBucket'
            by_month:
              type: array
              items:
                $ref: '#/components/schemas/FinanceRevenueRenewalBucket'

    CommercialAlert:
      type: object
      additionalProperties: false
      required: [id, alert_type, family, subject_kind, subject_id, tenant_id, product_key, status, detail, evidence, threshold_minutes, detection_count, first_detected_at, last_detected_at, resolved_at, resolution_detail]
      properties:
        id:
          type: string
          format: uuid
        alert_type:
          type: string
          enum: [COMMAND_PENDING_PROVIDER_STUCK, COMMAND_FAILED, HELD_ACTIVATION, WEBHOOK_INBOX_FAILED, USAGE_NOT_RECONCILED, ENTITLEMENT_WITHOUT_ACTIVE_SUBSCRIPTION, APPLY_FAILED, APPROVAL_NEARING_EXPIRY, APPROVAL_PAST_EXPIRY]
          description: |
            CCP-R3 (TD-A7-5): `ENTITLEMENT_WITHOUT_ACTIVE_SUBSCRIPTION` (BILLING, subject_kind
            `product_entitlement`, subject_id `<tenant_id>:<product_key>`) — a live product
            entitlement with no open base subscription of that product, past grace and with no live
            support-extension overlay. It resolves itself when the condition ends; the scanner never
            revokes anything.
        family:
          type: string
          enum: [BILLING, APPROVAL]
        subject_kind:
          type: string
          enum: [billing_command, reconciliation_flag, webhook_inbox, usage_metric, product_entitlement, change_request]
        subject_id:
          type: string
          description: The subject's id (a uuid, a metric key for usage_metric, or `<tenant_id>:<product_key>` for product_entitlement).
        tenant_id:
          type: [string, 'null']
          format: uuid
        product_key:
          type: [string, 'null']
        status:
          type: string
          enum: [OPEN, RESOLVED]
        detail:
          type: string
        evidence:
          type: object
          additionalProperties: true
          description: The subject's observed state at the last detection.
        threshold_minutes:
          type: [integer, 'null']
          description: The configured threshold the detection used (stuck and nearing-expiry types only).
        detection_count:
          type: integer
          minimum: 1
        first_detected_at:
          type: string
          format: date-time
        last_detected_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, 'null']
          format: date-time
        resolution_detail:
          type: [string, 'null']
          description: What the subject became when the condition was no longer observed.

    CommercialAlertListResponse:
      type: object
      additionalProperties: false
      required: [alerts, next_cursor]
      properties:
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/CommercialAlert'
        next_cursor:
          type: [string, 'null']
          description: Opaque continuation cursor, or null on the last page.

    CommercialAlertThresholds:
      type: object
      additionalProperties: false
      required: [pending_provider_stuck_minutes, approval_expiry_lead_minutes]
      description: The configured operational thresholds (env; not commercial policy).
      properties:
        pending_provider_stuck_minutes:
          type: integer
          minimum: 1
        approval_expiry_lead_minutes:
          type: integer
          minimum: 1

    BillingOperationsMetrics:
      type: object
      additionalProperties: false
      required: [as_of, commands_by_state, commands_pending_provider_past_threshold, webhook_inbox_by_status, open_reconciliation_flags_by_reason, open_alerts_by_type, thresholds]
      properties:
        as_of:
          type: string
          format: date-time
        commands_by_state:
          type: object
          additionalProperties: false
          required: [PENDING, DISPATCHING, PENDING_PROVIDER, RETRY_WAIT, FAILED, CONFIRMED]
          properties:
            PENDING:
              type: integer
              minimum: 0
            DISPATCHING:
              type: integer
              minimum: 0
            PENDING_PROVIDER:
              type: integer
              minimum: 0
            RETRY_WAIT:
              type: integer
              minimum: 0
            FAILED:
              type: integer
              minimum: 0
            CONFIRMED:
              type: integer
              minimum: 0
        commands_pending_provider_past_threshold:
          type: integer
          minimum: 0
        webhook_inbox_by_status:
          type: object
          additionalProperties: false
          required: [RECEIVED, PROCESSING, PROCESSED, FAILED]
          properties:
            RECEIVED:
              type: integer
              minimum: 0
            PROCESSING:
              type: integer
              minimum: 0
            PROCESSED:
              type: integer
              minimum: 0
            FAILED:
              type: integer
              minimum: 0
        open_reconciliation_flags_by_reason:
          type: object
          description: Open flags by reason (only reasons with at least one open flag appear).
          additionalProperties:
            type: integer
            minimum: 0
        open_alerts_by_type:
          type: object
          additionalProperties: false
          required: [COMMAND_PENDING_PROVIDER_STUCK, COMMAND_FAILED, HELD_ACTIVATION, WEBHOOK_INBOX_FAILED, USAGE_NOT_RECONCILED, ENTITLEMENT_WITHOUT_ACTIVE_SUBSCRIPTION]
          properties:
            COMMAND_PENDING_PROVIDER_STUCK:
              type: integer
              minimum: 0
            COMMAND_FAILED:
              type: integer
              minimum: 0
            HELD_ACTIVATION:
              type: integer
              minimum: 0
            WEBHOOK_INBOX_FAILED:
              type: integer
              minimum: 0
            USAGE_NOT_RECONCILED:
              type: integer
              minimum: 0
            ENTITLEMENT_WITHOUT_ACTIVE_SUBSCRIPTION:
              type: integer
              minimum: 0
        thresholds:
          $ref: '#/components/schemas/CommercialAlertThresholds'

    ApprovalOperationsMetrics:
      type: object
      additionalProperties: false
      required: [as_of, change_requests_by_state, pending_approval_nearing_expiry, pending_approval_past_expiry, open_alerts_by_type, thresholds]
      properties:
        as_of:
          type: string
          format: date-time
        change_requests_by_state:
          type: object
          additionalProperties: false
          required: [DRAFT, PENDING_APPROVAL, APPROVED, APPLYING, APPLIED, APPLY_FAILED, REJECTED, EXPIRED, WITHDRAWN]
          properties:
            DRAFT:
              type: integer
              minimum: 0
            PENDING_APPROVAL:
              type: integer
              minimum: 0
            APPROVED:
              type: integer
              minimum: 0
            APPLYING:
              type: integer
              minimum: 0
            APPLIED:
              type: integer
              minimum: 0
            APPLY_FAILED:
              type: integer
              minimum: 0
            REJECTED:
              type: integer
              minimum: 0
            EXPIRED:
              type: integer
              minimum: 0
            WITHDRAWN:
              type: integer
              minimum: 0
        pending_approval_nearing_expiry:
          type: integer
          minimum: 0
        pending_approval_past_expiry:
          type: integer
          minimum: 0
        open_alerts_by_type:
          type: object
          additionalProperties: false
          required: [APPLY_FAILED, APPROVAL_NEARING_EXPIRY, APPROVAL_PAST_EXPIRY]
          properties:
            APPLY_FAILED:
              type: integer
              minimum: 0
            APPROVAL_NEARING_EXPIRY:
              type: integer
              minimum: 0
            APPROVAL_PAST_EXPIRY:
              type: integer
              minimum: 0
        thresholds:
          $ref: '#/components/schemas/CommercialAlertThresholds'

    CommercialActionType:
      type: string
      description: |
        CCP-R3 (TD-B2-1): `PLAN_RETIRE` retires ONE specified plan version (payload
        `{ plan_version_id }`, required; 400 `plan_version_id_required` without it). It never
        retires a whole plan; the plan and its other versions are unchanged.
      enum: [SUBSCRIPTION_OPEN, SUBSCRIPTION_CHANGE, SUBSCRIPTION_END, ENTITLEMENT_GRANT, ENTITLEMENT_REVOKE, PLAN_VERSION_PUBLISH, PLAN_RETIRE, POLICY_ACTIVATE, SUPPORT_EXTENSION, ROLE_GRANT, ROLE_REVOKE, CREDIT, DISCOUNT, CONVERSION]

    CommercialChangeRequestState:
      type: string
      enum: [DRAFT, PENDING_APPROVAL, APPROVED, APPLYING, APPLIED, APPLY_FAILED, REJECTED, EXPIRED, WITHDRAWN, APPLY_EXPIRED]

    CreateCommercialChangeRequest:
      type: object
      additionalProperties: false
      required: [action_type, payload, reason, idempotency_key]
      properties:
        action_type:
          $ref: '#/components/schemas/CommercialActionType'
        kind:
          type: string
          enum: [NORMAL, EXCEPTION, MIGRATION]
          description: Only NORMAL is created through this route.
        tenant_id:
          type: string
          format: uuid
        product_key:
          type: string
          description: Required with tenant_id. `sign` only until the product registry (CCP-A4).
        payload:
          type: object
          additionalProperties: true
          description: The action's payload. Frozen at creation (checksummed).
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 200
          pattern: '^[A-Za-z0-9._:-]+$'

    ApproveCommercialChangeRequest:
      type: object
      additionalProperties: false
      required: [step_index]
      properties:
        step_index:
          type: integer
          minimum: 0
          maximum: 9
        comment:
          type: string
          maxLength: 2000

    RejectCommercialChangeRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000

    CommercialChainStep:
      type: object
      additionalProperties: false
      required: [step_index, role_key, scope_keys]
      properties:
        step_index:
          type: integer
        role_key:
          type: string
          enum: [finance_admin, platform_owner]
        scope_keys:
          type: array
          items:
            type: string

    CommercialChangeRequest:
      type: object
      additionalProperties: false
      required: [id, action_type, kind, state, tenant_id, product_key, payload, payload_checksum, required_chain, policy_version_id, policy_checksum, requested_by, reason, created_at, submitted_at, expires_at, approved_at, rejected_at, rejected_by, rejection_reason, withdrawn_at, expired_at, applied_at]
      properties:
        id:
          type: string
          format: uuid
        action_type:
          $ref: '#/components/schemas/CommercialActionType'
        kind:
          type: string
          enum: [NORMAL, EXCEPTION, MIGRATION]
        state:
          $ref: '#/components/schemas/CommercialChangeRequestState'
        tenant_id:
          type: [string, 'null']
          format: uuid
        product_key:
          type: [string, 'null']
        payload:
          type: object
          additionalProperties: true
          description: |
            The stored payload. CCP-R3 (CCP-A1 Amendment A1): a CREDIT's tenant-specific
            `amount_minor` is sent only to a caller holding `platform:billing:read` and
            `platform:billing:amount:read`; otherwise it is omitted (here and in
            `required_chain.basis`) with `amount_withheld: FINANCE_SCOPE_REQUIRED`.
            `payload_checksum` is the stored row's checksum over the full payload.
        payload_checksum:
          type: string
        required_chain:
          type: object
          additionalProperties: false
          required: [rule, basis, steps]
          description: The chain snapshotted from the policy version when the request was created.
          properties:
            rule:
              type: string
              # CCP-A8: BOUNDED_EXCEPTION = the zero-step chain of a bounded support extension.
              enum: [FINANCE_THEN_OWNER, FINANCE_ONLY, DISTINCT_PLATFORM_OWNER, BOUNDED_EXCEPTION]
            basis:
              type: object
              additionalProperties: true
            steps:
              type: array
              items:
                $ref: '#/components/schemas/CommercialChainStep'
        policy_version_id:
          type: string
          format: uuid
        policy_checksum:
          type: string
        requested_by:
          type: string
          format: uuid
        reason:
          type: string
        created_at:
          type: string
          format: date-time
        submitted_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
        approved_at:
          type: [string, 'null']
          format: date-time
        rejected_at:
          type: [string, 'null']
          format: date-time
        rejected_by:
          type: [string, 'null']
          format: uuid
        rejection_reason:
          type: [string, 'null']
        withdrawn_at:
          type: [string, 'null']
          format: date-time
        expired_at:
          type: [string, 'null']
          format: date-time
        applied_at:
          type: [string, 'null']
          format: date-time
          description: Set when the request was applied (state APPLIED) — a governed apply, a role change (CCP-A9) or a policy activation (CCP-B5-R).

    CommercialApproval:
      type: object
      additionalProperties: false
      required: [id, step_index, approver_user_id, step_role_key, step_scope_keys, approver_role_keys, comment, created_at]
      properties:
        id:
          type: string
          format: uuid
        step_index:
          type: integer
        approver_user_id:
          type: string
          format: uuid
        step_role_key:
          type: string
        step_scope_keys:
          type: array
          items:
            type: string
        approver_role_keys:
          type: array
          description: The approver's live role keys when the approval was recorded.
          items:
            type: string
        comment:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time

    CommercialChangeRequestEnvelope:
      type: object
      additionalProperties: false
      required: [request, replayed]
      properties:
        request:
          $ref: '#/components/schemas/CommercialChangeRequest'
        replayed:
          type: boolean

    CommercialChangeRequestStateEnvelope:
      type: object
      additionalProperties: false
      required: [request]
      properties:
        request:
          $ref: '#/components/schemas/CommercialChangeRequest'

    CommercialChangeApplication:
      type: object
      additionalProperties: false
      required: [id, change_request_id, action_type, tenant_id, product_key, subscription_id, replaced_subscription_id, from_plan_version_id, to_plan_version_id, capabilities, capabilities_inserted, capabilities_revoked, attempt, applied_by, applied_at]
      properties:
        id: { type: string, format: uuid }
        change_request_id: { type: string, format: uuid }
        action_type: { type: string, enum: [SUBSCRIPTION_OPEN, SUBSCRIPTION_CHANGE, SUBSCRIPTION_END, ENTITLEMENT_GRANT, ENTITLEMENT_REVOKE, SUPPORT_EXTENSION, CONVERSION] }
        tenant_id: { type: string, format: uuid }
        product_key: { type: string }
        subscription_id: { type: [string, 'null'], format: uuid }
        replaced_subscription_id: { type: [string, 'null'], format: uuid }
        from_plan_version_id: { type: [string, 'null'], format: uuid }
        to_plan_version_id: { type: [string, 'null'], format: uuid }
        capabilities: { type: array, items: { type: string } }
        capabilities_inserted: { type: array, items: { type: string } }
        # CCP-A7 — what an ENTITLEMENT_REVOKE revoked (empty for every other action).
        capabilities_revoked: { type: array, items: { type: string } }
        attempt: { type: integer, minimum: 1 }
        applied_by: { type: string, format: uuid }
        applied_at: { type: string, format: date-time }

    CommercialCatalogApplication:
      type: object
      additionalProperties: false
      description: CCP-B2-backend — one applied plan-version publish or retire.
      required: [id, change_request_id, action_type, plan_id, plan_version_id, retired_plan_version_id, provider_price_ref, attempt, applied_by, applied_at]
      properties:
        id: { type: string, format: uuid }
        change_request_id: { type: string, format: uuid }
        action_type: { type: string, enum: [PLAN_VERSION_PUBLISH, PLAN_RETIRE] }
        plan_id: { type: string, format: uuid }
        plan_version_id: { type: string, format: uuid }
        retired_plan_version_id: { type: [string, 'null'], format: uuid }
        provider_price_ref: { type: [string, 'null'] }
        attempt: { type: integer, minimum: 1 }
        applied_by: { type: string, format: uuid }
        applied_at: { type: string, format: date-time }

    CommercialApplyEnvelope:
      type: object
      additionalProperties: false
      required: [request, application, catalog_application, replayed]
      properties:
        request:
          $ref: '#/components/schemas/CommercialChangeRequest'
        application:
          description: The subscription / entitlement application (CCP-A6); null for a catalog apply.
          oneOf:
            - $ref: '#/components/schemas/CommercialChangeApplication'
            - type: 'null'
        catalog_application:
          description: The catalog application (CCP-B2-backend); null otherwise.
          oneOf:
            - $ref: '#/components/schemas/CommercialCatalogApplication'
            - type: 'null'
        replayed:
          type: boolean

    CommercialConversionRelease:
      type: object
      additionalProperties: false
      required: [id, change_request_id, tenant_id, product_key, governed_subscription_id, plan_id, plan_version_id, held_subscription_ref, state, effective_state, expires_at, intent_id, consumed_at, self_service_subscription_id, converted_at, expired_at, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        change_request_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        product_key: { type: string }
        governed_subscription_id: { type: string, format: uuid }
        plan_id: { type: string, format: uuid }
        plan_version_id: { type: string, format: uuid }
        held_subscription_ref: { type: [string, 'null'] }
        state: { type: string, enum: [RELEASED, CONSUMED, CONVERTED, EXPIRED] }
        effective_state: { type: string, enum: [RELEASED, CONSUMED, CONVERTED, EXPIRED] }
        expires_at: { type: string, format: date-time }
        intent_id: { type: [string, 'null'], format: uuid }
        consumed_at: { type: [string, 'null'], format: date-time }
        self_service_subscription_id: { type: [string, 'null'], format: uuid }
        converted_at: { type: [string, 'null'], format: date-time }
        expired_at: { type: [string, 'null'], format: date-time }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    CommercialConversion:
      type: object
      additionalProperties: false
      required: [direction, status, pending_provider, release, commands, application]
      properties:
        direction: { type: [string, 'null'], enum: [TO_SELF_SERVICE, TO_GOVERNED, null] }
        status: { type: string, enum: [NOT_APPLIED, APPLY_FAILED, RELEASED, CHECKOUT_STARTED, RELEASE_EXPIRED, CONVERTED, PENDING_PROVIDER, COMPLETED] }
        pending_provider:
          type: boolean
          description: True while a provider command of the request is not confirmed by applied provider state (Conv. C-23).
        release:
          oneOf:
            - $ref: '#/components/schemas/CommercialConversionRelease'
            - type: 'null'
        commands:
          type: array
          items:
            $ref: '#/components/schemas/BillingProviderCommand'
        application:
          oneOf:
            - $ref: '#/components/schemas/CommercialChangeApplication'
            - type: 'null'

    CommercialConversionApplyEnvelope:
      type: object
      additionalProperties: false
      required: [request, conversion, replayed]
      properties:
        request:
          $ref: '#/components/schemas/CommercialChangeRequest'
        conversion:
          $ref: '#/components/schemas/CommercialConversion'
        replayed:
          type: boolean

    CommercialConversionStateEnvelope:
      type: object
      additionalProperties: false
      required: [request, conversion]
      properties:
        request:
          $ref: '#/components/schemas/CommercialChangeRequest'
        conversion:
          $ref: '#/components/schemas/CommercialConversion'

    RequestSupportExtension:
      type: object
      additionalProperties: false
      required: [tenant_id, product_key, subscription_id, requested_days, reason, idempotency_key]
      properties:
        tenant_id:
          type: string
          format: uuid
        product_key:
          type: string
          enum: [sign]
        subscription_id:
          type: string
          format: uuid
          description: The open base subscription of the tenant and product the extension overlays.
        requested_days:
          type: integer
          minimum: 1
          maximum: 3650
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 200
          pattern: '^[A-Za-z0-9._:-]+$'

    SupportExtension:
      type: object
      additionalProperties: false
      required: [id, tenant_id, product_key, subscription_id, change_request_id, is_exception, days, grace_until_at_apply, base_until, extends_until, policy_version_id, applied_by, applied_at, removed_at, removed_by, remove_change_request_id]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        product_key:
          type: string
        subscription_id:
          type: string
          format: uuid
        change_request_id:
          type: string
          format: uuid
        is_exception:
          type: boolean
          description: true when applied as a bounded exception (zero approvals); false when approved by Finance.
        days:
          type: integer
        grace_until_at_apply:
          type: [string, 'null']
          format: date-time
        base_until:
          type: string
          format: date-time
        extends_until:
          type: string
          format: date-time
          description: The PAST_DUE row sends until this instant (exclusive), unless removed.
        policy_version_id:
          type: string
          format: uuid
        applied_by:
          type: string
          format: uuid
        applied_at:
          type: string
          format: date-time
        removed_at:
          type: [string, 'null']
          format: date-time
        removed_by:
          type: [string, 'null']
          format: uuid
        remove_change_request_id:
          type: [string, 'null']
          format: uuid
        active:
          type: boolean
          description: Present on the list route — the overlay keeps the row sending now.
        context:
          $ref: '#/components/schemas/SupportExtensionContext'

    SupportExtensionContext:
      type: object
      additionalProperties: false
      description: CCP-B6 (list route only) — what was recorded when the overlay was applied.
      required: [policy_version_number, clause, counters, roles_at_apply]
      properties:
        policy_version_number:
          type: [integer, 'null']
        clause:
          description: The policy clause the decision used (the chain basis of a bounded exception, or the escalation event of an approved one); null when not recorded.
          type: [object, 'null']
          additionalProperties:
            type: integer
        counters:
          description: The decision's counter snapshot; null when not recorded.
          type: [object, 'null']
          additionalProperties:
            type: integer
        roles_at_apply:
          description: The applying actor's role keys at the time (server-side snapshot on the apply audit event).
          type: array
          items:
            type: string

    SupportExtensionSubscription:
      type: object
      additionalProperties: false
      description: CCP-B6 — an open base subscription row of the tenant (the POST names one by id).
      required: [id, product_key, source, status, grace_until, current_period_end]
      properties:
        id:
          type: string
          format: uuid
        product_key:
          type: string
        source:
          type: string
        status:
          type: string
        grace_until:
          type: [string, 'null']
          format: date-time
        current_period_end:
          type: [string, 'null']
          format: date-time

    SupportExtensionPolicy:
      type: object
      additionalProperties: false
      description: CCP-B6 — the ACTIVE commercial policy's support-extension clause and approval window.
      required: [version_id, version_number, clause, approval_expiry_hours]
      properties:
        version_id:
          type: string
          format: uuid
        version_number:
          type: integer
        clause:
          type: object
          additionalProperties:
            type: integer
        approval_expiry_hours:
          type: integer

    SupportExtensionDecision:
      type: object
      additionalProperties: false
      required: [eligible, within_bounds, breaches, eligibility, counters, clause]
      properties:
        eligible:
          type: boolean
          description: CCP-R3 (TD-A8-3 refined) — always true on an outcome; an ineligible request is refused (409 `support_extension_ineligible`), never escalated.
        within_bounds:
          type: boolean
        breaches:
          type: array
          description: The limit breaches (CCP-R3 — eligibility is not a breach; it is a refusal).
          items:
            type: string
            enum: [LENGTH, FREQUENCY, CUMULATIVE]
        eligibility:
          type: array
          items:
            type: string
            enum: [SUBSCRIPTION_NOT_PAST_DUE, REQUESTER_NOT_ATTESTED]
        counters:
          type: object
          additionalProperties: false
          required: [requested_days, extensions_in_frequency_window, cumulative_days_before, cumulative_days_after]
          properties:
            requested_days:
              type: integer
            extensions_in_frequency_window:
              type: integer
            cumulative_days_before:
              type: integer
            cumulative_days_after:
              type: integer
        clause:
          type: object
          additionalProperties:
            type: integer

    SupportExtensionOutcome:
      type: object
      additionalProperties: false
      required: [outcome, replayed, request, extension, application, decision]
      properties:
        outcome:
          type: string
          enum: [APPLIED, ESCALATED]
        replayed:
          type: boolean
        request:
          $ref: '#/components/schemas/CommercialChangeRequest'
        extension:
          oneOf:
            - $ref: '#/components/schemas/SupportExtension'
            - type: 'null'
        application:
          oneOf:
            - $ref: '#/components/schemas/CommercialChangeApplication'
            - type: 'null'
        decision:
          description: null on an idempotent replay.
          oneOf:
            - $ref: '#/components/schemas/SupportExtensionDecision'
            - type: 'null'

    SupportExtensionList:
      type: object
      additionalProperties: false
      required: [extensions, subscriptions, policy]
      properties:
        extensions:
          type: array
          items:
            $ref: '#/components/schemas/SupportExtension'
        subscriptions:
          description: CCP-B6 — the tenant's open base subscription rows (optionally one product).
          type: array
          items:
            $ref: '#/components/schemas/SupportExtensionSubscription'
        policy:
          description: CCP-B6 — the ACTIVE policy's extension clause; null when no valid ACTIVE policy.
          oneOf:
            - $ref: '#/components/schemas/SupportExtensionPolicy'
            - type: 'null'

    CommercialApprovalEnvelope:
      type: object
      additionalProperties: false
      required: [request, approval, apply]
      properties:
        request:
          $ref: '#/components/schemas/CommercialChangeRequest'
        approval:
          $ref: '#/components/schemas/CommercialApproval'
        apply:
          description: |
            CCP-A9 — the role-change apply that follows an approval completing a `ROLE_GRANT`
            / `ROLE_REVOKE` chain; CCP-B5 — the policy activation that follows an approval
            completing a `POLICY_ACTIVATE` chain; null for every other approval. A refused
            apply leaves the request APPROVED with its signatures untouched.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/CommercialRoleChangeApply'

    CommercialRoleChangeApply:
      type: object
      additionalProperties: false
      required: [applied, reason, detail]
      properties:
        applied:
          type: boolean
        reason:
          type: [string, 'null']
          description: |
            null when applied; else APPROVER_NO_LONGER_ELIGIBLE | APPROVER_NOT_DISTINCT |
            APPROVALS_INCOMPLETE | NOT_APPROVED | ROLE_ALREADY_HELD | ROLE_NOT_HELD |
            SUBJECT_NOT_PLATFORM_MEMBER | ROLE_NOT_IN_CATALOG | PLATFORM_LAST_OWNER |
            ATTESTATION_CONFLICT | INTEGRITY | APPLY_ERROR; CCP-B5 (POLICY_ACTIVATE, the NC-5
            snapshot re-check) POLICY_ACTIVE_CHANGED | TARGET_CHANGED | TARGET_NOT_ACTIVATABLE |
            TARGET_NOT_FOUND | TARGET_SNAPSHOT_MISSING | TARGET_MALFORMED.
        detail:
          type: object
          additionalProperties: true

    CommercialChangeRequestListResponse:
      type: object
      additionalProperties: false
      required: [requests, next_cursor]
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/CommercialChangeRequest'
        next_cursor:
          type: [string, 'null']

    CommercialCatalogVersionTerms:
      type: object
      additionalProperties: false
      required: [list_price_minor, currency, billing_interval, sales_model, contract_priced, envelopes_per_month, envelopes_unlimited, envelopes_present, storage_bytes, storage_unlimited, storage_present]
      properties:
        list_price_minor:
          type: [integer, 'null']
          description: Minor units (USD cents); null when contract-priced.
        currency:
          type: [string, 'null']
        billing_interval:
          type: [string, 'null']
        sales_model:
          type: string
        contract_priced:
          type: boolean
        envelopes_per_month:
          type: [integer, 'null']
          description: The monthly `sign.envelopes` allowance; null when unlimited or absent.
        envelopes_unlimited:
          type: boolean
        envelopes_present:
          type: boolean
        storage_bytes:
          type: [integer, 'null']
          description: The `sign.storage_bytes` capacity in bytes; null when unlimited or absent.
        storage_unlimited:
          type: boolean
        storage_present:
          type: boolean

    CommercialCatalogOpenRequest:
      type: object
      additionalProperties: false
      required: [id, action_type, state, expires_at]
      properties:
        id:
          type: string
          format: uuid
        action_type:
          type: string
          enum: [PLAN_VERSION_PUBLISH, PLAN_RETIRE]
        state:
          type: string
        expires_at:
          type: [string, 'null']
          format: date-time

    CommercialCatalogVersion:
      type: object
      additionalProperties: false
      required: [id, plan_id, version_number, status, content_checksum, note, created_by, created_at, published_at, retired_at, terms, pinned_subscriptions, open_requests]
      properties:
        id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        version_number:
          type: integer
        status:
          type: string
          enum: [DRAFT, PUBLISHED, RETIRED]
        content_checksum:
          type: string
        note:
          type: [string, 'null']
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        published_at:
          type: [string, 'null']
          format: date-time
        retired_at:
          type: [string, 'null']
          format: date-time
        terms:
          $ref: '#/components/schemas/CommercialCatalogVersionTerms'
        pinned_subscriptions:
          type: integer
          description: Open BASE subscriptions pinned to this version.
        open_requests:
          type: array
          items:
            $ref: '#/components/schemas/CommercialCatalogOpenRequest'

    CommercialCatalogPlan:
      type: object
      additionalProperties: false
      required: [id, key, product_key, name, status, sales_model, sellable, display_order]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        product_key:
          type: string
          enum: [sign]
        name:
          type: string
        status:
          type: string
        sales_model:
          type: string
        sellable:
          type: boolean
        display_order:
          type: integer

    CommercialCatalog:
      type: object
      additionalProperties: false
      required: [products, publish_chain]
      properties:
        products:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [product_key, plans]
            properties:
              product_key:
                type: string
                enum: [sign]
              plans:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/CommercialCatalogPlan'
                    - type: object
                      required: [versions]
                      properties:
                        versions:
                          type: array
                          items:
                            $ref: '#/components/schemas/CommercialCatalogVersion'
        publish_chain:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [rule, step_role_keys, policy_version_id, policy_version_number, approval_expiry_hours]
              properties:
                rule:
                  type: string
                step_role_keys:
                  type: array
                  items:
                    type: string
                policy_version_id:
                  type: string
                  format: uuid
                policy_version_number:
                  type: integer
                approval_expiry_hours:
                  type: integer

    CommercialCatalogVersionDetail:
      type: object
      additionalProperties: false
      required: [version, plan, content, pinned_tenants]
      properties:
        version:
          $ref: '#/components/schemas/CommercialCatalogVersion'
        plan:
          $ref: '#/components/schemas/CommercialCatalogPlan'
        content:
          type: object
          description: The version's format-1 content document (checksum-verified).
        pinned_tenants:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [tenant_id, name]
            properties:
              tenant_id:
                type: string
                format: uuid
              name:
                type: string

    CommercialCatalogVersionEnvelope:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          $ref: '#/components/schemas/CommercialCatalogVersion'

    CreateCommercialCatalogDraft:
      type: object
      additionalProperties: false
      required: [from_version_id]
      properties:
        from_version_id:
          type: string
          format: uuid
        note:
          type: string
          maxLength: 500

    UpdateCommercialCatalogDraft:
      type: object
      additionalProperties: false
      required: [expected_content_checksum]
      properties:
        expected_content_checksum:
          type: string
          pattern: '^[0-9a-f]{64}$'
        list_price_minor:
          type: integer
          minimum: 0
          maximum: 100000000
        envelopes_per_month:
          type: [integer, 'null']
          minimum: 0
          maximum: 100000000
        storage_bytes:
          type: [integer, 'null']
          minimum: 0
        note:
          type: string
          maxLength: 500

    CommercialChangeRequestDetail:
      type: object
      additionalProperties: false
      required: [request, approvals, is_expired, chain_satisfiable, apply_actionable, steps]
      properties:
        request:
          $ref: '#/components/schemas/CommercialChangeRequest'
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/CommercialApproval'
        is_expired:
          type: boolean
          description: PENDING_APPROVAL past expires_at (it becomes EXPIRED on the next act).
        apply_actionable:
          type: boolean
          description: >-
            CCP-A6-R (TD-B2-3) — the caller may apply this request now: the caller is its requester
            (apply is requester-only in v1), it is APPROVED or APPLY_FAILED, and its action is applied
            by the governed apply, including the CCP-C2 conversion apply (`…/convert`; CCP-B3 C-2).
            A UI hint only; the apply re-checks every condition.
        chain_satisfiable:
          type: [boolean, 'null']
          description: For an open PENDING request, whether independent eligible humans can still fill the remaining steps.
        steps:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [step_index, role_key, scope_keys, status, approval_id, caller]
            properties:
              step_index:
                type: integer
              role_key:
                type: string
              scope_keys:
                type: array
                items:
                  type: string
              status:
                type: string
                enum: [APPROVED, NEXT, WAITING]
              approval_id:
                type: [string, 'null']
                format: uuid
              caller:
                description: The caller's verdict for this step; null once the step is approved.
                oneOf:
                  - type: 'null'
                  - type: object
                    additionalProperties: false
                    required: [eligible, refusal]
                    properties:
                      eligible:
                        type: boolean
                      refusal:
                        type: [string, 'null']
                        enum: [NOT_PENDING, EXPIRED, NOT_HUMAN, SELF_APPROVAL, USER_ALREADY_APPROVED, STEP_SCOPE_MISSING, OUT_OF_ORDER, null]

    PlatformDashboardStatusCount:
      type: object
      additionalProperties: false
      required: [status, count]
      description: A lifecycle status and how many (non-sentinel) tenants hold it.
      properties:
        status:
          $ref: '#/components/schemas/TenantStatus'
        count:
          type: integer
          minimum: 0

    PlatformDashboardOnboardingRow:
      type: object
      additionalProperties: false
      required: [tenant_id, name, created_at, invited]
      description: A PROVISIONED tenant in the onboarding funnel (aged, oldest-first).
      properties:
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        invited:
          type: boolean
          description: Audit-derived — whether a `tenant.owner_invite.sent` has ever been recorded (false = not yet invited).

    PlatformDashboardActivityRow:
      type: object
      additionalProperties: false
      required: [event_type, tenant_id, tenant_name, actor_type, reason_code, created_at]
      description: A recent tenant.* lifecycle event across the estate.
      properties:
        event_type:
          type: string
        tenant_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        tenant_name:
          oneOf:
            - type: string
            - type: 'null'
          description: Resolved tenant display name, or null if the tenant row is gone.
        actor_type:
          type: string
        reason_code:
          oneOf:
            - type: string
            - type: 'null'
          description: Reason code lifted from the event payload, or null when absent.
        created_at:
          type: string
          format: date-time

    PlatformDashboardResponse:
      type: object
      additionalProperties: false
      required: [status_counts, onboarding, recent_activity]
      description: |
        The operator dashboard summary. Counts / ages / statuses / events only
        (R10) — no numeric rating of any tenant. The sentinel platform tenant is
        excluded from `status_counts` (by its fixed UUID).
      properties:
        status_counts:
          type: array
          items:
            $ref: '#/components/schemas/PlatformDashboardStatusCount'
        onboarding:
          type: array
          items:
            $ref: '#/components/schemas/PlatformDashboardOnboardingRow'
        recent_activity:
          type: array
          items:
            $ref: '#/components/schemas/PlatformDashboardActivityRow'

    PlatformMeResponse:
      type: object
      additionalProperties: false
      required: [user_id, email, display_name, tenant_id, tenant_name, role_keys]
      description: The signed-in platform operator's own identity (caller-only; PLATFORM-UX-1 B-1a).
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          oneOf:
            - type: string
            - type: 'null'
        tenant_id:
          type: string
          format: uuid
        tenant_name:
          type: string
        role_keys:
          type: array
          items:
            type: string

    InviteUserRequest:
      type: object
      additionalProperties: false
      required: [email, role_keys]
      properties:
        email:
          type: string
          format: email
        role_keys:
          type: array
          minItems: 1
          items:
            type: string
          description: One or more AUTHZ-1 tenant role keys (constrained to the seed role catalog).
        display_name:
          type: string

    InviteUserResponse:
      type: object
      additionalProperties: false
      required: [tenant_id, user_id, membership_id, role_keys, status]
      properties:
        tenant_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        membership_id:
          type: string
          format: uuid
        role_keys:
          type: array
          items:
            type: string
        status:
          type: string
          # IC-1 PR-1: `membership_added` RETIRED — an existing user owned by
          # another tenant is refused with 409 EMAIL_UNAVAILABLE.
          enum:
            - invitation_sent
            - roles_updated

    ResendOwnerInviteResponse:
      type: object
      additionalProperties: false
      required: [tenant_id, owner_user_id, owner_email, resent]
      properties:
        tenant_id:
          type: string
          format: uuid
        owner_user_id:
          type: string
          format: uuid
        owner_email:
          type: string
          format: email
        resent:
          type: boolean
          const: true

    SuspendTenantRequest:
      type: object
      additionalProperties: false
      required: [reasonCode, reasonText]
      properties:
        reasonCode:
          type: string
          minLength: 1
        reasonText:
          type: string
          minLength: 1

    ReactivateTenantRequest:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
          minLength: 1

    StartOffboardingRequest:
      type: object
      additionalProperties: false
      required: [retentionPolicyCode, closeAt]
      properties:
        retentionPolicyCode:
          type: string
          minLength: 1
          description: Opaque retention-policy string; NO policy semantics run (counsel-gated).
        closeAt:
          type: string
          format: date-time
          description: ISO-8601 effective close date (the retention clock anchor).
        reasonCode:
          type: string
        reasonText:
          type: string

    CloseTenantRequest:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
          minLength: 1
        reasonText:
          type: string

    TenantLifecycleActionResponse:
      type: object
      additionalProperties: false
      required: [tenant_id, from, to, status, changed]
      properties:
        tenant_id:
          type: string
          format: uuid
        from:
          $ref: '#/components/schemas/TenantStatus'
        to:
          $ref: '#/components/schemas/TenantStatus'
        status:
          $ref: '#/components/schemas/TenantStatus'
        changed:
          type: boolean
          description: false when the request was an idempotent no-op (already in the target status).

    ReleaseTenantDomainRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    PromoteTenantDomainRequest:
      type: object
      additionalProperties: false
      required: [evidence_ref]
      properties:
        evidence_ref:
          type: string
          minLength: 1
          maxLength: 500
          description: Reference to the recorded domain-control evidence.

    GrantTenantDomainExceptionRequest:
      type: object
      additionalProperties: false
      required: [justification, evidence_ref]
      properties:
        justification:
          type: string
          minLength: 1
          maxLength: 2000
        evidence_ref:
          type: string
          minLength: 1
          maxLength: 500

    TenantDomainClaim:
      type: object
      additionalProperties: false
      required: [domain, claim, expires_at, reason, exception]
      properties:
        domain:
          type: string
          description: The lower-cased email domain.
        claim:
          type: string
          enum: [PROVISIONAL, AUTHORITATIVE, LAPSED, RELEASED]
        expires_at:
          type: [string, 'null']
          format: date-time
          description: Set for a PROVISIONAL claim (creation + 30 days).
        reason:
          type: [string, 'null']
        exception:
          type: boolean

    TenantDomainException:
      type: object
      additionalProperties: false
      required: [id, domain, justification, evidence_ref, granted_by_user_id, granted_at, revoked_by_user_id, revoked_at]
      properties:
        id:
          type: string
          format: uuid
        domain:
          type: string
        justification:
          type: string
        evidence_ref:
          type: string
        granted_by_user_id:
          type: string
          format: uuid
        granted_at:
          type: string
          format: date-time
        revoked_by_user_id:
          type: [string, 'null']
          format: uuid
        revoked_at:
          type: [string, 'null']
          format: date-time

    TenantDomainResponse:
      type: object
      additionalProperties: false
      required: [tenant_id, domain_claim, exceptions]
      properties:
        tenant_id:
          type: string
          format: uuid
        domain_claim:
          oneOf:
            - $ref: '#/components/schemas/TenantDomainClaim'
            - type: 'null'
        exceptions:
          type: array
          items:
            $ref: '#/components/schemas/TenantDomainException'

    InvitePlatformAdminRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
        role_keys:
          type: array
          minItems: 1
          uniqueItems: true
          description: |
            CCP-A9 — the platform roles of the NEW administrator (PLATFORM_ROLE_KEYS).
            Absent = `[super_admin]`.
          items:
            type: string
            enum: [super_admin, platform_owner, finance_admin, commercial_ops, catalog_manager, support_admin, read_only_auditor]
        human_ref_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: |
            CCP-A9 (D9) — SHA-256 hex of the attested human reference (no PII). Required
            when `role_keys` carries a commercial role; refused otherwise.

