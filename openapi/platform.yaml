  /platform/document-templates/{id}/withdraw:
    post:
      operationId: withdrawPlatformDocumentTemplate
      tags: [Platform Document Templates]
      summary: Publish the withdrawal of an Aramo default (notice, then fallback).
      description: |
        DOC-TEMPLATE-LIB-1 §9 (ADR-0034 D10). Sets `withdraw_notice_at` = now and
        `withdraw_effective_at` = now + `notice_days` (default 7, 0–365). Until the
        effective date the default is still resolved and affected organizations see a
        notice (`GET /v1/document-templates/notices`). From the effective date the
        resolver falls back to the organization's own approved template for the type,
        otherwise the flow refuses with 409 `TEMPLATE_SELECTION_REQUIRED`. Generated
        documents keep their pinned version. Only a published default with no withdrawal
        pending (409 `TEMPLATE_PLATFORM_DEFAULT_CONFLICT`, `details.reason`
        `template_not_published` / `already_withdrawn`). Writes a global audit event
        before the change. Requires `platform:document_template:manage` and a platform
        session.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/PlatformTemplateIdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawPlatformDocumentTemplateRequest'
      responses:
        '200':
          description: The template with its withdrawal dates set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformDocumentTemplate'
        '400':
          $ref: '#/components/responses/PlatformTemplateValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
