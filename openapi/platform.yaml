  /platform/tenants/{tenant_id}/personal/reports:
    get:
      operationId: listPersonalAbuseReports
      tags: [Platform Personal]
      summary: The abuse reports received for a personal account (newest first).
      description: |
        Sign Personal (Free) v1.1 §6.4. The reporter's address is never stored or
        returned (only its domain). Requires scope `platform:tenant:lifecycle:manage`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      responses:
        '200':
          description: Reports.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PersonalAbuseReport'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          description: '`NOT_FOUND` — the tenant is not a personal account.'
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
  /platform/personal-reports/{report_id}/decide:
    post:
      operationId: decidePersonalAbuseReport
      tags: [Platform Personal]
      summary: Record an operator's outcome for one abuse report.
      description: |
        `FALSE_REPORT` lowers that reporter's weight in future reports; `CONFIRMED`
        and `DISMISSED` close the report. A person decides; the reason is stored.
        Restricting or reinstating the account is a separate action.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, reason]
              properties:
                outcome:
                  type: string
                  enum: [CONFIRMED, FALSE_REPORT, DISMISSED]
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '200':
          description: The report after the decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalAbuseReport'
        '400':
          description: '`VALIDATION_ERROR` — an unknown outcome or a missing reason.'
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          description: '`NOT_FOUND` — no such report.'
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    # Duplicated byte-for-byte from openapi/common.yaml per locked invariant 4
    # (duplicate-not-$ref — no cross-document $ref for securitySchemes). If you
    # change either definition, change both together and keep them identical.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAccessAuth:
      type: apiKey
      in: cookie
      name: aramo_access_token

  parameters:
    CommercialChangeRequestId:
      name: id
      in: path
      required: true
      description: The change request's UUID.
      schema:
        type: string
        format: uuid
    CatalogPlanVersionId:
      name: versionId
      in: path
      required: true
      description: The plan version's UUID.
      schema:
        type: string
        format: uuid
    CatalogPlanId:
      name: planId
      in: path
      required: true
      description: The plan's UUID.
      schema:
        type: string
        format: uuid
    TenantIdParam:
      name: tenant_id
      in: path
      required: true
      description: The tenant's UUID.
      schema:
        type: string
        format: uuid
    SkillIdParam:
      name: id
      in: path
      required: true
      description: The canonical Skill UUID.
      schema:
        type: string
        format: uuid
    ProposalIdParam:
      name: id
      in: path
      required: true
      description: The SkillGovernanceProposal UUID.
      schema:
        type: string
        format: uuid
    MatchingPolicyVersionIdParam:
      name: id
      in: path
      required: true
      description: The MatchingPolicyVersion UUID.
      schema:
        type: string
        format: uuid
    PlatformTemplateIdParam:
      name: id
      in: path
      required: true
      description: The PLATFORM DocumentTemplate UUID.
      schema:
        type: string
        format: uuid
    PlatformTemplateVersionIdParam:
      name: versionId
      in: path
      required: true
      description: The TemplateVersion UUID (of a PLATFORM template).
      schema:
        type: string
        format: uuid
    TemplateVariableIdParam:
      name: id
      in: path
      required: true
      description: The TemplateVariable UUID.
      schema:
        type: string
        format: uuid

  responses:
    PersonalCodeError:
      description: |
        `VALIDATION_ERROR` — details.reason `code_invalid` (with
        details.attempts_remaining), `code_expired` or `code_attempts_exceeded`.
        An unknown signup answers `code_invalid`.
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    SignupNotFound:
      description: '`NOT_FOUND` — signup is not enabled, or the link is invalid, expired, superseded or over the rate budget (one answer for all).'
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    # 403 for every platform route: a tenant-tier token (consumer_type ≠
    # platform) or a platform token missing the operation's scope.
    PlatformForbidden:
      description: |
        `INSUFFICIENT_PERMISSIONS` — the token is not a platform-tier token
        (consumer_type ≠ platform, the DDR §13.1 tripwire) or lacks the
        operation's required `platform:*` scope.
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    TenantDomainOk:
      description: The tenant's domain claim and exception history after the action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TenantDomainResponse'
    TenantDomainBadRequest:
      description: '`VALIDATION_ERROR` — a required field is missing or empty, or the tenant has no email domain (details.reason tenant_has_no_domain).'
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    TenantDomainUnavailable:
      description: '`TENANT_DOMAIN_UNAVAILABLE` — another organization holds this email domain (details.reason organization_domain_taken); nothing changed.'
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    PlatformTenantNotFound:
      description: '`NOT_FOUND` — no tenant with this id.'
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    LifecycleActionOk:
      description: The transition result (idempotent no-op when already in the target status).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TenantLifecycleActionResponse'
    LifecycleReasonBadRequest:
      description: |
        `VALIDATION_ERROR` — the DTO shape is invalid (a required non-empty
        `reasonCode`/`reasonText` is missing or empty).
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    IllegalTransition:
      description: |
        `VALIDATION_ERROR` (`details.reason` `illegal_transition`) — the
        requested transition is not legal from the tenant's current status; or a
        reason requirement was unmet (`reason_code_required` /
        `reason_text_required` / `retention_policy_code_required` /
        `close_at_required`).
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    MatchingPolicyValidation:
      description: '`VALIDATION_ERROR` — the evidence_thresholds document is not a complete, well-formed role-family threshold set (`details.errors`).'
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    MatchingPolicyNotFound:
      description: '`NOT_FOUND` — no such matching policy version.'
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    CommercialAuditValidation:
      description: |
        `VALIDATION_ERROR` — a filter is malformed, `from` is not earlier than `to`
        (details.reason `invalid_date_range`), or the cursor is malformed or was
        minted under different filters (details.reason `invalid_cursor`).
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    CommercialUsageValidation:
      description: |
        `VALIDATION_ERROR` — a malformed query, an unregistered metric (details.reason
        `unknown_metric`), or `from` not earlier than `to` (details.reason
        `invalid_date_range`).
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    CommercialUsageNotReconciled:
      description: |
        `USAGE_ROLLUP_NOT_RECONCILED` — the usage roll-ups are read-only until their totals
        reconcile (details.status `NOT_RUN` or `NOT_RECONCILED`, details.mismatch_count,
        details.checked_at). The reconciliation route shows why.
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    BillingOperationsValidation:
      description: |
        `VALIDATION_ERROR` — a filter is malformed, or the cursor is malformed or was
        minted under different filters (details.reason `invalid_cursor`).
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    BillingStatusValidation:
      description: |
        `VALIDATION_ERROR` — a malformed tenant id, a missing or unregistered product_key
        (details.reason `unknown_product`), an invoice_limit outside 1..50
        (details.reason `invalid_limit`), or an unknown query parameter.
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    FinanceReportValidation:
      description: |
        `VALIDATION_ERROR` — a malformed filter (`tenant_id` not a uuid, an unregistered
        `product_key`, `within_days` outside 1..365, or an unknown parameter).
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    FinanceRevenueValidation:
      description: |
        `VALIDATION_ERROR` — an unregistered `product_key`, `months` outside 1..24, or an
        unknown parameter (including `tenant_id`: the route has no per-tenant view).
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    CommercialAlertValidation:
      description: |
        `VALIDATION_ERROR` — a filter is malformed or names an alert type of the other
        family, a metrics route was given a parameter, or the cursor is malformed or was
        minted under different filters (details.reason `invalid_cursor`).
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    CommercialChangeRequestValidation:
      description: |
        `VALIDATION_ERROR` — a malformed body, query or id; an invalid payload for the
        action (details.reason `invalid_payload`); a tenant or product rule
        (details.reason `tenant_product_required`, `unknown_product_key`,
        `tenant_not_found`); an unsupported kind (`kind_not_supported`); or a malformed
        cursor (`invalid_cursor`). CCP-R3: a `PLAN_RETIRE` without `plan_version_id`
        (`plan_version_id_required`: PLAN_RETIRE retires one specified plan version; there is no
        whole-plan retire); a SUPPORT_EXTENSION `EXTEND` on the generic create
        (`support_extension_dedicated_route`).
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    CommercialContractValidation:
      description: '`VALIDATION_ERROR` — a malformed contract id or query parameter.'
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    CommercialSubscriptionsValidation:
      description: '`VALIDATION_ERROR` — a malformed tenant id or an unregistered product_key.'
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    CommercialContractNotFound:
      description: '`NOT_FOUND` — no such contract.'
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    CommercialChangeRequestNotFound:
      description: '`NOT_FOUND` — no such change request.'
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    CommercialChangeRequestConflict:
      description: |
        `COMMERCIAL_CHANGE_REQUEST_CONFLICT` (details.reason `state_invalid`,
        `open_request_exists`, `integrity` or, CCP-R3, `support_extension_ineligible` with
        details.eligibility), `IDEMPOTENCY_KEY_CONFLICT`, or (CCP-A9)
        `PLATFORM_LAST_OWNER` — a `ROLE_REVOKE` of the platform's last effective
        `platform_owner` (details.reason `platform_last_owner`).
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    CommercialApplyConflict:
      description: |
        `COMMERCIAL_CHANGE_REQUEST_CONFLICT` with details.reason `apply_refused` (details.refusal
        NOT_APPROVED | APPROVALS_INCOMPLETE | APPROVER_NOT_DISTINCT | APPROVER_NO_LONGER_ELIGIBLE;
        nothing is written), `apply_failed` (the transaction rolled back in full; the request is
        APPLY_FAILED and retryable; details.failure names the guard, e.g. STRIPE_OWNED,
        TARGET_STALE, PLAN_VERSION_NOT_PUBLISHED, USAGE_EXCEEDS_NEW_LIMIT, USAGE_CROSS_PERIOD,
        RESERVATION_CONFLICT, FUTURE_EFFECTIVE_DATE, VERSION_NOT_DRAFT, VERSION_NOT_PUBLISHED,
        PRICE_PIN_CONFLICT), `apply_expired` (Charter Amendment A1: the apply deadline passed; the
        request is APPLY_EXPIRED), `action_not_applicable` or `integrity`. Every body carries
        details.explanation (operator-facing).
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    CommercialConversionConflict:
      description: |
        `COMMERCIAL_CHANGE_REQUEST_CONFLICT` with details.reason `apply_refused` (details.refusal
        NOT_APPROVED | APPROVER_NO_LONGER_ELIGIBLE | APPLY_EXPIRED | …; nothing is written),
        `apply_failed` (rolled back; the request is APPLY_FAILED and retryable; details.failure e.g.
        TARGET_NOT_GOVERNED, RELEASE_EXISTS, RELEASE_CHECKOUT_OPEN, USAGE_TREATMENT_UNDEFINED,
        FINANCIAL_TREATMENT_UNDEFINED), `action_not_applicable` (not a CONVERSION) or `integrity`.
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    CommercialApprovalRefused:
      description: |
        `COMMERCIAL_APPROVAL_REFUSED` (details.refusal: NOT_PENDING | EXPIRED | NOT_HUMAN |
        SELF_APPROVAL | USER_ALREADY_APPROVED | STEP_SCOPE_MISSING | OUT_OF_ORDER),
        `CCP_NOT_BOOTSTRAPPED` (the chain cannot be fulfilled by independent eligible
        humans; details.unfillable_steps), or `COMMERCIAL_CHANGE_REQUEST_CONFLICT`
        (details.reason `integrity`).
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    CommercialPolicyUnavailable:
      description: '`COMMERCIAL_POLICY_UNAVAILABLE` — no valid commercial policy version (fail closed).'
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    CommercialCatalogValidation:
      description: '`VALIDATION_ERROR` — a malformed id or body (an unknown field, a negative or non-integer term, a malformed checksum).'
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    CommercialCatalogNotFound:
      description: '`NOT_FOUND` — no such plan or plan version in a registered product.'
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    CommercialCatalogConflict:
      description: |
        `COMMERCIAL_CATALOG_CONFLICT` — details.reason `not_draft` (the version is PUBLISHED or
        RETIRED: published versions are immutable), `draft_exists` (the plan already has a
        DRAFT), `stale` (the draft changed since it was read), `plan_mismatch` (the source
        version belongs to another plan), `contract_priced` or `term_missing`.
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    SkillValidation:
      description: '`VALIDATION_ERROR` — a request-shape or lifecycle invariant was violated.'
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    SkillNotFound:
      description: '`NOT_FOUND` — no such skill / alias / version / relationship / proposal.'
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    SkillConflict:
      description: |
        `SKILL_CONFLICT` — a governed canonical write refused on a uniqueness
        constraint (`details.constraint` discriminates normalized_name /
        canonical_name / normalized_alias / normalized_version / source_target_type).
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    SkillProposalNotPending:
      description: '`SKILL_PROPOSAL_NOT_PENDING` — accept/reject addressed a non-PENDING (terminal) proposal.'
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    SkillProposalPayloadInvalid:
      description: '`SKILL_PROPOSAL_PAYLOAD_INVALID` — the accepted proposal payload is not a valid spec for its type.'
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'

    PlatformTemplateValidation:
      description: '`VALIDATION_ERROR` — a request-shape invariant was violated (or the document type is not configurable / not a SYSTEM type).'
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    PlatformTemplateNotFound:
      description: '`TEMPLATE_NOT_FOUND` / `TEMPLATE_VERSION_NOT_FOUND` / `NOT_FOUND` — no such PLATFORM template, version or catalog variable.'
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    PlatformTemplateConflict:
      description: '`TEMPLATE_DRAFT_ALREADY_EXISTS` / `TEMPLATE_IMMUTABLE` / `TEMPLATE_PREVIEW_REQUIRED` / `TEMPLATE_PLATFORM_DEFAULT_CONFLICT` (publish: another default of the type is live — `platform_default_live` — or this default''s withdrawal is in effect — `withdrawal_in_effect`).'
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    PlatformTemplateDefaultConflict:
      description: '`TEMPLATE_PLATFORM_DEFAULT_CONFLICT` — the Aramo default lifecycle write is refused by state (`details.reason`: `template_not_published`, `already_withdrawn`, `not_withdrawn`, `withdrawal_in_effect`, `platform_default_live`).'
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    PlatformTemplateContentRejected:
      description: '`TEMPLATE_BINDING_UNSUPPORTED` (a key outside the catalog, or without a resolver) or `VALIDATION_ERROR` (content rejected by the sanitiser).'
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
    TemplateVariableKeyExists:
      description: '`VALIDATION_ERROR` (`details.reason` `key_exists`) — the catalog already has this key.'
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'

  schemas:
    PersonalAbuseReport:
      type: object
      required: [id, envelope_id, reason, note, reporter_domain, weight, triggered_restriction, outcome, outcome_reason, decided_at, created_at]
      properties:
        id: { type: string, format: uuid }
        envelope_id: { type: string, format: uuid }
        reason: { type: [string, 'null'], enum: [phishing, impersonation, spam, unknown_sender, other, null] }
        note: { type: [string, 'null'] }
        reporter_domain: { type: string }
        weight: { type: number }
        triggered_restriction: { type: boolean }
        outcome: { type: string, enum: [OPEN, CONFIRMED, FALSE_REPORT, DISMISSED] }
        outcome_reason: { type: [string, 'null'] }
        decided_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    SignSignupOrganization:
      type: object
      description: Sign Signup Amendment A1 (LOCKED) — the organization details collected after email confirmation (United States only).
      required: [legal_name, address_line1, city, state_province, postal_code, primary_contact_email, primary_contact_name, signer_title, authority_attested]
      properties:
        legal_name:
          type: string
          minLength: 2
          maxLength: 200
        address_line1:
          type: string
          maxLength: 200
        address_line2:
          type: [string, 'null']
          maxLength: 200
        city:
          type: string
          maxLength: 100
        state_province:
          type: string
          description: USPS code — one of the 50 states or DC (territories and military addresses are refused).
        postal_code:
          type: string
          pattern: '^\d{5}(-\d{4})?$'
        country_code:
          type: string
          enum: [US]
          description: Optional; anything other than US is refused.
        primary_contact_email:
          type: string
          format: email
        primary_contact_name:
          type: string
          maxLength: 100
        signer_title:
          type: string
          maxLength: 100
        primary_contact_phone:
          type: [string, 'null']
          description: Optional US phone; stored as E.164.
        tax_id:
          type: [string, 'null']
          description: Optional EIN (12-3456789).
        registration_number:
          type: [string, 'null']
          maxLength: 50
        authority_attested:
          type: boolean
          description: Must be true — the signer's own attestation that they may act for the organization (not verified authority, not acceptance of terms).
    TenantStatus:
      type: string
      description: The tenant lifecycle status (enforced in app code, not a DB enum).
      enum:
        - PROVISIONED
        - ACTIVE
        - SUSPENDED
        - OFFBOARDING
        - CLOSED

    ProvisionTenantRequest:
      type: object
      additionalProperties: false
      required: [name, owner_email]
      properties:
        name:
          type: string
          minLength: 2
          description: The tenant (workspace) name; unique case-insensitively.
        owner_email:
          type: string
          format: email
          description: The owner's business email; its domain becomes the tenant's locked allowed_domain.
        owner_display_name:
          type: string
          description: Optional owner display name (Cognito 'name' + identity display_name).
        capabilities:
          type: array
          items:
            type: string
          description: >-
            Optional capability set; defaults to {core, ats, portal} when omitted/empty.
            IC-3 PR-7: `core` is always held (added when absent). ATS is not a
            prerequisite — a Sign-only organization is provisioned with
            [core, esign] (no ATS projections); ATS+Sign with
            [core, ats, portal, esign]. ROLES-1 §6: every new tenant's first owner
            receives the organization roles tenant_owner + tenant_admin. Sign sender
            authorization and the product host are separate (PR-8); an esign
            entitlement alone activates nothing.
        invite_owner:
          type: boolean
          default: true
          description: >-
            Send the owner's invitation email now (default true — provision-and-invite).
            When false, create-now-invite-later: the owner's Cognito user is created
            suppressed (no email) and the tenant still lands PROVISIONED; the operator
            sends the invite when ready via POST .../resend-owner-invite. Omitting the
            field preserves the pre-3.4 behavior exactly.
        kind:
          $ref: '#/components/schemas/TenantKind'
        slug:
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$'
          description: >-
            IC-2 PR-4 (F-4) — OPTIONAL subdomain slug (<slug>.aramo.ai). Validated as a
            DNS-safe label (lowercase letters, digits, internal hyphens), refused when
            reserved (400 VALIDATION_ERROR reason invalid_slug / reserved_slug), unique
            across tenants. Never derived from the name; omitted → no subdomain (slug
            null). Host-bound login enforcement requires every tenant that signs in on a
            tenant host to carry a slug.

    TenantKind:
      type: string
      enum: [BUSINESS, PERSONAL]
      description: >-
        IC-4 PR-9 — the tenant kind. BUSINESS (default): an organization whose
        owner's non-personal email domain becomes the locked `allowed_domain`;
        any product set. PERSONAL: a one-person Sign subscriber — an ordinary
        tenant (one owning User, one membership, same identity spine) provisioned
        WITHOUT a locked domain (a personal-provider owner address is allowed;
        `allowed_domain` null), whose capability set is CLOSED to
        [core, esign] (any other requested capability → 400 `VALIDATION_ERROR`
        `details.reason` `personal_tenant_capability_not_allowed`, before any
        Cognito side effect), whose owner receives the organization roles
        `tenant_owner` + `tenant_admin` (ROLES-1 §6; never an ATS product role)
        and for which no ATS projection runs. The Sign sender role is a
        separate governed grant (IC-3 PR-8); ATS/TIP entitlement for a personal
        identity is not provisionable.

    ProvisionTenantResponse:
      type: object
      additionalProperties: false
      required: [tenant_id, tenant_name, tenant_kind, owner_user_id, owner_email, membership_id, capabilities, invitation_sent]
      properties:
        tenant_id:
          type: string
          format: uuid
        tenant_name:
          type: string
        tenant_kind:
          $ref: '#/components/schemas/TenantKind'
        owner_user_id:
          type: string
          format: uuid
        owner_email:
          type: string
          format: email
        membership_id:
          type: string
          format: uuid
        capabilities:
          type: array
          items:
            type: string
        invitation_sent:
          type: boolean
          description: >-
            Whether the owner's invitation email was sent during provisioning
            (true when invite_owner is omitted/true; false on the
            create-now-invite-later path).

    PlatformTenantSummary:
      type: object
      additionalProperties: false
      required: [id, name, kind, slug, status, status_reason_code, status_changed_at, is_active, created_at, activated_at, suspended_at]
      description: The operator list-row shape (lifecycle-triage columns; capability summary lives on the detail read).
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/TenantKind'
        slug:
          oneOf:
            - type: string
            - type: 'null'
        status:
          $ref: '#/components/schemas/TenantStatus'
        status_reason_code:
          oneOf:
            - type: string
            - type: 'null'
        status_changed_at:
          type: string
          format: date-time
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        activated_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        suspended_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'

    PlatformTenantListResponse:
      type: object
      additionalProperties: false
      required: [tenants]
      properties:
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/PlatformTenantSummary'

    TenantDetail:
      type: object
      additionalProperties: false
      required: [id, name, kind, slug, is_active, created_at, updated_at, identity_provider, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/TenantKind'
        slug:
          oneOf:
            - type: string
            - type: 'null'
          description: The tenant's subdomain label (`<slug>.aramo.ai`), or null (PLATFORM-UX-1 B-1b).
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        identity_provider:
          oneOf:
            - type: string
            - type: 'null'
          description: The tenant's pinned Cognito Home-Realm identity_provider, or null (chooser).
        status:
          $ref: '#/components/schemas/TenantStatus'

    TenantDetailResponse:
      type: object
      additionalProperties: false
      required: [tenant]
      properties:
        tenant:
          $ref: '#/components/schemas/TenantDetail'

    PlatformTenantAuditEvent:
      type: object
      additionalProperties: false
      required: [event_type, created_at, actor_type, actor_id, event_payload]
      properties:
        event_type:
          type: string
          description: The tenant.* lifecycle event type.
        created_at:
          type: string
          format: date-time
        actor_type:
          type: string
        actor_id:
          oneOf:
            - type: string
            - type: 'null'
        event_payload:
          type: object
          additionalProperties: true
          description: The raw event payload (before/after status + reason).

    PlatformTenantAuditListResponse:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/PlatformTenantAuditEvent'

    CommercialAuditEvent:
      type: object
      additionalProperties: false
      required: [id, created_at, actor_id, actor_type, actor_role_keys, event_type, is_exception, tenant_id, subject, change_request_id, policy_version_id, payload, correlation_id]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        actor_id:
          type: [string, 'null']
          format: uuid
          description: The acting user; null for a system actor.
        actor_type:
          type: string
          enum: [user, system]
        actor_role_keys:
          type: array
          description: Server-side snapshot of the actor's role keys when the event was recorded.
          items:
            type: string
        event_type:
          type: string
        is_exception:
          type: boolean
          description: True when the event records a bounded exception applied under the active policy.
        tenant_id:
          type: [string, 'null']
          format: uuid
        subject:
          type: string
          description: What the event is about, as `<kind>:<id>`.
        change_request_id:
          type: [string, 'null']
          format: uuid
        policy_version_id:
          type: string
          format: uuid
          description: The commercial policy version in force for the event.
        payload:
          type: object
          additionalProperties: true
          description: |
            The event payload. CCP-R3 (CCP-A1 Amendment A1): a tenant-specific `amount_minor` (a
            CREDIT's chain basis) is sent only with `platform:billing:read` and
            `platform:billing:amount:read`; otherwise it is omitted with
            `amount_withheld: FINANCE_SCOPE_REQUIRED`. The CSV export's `detail` column follows the
            same rule, and its audit event records `amounts: INCLUDED | WITHHELD`.
        correlation_id:
          type: string

    CommercialContractPerson:
      type: object
      additionalProperties: false
      required: [user_id, display_name, email]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
    CommercialContractSubscription:
      type: object
      additionalProperties: false
      description: The governed subscription row the contract references (the authority for state, plan and commitment).
      required: [id, source, status, ended_at, commitment_start, commitment_end, plan, plan_version]
      properties:
        id: { type: string, format: uuid }
        source: { type: string }
        status: { type: string }
        ended_at: { type: [string, 'null'], format: date-time }
        commitment_start: { type: [string, 'null'], format: date-time }
        commitment_end: { type: [string, 'null'], format: date-time }
        plan:
          type: object
          additionalProperties: false
          required: [key, name]
          properties:
            key: { type: string }
            name: { type: string }
        plan_version:
          type: object
          additionalProperties: false
          required: [id, version_number, status]
          properties:
            id: { type: string, format: uuid }
            version_number: { type: integer }
            status: { type: string }
    CommercialContractSummary:
      type: object
      additionalProperties: false
      required: [id, contract_ref, tenant, product_key, status, subscription, provenance, recorded_at]
      properties:
        id: { type: string, format: uuid }
        contract_ref: { type: string }
        tenant:
          type: object
          additionalProperties: false
          required: [id, name, slug]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            slug: { type: [string, 'null'] }
        product_key: { type: string }
        status:
          type: string
          enum: [ACTIVE, ENDED]
          description: Derived from the governed subscription row (never stored on the contract).
        subscription:
          $ref: '#/components/schemas/CommercialContractSubscription'
        provenance:
          type: string
          enum: [CHANGE_REQUEST, MIGRATION]
        recorded_at: { type: string, format: date-time }
    CommercialContractDocument:
      type: object
      additionalProperties: false
      required: [name, sha256, byte_size, media_type, recorded_by, recorded_at, amendment_sequence]
      properties:
        name: { type: string }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        byte_size: { type: [integer, 'null'] }
        media_type: { type: [string, 'null'] }
        recorded_by:
          $ref: '#/components/schemas/CommercialContractPerson'
        recorded_at: { type: string, format: date-time }
        amendment_sequence:
          type: [integer, 'null']
          description: null when recorded with the contract; otherwise the amendment that recorded it.
    CommercialContractAmendment:
      type: object
      additionalProperties: false
      required: [sequence, kind, summary, terms, document_count, evidence_ref, change_request_id, recorded_by, recorded_at]
      properties:
        sequence: { type: integer, minimum: 1 }
        kind:
          type: string
          enum: [AMENDMENT, END]
        summary: { type: string }
        terms:
          type: [array, 'null']
          items: { type: string }
        document_count: { type: integer, minimum: 0 }
        evidence_ref: { type: [string, 'null'] }
        change_request_id: { type: string, format: uuid }
        recorded_by:
          $ref: '#/components/schemas/CommercialContractPerson'
        recorded_at: { type: string, format: date-time }
    CommercialContractDetail:
      allOf:
        - $ref: '#/components/schemas/CommercialContractSummary'
        - type: object
          required: [terms, recorded_terms, evidence_ref, recorded_by, recorded_by_change_request_id, documents, amendments, invoicing]
          properties:
            terms:
              type: array
              items: { type: string }
            recorded_terms:
              type: array
              items: { type: string }
            evidence_ref: { type: [string, 'null'] }
            recorded_by:
              $ref: '#/components/schemas/CommercialContractPerson'
            recorded_by_change_request_id: { type: string, format: uuid }
            documents:
              type: array
              items:
                $ref: '#/components/schemas/CommercialContractDocument'
            amendments:
              type: array
              items:
                $ref: '#/components/schemas/CommercialContractAmendment'
            invoicing:
              type: object
              additionalProperties: false
              required: [enabled, reason]
              properties:
                enabled:
                  type: boolean
                  enum: [false]
                reason:
                  type: string
                  enum: [enterprise_invoicing_choice_pending]
    CommercialContractListResponse:
      type: object
      additionalProperties: false
      required: [contracts]
      properties:
        contracts:
          type: array
          items:
            $ref: '#/components/schemas/CommercialContractSummary'
    CommercialSubscriptionSummary:
      type: object
      additionalProperties: false
      description: CCP-B3 — one latest base subscription (no money; the provider reference is reduced to provider_linked).
      required: [subscription_id, product_key, plan, plan_version, source, status, started_at, ended_at, period_anchor, current_period, current_period_end, grace_until, commitment_end, contract, provider_linked, open_flags, active_extensions]
      properties:
        subscription_id: { type: string, format: uuid }
        product_key: { type: string }
        plan:
          type: object
          additionalProperties: false
          required: [id, key, name, sales_model]
          properties:
            id: { type: string, format: uuid }
            key: { type: string }
            name: { type: string }
            sales_model: { type: string }
        plan_version:
          type: object
          additionalProperties: false
          required: [id, version_number, status]
          properties:
            id: { type: string, format: uuid }
            version_number: { type: integer }
            status: { type: string }
        source: { type: string }
        status: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
        period_anchor: { type: string, format: date-time }
        current_period:
          type: [object, 'null']
          additionalProperties: false
          description: The billing period containing as_of; null for an ended row.
          required: [start, end]
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        current_period_end: { type: [string, 'null'], format: date-time }
        grace_until: { type: [string, 'null'], format: date-time }
        commitment_end: { type: [string, 'null'], format: date-time }
        contract:
          type: [object, 'null']
          additionalProperties: false
          required: [id, contract_ref]
          properties:
            id: { type: string, format: uuid }
            contract_ref: { type: string }
        provider_linked:
          type: boolean
          description: A provider subscription is linked (the reference is not returned here).
        open_flags:
          type: array
          description: Reasons of the tenant's open reconciliation flags attributed to this product (sorted, distinct).
          items: { type: string }
        active_extensions:
          type: object
          additionalProperties: false
          required: [count, exception]
          properties:
            count: { type: integer, minimum: 0 }
            exception:
              type: boolean
              description: Any active extension is a bounded exception.
    CommercialWorkbenchRow:
      type: object
      additionalProperties: false
      description: CCP-B3 — one workbench row (CommercialSubscriptionSummary plus the tenant).
      required: [tenant, subscription_id, product_key, plan, plan_version, source, status, started_at, ended_at, period_anchor, current_period, current_period_end, grace_until, commitment_end, contract, provider_linked, open_flags, active_extensions]
      properties:
        tenant:
          type: object
          additionalProperties: false
          required: [id, name, slug]
          properties:
            id: { type: string, format: uuid }
            name: { type: [string, 'null'] }
            slug: { type: [string, 'null'] }
        subscription_id: { type: string, format: uuid }
        product_key: { type: string }
        plan:
          type: object
          additionalProperties: false
          required: [id, key, name, sales_model]
          properties:
            id: { type: string, format: uuid }
            key: { type: string }
            name: { type: string }
            sales_model: { type: string }
        plan_version:
          type: object
          additionalProperties: false
          required: [id, version_number, status]
          properties:
            id: { type: string, format: uuid }
            version_number: { type: integer }
            status: { type: string }
        source: { type: string }
        status: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
        period_anchor: { type: string, format: date-time }
        current_period:
          type: [object, 'null']
          additionalProperties: false
          description: The billing period containing as_of; null for an ended row.
          required: [start, end]
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        current_period_end: { type: [string, 'null'], format: date-time }
        grace_until: { type: [string, 'null'], format: date-time }
        commitment_end: { type: [string, 'null'], format: date-time }
        contract:
          type: [object, 'null']
          additionalProperties: false
          required: [id, contract_ref]
          properties:
            id: { type: string, format: uuid }
            contract_ref: { type: string }
        provider_linked:
          type: boolean
          description: A provider subscription is linked (the reference is not returned here).
        open_flags:
          type: array
          description: Reasons of the tenant's open reconciliation flags attributed to this product (sorted, distinct).
          items: { type: string }
        active_extensions:
          type: object
          additionalProperties: false
          required: [count, exception]
          properties:
            count: { type: integer, minimum: 0 }
            exception:
              type: boolean
              description: Any active extension is a bounded exception.
    CommercialSubscriptionsResponse:
      type: object
      additionalProperties: false
      required: [as_of, rows]
      properties:
        as_of: { type: string, format: date-time }
        rows:
          type: array
          items:
            $ref: '#/components/schemas/CommercialWorkbenchRow'
    CommercialProductEntitlement:
      type: object
      additionalProperties: false
      required: [capability, state, granted_source, granted_at, granted_by, change_request_id, revoked_at, revoked_by, revoke_change_request_id]
      properties:
        capability: { type: string }
        state:
          type: string
          enum: [ACTIVE, REVOKED, NONE]
          description: NONE when the tenant has no entitlement row for the product.
        granted_source: { type: [string, 'null'] }
        granted_at: { type: [string, 'null'], format: date-time }
        granted_by: { type: [string, 'null'], format: uuid }
        change_request_id: { type: [string, 'null'], format: uuid }
        revoked_at: { type: [string, 'null'], format: date-time }
        revoked_by: { type: [string, 'null'], format: uuid }
        revoke_change_request_id: { type: [string, 'null'], format: uuid }
    CommercialTenantFlag:
      type: object
      additionalProperties: false
      required: [id, reason, provider, subscription_ref, intent_id, detected_at, conversion]
      properties:
        id: { type: string, format: uuid }
        reason: { type: string }
        provider: { type: string }
        subscription_ref: { type: string }
        intent_id: { type: [string, 'null'], format: uuid }
        detected_at: { type: string, format: date-time }
        conversion:
          type: [object, 'null']
          additionalProperties: false
          description: The newest CONVERSION change request of the tenant naming this flag's subscription_ref as held_subscription_ref.
          required: [change_request_id, state, direction]
          properties:
            change_request_id: { type: string, format: uuid }
            state: { type: string }
            direction: { type: [string, 'null'] }
    CommercialTenantOpenRequest:
      type: object
      additionalProperties: false
      required: [id, action_type, kind, state, requested_by, created_at]
      properties:
        id: { type: string, format: uuid }
        action_type: { type: string }
        kind: { type: string }
        state: { type: string }
        requested_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    CommercialTenantProduct:
      type: object
      additionalProperties: false
      required: [product_key, registered, entitlement, subscription, flags, open_request]
      properties:
        product_key:
          type: string
          enum: [sign, ats, portal, intelligence]
        registered:
          type: boolean
          description: The product is in the product registry (v1 holds sign only).
        entitlement:
          $ref: '#/components/schemas/CommercialProductEntitlement'
        subscription:
          oneOf:
            - $ref: '#/components/schemas/CommercialSubscriptionSummary'
            - type: 'null'
        flags:
          type: array
          items:
            $ref: '#/components/schemas/CommercialTenantFlag'
        open_request:
          oneOf:
            - $ref: '#/components/schemas/CommercialTenantOpenRequest'
            - type: 'null'
    CommercialTenantOverviewResponse:
      type: object
      additionalProperties: false
      required: [as_of, tenant, products]
      properties:
        as_of: { type: string, format: date-time }
        tenant:
          type: object
          additionalProperties: false
          required: [id, name, slug, kind]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            slug: { type: [string, 'null'] }
            kind: { type: string }
        products:
          type: array
          items:
            $ref: '#/components/schemas/CommercialTenantProduct'
    CommercialAuditListResponse:
      type: object
      additionalProperties: false
      required: [events, next_cursor]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/CommercialAuditEvent'
        next_cursor:
          type: [string, 'null']
          description: Opaque continuation cursor, or null on the last page.

    UsageCounts:
      type: object
      additionalProperties: false
      required: [consumed, consumed_send, consumed_historical, reserved]
      description: Ledger row counts. consumed = consumed_send + consumed_historical. RELEASED rows are never counted.
      properties:
        consumed:
          type: integer
          minimum: 0
        consumed_send:
          type: integer
          minimum: 0
        consumed_historical:
          type: integer
          minimum: 0
        reserved:
          type: integer
          minimum: 0

    UsageMismatch:
      type: object
      additionalProperties: false
      required: [kind, tenant_id, period_start, expected, actual]
      properties:
        kind:
          type: string
          enum: [PERIOD, DAILY, USAGE_EVENT, ROLLUP_USAGE_EVENT]
        tenant_id:
          type: string
          format: uuid
        period_start:
          type: [string, 'null']
          format: date-time
        expected:
          description: The ledger counts (PERIOD, DAILY) or the raw-event total (USAGE_EVENT, ROLLUP_USAGE_EVENT).
          oneOf:
            - $ref: '#/components/schemas/UsageCounts'
            - type: integer
        actual:
          description: The roll-up counts or total that differ (null when the roll-up row is missing).
          oneOf:
            - $ref: '#/components/schemas/UsageCounts'
            - type: integer
            - type: 'null'

    UsageMetricReconciliation:
      type: object
      additionalProperties: false
      required: [metric_key, product_key, status, watermark, last_run_id, buckets, compared_totals, usage_event, mismatch_count, mismatches]
      properties:
        metric_key:
          type: string
        product_key:
          type: string
        status:
          type: string
          enum: [NOT_RUN, RECONCILED, NOT_RECONCILED]
        watermark:
          type: [string, 'null']
          description: The last run's transaction-id watermark (decimal), or null before the first run.
        last_run_id:
          type: [string, 'null']
          format: uuid
        buckets:
          type: object
          additionalProperties: false
          required: [source, rollup, pending, compared, mismatched]
          properties:
            source:
              type: integer
            rollup:
              type: integer
            pending:
              type: integer
            compared:
              type: integer
            mismatched:
              type: integer
        compared_totals:
          type: object
          additionalProperties: false
          required: [allowance_usage, rollup]
          properties:
            allowance_usage:
              $ref: '#/components/schemas/UsageCounts'
            rollup:
              $ref: '#/components/schemas/UsageCounts'
        usage_event:
          type: object
          additionalProperties: false
          required: [event_type, tenants, mismatched_tenants, allowance_usage_consumed_send, usage_event_quantity]
          properties:
            event_type:
              type: [string, 'null']
            tenants:
              type: integer
            mismatched_tenants:
              type: integer
            allowance_usage_consumed_send:
              type: integer
            usage_event_quantity:
              type: integer
        mismatch_count:
          type: integer
        mismatches:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/UsageMismatch'

    CommercialUsageReconciliation:
      type: object
      additionalProperties: false
      required: [product_key, status, checked_at, metrics]
      properties:
        product_key:
          type: string
        status:
          type: string
          enum: [NOT_RUN, RECONCILED, NOT_RECONCILED]
        checked_at:
          type: string
          format: date-time
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/UsageMetricReconciliation'

    UsagePeriod:
      type: object
      additionalProperties: false
      required: [tenant_id, metric_key, product_key, period_start, period_end, alignment, subscription_id, plan_version_id, included_quantity, unlimited, counts, stale, computed_at]
      properties:
        tenant_id:
          type: string
          format: uuid
        metric_key:
          type: string
        product_key:
          type: string
        period_start:
          type: string
          format: date-time
        period_end:
          type: [string, 'null']
          format: date-time
        alignment:
          type: string
          enum: [ALIGNED, UNALIGNED]
          description: ALIGNED when a BASE subscription's anchor produces the period; UNALIGNED rows are still counted.
        subscription_id:
          type: [string, 'null']
          format: uuid
        plan_version_id:
          type: [string, 'null']
          format: uuid
          description: The plan version in force at period_start.
        included_quantity:
          type: [integer, 'null']
          description: The allowance of that plan version (null when unlimited or not included).
        unlimited:
          type: [boolean, 'null']
        counts:
          $ref: '#/components/schemas/UsageCounts'
        stale:
          type: boolean
          description: A ledger row of this period was written after the last run.
        computed_at:
          type: string
          format: date-time
        days:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [usage_date, counts]
            properties:
              usage_date:
                type: string
                format: date
              counts:
                $ref: '#/components/schemas/UsageCounts'

    CommercialUsagePeriodsResponse:
      type: object
      additionalProperties: false
      required: [product_key, reconciliation, periods, truncated]
      properties:
        product_key:
          type: string
        reconciliation:
          type: object
          additionalProperties: false
          required: [status, checked_at]
          properties:
            status:
              type: string
              enum: [RECONCILED]
            checked_at:
              type: string
              format: date-time
        periods:
          type: array
          items:
            $ref: '#/components/schemas/UsagePeriod'
        truncated:
          type: boolean

    CommercialAuditExportRequest:
      type: object
      additionalProperties: false
      description: CCP-B5 — the same filters as the audit list (ANDed); all optional.
      properties:
        actor_id:
          type: string
          format: uuid
        event_type:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,99}$'
        tenant_id:
          type: string
          format: uuid
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        exception_only:
          type: boolean
        change_request_id:
          type: string
          format: uuid
        product_key:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,39}$'

    CommercialAuditExport:
      type: object
      additionalProperties: false
      required: [export_id, exported_at, row_count, filename, content_type, csv, csv_sha256]
      properties:
        export_id:
          type: string
          format: uuid
          description: The id in the subject of the COMMERCIAL_AUDIT_EXPORTED event.
        exported_at:
          type: string
          format: date-time
        row_count:
          type: integer
          minimum: 0
        filename:
          type: string
        content_type:
          type: string
          enum: [text/csv]
        csv:
          type: string
          description: RFC 4180 CSV (CRLF), every field quoted, formula-safe.
        csv_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'

    CommercialPolicyContent:
      type: object
      additionalProperties: false
      description: A format-1 commercial policy document (basis points, USD minor units, days, hours).
      required: [format_version, currency, discount_escalation_threshold_bps, credit_escalation_threshold_minor, support_extension_max_days, support_extension_frequency_window_days, support_extension_cumulative_max_days, support_extension_cumulative_window_days, approval_expiry_hours, past_due_grace_days]
      properties:
        format_version:
          type: integer
          enum: [1]
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        discount_escalation_threshold_bps:
          type: integer
        credit_escalation_threshold_minor:
          type: integer
        support_extension_max_days:
          type: integer
        support_extension_frequency_window_days:
          type: integer
        support_extension_cumulative_max_days:
          type: integer
        support_extension_cumulative_window_days:
          type: integer
        approval_expiry_hours:
          type: integer
        past_due_grace_days:
          type: integer

    CommercialPolicyVersion:
      type: object
      additionalProperties: false
      required: [id, version_number, status, content, content_checksum, note, created_by, created_at, activated_by, activated_at, retired_at, open_request, latest_request]
      properties:
        id:
          type: string
          format: uuid
        version_number:
          type: integer
        status:
          type: string
          enum: [DRAFT, ACTIVE, RETIRED]
        content:
          description: null when the stored document fails the strict policy parser.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/CommercialPolicyContent'
        content_checksum:
          type: string
          pattern: '^[0-9a-f]{64}$'
        note:
          type: [string, 'null']
        created_by:
          type: [string, 'null']
          format: uuid
        created_at:
          type: string
          format: date-time
        activated_by:
          type: [string, 'null']
          format: uuid
        activated_at:
          type: [string, 'null']
          format: date-time
        retired_at:
          type: [string, 'null']
          format: date-time
        open_request:
          description: |
            The open POLICY_ACTIVATE targeting this version (DRAFT, PENDING_APPROVAL, APPROVED,
            APPLYING or APPLY_FAILED; CCP-B5-R), with the caller's `apply_actionable` hint
            (requester-only; APPROVED or APPLY_FAILED).
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/CommercialOpenRequestRef'
        latest_request:
          description: CCP-B5-R — the most recent POLICY_ACTIVATE targeting this version, in any state (APPLIED, APPLY_EXPIRED, …).
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/CommercialPolicyLatestRequestRef'

    CommercialPolicyLatestRequestRef:
      type: object
      additionalProperties: false
      required: [id, state, applied_at]
      properties:
        id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/CommercialChangeRequestState'
        applied_at:
          type: [string, 'null']
          format: date-time

    CommercialOpenRequestRef:
      type: object
      additionalProperties: true
      required: [id, state]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
        policy_version_id:
          type: string
          format: uuid
        apply_actionable:
          type: boolean
          description: CCP-B5-R — whether the caller may apply this request now (a UI hint; the apply re-checks).

    CommercialPolicyList:
      type: object
      additionalProperties: false
      required: [versions, active_version_id, open_request, caller]
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/CommercialPolicyVersion'
