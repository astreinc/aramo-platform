openapi: 3.1.0
info:
  title: Aramo Platform Console API
  version: 0.0.0
  description: |
    The platform-owner console surface (`apps/platform-admin`, served under
    `/platform/*`). Increment-3 PR-3.2 gives the surface its written contract —
    the console is about to be a production surface (PR-3.3).

    Auth: every operation requires a platform session — a bearer JWT
    (`Authorization: Bearer …`) or the `aramo_access_token` cookie — whose
    `consumer_type` is `platform` AND which carries the per-operation
    `platform:*` scope. A tenant-tier token (consumer_type ∈ {recruiter, portal,
    ingestion}) is refused at every route with 403 `INSUFFICIENT_PERMISSIONS`
    (the DDR §13.1 tier tripwire, app-side); a platform token missing the
    required scope is refused at the scope guard, also 403.

    Error envelope: the nested `{ error: { code, message, details? } }` shape,
    with `code` drawn from the locked registry `ErrorCode` enum in
    `common.yaml` (never duplicated here — error-codes:check enforces enum
    parity against that file specifically).
servers:
  - url: https://admin.aramo.ai
  - url: http://localhost:3002
security:
  - BearerAuth: []
  - CookieAccessAuth: []
tags:
  - name: Platform Tenants
    description: |
      Tenant provisioning, read, and lifecycle management by the platform
      operator. Reads require `platform:tenant:read`; provisioning +
      owner-invitation require `platform:tenant:provision`; the four lifecycle
      transitions require `platform:tenant:lifecycle:manage` (provisioning power
      is deliberately separate from lifecycle power).
  - name: Platform Admins
    description: Platform-administrator invitation (the sentinel platform tenant).
  - name: Sign Self-Service Signup
    description: |
      Aramo Sign launch — the PUBLIC (session-less) BUSINESS signup, served on
      sign.aramo.ai under `/v1/signup/sign/*`. Dark (404) unless
      SIGN_PUBLIC_SIGNUP_ENABLED=1. `start` always answers 202 and emails a
      24-hour link; nothing is provisioned until the link is used. `complete`
      provisions a BUSINESS tenant with capabilities [core, esign] and an
      owner holding the organization roles tenant_owner + tenant_admin
      (ROLES-1 §6; sending still needs a paid subscription to open).
  - name: Sign Personal Signup
    description: |
      Sign Personal (Free) Launch v1.1 (LOCKED) — the PUBLIC Personal signup on
      sign.aramo.ai under `/v1/signup/sign/personal/*`. Dark (404) unless
      SIGN_PERSONAL_SIGNUP_MODE is `invite` or `open` (ships `off`).
  - name: Platform Personal
    description: |
      Sign Personal (Free) Launch v1.1 — the operator review queue, the audited
      clear-review / restrict / reinstate / close actions and pilot invites.
      `platform:tenant:lifecycle:manage`, platform tier only.
  - name: Platform Skill Governance
    description: |
      SKILL-TAX-1F-B2 — the canonical skills-taxonomy administration surface and
      the AI-proposal ratification console. Reads require `platform:skill:read`;
      every mutation and every accept/reject decision requires
      `platform:skill:manage`. Every operation is platform-tier: a tenant-tier
      token is refused with 403 `INSUFFICIENT_PERMISSIONS` (DDR §13.1 tripwire).
      The taxonomy is platform-global — these routes carry NO tenant scoping and
      NO PII; the review queue is counts-only (never a tenant id in a response).
  - name: Platform Matching Policy
    description: |
      ATI-SEP-1 Addendum A2 ruling A-c — the platform-owned matching calibration
      (the role-family evidence thresholds the ATS-side engine applies). Versioned
      and append-only with exactly one ACTIVE version; version 1 is the compiled
      engine defaults. The read requires `platform:matching_policy:read`; creating
      and activating a version require `platform:matching_policy:write`
      (super_admin only). Platform-tier only: a tenant-tier token is refused with
      403 `INSUFFICIENT_PERMISSIONS`. Tenants consume the policy and have no route
      to read or edit it. Platform-global reference data: no tenant scoping, no PII.
  - name: Platform Document Templates
    description: |
      DOC-TEMPLATE-LIB-1 T-2 — Aramo default document templates (PLATFORM owner, no
      tenant) and the Aramo template variable catalog. Reads require
      `platform:document_template:read`; every write requires
      `platform:document_template:manage` (super_admin only). Platform-tier only: a
      tenant-tier token is refused with 403 `INSUFFICIENT_PERMISSIONS`. These are the
      only routes that write PLATFORM template rows or the catalog; PLATFORM rows carry
      no tenant data.
  - name: Platform Commercial Audit
    description: |
      CCP-A2 — the read-only commercial audit feed over the append-only
      CommercialAuditEvent stream (the database rejects UPDATE and DELETE). Requires
      `platform:commercial:audit:read`, held by the platform_owner, finance_admin and
      read_only_auditor commercial roles only; super_admin holds no commercial scope
      and is refused with 403 `INSUFFICIENT_PERMISSIONS`. Platform-tier only.
  - name: Platform Commercial Contracts
    description: |
      CCP-B4 — read-only enterprise contract records (Charter L6: a record of what was
      agreed, not a quoting tool). Requires `platform:subscription:read`, held by the
      platform_owner, finance_admin, commercial_ops, support_admin and read_only_auditor
      commercial roles; catalog_manager and super_admin are refused with 403
      `INSUFFICIENT_PERMISSIONS`. Platform-tier only.
  - name: Platform Commercial Subscriptions
    description: |
      CCP-B3 — the read-only Subscriptions workbench and the tenant Commercial tab: the
      latest base subscription per tenant and product, entitlements with their grant and
      revoke provenance, open reconciliation flags (held activations) with their linked
      conversion request, and the open change request. No money: no price, amount or
      currency is returned. Requires `platform:subscription:read`, held by the
      platform_owner, finance_admin, commercial_ops, support_admin and read_only_auditor
      commercial roles; catalog_manager and super_admin are refused with 403
      `INSUFFICIENT_PERMISSIONS`. Platform-tier only.
  - name: Platform Commercial Billing Operations
    description: |
      CCP-C1 — read-only operator views of the Stripe command outbox (durable,
      idempotent Stripe-owned operations keyed by change request and step) and the
      webhook inbox (the durable receipt of every verified provider event). A command
      stays pending-provider until the provider-confirmed state is applied; failed
      commands and failed inbox events are listed here, never dropped. Requires
      `platform:billing:read` (platform_owner, finance_admin, commercial_ops,
      support_admin, read_only_auditor); catalog_manager and super_admin are refused
      with 403 `INSUFFICIENT_PERMISSIONS`. Platform-tier only. No write route.
  - name: Platform Commercial Billing Status
    description: |
      CCP-C3 — READ-THROUGH invoice and payment status for a tenant's Stripe-owned
      (self-service) subscription, and the billing-portal configuration facts. Aramo
      mirrors provider status only (no ledger, no totals); invoices and payment methods
      stay managed in the Stripe hosted portal. The provider is read through a GET-only
      adapter; nothing is written to Stripe or to Aramo. Disabled states are
      `availability` values, never a 5xx. Invoice amounts (minor units) appear only on
      the billing-status route (a dedicated Finance screen, never the dashboard). Requires
      `platform:billing:read` (platform_owner, finance_admin, commercial_ops,
      support_admin, read_only_auditor); catalog_manager and super_admin are refused
      with 403 `INSUFFICIENT_PERMISSIONS`. Platform-tier only.
  - name: Platform Commercial Finance
    description: |
      CCP-C6 — the dedicated Finance read routes (A0-C6; PLATFORM-UX-1 Amendment A1-4a):
      the renewals queue, outstanding payments and the billing reconciliation report,
      including held activations (Conversion Rule C-8). These are the only platform routes
      that carry a monetary field. Every figure is derived from commercial records: the
      only monetary figure is a plan version's list price per billing interval, in USD
      minor units (the subscription's pinned version; for a held activation the held
      plan's current published version). No amount owed, invoice total or sum is computed
      (invoice status is CCP-C3, not delivered); a non-USD or missing price is withheld
      with `unpriced_reason`. Each report reads one consistent, read-only snapshot.
      CCP-D2 adds the revenue route (MRR, ARR, renewal pipeline by month, derived from the
      commercial records, no ledger); its amounts are returned only with
      `platform:billing:amount:read` (otherwise `amount_withheld: FINANCE_SCOPE_REQUIRED`, CCP-R3).
      Requires `platform:billing:read` (platform_owner, finance_admin, commercial_ops,
      support_admin, read_only_auditor); catalog_manager and super_admin are refused with
      403 `INSUFFICIENT_PERMISSIONS`. Platform-tier only. No write route.
  - name: Platform Commercial Support Extensions
    description: |
      CCP-A8 — the support exception overlay. A support_admin
      (`platform:subscription:support`) extends the sending window of a PAST_DUE
      subscription; within the ACTIVE policy's bounds it applies at once as the only
      zero-approval act (`is_exception: true`), otherwise it escalates to Finance and never
      applies. The subscription row is never written. Listing needs
      `platform:subscription:read`. super_admin holds neither scope (403). Platform-tier only.
  - name: Platform Commercial Observability
    description: |
      CCP-D3 — read-only operator views of the operational alert register (the exception
      register for billing and approval operations) and platform-wide counts-and-states
      metrics. An alert names one subject (a Stripe command, a webhook inbox event, a
      reconciliation flag, a usage metric or a change request) and the condition observed
      on it; it is raised and resolved only by the opt-in alert scanner, which reads the
      source tables and never changes them. No money, no per-tenant figure, no grade.
      Billing-family routes require `platform:billing:read` (platform_owner, finance_admin,
      commercial_ops, support_admin, read_only_auditor); approval-family routes require
      `platform:approval:read` (the six CCP roles). super_admin is refused with 403
      `INSUFFICIENT_PERMISSIONS`. Platform-tier only.
  - name: Platform Commercial Change Requests
    description: |
      CCP-A3 — governed commercial change requests and their distinct-human approvals.
      Every route requires `platform:approval:read` (the 6 CCP commercial roles; never
      super_admin, which is refused with 403 `INSUFFICIENT_PERMISSIONS`). Below that gate
      the server decides: creating a request needs the action's requester scope;
      submit and withdraw are the requester's alone; approve and reject run the approval
      eligibility engine inside the transaction with the caller's roles, scopes and
      one-account-per-human attestation read live (refusals return 409
      `COMMERCIAL_APPROVAL_REFUSED` with `details.refusal` one of NOT_PENDING, EXPIRED,
      NOT_HUMAN, SELF_APPROVAL, USER_ALREADY_APPROVED, STEP_SCOPE_MISSING, OUT_OF_ORDER).
      An approval whose chain cannot be fulfilled by independent eligible humans returns
      409 `CCP_NOT_BOOTSTRAPPED`. The approval chain and the commercial policy version are
      snapshotted when the request is created. Every act is recorded in the commercial
      audit stream. Nothing is applied by these routes. Platform-tier only.
  - name: Platform Commercial Usage
    description: |
      CCP-D1 — usage roll-ups and consumption analytics, derived from the Sign
      allowance ledger (AllowanceUsage) by the opt-in watermark worker
      (`CCP_USAGE_ROLLUP_ENABLED=1`). Read-only. Requires `platform:subscription:read`
      (platform_owner, finance_admin, commercial_ops, support_admin, read_only_auditor);
      catalog_manager and super_admin are refused with 403 `INSUFFICIENT_PERMISSIONS`.
      The roll-ups stay read-only until their totals reconcile exactly to the ledger and
      to the metering raw events: the analytics read is refused with 409
      `USAGE_ROLLUP_NOT_RECONCILED` until then. Counts only; no price, amount or rate.
      Platform-tier only.

  - name: Platform Commercial Catalog
    description: |
      CCP-B2 — the product and plan catalog: the closed product registry (v1: `sign`), its
      plans and every plan version (DRAFT, PUBLISHED, RETIRED) with its terms, the number of
      open subscriptions pinned to each version (grandfathering: a subscription keeps its
      pinned version) and the open publish/retire change requests that target it. Reads
      require `platform:catalog:read` (the 6 CCP commercial roles; never super_admin, which
      is refused with 403 `INSUFFICIENT_PERMISSIONS`). The only writes create and edit a
      DRAFT and require `platform:catalog:draft` (catalog_manager). A PUBLISHED or RETIRED
      version is never edited (409 `COMMERCIAL_CATALOG_CONFLICT`, details.reason
      `not_draft`); a change of terms is a new draft. Publishing and retiring are
      `PLAN_VERSION_PUBLISH` / `PLAN_RETIRE` change requests (Finance → Owner) applied by a
      later slice; these routes never publish, retire or pin. `PLAN_RETIRE` retires one
      specified plan version only (CCP-R3, TD-B2-1); there is no whole-plan retire.
      Platform-tier only.
paths:
  /v1/signup/sign/terms:
    get:
      operationId: getSignSignupTerms
      tags: [Sign Self-Service Signup]
      summary: The terms a signup must accept.
      description: |
        Commercial Plans Amendment A1 — the APPROVED Terms of Service version
        and its published URL, or null while no version is approved (no
        unapproved terms are ever presented for acceptance).
      security: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [terms]
                properties:
                  terms:
                    type: [object, 'null']
                    required: [version, url]
                    properties:
                      version:
                        type: string
                      url:
                        type: string
                        format: uri
        '404':
          $ref: '#/components/responses/SignupNotFound'
  /v1/signup/sign/start:
    post:
      operationId: startSignSignup
      tags: [Sign Self-Service Signup]
      summary: Request a verification link for a new Aramo Sign organization.
      description: |
        Always 202 for a well-formed request with a work address, whatever the
        address's state (an address that already has an Aramo account receives a
        sign-in email instead; an address whose email domain already belongs to an
        organization on Aramo — Domain-Enforcement P3 — receives an "already uses
        Aramo" email and no signup request is stored). Rate-limited per source IP
        and per address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, organization_name]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                organization_name:
                  type: string
                  minLength: 2
                  maxLength: 100
                display_name:
                  type: string
                  maxLength: 100
                accept_terms:
                  type: boolean
                  description: Required true when the operator has configured terms (SIGN_SIGNUP_TERMS_REF).
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted:
                    type: boolean
        '400':
          description: '`VALIDATION_ERROR` — malformed input, a personal or disposable address (details.reason business_email_required), or terms not accepted.'
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SignupNotFound'
  /v1/signup/sign/preview:
    post:
      operationId: previewSignSignup
      tags: [Sign Self-Service Signup]
      summary: Read what a verification link would create (no state change).
      description: |
        Returns the confirmed email and organization name for a valid link so
        the verify page can show them before the owner confirms. Changes nothing.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [email, organization_name, display_name, status]
                properties:
                  email:
                    type: string
                  organization_name:
                    type: string
                  display_name:
                    type: [string, 'null']
                    description: The name given at start (prefills the signer's name; Sign Signup A1).
                  status:
                    type: string
                    enum: [READY, PROVISIONED]
        '404':
          $ref: '#/components/responses/SignupNotFound'
  /v1/signup/sign/address/suggest:
    post:
      operationId: suggestSignSignupAddress
      tags: [Sign Self-Service Signup]
      summary: Search United States addresses for the organization-details step.
      description: |
        Sign Signup Amendment A1 §2.3. Proxied to the configured address provider
        (Geoapify); the provider key never reaches the browser. Requires a live,
        unprovisioned signup link (404 otherwise, and while signup is off). Fails
        open: an unconfigured, slow, rate-limited or failing provider answers
        `available: false` and the page keeps working as plain fields. Results are
        limited to the 50 states + DC; a suggestion is not proof of an address —
        `complete` validates everything again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, text]
              properties:
                token:
                  type: string
                text:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: Suggestions (possibly none).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [available, suggestions, attribution]
                properties:
                  available:
                    type: boolean
                  suggestions:
                    type: array
                    maxItems: 5
                    items:
                      type: object
                      additionalProperties: false
                      required: [label, address_line1, address_line2, city, state_province, postal_code]
                      properties:
                        label:
                          type: string
                        address_line1:
                          type: string
                        address_line2:
                          type: [string, 'null']
                        city:
                          type: string
                        state_province:
                          type: string
                          description: USPS code (50 states + DC).
                        postal_code:
                          type: string
                          description: 5-digit ZIP or ZIP+4; empty when the provider had none.
                  attribution:
                    oneOf:
                      - type: 'null'
                      - type: object
                        required: [label, url]
                        properties:
                          label:
                            type: string
                          url:
                            type: string
                            format: uri
        '404':
          $ref: '#/components/responses/SignupNotFound'
  /v1/signup/sign/complete:
    post:
      operationId: completeSignSignup
      tags: [Sign Self-Service Signup]
      summary: Create the organization from a verification link.
      description: |
        Idempotent per link: a repeat answers the same; a concurrent repeat
        answers PROVISIONING. A taken organization name is a 409 the owner
        resolves by sending another organization_name with the same link.

        Sign Signup Amendment A1 (LOCKED): `organization` (the legal entity, its
        United States registered address — 50 states + DC — the billing contact,
        and the signer's authority attestation) is required before anything is
        created; it is not needed for an already-provisioned link. The
        attestation is the signer's own statement, not verified authority, and
        is never recorded as acceptance of a legal document.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                organization_name:
                  type: string
                  minLength: 2
                  maxLength: 100
                organization:
                  $ref: '#/components/schemas/SignSignupOrganization'
      responses:
        '200':
          description: Provisioned (or provisioning in a concurrent request).
          content:
            application/json:
              schema:
                type: object
                required: [status, email, organization_name, sign_in_url, sign_in]
                properties:
                  status:
                    type: string
                    enum: [PROVISIONED, PROVISIONING]
                  email:
                    type: string
                  organization_name:
                    type: string
                  sign_in_url:
                    type: string
                    format: uri
                  sign_in:
                    type: object
                    description: |
                      Federated sign-in entry points for the owner (no password is
                      issued). Each is the sign host's login with the AUTH-SIGNIN-1
                      `idp` hint; the first permitted provider becomes the
                      organization's sign-in provider.
                    required: [microsoft, google]
                    properties:
                      microsoft:
                        type: string
                        format: uri
                      google:
                        type: string
                        format: uri
        '400':
          description: |
            `VALIDATION_ERROR` — an empty organization_name; details.reason
            `organization_details_invalid` (details.field), `organization_country_not_supported`
            (outside the 50 states + DC) or `authority_attestation_required`.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SignupNotFound'
        '409':
          description: '`TENANT_ALREADY_EXISTS` (details.reason organization_name_taken), `EMAIL_UNAVAILABLE`, or `TENANT_DOMAIN_UNAVAILABLE` (details.reason organization_domain_taken — another organization already holds this email domain; Domain-Enforcement P3).'
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '500':
          description: '`INTERNAL_ERROR` — provisioning failed; retry with the same link (details.retryable).'
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
  /platform/me:
    get:
      operationId: getPlatformMe
      tags: [Platform Admins]
      summary: The signed-in platform operator's own identity.
      description: |
        PLATFORM-UX-1 B-1a — the console chrome's identity read (environment
        bar + account menu). Caller-only: `user_id` is the token subject and
        `tenant_id` the token tenant; there is no path, query, or body input,
        so no other principal is readable through this operation. Read from the
        identity membership: the user's email and display name, the tenant's
        name (display name, else the tenant name), and the caller's active
        role keys in that tenant (sorted). A token whose subject has no
        membership in its tenant → 404.

        Requires scope `platform:tenant:read`; platform tier only.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      responses:
        '200':
          description: The caller's identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformMeResponse'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          description: '`NOT_FOUND` — the token subject has no membership in its tenant.'
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'

  /platform/dashboard:
    get:
      operationId: getPlatformDashboard
      tags: [Platform Tenants]
      summary: Operator dashboard summary.
      description: |
        The platform console's default screen: a single read-only aggregation
        over existing tenant and audit rows — no new event types, columns, or
        migration. Three sections:
          - `status_counts`: tenants per lifecycle status, zero-filled across the
            full status set (a status with no tenants still reports `0`). The
            SENTINEL platform tenant is EXCLUDED — it is infrastructure, not
            estate; the exclusion is by its fixed UUID (there is no flag/column
            for it).
          - `onboarding`: PROVISIONED tenants oldest-first (the "who is stuck"
            list), capped, each with its age anchor (`created_at`) and the
            audit-derived `invited` signal (whether a `tenant.owner_invite.sent`
            has ever been recorded — the not-yet-invited distinction).
          - `recent_activity`: the most recent `tenant.*` lifecycle events across
            ALL tenants, capped, with tenant names resolved and the reason code
            lifted from the event payload.
        Counts, ages, statuses, and events only — never a numeric rating of a
        tenant.

        Requires scope `platform:tenant:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      responses:
        '200':
          description: The dashboard summary envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformDashboardResponse'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'

  /platform/tenants:
    get:
      operationId: listTenants
      tags: [Platform Tenants]
      summary: List all tenants (every status).
      description: |
        The platform-operator estate view: EVERY tenant in EVERY status
        (a suspended tenant is MORE visible to an operator, not less — this is
        the deliberate inverse of the membership-gated session-mint read).
        Optional exact `status` filter and `q` (case-insensitive contains on
        name or slug). Ordered `created_at` descending. The sentinel platform
        tenant appears like any row. No pagination yet (the `{ tenants: [...] }`
        envelope reserves room for it without a breaking change).

        Requires scope `platform:tenant:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Exact lifecycle status filter (one of the TenantStatus values).
          schema:
            $ref: '#/components/schemas/TenantStatus'
        - name: q
          in: query
          required: false
          description: Case-insensitive substring match on tenant name or slug.
          schema:
            type: string
      responses:
        '200':
          description: The tenant list envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTenantListResponse'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
    post:
      operationId: provisionTenant
      tags: [Platform Tenants]
      summary: Provision a tenant and invite its owner.
      description: |
        The existing provision-and-invite flow (the only provisioning path —
        create-without-invite is not offered here): mints the Tenant, seeds its
        entitlements, and invites the tenant owner via the Cognito Pattern-A
        temp-password email as the singular first act. The owner's non-personal
        email domain becomes the tenant's locked `allowed_domain`; a
        personal/disposable domain is refused BEFORE any Cognito side-effect.
        The new tenant lands in status `PROVISIONED`.

        Requires scope `platform:tenant:provision`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionTenantRequest'
      responses:
        '201':
          description: Tenant provisioned; owner invitation sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionTenantResponse'
        '400':
          description: |
            `VALIDATION_ERROR` — request-body invariant violated, e.g. a
            personal/disposable owner email (`details.reason`
            `personal_email_not_allowed`) or a missing/short tenant name.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '409':
          description: |
            `TENANT_ALREADY_EXISTS` — a tenant with this name already exists
            (case-insensitive); or `EMAIL_UNAVAILABLE` — the owner email is
            already registered to a user owned by another tenant (`details` is
            exactly `{}`; IC-1 PR-1 — refused before any Cognito side effect);
            or `TENANT_DOMAIN_UNAVAILABLE` — a BUSINESS organization already
            holds the owner's email domain (`details.reason`
            `organization_domain_taken`; Domain-Enforcement P3 — one organization
            per email domain, refused before any Cognito side effect). Checked in
            the order name → email → domain.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '502':
          description: '`COGNITO_PROVISION_FAILED` — the Cognito AdminCreateUser call failed.'
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'

  /platform/tenants/{tenant_id}:
    get:
      operationId: getTenant
      tags: [Platform Tenants]
      summary: Get a tenant's detail.
      description: |
        Single-tenant detail read (the identity `TenantDto` shape: id, name,
        kind, status, home-realm identity_provider, is_active, timestamps) plus
        the tenant's subdomain `slug` (or null; PLATFORM-UX-1 B-1b, additive).

        Requires scope `platform:tenant:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      responses:
        '200':
          description: The tenant detail envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDetailResponse'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformTenantNotFound'

  /platform/tenants/{tenant_id}/audit:
    get:
      operationId: getTenantAudit
      tags: [Platform Tenants]
      summary: Get a tenant's lifecycle audit timeline.
      description: |
        The tenant's `tenant.*` lifecycle audit events, newest-first, in a
        `{ events: [...] }` envelope. Unlike the tenant-self audit surface
        (which pins tenant_id from the JWT), the operator reads ANY tenant by
        URL id. The raw `event_payload` is surfaced (before→after/reason live
        there) for the FE timeline.

        Requires scope `platform:tenant:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      responses:
        '200':
          description: The audit event list envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTenantAuditListResponse'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformTenantNotFound'

  /platform/tenants/{tenant_id}/sign:
    get:
      operationId: getTenantSignAccount
      tags: [Platform Tenants]
      summary: Read a tenant's Aramo Sign account (operator support view).
      description: |
        Aramo Sign launch — READ-ONLY: the tenant's product capabilities, the
        effective Sign subscription (plan, status, period, grace, cancellation),
        this period's envelope usage, and the 20 most recent billing-provider
        events (type, outcome, times; no payloads). No mutation.

        Requires scope `platform:tenant:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      responses:
        '200':
          description: The tenant's Sign account.
          content:
            application/json:
              schema:
                type: object
                required: [tenant_id, tenant_kind, capabilities, sign_entitled, subscription, allowance, storage, billing_available, billing_events]
                properties:
                  tenant_id:
                    type: string
                    format: uuid
                  tenant_kind:
                    type: string
                  capabilities:
                    type: array
                    items:
                      type: string
                  sign_entitled:
                    type: boolean
                  subscription:
                    type: [object, 'null']
                    description: Same shape as sign.yaml BillingAccount.subscription.
                  allowance:
                    type: object
                    description: Subscribed allowance status (limit — null when unlimited, unlimited, used, remaining, period) or { subscribed false, state }.
                  storage:
                    type: [object, 'null']
                    description: Storage used against the plan (capacity_key, limit — null when not limited, unlimited, used); null without a subscription.
                  billing_available:
                    type: boolean
                  billing_events:
                    type: array
                    items:
                      type: object
                      required: [event_type, outcome, event_created_at, received_at]
                      properties:
                        event_type:
                          type: string
                        outcome:
                          type: string
                          enum: [APPLIED, IGNORED, STALE]
                        detail:
                          type: [string, 'null']
                        event_created_at:
                          type: string
                          format: date-time
                        received_at:
                          type: string
                          format: date-time
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformTenantNotFound'

  /platform/tenants/{tenant_id}/invitations:
    post:
      operationId: inviteUserIntoTenant
      tags: [Platform Tenants]
      summary: Invite a user into a tenant.
      description: |
        Invite a user into an existing tenant with one or more AUTHZ-1 tenant
        roles. The email is normalized (trim + lowercase) before every probe.
        Idempotency (Lead ruling 8, as amended by IC-1 PR-1 — one User, one
        tenant): an existing user + existing membership in THIS tenant with the
        same role set → 409 `INVITATION_ALREADY_EXISTS`; a different role set →
        the membership roles are reconciled (`roles_updated`); an existing user
        with NO membership in this tenant is owned by another tenant → 409
        `EMAIL_UNAVAILABLE` with exactly `details: {}` (no tenant, user, role or
        Cognito ownership detail; the former `membership_added` outcome is
        retired and no second membership is ever created); drift (Cognito has
        the user, identity does not) → identity rows are written against the
        existing sub (`invitation_sent`). An invertible role union is refused
        (400 `VALIDATION_ERROR`, `details.reason` `invertible_role_union`).

        Requires scope `platform:tenant:provision`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteUserRequest'
      responses:
        '201':
          description: User invited / membership reconciled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteUserResponse'
        '400':
          description: |
            `VALIDATION_ERROR` — an unknown `role_key` (rejected at the DTO), an
            invertible role union (`details.reason` `invertible_role_union`), a
            platform-tier role (`details.reason` `platform_role_not_assignable`),
            or an E-Sign product role (`esign_*`) for a tenant that does not hold
            the `sign` capability (`details.reason` `esign_role_not_entitled`,
            `details.missing_capabilities` `["sign"]` — IC-3 PR-8).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '409':
          description: |
            `INVITATION_ALREADY_EXISTS` — the user already holds this membership
            in this tenant with the same role set; or `EMAIL_UNAVAILABLE` — the
            email is already registered to a user owned by another tenant
            (`details` is exactly `{}`; IC-1 PR-1).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '502':
          description: '`COGNITO_PROVISION_FAILED` — the Cognito AdminCreateUser call failed.'
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'

  /platform/tenants/{tenant_id}/resend-owner-invite:
    post:
      operationId: resendOwnerInvite
      tags: [Platform Tenants]
      summary: Send (or re-send) the tenant owner's invitation.
      description: |
        Sends the owner's Cognito Pattern-A invitation email
        (MessageAction=RESEND) — nothing is recreated (same Cognito user, same
        identity rows). This is also the send-when-ready path for a tenant
        provisioned with `invite_owner=false` (create-now-invite-later): RESEND
        delivers the first invitation and mints a fresh temporary password.
        Gated to status `PROVISIONED`: a PROVISIONED tenant's owner has not yet
        accepted (acceptance activates the tenant → ACTIVE), which is exactly the
        window Cognito RESEND is valid — so this refuses on any other status with
        422 `VALIDATION_ERROR` (`details.reason` `tenant_not_provisioned`). Emits
        `tenant.owner_invite.sent` with payload `reason` `first_send` (no prior
        send) or `resend` (a send already occurred).

        Requires scope `platform:tenant:provision`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      responses:
        '200':
          description: Owner invitation re-sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendOwnerInviteResponse'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformTenantNotFound'
        '422':
          description: '`VALIDATION_ERROR` (`details.reason` `tenant_not_provisioned`) — the tenant is not in PROVISIONED status.'
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'

  /platform/tenants/{tenant_id}/suspend:
    post:
      operationId: suspendTenant
      tags: [Platform Tenants]
      summary: Suspend a tenant (ACTIVE → SUSPENDED).
      description: |
        Suspends an ACTIVE tenant. Requires a `reasonCode` AND a `reasonText`
        (both non-empty). Refuses an illegal transition with 422
        `VALIDATION_ERROR` (`details.reason` `illegal_transition`) and emits
        `tenant.lifecycle_transition_rejected`; a request for the current status
        is an idempotent no-op (`changed: false`). New tenant sessions are then
        refused at the mint gate (`TENANT_SUSPENDED`).

        Requires scope `platform:tenant:lifecycle:manage`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendTenantRequest'
      responses:
        '200':
          $ref: '#/components/responses/LifecycleActionOk'
        '400':
          $ref: '#/components/responses/LifecycleReasonBadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformTenantNotFound'
        '422':
          $ref: '#/components/responses/IllegalTransition'

  /platform/tenants/{tenant_id}/reactivate:
    post:
      operationId: reactivateTenant
      tags: [Platform Tenants]
      summary: Reactivate a tenant (SUSPENDED → ACTIVE).
      description: |
        Reactivates a SUSPENDED tenant. Requires a `reasonCode`. Illegal
        transitions → 422 `VALIDATION_ERROR` (`illegal_transition`).

        Requires scope `platform:tenant:lifecycle:manage`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactivateTenantRequest'
      responses:
        '200':
          $ref: '#/components/responses/LifecycleActionOk'
        '400':
          $ref: '#/components/responses/LifecycleReasonBadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformTenantNotFound'
        '422':
          $ref: '#/components/responses/IllegalTransition'

  /platform/tenants/{tenant_id}/start-offboarding:
    post:
      operationId: startOffboarding
      tags: [Platform Tenants]
      summary: Start offboarding a tenant (ACTIVE/SUSPENDED → OFFBOARDING).
      description: |
        Moves a tenant to OFFBOARDING. Requires a `retentionPolicyCode` (an
        opaque string — NO retention policy semantics run; counsel-gated) AND a
        `closeAt` (ISO-8601 date-time, the retention clock anchor). Illegal
        transitions → 422 `VALIDATION_ERROR` (`illegal_transition`).

        Requires scope `platform:tenant:lifecycle:manage`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartOffboardingRequest'
      responses:
        '200':
          $ref: '#/components/responses/LifecycleActionOk'
        '400':
          description: |
            `VALIDATION_ERROR` — the DTO shape is invalid (missing/empty
            `retentionPolicyCode`, or `closeAt` not ISO-8601).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformTenantNotFound'
        '422':
          $ref: '#/components/responses/IllegalTransition'

  /platform/tenants/{tenant_id}/close:
    post:
      operationId: closeTenant
      tags: [Platform Tenants]
      summary: Close a tenant (PROVISIONED/OFFBOARDING → CLOSED, terminal).
      description: |
        Closes a tenant (terminal). Requires a `reasonCode`. Illegal
        transitions → 422 `VALIDATION_ERROR` (`illegal_transition`). New tenant
        sessions are then refused at the mint gate (`TENANT_CLOSED`).

        Requires scope `platform:tenant:lifecycle:manage`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseTenantRequest'
      responses:
        '200':
          $ref: '#/components/responses/LifecycleActionOk'
        '400':
          $ref: '#/components/responses/LifecycleReasonBadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformTenantNotFound'
        '422':
          $ref: '#/components/responses/IllegalTransition'

  /platform/tenants/{tenant_id}/domain:
    get:
      operationId: getTenantDomainClaim
      tags: [Platform Tenants]
      summary: View a tenant's email-domain claim and its shared-domain exceptions.
      description: |
        Domain-Enforcement P3 §6 — the tenant's claim on its email domain
        (`PROVISIONAL | AUTHORITATIVE | LAPSED | RELEASED`, or null for a tenant
        without a domain) and the append-only exception history (newest first).

        Requires scope `platform:tenant:lifecycle:manage`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      responses:
        '200':
          $ref: '#/components/responses/TenantDomainOk'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformTenantNotFound'

  /platform/tenants/{tenant_id}/domain/release:
    post:
      operationId: releaseTenantDomainClaim
      tags: [Platform Tenants]
      summary: Release a tenant's domain claim (audited).
      description: |
        Domain-Enforcement P3 §6 — the only path to `RELEASED`; the tenant keeps
        working and keeps its users and documents, it no longer holds the domain.
        A CLOSED tenant keeps its claim until released. Idempotent on an
        already-released claim. The audit event is written in the same
        transaction. 404 when the tenant has no domain claim.

        Requires scope `platform:tenant:lifecycle:manage`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseTenantDomainRequest'
      responses:
        '200':
          $ref: '#/components/responses/TenantDomainOk'
        '400':
          $ref: '#/components/responses/TenantDomainBadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformTenantNotFound'

  /platform/tenants/{tenant_id}/domain/promote:
    post:
      operationId: promoteTenantDomainClaim
      tags: [Platform Tenants]
      summary: Promote a tenant's domain claim to AUTHORITATIVE with recorded evidence (audited).
      description: |
        Domain-Enforcement P3 §2/§6 — an operator promotion with a reference to
        the recorded domain-control evidence (reason `operator_evidence`). The
        tenant's DNS verification status is not changed. Refused with 409
        `TENANT_DOMAIN_UNAVAILABLE` while another tenant holds the domain
        (nothing changes).

        Requires scope `platform:tenant:lifecycle:manage`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteTenantDomainRequest'
      responses:
        '200':
          $ref: '#/components/responses/TenantDomainOk'
        '400':
          $ref: '#/components/responses/TenantDomainBadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformTenantNotFound'
        '409':
          $ref: '#/components/responses/TenantDomainUnavailable'

  /platform/tenants/{tenant_id}/domain/exception:
    post:
      operationId: grantTenantDomainException
      tags: [Platform Tenants]
      summary: Grant a shared-domain exception (audited).
      description: |
        Domain-Enforcement P3 §1/§6 — records an append-only exception (tenant,
        justification, domain-control evidence reference, operator, time) and
        marks the claim as an exception, so the tenant no longer blocks another
        organization on the same domain. Idempotent while an exception is active.
        404 when the tenant has no domain claim.

        Requires scope `platform:tenant:lifecycle:manage`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantTenantDomainExceptionRequest'
      responses:
        '200':
          $ref: '#/components/responses/TenantDomainOk'
        '400':
          $ref: '#/components/responses/TenantDomainBadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformTenantNotFound'
    delete:
      operationId: revokeTenantDomainException
      tags: [Platform Tenants]
      summary: Revoke a shared-domain exception (audited; fails closed).
      description: |
        Domain-Enforcement P3 §6 — clears the exception in one transaction and
        marks the exception record revoked. If the tenant would then collide with
        another holder of the domain, it is refused with 409
        `TENANT_DOMAIN_UNAVAILABLE` and nothing changes. A no-op when no
        exception is active.

        Requires scope `platform:tenant:lifecycle:manage`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      responses:
        '200':
          $ref: '#/components/responses/TenantDomainOk'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformTenantNotFound'
        '409':
          $ref: '#/components/responses/TenantDomainUnavailable'

  /platform/admins/invitations:
    post:
      operationId: invitePlatformAdmin
      tags: [Platform Admins]
      summary: Invite a platform administrator.
      description: |
        Invites another platform administrator against the PLATFORM Cognito
        pool; the invitee is bound to the sentinel platform tenant with the
        `super_admin` role, or (CCP-A9) the platform roles named in `role_keys`.

        CCP-A9 (Inc-1 Closure Amendment A1 A1-1, A1-5): the invite is an
        ARRIVAL only. An existing platform administrator is refused 409
        `INVITATION_ALREADY_EXISTS` (`details.reason` `existing_platform_admin`)
        whatever the role set; a role grant to an existing administrator is a
        governed `ROLE_GRANT` change request. A commercial role needs
        `human_ref_hash` and an inviter who is an attested `platform_owner`
        (403 `attester_not_platform_owner`); the new administrator's D9
        attestation is recorded with the inviter as attester.

        PLATFORM-UX-1 B-1c — the email's domain must be one of the allowed
        operator domains (`PLATFORM_ADMIN_EMAIL_DOMAINS`, a comma list,
        case-insensitive; default `aramo.ai`). Any other domain is refused 400
        `VALIDATION_ERROR` with `details.reason`
        `platform_admin_domain_not_allowed`, before any Cognito or identity
        side effect.

        Requires scope `platform:admin:invite`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitePlatformAdminRequest'
      responses:
        '201':
          description: Platform administrator invited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteUserResponse'
        '400':
          description: '`VALIDATION_ERROR` — invalid email, or the email domain is not an allowed operator domain (`details.reason` `platform_admin_domain_not_allowed`); CCP-A9: `human_ref_required`, `human_ref_not_applicable`, `human_ref_in_use`, `attestation_not_recorded`.'
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '409':
          description: |
            `INVITATION_ALREADY_EXISTS` — the user is already a platform
            administrator (`details.reason` `existing_platform_admin`, CCP-A9);
            or `EMAIL_UNAVAILABLE` — the
            email is already registered to a user owned by another tenant
            (`details` is exactly `{}`; IC-1 PR-1).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '502':
          description: '`COGNITO_PROVISION_FAILED` — the Cognito AdminCreateUser call failed.'
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'

  # ---- SKILL-TAX-1F-B2 — Platform Skill Governance ------------------------
  /platform/skills:
    get:
      operationId: listPlatformSkills
      tags: [Platform Skill Governance]
      summary: List canonical skills.
      description: 'Platform-global canonical Skill registry (active by default). Requires `platform:skill:read`.'
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - name: include_inactive
          in: query
          required: false
          description: When `true`, also return inactive (deactivated / merged-away) skills.
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: The canonical skill list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillListResponse'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
