  # CCP-C2 (PBD §5.2 row C2; Conversion Rule C-11…C-15, C-23) — governed manual <-> self-service
  # conversion. Served by apps/platform-admin.
  /platform/commercial/change-requests/{id}/convert:
    post:
      operationId: convertPlatformCommercialChangeRequest
      tags: [Platform Commercial Change Requests]
      summary: Apply an APPROVED CONVERSION change request (CCP-C2).
      description: |
        Applies an APPROVED (or APPLY_FAILED, retry) CONVERSION request under the tenant's billing
        lock. REQUESTER-ONLY: the caller must be the request's requester and hold
        `platform:subscription:request`; every approval is re-checked under the request's
        snapshotted chain (NC-5). `TO_SELF_SERVICE` releases exactly one self-service checkout (or one
        held activation) until the approved expiry; the governed subscription ends only when the
        provider-confirmed paid activation is applied. `TO_GOVERNED` records a durable provider cancel
        command and returns `status: PENDING_PROVIDER` with `pending_provider: true`; the governed
        subscription opens only when the provider-confirmed end is applied. Nothing is reported as
        changed at the provider before it is confirmed. Applying an applied or pending request replays
        it (`replayed: true`, nothing written). The route requires `platform:approval:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/CommercialChangeRequestId'
      responses:
        '200':
          description: The request and its conversion state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialConversionApplyEnvelope'
        '400':
          $ref: '#/components/responses/CommercialChangeRequestValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/CommercialChangeRequestNotFound'
        '409':
          $ref: '#/components/responses/CommercialConversionConflict'

  /platform/commercial/change-requests/{id}/conversion:
    get:
      operationId: getPlatformCommercialConversion
      tags: [Platform Commercial Change Requests]
      summary: Read the conversion state of a CONVERSION change request (CCP-C2).
      description: |
        Direction, status, `pending_provider` (true while a provider command of the request is not
        confirmed), the checkout release (with the state a reader sees: an unconsumed release past
        its expiry reads EXPIRED), the provider commands and the application record. Read-only.
        Requires `platform:approval:read`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - $ref: '#/components/parameters/CommercialChangeRequestId'
      responses:
        '200':
          description: The request and its conversion state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialConversionStateEnvelope'
        '400':
          $ref: '#/components/responses/CommercialChangeRequestValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/CommercialChangeRequestNotFound'
        '409':
          $ref: '#/components/responses/CommercialConversionConflict'

  # CCP-A8 (PBD §5.1 row A8; DDR v1.2 §3.2(5); Q7) — the support exception overlay.
  /platform/commercial/support-extensions:
    post:
      operationId: requestPlatformSupportExtension
      tags: [Platform Commercial Support Extensions]
      summary: Request a support extension (applied as a bounded EXCEPTION, or escalated) (CCP-A8).
      description: |
        Requires `platform:subscription:support` (support_admin). Extends the SENDING window of
        the named open base subscription while it is PAST_DUE, as an overlay row; the subscription
        row itself is never written (a Stripe-owned row keeps every column). Under the tenant's
        billing lock the request is decided against the ACTIVE commercial policy: within bounds
        (length ≤ `support_extension_max_days`; no extension in the rolling
        `support_extension_frequency_window_days`; cumulative days in the rolling
        `support_extension_cumulative_window_days` ≤ `support_extension_cumulative_max_days`) it is
        applied at once as a `kind: EXCEPTION` request with zero approvals, and every audit event
        carries `is_exception: true` (`outcome: APPLIED`). A limit breach (LENGTH, FREQUENCY,
        CUMULATIVE) escalates: a NORMAL request is created and submitted for Finance and NOTHING is
        applied (`outcome: ESCALATED`); it is approved and applied through the change-request
        routes. CCP-R3 (TD-A8-3 refined): eligibility is checked first and is a REFUSAL, not an
        escalation — a row that is not PAST_DUE, or a requester without an active D9 attestation,
        is refused with 409 `COMMERCIAL_CHANGE_REQUEST_CONFLICT`, `details.reason:
        support_extension_ineligible` and `details.eligibility` (SUBSCRIPTION_NOT_PAST_DUE,
        REQUESTER_NOT_ATTESTED); exactly one `SUPPORT_EXTENSION_REFUSED_INELIGIBLE` audit event is
        written and nothing is applied or escalated. The generic change-request create refuses a
        SUPPORT_EXTENSION `EXTEND` (400 `support_extension_dedicated_route`).
        Idempotent on `idempotency_key` (a replay returns 200 `replayed: true`).
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestSupportExtension'
      responses:
        '201':
          description: Applied as a bounded exception, or escalated for approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportExtensionOutcome'
        '200':
          description: Idempotent replay of an earlier call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportExtensionOutcome'
        '400':
          $ref: '#/components/responses/CommercialChangeRequestValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '409':
          $ref: '#/components/responses/CommercialChangeRequestConflict'
        '503':
          $ref: '#/components/responses/CommercialPolicyUnavailable'
    get:
      operationId: listPlatformSupportExtensions
      tags: [Platform Commercial Support Extensions]
      summary: List a tenant's support extension overlays (CCP-A8).
      description: 'The overlays of a tenant (optionally one product), newest first, with whether each keeps the row sending now. CCP-B6 adds (read only) each overlay''s recorded `context`, the tenant''s open base `subscriptions` and the ACTIVE `policy` clause (null when no valid ACTIVE policy). Requires `platform:subscription:read`.'
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: product_key
          in: query
          required: false
          schema:
            type: string
            enum: [sign]
      responses:
        '200':
          description: The overlays.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportExtensionList'
        '400':
          $ref: '#/components/responses/CommercialChangeRequestValidation'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'

