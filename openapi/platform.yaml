  /platform/personal-invites:
    post:
      operationId: issuePersonalInvite
      tags: [Platform Personal]
      summary: Issue a one-time pilot invite code bound to one personal email (7 days).
      description: |
        The code is returned ONCE (only its hash is stored). Refused while the
        pilot is at SIGN_PERSONAL_PILOT_CAP. Requires scope
        `platform:tenant:lifecycle:manage`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        '201':
          description: Issued.
          content:
            application/json:
              schema:
                type: object
                required: [code, email, expires_at]
                properties:
                  code:
                    type: string
                  email:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        '400':
          description: '`VALIDATION_ERROR` — details.reason `personal_email_required` or `personal_pilot_full`.'
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
  /platform/tenants/{tenant_id}/personal/clear-review:
    post:
      operationId: clearPersonalReview
      tags: [Platform Personal]
      summary: Approve — clear the review hold (never sets phone assurance).
      description: |
        Audited with the operator and reason. While phone verification is
        unavailable (no SMS provider), clearing review also lifts an outstanding
        phone step (`step_up_required` false, `step_up_cleared_by: review`);
        `phone_verified_at` stays null. Requires scope `platform:tenant:lifecycle:manage`.
      security:
        - BearerAuth: []
        - CookieAccessAuth: []
