  # Aramo-Sign-Personal-Free-Launch-Directive-v1_1 (LOCKED) — the PUBLIC Personal
  # (Free) signup. Every route answers 404 unless SIGN_PERSONAL_SIGNUP_MODE is
  # `invite` or `open` (ships `off`).
  /v1/signup/sign/personal/terms:
    get:
      operationId: getPersonalSignupTerms
      tags: [Sign Personal Signup]
      summary: The exact APPROVED Personal documents a signup must accept.
      description: |
        The Personal Terms of Service, Privacy Notice and Acceptable Use Policy
        (`sign.personal_terms_of_service`, `aramo.privacy_notice`,
        `aramo.acceptable_use_policy`) at their APPROVED versions, or `documents:
        null` while any of them is not APPROVED (then `complete` is refused with
        `legal_documents_not_approved`). A 404 means Personal signup is off.
      security: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents:
                    type: [array, 'null']
                    items:
                      $ref: '#/components/schemas/PersonalTermsDocument'
        '404':
          $ref: '#/components/responses/SignupNotFound'
  /v1/signup/sign/personal/start:
    post:
      operationId: startPersonalSignup
      tags: [Sign Personal Signup]
      summary: Start a Personal (Free) signup and email a 6-digit code.
      description: |
        Validates the email class (personal only), the phone region and the
        declared residence (US or IN; hard checks), the invite (invite mode) and
        the robot check, rates the signup (every signal, the decision and the
        GeoLite2 evidence — country, lookup time, database version — are stored)
        and emails a 6-digit code
        valid for 10 minutes. The network country (offline GeoLite2) is a risk
        signal only, never a refusal by itself: outside the allowed countries adds
        `ip_country_outside` risk points, and an UNKNOWN country (no database, no
        answer or a lookup error) adds `ip_country_unknown`. An address that already has an Aramo account gets
        the same 202 (with a signup_id that never verifies) and an "already
        have an account" email — non-enumerating.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, phone, residence]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                email:
                  type: string
                  format: email
                  maxLength: 254
                phone:
                  type: string
                  description: Mobile number (E.164 or a formattable number).
                residence:
                  type: string
                  enum: [US, IN]
                robot_token:
                  type: [string, 'null']
                  description: The Cloudflare Turnstile token.
                invite_code:
                  type: string
                  description: Required in invite mode.
                hp:
                  type: string
                  description: Honeypot; must be empty.
                elapsed_ms:
                  type: number
                  description: Milliseconds the form was open before submitting.
      responses:
        '202':
          description: Accepted (a code was emailed, or the address already has an account).
          content:
            application/json:
              schema:
                type: object
                required: [signup_id]
                properties:
                  signup_id:
                    type: string
                    format: uuid
        '400':
          description: |
            `VALIDATION_ERROR` — malformed input, or details.reason one of
            `business_email_use_business_signup`, `personal_email_not_allowed`,
            `personal_location_not_supported`, `invite_required`, `invite_invalid`,
            `personal_pilot_full`, `personal_signup_refused`.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SignupNotFound'
  /v1/signup/sign/personal/resend-email:
    post:
      operationId: resendPersonalSignupEmailCode
      tags: [Sign Personal Signup]
      summary: Email a fresh code (after 60 seconds; at most 5 a day).
      description: Always 202; nothing is sent inside the 60-second gap, over the daily limit or for an unknown signup.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalSignupRef'
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted:
                    type: boolean
        '404':
          $ref: '#/components/responses/SignupNotFound'
  /v1/signup/sign/personal/verify-email:
    post:
      operationId: verifyPersonalSignupEmail
      tags: [Sign Personal Signup]
      summary: Prove the email address with its 6-digit code.
      description: |
        `next` is the UI hint from the decision made at start: `terms` (allow),
        `phone` (step-up) or `review`. A held signup (phone / review) still
        continues to terms and complete.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalSignupCode'
      responses:
        '200':
          description: Verified.
          content:
            application/json:
              schema:
                type: object
                required: [next]
                properties:
                  next:
                    type: string
                    enum: [phone, terms, review]
        '400':
          $ref: '#/components/responses/PersonalCodeError'
        '404':
          $ref: '#/components/responses/SignupNotFound'
  /v1/signup/sign/personal/phone/send:
    post:
      operationId: sendPersonalSignupPhoneCode
      tags: [Sign Personal Signup]
      summary: Text a 6-digit code to the signup's phone (step-up).
      description: '`sent: false` when phone verification is unavailable (no SMS provider configured). verify-email then answers `next: review` for a step-up signup, and the account is held for review; an operator clearing that review lifts the phone step without recording phone verification.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalSignupRef'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [sent]
                properties:
                  sent:
                    type: boolean
        '400':
          description: '`VALIDATION_ERROR` — details.reason `personal_code_rate_limited` (60-second gap / 5 a day).'
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SignupNotFound'
  /v1/signup/sign/personal/phone/verify:
    post:
      operationId: verifyPersonalSignupPhone
      tags: [Sign Personal Signup]
      summary: Verify the phone code (phone assurance).
      description: |
        Checks the 6-digit SMS code (10 minutes, 5 tries). A match records phone
        verification on the signup; it is the only path that does. An account held
        for review is never treated as phone-verified.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalSignupCode'
      responses:
        '200':
          description: Verified.
          content:
            application/json:
              schema:
                type: object
                required: [next]
                properties:
                  next:
                    type: string
                    enum: [terms]
        '400':
          $ref: '#/components/responses/PersonalCodeError'
        '404':
          $ref: '#/components/responses/SignupNotFound'
  /v1/signup/sign/personal/complete:
    post:
      operationId: completePersonalSignup
      tags: [Sign Personal Signup]
      summary: Accept the APPROVED documents and create the Personal account.
      description: |
        Creates a PROVISIONED PERSONAL tenant ([core, sign]) and its owner with
        `tenant_owner` only (system provisioning authority), without a Cognito
        user or an ExternalIdentity, enrolled for Google sign-in. No subscription
        and no billing provider are created. The account activates only when the
        owner signs in with the Google account for exactly the verified email.
        `held` reports a review hold or an unmet phone step-up. Idempotent.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signup_id, accept]
              properties:
                signup_id:
                  type: string
                  format: uuid
                accept:
                  type: array
                  items:
                    type: object
                    required: [key, version]
                    properties:
                      key:
                        type: string
                      version:
                        type: string
      responses:
        '200':
          description: Provisioned (or provisioning in a concurrent request).
          content:
            application/json:
              schema:
                type: object
                required: [status, email, sign_in, held]
                properties:
                  status:
                    type: string
                    enum: [PROVISIONED, PROVISIONING]
                  email:
                    type: string
                  sign_in:
                    type: object
                    required: [google]
                    properties:
                      google:
                        type: string
                        format: uri
                  held:
                    type: [string, 'null']
                    enum: [review, phone_verification_required, null]
        '400':
          description: |
            `VALIDATION_ERROR` — details.reason `legal_documents_not_approved`,
            `terms_not_accepted`, `invite_invalid`, `personal_pilot_full` or
            `personal_signup_refused`.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SignupNotFound'
        '409':
          description: '`EMAIL_UNAVAILABLE` — the address already belongs to an Aramo account.'
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '500':
          description: '`INTERNAL_ERROR` — retryable (details.retryable true).'
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'

  # Directive v1.1 §6.5 / §10 — the operator's Personal surface.
  /platform/personal-review:
    get:
      operationId: listPersonalReviewQueue
      tags: [Platform Personal]
      summary: Personal accounts held for review or restricted, with their signals.
      description: Requires scope `platform:tenant:lifecycle:manage`.
      security:
