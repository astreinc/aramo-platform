openapi: 3.1.0
info:
  title: Aramo Native E-Sign Service (DOC-3)
  version: 0.1.0
  description: >
    The ATS-neutral Native E-Sign Service Core (apps/esign-service). The
    `/v1/esign/envelopes` surface is the provider seam apps/api's
    SignatureProviderPort HTTP adapter calls (trusted service-to-service; the
    authoritative tenant_id is supplied by the caller). The `/v1/esign/signing`
    surface is the public signer transport — tenant context is resolved from the
    capability token, never accepted from the client. Transport only: no
    RTR/Submittal/Offer/recruiter-workflow logic (those consume this seam in DOC-5/6).
tags:
  - name: sender
    description: The Aramo Sign API — authenticated workspace, guest signing and billing on the one Sign host (sign.aramo.ai).
  - name: billing
    description: Aramo Sign self-service billing (plans, account, Stripe checkout and portal, provider webhook).
paths:
  /v1/esign/envelopes:
    post:
      operationId: createSignatureEnvelope
      summary: Create a signature envelope (DRAFT) with documents + signers.
      description: Trusted service-to-service; the authoritative tenant_id is supplied by the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvelopeRequest'
      responses:
        '201':
          description: The created envelope summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/esign/envelopes/{id}/send:
    post:
      operationId: sendSignatureEnvelope
      summary: Send the envelope (DRAFT -> SENT); issues signer capability sessions.
      description: Transitions DRAFT to SENT and issues one signing capability session per signer.
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: The updated envelope summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSummary'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/esign/envelopes/for-document:
    get:
      operationId: findEnvelopeForDocument
      summary: Reverse-resolve the single NON-TERMINAL envelope for a document revision (COMM-RECRUITER-W1).
      description: >
        E-Sign owns envelope identity; Documents never store envelope_id. Returns the
        single non-terminal (DRAFT|SENT|IN_PROGRESS) envelope for the exact
        (tenant_id, document_ref, document_revision_ref), or null when none. Fails
        closed with ESIGN_ENVELOPE_AMBIGUOUS (409) when more than one exists.
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: document_ref
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: document_revision_ref
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The single non-terminal envelope, or null.
          content:
            application/json:
              schema:
                type: object
                required: [envelope]
                properties:
                  envelope:
                    oneOf:
                      - $ref: '#/components/schemas/EnvelopeSummary'
                      - type: 'null'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/esign/envelopes/{id}/remind:
    post:
      operationId: remindSignatureEnvelope
      summary: Send a reminder on an already-sent envelope (COMM-RECRUITER-W1); NOT a resend.
      description: >
        Same-envelope reminder for a SENT|IN_PROGRESS envelope. Revokes each
        incomplete signer's prior non-terminal session, issues exactly one new
        session + capability token, records a SIGNATURE_REMINDER_SENT event and a
        NotificationDelivery, and dispatches the reminder link. Never a DRAFT->SENT
        transition and never a new envelope. ESIGN_REMINDER_NOT_ALLOWED (409) when
        the envelope is not remindable.
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id: { type: string, format: uuid }
      responses:
        '200':
          description: The (unchanged-status) envelope summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSummary'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/esign/envelopes/{id}:
    get:
      operationId: getSignatureEnvelope
      summary: Get an envelope summary.
      description: Returns the tenant-scoped envelope summary; a cross-tenant id is a 404.
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The envelope summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSummary'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/esign/envelopes/{id}/void:
    post:
      operationId: voidSignatureEnvelope
      summary: Void an envelope.
      description: Voids a non-terminal envelope with a recorded reason.
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, reason]
              properties:
                tenant_id:
                  type: string
                  format: uuid
                reason:
                  type: string
      responses:
        '200':
          description: The voided envelope summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSummary'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/esign/envelopes/{id}/evidence:
    get:
      operationId: getSignatureEvidence
      summary: Retrieve envelope evidence metadata (event-chain hash + software signature).
      description: Returns evidence metadata (hashes + signature); verifiable independently of signing.
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The evidence summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceSummary'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/esign/envelopes/{id}/executed:
    get:
      operationId: getExecutedArtifacts
      summary: Pull executed document bytes + certificate (base64) for the Documents write-back.
      description: Service-to-service pull for the Documents write-back; bytes are base64 (the event bus carries only refs).
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Executed artifacts (bytes never traverse the event bus).
          content:
            application/json:
              schema:
                type: object
                required: [envelope_id, documents, certificate]
                properties:
                  envelope_id:
                    type: string
                    format: uuid
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        envelope_document_id: { type: string, format: uuid }
                        document_ref: { type: [string, 'null'], format: uuid }
                        document_revision_ref: { type: [string, 'null'], format: uuid }
                        executed_sha256: { type: string }
                        byte_size: { type: integer }
                        executed_base64: { type: string }
                  certificate:
                    type: [object, 'null']
                    properties:
                      certificate_sha256: { type: string }
                      byte_size: { type: integer }
                      certificate_base64: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/esign/signing/exchange:
    post:
      operationId: exchangeSigningToken
      summary: Exchange a raw capability token for an active signing session.
      description: The tenant is resolved server-side from the capability token; the client sends no tenant id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: The resolved signing session context.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                    format: uuid
                  envelope_id:
                    type: string
                    format: uuid
                  signer_id:
                    type: string
                    format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/esign/signing/document:
    post:
      operationId: getSignerDocumentView
      summary: The signer's document view — positioned fields + document metadata.
      description: >-
        PX-V1 F3 — token-authorized, disclosure-gated. Tenant is resolved
        server-side from the capability token; the response carries no tenant id
        and no source bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Document metadata + the signer's positioned fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        document_id: { type: string, format: uuid }
                        title: { type: string }
                        ordinal: { type: integer }
                  fields:
                    type: array
                    items:
                      type: object
                      properties:
                        field_id: { type: string, format: uuid }
                        document_id: { type: string, format: uuid }
                        field_type: { type: string }
                        page_number: { type: integer }
                        x: { type: number }
                        y: { type: number }
                        width: { type: [number, 'null'] }
                        height: { type: [number, 'null'] }
                        required: { type: boolean }
                        filled:
                          type: boolean
                          description: True once this signer has filled the field (lets the signer page restore progress).
                        value:
                          type: [string, 'null']
                          description: The signer's own entered value for their field (typed text, date, or drawn-signature data URL); null otherwise.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Disclosure not yet accepted for this signer.
  /v1/esign/signing/source:
    post:
      operationId: getSignerDocumentSource
      summary: The frozen source PDF bytes for a document in the signing session.
      description: >-
        PX-V1 F3 — token-authorized, disclosure-gated. Bytes are resolved
        mode-agnostically (OWNED → E-Sign object storage, CORE_REF → Documents
        pull) and returned base64; the response carries no tenant id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, document_id]
              properties:
                token: { type: string }
                document_id: { type: string, format: uuid }
      responses:
        '200':
          description: The base64-encoded source PDF plus its content type.
          content:
            application/json:
              schema:
                type: object
                properties:
                  source_base64: { type: string }
                  content_type: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Disclosure not yet accepted for this signer.
  /v1/esign/signing/disclosure-text:
    post:
      operationId: getSignerDisclosureText
      summary: The current server-held electronic-records-and-signature disclosure.
      description: >-
        Aramo Sign launch (A-7) — token-authorized. Returns the current disclosure
        version, its exact text and the sha256 of that text. The signer app shows
        the text and sends the version and hash back to /disclosure, which refuses
        any version E-Sign does not hold or any mismatching hash. No tenant id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: The current disclosure.
          content:
            application/json:
              schema:
                type: object
                required: [disclosure_version, text, text_sha256]
                properties:
                  disclosure_version: { type: string }
                  text: { type: string }
                  text_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The envelope is no longer signable (ENVELOPE_ALREADY_EXECUTED).
  /v1/esign/signing/executed:
    post:
      operationId: getSignerExecutedCopy
      summary: The signer's signed copy of a completed envelope.
      description: >-
        Aramo Sign launch — authorized by the time-limited access token from the
        completion email (not a signing session). Returns the executed document(s)
        and the certificate of completion of a COMPLETED envelope, base64. Only the
        token's hash is stored; tenant is resolved server-side; no tenant id in the
        response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: The signed documents and certificate.
          content:
            application/json:
              schema:
                type: object
                required: [subject, completed_at, documents, certificate_base64]
                properties:
                  subject: { type: string }
                  completed_at: { type: [string, 'null'], format: date-time }
                  documents:
                    type: array
                    items:
                      type: object
                      required: [title, content_type, executed_base64]
                      properties:
                        title: { type: string }
                        content_type: { type: string }
                        executed_base64: { type: string }
                  certificate_base64: { type: [string, 'null'] }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/esign/sender/context:
    get:
      operationId: getSenderContext
      summary: The authenticated sender context (user, tenant, kind, workspace, permissions).
      description: >
        Resolved entirely server-side from the verified esign session. BUSINESS tenants get workspace sign, PERSONAL tenants get workspace personal (sending not enabled). Requires esign:envelope:read.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderContext'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/esign/sender/summary:
    get:
      operationId: getSenderSummary
      summary: Dashboard counts, six-month volume and expiring envelopes.
      description: >
        Counts of sender-authored envelopes by status, completed this month, monthly sent / completed / declined-or-expired for six months, and envelopes expiring within three days. Requires esign:envelope:read.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/esign/sender/envelopes:
    get:
      operationId: listSenderEnvelopes
      summary: List the organization's envelopes visible to the caller.
      description: >
        Filter by tab (all, drafts, waiting, completed, declined, voided, expired), free-text q (subject or recipient), and days (created within). Requires esign:envelope:read. Visibility follows the Sign permission contract — own envelopes, or every envelope of the organization with esign:envelope:read:all. Envelopes sent by another Aramo application (e.g. the ATS) are included and carry source_application; they are read-only here.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/SenderTab'
        - $ref: '#/components/parameters/SenderQuery'
        - $ref: '#/components/parameters/SenderDays'
        - $ref: '#/components/parameters/SenderLimit'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderEnvelopeList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
    post:
      operationId: createSenderEnvelope
      summary: Create a DRAFT envelope.
      description: >
        Creates an empty DRAFT owned by the calling user. Refused for a PERSONAL tenant (personal_sending_not_enabled). Requires esign:envelope:create.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                  maxLength: 200
      responses:
        '201':
          description: The created draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderDraftCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/esign/sender/envelopes/{id}:
    get:
      operationId: getSenderEnvelope
      summary: Envelope detail with documents, recipients and positioned fields.
      description: >
        Field geometry is PDF-native - page_number 0-based, points, bottom-left origin. Requires esign:envelope:read, plus ownership or esign:envelope:read:all. source_application names where the envelope came from; draft changes and send/remind/void need ownership or esign:envelope:manage:all, and an envelope from another application is refused (409 managed_by_source_application).
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderEnvelopeDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateSenderEnvelope
      summary: Rename a DRAFT envelope.
      description: >
        DRAFT only. Requires esign:envelope:create.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              properties:
                subject:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderEnvelopeDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/esign/sender/envelopes/{id}/events:
    get:
      operationId: listSenderEnvelopeEvents
      summary: The envelope hash-chained activity ledger.
      description: >
        Oldest first, with display-safe detail only. Requires esign:envelope:read.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SenderLedgerEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/esign/sender/envelopes/{id}/documents:
    post:
      operationId: uploadSenderDocument
      summary: Upload a PDF to a DRAFT envelope (E-Sign-owned source).
      description: >
        Base64 PDF up to 25 MiB through the safe-PDF pipeline (type, size, encryption and active-content gates), stored as an OWNED source. DRAFT only. Requires esign:envelope:create.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_base64]
              properties:
                filename:
                  type: string
                title:
                  type: string
                content_base64:
                  type: string
      responses:
        '201':
          description: The attached document with its page geometry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderUploadedDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/esign/sender/envelopes/{id}/documents/order:
    put:
      operationId: reorderSenderDocuments
      summary: Reorder the documents of a DRAFT envelope.
      description: >
        The order lists every document id exactly once. DRAFT only. Requires esign:envelope:create.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderEnvelopeDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/esign/sender/envelopes/{id}/documents/{documentId}:
    patch:
      operationId: renameSenderDocument
      summary: Rename a document of a DRAFT envelope.
      description: >
        DRAFT only. Requires esign:envelope:create.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderEnvelopeDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: removeSenderDocument
      summary: Remove a document (and its fields) from a DRAFT envelope.
      description: >
        DRAFT only. Requires esign:envelope:create.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderEnvelopeDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/esign/sender/envelopes/{id}/documents/{documentId}/source:
    get:
      operationId: getSenderDocumentSource
      summary: The frozen source PDF bytes.
      description: >
        For the prepare editor and preview. Requires esign:envelope:read.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: OK.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/esign/sender/envelopes/{id}/recipients:
    put:
      operationId: replaceSenderRecipients
      summary: Replace the recipients of a DRAFT envelope.
      description: >
        Keeps listed existing ids, creates new recipients, deletes the rest with their fields. All recipients sign in parallel. DRAFT only. Requires esign:envelope:create.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipients]
              properties:
                recipients:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [name, email]
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      email:
                        type: string
                        format: email
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderEnvelopeDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/esign/sender/envelopes/{id}/fields:
    put:
      operationId: replaceSenderFields
      summary: Replace the positioned fields of a DRAFT envelope.
      description: >
        Each field box must lie inside its real source page. PDF-native geometry. DRAFT only. Requires esign:envelope:create.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              properties:
                fields:
                  type: array
                  maxItems: 500
                  items:
                    $ref: '#/components/schemas/SenderFieldInput'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderEnvelopeDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/esign/sender/envelopes/{id}/send:
    post:
      operationId: sendSenderEnvelope
      summary: Send a DRAFT envelope for signature.
      description: >
        Requires at least one document, one recipient and a SIGNATURE field per recipient; issues signer capability sessions and emails each signer a secure link. Requires esign:envelope:send.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderEnvelopeDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/esign/sender/envelopes/{id}/remind:
    post:
      operationId: remindSenderEnvelope
      summary: Send a reminder to every incomplete signer.
      description: >
        Same envelope; prior links are revoked and a fresh link is emailed. Requires esign:envelope:send.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderEnvelopeDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/esign/sender/envelopes/{id}/void:
    post:
      operationId: voidSenderEnvelope
      summary: Void a non-terminal envelope.
      description: >
        A reason is required. Requires esign:envelope:send.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderEnvelopeDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/esign/sender/envelopes/{id}/executed:
    get:
      operationId: getSenderExecutedDocuments
      summary: Executed documents and the execution certificate (base64).
      description: >
        COMPLETED envelopes only. Requires esign:envelope:read.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/esign/sender/envelopes/{id}/evidence:
    get:
      operationId: getSenderEnvelopeEvidence
      summary: The signed evidence summary.
      description: >
        Requires esign:envelope:read.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/EnvelopeId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/esign/sender/documents:
    get:
      operationId: listSenderDocuments
      summary: Documents across sender-authored envelopes.
      description: >
        Requires esign:envelope:read.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/esign/sender/contacts:
    get:
      operationId: listSenderContacts
      summary: Past recipients (derived; no contact store).
      description: >
        Requires esign:contact:read (Sign Sender, Admin, Owner).
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/esign/sender/members:
    get:
      operationId: listSignMembers
      summary: Organization members and their Sign role.
      description: >
        Requires esign:member:manage (Sign Admin, Owner). BUSINESS tenants only (PERSONAL → 403 personal_account). Lists every member of the caller's organization with the Sign role they hold (or null), plus the assignable Sign roles.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignMemberList'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/esign/sender/members/{userId}/sign-role:
    put:
      operationId: setSignMemberRole
      summary: Assign, change or remove a member's Sign role.
      description: >
        Requires esign:member:manage. Changes ONLY the member's Sign role; every other role is kept. Only a Sign Owner may grant or remove the Sign Owner role (403 owner_role_requires_owner). The last Sign Owner cannot be removed or demoted (409 ESIGN_LAST_OWNER). A user outside the caller's organization → 404.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sign_role]
              properties:
                sign_role:
                  type: [string, 'null']
                  enum: [esign_owner, esign_admin, esign_sender, esign_viewer, null]
      responses:
        '200':
          description: The member after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/esign/sender/activity:
    get:
      operationId: listSenderActivity
      summary: Tenant-wide envelope activity (newest first).
      description: >
        Requires esign:envelope:read.
      tags: [sender]
      security:
        - senderSession: []
        - senderBearer: []
      parameters:
        - $ref: '#/components/parameters/SenderLimit'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SenderLedgerEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/esign/billing/plans:
    get:
      operationId: listBillingPlans
      summary: Sellable Aramo Sign plans and their included allowances.
      description: >
        Prices are held by the billing provider and shown on its checkout page. purchasable is false when online billing is not configured. Requires the esign consumer and the tenant esign capability.
      tags: [billing]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [plans, terms, sales_contact_url]
                properties:
                  plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/BillingPlan'
                  terms:
                    type: [object, 'null']
                    description: The APPROVED Terms of Service a checkout must accept (version, url); null while none is approved.
                  sales_contact_url:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/esign/billing/account:
    get:
      operationId: getBillingAccount
      summary: The organization's Aramo Sign plan, subscription status, period and usage.
      description: >
        Backend-authoritative. Requires esign:envelope:read or tenant:admin:settings. can_manage_billing is true for a BUSINESS tenant principal holding tenant:admin:settings.
      tags: [billing]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccount'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
  /v1/esign/billing/checkout:
    post:
      operationId: startBillingCheckout
      summary: Start a Stripe Checkout session for a sellable plan.
      description: >
        Requires tenant:admin:settings in a BUSINESS tenant. Return URLs are built by the server. The subscription opens only when the verified provider webhook (or reconciliation) confirms it; the subscribing user then receives esign_owner if they hold organization authority.
      tags: [billing]
      security:
        - senderSession: []
        - senderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_key]
              properties:
                plan_key:
                  type: string
                  maxLength: 100
                accept_terms:
                  type: boolean
                  description: Required true when an approved Terms of Service version exists.
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingRedirect'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '409':
          $ref: '#/components/responses/BillingConflict'
        '503':
          $ref: '#/components/responses/BillingUnavailable'
  /v1/esign/billing/portal:
    post:
      operationId: openBillingPortal
      summary: Open the Stripe billing portal (payment method, invoices, cancellation).
      description: Requires tenant:admin:settings.
      tags: [billing]
      security:
        - senderSession: []
        - senderBearer: []
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingRedirect'
        '401':
          $ref: '#/components/responses/SenderUnauthorized'
        '403':
          $ref: '#/components/responses/SenderForbidden'
        '409':
          $ref: '#/components/responses/BillingConflict'
        '503':
          $ref: '#/components/responses/BillingUnavailable'
  /v1/esign/billing/webhook/stripe:
    post:
      operationId: receiveStripeBillingWebhook
      summary: Stripe webhook receiver.
      description: >
        No session. Authenticity is the Stripe-Signature header (HMAC-SHA256 over the raw body, 300 second tolerance). Each event is processed at most once; the subscription state is re-fetched from Stripe before it is applied. A processing failure returns 5xx so Stripe redelivers.
      tags: [billing]
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Received.
          content:
            application/json:
              schema:
                type: object
                required: [received, outcome]
                properties:
                  received:
                    type: boolean
                  outcome:
                    type: string
                    enum: [APPLIED, IGNORED, DUPLICATE]
        '401':
          description: The signature is missing, stale or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/BillingUnavailable'
components:
  securitySchemes:
    senderSession:
      type: apiKey
      in: cookie
      name: aramo_access_token_esign
      description: The HttpOnly esign consumer session cookie (sent with X-Aramo-Consumer esign).
    senderBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The shared auth-service access token for the esign consumer.
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      description: The envelope document id (UUID).
      schema:
        type: string
        format: uuid
    SenderTab:
      name: tab
      in: query
      required: false
      description: Status tab.
      schema:
        type: string
        enum: [all, drafts, waiting, completed, declined, voided, expired]
    SenderQuery:
      name: q
      in: query
      required: false
      description: Free text matched against subject and recipient name or email.
      schema:
        type: string
    SenderDays:
      name: days
      in: query
      required: false
      description: Only envelopes created within this many days.
      schema:
        type: integer
        minimum: 1
    SenderLimit:
      name: limit
      in: query
      required: false
      description: Maximum rows.
      schema:
        type: integer
        minimum: 1
        maximum: 500
    EnvelopeId:
      name: id
      in: path
      required: true
      description: The signature envelope id (UUID).
      schema:
        type: string
        format: uuid
  responses:
    SenderUnauthorized:
      description: No valid esign session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SenderForbidden:
      description: Not the esign consumer, the tenant lacks the esign capability, the scope is missing, or a PERSONAL tenant attempted a write.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The envelope was not found in the caller's tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: An illegal envelope transition.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: The signing capability token is invalid or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BillingConflict:
      description: ESIGN_BILLING_CONFLICT — already subscribed, or no billing account yet (details.reason).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BillingUnavailable:
      description: ESIGN_BILLING_UNAVAILABLE — online billing is not configured or the provider is unreachable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    BillingPlan:
      type: object
      description: A catalog plan (Commercial Plans Amendment A1). Prices are display values in minor units; the charge is the provider price. reference_price is present only when substantiated.
      required: [key, name, sales_model, status, price, reference_price, commitment_months, eligibility, eligible, allowances, capacities, features, purchasable]
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        tenant_kind:
          type: [string, 'null']
        sales_model:
          type: string
          enum: [SELF_SERVICE, FREE, CONTACT_SALES, OPERATOR]
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        price:
          type: [object, 'null']
          properties:
            amount_minor:
              type: integer
            currency:
              type: string
            interval:
              type: [string, 'null']
        reference_price:
          type: [object, 'null']
          properties:
            amount_minor:
              type: integer
            currency:
              type: string
        commitment_months:
          type: [integer, 'null']
        eligibility:
          type: [string, 'null']
        eligible:
          type: boolean
        support_tier:
          type: [string, 'null']
        activation_note:
          type: [string, 'null']
        allowances:
          type: array
          items:
            type: object
            required: [allowance_key, included_quantity, unlimited, period, available]
            properties:
              allowance_key:
                type: string
              included_quantity:
                type: [integer, 'null']
              unlimited:
                type: boolean
              period:
                type: string
                enum: [MONTHLY]
              available:
                type: boolean
                description: The capability is built and operational (an entitlement that is not available is never advertised).
        capacities:
          type: array
          items:
            type: object
            required: [capacity_key, limit, unlimited, available]
            properties:
              capacity_key:
                type: string
              limit:
                type: [integer, 'null']
              unlimited:
                type: boolean
              available:
                type: boolean
        features:
          type: array
          items:
            type: object
            required: [feature_key, enabled, available]
            properties:
              feature_key:
                type: string
              enabled:
                type: boolean
                description: Included by the plan (entitlement).
              available:
                type: boolean
                description: Built and operational (launch availability).
        purchasable:
          type: boolean
    BillingAccount:
      type: object
      required: [subscription, allowance, storage, billing_available, tenant_kind, self_service_eligible, can_manage_billing]
      properties:
        subscription:
          type: [object, 'null']
          required: [plan_key, plan_name, source, status, sending, started_at, cancel_at_period_end, billing_managed]
          properties:
            plan_key:
              type: string
            plan_name:
              type: string
            source:
              type: string
              enum: [MANUAL, DEVELOPMENT, SELF_SERVICE]
            status:
              type: string
              enum: [TRIALING, ACTIVE, PAST_DUE, CANCELED, INCOMPLETE]
            sending:
              type: boolean
            started_at:
              type: string
              format: date-time
            ended_at:
              type: [string, 'null']
              format: date-time
            current_period_end:
              type: [string, 'null']
              format: date-time
            cancel_at_period_end:
              type: boolean
            grace_until:
              type: [string, 'null']
              format: date-time
            billing_managed:
              type: boolean
            commitment_months:
              type: [integer, 'null']
            commitment_end:
              type: [string, 'null']
              format: date-time
            cancel_requested_within_commitment:
              type: boolean
            eligibility_state:
              type: [string, 'null']
              enum: [OK, LAPSED, null]
            list_price:
              type: [object, 'null']
            features:
              type: array
              items:
                type: object
            export_access_until:
              type: [string, 'null']
              format: date-time
        allowance:
          type: object
          description: Subscribed allowance status (limit — null when unlimited, unlimited, used, remaining — null when unlimited, period_start, period_end, threshold) or { subscribed false, state }.
        storage:
          type: [object, 'null']
          description: Storage used against the plan (capacity_key, limit — null when not limited, unlimited, used); null without a subscription.
        billing_available:
          type: boolean
        tenant_kind:
          type: string
          enum: [BUSINESS, PERSONAL]
        self_service_eligible:
          type: boolean
        can_manage_billing:
          type: boolean
    BillingRedirect:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
    SenderContext:
      type: object
      required: [user, tenant, workspace, permissions, can_send, personal_sending_enabled]
      properties:
        user:
          type: object
        tenant:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            kind:
              type: string
              enum: [BUSINESS, PERSONAL]
        workspace:
          type: string
          enum: [sign, personal]
        permissions:
          type: object
          description: >
            The caller's effective Sign permissions (Sign permission contract). read_all, manage_all, members and billing are false for a PERSONAL account.
          properties:
            read:
              type: boolean
            read_all:
              type: boolean
            create:
              type: boolean
            send:
              type: boolean
            manage_all:
              type: boolean
            contacts:
              type: boolean
            members:
              type: boolean
            billing:
              type: boolean
        can_send:
          type: boolean
        personal_sending_enabled:
          type: boolean
        organization_url:
          type: [string, 'null']
        app_home_url:
          type: [string, 'null']
    SignMember:
      type: object
      required: [user_id, email, active, sign_role]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: [string, 'null']
        active:
          type: boolean
        sign_role:
          type: [string, 'null']
          enum: [esign_owner, esign_admin, esign_sender, esign_viewer, null]
        sign_role_display:
          type: [string, 'null']
    SignMemberList:
      type: object
      required: [items, roles]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SignMember'
        roles:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              display:
                type: string
    SenderEnvelopeList:
      type: object
      required: [items, counts]
      properties:
        items:
          type: array
          items:
            type: object
        counts:
          type: object
    SenderDraftCreated:
      type: object
      required: [id, status, subject]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        subject:
          type: string
    SenderEnvelopeDetail:
      type: object
      required: [id, subject, status, documents, recipients, fields, editable]
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: string
        status:
          type: string
          enum: [DRAFT, SENT, IN_PROGRESS, COMPLETED, DECLINED, VOIDED, EXPIRED]
        editable:
          type: boolean
        documents:
          type: array
          items:
            type: object
        recipients:
          type: array
          items:
            type: object
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SenderFieldInput'
    SenderFieldInput:
      type: object
      description: PDF-native geometry - page_number 0-based, points, origin bottom-left, (x, y) the box lower-left corner.
      required: [envelope_document_id, signer_id, field_type, page_number, x, y, width, height]
      properties:
        envelope_document_id:
          type: string
          format: uuid
        signer_id:
          type: string
          format: uuid
        field_type:
          type: string
          enum: [SIGNATURE, INITIALS, SIGN_DATE, SIGNER_NAME, TEXT, CHECKBOX, ACKNOWLEDGEMENT]
        page_number:
          type: integer
          minimum: 0
        x:
          type: number
          minimum: 0
        y:
          type: number
          minimum: 0
        width:
          type: number
          exclusiveMinimum: 0
        height:
          type: number
          exclusiveMinimum: 0
        required:
          type: boolean
    SenderUploadedDocument:
      type: object
      required: [id, title, page_count, pages]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        page_count:
          type: integer
        pages:
          type: array
          items:
            type: object
            properties:
              width:
                type: number
              height:
                type: number
    SenderLedgerEvent:
      type: object
      required: [id, event_type, occurred_at, actor, event_hash]
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        actor:
          type: string
        event_hash:
          type: string
    ErrorResponse:
      type: object
      description: The canonical Aramo error envelope.
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    CreateEnvelopeRequest:
      type: object
      required:
        - tenant_id
        - subject
        - execution_mode
        - created_by
        - documents
        - signers
      properties:
        tenant_id:
          type: string
          format: uuid
        subject:
          type: string
        execution_mode:
          type: string
          enum: [ACKNOWLEDGEMENT, SINGLE_SIGNATURE, MULTI_SIGNATURE]
        created_by:
          type: string
          format: uuid
        idempotency_key:
          type: string
        documents:
          type: array
          items:
            type: object
            required: [document_ref, document_revision_ref, title, source_sha256, ordinal]
            properties:
              document_ref:
                type: string
                format: uuid
              document_revision_ref:
                type: string
                format: uuid
              title:
                type: string
              source_sha256:
                type: string
              ordinal:
                type: integer
        signers:
          type: array
          items:
            type: object
            required: [email, name, signing_order]
            properties:
              email:
                type: string
              name:
                type: string
              signing_order:
                type: integer
              signer_role:
                type: string
        fields:
          description: >-
            PX-V1 F2 — OPTIONAL positioned signature/date fields defined at
            envelope creation. Each references a document by ordinal and,
            optionally, a signer by signing_order. Omitted by ATS RTR/Offer
            callers, which remain valid unchanged.
          type: array
          items:
            type: object
            required: [document_ordinal, field_type, page_number, x, y]
            properties:
              document_ordinal:
                type: integer
              signer_signing_order:
                type: integer
              field_type:
                type: string
                enum: [SIGNATURE, INITIALS, SIGN_DATE, SIGNER_NAME, TEXT, CHECKBOX, ACKNOWLEDGEMENT]
              page_number:
                type: integer
              x:
                type: number
              y:
                type: number
              width:
                type: number
              height:
                type: number
              required:
                type: boolean
    EnvelopeSummary:
      type: object
      required:
        - envelope_id
        - status
        - signers
      properties:
        envelope_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [DRAFT, SENT, IN_PROGRESS, COMPLETED, DECLINED, VOIDED, EXPIRED]
        signers:
          type: array
          items:
            type: object
            properties:
              signer_id:
                type: string
                format: uuid
              email:
                type: string
              status:
                type: string
                enum: [PENDING, VIEWED, SIGNED, DECLINED]
    EvidenceSummary:
      type: object
      required:
        - envelope_id
        - status
      properties:
        envelope_id:
          type: string
          format: uuid
        status:
          type: string
        event_chain_hash:
          type: [string, 'null']
        signature:
          type: [string, 'null']
        signature_algorithm:
          type: [string, 'null']
        completed_at:
          type: [string, 'null']
          format: date-time
