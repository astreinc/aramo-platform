openapi: 3.1.0
info:
  title: Aramo ATS API
  version: 0.0.0
  description: |
    The recruiter-facing ATS surface. M3 PR-8 populates the first operation
    — the match-list read endpoint — per Plan v1.5 §M3 and the locked
    Match-List Summary-only rule (API Contracts L586-588). Future ATS PRs
    populate additional operations per API Contracts v1.0 Phase 2.
paths:
  /v1/offers:
    get:
      operationId: listOffers
      summary: List/filter Offers (Offer Lifecycle D7 — recruiter discovery).
      description: |
        Lists Offers for the tenant, filtered by any of `submittal_id`,
        `requisition_id`, `talent_record_id` (AND-ed). Visibility-scoped: only
        offers whose requisition is visible to the actor are returned. Requires
        the `ats` capability and the `offer:create` scope (read rides create-
        authority; no separate `offer:read` scope this slice).
      parameters:
        - name: submittal_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: requisition_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: talent_record_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Offer'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
      security:
        - BearerAuth: []
    post:
      operationId: createOffer
      summary: Create a DRAFT Offer (Offer Lifecycle slice #2).
      description: |
        Creates a DRAFT Offer for a submittal — the dedicated pre-placement offer
        aggregate. Requires the `ats` capability and the `offer:create` scope. At
        most one live (non-terminal) offer per (tenant, submittal); a second is
        refused 409 OFFER_ALREADY_LIVE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOfferRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '409':
          description: A live offer already exists for this submittal.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
  /v1/offers/{id}:
    get:
      operationId: getOffer
      summary: Read an Offer by id.
      description: Requires the `ats` capability and the `offer:create` scope.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []
    patch:
      operationId: transitionOffer
      summary: Drive a governed Offer transition.
      description: |
        Transitions the Offer along a legal edge (DRAFT->SENT->NEGOTIATION->
        ACCEPTED/DECLINED/EXPIRED/RESCINDED). The (from,to) edge determines the
        action; the ADR-0024 offer-lifecycle policy (fail-closed) and the DB
        lifecycle trigger enforce legality. Requires the `ats` capability and the
        `offer:transition` scope. Refusals: 403 POLICY_DENIED, 409
        OFFER_ILLEGAL_TRANSITION.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionOfferRequest'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: Illegal transition edge.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
  /v1/submittals:
    post:
      operationId: createSubmittal
      summary: Create a submittal in `created` state (M4 PR-3 / F33; M5 PR-8b2 rename).
      description: |
        Builds the immutable TalentJobEvidencePackage (PR-2's
        EvidenceRepository.buildPackage) and persists a workflow
        TalentSubmittalRecord in state='created' referencing it. The
        examination_id is pinned at create-time; the submittal-confirm
        endpoint (F34) verifies the pin and enforces the three
        recruiter attestations.

        M5 PR-8b2 rename: M4 'draft' state renamed to canonical
        'created' (lifecycle start state per Group 2 §2.3b Loop 5).

        Refusal codes (closed list at PR-3):
          - 422 SUBMITTAL_STRETCH_BLOCKED — examination tier is STRETCH.
          - 404 NOT_FOUND — examination missing / archived / cross-tenant.
          - 400 VALIDATION_ERROR — request body or path violates
            invariants (UUIDs, non-empty required fields).
          - 409 IDEMPOTENCY_KEY_CONFLICT — same Idempotency-Key, different
            request body.
          - 403 INSUFFICIENT_PERMISSIONS — non-recruiter consumer.

        Worth Considering submittals MAY include `justification` and
        `failed_criterion_acknowledgments`. PR-3 persists them verbatim
        without enforcement; F34's confirm endpoint enforces non-empty
        for Worth Considering tier and returns 422 JUSTIFICATION_REQUIRED
        on miss.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: |
            UUID idempotency key. Same key + same body returns the prior
            response; same key + different body returns 409
            IDEMPOTENCY_KEY_CONFLICT. Missing or non-UUID returns 400
            VALIDATION_ERROR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'common.yaml#/components/schemas/CreateSubmittalRequest'
      responses:
        '201':
          description: Submittal created in `created` state.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/CreateSubmittalResponse'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: Idempotency-Key collision (same key, different body).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
      security:
        - BearerAuth: []

  /v1/submittals/{submittal_id}/confirm:
    post:
      operationId: confirmSubmittal
      summary: Confirm submittal entry; transition created -> handoff_draft (M4 PR-4 / F34; M5 PR-8b2 rename).
      description: |
        Transitions a TalentSubmittalRecord from `created` to
        `handoff_draft`. Recruiter must affirm all three attestations
        (talent_evidence_reviewed, constraints_reviewed,
        submittal_risk_acknowledged) and the pinned examination must
        still be the latest active snapshot for the (tenant, talent,
        job) triple. URL preserved per Q5 PATTERN-b; semantic update
        per Ruling 12.

        M5 PR-8b2 rename: M4's 'draft -> submitted with confirmed_at
        stamp' semantic becomes canonical 'created -> handoff_draft'
        (no confirmed_at change here per Ruling 6 — confirmed_at moves
        to the ready_for_review -> submitted_to_ats transition via
        the new /submit-to-ats endpoint).

        Refusal codes (closed list at PR-4 + M5 PR-8b2):
          - 422 ATTESTATION_MISSING — any of the three recruiter
            attestations is not literally true.
          - 422 SUBMITTAL_STRETCH_BLOCKED — pinned examination tier is
            STRETCH (re-check of PR-2's create-time gate).
          - 422 JUSTIFICATION_REQUIRED — Worth Considering submittal with
            missing/empty `justification` or zero
            `failed_criterion_acknowledgments` entries.
          - 422 SUBMITTAL_STATE_INVALID — submittal is in a from-state
            other than `created` or `handoff_draft` (canTransition
            guard refusal).
          - 409 EXAMINATION_PINNED_OUTDATED — pinned examination row is
            missing, no longer active, or no longer the latest snapshot
            for the (tenant, talent, job) triple.
          - 409 SUBMITTAL_ALREADY_CONFIRMED — submittal is already in
            state='handoff_draft' (post-rename equivalent of M4 'submitted'
            confirm-target; preserves M4 client error vocabulary on
            double-call).
          - 409 IDEMPOTENCY_KEY_CONFLICT — same Idempotency-Key, different
            request body.
          - 404 NOT_FOUND — submittal_id not found for the JWT's tenant.
          - 403 INSUFFICIENT_PERMISSIONS — non-recruiter consumer.
          - 400 VALIDATION_ERROR — request body fails schema validation,
            submittal_id is not a UUID, or Idempotency-Key is missing /
            malformed.
      parameters:
        - name: submittal_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: |
            UUID idempotency key. Same key + same body returns the prior
            response; same key + different body returns 409
            IDEMPOTENCY_KEY_CONFLICT. Missing or non-UUID returns 400
            VALIDATION_ERROR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'common.yaml#/components/schemas/ConfirmSubmittalRequest'
      responses:
        '200':
          description: Submittal confirmed; state transitioned to `handoff_draft`.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ConfirmSubmittalResponse'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
      security:
        - BearerAuth: []

  /v1/submittals/{submittal_id}/revoke:
    post:
      operationId: revokeSubmittal
      summary: Revoke a submittal (M4 PR-7; M5 PR-8b2 Q3 sibling-revoke expansion).
      description: |
        Transitions a TalentSubmittalRecord from any non-terminal
        state (`created`, `handoff_draft`, `ready_for_review`,
        `submitted_to_ats`) to `revoked` and stamps `revoked_at` /
        `revoked_by` / `revocation_justification` atomically. The
        response carries the LOCKED invariant
        `evidence_package_mutated: false` — every successful revoke
        affirms that the referenced TalentJobEvidencePackage row is
        byte-identical to its pre-revoke snapshot (state-isolation
        contract, mirroring the override-create endpoint's
        `examination_mutated: false` invariant from M4 PR-5).

        M5 PR-8b2 expansion per Q3 + Ruling 5: revocable from any
        non-terminal state (M4 was only `submitted -> revoked`). NOT
        revocable from `confirmed` (terminal — ATS confirmation closes
        the workflow) or `revoked` (already terminal).

        Refusal codes (closed list at PR-7 + M5 PR-8b2):
          - 422 REVOKE_NOT_ALLOWED — submittal is in a terminal state
            (`confirmed` or `revoked`); the response details carry
            `current_state`.
          - 409 IDEMPOTENCY_KEY_CONFLICT — same Idempotency-Key,
            different request body.
          - 404 NOT_FOUND — submittal_id not found for the JWT's
            tenant.
          - 403 INSUFFICIENT_PERMISSIONS — non-recruiter consumer.
          - 400 VALIDATION_ERROR — request body fails schema
            validation, submittal_id is not a UUID, or
            Idempotency-Key is missing / malformed.
      parameters:
        - name: submittal_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: |
            UUID idempotency key. Same key + same body returns the prior
            response; same key + different body returns 409
            IDEMPOTENCY_KEY_CONFLICT. Missing or non-UUID returns 400
            VALIDATION_ERROR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'common.yaml#/components/schemas/RevokeSubmittalRequest'
      responses:
        '200':
          description: Submittal revoked; state transitioned to `revoked`.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/RevokeSubmittalResponse'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: Idempotency-Key collision (same key, different body).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
      security:
        - BearerAuth: []

  /v1/submittals/{submittal_id}/mark-ready:
    post:
      operationId: markReady
      summary: Mark submittal ready for review (M5 PR-8b2; handoff_draft -> ready_for_review).
      description: |
        Fires the canonical mainline transition handoff_draft ->
        ready_for_review (M5 PR-8b2 F37 closure; transition 2 of 4).
        9-step idempotency flow mirrors M4 /confirm + /revoke pattern
        (per Q5 PATTERN-b distinct new endpoints). Per Ruling 13
        request body is empty.

        Response wraps { submittal, event } per Ruling 14 — the
        updated TalentSubmittalRecord alongside the freshly appended
        TalentSubmittalEvent (state_transition; payload
        { from_state, to_state }).

        Refusal codes (closed list):
          - 422 SUBMITTAL_STATE_INVALID — submittal is not in
            state='handoff_draft' (canTransition guard refusal); the
            response details carry `from_state` + `to_state`.
          - 409 IDEMPOTENCY_KEY_CONFLICT — same Idempotency-Key,
            different request body.
          - 404 NOT_FOUND — submittal_id not found for the JWT's
            tenant.
          - 403 INSUFFICIENT_PERMISSIONS — non-recruiter consumer.
          - 400 VALIDATION_ERROR — submittal_id is not a UUID, or
            Idempotency-Key is missing / malformed.
      parameters:
        - name: submittal_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'common.yaml#/components/schemas/MarkReadyRequest'
      responses:
        '200':
          description: Submittal marked ready; state transitioned to `ready_for_review`.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/MarkReadyResponse'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: Idempotency-Key collision (same key, different body).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
      security:
        - BearerAuth: []

  /v1/submittals/{submittal_id}/submit-to-ats:
    post:
      operationId: submitToAts
      summary: Submit to ATS (M5 PR-8b2; ready_for_review -> submitted_to_ats; populates confirmed_at).
      description: |
        Fires the canonical mainline transition ready_for_review ->
        submitted_to_ats (M5 PR-8b2 F37 closure; transition 3 of 4).
        Per Ruling 6 this transition populates `confirmed_at`
        NULL -> non-NULL (preserves M4 confirmed_at column semantic
        post-rename; M4's 'draft -> submitted with confirmed_at'
        becomes canonical 'ready_for_review -> submitted_to_ats with
        confirmed_at'). Per Ruling 13 request body is empty.

        Response wraps { submittal, event } per Ruling 14.

        Refusal codes (closed list):
          - 422 SUBMITTAL_STATE_INVALID — submittal is not in
            state='ready_for_review' (canTransition guard refusal).
          - 409 IDEMPOTENCY_KEY_CONFLICT — same Idempotency-Key,
            different request body.
          - 404 NOT_FOUND — submittal_id not found for the JWT's
            tenant.
          - 403 INSUFFICIENT_PERMISSIONS — non-recruiter consumer.
          - 400 VALIDATION_ERROR — submittal_id is not a UUID, or
            Idempotency-Key is missing / malformed.
      parameters:
        - name: submittal_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'common.yaml#/components/schemas/SubmitToAtsRequest'
      responses:
        '200':
          description: Submittal submitted to ATS; state transitioned to `submitted_to_ats`; confirmed_at populated.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/SubmitToAtsResponse'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: Idempotency-Key collision (same key, different body).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
      security:
        - BearerAuth: []

  /v1/submittals/{submittal_id}/confirm-ats:
    post:
      operationId: confirmAts
      summary: Confirm ATS submission (M5 PR-8b2; submitted_to_ats -> confirmed; lifecycle terminal).
      description: |
        Fires the canonical mainline transition submitted_to_ats ->
        confirmed (M5 PR-8b2 F37 closure; transition 4 of 4;
        lifecycle terminal). Per Ruling 5 `confirmed` is fully
        terminal -- not even sibling-revoke applies post-confirm.
        ATS external reference id on the request body is explicitly
        OUT-OF-SCOPE per directive §5 (deferred to future consumer
        PR). Per Ruling 13 request body is empty.

        Response wraps { submittal, event } per Ruling 14.

        Refusal codes (closed list):
          - 422 SUBMITTAL_STATE_INVALID — submittal is not in
            state='submitted_to_ats' (canTransition guard refusal).
          - 409 IDEMPOTENCY_KEY_CONFLICT — same Idempotency-Key,
            different request body.
          - 404 NOT_FOUND — submittal_id not found for the JWT's
            tenant.
          - 403 INSUFFICIENT_PERMISSIONS — non-recruiter consumer.
          - 400 VALIDATION_ERROR — submittal_id is not a UUID, or
            Idempotency-Key is missing / malformed.
      parameters:
        - name: submittal_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'common.yaml#/components/schemas/ConfirmAtsRequest'
      responses:
        '200':
          description: Submittal confirmed by ATS; state transitioned to `confirmed`; lifecycle terminal.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ConfirmAtsResponse'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: Idempotency-Key collision (same key, different body).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
      security:
        - BearerAuth: []

  /v1/submittals/{submittal_id}:
    get:
      operationId: getSubmittal
      summary: Get a TalentSubmittalRecord by id (M4 PR-6).
      description: |
        Tenant-scoped lookup via SubmittalRepository.findById. Returns the
        TalentSubmittalRecord for the JWT's tenant. Read-only; no
        Idempotency-Key required (Ruling 8 — M3 PR-8 / M3 PR-9 GET
        precedent).

        Refusal codes (closed list at PR-6):
          - 404 NOT_FOUND — submittal_id not found for the JWT's tenant.
          - 403 INSUFFICIENT_PERMISSIONS — non-recruiter consumer.
          - 400 VALIDATION_ERROR — submittal_id is not a UUID.
      parameters:
        - name: submittal_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: TalentSubmittalRecord for the JWT's tenant.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/TalentSubmittalRecord'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []

  /v1/submittals/{submittal_id}/evidence-package:
    get:
      operationId: getEvidencePackage
      summary: Get the linked TalentJobEvidencePackage for a submittal (M4 PR-6).
      description: |
        Tenant-scoped chain lookup: load the submittal (verifying tenancy
        on SubmittalRepository.findById), then load the linked
        TalentJobEvidencePackage via EvidenceRepository.findById on
        submittal.evidence_package_id (tenancy re-asserted). Read-only;
        no Idempotency-Key required (Ruling 8). No state-isolation
        invariant (no mutation possible).

        Refusal codes (closed list at PR-6):
          - 404 NOT_FOUND — submittal not found for the JWT's tenant, OR
            evidence-package not found at submittal.evidence_package_id
            (chain-break; defensive — the cross-schema invariant
            (Architecture §7.3) ensures live package rows).
          - 403 INSUFFICIENT_PERMISSIONS — non-recruiter consumer.
          - 400 VALIDATION_ERROR — submittal_id is not a UUID.
      parameters:
        - name: submittal_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: TalentJobEvidencePackageView linked to the submittal.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/TalentJobEvidencePackageView'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []

  /v1/examinations/{examination_id}/overrides:
    post:
      operationId: createExaminationOverride
      summary: Record a recruiter override on an examination (M4 PR-5).
      description: |
        Records a recruiter-authored override (tier, risk_flag, gap, or
        constraint_check) against an active TalentJobExamination WITHOUT
        mutating the immutable examination row. The response carries the
        locked invariant `examination_mutated: false` — every successful
        create affirms that the referenced examination row is byte-
        identical to its pre-create snapshot (Group 2 §2.4-§2.5 write-
        isolation contract).

        Refusal codes:
          - 404 NOT_FOUND — examination missing, archived/cold_storage,
            or cross-tenant.
          - 422 OVERRIDE_INVALID — semantic refusal of invalid override
            payload (registered at PR-5; reserved for future enforcement).
          - 400 VALIDATION_ERROR — request body fails schema validation,
            examination_id is not a UUID, or Idempotency-Key is missing /
            malformed.
          - 409 IDEMPOTENCY_KEY_CONFLICT — same Idempotency-Key with a
            different request body.
          - 403 INSUFFICIENT_PERMISSIONS — non-recruiter consumer.
      parameters:
        - name: examination_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: |
            UUID idempotency key. Same key + same body returns the prior
            response; same key + different body returns 409
            IDEMPOTENCY_KEY_CONFLICT. Missing or non-UUID returns 400
            VALIDATION_ERROR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'common.yaml#/components/schemas/CreateOverrideRequest'
      responses:
        '201':
          description: Override recorded; examination row unchanged.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/CreateOverrideResponse'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: Idempotency-Key collision (same key, different body).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
      security:
        - BearerAuth: []

  # =========================================================================
  # M5 PR-4 — Selection HTTP surface (Charter v1.2 §4.3 row 4).
  #
  # Four endpoints exposing the M5 PR-1/2/3 selection substrate at the
  # recruiter-facing ATS surface:
  #   GET  /v1/selections                   — LIST (R7 BE-prereq P1; D4b-composed)
  #   POST /v1/selections                   — create (Ruling 4 + Ruling 9)
  #   POST /v1/selections/{id}/transitions  — state transition (Ruling 10)
  #   POST /v1/selections/{id}/outreach     — outreach send (M5 PR-6)
  #   POST /v1/selections/{id}/response     — record response (M5 PR-7)
  #   POST /v1/selections/{id}/conversation — record conversation (M5 PR-8a)
  #   GET  /v1/selections/{id}              — read selection (Ruling 5)
  #   GET  /v1/selections/{id}/events       — read event log (Ruling 5)
  #
  # All endpoints recruiter-only (Ruling 8); non-recruiter consumers 403'd
  # with INSUFFICIENT_PERMISSIONS. POST endpoints require Idempotency-Key
  # header (M4 PR-3 precedent).
  #
  # R7 BE-prereq (Amendment v1.1) — scope-gating + D4b visibility:
  #   - selection:read    gates the 3 GETs (LIST + read + events)
  #   - selection:write   gates create / transitions / response / conversation
  #   - selection:outreach gates the outreach send (SoD — external side-effects)
  # The controller decorators (@RequireScopes(...)) carry the gate; openapi
  # documents shape, not authz (uniform with the rest of ATS — Amendment v1.1
  # §5 Ruling 5(c)).
  # D4b visibility: selection is visible iff its requisition_id is in the
  # actor's visible-requisition set; invisible → 404 (the non-leak posture).
  # =========================================================================

  /v1/selections:
    get:
      operationId: listSelections
      summary: List the actor's visible selections (R7 BE-prereq P1).
      description: |
        Returns the selections visible to the authenticated actor in the
        current tenant. D4b-composed: an selection is visible iff its
        requisition_id is in the actor's visible-requisition set (A3
        directly-assigned OR D4b pod-resolved).

        Filter semantics (both query params optional):
          - no filter        → all visible selections in tenant
          - ?talent_id       → that talent's visible selections
          - ?requisition_id  → that requisition's selections (empty if
                               the requisition itself is invisible to
                               the actor — no existence leak)
          - both             → the intersection (at most one row by the
                               natural key (tenant, talent, requisition))

        Refusal codes:
          - 403 INSUFFICIENT_PERMISSIONS — missing selection:read scope
            OR non-recruiter consumer.
      parameters:
        - name: talent_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Optional talent_id filter.
        - name: requisition_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Optional requisition_id filter.
      responses:
        '200':
          description: Selection list (D4b-scoped to the actor's visible set).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: 'common.yaml#/components/schemas/TalentSelectionView'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
      security:
        - BearerAuth: []

    post:
      operationId: createSelection
      summary: Create a new TalentSelection (M5 PR-4).
      description: |
        Creates a new TalentSelection row in initial state
        `surfaced` (Group 2 §2.3b Loop 1) and appends the initial
        state_transition event row atomically via prisma.$transaction.

        Three cross-schema validators run fail-fast BEFORE the write
        transaction opens (M5 PR-3 Amendment v1.1 §2, three substrate-
        derived patterns):
          - Pattern C (Talent): TalentRepository.findOverlayByTenant;
            overlay absence → 422 SELECTION_REFERENCE_NOT_FOUND.
          - Pattern A (Requisition): findRequisitionById + tenant
            check; null/mismatch → 422 SELECTION_REFERENCE_NOT_FOUND.
          - Pattern B (Examination, nullable): findById + tenant check;
            null/mismatch → 422 SELECTION_REFERENCE_NOT_FOUND.

        Response shape: { selection } only per Ruling 9. The initial
        event row is accessible via GET /v1/selections/{id}/events.

        Refusal codes:
          - 422 SELECTION_REFERENCE_NOT_FOUND — cross-schema validator.
          - 409 IDEMPOTENCY_KEY_CONFLICT — same key, different body.
          - 403 INSUFFICIENT_PERMISSIONS — non-recruiter consumer.
          - 400 VALIDATION_ERROR — DTO shape / Idempotency-Key issues.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: |
            UUID idempotency key. Same key + same body returns the prior
            response; same key + different body returns 409
            IDEMPOTENCY_KEY_CONFLICT. Missing or non-UUID returns 400
            VALIDATION_ERROR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'common.yaml#/components/schemas/CreateSelectionRequest'
      responses:
        '201':
          description: Selection created in initial state `surfaced`.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/CreateSelectionResponse'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '409':
          description: Idempotency-Key collision (same key, different body).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
      security:
        - BearerAuth: []

  /v1/selections/{selection_id}/transitions:
    post:
      operationId: transitionSelection
      summary: Transition an selection to a new state (M5 PR-4).
      description: |
        Transitions an existing selection's state column via the
        repository's transitionState method. Atomic prisma.$transaction
        pairs the selection.update with a state_transition event row
        append per M5 PR-3 substrate.

        Pre-write guards (in order):
          1. consumer_type === 'recruiter' (403 INSUFFICIENT_PERMISSIONS).
          2. Idempotency-Key required + UUID-shaped.
          3. selection_id path param UUID validation.
          4. Read current via findByTenantAndId (404 NOT_FOUND if null).
          5. canTransition guard (422 SELECTION_STATE_INVALID if illegal).

        Column-scoped DB trigger (PR-1 substrate) is defense-in-depth.

        Response shape: { selection } only per Ruling 9 + Ruling 11
        (NO state-isolation literal field).

        Refusal codes:
          - 422 SELECTION_STATE_INVALID — illegal transition (satisfies
            Plan v1.5 §M5 Track B item 1).
          - 409 IDEMPOTENCY_KEY_CONFLICT — same key, different body.
          - 404 NOT_FOUND — selection_id not visible in tenant.
          - 403 INSUFFICIENT_PERMISSIONS — non-recruiter consumer.
          - 400 VALIDATION_ERROR — DTO shape / Idempotency-Key issues.
      parameters:
        - name: selection_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: |
            UUID idempotency key. Same key + same body returns the prior
            response; same key + different body returns 409
            IDEMPOTENCY_KEY_CONFLICT. Missing or non-UUID returns 400
            VALIDATION_ERROR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'common.yaml#/components/schemas/TransitionSelectionRequest'
      responses:
        '200':
          description: Selection state transitioned; event row appended.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/TransitionSelectionResponse'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: Idempotency-Key collision (same key, different body).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
      security:
        - BearerAuth: []

  # Outreach Draft/Preview Directive v1.0 / Amendment v1.1 — the atomic
  # POST /v1/selections/{id}/outreach (prompt→draft→send in one call, no
  # preview) was REMOVED and split into /outreach/draft + /outreach/send.
  # Leaving the atomic path live would let a caller send without preview,
  # defeating the human-in-the-loop guarantee — its removal is a
  # compliance requirement, and draft→preview→send is now the only path.
  /v1/selections/{selection_id}/outreach/draft:
    post:
      operationId: draftOutreach
      summary: Generate + persist a PENDING AI outreach draft (no delivery).
      description: |
        The GENERATION half of the human-in-the-loop outreach split. Runs
        AiDraftService.generateDraft (libs/ai-draft; Anthropic adapter at
        M5 PR-5) and persists a PENDING `outreach_drafted` event carrying
        the AI draft text + ai_draft_audit_record_id. Returns the drafted
        text + the draft event id for the recruiter to review (and
        optionally edit) before sending.

        NO delivery, NO outbox, NO state transition — drafting never sends.

        Guards (in order):
          1. consumer_type === 'recruiter' (403 INSUFFICIENT_PERMISSIONS).
          2. Idempotency-Key required + UUID-shaped.
          3. selection_id path param UUID validation + idempotency lookup.
          4. Pre-read selection (visibility) → 404 NOT_FOUND.
          5. DRAFT state-gate (Amendment v1.1 Ruling 2): the selection
             MUST be in 'engaged' (the only send-eligible state) → 422
             SELECTION_STATE_INVALID otherwise. You can only draft what
             you can send (no stranded drafts; no wasted LLM tokens).
          6. SOFT consent pre-check (Amendment v1.1 Ruling 1): NON-BLOCKING
             — on denied the response carries `consent_warning`, but the
             draft still succeeds. The binding consent gate is at SEND.
          7. AiDraftService.generateDraft (with error-code remap, Ruling 6).
          8. Append the outreach_drafted event.

        AI error remapping (Ruling 6):
          - kind ∈ {provider_unavailable, provider_internal_error}
            → 502 AI_PROVIDER_UNAVAILABLE.
          - kind === 'provider_rate_limited' → 429 AI_RATE_LIMITED.
          - any other kind → 500 INTERNAL_ERROR pass-through.

        Refusal codes: 422 SELECTION_STATE_INVALID, 502
        AI_PROVIDER_UNAVAILABLE, 429 AI_RATE_LIMITED, 409
        IDEMPOTENCY_KEY_CONFLICT, 404 NOT_FOUND, 403 INSUFFICIENT_PERMISSIONS,
        400 VALIDATION_ERROR. NOTE: no 403 CONSENT_NOT_GRANTED_AT_SEND here
        — consent is a non-blocking warning at draft; it binds at SEND.
      parameters:
        - name: selection_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: |
            UUID idempotency key (the DRAFT key — independent of the SEND
            key). Same key + same body returns the prior draft response;
            same key + different body returns 409 IDEMPOTENCY_KEY_CONFLICT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'common.yaml#/components/schemas/OutreachDraftRequest'
      responses:
        '200':
          description: |
            AI draft generated + persisted PENDING (outreach_drafted event).
            No delivery occurred. consent_warning present iff the soft
            consent pre-check returned denied.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/OutreachDraftResponse'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          description: |
            INSUFFICIENT_PERMISSIONS — non-recruiter consumer (recruiter-only
            endpoint). Consent denial does NOT surface here at draft time —
            it is a non-blocking warning in the 200 response body.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: Idempotency-Key collision (same key, different body).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
        '429':
          description: AI provider rate-limit (AI_RATE_LIMITED).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '502':
          description: AI provider unavailable (AI_PROVIDER_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []

  /v1/selections/{selection_id}/outreach/send:
    post:
      operationId: sendOutreach
      summary: Deliver a recruiter-approved outreach draft (consent-at-send).
      description: |
        The DELIVERY half of the human-in-the-loop split. Takes the source
        draft event id + the recruiter-approved (possibly-edited) final
        text; runs the BINDING consent-at-send check; delivers via the
        injected DeliveryProvider (SendStub at PR-6); then atomically
        transitions the selection from 'engaged' to 'awaiting_response'
        with a paired `outreach_sent` event (carrying the final sent text
        + a back-reference to the source draft) + `state_transition` event
        + outbox emit. The repository $transaction guarantees all writes
        commit together OR none commit.

        The editable trail: outreach_sent.final_text may differ from the
        source outreach_drafted.draft_text (the recruiter edited); both
        persist, so what the AI proposed and what the recruiter sent are
        BOTH provable.

        Guards (in order):
          1. consumer_type === 'recruiter' (403 INSUFFICIENT_PERMISSIONS).
          2. Idempotency-Key required + UUID-shaped (the SEND key).
          3. selection_id path param UUID validation + idempotency lookup.
          4. Pre-read selection (visibility) → 404 NOT_FOUND.
          5. State pre-gate BEFORE delivery (canTransition → 422). True
             single-send: a second send finds 'awaiting_response' and 422s
             WITHOUT re-delivering.
          6. Source-draft cross-event-ref validation: draft_event_id must
             resolve to an outreach_drafted event on this selection +
             tenant → 422 SELECTION_REFERENCE_NOT_FOUND otherwise.
          7. BINDING consent-at-send → 403 CONSENT_NOT_GRANTED_AT_SEND
             (denied) / 500 INTERNAL_ERROR (resolver fault).
          8. DeliveryProvider.deliver(final_text).
          9. SelectionRepository.sendOutreach atomic transaction.

        Refusal codes: 422 SELECTION_STATE_INVALID, 422
        SELECTION_REFERENCE_NOT_FOUND, 403 CONSENT_NOT_GRANTED_AT_SEND, 403
        INSUFFICIENT_PERMISSIONS, 500 INTERNAL_ERROR (consent resolver
        fault), 409 IDEMPOTENCY_KEY_CONFLICT, 404 NOT_FOUND, 400
        VALIDATION_ERROR. NOTE: no AI error codes here — generation
        happened at /outreach/draft.
      parameters:
        - name: selection_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: |
            UUID idempotency key (the SEND key — independent of the DRAFT
            key). Same key + same body returns the prior response; same key
            + different body returns 409 IDEMPOTENCY_KEY_CONFLICT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'common.yaml#/components/schemas/OutreachSendRequest'
      responses:
        '200':
          description: |
            Final text delivered (stub) + selection transitioned to
            'awaiting_response'; outreach_sent event persists the final
            text + source draft back-reference.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/OutreachSendResponse'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          description: |
            Authenticated but request is forbidden. Two codes can surface:
              - INSUFFICIENT_PERMISSIONS — non-recruiter consumer.
              - CONSENT_NOT_GRANTED_AT_SEND — the BINDING runtime
                contacting-consent check returned `result: 'denied'`. Full
                ConsentDecisionDto embedded in
                error.details.consent_decision; reason_code discriminates
                the denial cause without growing the error registry.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: Idempotency-Key collision (same key, different body).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
        '500':
          description: Consent resolver substrate fault (INTERNAL_ERROR).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []

  /v1/selections/{selection_id}/response:
    post:
      operationId: recordResponse
      summary: Record a talent response to a prior outreach (M5 PR-7).
      description: |
        Recruiter records that a talent responded to a prior
        outreach. Compressed-scope mirror of POST .../outreach: no AI
        consumption, no delivery side-effect, no new error codes.

        Atomic 3-write transaction (SelectionRepository.recordResponse):
          1. selection.update(state = 'responded').
          2. talentSelectionEvent.create(event_type='response_received',
             event_payload=SelectionResponseReceivedPayload).
          3. talentSelectionEvent.create(event_type='state_transition',
             event_payload={from_state, to_state}).

        Pre-write guards (in order):
          1. consumer_type === 'recruiter' (403 INSUFFICIENT_PERMISSIONS).
          2. Idempotency-Key required + UUID-shaped.
          3. selection_id path param UUID validation.
          4. Body hash for replay-vs-conflict.
          5. Idempotency lookup (replay short-circuit).
          6. NOT_FOUND guard (findByTenantAndId).
          7. Cross-event reference validation (Ruling 4): the
             outreach_event_ref_id MUST resolve to an event in the same
             tenant + same selection + event_type='outreach_sent'.
             Any of (null lookup / cross-selection / cross-tenant /
             wrong-event-type) → 422 SELECTION_REFERENCE_NOT_FOUND.
          8. canTransition(current.state, 'responded') — natural-key
             dedup atop the standard Idempotency-Key replay path.

        Refusal codes (closed list):
          - 422 SELECTION_STATE_INVALID — selection not in
            'awaiting_response' state (covers selection already in
            'responded' state — natural-key dedup).
          - 422 SELECTION_REFERENCE_NOT_FOUND — outreach_event_ref_id
            doesn't resolve to a valid outreach_sent event in tenant +
            selection.
          - 409 IDEMPOTENCY_KEY_CONFLICT — same key, different body.
          - 404 NOT_FOUND — selection_id not visible in tenant.
          - 403 INSUFFICIENT_PERMISSIONS — non-recruiter consumer.
          - 400 VALIDATION_ERROR — DTO shape / Idempotency-Key issues.
      parameters:
        - name: selection_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: |
            UUID idempotency key. Same key + same body returns the prior
            response; same key + different body returns 409
            IDEMPOTENCY_KEY_CONFLICT. Missing or non-UUID returns 400
            VALIDATION_ERROR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'common.yaml#/components/schemas/RecordResponseRequest'
      responses:
        '200':
          description: |
            Response recorded; selection transitioned to 'responded'.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/RecordResponseResponse'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: Idempotency-Key collision (same key, different body).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
      security:
        - BearerAuth: []

  /v1/selections/{selection_id}/conversation:
    post:
      operationId: recordConversationStarted
      summary: Record that an in-bound conversation has begun (M5 PR-8a).
      description: |
        Recruiter records that an in-bound conversation with the talent
        has begun following a prior response. Compressed-scope mirror
        of POST .../response: no AI consumption, no delivery
        side-effect, no new error codes, and — unlike PR-7 — NO
        cross-event reference validation (Ruling 3: workflow invariant
        is sufficiently enforced by canTransition, the prior
        response_received event is implicit).

        Atomic 3-write transaction
        (SelectionRepository.recordConversationStarted):
          1. selection.update(state = 'in_conversation').
          2. talentSelectionEvent.create(event_type='conversation_started',
             event_payload=SelectionConversationStartedPayload).
          3. talentSelectionEvent.create(event_type='state_transition',
             event_payload={from_state, to_state}).

        Pre-write guards (in order):
          1. consumer_type === 'recruiter' (403 INSUFFICIENT_PERMISSIONS).
          2. Idempotency-Key required + UUID-shaped.
          3. selection_id path param UUID validation.
          4. Body hash for replay-vs-conflict.
          5. Idempotency lookup (replay short-circuit).
          6. NOT_FOUND guard (findByTenantAndId).
          7. canTransition(current.state, 'in_conversation') — natural-
             key dedup atop the standard Idempotency-Key replay path
             (selection already in 'in_conversation' refuses with
             SELECTION_STATE_INVALID even with a fresh key).

        Refusal codes (closed list):
          - 422 SELECTION_STATE_INVALID — selection not in
            'responded' state (covers selection already in
            'in_conversation' state — natural-key dedup — and
            selections in 'engaged' / 'awaiting_response' / earlier
            states).
          - 409 IDEMPOTENCY_KEY_CONFLICT — same key, different body.
          - 404 NOT_FOUND — selection_id not visible in tenant.
          - 403 INSUFFICIENT_PERMISSIONS — non-recruiter consumer.
          - 400 VALIDATION_ERROR — DTO shape / Idempotency-Key issues.
      parameters:
        - name: selection_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: |
            UUID idempotency key. Same key + same body returns the prior
            response; same key + different body returns 409
            IDEMPOTENCY_KEY_CONFLICT. Missing or non-UUID returns 400
            VALIDATION_ERROR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'common.yaml#/components/schemas/RecordConversationStartedRequest'
      responses:
        '200':
          description: |
            Conversation recorded; selection transitioned to
            'in_conversation'.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/RecordConversationStartedResponse'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: Idempotency-Key collision (same key, different body).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
      security:
        - BearerAuth: []

  /v1/selections/{selection_id}:
    get:
      operationId: getSelection
      summary: Read a TalentSelection by id (M5 PR-4).
      description: |
        Tenant-scoped read of a single selection via
        SelectionRepository.findByTenantAndId. Cross-tenant or
        non-existent → 404 NOT_FOUND (Architecture §7.2 — cross-tenant
        reads surface as invisibility, not 403).

        No Idempotency-Key handling per Ruling 5 (GET routes are
        side-effect-free).
      parameters:
        - name: selection_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Selection view.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/TalentSelectionView'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []

  /v1/selections/{selection_id}/events:
    get:
      operationId: getSelectionEvents
      summary: List event-log entries for an selection (M5 PR-4).
      description: |
        Tenant-scoped read of the chronological event log for an
        selection via SelectionEventRepository
        .findByTenantAndSelectionId. Order: ASC by created_at.

        Includes a parent-selection existence pre-check (404 NOT_FOUND
        if the selection itself is not visible in tenant) to avoid the
        information-leak path where a non-existent selection_id would
        return an empty events array (same response shape as a
        newly-created selection with no events yet).
      parameters:
        - name: selection_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chronological event log (may be empty).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/SelectionListEventsResponse'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []

  /v1/jobs/{job_id}/matches:
    get:
      operationId: listJobMatches
      summary: Returns the ranked match list for a job (Summary-only).
      description: |
        Returns the ranked Live List for the named active requisition as
        TalentJobExaminationSummary[] (NEVER Full — API Contracts L586-588).
        Empty data[] is returned (200, not 404) when no active requisition
        exists for the (tenant_id, job_id) pair; tenant mismatch is treated
        the same way (recovery-from-routing-bug security posture, not an
        error path).
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
          description: |
            Page size. Repository default 50, hard cap 200. Values outside
            [1, 200] are rejected with 400 INVALID_REQUEST by the
            controller; in-range values pass through to the repository's
            clamp.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: |
            Opaque cursor returned in a prior response's pagination.next_cursor.
            Consumers MUST NOT decode it.
      responses:
        '200':
          description: Ranked match list of TalentJobExaminationSummary items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchListResponse'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
      security:
        - BearerAuth: []

  /v1/exports/{entity_type}:
    get:
      operationId: exportEntity
      summary: Export ATS entities as RFC-4180 CSV (PR-A8-4).
      description: |
        Exports ATS rows visible to the actor as a CSV download.

        R10 boundary (load-bearing, structural): emits ATS fields ONLY —
        company / contact / requisition / talent_record / pipeline.
        NO Core tier / score / match / examination / selection /
        submittal column appears. The export lib reads NO Core schema
        (the lint:nx-boundaries graph for libs/export has zero Core
        edges; the integration spec verifies it by omitting every
        Core migration from the test container and asserting the
        routes still serve 200). A CSV travels, which is the highest-
        risk R10 surface — this is why the boundary is structural,
        not a runtime filter.

        A3-visibility (load-bearing): a recruiter (`requisition:read`
        only) exports own-visible rows — assigned requisitions and
        pipelines on those requisitions (via the assignments-some
        predicate). tenant_admin (`requisition:read:all`) exports
        tenant-wide. Reference-entity exports (company / contact /
        talent_record) are tenant-wide for BOTH roles — A3 is
        assignment-keyed and the A7 precedent set that it does not
        apply to reference data. Export is NOT a visibility-bypass.

        Column selection: the optional `columns` query parameter
        accepts a comma-separated list of ATS field names. Default:
        all columns. An unknown column → 400 VALIDATION_ERROR.

        CSV format: RFC-4180 — fields containing `,`, `"`, CR, or LF
        are double-quote-wrapped with embedded `"` doubled (`""`);
        records terminated by CRLF. Headers are the canonical Aramo
        ATS field names — the talent_record export NEVER carries
        "candidate" / "applicant" (the inbound vocabulary alias is
        import-only; outbound speaks Talent).

        Refusal codes (closed list at PR-A8-4):
          - 400 VALIDATION_ERROR — invalid entity_type, unknown column,
            invalid limit, or too many columns requested.
          - 401 AUTH_REQUIRED — missing/invalid JWT.
          - 403 INSUFFICIENT_PERMISSIONS — missing `export:read` scope.
          - 403 TENANT_CAPABILITY_NOT_ENTITLED — tenant lacks the
            'ats' capability.
      parameters:
        - name: entity_type
          in: path
          required: true
          schema:
            type: string
            enum:
              - company
              - contact
              - requisition
              - talent_record
              - pipeline
        - name: columns
          in: query
          required: false
          schema:
            type: string
          description: |
            Comma-separated list of ATS field names to include. Default:
            every column in the entity's catalog. An unknown column →
            400 VALIDATION_ERROR.
        - name: site_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: |
            Site-axis filter. RequireSiteMatch enforces that the JWT
            site claim matches when present.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
          description: |
            Maximum number of rows. Default 5000; max 10000. A
            streaming bulk-export endpoint is a separate later batch.
      responses:
        '200':
          description: |
            RFC-4180 CSV body. Header row uses canonical Aramo ATS
            field names. Content-Disposition is set by the controller
            so a browser download is named exports-<entity>.csv.
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
      security:
        - BearerAuth: []

  # TR-14 B2 (DDR §2.1/§2.5) — the contracted trust dossier (read-only per record).
  /v1/talent-records/{id}/dossier:
    get:
      operationId: getTalentRecordDossier
      summary: The trust dossier head for a talent record (TR-14 B2).
      description: |
        The Trust Assessment form, contracted and read-only: per-dimension bands +
        named-thinness statements, contradiction ITEMS with reasons (never counts),
        verification state, merge provenance, advisory pointers. Assembled from the
        cluster-union of the record's resolved subject (reverse lookup -> fixpoint).
        A record with no subject returns ledger_established:false, never an error.
        Gated: capability ats + scope talent:read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The dossier head.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierHead'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []
  /v1/talent-records/{id}/dossier/evidence:
    get:
      operationId: getTalentRecordDossierEvidence
      summary: The dossier evidence timeline (keyset, TR-14 B2).
      description: |
        The lifecycle event story over the cluster-union, keyset-paged newest-first,
        each item carrying its evidence summary (never strength) and the links that
        touch it, inline.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: A keyset page of the evidence timeline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierEvidencePage'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []

  /v1/placements:
    get:
      operationId: listPlacements
      summary: List PlacementProcesses for the tenant (Track 3 / E1-d).
      description: |
        Returns the tenant's PlacementProcesses, newest first with a stable
        `id` tie-breaker, bounded at 200. Optional narrowing by the indexed
        axes `requisition_id`, `submittal_id`, `talent_record_id`. Requires
        the `ats` capability and the `placement:read` scope, and is scoped to
        the actor's visible requisition set (a placement on a requisition the
        actor cannot see is simply absent — never disclosed).

        The collection projection carries the placement lifecycle `state` only;
        it deliberately exposes NO fallthrough/terminal reason evidence
        (`reason_code`, `reason_label_snapshot`, `reason_detail`) — reason
        evidence is available only on the per-placement event timeline
        (`GET /v1/placements/{id}/events`). Refusals:
          - 403 TENANT_CAPABILITY_NOT_ENTITLED — tenant lacks `ats`.
          - 403 INSUFFICIENT_PERMISSIONS — caller lacks `placement:read`.
      parameters:
        - name: requisition_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: submittal_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: talent_record_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementProcessList'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
    post:
      operationId: createPlacement
      summary: Create a PlacementProcess on the client-selection/offer fact (Track 3 / E1-b).
      description: |
        Creates a PlacementProcess in the initial `OFFER_EXTENDED` state.
        tenant_id is derived from the JWT. Requires the `placement:create`
        scope. When `replaces_placement_process_id` is present the request is a
        replacement and ALSO requires the `placement:replace` scope (Track 3 /
        E4 — a conjunction, never a fallback). Refusals:
          - 409 PLACEMENT_ALREADY_LIVE — a live PlacementProcess already
            exists for this (tenant, submittal).
          - 403 INSUFFICIENT_PERMISSIONS — caller lacks `placement:create`, or
            supplies `replaces_placement_process_id` without `placement:replace`.
          - 422 PLACEMENT_REPLACEMENT_INVALID — the named predecessor is not a
            valid one to replace (predecessor_not_found | predecessor_not_terminal).
          - 400 VALIDATION_ERROR — body fails schema validation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlacementRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementProcess'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '409':
          description: A live placement already exists for this (tenant, submittal).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '422':
          description: >
            Replacement linkage invalid (Track 3 / E4) — the named predecessor is
            not found in this tenant+requisition, or is not in a terminal state.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []

  /v1/placements/{id}/transition:
    post:
      operationId: transitionPlacement
      summary: Governed PlacementProcess transition; the 14-edge matrix enforces legality (E1-b).
      description: |
        One generic transition route — the target state is in the body and
        the canonical 14-edge matrix (DB-trigger-enforced) owns legality.
        Authorization is DATA-dependent on the edge's authority class
        (Approval Record §2): ordinary progression requires
        `placement:transition`, the live/capacity edge
        (READY_TO_START -> STARTED) requires `placement:activate`, and any
        edge into a terminal state requires `placement:terminate`. All
        placement scopes ship with zero default grants (fail-closed).
        A transition into a governed terminal state (OFFER_DECLINED,
        OFFER_RESCINDED, NO_SHOW, FELL_THROUGH) additionally requires a canonical
        `reason_code` (Track 3 / E3); `reason_detail` is governed by that code's
        detail policy. Reason input on a non-governed edge is refused.
        Refusals:
          - 422 PLACEMENT_STATE_INVALID — the requested edge is not one of
            the 14 legal transitions from the current state.
          - 422 PLACEMENT_REASON_INVALID — the reason evidence is invalid for the
            transition (details.reason discriminates: reason_required |
            reason_unknown | reason_retired | reason_wrong_target | detail_required
            | detail_prohibited | detail_too_long | reason_on_non_governed_target).
          - 403 INSUFFICIENT_PERMISSIONS — caller lacks the edge's class scope.
          - 404 NOT_FOUND — no PlacementProcess for this (tenant, id).
          - 400 VALIDATION_ERROR — `to` is not a known placement state.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionPlacementRequest'
      responses:
        '200':
          description: Transitioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementProcess'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions for the edge's authority class.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '422':
          description: Illegal state transition.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []

  /v1/placements/{id}:
    get:
      operationId: getPlacement
      summary: Read a PlacementProcess (Track 3 / E1-b, guard-aligned E1-d).
      description: |
        Returns the PlacementProcess for the JWT's tenant. Requires the `ats`
        capability and the `placement:read` scope, and is scoped to the actor's
        visible requisition set. A placement that does not exist in the tenant
        OR is not visible to the actor returns 404 (never 403 — the scope
        passed, so existence is not disclosed). No reason evidence is returned
        on this item read; use `GET /v1/placements/{id}/events` for the reason
        timeline. Refusals:
          - 404 NOT_FOUND — no PlacementProcess for this (tenant, id) or not visible.
          - 403 TENANT_CAPABILITY_NOT_ENTITLED — tenant lacks `ats`.
          - 403 INSUFFICIENT_PERMISSIONS — caller lacks `placement:read`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementProcess'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []

  /v1/placements/{id}/events:
    get:
      operationId: listPlacementEvents
      summary: Read a PlacementProcess event/reason timeline (Track 3 / E1-d).
      description: |
        Returns the append-only state-transition events for the placement,
        oldest first with a stable `id` tie-breaker. This is the authorized
        detail surface for fallthrough/terminal reason evidence: `reason_code`,
        `reason_label_snapshot` and permitted `reason_detail` are returned HERE
        and on no broader surface. Legacy or non-governed events carry null
        reason fields (a null is genuine absence, never a reason reconstructed
        from state). `reason_detail` is null by construction for a reason code
        whose registry policy prohibits detail.

        The placement is first loaded under the same guard as the item read
        (capability `ats`, scope `placement:read`, actor visibility) — a
        not-found/not-visible placement returns 404 before any event is read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementProcessEventList'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []

  /v1/placements/{id}/assignment:
    get:
      operationId: getPlacementAssignment
      summary: Read the authoritative ContractAssignment state for a placement (Track 4 / T4-D).
      description: |
        Returns the authoritative post-start assignment state for the placement:
        existence, `lifecycle_state`, `end_reason` (the ratified discriminator —
        COMPLETED / WORKER_ENDED / CLIENT_ENDED, never collapsed), `started_at` and
        `provenance`. A placement with no ContractAssignment returns
        `{ "assignment": null }` — a coherent absence, never a fabricated row.

        Deliberately carries NO capacity value: this surface is assignment state
        only. Capacity availability is the derived `openings_available` on the
        requisition resource (T4-B2 §6 retired the stored column; availability is
        now `max(openings - active ContractAssignment count, 0)`).

        Guarded by capability `ats` and scope `assignment:read` (the dedicated
        assignment authority — `placement:*` does NOT satisfy it). The placement is
        first loaded under the actor-visibility predicate — a not-found/not-visible/
        cross-tenant placement returns 404 (never 403) before any assignment is read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementAssignmentResponse'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []

  /v1/placements/{id}/permanent:
    get:
      operationId: getPlacementPermanent
      summary: Read the PermanentPlacement guarantee state for a placement (Track 7 / T7-P1).
      description: |
        Returns the first-class PermanentPlacement aggregate for the placement:
        `lifecycle_state` (GUARANTEE_ACTIVE | GUARANTEE_SATISFIED) and the immutable
        guarantee snapshot (window dates, duration, remedy policy, exposure amount +
        currency, provenance). A placement with no PermanentPlacement (e.g. a CONTRACT
        placement) returns `{ "permanent": null }` — a coherent absence, never a
        fabricated row.

        Guarded by capability `ats` and scope `placement:permanent:read` — a DEDICATED
        guarantee authority that `placement:*` / `assignment:*` do NOT satisfy
        (least-visibility). The placement is first loaded under the actor-visibility
        predicate — a not-found / not-visible / cross-tenant placement returns 404
        (never 403) before any guarantee figure is read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementPermanentResponse'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []

  /v1/placements/{id}/permanent/transition:
    post:
      operationId: transitionPlacementPermanent
      summary: Transition the PermanentPlacement guarantee lifecycle (Track 7 / T7-P1).
      description: |
        The ONE generic governed guarantee-lifecycle transition: the target state is in
        the body and the typed transition registry owns legality. P1 ships the single
        legal edge `GUARANTEE_ACTIVE -> GUARANTEE_SATISFIED`, allowed only on/after the
        guarantee end date (calendar). No falloff/remedy path in P1.

        Guarded by capability `ats` and scope `placement:permanent:transition` — a
        DEDICATED authority that `placement:transition` / `placement:activate` /
        `assignment:commercials:write` do NOT satisfy. Tenant-scoped. An absent
        aggregate is `PERMANENT_PLACEMENT_NOT_FOUND` (404); an illegal edge is
        `PERMANENT_PLACEMENT_STATE_INVALID` (422); a premature satisfy is
        `PERMANENT_PLACEMENT_GUARANTEE_WINDOW_INVALID` (422).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermanentPlacementTransitionRequest'
      responses:
        '200':
          description: OK — the updated PermanentPlacement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermanentPlacement'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '422':
          description: Illegal guarantee transition or invalid/unelapsed guarantee window.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []

  /v1/placements/{id}/permanent/falloff:
    post:
      operationId: recordPermanentFalloff
      summary: Record a qualifying permanent-placement falloff (Track 7 / T7-P2).
      description: |
        Records a governed post-start falloff on a `GUARANTEE_ACTIVE` PermanentPlacement:
        an effective calendar date in the half-open guarantee window `[start, end)` and a
        governed `reason` from the closed T7 permanent-falloff registry (exact-match, no
        OTHER). The command atomically transitions `GUARANTEE_ACTIVE -> FELL_OFF` and lands
        directly in the deterministic remedy-due state (`REPLACEMENT_DUE` / `REFUND_DUE` /
        `PRORATED_CREDIT_DUE`) derived from the immutable snapshot remedy policy, creating
        exactly one remedy obligation. FELL_OFF is not a stable externally-observable state.

        Guarded by capability `ats` and scope `placement:permanent:transition`. Tenant-scoped;
        the acting principal is the JWT subject (never the body). Absent aggregate → 404;
        non-active state → `PERMANENT_PLACEMENT_STATE_INVALID` (422); out-of-window →
        `PERMANENT_PLACEMENT_FALLOFF_WINDOW_INVALID` (422); ungoverned reason →
        `PERMANENT_PLACEMENT_FALLOFF_REASON_INVALID` (422).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermanentFalloffRequest'
      responses:
        '200':
          description: OK — the PermanentPlacement now in its deterministic remedy-due state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermanentPlacement'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '422':
          description: Non-active state, out-of-window effective date, or ungoverned falloff reason.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []

  /v1/placements/{id}/permanent/remedy/complete:
    post:
      operationId: completePermanentRemedy
      summary: Complete a permanent-placement remedy obligation with governed evidence (Track 7 / T7-P2).
      description: |
        Resolves the remedy obligation of a PermanentPlacement in a remedy-due state,
        transitioning to `REMEDY_COMPLETED`. Evidence is required and depends on the
        immutable remedy type: `REPLACEMENT` requires `replacement_placement_process_id`
        (a same-tenant, same-requisition, PERMANENT placement that reached `STARTED` —
        evidence linkage only, NOT an E4 predecessor relation, and no replacement is
        auto-created); `REFUND` / `PRORATED_CREDIT` require a bounded `external_reference`
        (a governed settlement/credit reference). Aramo executes NO money movement — it
        records the obligation and a governed completion reference only. The caller never
        supplies the amount; the acting principal is the JWT subject.

        Guarded by capability `ats` and the DEDICATED scope `placement:remedy:resolve`
        (`placement:permanent:transition` does NOT satisfy it). Absent aggregate/remedy →
        404; invalid evidence → `PERMANENT_PLACEMENT_REMEDY_INVALID` (422); already resolved →
        `PERMANENT_PLACEMENT_REMEDY_ALREADY_COMPLETED` (409); not in a due state →
        `PERMANENT_PLACEMENT_STATE_INVALID` (422).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermanentRemedyCompletionRequest'
      responses:
        '200':
          description: OK — the PermanentPlacement now REMEDY_COMPLETED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermanentPlacement'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: The remedy obligation is already completed.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '422':
          description: Not in a remedy-due state, or invalid completion evidence.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []

  /v1/permanent-placement-guarantee-terms/requisitions/{requisitionId}:
    post:
      operationId: createGuaranteeTerms
      summary: Create the initial reusable guarantee-term version for a requisition (Track 7 / T7-P3).
      description: |
        Creates the initial, open (`effective_to = null`) guarantee-term version for a
        requisition — the reusable, placement-owned source of permanent-placement guarantee
        terms, keyed by `(tenant, requisitionId)`. Effective windows are calendar dates,
        half-open `[effective_from, effective_to)`. The version supplies
        `guarantee_duration_days`, `remedy_policy`, `guarantee_exposure_amount` + `currency`,
        and structured provenance (`source_type` ∈ `{MANUAL, IMPORTED}`). At permanent activation
        the version effective as-of the employment start is copied into the immutable
        PermanentPlacement snapshot.

        Guarded by capability `ats` and scope `placement:permanent:terms:write`. Tenant-scoped;
        the recording principal is the JWT subject (never the body). Overlap with an existing
        version → `PERMANENT_PLACEMENT_TERMS_OVERLAP` (409); use `/revise` to supersede.
      parameters:
        - name: requisitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuaranteeTermsCreateRequest'
      responses:
        '201':
          description: Created — the new guarantee-term version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuaranteeTermVersion'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '409':
          description: The effective window overlaps an existing version.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '422':
          description: Invalid effective window, duration, exposure, or currency.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
    get:
      operationId: listGuaranteeTerms
      summary: List the guarantee-term version history for a requisition (Track 7 / T7-P3).
      description: |
        Returns the full guarantee-term version history for the requisition, newest
        `effective_from` first (append-only business history — no separate history model).
        Guarded by capability `ats` and scope `placement:permanent:read`. Tenant-scoped.
      parameters:
        - name: requisitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK — the version history (may be empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuaranteeTermVersionList'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []

  /v1/permanent-placement-guarantee-terms/requisitions/{requisitionId}/effective:
    get:
      operationId: getEffectiveGuaranteeTerms
      summary: Get the guarantee-term version effective at a calendar date (Track 7 / T7-P3).
      description: |
        Returns the single guarantee-term version whose half-open window
        `[effective_from, effective_to)` contains the `as_of` calendar date (defaults to the
        current UTC date). More than one effective version is impossible under the DB exclusion
        constraint and fails closed (`PERMANENT_PLACEMENT_TERMS_AMBIGUOUS`, 500). No effective
        version → `PERMANENT_PLACEMENT_TERMS_NOT_FOUND` (404). Guarded by capability `ats` and
        scope `placement:permanent:read`. Tenant-scoped.
      parameters:
        - name: requisitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: as_of
          in: query
          required: false
          description: Calendar date (yyyy-mm-dd) to resolve the effective version at; defaults to today (UTC).
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK — the effective guarantee-term version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuaranteeTermVersion'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '422':
          description: Malformed as_of date.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []

  /v1/permanent-placement-guarantee-terms/requisitions/{requisitionId}/revise:
    post:
      operationId: reviseGuaranteeTerms
      summary: Revise the current guarantee-term version (first-close + successor, Track 7 / T7-P3).
      description: |
        Governed revision: first-closes the current open version at `effective_from` and inserts
        the successor `[effective_from, null)` atomically. No backdating (`effective_from` must be
        today-or-later and strictly after the current version's start). Nothing open to revise →
        `PERMANENT_PLACEMENT_TERMS_NOT_FOUND` (404). Future-version cancellation is NOT part of
        T7-P3.

        Guarded by capability `ats` and scope `placement:permanent:terms:write`. Tenant-scoped;
        the recording principal is the JWT subject (never the body).
      parameters:
        - name: requisitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuaranteeTermsReviseRequest'
      responses:
        '201':
          description: Created — the successor guarantee-term version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuaranteeTermVersion'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: The effective window overlaps an existing version.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '422':
          description: Backdated or otherwise invalid effective window, duration, exposure, or currency.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []

  /v1/placements/{id}/assignment/commercials:
    get:
      operationId: getPlacementAssignmentCommercials
      summary: Read the commercial projection (rates + derived margin) of a placement's assignment (Track 5 / T5-P2).
      description: |
        Returns the CURRENT effective commercial terms of the placement's
        ContractAssignment — the stored actuals (`pay_rate_amount`, `bill_rate_amount`,
        `currency`, `rate_period`) plus the DEC-5 derived views (`spread_amount`,
        `margin_percent`, `markup_percent`), computed on read. Money and percentages
        are scale-2 decimal strings (never float); `margin_percent` / `markup_percent`
        are null on a zero denominator (bill=0 / pay=0). A placement with no assignment
        or no active commercial version returns `{ "commercials": null }` — a coherent
        absence, never a fabricated row.

        Guarded by scope `assignment:commercials:read` — a DEDICATED financial scope
        that `assignment:read` / `placement:read` / `requisition:read` do NOT satisfy
        (least-visibility). The placement is first loaded under the actor-visibility
        predicate — a not-found / not-visible / cross-tenant placement returns 404
        (never 403) before any commercial figure is read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentCommercialResponse'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []

  # Track 6 / T6-B2 — the governed post-start commercial-revision surface.
  /v1/placements/{id}/assignment/commercials/revisions:
    post:
      operationId: createAssignmentCommercialRevision
      summary: Create a governed post-start commercial revision (Track 6 / T6-B2).
      description: |
        Appends a new commercial version to the OPEN tail of the assignment's
        commercial sequence: the current open window is first-closed at the resolved
        effective instant and the successor opened at that same instant, atomically.
        Open-tail ONLY — inserting between, or re-closing, an already-bounded version is
        refused (deferred to a later slice). Permitted only while the ContractAssignment
        is ACTIVE.

        Guarded by the DEDICATED write scope `assignment:commercials:write` (a post-start
        enforcement site): `assignment:commercials:read`, `placement:*`, and
        `assignment:update` do NOT satisfy it. `recorded_by` is the authenticated
        subject — never the request body. `effective_from` is optional; omitted means the
        server "now" instant (used for BOTH the close and the open). A supplied instant
        in the past is refused (400). A requested instant that overlaps or duplicates an
        existing effective window is refused 409 `ASSIGNMENT_COMMERCIAL_REVISION_CONFLICT`
        (`details.reason`: `window_overlap` | `duplicate_effective_from`). An absent /
        not-ACTIVE / no-open-version assignment is 404 (never 403).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommercialRevisionRequest'
      responses:
        '201':
          description: Created — the new current commercial version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentCommercialCreatedResponse'
        '400':
          description: Validation error (malformed money / currency / rate_period, effective_from in the past or not after the current version start).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: The revision conflicts with an existing effective commercial window (details.reason = window_overlap | duplicate_effective_from).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
    get:
      operationId: listAssignmentCommercialRevisions
      summary: List the commercial version series of a placement's assignment (Track 6 / T6-B2).
      description: |
        Returns the non-cancelled commercial version series (historical + current +
        future) for the placement's assignment, ordered by `effective_from` DESC. Each
        item carries the stored actuals + DEC-5 derived views (computed on read). A
        visible placement with no assignment / no versions returns `{ "items": [] }`.

        Guarded by `assignment:commercials:read` (the DEDICATED financial scope — least
        visibility). The placement is first loaded under the actor-visibility predicate;
        a not-found / not-visible / cross-tenant placement returns 404 (never 403).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentCommercialSeriesResponse'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []

  # Track 6 / T6-B3 — governed cancellation of a FUTURE open-tail commercial revision.
  /v1/placements/{id}/assignment/commercials/revisions/{revisionId}/cancel:
    post:
      operationId: cancelAssignmentCommercialRevision
      summary: Cancel a future open-tail commercial revision (Track 6 / T6-B3).
      description: |
        Withdraws a NOT-YET-EFFECTIVE commercial revision: the target version (the
        future open tail) is cancelled and its predecessor re-opened to `[start, ∞)`,
        atomically, restoring schedule continuity with no gap and no historical rewrite.

        Eligible ONLY when the target is simultaneously on an ACTIVE assignment, not
        already cancelled, starts strictly in the future, and is the open tail
        (`effective_to` is null). Historical, current, bounded/interior future, and
        already-cancelled versions — and any version on an ENDED assignment — are refused.

        Guarded by the DEDICATED write scope `assignment:commercials:write` (§13):
        `assignment:commercials:read`, `placement:*`, and `assignment:update` do NOT
        satisfy it. `cancelled_by` is the authenticated subject — never the request body.
        The placement is loaded under the actor-visibility predicate; a not-found /
        not-visible / cross-tenant placement or an unknown revision returns 404 (never
        403). An ineligible target is refused 409 `ASSIGNMENT_COMMERCIAL_REVISION_CONFLICT`
        (`details.reason`: `already_cancelled` | `revision_not_future` |
        `cancellation_would_create_gap`). The response is the refreshed non-cancelled
        commercial series — cancellation metadata is never returned in the normal series.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommercialRevisionCancelRequest'
      responses:
        '200':
          description: OK — the refreshed non-cancelled commercial series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentCommercialSeriesResponse'
        '400':
          description: Validation error (missing or non-user-selectable cancellation_reason_code).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: The target is not an eligible future open tail (details.reason = already_cancelled | revision_not_future | cancellation_would_create_gap).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []

  # Slice #4 — Commercial Approval. The CommercialRevisionProposal governance
  # surface IN FRONT OF the revision write (proposal = INTENT, approval =
  # AUTHORITY, AssignmentRateVersion = APPLIED FINANCIAL TRUTH).
  /v1/placements/{id}/assignment/commercials/proposals:
    post:
      operationId: createCommercialProposal
      summary: Propose the next commercial revision (Slice #4 Commercial Approval).
      description: |
        Creates a DRAFT `CommercialRevisionProposal` capturing the PROPOSED commercial
        terms (INTENT). It NEVER writes an AssignmentRateVersion — the applied truth is
        untouched until the proposal reaches APPLIED. Permitted only while the
        ContractAssignment is ACTIVE and has an open current version to revise.

        Guarded by `assignment:commercials:write` (propose is a proposer act; approval is
        a SEPARATE authority — `assignment:commercials:approve`). `requested_by` is the
        authenticated subject. Absent / not-ACTIVE / no-open-version → 404. A live
        (non-terminal) proposal already present for the assignment → 409
        `COMMERCIAL_PROPOSAL_ALREADY_LIVE` (one-live invariant).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommercialProposalRequest'
      responses:
        '201':
          description: Created — the DRAFT proposal with its derived margin comparison.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialProposalResponse'
        '400':
          description: Validation error (malformed money / currency / rate_period / effective_from / reason).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: A live commercial proposal already exists for this assignment (COMMERCIAL_PROPOSAL_ALREADY_LIVE).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
    get:
      operationId: listCommercialProposals
      summary: List the assignment's commercial proposals (Slice #4 Commercial Approval).
      description: |
        Returns the assignment's `CommercialRevisionProposal` rows (newest first), each
        with the derived current-vs-proposed margin comparison (computed on read, never
        stored). Guarded by `assignment:commercials:read` (financial scope, least
        visibility). The placement is first loaded under the actor-visibility predicate;
        a not-found / not-visible / cross-tenant placement returns 404 (never 403).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialProposalListResponse'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []

  /v1/placements/{id}/assignment/commercials/proposals/{proposalId}:
    get:
      operationId: getCommercialProposal
      summary: Read one commercial proposal (Slice #4 Commercial Approval).
      description: |
        Returns a single `CommercialRevisionProposal` with its derived margin comparison.
        A coherent absence (visible placement, unknown proposal) returns
        `{ "proposal": null }`. Guarded by `assignment:commercials:read`; least visibility
        as the list.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: proposalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK — the proposal, or null when unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialProposalNullableResponse'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []
    patch:
      operationId: transitionCommercialProposal
      summary: Proposer lifecycle transition — submit / withdraw (Slice #4 Commercial Approval).
      description: |
        Advances a proposal along a PROPOSER edge: `submit` (DRAFT → PENDING_REVIEW) or
        `withdraw` (any open state → WITHDRAWN). Guarded by `assignment:commercials:write`
        (no approval authority, no segregation-of-duties). An illegal edge is refused 422
        `COMMERCIAL_PROPOSAL_STATE_INVALID`. The placement is loaded under the
        actor-visibility predicate (404, never 403).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: proposalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommercialProposalTransitionRequest'
      responses:
        '200':
          description: OK — the updated proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialProposalResponse'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '422':
          description: Illegal proposal transition (COMMERCIAL_PROPOSAL_STATE_INVALID).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []

  /v1/placements/{id}/assignment/commercials/proposals/{proposalId}/decision:
    post:
      operationId: decideCommercialProposal
      summary: Exercise commercial authority — margin-approve / client-approve / apply / reject (Slice #4).
      description: |
        Applies an AUTHORITY decision to a proposal: `margin_approve` (PENDING_REVIEW →
        PENDING_CLIENT_APPROVAL), `client_approve` (→ APPROVED, capturing provenance-bearing
        client-approval evidence), `apply` (APPROVED → APPLIED, reusing the governed
        createCommercialRevision to materialise the AssignmentRateVersion), or `reject`
        (→ REJECTED).

        Guarded by the SEPARATE authority scope `assignment:commercials:approve`. Enforces
        segregation of duties (fail-closed): the actor may NOT equal the proposer → 403
        `COMMERCIAL_PROPOSAL_SELF_APPROVAL`. Governed by an ADR-0024 fail-closed policy — no
        published package → 403 `POLICY_DENIED`. On `apply`, a window conflict from
        createCommercialRevision is 409 `ASSIGNMENT_COMMERCIAL_REVISION_CONFLICT` and leaves
        the proposal APPROVED (reconciliation). An illegal edge → 422
        `COMMERCIAL_PROPOSAL_STATE_INVALID`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: proposalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommercialProposalDecisionRequest'
      responses:
        '200':
          description: OK — the updated proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialProposalResponse'
        '403':
          description: Insufficient permissions, segregation-of-duties self-approval, or fail-closed policy denial.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: Apply-time commercial window conflict (ASSIGNMENT_COMMERCIAL_REVISION_CONFLICT); the proposal remains APPROVED.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '422':
          description: Illegal proposal transition (COMMERCIAL_PROPOSAL_STATE_INVALID).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []

  # Track 8 / T8-P2 — provider-neutral canonical requisition ingestion.
  /v1/requisition-imports:
    get:
      operationId: listRequisitionImports
      summary: List canonical requisition-import batches for the tenant (Track 8 / T8-P2).
      description: |
        Returns the tenant's requisition-import batches (ImportBatch rows with
        target_entity=requisition), newest first, bounded at 200. Optional
        narrowing by `site_id`. Requires the `ats` capability and the
        `requisition:import:read` scope. tenant_id is derived from the JWT.
      parameters:
        - name: site_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequisitionImportList'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
    post:
      operationId: runRequisitionImport
      summary: Run a provider-neutral canonical requisition import (Track 8 / T8-P2).
      description: |
        Validates + maps provider-neutral CanonicalRequisitionImportRecords and
        creates requisitions through the governed import path, reusing the
        reversible ImportBatch substrate. tenant_id is derived from the JWT.
        Requires the `requisition:import:write` scope. CREATE-only,
        transport-neutral, provider-neutral: no provider credential/config is
        accepted. A re-imported external identity (tenant + source_system +
        external_req_id) is deterministically rejected (recorded as a per-record
        failure), never updated in place. Refusals:
          - 400 VALIDATION_ERROR — the request envelope fails validation.
          - 403 INSUFFICIENT_PERMISSIONS — caller lacks `requisition:import:write`.
          - 422 IMPORT_THRESHOLD_EXCEEDED — per-record failures exceeded the
            configured threshold; the whole batch was rolled back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequisitionImportRequest'
      responses:
        '201':
          description: Created (committed or partially_committed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchView'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '422':
          description: Import rejected (failure threshold exceeded).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
  /v1/requisition-imports/{id}:
    get:
      operationId: getRequisitionImport
      summary: Get a canonical requisition-import batch by id (Track 8 / T8-P2).
      description: |
        Returns a single requisition-import batch in the tenant. A batch that is
        absent or belongs to another tenant returns 404 (tenant-safe; existence
        is never disclosed). Requires the `requisition:import:read` scope.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchView'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []

  /v1/placements/{id}/assignment/end:
    post:
      operationId: endPlacementAssignment
      summary: End the ContractAssignment of a started placement (Track 4 / T4-D).
      description: |
        Transitions a placement's ContractAssignment ACTIVE -> ENDED with the ratified
        end reason (COMPLETED / WORKER_ENDED / CLIENT_ENDED). Gated by the DEDICATED
        `assignment:end` authority (capability `ats`) — `placement:*` does NOT satisfy it
        (§7). The repository writes the state flip and the `placement.assignment.ended`
        outbox event atomically. The placement is loaded under the actor-visibility
        predicate first — a not-found / not-visible / cross-tenant placement returns 404
        (never 403). Ending a non-ACTIVE assignment is refused with 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [end_reason]
              properties:
                end_reason:
                  type: string
                  enum: [COMPLETED, WORKER_ENDED, CLIENT_ENDED]
      responses:
        '200':
          description: Assignment ended.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: The assignment is not in an ACTIVE state (already ended or never started).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []

  /v1/placements/{id}/assignment/extend:
    post:
      operationId: extendPlacementAssignment
      summary: Extend the ContractAssignment planned end (Assignment-Extension slice #3).
      description: |
        Moves an ACTIVE assignment's `expected_end_at` STRICTLY FORWARD, with NO lifecycle
        transition (ACTIVE stays ACTIVE — extension is an event, never a state) and no
        capacity effect (capacity derives from the ACTIVE count). Gated by the DEDICATED
        `assignment:extend` authority (capability `ats`) — SEPARATE from `assignment:end`;
        `placement:*` / `assignment:end` / `assignment:update` do NOT satisfy it. The
        repository appends an immutable AssignmentExtension history row, updates
        `expected_end_at`, and emits `placement.assignment.extended` atomically. Refusals:
        404 (no active assignment / not visible / cross-tenant); 422
        ASSIGNMENT_EXTENSION_NOT_FORWARD (new end not in the future, or not strictly after
        the current end).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [new_expected_end_at, reason]
              properties:
                new_expected_end_at:
                  type: string
                  format: date-time
                reason:
                  type: string
                  enum: [CLIENT_REQUEST, PROJECT_EXTENSION, RENEWAL, SCOPE_CONTINUATION]
                comment:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: Assignment extended — the fresh assignment view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractAssignmentView'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '422':
          description: The new planned end is not strictly forward.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
  /v1/placements/{id}/assignment/convert-to-permanent:
    post:
      operationId: convertPlacementAssignmentToPermanent
      summary: Convert a started contract placement to a permanent placement (Track 7 / T7-PX).
      description: |
        ONE atomic command that ends the ACTIVE `ContractAssignment` (end reason
        `CONVERTED_TO_PERMANENT` — a genuine domain value, NOT attrition) and mints a NEW
        `PERMANENT` PlacementProcess plus its `GUARANTEE_ACTIVE` PermanentPlacement in the
        same placement-domain transaction. `{id}` is the SOURCE contract PlacementProcess id.
        Authority is the EXACT conjunction `assignment:end` AND `placement:permanent:transition`
        (capability `ats`; authoritative tier only — recruiter excluded). There is NO request
        body: `guarantee_start_date` is derived (the UTC calendar date of the conversion
        instant), the guarantee terms come from the governed stored guarantee-term version
        effective on that date (no caller-supplied money/policy), the end reason is fixed, and
        the actor is the JWT subject. Idempotent: converting an already-converted source
        replays the same target. Capacity holds exactly one consumer across the commit. The
        response carries the NEW permanent PlacementProcess id so the client can navigate to it.
        Not-found / not-started source or no-active-assignment returns 404/422; missing governed
        guarantee terms fail closed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Conversion performed (or replayed for an already-converted source).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - replayed
                  - source_placement_process_id
                  - source_contract_assignment_id
                  - target_placement_process_id
                  - target_permanent_placement_id
                properties:
                  replayed:
                    type: boolean
                    description: True when an already-converted source returned its existing target (idempotent replay).
                  source_placement_process_id:
                    type: string
                    format: uuid
                  source_contract_assignment_id:
                    type: string
                    format: uuid
                  target_placement_process_id:
                    type: string
                    format: uuid
                    description: The NEW permanent PlacementProcess id — navigate here to view the guarantee.
                  target_permanent_placement_id:
                    type: string
                    format: uuid
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '422':
          description: The source placement is not STARTED, or no governed guarantee terms are effective for the requisition at the conversion date.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []

  /v1/webhooks/indeed/apply:
    post:
      operationId: indeedApplyWebhook
      summary: Inbound Indeed Apply webhook (external partner, HMAC-authenticated).
      description: |
        External partner (Indeed) inbound webhook — surface class XP. There is NO Aramo
        session and therefore NO bearer token; the SOLE authority is the `X-Indeed-Signature`
        HMAC over the exact raw request body (R5). Ships DARK by construction: until the
        webhook signing secret is provisioned the endpoint refuses all traffic with 503.
        The raw body is preserved by a route-scoped raw parser and the consumed-field subset
        is validated in the service, not by schema — so the request body is an opaque
        Indeed-defined JSON document (the exact bytes that were signed).
      security:
        - IndeedHmacSignature: []
      requestBody:
        required: true
        description: The raw Indeed Apply JSON payload (opaque; the signed bytes).
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Received and accepted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [received]
                properties:
                  received:
                    type: boolean
                    enum: [true]
        '401':
          description: Missing or invalid X-Indeed-Signature HMAC.
        '503':
          description: Webhook dark — signing secret not provisioned.

  /v1/webhooks/communications/zoom:
    post:
      operationId: zoomCommunicationsWebhook
      summary: Inbound Zoom Phone webhook (external provider, HMAC-authenticated).
      description: |
        External provider (Zoom) inbound webhook — surface class XP (COMM-B6). There is
        NO Aramo session and therefore NO bearer token; the SOLE authority is the
        `x-zm-signature` HMAC-SHA256 over `v0:{x-zm-request-timestamp}:{raw body}`, with a
        freshness window on the timestamp. Ships DARK by construction: until the signing
        secret reference resolves the endpoint refuses all traffic with 503. Tenant is
        resolved ONLY after signature verification, from the SIGNED account identity mapped
        to an IntegrationConnection. The webhook UPDATES a known outbound interaction; it
        never creates one, and unknown/unmatched/unsupported events are durably accounted
        for in the provider-event inbox without mutating any communication record. Every
        outcome is a bare status (external machine ingress, not the Aramo client error
        contract); the 204 is uniform across processed/unmatched/unknown-account to avoid
        any existence oracle. The raw body is preserved by a route-scoped raw parser (the
        exact signed bytes); the request body is an opaque Zoom-defined JSON document.
      security:
        - ZoomHmacSignature: []
      requestBody:
        required: true
        description: The raw Zoom webhook JSON payload (opaque; the signed bytes).
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: endpoint.url_validation challenge response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [plainToken, encryptedToken]
                properties:
                  plainToken:
                    type: string
                  encryptedToken:
                    type: string
        '204':
          description: Accepted (processed, duplicate, unsupported, unmatched, or unknown account).
        '400':
          description: Malformed body after a valid signature.
        '401':
          description: Missing, invalid, or stale x-zm-signature HMAC.
        '503':
          description: Webhook dark — signing secret reference not resolvable.

  /v1/reports/fill-performance:
    get:
      operationId: getFillPerformanceReport
      summary: Fill rate + time-to-fill operational report (T9-B1).
      description: |
        Authoritative T9 fill-rate and time-to-fill for the cohort of
        requisitions created within [from, to). Fill authority is ATS
        pipeline terminal `placed` (distinct talents per requisition, clamped
        to declared openings); fill_rate = round(Σ filled_openings / Σ
        openings * 100), null when the cohort has no openings. Time-to-fill is
        measured ONLY for fully-filled requisitions: created_at → the Nth
        distinct talent's first `placed` transition (N = openings). `canceled`
        requisitions are excluded from numerator and denominator. Tenant /
        site / A3 visibility scoped; report:read.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: |
            Inclusive period start. An absolute ISO 8601 date-time carrying
            `Z` or an explicit numeric offset; date-only and zone-less values
            are rejected 400. Cohort predicate: Requisition.created_at >= from.
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: |
            Exclusive period end (half-open [from, to)). Same absolute
            date-time rules as `from`; must be strictly after `from`.
        - name: site_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Optional site narrowing (must match the actor's site claim).
      responses:
        '200':
          description: Fill-rate + time-to-fill metrics for the period cohort.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FillPerformanceReport'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
      security:
        - BearerAuth: []

  /v1/reports/guarantee-exposure:
    get:
      operationId: getGuaranteeExposureReport
      summary: Permanent-placement guarantee-exposure summary report (T7-P4).
      description: |
        Authoritative T7 guarantee-exposure summary for the cohort of permanent
        placements whose activation instant `created_at` ∈ [from, to). Historical
        exposure is sourced ONLY from the immutable PermanentPlacement activation
        snapshot (`guarantee_exposure_amount` + `guarantee_exposure_currency`); a
        later guarantee-terms revision never changes an older placement's value.
        Monetary values are returned ONLY in per-currency buckets (scale-2 decimal
        strings) — never summed across currencies and never FX-converted. Counts may
        be cross-currency. `remedy_obligation_by_currency` totals are OBLIGATIONS
        (owed), never paid/settled amounts; REPLACEMENT is count-only. Summary-only
        (no row-level ids / PII). Tenant / site / A3 visibility scoped; report:read.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: |
            Inclusive period start. An absolute ISO 8601 date-time carrying
            `Z` or an explicit numeric offset; date-only and zone-less values
            are rejected 400. Cohort predicate: PermanentPlacement.created_at >= from.
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: |
            Exclusive period end (half-open [from, to)). Same absolute
            date-time rules as `from`; must be strictly after `from`.
        - name: site_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Optional site narrowing (must match the actor's site claim).
      responses:
        '200':
          description: Guarantee-exposure summary for the period cohort.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuaranteeExposureReport'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
      security:
        - BearerAuth: []

  /v1/reports/fallthrough:
    get:
      operationId: getFallthroughReport
      summary: Fallthrough rate + reasons operational report (T9-B2).
      description: |
        Authoritative T9 fallthrough rate + reasons, placement-attempt level and
        post-acceptance/pre-start ONLY. Cohort = PlacementProcess attempts whose
        FIRST OFFER_ACCEPTED transition ∈ [from, to). `accepted_attempts` is the
        denominator; `fallthrough_attempts` counts those that later terminate in
        FELL_THROUGH or NO_SHOW only (offer-decline/rescind, submittal, pipeline,
        requisition closure and post-start assignment ending are excluded).
        `fallthrough_rate` = round(fallthrough / accepted * 100), null when
        accepted_attempts == 0. `reasons` groups by the canonical placement reason
        (reason_code + reason_label); terminals with no persisted reason group into
        a report-only null / "Unspecified" bucket. reason_detail (PII) is never
        exposed. Tenant / site / A3 visibility scoped; report:read.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: |
            Inclusive period start. Absolute ISO 8601 date-time carrying `Z` or an
            explicit offset; date-only / zone-less values are rejected 400. Cohort
            predicate: first OFFER_ACCEPTED transition >= from.
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: |
            Exclusive period end (half-open [from, to)); same absolute date-time
            rules as `from`; must be strictly after `from`.
        - name: site_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Optional site narrowing (must match the actor's site claim).
      responses:
        '200':
          description: Fallthrough rate + reason breakdown for the period cohort.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FallthroughReport'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
      security:
        - BearerAuth: []

  # T8-CONNECTOR-A — provider-neutral connector connection MANAGEMENT
  # (Settings → Integrations). `integration:read` governs visibility;
  # `integration:write` governs mutations. NO response ever exposes secret_ref,
  # an AWS identifier, or credential material; credential set is a dedicated
  # write-only endpoint. Provider-neutral: no provider name/transport/OAuth/
  # webhook/SFTP/polling/run-now.
  /v1/communications/capabilities:
    get:
      operationId: getCommunicationCapabilities
      summary: Read the tenant's communications provider capabilities.
      description: |
        Provider-neutral capability descriptor for the tenant's communications
        provider (COMM-V1). Requires the `ats` capability and the
        `communication:read` scope. 409 COMMUNICATION_PROVIDER_NOT_CONFIGURED
        when no communications provider is configured.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationCapabilities'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
      security:
        - BearerAuth: []
  /v1/communications/me/provider-identity:
    get:
      operationId: getMyCommunicationProviderIdentity
      summary: Read the calling recruiter's communications provider identity.
      description: |
        The caller's own provider-identity mapping (COMM-V1). Requires the `ats`
        capability and the `communication:read` scope. 404
        COMMUNICATION_USER_NOT_MAPPED when the caller has no mapping.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationProviderIdentity'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []
  /v1/communications/provider-identities:
    get:
      operationId: listCommunicationProviderIdentities
      summary: List the tenant's communications provider-identity mappings (admin).
      description: |
        Admin list of recruiter↔provider-user mappings on the tenant's provider
        connection (COMM-V1). Requires the `ats` capability and the
        `integration:read` scope. 409 COMMUNICATION_PROVIDER_NOT_CONFIGURED when
        no provider connection is configured for the tenant.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationProviderIdentityList'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
      security:
        - BearerAuth: []
  /v1/communications/provider-identities/{recruiterId}:
    put:
      operationId: upsertCommunicationProviderIdentity
      summary: Bind or rebind a recruiter to a provider user (admin).
      description: |
        Upsert a recruiter's provider-identity mapping on the tenant's provider
        connection (COMM-V1). Requires the `ats` capability and the
        `integration:write` scope. 409 COMMUNICATION_PROVIDER_NOT_CONFIGURED (no
        connection) or COMMUNICATION_PROVIDER_USER_ALREADY_MAPPED (the provider
        user is already mapped to a different recruiter on this connection).
      parameters:
        - name: recruiterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProviderIdentityRequest'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationProviderIdentity'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
      security:
        - BearerAuth: []
  /v1/communications/calls:
    post:
      operationId: initiateCommunicationCall
      summary: Initiate an outbound voice call from a Talent record.
      description: |
        Initiate an outbound voice call to a Talent's phone number. Requires the
        `ats` capability and the `communication:voice:call` scope.

        The server resolves the destination number from the Talent record's
        selected `phone_slot` (an arbitrary client-supplied number is NOT
        accepted) and normalizes it to E.164; an un-normalizable number is
        refused. A fail-closed contacting-consent gate runs BEFORE any provider
        side effect. On success the interaction is created and transitioned to
        `initiated`; a provider launch that fails before ringing is recorded as
        `failed`.

        Refusals:
          - 400 VALIDATION_ERROR — body/path invariants, or a missing/malformed
            Idempotency-Key.
          - 403 COMMUNICATION_CALL_CONSENT_DENIED — the contacting-consent
            decision was not allowed (denial or fail-closed system failure; the
            distinction is retained in audit only).
          - 404 NOT_FOUND — the Talent record is absent or cross-tenant.
          - 404 COMMUNICATION_USER_NOT_MAPPED — the calling recruiter has no
            provider-identity mapping.
          - 409 COMMUNICATION_PROVIDER_NOT_CONFIGURED — no usable provider
            connection for the tenant.
          - 409 IDEMPOTENCY_KEY_CONFLICT — same Idempotency-Key, different body.
          - 422 COMMUNICATION_CALL_NOT_INITIABLE — no dialable number on file for
            the slot, an un-normalizable destination, an unknown `regarding`
            requisition, or a provider launch that failed before ringing.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: |
            UUID idempotency key. Same key + same body returns the prior
            response; same key + different body returns 409
            IDEMPOTENCY_KEY_CONFLICT. Missing or non-UUID returns 400
            VALIDATION_ERROR. Required because call initiation has an external
            side effect and must not dial twice on retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateCommunicationCallRequest'
      responses:
        '201':
          description: Call interaction created and transitioned to `initiated`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationInteractionView'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
      security:
        - BearerAuth: []
  /v1/communications/interactions/{interactionId}:
    get:
      operationId: getCommunicationInteraction
      summary: Read a communication interaction by id.
      description: |
        A single communication interaction (the canonical calling record),
        tenant-scoped. Requires the `ats` capability and the `communication:read`
        scope. 404 COMMUNICATION_INTERACTION_NOT_FOUND when absent or cross-tenant.
      parameters:
        - name: interactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationInteractionView'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []
  /v1/communications/interactions/{interactionId}/disposition:
    post:
      operationId: recordCommunicationDisposition
      summary: Record a disposition (append-only) on a communication interaction.
      description: |
        Record a post-call disposition on an interaction (COMM-B7). Requires the
        `ats` capability and `communication:disposition:write`. When `notes` is
        present and non-blank the caller MUST additionally hold
        `communication:notes:write` (else 403). Append-only history (no
        upsert/replace). State-agnostic — a disposition may be recorded against
        any existing interaction. `do_not_contact` is a RECORDED OUTCOME ONLY and
        never mutates consent or any suppression flag in V1. 404
        COMMUNICATION_INTERACTION_NOT_FOUND when the interaction is absent or
        cross-tenant (tenant-safe, no disclosure).
      parameters:
        - name: interactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCommunicationDispositionRequest'
      responses:
        '201':
          description: Disposition recorded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []
  /v1/communications/interactions/{interactionId}/provider-reference:
    post:
      operationId: attachCommunicationProviderReference
      summary: Attach the provider correlation id captured post-dial (COMM-B8).
      description: |
        After the embedded Zoom call surface yields a real provider identifier,
        the client attaches it to the already-created interaction — closing the
        dial-time correlation gap so an inbound webhook can match. Requires the
        `ats` capability and `communication:voice:call` (the same recruiter action
        as the call). At least one of the three canonical correlation ids must be
        present (else 400 VALIDATION_ERROR). It NEVER changes interaction state,
        lifecycle timestamps, disposition, or associations. Tenant+owner-safe: the
        interaction must belong to the tenant AND have been initiated by the
        caller, else 404 COMMUNICATION_INTERACTION_NOT_FOUND (no disclosure).
        CONVERGENT-or-conflict: filling a null field or re-attaching the same value
        succeeds; attempting to REPLACE a populated field with a different value is
        refused 409 COMMUNICATION_PROVIDER_REFERENCE_CONFLICT (correlation
        integrity). No external side effect — no Idempotency-Key.
      parameters:
        - name: interactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachProviderReferenceRequest'
      responses:
        '200':
          description: Provider reference attached (or convergent no-op).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
      security:
        - BearerAuth: []
  /v1/talents/{talentId}/communications:
    get:
      operationId: getTalentCommunicationTimeline
      summary: The Talent communication timeline (keyset-paginated).
      description: |
        A talent's communication interactions (COMM-B7), newest first
        (created_at DESC, id DESC), each carrying its disposition history
        (dispositioned_at DESC, id DESC). Requires the `ats` capability and
        `communication:read`. Reads DIRECT from communications associations — no
        Activity projection, no provider raw payload. Keyset-paginated. An unknown
        talent, or one with no communications, is a 200 empty page — NEVER a 404.
      parameters:
        - name: talentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Page size (1..200, default 50).
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque keyset cursor from a prior page's next_cursor.
      responses:
        '200':
          description: OK (possibly empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TalentCommunicationTimelineResponse'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
      security:
        - BearerAuth: []
  /v1/integrations:
    get:
      operationId: listIntegrationConnections
      summary: List connector connections (T8-CONNECTOR-A).
      description: Returns the tenant's connector connections (secret-free view). Guarded by `integration:read`.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationConnectionListResponse'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
      security:
        - BearerAuth: []
    post:
      operationId: createIntegrationConnection
      summary: Create a connector connection (T8-CONNECTOR-A).
      description: Creates a connection in `disconnected` state. Guarded by `integration:write`. No credential is accepted here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntegrationConnectionRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationConnectionView'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
      security:
        - BearerAuth: []
  /v1/integrations/{id}:
    get:
      operationId: getIntegrationConnection
      summary: Get a connector connection, secret-free (T8-CONNECTOR-A).
      description: Returns a single connector connection (secret-free view). Guarded by `integration:read`. A cross-tenant / absent id returns 404 (never 403).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationConnectionView'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []
    patch:
      operationId: updateIntegrationConnection
      summary: Update non-secret connection metadata (T8-CONNECTOR-A).
      description: Updates non-secret connection metadata. Guarded by `integration:write`. Never accepts credential material.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIntegrationConnectionRequest'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationConnectionView'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []
  /v1/integrations/{id}/credential:
    post:
      operationId: setIntegrationConnectionCredential
      summary: Set a connection credential, write-only (T8-CONNECTOR-A).
      description: |
        Stores the credential in AWS Secrets Manager under a server-derived id and
        transitions the connection to `configured`. The value is NEVER persisted to
        the database, echoed, or returned. Guarded by `integration:write`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetIntegrationCredentialRequest'
      responses:
        '200':
          description: OK. Returns the secret-free view (no credential echoed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationConnectionView'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []
  /v1/integrations/{id}/enable:
    post:
      operationId: enableIntegrationConnection
      summary: Enable a connector connection (T8-CONNECTOR-A).
      description: Transitions a configured/degraded/disabled connection to active. Guarded by `integration:write`. Fails 409 when no credential is configured.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationConnectionView'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: The connection cannot be enabled in its current state (e.g. no credential configured) — code CONNECTOR_CONFIGURATION_INVALID.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
  /v1/integrations/{id}/disable:
    post:
      operationId: disableIntegrationConnection
      summary: Disable a connector connection, history preserved (T8-CONNECTOR-A).
      description: Administratively disables a connection while preserving execution/audit history. Guarded by `integration:write`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationConnectionView'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: Illegal lifecycle transition — code CONNECTOR_CONFIGURATION_INVALID.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
  /v1/integrations/{connectionId}/pipeline-provider-mappings:
    get:
      operationId: listPipelineProviderMappings
      summary: List a connection's active PIPELINE provider-disposition mappings (L2-I D1).
      description: Returns the connection's ACTIVE mapping-set rows (provider_token → canonical Pipeline action/reason). Guarded by `integration:read`. A cross-tenant / absent connection returns 404 (never 403).
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [provider_token, disposition, mapped_target, target_kind]
                      properties:
                        provider_token: { type: string }
                        disposition: { type: string, enum: [EXECUTE_ACTION, IGNORE] }
                        mapped_target: { type: [string, 'null'] }
                        target_kind: { type: [string, 'null'], enum: [action, reason, null] }
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []
    post:
      operationId: authorPipelineProviderMapping
      summary: Author a PIPELINE provider-disposition mapping row (L2-I D1).
      description: >-
        Authors (upserts) one provider_token → canonical Pipeline target mapping into the
        connection's active set. The target must be a canonical recruiter ACTION or a non-system
        RECRUITER/TALENT/ENGAGEMENT disposition REASON; system-only COMPLETE and DOWNSTREAM_OUTCOME
        reasons are rejected (422 PIPELINE_PROVIDER_MAPPING_TARGET_INVALID). Guarded by the narrow
        `integration:pipeline-mapping:write`. A cross-tenant / absent connection returns 404.
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_token]
              properties:
                provider_token: { type: string }
                mapped_target: { type: string }
                disposition: { type: string, enum: [EXECUTE_ACTION, IGNORE] }
                authority_mode: { type: string, enum: [external_authority, dual_control] }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [authored] }
        '400':
          description: Validation error (missing provider_token).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '422':
          description: Non-canonical / system-only / DOWNSTREAM_OUTCOME target — code PIPELINE_PROVIDER_MAPPING_TARGET_INVALID.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
  /v1/integrations/{connectionId}/requisition-lifecycle-mappings:
    get:
      operationId: listLifecycleMappingSets
      summary: List a connection's versioned lifecycle mapping sets (L1-D3-A).
      description: Returns the connection's mapping sets (draft / active / historical), newest version first. Guarded by `integration:read`. A cross-tenant / absent connection returns 404 (never 403).
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleMappingSetListResponse'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []
  /v1/integrations/{connectionId}/requisition-lifecycle-mappings/versions:
    post:
      operationId: createLifecycleMappingDraft
      summary: Create a new DRAFT mapping set version (L1-D3-A).
      description: Creates a draft at version max+1 with the supplied rows. EXECUTE_ACTION rows carry one of the four external actions (REOPEN, PUT_ON_HOLD, CLOSE, CANCEL); IGNORE rows carry no action. Guarded by `integration:write`.
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleMappingRowsRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleMappingSetDetail'
        '400':
          description: Validation error (unknown field, illegal disposition/action pairing).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '422':
          description: Mapping rows failed validation — code MAPPING_SET_INVALID.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
  /v1/integrations/{connectionId}/requisition-lifecycle-mappings/active:
    get:
      operationId: getActiveLifecycleMappingSet
      summary: Get the connection's ACTIVE mapping set (L1-D3-A).
      description: Returns the single active mapping set the runtime resolves against. Guarded by `integration:read`. 404 when no active set exists or the connection is invisible.
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleMappingSetDetail'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []
  /v1/integrations/{connectionId}/requisition-lifecycle-mappings/versions/{version}:
    get:
      operationId: getLifecycleMappingSetVersion
      summary: Get a specific mapping set version (L1-D3-A).
      description: Returns the mapping set at the given version (draft / active / historical) with its rows. Guarded by `integration:read`. A cross-tenant / absent connection or version returns 404 (never 403).
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleMappingSetDetail'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []
    put:
      operationId: replaceLifecycleMappingDraft
      summary: Replace the rows of a DRAFT mapping set (L1-D3-A).
      description: Replaces all rows of a draft. Editing an active/historical version is rejected (409, code CONNECTOR_CONFIGURATION_INVALID) — those versions are immutable. Guarded by `integration:write`.
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleMappingRowsRequest'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleMappingSetDetail'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: The version is active/historical and immutable — code CONNECTOR_CONFIGURATION_INVALID.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
  /v1/integrations/{connectionId}/requisition-lifecycle-mappings/versions/{version}/validate:
    post:
      operationId: validateLifecycleMappingSet
      summary: Validate a mapping set version (L1-D3-A).
      description: Returns enumerable validation issues (empty ⇒ activatable). Guarded by `integration:read`.
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleMappingValidationResponse'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []
  /v1/integrations/{connectionId}/requisition-lifecycle-mappings/versions/{version}/activate:
    post:
      operationId: activateLifecycleMappingSet
      summary: Atomically activate a DRAFT mapping set version (L1-D3-A).
      description: Validates then atomically promotes the draft to active, demoting the prior active version to historical. Exactly one active set exists per connection. Guarded by `integration:write`.
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleMappingSetDetail'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: The version is not a draft, or a concurrent activation won — code CONNECTOR_CONFIGURATION_INVALID.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '422':
          description: The set failed validation — code MAPPING_SET_INVALID.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
  /v1/reports/assignment-pipeline:
    get:
      operationId: getAssignmentPipelineReport
      summary: Assignment-pipeline current-snapshot operational view (T9-B3).
      description: |
        Current snapshot (no period) of the assignment pipeline over the five
        live PlacementProcess states — OFFER_ACCEPTED, PRE_START, BLOCKED,
        READY_TO_START, STARTED — with total_live = their sum. A UTC start-date
        breakdown buckets the four pre-start states by proposed_start_date
        (null → unspecified). contract_assignments is BOUNDED / forward-
        materialized only: a STARTED placement may have no ContractAssignment,
        so STARTED != active + ended. Counts only — no rows, no commercial
        fields, no ended_at. report:read + tenant/site/A3.
      parameters:
        - name: site_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Optional site narrowing (must match the actor's site claim).
      responses:
        '200':
          description: Current assignment-pipeline counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentPipelineReport'
        # T9-B5 — no reachable 400: the route takes no from/to and runs no
        # request-body/param validation (identical posture to /v1/reports/margin,
        # which likewise documents no 400). Site-claim mismatch is a 403, not 400.
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
      security:
        - BearerAuth: []

  /v1/reports/margin:
    get:
      operationId: getMarginReport
      summary: Margin current-snapshot operational view (T9-B4).
      description: |
        Current snapshot (no period) of contract-assignment margin, aggregated
        by (currency, rate_period). group_margin_percent is the GOVERNED
        bill-rate-weighted aggregate SUM(bill-pay)/SUM(bill)*100 as a scale-2
        decimal string (null when the group bill total is zero) — never the
        arithmetic mean of per-assignment margins. Coverage is FORWARD_MATERIALIZED:
        eligible_count = commercialized_count + missing_commercial_count. CONTRACT
        assignments only — PermanentPlacement, ENDED, and future/cancelled-only
        versions are excluded. Aggregate-only: no per-assignment rows, no
        talent/person ids, no pay/bill/spread/markup, no version lineage.
        COMPOUND authorization: report:read AND assignment:commercials:read, plus
        tenant/site/A3. The finer compensation:view:* scopes are NOT a gate here.
      parameters:
        - name: site_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Optional site narrowing (must match the actor's site claim).
      responses:
        '200':
          description: Current margin aggregate by (currency, rate_period).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarginReport'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
      security:
        - BearerAuth: []

components:
  securitySchemes:
    # Duplicated byte-for-byte from openapi/common.yaml per locked invariant
    # 4 (duplicate-not-$ref — no cross-document $ref for securitySchemes).
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    # GLH-1-C FIX_NOW — the Indeed Apply webhook (XP) authenticates by HMAC signature,
    # not a bearer token. This carries the COMPUTED signature header only; the shared
    # signing secret (ARAMO_INDEED_APPLY_WEBHOOK_SECRET) is provisioned out-of-band and
    # never appears here.
    IndeedHmacSignature:
      type: apiKey
      in: header
      name: X-Indeed-Signature
      description: |
        HMAC signature over the exact raw request body, computed and sent by Indeed. Not a
        secret — the shared signing secret is provisioned out-of-band and never documented.

    # COMM-B6 — the Zoom Phone webhook (XP) authenticates by HMAC-SHA256 signature over
    # `v0:{x-zm-request-timestamp}:{raw body}`, not a bearer token. This header carries the
    # COMPUTED signature only; the app-level signing secret is resolved from an opaque
    # reference (ZOOM_WEBHOOK_SECRET_REF) through Secrets Manager and never appears here.
    ZoomHmacSignature:
      type: apiKey
      in: header
      name: x-zm-signature
      description: |
        HMAC-SHA256 signature (format `v0=<hex>`) over `v0:{timestamp}:{raw body}`, computed
        and sent by Zoom. Not a secret — the signing secret is resolved server-side from an
        opaque reference and never documented. Paired with the `x-zm-request-timestamp` header.

  schemas:
    CommunicationCapabilities:
      type: object
      additionalProperties: false
      description: Provider-neutral capability descriptor for a communications provider (COMM-V1).
      required: [provider_key, capabilities]
      properties:
        provider_key:
          type: string
          description: The normalized provider key (e.g. zoom_phone).
        capabilities:
          type: object
          additionalProperties: false
          required: [voice]
          properties:
            voice:
              type: object
              additionalProperties: false
              required: [outbound, inbound, embedded]
              properties:
                outbound: { type: boolean }
                inbound: { type: boolean }
                embedded: { type: boolean }
            sms:
              type: object
              additionalProperties: false
              required: [outbound, inbound]
              properties:
                outbound: { type: boolean }
                inbound: { type: boolean }
            recording: { type: boolean }
            transcript: { type: boolean }
    CommunicationProviderIdentity:
      type: object
      additionalProperties: false
      description: A recruiter's communications provider-identity mapping (COMM-V1). No secret material.
      required: [recruiter_id, provider_user_id, voice_enabled, sms_enabled, status]
      properties:
        recruiter_id: { type: string, format: uuid }
        provider_user_id: { type: string }
        provider_extension_id:
          type: [string, 'null']
        display_phone_number:
          type: [string, 'null']
        extension:
          type: [string, 'null']
        voice_enabled: { type: boolean }
        sms_enabled: { type: boolean }
        status:
          type: string
          enum: [active, unmapped, disabled, reauth_required]
    CommunicationProviderIdentityList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CommunicationProviderIdentity'
    UpsertProviderIdentityRequest:
      type: object
      additionalProperties: false
      description: Admin upsert of a recruiter's communications provider-identity mapping (COMM-V1). No secret material.
      required: [provider_user_id]
      properties:
        provider_user_id:
          type: string
          maxLength: 255
        provider_extension_id:
          type: [string, 'null']
        display_phone_number:
          type: [string, 'null']
        extension:
          type: [string, 'null']
        voice_enabled:
          type: boolean
        sms_enabled:
          type: boolean
        status:
          type: string
          enum: [active, unmapped, disabled, reauth_required]
    InitiateCommunicationCallRequest:
      type: object
      additionalProperties: false
      description: |
        Request to initiate an outbound voice call (COMM-B5). The server resolves
        the destination from the Talent record's `phone_slot`; an arbitrary
        destination number is NOT accepted. `regarding` is optional context and
        carries only the requisition identifier.
      required:
        - talent_id
        - phone_slot
      properties:
        talent_id:
          type: string
          format: uuid
          description: The Talent record to call.
        phone_slot:
          type: string
          enum: [cell, work, home]
          description: Which of the Talent record's phone numbers to dial.
        regarding:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [requisition_id]
              properties:
                requisition_id:
                  type: string
                  format: uuid
          description: Optional requisition context; omitted or null for a Talent-only call.
    CommunicationInteractionView:
      type: object
      additionalProperties: false
      description: A communication interaction (the canonical calling record), tenant-scoped (COMM-V1).
      required:
        - id
        - channel
        - direction
        - status
        - integration_connection_id
        - from_address
        - to_address
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        channel:
          type: string
          enum: [voice, sms, email]
        direction:
          type: string
          enum: [outbound, inbound]
        status:
          type: string
          enum: [created, initiated, ringing, connected, completed, failed, missed, rejected]
        integration_connection_id: { type: string, format: uuid }
        from_address: { type: string }
        to_address: { type: string }
        started_at:
          type: [string, 'null']
          format: date-time
        ringing_at:
          type: [string, 'null']
          format: date-time
        connected_at:
          type: [string, 'null']
          format: date-time
        ended_at:
          type: [string, 'null']
          format: date-time
        duration_seconds:
          type: [integer, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AttachProviderReferenceRequest:
      type: object
      additionalProperties: false
      description: |
        Provider correlation ids captured post-dial (COMM-B8). All optional but AT
        LEAST ONE must be present. B8 live validation determines which id the real
        Smart Embed supplies; the webhook keeps its strongest-first correlation
        order (element → history → call_id).
      properties:
        provider_call_element_id:
          type: string
          maxLength: 255
        provider_call_history_uuid:
          type: string
          maxLength: 255
        provider_call_id:
          type: string
          maxLength: 255
    RecordCommunicationDispositionRequest:
      type: object
      additionalProperties: false
      description: Record a disposition (COMM-B7). notes requires communication:notes:write.
      required:
        - disposition
      properties:
        disposition:
          type: string
          enum:
            - connected
            - left_voicemail
            - no_answer
            - busy
            - wrong_number
            - interested
            - not_interested
            - callback_requested
            - follow_up_required
            - do_not_contact
        notes:
          type: [string, 'null']
          maxLength: 4000
    CommunicationDisposition:
      type: object
      additionalProperties: false
      description: A recorded disposition (append-only history entry), COMM-B7.
      required:
        - id
        - disposition
        - notes
        - dispositioned_at
      properties:
        id: { type: string, format: uuid }
        disposition:
          type: string
          enum:
            - connected
            - left_voicemail
            - no_answer
            - busy
            - wrong_number
            - interested
            - not_interested
            - callback_requested
            - follow_up_required
            - do_not_contact
        notes:
          type: [string, 'null']
        dispositioned_at:
          type: string
          format: date-time
    TalentCommunicationTimelineItem:
      type: object
      additionalProperties: false
      description: A communication interaction plus its disposition history (COMM-B7).
      required:
        - id
        - channel
        - direction
        - status
        - integration_connection_id
        - from_address
        - to_address
        - created_at
        - updated_at
        - dispositions
      properties:
        id: { type: string, format: uuid }
        channel:
          type: string
          enum: [voice, sms, email]
        direction:
          type: string
          enum: [outbound, inbound]
        status:
          type: string
          enum: [created, initiated, ringing, connected, completed, failed, missed, rejected]
        integration_connection_id: { type: string, format: uuid }
        from_address: { type: string }
        to_address: { type: string }
        started_at:
          type: [string, 'null']
          format: date-time
        ringing_at:
          type: [string, 'null']
          format: date-time
        connected_at:
          type: [string, 'null']
          format: date-time
        ended_at:
          type: [string, 'null']
          format: date-time
        duration_seconds:
          type: [integer, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        dispositions:
          type: array
          items:
            $ref: '#/components/schemas/CommunicationDisposition'
    TalentCommunicationTimelineResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TalentCommunicationTimelineItem'
        next_cursor:
          type: [string, 'null']
    Offer:
      type: object
      additionalProperties: false
      required: [id, tenant_id, submittal_id, requisition_id, talent_record_id, state, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        submittal_id: { type: string, format: uuid }
        requisition_id: { type: string, format: uuid }
        talent_record_id: { type: string, format: uuid }
        state: { type: string, enum: [DRAFT, SENT, NEGOTIATION, ACCEPTED, DECLINED, EXPIRED, RESCINDED] }
        proposed_start_date: { type: [string, 'null'], format: date }
        offer_expires_at: { type: [string, 'null'], format: date-time }
        client_offer_reference: { type: [string, 'null'] }
        offer_terms_summary: { type: [string, 'null'] }
        decline_reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    CreateOfferRequest:
      type: object
      additionalProperties: false
      required: [submittal_id, requisition_id, talent_record_id]
      properties:
        submittal_id: { type: string, format: uuid }
        requisition_id: { type: string, format: uuid }
        talent_record_id: { type: string, format: uuid }
        proposed_start_date: { type: [string, 'null'], format: date }
        offer_expires_at: { type: [string, 'null'], format: date-time }
        client_offer_reference: { type: [string, 'null'] }
        offer_terms_summary: { type: [string, 'null'] }
    TransitionOfferRequest:
      type: object
      additionalProperties: false
      required: [to_state]
      properties:
        to_state: { type: string, enum: [SENT, NEGOTIATION, ACCEPTED, DECLINED, EXPIRED, RESCINDED, DRAFT] }
        proposed_start_date: { type: [string, 'null'], format: date }
        offer_expires_at: { type: [string, 'null'], format: date-time }
        client_offer_reference: { type: [string, 'null'] }
        offer_terms_summary: { type: [string, 'null'] }
        decline_reason: { type: [string, 'null'] }
    # T8-CONNECTOR-A — provider-neutral connector connection views/requests. NO
    # schema exposes secret_ref, an AWS identifier, or credential material.
    IntegrationConnectionView:
      type: object
      additionalProperties: false
      required: [id, tenant_id, provider_key, status, has_secret, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        provider_key:
          type: string
        status:
          type: string
          enum: [disconnected, configured, active, degraded, disabled]
        has_secret:
          type: boolean
          description: Whether a credential has been configured. The value/reference is never exposed.
        provider_account_id:
          type: [string, 'null']
        last_attempted_at:
          type: [string, 'null']
          format: date-time
        last_successful_at:
          type: [string, 'null']
          format: date-time
        last_error_code:
          type: [string, 'null']
        last_error_summary:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IntegrationConnectionListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationConnectionView'
    LifecycleMappingRow:
      type: object
      additionalProperties: false
      required: [id, provider_state, disposition, mapped_action, authority_mode]
      properties:
        id: { type: string, format: uuid }
        provider_state: { type: string }
        disposition: { type: string, enum: [EXECUTE_ACTION, IGNORE] }
        mapped_action:
          type: [string, 'null']
          enum: [REOPEN, PUT_ON_HOLD, CLOSE, CANCEL, null]
          description: One of the four external actions for EXECUTE_ACTION; null for IGNORE.
        authority_mode: { type: string, enum: [external_authority, dual_control] }
    LifecycleMappingSetSummary:
      type: object
      additionalProperties: false
      required: [id, connection_id, version, status, created_at, created_by, activated_at, activated_by, supersedes_set_id]
      properties:
        id: { type: string, format: uuid }
        connection_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, active, historical] }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        activated_at: { type: [string, 'null'], format: date-time }
        activated_by: { type: [string, 'null'], format: uuid }
        supersedes_set_id: { type: [string, 'null'], format: uuid }
    LifecycleMappingSetDetail:
      type: object
      additionalProperties: false
      required: [id, connection_id, version, status, created_at, created_by, activated_at, activated_by, supersedes_set_id, mappings]
      properties:
        id: { type: string, format: uuid }
        connection_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, active, historical] }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        activated_at: { type: [string, 'null'], format: date-time }
        activated_by: { type: [string, 'null'], format: uuid }
        supersedes_set_id: { type: [string, 'null'], format: uuid }
        mappings:
          type: array
          items:
            $ref: '#/components/schemas/LifecycleMappingRow'
    LifecycleMappingSetListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LifecycleMappingSetSummary'
    LifecycleMappingRowInput:
      type: object
      additionalProperties: false
      required: [provider_state, disposition]
      properties:
        provider_state: { type: string }
        disposition: { type: string, enum: [EXECUTE_ACTION, IGNORE] }
        mapped_action:
          type: [string, 'null']
          enum: [REOPEN, PUT_ON_HOLD, CLOSE, CANCEL, null]
          description: Required (one of the four) for EXECUTE_ACTION; MUST be omitted/null for IGNORE.
    LifecycleMappingRowsRequest:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/LifecycleMappingRowInput'
    LifecycleMappingValidationIssue:
      type: object
      additionalProperties: false
      required: [code, provider_state, detail]
      properties:
        code: { type: string }
        provider_state: { type: string }
        detail: { type: string }
    LifecycleMappingValidationResponse:
      type: object
      additionalProperties: false
      required: [issues]
      properties:
        issues:
          type: array
          items:
            $ref: '#/components/schemas/LifecycleMappingValidationIssue'
    CreateIntegrationConnectionRequest:
      type: object
      additionalProperties: false
      required: [provider_key]
      properties:
        provider_key:
          type: string
          description: Normalized extensible provider key (never a frozen vendor enum).
        provider_account_id:
          type: [string, 'null']
    UpdateIntegrationConnectionRequest:
      type: object
      additionalProperties: false
      properties:
        provider_account_id:
          type: [string, 'null']
    SetIntegrationCredentialRequest:
      type: object
      additionalProperties: false
      required: [credential]
      properties:
        credential:
          type: string
          description: Write-only. Stored in Secrets Manager under a server-derived id; never persisted to the database, echoed, or returned.
    # T9-B3 — assignment-pipeline current-snapshot operational view
    # (GET /v1/reports/assignment-pipeline). Counts only; no row items, no
    # financial fields, no ended_at; additionalProperties:false closes the
    # contract (§21/§27 data-safety).
    AssignmentPipelineReport:
      type: object
      additionalProperties: false
      required:
        - total_live
        - by_state
        - start_date
        - contract_assignments
      properties:
        total_live:
          type: integer
          minimum: 0
          description: Sum of the five live by_state counts (contract_assignments excluded).
        by_state:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [state, count]
            properties:
              state:
                type: string
                enum: [OFFER_ACCEPTED, PRE_START, BLOCKED, READY_TO_START, STARTED]
              count:
                type: integer
                minimum: 0
        start_date:
          type: object
          additionalProperties: false
          required: [overdue, today, next_7_days, later, unspecified, timezone_basis]
          properties:
            overdue: { type: integer, minimum: 0 }
            today: { type: integer, minimum: 0 }
            next_7_days: { type: integer, minimum: 0 }
            later: { type: integer, minimum: 0 }
            unspecified: { type: integer, minimum: 0 }
            timezone_basis:
              type: string
              enum: [UTC]
        contract_assignments:
          type: object
          additionalProperties: false
          required: [active, ended, coverage]
          properties:
            active: { type: integer, minimum: 0 }
            ended: { type: integer, minimum: 0 }
            coverage:
              type: string
              enum: [forward_materialized]

    # T9-B4 — margin current-snapshot operational view (GET /v1/reports/margin).
    # Aggregate-only by (currency, rate_period); group_margin_percent is the
    # governed bill-rate-weighted aggregate (scale-2 string or null). NO per-row
    # commercial fields, NO ids, NO version lineage; additionalProperties:false
    # closes the contract (§13/§25 data-safety). Field name is group_margin_percent
    # per Aramo-T9-B4-Margin-Field-Masking-Amendment-v1_0-LOCKED (D5 mask collision).
    MarginReport:
      type: object
      additionalProperties: false
      required:
        - eligible_count
        - commercialized_count
        - missing_commercial_count
        - coverage
        - groups
      properties:
        eligible_count:
          type: integer
          minimum: 0
          description: ACTIVE CONTRACT assignments in the visible set (= commercialized + missing).
        commercialized_count:
          type: integer
          minimum: 0
          description: Eligible assignments with exactly one current non-cancelled commercial version.
        missing_commercial_count:
          type: integer
          minimum: 0
          description: Eligible assignments with no usable current commercial version (counted, not dropped).
        coverage:
          type: string
          enum: [forward_materialized]
        groups:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [currency, rate_period, assignment_count, group_margin_percent]
            properties:
              currency:
                type: string
                description: Grouping key; no cross-currency monetary total is produced (no FX substrate).
              rate_period:
                type: string
                enum: [HOURLY, DAILY, WEEKLY, MONTHLY, ANNUAL]
              assignment_count:
                type: integer
                minimum: 0
              group_margin_percent:
                type: [string, 'null']
                description: |
                  Bill-rate-weighted aggregate SUM(bill-pay)/SUM(bill)*100 for the group,
                  scale-2 decimal string; null when the group bill total is zero.

    # T9-B2 — fallthrough rate + reasons operational report
    # (GET /v1/reports/fallthrough). Computed-on-read; no persistence. Note:
    # reason_detail (PII) is deliberately absent; additionalProperties:false
    # keeps it out of the contract (§16 data-safety).
    FallthroughReport:
      type: object
      additionalProperties: false
      required:
        - period
        - accepted_attempts
        - fallthrough_attempts
        - fallthrough_rate
        - reasons
      properties:
        period:
          type: object
          additionalProperties: false
          required: [from, to]
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
        accepted_attempts:
          type: integer
          minimum: 0
          description: Denominator — distinct placement attempts first accepted in the period.
        fallthrough_attempts:
          type: integer
          minimum: 0
          description: Numerator — cohort attempts terminating in FELL_THROUGH or NO_SHOW.
        fallthrough_rate:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Percent 0-100; null when accepted_attempts == 0.
        reasons:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [reason_code, reason_label, count, rate]
            properties:
              reason_code:
                type: [string, 'null']
                description: Canonical placement reason code, or null for the "Unspecified" bucket.
              reason_label:
                type: string
                description: Snapshotted reason label, or "Unspecified" for the null bucket.
              count:
                type: integer
                minimum: 0
              rate:
                type: integer
                minimum: 0
                maximum: 100
                description: Percent of fallthrough_attempts represented by this bucket.

    # T7-P4 — guarantee-exposure summary report
    # (GET /v1/reports/guarantee-exposure). Computed-on-read; no persistence.
    GuaranteeExposureReport:
      type: object
      additionalProperties: false
      required:
        - period
        - cohort_count
        - exposure_by_currency
        - states
        - remedy_obligation_by_currency
        - falloff_rate
      properties:
        period:
          type: object
          additionalProperties: false
          required: [from, to]
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
        cohort_count:
          type: integer
          minimum: 0
          description: All authorized PermanentPlacements activated (created_at) in [from, to).
        exposure_by_currency:
          type: array
          description: |
            Per-currency guarantee-exposure sums as scale-2 decimal strings. Money is NEVER
            summed across currencies and NEVER FX-converted; there is no global monetary total.
          items:
            type: object
            additionalProperties: false
            required: [currency, total, active, satisfied, fell_off, at_risk]
            properties:
              currency:
                type: string
              total:
                type: string
                description: Σ guarantee_exposure_amount over the currency's cohort.
              active:
                type: string
                description: Σ where lifecycle_state = GUARANTEE_ACTIVE.
              satisfied:
                type: string
                description: Σ where lifecycle_state = GUARANTEE_SATISFIED.
              fell_off:
                type: string
                description: Σ where lifecycle_state is in the fell-off family.
              at_risk:
                type: string
                description: Equal to active in P4 (still within an active guarantee window).
        states:
          type: object
          additionalProperties: false
          required: [active, satisfied, fell_off, remedy_due, remedy_completed]
          properties:
            active:
              type: integer
              minimum: 0
            satisfied:
              type: integer
              minimum: 0
            fell_off:
              type: integer
              minimum: 0
              description: Count of the fell-off family (FELL_OFF + all remedy-due + REMEDY_COMPLETED).
            remedy_due:
              type: object
              additionalProperties: false
              required: [replacement, refund, prorated_credit]
              properties:
                replacement:
                  type: integer
                  minimum: 0
                refund:
                  type: integer
                  minimum: 0
                prorated_credit:
                  type: integer
                  minimum: 0
            remedy_completed:
              type: integer
              minimum: 0
              description: Remedy evidence completed — NOT payment.
        remedy_obligation_by_currency:
          type: array
          description: |
            Per-currency remedy OBLIGATION totals (amounts owed, never paid/settled). REFUND and
            PRORATED_CREDIT only; REPLACEMENT is count-only (non-monetary).
          items:
            type: object
            additionalProperties: false
            required: [currency, refund_total, prorated_credit_total]
            properties:
              currency:
                type: string
              refund_total:
                type: string
              prorated_credit_total:
                type: string
        falloff_rate:
          type: integer
          minimum: 0
          maximum: 100
          description: states.fell_off / cohort_count as a percent 0-100; 0 when cohort_count == 0.
    FillPerformanceReport:
      type: object
      additionalProperties: false
      required:
        - period
        - openings
        - filled_openings
        - fill_rate
        - fully_filled_requisitions
        - time_to_fill
      properties:
        period:
          type: object
          additionalProperties: false
          required: [from, to]
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
        openings:
          type: integer
          minimum: 0
          description: Σ requisition openings over the non-canceled cohort (denominator).
        filled_openings:
          type: integer
          minimum: 0
          description: Σ min(distinct placed talents, openings) (numerator).
        fill_rate:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Percent 0-100; null when openings == 0.
        fully_filled_requisitions:
          type: integer
          minimum: 0
        time_to_fill:
          type: object
          additionalProperties: false
          required: [count, average_days]
          properties:
            count:
              type: integer
              minimum: 0
              description: Number of fully-filled requisitions contributing a value.
            average_days:
              type: [number, 'null']
              minimum: 0
              description: Mean days created_at→Nth-placed; null when count == 0.

    # Track 3 / E1-b — PlacementProcess HTTP surface.
    CreatePlacementRequest:
      type: object
      additionalProperties: false
      required: [submittal_id, requisition_id, talent_record_id]
      properties:
        submittal_id:
          type: string
          format: uuid
        requisition_id:
          type: string
          format: uuid
        talent_record_id:
          type: string
          format: uuid
        # E1-c initial offer snapshot (9-c-1) — all optional. offered_at defaults
        # to the server time of the offer fact when omitted; offer_expires_at, when
        # present, must not precede offered_at.
        offered_at:
          type: string
          format: date-time
        proposed_start_date:
          type: string
          format: date
        offer_expires_at:
          type: string
          format: date-time
        client_offer_reference:
          type: string
          maxLength: 255
        offer_terms_summary:
          type: string
          maxLength: 2000
        replaces_placement_process_id:
          type: [string, 'null']
          format: uuid
          description: >
            Track 3 / E4 — replacement lineage. When present, this create is a
            replacement of a terminal predecessor and additionally requires the
            placement:replace scope (a conjunction with placement:create). The
            named predecessor must exist in the same tenant and requisition and be
            in a pre-start terminal state (OFFER_DECLINED, OFFER_RESCINDED,
            NO_SHOW, FELL_THROUGH); otherwise PLACEMENT_REPLACEMENT_INVALID (422).
            Absent → an ordinary first creation. No predecessor reason is copied
            onto the successor.
        placement_kind:
          type: [string, 'null']
          enum: [CONTRACT, PERMANENT, null]
          description: >
            Track 7 / T7-P1 — the permanent-vs-contract branch fact, persisted once
            at create. Omitted → null (legacy/CONTRACT-compatible at STARTED). An
            explicit PERMANENT is required to later start a permanent placement (the
            guarantee path); a CONTRACT/null start materialises a ContractAssignment.
    TransitionPlacementRequest:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to:
          type: string
          description: The target placement state; the 14-edge matrix enforces legality.
          enum:
            - OFFER_EXTENDED
            - OFFER_ACCEPTED
            - PRE_START
            - BLOCKED
            - READY_TO_START
            - STARTED
            - OFFER_DECLINED
            - OFFER_RESCINDED
            - NO_SHOW
            - FELL_THROUGH
        reason_code:
          type: [string, 'null']
          description: >
            Track 3 / E3 — the canonical fallthrough/terminal reason code. REQUIRED
            for a transition into a governed terminal state (OFFER_DECLINED,
            OFFER_RESCINDED, NO_SHOW, FELL_THROUGH); must be absent for any
            non-governed edge. Must be a stable code from the platform-canonical
            reason registry — a display label is never accepted.
        reason_detail:
          type: [string, 'null']
          maxLength: 2000
          description: >
            Track 3 / E3 — optional free-text reason detail, governed by the
            reason code's detail policy (REQUIRED | OPTIONAL | PROHIBITED). Never
            enters the placement outbox event (append-only, cross-consumer): it is
            retained only on the tenant-owned placement event evidence.
        assignment_company_id:
          type: [string, 'null']
          format: uuid
          description: >
            Track 4 / T4-A1 — org snapshot for the forward STARTED ->
            ContractAssignment path. REQUIRED (company_id) for a transition to
            STARTED; ignored for every other target.
        assignment_site_id:
          type: [string, 'null']
          format: uuid
          description: Track 4 / T4-A1 — optional site snapshot for the STARTED path.
        assignment_department_id:
          type: [string, 'null']
          format: uuid
          description: Track 4 / T4-A1 — optional department snapshot for the STARTED path.
        commercial_terms:
          type: object
          additionalProperties: false
          required: [pay_rate_amount, bill_rate_amount, currency, rate_period]
          description: >
            Track 5 / T5-P1 — the actual person-specific commercial terms of the
            INITIAL Assignment Rate Version, materialised in the same transaction
            as the FORWARD STARTED ContractAssignment. REQUIRED for a transition to
            STARTED (else PLACEMENT_START_COMMERCIAL_TERMS_REQUIRED, 422); supplying
            it for any other target is rejected (VALIDATION_ERROR). ONE currency
            governs both pay and bill. Derived margin/markup/spread are NOT here —
            they are computed on read (T5-P2).
          properties:
            pay_rate_amount:
              type: string
              description: Decimal(12,2) money string (never a float); non-negative.
            bill_rate_amount:
              type: string
              description: Decimal(12,2) money string (never a float); non-negative.
            currency:
              type: string
              description: An active ISO-4217 currency code (uppercase).
            rate_period:
              type: string
              enum:
                - HOURLY
                - DAILY
                - WEEKLY
                - MONTHLY
                - ANNUAL
        guarantee_terms:
          type: object
          additionalProperties: false
          required: [guarantee_start_date, guarantee_duration_days, remedy_policy, exposure_amount, exposure_currency, terms_source]
          description: >
            Track 7 / T7-P1 — the governed guarantee terms of the immutable
            activation snapshot, materialised with the PermanentPlacement in the same
            transaction as the PERMANENT STARTED handoff. REQUIRED for a PERMANENT
            start (else PERMANENT_PLACEMENT_TERMS_REQUIRED, 422); supplying it for a
            CONTRACT/null start or any non-STARTED target is rejected
            (VALIDATION_ERROR). Exposure is a governed input (no rate version is
            minted on this branch); no cross-schema requisition read.
          properties:
            guarantee_start_date:
              type: string
              format: date
              description: The actual permanent employment start (calendar date). Window is half-open [start, start + duration_days).
            guarantee_duration_days:
              type: integer
              minimum: 1
              description: A positive integer; zero/negative fails closed (PERMANENT_PLACEMENT_GUARANTEE_WINDOW_INVALID).
            remedy_policy:
              type: string
              description: The single terms-driven remedy a qualifying falloff will require (snapshotted in P1, executed in P2).
              enum:
                - REPLACEMENT
                - REFUND
                - PRORATED_CREDIT
            exposure_amount:
              type: string
              description: Decimal(12,2) money string (never a float); the maximum amount subject to refund/credit under the guarantee.
            exposure_currency:
              type: string
              description: An active ISO-4217 currency code.
            terms_source:
              type: string
              maxLength: 255
              description: Governed provenance label for the guarantee terms (no hidden default).
    PlacementProcess:
      type: object
      additionalProperties: false
      required: [id, tenant_id, submittal_id, requisition_id, talent_record_id, offer_id, state, offered_at, proposed_start_date, offer_expires_at, client_offer_reference, offer_terms_summary, placement_kind, created_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        submittal_id:
          type: string
          format: uuid
        requisition_id:
          type: string
          format: uuid
        talent_record_id:
          type: string
          format: uuid
        offer_id:
          type: [string, 'null']
          format: uuid
          description: Offer Lifecycle (D6) — the ACCEPTED offer this placement was created from; null for legacy pre-offer rows.
        placement_kind:
          type: [string, 'null']
          enum: [CONTRACT, PERMANENT, null]
          description: Track 7 / T7-P1 — the persisted permanent-vs-contract branch fact; null for legacy/kind-agnostic placements.
        state:
          type: string
          enum:
            - OFFER_EXTENDED
            - OFFER_ACCEPTED
            - PRE_START
            - BLOCKED
            - READY_TO_START
            - STARTED
            - OFFER_DECLINED
            - OFFER_RESCINDED
            - NO_SHOW
            - FELL_THROUGH
        # E1-c offer snapshot (9-c-1). offered_at is always set; the rest are
        # nullable operational fields (3.1 union-null, never nullable:true).
        offered_at:
          type: string
          format: date-time
        proposed_start_date:
          type: [string, 'null']
          format: date
        offer_expires_at:
          type: [string, 'null']
          format: date-time
        client_offer_reference:
          type: [string, 'null']
          maxLength: 255
        offer_terms_summary:
          type: [string, 'null']
          maxLength: 2000
        created_at:
          type: string
          format: date-time
    # E1-d — the placement collection envelope. Items carry NO reason evidence.
    PlacementProcessList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlacementProcess'
    # E1-d — a single append-only state-transition event, the authorized detail
    # surface for reason evidence. reason_* are null for legacy/non-governed
    # events (3.1 union-null, never nullable:true).
    PlacementProcessEvent:
      type: object
      additionalProperties: false
      required: [id, tenant_id, placement_process_id, event_type, event_payload, reason_code, reason_label_snapshot, reason_detail, created_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        placement_process_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum:
            - state_transition
        event_payload:
          type: object
          additionalProperties: false
          required: [from, to]
          properties:
            from:
              type: string
            to:
              type: string
        reason_code:
          type: [string, 'null']
        reason_label_snapshot:
          type: [string, 'null']
        reason_detail:
          type: [string, 'null']
          maxLength: 2000
        created_at:
          type: string
          format: date-time
    # E1-d — the placement event/reason timeline envelope.
    PlacementProcessEventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlacementProcessEvent'
    # Track 4 / T4-D — the authoritative assignment-state read view. Assignment
    # state ONLY: no capacity field (capacity is A2/B2-gated), no org snapshot.
    ContractAssignmentView:
      type: object
      additionalProperties: false
      required: [id, placement_process_id, submittal_id, requisition_id, talent_record_id, started_at, provenance, lifecycle_state, end_reason, expected_end_at, ending_soon]
      properties:
        id:
          type: string
          format: uuid
        placement_process_id:
          type: string
          format: uuid
        submittal_id:
          type: string
          format: uuid
        requisition_id:
          type: string
          format: uuid
        talent_record_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        provenance:
          type: string
          enum: [FORWARD, BACKFILLED]
        lifecycle_state:
          # Null only for a BACKFILLED assignment of unknown lifecycle (§A3.1).
          type: [string, 'null']
          enum: [ACTIVE, ENDED, null]
        end_reason:
          # Present iff ENDED; the authoritative discriminator, never collapsed.
          type: [string, 'null']
          enum: [COMPLETED, WORKER_ENDED, CLIENT_ENDED, null]
        expected_end_at:
          # Slice #3 — the assignment-OWNED planned end (distinct from started_at
          # actual-start and end_reason/ENDED). Null on a backfilled/unset horizon.
          type: [string, 'null']
          format: date-time
        ending_soon:
          # DERIVED (R-ENDING-SOON) — ACTIVE AND expected_end_at within the fixed 30d
          # horizon. Never a stored state/column; computed on read.
          type: boolean
    PlacementAssignmentResponse:
      type: object
      additionalProperties: false
      required: [assignment]
      properties:
        assignment:
          # A coherent absence when the placement has no ContractAssignment.
          oneOf:
            - $ref: '#/components/schemas/ContractAssignmentView'
            - type: 'null'
    # Track 7 / T7-P1 — the PermanentPlacement aggregate + its immutable guarantee
    # snapshot. guarantee_exposure_amount is a scale-2 decimal string (never float).
    PermanentPlacement:
      type: object
      additionalProperties: false
      required: [id, tenant_id, placement_process_id, submittal_id, requisition_id, talent_record_id, lifecycle_state, guarantee_start_date, guarantee_duration_days, guarantee_end_date, remedy_policy, guarantee_exposure_amount, guarantee_exposure_currency, terms_source, recorded_by, created_at, falloff_effective_date, falloff_reason, falloff_recorded_by, falloff_recorded_at, remedy]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        placement_process_id:
          type: string
          format: uuid
        submittal_id:
          type: string
          format: uuid
        requisition_id:
          type: string
          format: uuid
        talent_record_id:
          type: string
          format: uuid
        lifecycle_state:
          type: string
          enum:
            - GUARANTEE_ACTIVE
            - GUARANTEE_SATISFIED
            - FELL_OFF
            - REPLACEMENT_DUE
            - REFUND_DUE
            - PRORATED_CREDIT_DUE
            - REMEDY_COMPLETED
        guarantee_start_date:
          type: string
          format: date
        guarantee_duration_days:
          type: integer
        guarantee_end_date:
          type: string
          format: date
        remedy_policy:
          type: string
          enum:
            - REPLACEMENT
            - REFUND
            - PRORATED_CREDIT
        guarantee_exposure_amount:
          type: string
          description: Decimal(12,2) money string (never a float).
        guarantee_exposure_currency:
          type: string
        terms_source:
          type: string
        recorded_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        falloff_effective_date:
          type: [string, 'null']
          format: date
          description: Track 7 / T7-P2 — the qualifying falloff effective date; null until a falloff.
        falloff_reason:
          type: [string, 'null']
          description: Track 7 / T7-P2 — the governed falloff reason code; null until a falloff.
        falloff_recorded_by:
          type: [string, 'null']
          format: uuid
        falloff_recorded_at:
          type: [string, 'null']
          format: date-time
        remedy:
          # Track 7 / T7-P2 — the remedy obligation; null until a falloff creates it.
          oneOf:
            - $ref: '#/components/schemas/PermanentPlacementRemedy'
            - type: 'null'
    # Track 7 / T7-P2 — the remedy obligation + completion state. calculated_amount is a
    # scale-2 decimal string for REFUND/PRORATED_CREDIT; null for REPLACEMENT. The
    # protected read exposes the amount; the outbox does not.
    PermanentPlacementRemedy:
      type: object
      additionalProperties: false
      required: [remedy_type, calculated_amount, currency, remaining_days, falloff_effective_date, due_at, completed_at, completed_by, completion_reference, replacement_placement_process_id]
      properties:
        remedy_type:
          type: string
          enum:
            - REPLACEMENT
            - REFUND
            - PRORATED_CREDIT
        calculated_amount:
          type: [string, 'null']
          description: Decimal(12,2) money string; null for REPLACEMENT.
        currency:
          type: [string, 'null']
        remaining_days:
          type: [integer, 'null']
        falloff_effective_date:
          type: string
          format: date
        due_at:
          type: string
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        completed_by:
          type: [string, 'null']
          format: uuid
        completion_reference:
          type: [string, 'null']
        replacement_placement_process_id:
          type: [string, 'null']
          format: uuid
    PlacementPermanentResponse:
      type: object
      additionalProperties: false
      required: [permanent]
      properties:
        permanent:
          # A coherent absence when the placement has no PermanentPlacement.
          oneOf:
            - $ref: '#/components/schemas/PermanentPlacement'
            - type: 'null'
    PermanentPlacementTransitionRequest:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to:
          type: string
          description: The target guarantee state; the typed registry enforces legality (P1 edge GUARANTEE_ACTIVE -> GUARANTEE_SATISFIED).
          enum:
            - GUARANTEE_ACTIVE
            - GUARANTEE_SATISFIED
    # Track 7 / T7-P2 — the governed falloff command body.
    PermanentFalloffRequest:
      type: object
      additionalProperties: false
      required: [effective_date, reason]
      properties:
        effective_date:
          type: string
          format: date
          description: The falloff effective calendar date; must fall in the half-open guarantee window [start, end).
        reason:
          type: string
          description: A governed permanent-falloff reason code (closed T7 registry, exact-match, no OTHER).
          enum:
            - TALENT_RESIGNED
            - CLIENT_TERMINATED_PERFORMANCE
            - CLIENT_TERMINATED_CONDUCT
            - CLIENT_TERMINATED_BUSINESS_NEED
            - MUTUAL_SEPARATION
            - JOB_ABANDONMENT
            - EMPLOYMENT_INELIGIBILITY
    # Track 7 / T7-P2 — the evidence-gated remedy-completion command body. Supply
    # replacement_placement_process_id for a REPLACEMENT remedy, or external_reference for a
    # REFUND/PRORATED_CREDIT remedy; the server validates coherence against the remedy type.
    PermanentRemedyCompletionRequest:
      type: object
      additionalProperties: false
      properties:
        replacement_placement_process_id:
          type: string
          format: uuid
          description: REPLACEMENT evidence — a same-tenant, same-requisition, PERMANENT placement that reached STARTED (evidence linkage only, not an E4 predecessor).
        external_reference:
          type: string
          maxLength: 255
          description: REFUND/PRORATED_CREDIT evidence — a bounded governed settlement/credit reference.
    # Track 7 / T7-P3 — the reusable guarantee-term-version payload shared by create + revise.
    GuaranteeTermsPayload:
      type: object
      additionalProperties: false
      required: [effective_from, guarantee_duration_days, remedy_policy, guarantee_exposure_amount, currency, source_type]
      properties:
        effective_from:
          type: string
          format: date
          description: Calendar date (yyyy-mm-dd) the terms become effective (half-open window start).
        guarantee_duration_days:
          type: integer
          minimum: 1
          description: Positive integer guarantee duration in calendar days.
        remedy_policy:
          type: string
          enum: [REPLACEMENT, REFUND, PRORATED_CREDIT]
        guarantee_exposure_amount:
          type: string
          description: Non-negative Decimal(12,2) money string (never a float).
        currency:
          type: string
          description: Active ISO-4217 currency code.
        source_type:
          type: string
          enum: [MANUAL, IMPORTED]
          description: Closed code-owned provenance registry (no premature CLIENT_CONTRACT/RATE_CARD).
        source_reference:
          type: string
          maxLength: 255
          description: Optional governed source reference (e.g. an import batch id).
        source_version:
          type: string
          maxLength: 255
          description: Optional governed source version.
        correlation_id:
          type: string
          maxLength: 255
          description: Optional governed trace/correlation id.
    GuaranteeTermsCreateRequest:
      allOf:
        - $ref: '#/components/schemas/GuaranteeTermsPayload'
    GuaranteeTermsReviseRequest:
      allOf:
        - $ref: '#/components/schemas/GuaranteeTermsPayload'
    # Track 7 / T7-P3 — the read projection of a guarantee-term version.
    GuaranteeTermVersion:
      type: object
      additionalProperties: false
      required: [id, tenant_id, requisition_id, effective_from, effective_to, guarantee_duration_days, remedy_policy, guarantee_exposure_amount, currency, source_type, source_reference, source_version, recorded_by, recorded_at, supersedes_version_id, correlation_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        requisition_id:
          type: string
          format: uuid
        effective_from:
          type: string
          format: date
        effective_to:
          type: [string, 'null']
          format: date
        guarantee_duration_days:
          type: integer
        remedy_policy:
          type: string
          enum: [REPLACEMENT, REFUND, PRORATED_CREDIT]
        guarantee_exposure_amount:
          type: string
        currency:
          type: string
        source_type:
          type: string
          enum: [MANUAL, IMPORTED]
        source_reference:
          type: [string, 'null']
        source_version:
          type: [string, 'null']
        recorded_by:
          type: string
          format: uuid
        recorded_at:
          type: string
          format: date-time
        supersedes_version_id:
          type: [string, 'null']
          format: uuid
        correlation_id:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
    GuaranteeTermVersionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GuaranteeTermVersion'
    # Track 5 / T5-P2 — the commercial projection of the CURRENT effective
    # AssignmentRateVersion. Stored actuals + DEC-5 derived views (computed on read,
    # never stored). Money + percentages are scale-2 decimal strings (never float);
    # margin_percent / markup_percent are null on a zero denominator.
    AssignmentCommercialView:
      type: object
      additionalProperties: false
      required: [contract_assignment_id, assignment_rate_version_id, requisition_id, talent_record_id, pay_rate_amount, bill_rate_amount, currency, rate_period, spread_amount, margin_percent, markup_percent, effective_from, effective_to, change_reason, recorded_by, created_at]
      properties:
        contract_assignment_id:
          type: string
          format: uuid
        assignment_rate_version_id:
          type: string
          format: uuid
        requisition_id:
          type: string
          format: uuid
        talent_record_id:
          type: string
          format: uuid
        pay_rate_amount:
          type: string
          description: Decimal(12,2) money string (never a float).
        bill_rate_amount:
          type: string
          description: Decimal(12,2) money string (never a float).
        currency:
          type: string
          description: An active ISO-4217 currency code (uppercase).
        rate_period:
          type: string
          enum: [HOURLY, DAILY, WEEKLY, MONTHLY, ANNUAL]
        spread_amount:
          type: string
          description: bill - pay, scale-2 decimal string.
        margin_percent:
          # ((bill - pay) / bill) * 100; null when bill == 0.
          type: [string, 'null']
        markup_percent:
          # ((bill - pay) / pay) * 100; null when pay == 0.
          type: [string, 'null']
        effective_from:
          type: string
          format: date-time
        effective_to:
          type: [string, 'null']
          format: date-time
        change_reason:
          type: [string, 'null']
        recorded_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    AssignmentCommercialResponse:
      type: object
      additionalProperties: false
      required: [commercials]
      properties:
        commercials:
          # A coherent absence when the placement has no assignment / no active version.
          oneOf:
            - $ref: '#/components/schemas/AssignmentCommercialView'
            - type: 'null'
    # Track 6 / T6-B2 — the post-start commercial-revision request. The four commercial
    # fields (as at initial START) + optional effective_from (omitted = server now) +
    # required change_reason. tenant / assignment / version ids, lineage, recorded_by,
    # and effective_to are server-derived / forbidden on the wire.
    CommercialRevisionRequest:
      type: object
      additionalProperties: false
      required: [pay_rate_amount, bill_rate_amount, currency, rate_period, change_reason]
      properties:
        pay_rate_amount:
          type: string
          description: Decimal(12,2) money string (never a float).
        bill_rate_amount:
          type: string
          description: Decimal(12,2) money string (never a float).
        currency:
          type: string
          description: An active ISO-4217 currency code (uppercase).
        rate_period:
          type: string
          enum: [HOURLY, DAILY, WEEKLY, MONTHLY, ANNUAL]
        effective_from:
          type: string
          format: date-time
          description: Optional ISO-8601 instant; omitted = the server 'now'. Must not be in the past and must be after the current version start.
        change_reason:
          type: string
          maxLength: 2000
          description: Required free-text note recorded on the successor version.
    # Track 6 / T6-B3 — the explicit cancellation request. The ONLY wire field is the
    # cancellation reason, constrained to the closed USER-selectable vocabulary. The
    # reserved internal ASSIGNMENT_ENDED is deliberately absent (END-reconciliation only,
    # never user-mintable). tenant / assignment / revision id, cancelled_at, cancelled_by
    # are server-derived / forbidden on the wire.
    CommercialRevisionCancelRequest:
      type: object
      additionalProperties: false
      required: [cancellation_reason_code]
      properties:
        cancellation_reason_code:
          type: string
          enum: [SCHEDULE_WITHDRAWN, CLIENT_REQUEST, WORKER_REQUEST, DATA_CORRECTION]
          description: The user-selectable reason for withdrawing the future revision.
    # The revision create response — the new CURRENT version (never null on success).
    AssignmentCommercialCreatedResponse:
      type: object
      additionalProperties: false
      required: [commercials]
      properties:
        commercials:
          $ref: '#/components/schemas/AssignmentCommercialView'
    # The commercial version series (current + historical + future, effective_from DESC).
    AssignmentCommercialSeriesResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentCommercialView'
    # Slice #4 — Commercial Approval. Propose the next revision (INTENT). Mirrors
    # CommercialRevisionRequest but is NOT applied; `reason` replaces change_reason.
    CommercialProposalRequest:
      type: object
      additionalProperties: false
      required: [pay_rate_amount, bill_rate_amount, currency, rate_period, reason]
      properties:
        pay_rate_amount:
          type: string
          description: Decimal(12,2) money string (never a float).
        bill_rate_amount:
          type: string
          description: Decimal(12,2) money string (never a float).
        currency:
          type: string
          description: An active ISO-4217 currency code (uppercase).
        rate_period:
          type: string
          enum: [HOURLY, DAILY, WEEKLY, MONTHLY, ANNUAL]
        effective_from:
          type: string
          format: date-time
          description: Optional ISO-8601 instant for the applied revision; re-validated at APPLY under lock.
        reason:
          type: string
          maxLength: 2000
          description: Required free-text reason for the proposed change.
    # Proposer lifecycle transition — submit / withdraw (scope:write, no authority).
    CommercialProposalTransitionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [submit, withdraw]
          description: submit (DRAFT -> PENDING_REVIEW) or withdraw (open -> WITHDRAWN).
    # Authority decision — margin-approve / client-approve / apply / reject
    # (scope:approve + SoD + ADR-0024). Evidence fields are action-specific.
    CommercialProposalDecisionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [margin_approve, client_approve, apply, reject]
        note:
          type: string
          maxLength: 2000
          description: Free-text audit note (review note / rejection reason / client-approval note by action).
        client_reference:
          type: string
          maxLength: 200
          description: Client-approval external reference (client_approve only).
        client_approval_source:
          type: string
          enum: [MANUAL, EMAIL, VMS, CLIENT_PORTAL, API]
          description: Provenance of the client approval (client_approve only; MANUAL when omitted).
    # One margin side (current OR proposed), derived on read via deriveCommercialMetrics.
    CommercialMarginSide:
      type: object
      additionalProperties: false
      required: [pay_rate_amount, bill_rate_amount, currency, rate_period, spread_amount, margin_percent, markup_percent]
      properties:
        pay_rate_amount:
          type: string
        bill_rate_amount:
          type: string
        currency:
          type: string
        rate_period:
          type: string
        spread_amount:
          type: string
        margin_percent:
          type: [string, 'null']
          description: Scale-2 percent; null when bill = 0.
        markup_percent:
          type: [string, 'null']
          description: Scale-2 percent; null when pay = 0.
    # The current-vs-proposed margin comparison (delta = proposed minus current).
    CommercialMarginComparison:
      type: object
      additionalProperties: false
      required: [current, proposed, pay_rate_delta, bill_rate_delta, margin_point_delta]
      properties:
        current:
          $ref: '#/components/schemas/CommercialMarginSide'
        proposed:
          $ref: '#/components/schemas/CommercialMarginSide'
        pay_rate_delta:
          type: string
        bill_rate_delta:
          type: string
        margin_point_delta:
          type: [string, 'null']
          description: Proposed minus current margin points; null when either side's margin is null.
    # The CommercialRevisionProposal read projection.
    CommercialProposalView:
      type: object
      additionalProperties: false
      required:
        - id
        - contract_assignment_id
        - placement_process_id
        - requisition_id
        - talent_record_id
        - state
        - proposed_pay_rate_amount
        - proposed_bill_rate_amount
        - proposed_currency
        - proposed_rate_period
        - proposed_effective_from
        - reason
        - requested_by
        - margin
        - review_decided_by
        - review_decided_at
        - review_note
        - client_approved_at
        - client_approval_recorded_by
        - client_reference
        - client_approval_source
        - client_approval_note
        - rejected_by
        - rejected_at
        - rejection_reason
        - applied_rate_version_id
        - applied_by
        - applied_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        contract_assignment_id:
          type: string
          format: uuid
        placement_process_id:
          type: string
          format: uuid
        requisition_id:
          type: string
          format: uuid
        talent_record_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [DRAFT, PENDING_REVIEW, PENDING_CLIENT_APPROVAL, APPROVED, APPLIED, REJECTED, WITHDRAWN]
        proposed_pay_rate_amount:
          type: string
        proposed_bill_rate_amount:
          type: string
        proposed_currency:
          type: string
        proposed_rate_period:
          type: string
        proposed_effective_from:
          type: [string, 'null']
          format: date-time
        reason:
          type: string
        requested_by:
          type: string
          format: uuid
        margin:
          $ref: '#/components/schemas/CommercialMarginComparison'
        review_decided_by:
          type: [string, 'null']
          format: uuid
        review_decided_at:
          type: [string, 'null']
          format: date-time
        review_note:
          type: [string, 'null']
        client_approved_at:
          type: [string, 'null']
          format: date-time
        client_approval_recorded_by:
          type: [string, 'null']
          format: uuid
        client_reference:
          type: [string, 'null']
        client_approval_source:
          type: [string, 'null']
          enum: [MANUAL, EMAIL, VMS, CLIENT_PORTAL, API, null]
        client_approval_note:
          type: [string, 'null']
        rejected_by:
          type: [string, 'null']
          format: uuid
        rejected_at:
          type: [string, 'null']
          format: date-time
        rejection_reason:
          type: [string, 'null']
        applied_rate_version_id:
          type: [string, 'null']
          format: uuid
        applied_by:
          type: [string, 'null']
          format: uuid
        applied_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
    CommercialProposalResponse:
      type: object
      additionalProperties: false
      required: [proposal]
      properties:
        proposal:
          $ref: '#/components/schemas/CommercialProposalView'
    CommercialProposalNullableResponse:
      type: object
      additionalProperties: false
      required: [proposal]
      properties:
        proposal:
          oneOf:
            - $ref: '#/components/schemas/CommercialProposalView'
            - type: 'null'
    CommercialProposalListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CommercialProposalView'
    # M3 PR-8 §4.4 — match-list response envelope. The endpoint emits
    # TalentJobExaminationSummary items only (Full is NOT referenced from
    # this endpoint — see directive §4.4). additionalProperties: false plus
    # Summary's additionalProperties: false in common.yaml jointly enforce
    # the Summary-only contract that the Pact strict jsonBody test asserts.
    MatchListResponse:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: 'common.yaml#/components/schemas/TalentJobExaminationSummary'
        pagination:
          $ref: 'common.yaml#/components/schemas/PaginationEnvelope'

    # TR-14 B2 (DDR §2.1/§3.2) — the trust dossier head. THE NUMERIC RULE, HELD:
    # NO top-level trust-ordinal numeric anywhere (no strength, no counts) —
    # contradictions are ITEMS (not a count), thinness is STATEMENTS (not a score).
    # The ONLY numbers that may appear are inside `assertion_payload`, which is the
    # OPAQUE claim facts the evidence asserts (e.g. an employment window, a
    # LONGITUDINAL_PRESENCE payload) — ledger-visible facts, never a platform
    # ordinal. It is intentionally typeless (unconstrained passthrough) so the
    # refusal walker does not treat it as an object schema.
    DossierHead:
      type: object
      additionalProperties: false
      required: [talent_record_id, ledger_established, dimensions, statements, contradictions, verifications, merge_provenance, advisory_pointers, proposal_pointers]
      properties:
        talent_record_id:
          type: string
          format: uuid
        ledger_established:
          type: boolean
        dimensions:
          type: object
          additionalProperties: false
          required: [identity, claims, continuity, eligibility]
          properties:
            identity:
              $ref: '#/components/schemas/DimensionAssessment'
            claims:
              $ref: '#/components/schemas/DimensionAssessment'
            continuity:
              $ref: '#/components/schemas/DimensionAssessment'
            eligibility:
              $ref: '#/components/schemas/DimensionAssessment'
        statements:
          type: array
          items:
            type: string
        contradictions:
          type: array
          items:
            $ref: '#/components/schemas/DossierContradictionItem'
        verifications:
          type: array
          items:
            $ref: '#/components/schemas/DossierVerificationItem'
        merge_provenance:
          type: array
          items:
            $ref: '#/components/schemas/DossierMergeItem'
        advisory_pointers:
          type: array
          items:
            type: string
            format: uuid
        proposal_pointers:
          type: array
          items:
            $ref: '#/components/schemas/DossierProposalPointer'
    DossierProposalPointer:
      type: object
      additionalProperties: false
      required: [id, kind]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [VERIFY_CONTACT, RENEW_VERIFICATION, RESOLVE_CONTRADICTION]
    DimensionAssessment:
      type: object
      additionalProperties: false
      required: [band]
      properties:
        band:
          type: string
          enum: [NOT_ESTABLISHED, SELF_ASSERTED, CORROBORATED, INDEPENDENTLY_VERIFIED, AUTHORITATIVE]
    DossierContradictionItem:
      type: object
      additionalProperties: false
      required: [evidence_id, dimension, assertion_type, reason, contradicting_evidence_id, assertion_payload]
      properties:
        evidence_id:
          type: string
          format: uuid
        dimension:
          type: string
        assertion_type:
          type: string
        reason:
          type: [string, 'null']
        contradicting_evidence_id:
          type: [string, 'null']
          format: uuid
        assertion_payload:
          description: Opaque ledger claim facts the evidence asserts - never a platform trust ordinal. Intentionally unconstrained.
    DossierVerificationItem:
      type: object
      additionalProperties: false
      required: [anchor_kind, status, disputed]
      properties:
        anchor_kind:
          type: string
        status:
          type: string
          enum: [NONE, PENDING, CONFIRMED, EXPIRED]
        disputed:
          type: boolean
          description: >-
            Portal P3b (ruling 4) — derived: the anchor's backing evidence is
            currently DISPUTED. Surfaced on the tenant dossier consumption read.
    DossierMergeItem:
      type: object
      additionalProperties: false
      required: [operation_id, kind, role, completed_at]
      properties:
        operation_id:
          type: string
          format: uuid
        kind:
          type: string
        role:
          type: string
          enum: [survivor, merged]
        completed_at:
          type: [string, 'null']
          format: date-time
    DossierEvidencePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DossierEvidenceItem'
        next_cursor:
          type: [string, 'null']
    DossierEvidenceItem:
      type: object
      additionalProperties: false
      required: [event, evidence, links]
      properties:
        event:
          $ref: '#/components/schemas/DossierEventSummary'
        evidence:
          $ref: '#/components/schemas/DossierEvidenceSummary'
        links:
          type: array
          items:
            $ref: '#/components/schemas/DossierLink'
    DossierEventSummary:
      type: object
      additionalProperties: false
      required: [id, event_type, actor, reason, linked_evidence_id, occurred_at]
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
        actor:
          type: [string, 'null']
        reason:
          type: [string, 'null']
        linked_evidence_id:
          type: [string, 'null']
          format: uuid
        occurred_at:
          type: string
          format: date-time
    DossierEvidenceSummary:
      type: object
      additionalProperties: false
      required: [id, dimension, assertion_type, assertion_payload, source_class, method, current_status, collected_at]
      properties:
        id:
          type: string
          format: uuid
        dimension:
          type: string
        assertion_type:
          type: string
        assertion_payload:
          description: Opaque ledger claim facts - never a platform trust ordinal. Intentionally unconstrained.
        source_class:
          type: string
        method:
          type: string
        current_status:
          type: string
        collected_at:
          type: string
          format: date-time
    DossierLink:
      type: object
      additionalProperties: false
      required: [from_evidence_id, to_evidence_id, relation]
      properties:
        from_evidence_id:
          type: string
          format: uuid
        to_evidence_id:
          type: string
          format: uuid
        relation:
          type: string
          enum: [CORROBORATES, CONTRADICTS, SUPERSEDES]

    # Track 8 / T8-P2 — canonical requisition ingestion schemas.
    CanonicalRequisitionImportRecord:
      type: object
      additionalProperties: false
      required: [source_system, external_req_id, title, openings, company_id]
      properties:
        source_system:
          type: string
          description: Canonical lowercase provider key (T8-P1); canonicalized + conflict-checked at persist.
        external_req_id:
          type: string
          description: Opaque provider requisition id (case-preserved).
        title:
          type: string
        openings:
          type: integer
          minimum: 0
          description: Maps ONLY to the stored total openings authority; availability stays derived (T4-B2).
        company_id:
          type: string
          format: uuid
        external_status:
          type: string
          description: Adapter-supplied normalized internal RecruitingStatus token (case-insensitive); gated statuses are refused. Absent defaults to 'open'.
        description:
          type: string
        city:
          type: string
        state:
          type: string
        work_arrangement:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        job_type:
          type: string
        contact_id:
          type: string
          format: uuid
        imported_at:
          type: string
          format: date-time
        bill_rate_amount:
          type: string
          description: Requisition-level bill rate (decimal string); write gated by compensation.
        bill_rate_currency:
          type: string
        bill_rate_period:
          type: string
    RunRequisitionImportRequest:
      type: object
      additionalProperties: false
      required: [source_label, records]
      properties:
        source_label:
          type: string
          description: Audit label for the batch (never a credential).
        site_id:
          type: string
          format: uuid
        records:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CanonicalRequisitionImportRecord'
    ImportBatchView:
      type: object
      additionalProperties: false
      required: [id, tenant_id, imported_by_id, target_entity, source_filename, row_count, success_count, failure_count, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        site_id:
          type: [string, 'null']
          format: uuid
        imported_by_id:
          type: string
          format: uuid
        target_entity:
          type: string
          enum: [company, contact, requisition, talent_record]
        source_filename:
          type: string
        row_count:
          type: integer
        success_count:
          type: integer
        failure_count:
          type: integer
        status:
          type: string
          enum: [pending, committed, partially_committed, rejected, reverted]
        created_at:
          type: string
          format: date-time
        committed_at:
          type: [string, 'null']
          format: date-time
        reverted_at:
          type: [string, 'null']
          format: date-time
    RequisitionImportList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportBatchView'
