        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []

  /v1/jobs/{job_id}/matches:
    get:
      operationId: listJobMatches
      summary: Returns the ranked match list for a job (Summary-only).
      description: |
        Returns the ranked Live List for the named active requisition as
        TalentJobExaminationSummary[] (NEVER Full — API Contracts L586-588).
        Empty data[] is returned (200, not 404) when no active requisition
        exists for the (tenant_id, job_id) pair; tenant mismatch is treated
        the same way (recovery-from-routing-bug security posture, not an
        error path).
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
          description: |
            Page size. Repository default 50, hard cap 200. Values outside
            [1, 200] are rejected with 400 INVALID_REQUEST by the
            controller; in-range values pass through to the repository's
            clamp.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: |
            Opaque cursor returned in a prior response's pagination.next_cursor.
            Consumers MUST NOT decode it.
      responses:
        '200':
          description: Ranked match list of TalentJobExaminationSummary items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchListResponse'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
      security:
        - BearerAuth: []

  /v1/exports/{entity_type}:
    get:
      operationId: exportEntity
      summary: Export ATS entities as RFC-4180 CSV (PR-A8-4).
      description: |
        Exports ATS rows visible to the actor as a CSV download.

        R10 boundary (load-bearing, structural): emits ATS fields ONLY —
        company / contact / requisition / talent_record / pipeline.
        NO Core tier / score / match / examination / engagement /
        submittal column appears. The export lib reads NO Core schema
        (the lint:nx-boundaries graph for libs/export has zero Core
        edges; the integration spec verifies it by omitting every
        Core migration from the test container and asserting the
        routes still serve 200). A CSV travels, which is the highest-
        risk R10 surface — this is why the boundary is structural,
        not a runtime filter.

        A3-visibility (load-bearing): a recruiter (`requisition:read`
        only) exports own-visible rows — assigned requisitions and
        pipelines on those requisitions (via the assignments-some
        predicate). tenant_admin (`requisition:read:all`) exports
        tenant-wide. Reference-entity exports (company / contact /
        talent_record) are tenant-wide for BOTH roles — A3 is
        assignment-keyed and the A7 precedent set that it does not
        apply to reference data. Export is NOT a visibility-bypass.

        Column selection: the optional `columns` query parameter
        accepts a comma-separated list of ATS field names. Default:
        all columns. An unknown column → 400 VALIDATION_ERROR.

        CSV format: RFC-4180 — fields containing `,`, `"`, CR, or LF
        are double-quote-wrapped with embedded `"` doubled (`""`);
        records terminated by CRLF. Headers are the canonical Aramo
        ATS field names — the talent_record export NEVER carries
        "candidate" / "applicant" (the inbound vocabulary alias is
        import-only; outbound speaks Talent).

        Refusal codes (closed list at PR-A8-4):
          - 400 VALIDATION_ERROR — invalid entity_type, unknown column,
            invalid limit, or too many columns requested.
          - 401 AUTH_REQUIRED — missing/invalid JWT.
          - 403 INSUFFICIENT_PERMISSIONS — missing `export:read` scope.
          - 403 TENANT_CAPABILITY_NOT_ENTITLED — tenant lacks the
            'ats' capability.
      parameters:
        - name: entity_type
          in: path
          required: true
          schema:
            type: string
            enum:
              - company
              - contact
              - requisition
              - talent_record
              - pipeline
        - name: columns
          in: query
          required: false
          schema:
            type: string
          description: |
            Comma-separated list of ATS field names to include. Default:
            every column in the entity's catalog. An unknown column →
            400 VALIDATION_ERROR.
        - name: site_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: |
            Site-axis filter. RequireSiteMatch enforces that the JWT
            site claim matches when present.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
          description: |
            Maximum number of rows. Default 5000; max 10000. A
            streaming bulk-export endpoint is a separate later batch.
      responses:
        '200':
          description: |
            RFC-4180 CSV body. Header row uses canonical Aramo ATS
            field names. Content-Disposition is set by the controller
            so a browser download is named exports-<entity>.csv.
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
      security:
        - BearerAuth: []

  # TR-14 B2 (DDR §2.1/§2.5) — the contracted trust dossier (read-only per record).
  /v1/talent-records/{id}/dossier:
    get:
      operationId: getTalentRecordDossier
      summary: The trust dossier head for a talent record (TR-14 B2).
      description: |
        The Trust Assessment form, contracted and read-only: per-dimension bands +
        named-thinness statements, contradiction ITEMS with reasons (never counts),
        verification state, merge provenance, advisory pointers. Assembled from the
        cluster-union of the record's resolved subject (reverse lookup -> fixpoint).
        A record with no subject returns ledger_established:false, never an error.
        Gated: capability ats + scope talent:read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The dossier head.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierHead'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []
  /v1/talent-records/{id}/dossier/evidence:
    get:
      operationId: getTalentRecordDossierEvidence
      summary: The dossier evidence timeline (keyset, TR-14 B2).
      description: |
        The lifecycle event story over the cluster-union, keyset-paged newest-first,
        each item carrying its evidence summary (never strength) and the links that
        touch it, inline.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: A keyset page of the evidence timeline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierEvidencePage'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []

  /v1/placements:
    get:
      operationId: listPlacements
      summary: List PlacementProcesses for the tenant (Track 3 / E1-d).
      description: |
        Returns the tenant's PlacementProcesses, newest first with a stable
        `id` tie-breaker, bounded at 200. Optional narrowing by the indexed
        axes `requisition_id`, `submittal_id`, `talent_record_id`. Requires
        the `ats` capability and the `placement:read` scope, and is scoped to
        the actor's visible requisition set (a placement on a requisition the
        actor cannot see is simply absent — never disclosed).

        The collection projection carries the placement lifecycle `state` only;
        it deliberately exposes NO fallthrough/terminal reason evidence
        (`reason_code`, `reason_label_snapshot`, `reason_detail`) — reason
        evidence is available only on the per-placement event timeline
        (`GET /v1/placements/{id}/events`). Refusals:
          - 403 TENANT_CAPABILITY_NOT_ENTITLED — tenant lacks `ats`.
          - 403 INSUFFICIENT_PERMISSIONS — caller lacks `placement:read`.
      parameters:
        - name: requisition_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: submittal_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: talent_record_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementProcessList'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
    post:
      operationId: createPlacement
      summary: Create a PlacementProcess on the client-selection/offer fact (Track 3 / E1-b).
      description: |
        Creates a PlacementProcess in the initial `OFFER_EXTENDED` state.
        tenant_id is derived from the JWT. Requires the `placement:create`
        scope. When `replaces_placement_process_id` is present the request is a
        replacement and ALSO requires the `placement:replace` scope (Track 3 /
        E4 — a conjunction, never a fallback). Refusals:
          - 409 PLACEMENT_ALREADY_LIVE — a live PlacementProcess already
            exists for this (tenant, submittal).
          - 403 INSUFFICIENT_PERMISSIONS — caller lacks `placement:create`, or
            supplies `replaces_placement_process_id` without `placement:replace`.
          - 422 PLACEMENT_REPLACEMENT_INVALID — the named predecessor is not a
            valid one to replace (predecessor_not_found | predecessor_not_terminal).
          - 400 VALIDATION_ERROR — body fails schema validation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlacementRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementProcess'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '409':
          description: A live placement already exists for this (tenant, submittal).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '422':
          description: >
            Replacement linkage invalid (Track 3 / E4) — the named predecessor is
            not found in this tenant+requisition, or is not in a terminal state.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []

  /v1/placements/{id}/transition:
    post:
      operationId: transitionPlacement
      summary: Governed PlacementProcess transition; the 14-edge matrix enforces legality (E1-b).
      description: |
        One generic transition route — the target state is in the body and
        the canonical 14-edge matrix (DB-trigger-enforced) owns legality.
        Authorization is DATA-dependent on the edge's authority class
        (Approval Record §2): ordinary progression requires
        `placement:transition`, the live/capacity edge
        (READY_TO_START -> STARTED) requires `placement:activate`, and any
        edge into a terminal state requires `placement:terminate`. All
        placement scopes ship with zero default grants (fail-closed).
        A transition into a governed terminal state (OFFER_DECLINED,
        OFFER_RESCINDED, NO_SHOW, FELL_THROUGH) additionally requires a canonical
        `reason_code` (Track 3 / E3); `reason_detail` is governed by that code's
        detail policy. Reason input on a non-governed edge is refused.
        Refusals:
          - 422 PLACEMENT_STATE_INVALID — the requested edge is not one of
            the 14 legal transitions from the current state.
          - 422 PLACEMENT_REASON_INVALID — the reason evidence is invalid for the
            transition (details.reason discriminates: reason_required |
            reason_unknown | reason_retired | reason_wrong_target | detail_required
            | detail_prohibited | detail_too_long | reason_on_non_governed_target).
          - 403 INSUFFICIENT_PERMISSIONS — caller lacks the edge's class scope.
          - 404 NOT_FOUND — no PlacementProcess for this (tenant, id).
          - 400 VALIDATION_ERROR — `to` is not a known placement state.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionPlacementRequest'
      responses:
        '200':
          description: Transitioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementProcess'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions for the edge's authority class.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '422':
          description: Illegal state transition.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []

  /v1/placements/{id}:
    get:
      operationId: getPlacement
      summary: Read a PlacementProcess (Track 3 / E1-b, guard-aligned E1-d).
      description: |
        Returns the PlacementProcess for the JWT's tenant. Requires the `ats`
        capability and the `placement:read` scope, and is scoped to the actor's
        visible requisition set. A placement that does not exist in the tenant
        OR is not visible to the actor returns 404 (never 403 — the scope
        passed, so existence is not disclosed). No reason evidence is returned
        on this item read; use `GET /v1/placements/{id}/events` for the reason
        timeline. Refusals:
          - 404 NOT_FOUND — no PlacementProcess for this (tenant, id) or not visible.
          - 403 TENANT_CAPABILITY_NOT_ENTITLED — tenant lacks `ats`.
          - 403 INSUFFICIENT_PERMISSIONS — caller lacks `placement:read`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementProcess'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []

  /v1/placements/{id}/events:
    get:
      operationId: listPlacementEvents
      summary: Read a PlacementProcess event/reason timeline (Track 3 / E1-d).
      description: |
        Returns the append-only state-transition events for the placement,
        oldest first with a stable `id` tie-breaker. This is the authorized
        detail surface for fallthrough/terminal reason evidence: `reason_code`,
        `reason_label_snapshot` and permitted `reason_detail` are returned HERE
        and on no broader surface. Legacy or non-governed events carry null
        reason fields (a null is genuine absence, never a reason reconstructed
        from state). `reason_detail` is null by construction for a reason code
        whose registry policy prohibits detail.

        The placement is first loaded under the same guard as the item read
        (capability `ats`, scope `placement:read`, actor visibility) — a
        not-found/not-visible placement returns 404 before any event is read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementProcessEventList'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []

  /v1/placements/{id}/assignment:
    get:
      operationId: getPlacementAssignment
      summary: Read the authoritative ContractAssignment state for a placement (Track 4 / T4-D).
      description: |
        Returns the authoritative post-start assignment state for the placement:
        existence, `lifecycle_state`, `end_reason` (the ratified discriminator —
        COMPLETED / WORKER_ENDED / CLIENT_ENDED, never collapsed), `started_at` and
        `provenance`. A placement with no ContractAssignment returns
        `{ "assignment": null }` — a coherent absence, never a fabricated row.

        Deliberately carries NO capacity value: this surface is assignment state
        only. Capacity availability is the derived `openings_available` on the
        requisition resource (T4-B2 §6 retired the stored column; availability is
        now `max(openings - active ContractAssignment count, 0)`).

        Guarded by capability `ats` and scope `assignment:read` (the dedicated
        assignment authority — `placement:*` does NOT satisfy it). The placement is
        first loaded under the actor-visibility predicate — a not-found/not-visible/
        cross-tenant placement returns 404 (never 403) before any assignment is read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementAssignmentResponse'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []

  /v1/placements/{id}/assignment/commercials:
    get:
      operationId: getPlacementAssignmentCommercials
      summary: Read the commercial projection (rates + derived margin) of a placement's assignment (Track 5 / T5-P2).
      description: |
        Returns the CURRENT effective commercial terms of the placement's
        ContractAssignment — the stored actuals (`pay_rate_amount`, `bill_rate_amount`,
        `currency`, `rate_period`) plus the DEC-5 derived views (`spread_amount`,
        `margin_percent`, `markup_percent`), computed on read. Money and percentages
        are scale-2 decimal strings (never float); `margin_percent` / `markup_percent`
        are null on a zero denominator (bill=0 / pay=0). A placement with no assignment
        or no active commercial version returns `{ "commercials": null }` — a coherent
        absence, never a fabricated row.

        Guarded by scope `assignment:commercials:read` — a DEDICATED financial scope
        that `assignment:read` / `placement:read` / `requisition:read` do NOT satisfy
        (least-visibility). The placement is first loaded under the actor-visibility
        predicate — a not-found / not-visible / cross-tenant placement returns 404
        (never 403) before any commercial figure is read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentCommercialResponse'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []

  # Track 8 / T8-P2 — provider-neutral canonical requisition ingestion.
  /v1/requisition-imports:
    get:
      operationId: listRequisitionImports
      summary: List canonical requisition-import batches for the tenant (Track 8 / T8-P2).
      description: |
        Returns the tenant's requisition-import batches (ImportBatch rows with
        target_entity=requisition), newest first, bounded at 200. Optional
        narrowing by `site_id`. Requires the `ats` capability and the
        `requisition:import:read` scope. tenant_id is derived from the JWT.
      parameters:
        - name: site_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequisitionImportList'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
    post:
      operationId: runRequisitionImport
      summary: Run a provider-neutral canonical requisition import (Track 8 / T8-P2).
      description: |
        Validates + maps provider-neutral CanonicalRequisitionImportRecords and
        creates requisitions through the governed import path, reusing the
        reversible ImportBatch substrate. tenant_id is derived from the JWT.
        Requires the `requisition:import:write` scope. CREATE-only,
        transport-neutral, provider-neutral: no provider credential/config is
        accepted. A re-imported external identity (tenant + source_system +
        external_req_id) is deterministically rejected (recorded as a per-record
        failure), never updated in place. Refusals:
          - 400 VALIDATION_ERROR — the request envelope fails validation.
          - 403 INSUFFICIENT_PERMISSIONS — caller lacks `requisition:import:write`.
          - 422 IMPORT_THRESHOLD_EXCEEDED — per-record failures exceeded the
            configured threshold; the whole batch was rolled back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequisitionImportRequest'
      responses:
        '201':
          description: Created (committed or partially_committed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchView'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '422':
          description: Import rejected (failure threshold exceeded).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
  /v1/requisition-imports/{id}:
    get:
      operationId: getRequisitionImport
      summary: Get a canonical requisition-import batch by id (Track 8 / T8-P2).
      description: |
        Returns a single requisition-import batch in the tenant. A batch that is
        absent or belongs to another tenant returns 404 (tenant-safe; existence
        is never disclosed). Requires the `requisition:import:read` scope.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchView'
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
      security:
        - BearerAuth: []

  /v1/placements/{id}/assignment/end:
    post:
      operationId: endPlacementAssignment
      summary: End the ContractAssignment of a started placement (Track 4 / T4-D).
      description: |
        Transitions a placement's ContractAssignment ACTIVE -> ENDED with the ratified
        end reason (COMPLETED / WORKER_ENDED / CLIENT_ENDED). Gated by the DEDICATED
        `assignment:end` authority (capability `ats`) — `placement:*` does NOT satisfy it
        (§7). The repository writes the state flip and the `placement.assignment.ended`
        outbox event atomically. The placement is loaded under the actor-visibility
        predicate first — a not-found / not-visible / cross-tenant placement returns 404
        (never 403). Ending a non-ACTIVE assignment is refused with 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [end_reason]
              properties:
                end_reason:
                  type: string
                  enum: [COMPLETED, WORKER_ENDED, CLIENT_ENDED]
      responses:
        '200':
          description: Assignment ended.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        '403':
          description: Insufficient permissions or tenant not entitled.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: The assignment is not in an ACTIVE state (already ended or never started).
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []

  /v1/webhooks/indeed/apply:
    post:
      operationId: indeedApplyWebhook
      summary: Inbound Indeed Apply webhook (external partner, HMAC-authenticated).
      description: |
        External partner (Indeed) inbound webhook — surface class XP. There is NO Aramo
        session and therefore NO bearer token; the SOLE authority is the `X-Indeed-Signature`
        HMAC over the exact raw request body (R5). Ships DARK by construction: until the
        webhook signing secret is provisioned the endpoint refuses all traffic with 503.
        The raw body is preserved by a route-scoped raw parser and the consumed-field subset
        is validated in the service, not by schema — so the request body is an opaque
        Indeed-defined JSON document (the exact bytes that were signed).
      security:
        - IndeedHmacSignature: []
      requestBody:
        required: true
        description: The raw Indeed Apply JSON payload (opaque; the signed bytes).
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Received and accepted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [received]
                properties:
                  received:
                    type: boolean
                    enum: [true]
        '401':
          description: Missing or invalid X-Indeed-Signature HMAC.
        '503':
          description: Webhook dark — signing secret not provisioned.

components:
  securitySchemes:
    # Duplicated byte-for-byte from openapi/common.yaml per locked invariant
    # 4 (duplicate-not-$ref — no cross-document $ref for securitySchemes).
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    # GLH-1-C FIX_NOW — the Indeed Apply webhook (XP) authenticates by HMAC signature,
    # not a bearer token. This carries the COMPUTED signature header only; the shared
    # signing secret (ARAMO_INDEED_APPLY_WEBHOOK_SECRET) is provisioned out-of-band and
    # never appears here.
    IndeedHmacSignature:
      type: apiKey
      in: header
      name: X-Indeed-Signature
      description: |
        HMAC signature over the exact raw request body, computed and sent by Indeed. Not a
        secret — the shared signing secret is provisioned out-of-band and never documented.

  schemas:
    # Track 3 / E1-b — PlacementProcess HTTP surface.
    CreatePlacementRequest:
      type: object
      additionalProperties: false
      required: [submittal_id, requisition_id, talent_record_id]
      properties:
        submittal_id:
          type: string
          format: uuid
        requisition_id:
          type: string
          format: uuid
        talent_record_id:
          type: string
          format: uuid
        # E1-c initial offer snapshot (9-c-1) — all optional. offered_at defaults
        # to the server time of the offer fact when omitted; offer_expires_at, when
        # present, must not precede offered_at.
        offered_at:
          type: string
          format: date-time
        proposed_start_date:
          type: string
          format: date
        offer_expires_at:
          type: string
          format: date-time
        client_offer_reference:
          type: string
          maxLength: 255
        offer_terms_summary:
          type: string
          maxLength: 2000
        replaces_placement_process_id:
          type: [string, 'null']
          format: uuid
          description: >
            Track 3 / E4 — replacement lineage. When present, this create is a
            replacement of a terminal predecessor and additionally requires the
            placement:replace scope (a conjunction with placement:create). The
            named predecessor must exist in the same tenant and requisition and be
            in a pre-start terminal state (OFFER_DECLINED, OFFER_RESCINDED,
            NO_SHOW, FELL_THROUGH); otherwise PLACEMENT_REPLACEMENT_INVALID (422).
            Absent → an ordinary first creation. No predecessor reason is copied
            onto the successor.
    TransitionPlacementRequest:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to:
          type: string
          description: The target placement state; the 14-edge matrix enforces legality.
          enum:
            - OFFER_EXTENDED
            - OFFER_ACCEPTED
            - PRE_START
            - BLOCKED
            - READY_TO_START
            - STARTED
            - OFFER_DECLINED
            - OFFER_RESCINDED
            - NO_SHOW
            - FELL_THROUGH
        reason_code:
          type: [string, 'null']
          description: >
            Track 3 / E3 — the canonical fallthrough/terminal reason code. REQUIRED
            for a transition into a governed terminal state (OFFER_DECLINED,
            OFFER_RESCINDED, NO_SHOW, FELL_THROUGH); must be absent for any
            non-governed edge. Must be a stable code from the platform-canonical
            reason registry — a display label is never accepted.
        reason_detail:
          type: [string, 'null']
          maxLength: 2000
          description: >
            Track 3 / E3 — optional free-text reason detail, governed by the
            reason code's detail policy (REQUIRED | OPTIONAL | PROHIBITED). Never
            enters the placement outbox event (append-only, cross-consumer): it is
            retained only on the tenant-owned placement event evidence.
        assignment_company_id:
          type: [string, 'null']
          format: uuid
          description: >
            Track 4 / T4-A1 — org snapshot for the forward STARTED ->
            ContractAssignment path. REQUIRED (company_id) for a transition to
            STARTED; ignored for every other target.
        assignment_site_id:
          type: [string, 'null']
          format: uuid
          description: Track 4 / T4-A1 — optional site snapshot for the STARTED path.
        assignment_department_id:
          type: [string, 'null']
          format: uuid
          description: Track 4 / T4-A1 — optional department snapshot for the STARTED path.
        commercial_terms:
          type: object
          additionalProperties: false
          required: [pay_rate_amount, bill_rate_amount, currency, rate_period]
          description: >
            Track 5 / T5-P1 — the actual person-specific commercial terms of the
            INITIAL Assignment Rate Version, materialised in the same transaction
            as the FORWARD STARTED ContractAssignment. REQUIRED for a transition to
            STARTED (else PLACEMENT_START_COMMERCIAL_TERMS_REQUIRED, 422); supplying
            it for any other target is rejected (VALIDATION_ERROR). ONE currency
            governs both pay and bill. Derived margin/markup/spread are NOT here —
            they are computed on read (T5-P2).
          properties:
            pay_rate_amount:
              type: string
              description: Decimal(12,2) money string (never a float); non-negative.
            bill_rate_amount:
              type: string
              description: Decimal(12,2) money string (never a float); non-negative.
            currency:
              type: string
              description: An active ISO-4217 currency code (uppercase).
            rate_period:
              type: string
              enum:
                - HOURLY
                - DAILY
                - WEEKLY
                - MONTHLY
                - ANNUAL
    PlacementProcess:
      type: object
      additionalProperties: false
      required: [id, tenant_id, submittal_id, requisition_id, talent_record_id, state, offered_at, proposed_start_date, offer_expires_at, client_offer_reference, offer_terms_summary, created_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        submittal_id:
          type: string
          format: uuid
        requisition_id:
          type: string
          format: uuid
        talent_record_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - OFFER_EXTENDED
            - OFFER_ACCEPTED
            - PRE_START
            - BLOCKED
            - READY_TO_START
            - STARTED
            - OFFER_DECLINED
            - OFFER_RESCINDED
            - NO_SHOW
            - FELL_THROUGH
        # E1-c offer snapshot (9-c-1). offered_at is always set; the rest are
        # nullable operational fields (3.1 union-null, never nullable:true).
        offered_at:
          type: string
          format: date-time
        proposed_start_date:
          type: [string, 'null']
          format: date
        offer_expires_at:
          type: [string, 'null']
          format: date-time
        client_offer_reference:
          type: [string, 'null']
          maxLength: 255
        offer_terms_summary:
          type: [string, 'null']
          maxLength: 2000
        created_at:
          type: string
          format: date-time
    # E1-d — the placement collection envelope. Items carry NO reason evidence.
    PlacementProcessList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlacementProcess'
    # E1-d — a single append-only state-transition event, the authorized detail
    # surface for reason evidence. reason_* are null for legacy/non-governed
    # events (3.1 union-null, never nullable:true).
    PlacementProcessEvent:
      type: object
      additionalProperties: false
      required: [id, tenant_id, placement_process_id, event_type, event_payload, reason_code, reason_label_snapshot, reason_detail, created_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        placement_process_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum:
            - state_transition
        event_payload:
          type: object
          additionalProperties: false
          required: [from, to]
          properties:
            from:
              type: string
            to:
              type: string
        reason_code:
          type: [string, 'null']
        reason_label_snapshot:
          type: [string, 'null']
        reason_detail:
          type: [string, 'null']
          maxLength: 2000
        created_at:
          type: string
          format: date-time
    # E1-d — the placement event/reason timeline envelope.
    PlacementProcessEventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlacementProcessEvent'
    # Track 4 / T4-D — the authoritative assignment-state read view. Assignment
    # state ONLY: no capacity field (capacity is A2/B2-gated), no org snapshot.
    ContractAssignmentView:
      type: object
      additionalProperties: false
      required: [id, placement_process_id, submittal_id, requisition_id, talent_record_id, started_at, provenance, lifecycle_state, end_reason]
      properties:
        id:
          type: string
          format: uuid
        placement_process_id:
          type: string
          format: uuid
        submittal_id:
          type: string
          format: uuid
        requisition_id:
          type: string
          format: uuid
        talent_record_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        provenance:
          type: string
          enum: [FORWARD, BACKFILLED]
        lifecycle_state:
          # Null only for a BACKFILLED assignment of unknown lifecycle (§A3.1).
          type: [string, 'null']
          enum: [ACTIVE, ENDED, null]
        end_reason:
          # Present iff ENDED; the authoritative discriminator, never collapsed.
          type: [string, 'null']
          enum: [COMPLETED, WORKER_ENDED, CLIENT_ENDED, null]
    PlacementAssignmentResponse:
      type: object
      additionalProperties: false
      required: [assignment]
      properties:
        assignment:
          # A coherent absence when the placement has no ContractAssignment.
          oneOf:
            - $ref: '#/components/schemas/ContractAssignmentView'
            - type: 'null'
    # Track 5 / T5-P2 — the commercial projection of the CURRENT effective
    # AssignmentRateVersion. Stored actuals + DEC-5 derived views (computed on read,
    # never stored). Money + percentages are scale-2 decimal strings (never float);
    # margin_percent / markup_percent are null on a zero denominator.
    AssignmentCommercialView:
      type: object
      additionalProperties: false
      required: [contract_assignment_id, assignment_rate_version_id, requisition_id, talent_record_id, pay_rate_amount, bill_rate_amount, currency, rate_period, spread_amount, margin_percent, markup_percent, effective_from, effective_to, change_reason, recorded_by, created_at]
      properties:
        contract_assignment_id:
          type: string
          format: uuid
        assignment_rate_version_id:
          type: string
          format: uuid
        requisition_id:
          type: string
          format: uuid
        talent_record_id:
          type: string
          format: uuid
        pay_rate_amount:
          type: string
          description: Decimal(12,2) money string (never a float).
        bill_rate_amount:
          type: string
          description: Decimal(12,2) money string (never a float).
        currency:
          type: string
          description: An active ISO-4217 currency code (uppercase).
        rate_period:
          type: string
          enum: [HOURLY, DAILY, WEEKLY, MONTHLY, ANNUAL]
        spread_amount:
          type: string
          description: bill - pay, scale-2 decimal string.
        margin_percent:
          # ((bill - pay) / bill) * 100; null when bill == 0.
          type: [string, 'null']
        markup_percent:
          # ((bill - pay) / pay) * 100; null when pay == 0.
          type: [string, 'null']
        effective_from:
          type: string
          format: date-time
        effective_to:
          type: [string, 'null']
          format: date-time
        change_reason:
          type: [string, 'null']
        recorded_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    AssignmentCommercialResponse:
      type: object
      additionalProperties: false
      required: [commercials]
      properties:
        commercials:
          # A coherent absence when the placement has no assignment / no active version.
          oneOf:
            - $ref: '#/components/schemas/AssignmentCommercialView'
            - type: 'null'
    # M3 PR-8 §4.4 — match-list response envelope. The endpoint emits
    # TalentJobExaminationSummary items only (Full is NOT referenced from
    # this endpoint — see directive §4.4). additionalProperties: false plus
    # Summary's additionalProperties: false in common.yaml jointly enforce
    # the Summary-only contract that the Pact strict jsonBody test asserts.
    MatchListResponse:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: 'common.yaml#/components/schemas/TalentJobExaminationSummary'
        pagination:
          $ref: 'common.yaml#/components/schemas/PaginationEnvelope'

    # TR-14 B2 (DDR §2.1/§3.2) — the trust dossier head. THE NUMERIC RULE, HELD:
    # NO top-level trust-ordinal numeric anywhere (no strength, no counts) —
    # contradictions are ITEMS (not a count), thinness is STATEMENTS (not a score).
    # The ONLY numbers that may appear are inside `assertion_payload`, which is the
    # OPAQUE claim facts the evidence asserts (e.g. an employment window, a
    # LONGITUDINAL_PRESENCE payload) — ledger-visible facts, never a platform
    # ordinal. It is intentionally typeless (unconstrained passthrough) so the
    # refusal walker does not treat it as an object schema.
    DossierHead:
      type: object
      additionalProperties: false
      required: [talent_record_id, ledger_established, dimensions, statements, contradictions, verifications, merge_provenance, advisory_pointers, proposal_pointers]
      properties:
        talent_record_id:
          type: string
          format: uuid
        ledger_established:
          type: boolean
        dimensions:
          type: object
          additionalProperties: false
          required: [identity, claims, continuity, eligibility]
          properties:
            identity:
              $ref: '#/components/schemas/DimensionAssessment'
            claims:
              $ref: '#/components/schemas/DimensionAssessment'
            continuity:
              $ref: '#/components/schemas/DimensionAssessment'
            eligibility:
              $ref: '#/components/schemas/DimensionAssessment'
        statements:
          type: array
          items:
            type: string
        contradictions:
          type: array
          items:
            $ref: '#/components/schemas/DossierContradictionItem'
        verifications:
          type: array
          items:
            $ref: '#/components/schemas/DossierVerificationItem'
        merge_provenance:
          type: array
          items:
            $ref: '#/components/schemas/DossierMergeItem'
        advisory_pointers:
          type: array
          items:
            type: string
            format: uuid
        proposal_pointers:
          type: array
          items:
            $ref: '#/components/schemas/DossierProposalPointer'
    DossierProposalPointer:
      type: object
      additionalProperties: false
      required: [id, kind]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [VERIFY_CONTACT, RENEW_VERIFICATION, RESOLVE_CONTRADICTION]
    DimensionAssessment:
      type: object
      additionalProperties: false
      required: [band]
      properties:
        band:
          type: string
          enum: [NOT_ESTABLISHED, SELF_ASSERTED, CORROBORATED, INDEPENDENTLY_VERIFIED, AUTHORITATIVE]
    DossierContradictionItem:
      type: object
      additionalProperties: false
      required: [evidence_id, dimension, assertion_type, reason, contradicting_evidence_id, assertion_payload]
      properties:
        evidence_id:
          type: string
          format: uuid
        dimension:
          type: string
        assertion_type:
          type: string
        reason:
          type: [string, 'null']
        contradicting_evidence_id:
          type: [string, 'null']
          format: uuid
        assertion_payload:
          description: Opaque ledger claim facts the evidence asserts - never a platform trust ordinal. Intentionally unconstrained.
    DossierVerificationItem:
      type: object
      additionalProperties: false
      required: [anchor_kind, status, disputed]
      properties:
        anchor_kind:
          type: string
        status:
          type: string
          enum: [NONE, PENDING, CONFIRMED, EXPIRED]
        disputed:
          type: boolean
          description: >-
            Portal P3b (ruling 4) — derived: the anchor's backing evidence is
            currently DISPUTED. Surfaced on the tenant dossier consumption read.
    DossierMergeItem:
      type: object
      additionalProperties: false
      required: [operation_id, kind, role, completed_at]
      properties:
        operation_id:
          type: string
          format: uuid
        kind:
          type: string
        role:
          type: string
          enum: [survivor, merged]
        completed_at:
          type: [string, 'null']
          format: date-time
    DossierEvidencePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DossierEvidenceItem'
        next_cursor:
          type: [string, 'null']
    DossierEvidenceItem:
      type: object
      additionalProperties: false
      required: [event, evidence, links]
      properties:
        event:
          $ref: '#/components/schemas/DossierEventSummary'
        evidence:
          $ref: '#/components/schemas/DossierEvidenceSummary'
        links:
          type: array
          items:
            $ref: '#/components/schemas/DossierLink'
    DossierEventSummary:
      type: object
      additionalProperties: false
      required: [id, event_type, actor, reason, linked_evidence_id, occurred_at]
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
        actor:
          type: [string, 'null']
        reason:
          type: [string, 'null']
        linked_evidence_id:
          type: [string, 'null']
          format: uuid
        occurred_at:
          type: string
          format: date-time
    DossierEvidenceSummary:
      type: object
      additionalProperties: false
      required: [id, dimension, assertion_type, assertion_payload, source_class, method, current_status, collected_at]
      properties:
        id:
          type: string
          format: uuid
        dimension:
          type: string
        assertion_type:
          type: string
        assertion_payload:
          description: Opaque ledger claim facts - never a platform trust ordinal. Intentionally unconstrained.
        source_class:
          type: string
        method:
          type: string
        current_status:
          type: string
        collected_at:
          type: string
          format: date-time
    DossierLink:
      type: object
      additionalProperties: false
      required: [from_evidence_id, to_evidence_id, relation]
      properties:
        from_evidence_id:
          type: string
          format: uuid
        to_evidence_id:
          type: string
          format: uuid
        relation:
          type: string
          enum: [CORROBORATES, CONTRADICTS, SUPERSEDES]

    # Track 8 / T8-P2 — canonical requisition ingestion schemas.
    CanonicalRequisitionImportRecord:
      type: object
      additionalProperties: false
      required: [source_system, external_req_id, title, openings, company_id]
      properties:
        source_system:
          type: string
          description: Canonical lowercase provider key (T8-P1); canonicalized + conflict-checked at persist.
        external_req_id:
          type: string
          description: Opaque provider requisition id (case-preserved).
        title:
          type: string
        openings:
          type: integer
          minimum: 0
          description: Maps ONLY to the stored total openings authority; availability stays derived (T4-B2).
        company_id:
          type: string
          format: uuid
        external_status:
          type: string
          description: Adapter-supplied normalized internal RecruitingStatus token (case-insensitive); gated statuses are refused. Absent defaults to 'open'.
        description:
          type: string
        city:
          type: string
        state:
          type: string
        work_arrangement:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        job_type:
          type: string
        contact_id:
          type: string
          format: uuid
        imported_at:
          type: string
          format: date-time
        bill_rate_amount:
          type: string
          description: Requisition-level bill rate (decimal string); write gated by compensation.
        bill_rate_currency:
          type: string
        bill_rate_period:
          type: string
    RunRequisitionImportRequest:
      type: object
      additionalProperties: false
      required: [source_label, records]
      properties:
        source_label:
          type: string
          description: Audit label for the batch (never a credential).
        site_id:
          type: string
          format: uuid
        records:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CanonicalRequisitionImportRecord'
    ImportBatchView:
      type: object
      additionalProperties: false
      required: [id, tenant_id, imported_by_id, target_entity, source_filename, row_count, success_count, failure_count, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        site_id:
          type: [string, 'null']
          format: uuid
        imported_by_id:
          type: string
          format: uuid
        target_entity:
          type: string
          enum: [company, contact, requisition, talent_record]
        source_filename:
          type: string
        row_count:
          type: integer
        success_count:
          type: integer
        failure_count:
          type: integer
        status:
          type: string
          enum: [pending, committed, partially_committed, rejected, reverted]
        created_at:
          type: string
          format: date-time
        committed_at:
          type: [string, 'null']
          format: date-time
        reverted_at:
          type: [string, 'null']
          format: date-time
    RequisitionImportList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportBatchView'
