# Aramo — Single-Box Directive 1: the runnable PROD stack.
#
# The D5 dev stack + a production front-door, composed so it comes up with one
# command and is provable LOCALLY before the Lightsail box exists. ADDITIVE:
# this does NOT touch the D1 images/Dockerfiles, the D2 Terraform, or the D5
# dev compose (docker-compose.yml / docker-compose.images.yml all still work).
#
# Services:
#   nginx          the ONLY service publishing ports (80/443) — TLS + static +
#                  path routing. Self-contained image with the ats-web SPA baked
#                  in (deploy/nginx/Dockerfile).
#   certbot        the DNS-01 sidecar owning the *.aramo.ai wildcard cert.
#   api            apps/api — the D1 image, UNCHANGED (referenced, not rebuilt).
#   auth-service   apps/auth-service — the D1 image, UNCHANGED.
#   talent-intelligence-service  apps/talent-intelligence-service (ATI-SEP-1 / ADR-0036)
#                  — internal only (:3004), own database aramo_intelligence.
#   postgres       persisted named volume (the fresh-start DB survives restarts).
#   redis          BullMQ (real, not degraded).
# Postgres + Redis are container-INTERNAL — never published to the host/network.
#
# ── Run it (secrets stay in the SHELL, never in a compose-parsable file — the
#    real .env carries multi-line PEM keys compose's env_file parser can't read;
#    same proven pattern as docker-compose.images.yml) ────────────────────────
#
#   # 0) Build the D1 backend images + this front-door image (first time / on change):
#   docker build -f apps/api/Dockerfile          -t aramo/api:local          .
#   docker build -f apps/auth-service/Dockerfile -t aramo/auth-service:local .
#   docker build -f deploy/nginx/Dockerfile      -t aramo/nginx:local        .
#
#   # 1) Load the env contract into the shell, then bring the stack up:
#   set -a && source .env && set +a
#   docker compose --env-file /dev/null -f docker-compose.prod.yml up -d
#
#   # 2) Smoke THROUGH nginx (over https; -k trusts the local mkcert cert):
#   curl -ik https://localhost/.well-known/jwks.json   # auth-service → 200 JWKS
#   curl -ik https://localhost/v1/tenant/settings      # api          → 401 AUTH_REQUIRED
#   #   open https://localhost                          # ats-web SPA loads
#
#   docker compose --env-file /dev/null -f docker-compose.prod.yml down
#
# `--env-file /dev/null` stops compose parsing the multi-line .env for ${}
# interpolation. Bare-name entries under `environment:` are PASSED THROUGH by
# name from the sourced shell env (verbatim — multi-line-PEM-safe). DATABASE_URL
# / REDIS_URL are PINNED to the compose service names (the .env values point at
# localhost, unreachable from inside the container network); the DB credentials
# are interpolated from the same POSTGRES_* vars that configure the postgres
# service, so they cannot drift. See .env.prod.example for the full env surface.

# Pin the compose PROJECT NAME (E17) — the FIRST top-level key. Without it, an
# invocation with no `-p`/COMPOSE_PROJECT_NAME defaults the project to the
# working-directory name, which collides a second parallel stack (and its
# fresh-empty pgdata) against the running one. Pinned here, `-p` becomes a
# redundant belt, never load-bearing. The named volumes below are therefore
# addressed as `aramo-singlebox_<volume>` (E16b).
name: aramo-singlebox

services:
  # ── Front-Door Migration (ADR-0023) — nginx front door + certbot DNS-01 ───────
  # nginx is the single ingress on 80/443 (it replaced the retired front door at
  # the PR-3 cutover). certbot owns the *.aramo.ai wildcard cert via DNS-01/Route53
  # (renew loop; initial issuance is the cutover-runbook step). Backends are never
  # published to the host — nginx is the only public peer.
  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
      args:
        # Public (not a secret) — the Personal signup robot-check widget key.
        VITE_SIGN_TURNSTILE_SITE_KEY: ${SIGN_TURNSTILE_SITE_KEY:-}
    image: aramo/nginx:local
    container_name: aramo-prod-nginx
    restart: unless-stopped
    environment:
      # The four NGINX_* vars — DEFAULTED interpolations (E19). The old bare-name
      # passthrough claimed "unset → the template's local defaults" — that was
      # FALSE: envsubst has NO defaults, so an unset var was left as a literal
      # `${NGINX_CERT_DIR}` and crashed nginx ([emerg] unknown "nginx_cert_dir"
      # variable, the 2026-07-26 window). `${VAR:-default}` makes the var
      # ALWAYS-DEFINED in the container, so envsubst always substitutes. These
      # values are the operator-facing belt; the image ENV (deploy/nginx/Dockerfile,
      # Ruling A) is the authoritative floor — defaults now live in both places.
      - NGINX_TENANT_SERVER_NAME=${NGINX_TENANT_SERVER_NAME:-localhost}
      - NGINX_ADMIN_SERVER_NAME=${NGINX_ADMIN_SERVER_NAME:-admin.localhost}
      - NGINX_PORTAL_SERVER_NAME=${NGINX_PORTAL_SERVER_NAME:-portal.localhost}
      # DOC-4 (R-4-10) — external-signer SPA host (DEPLOY=NO until provisioned).
      - NGINX_SIGN_SERVER_NAME=${NGINX_SIGN_SERVER_NAME:-sign.localhost}
      - NGINX_CERT_DIR=${NGINX_CERT_DIR:-/etc/letsencrypt/live/aramo.ai}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # The certbot-owned wildcard cert, READ-ONLY to nginx.
      - aramo-prod-letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/healthz || exit 1']
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      # FULL set — corrects the grounded gap where the retired front door omitted platform-admin.
      - api
      - auth-service
      - platform-admin
      # E-Sign OC v2 (OC-4) — nginx bakes the sign.aramo.ai block with
      # `proxy_pass http://sign-service:3003` and resolves that upstream at
      # config-load, so sign-service must be started before nginx or the front
      # door crash-loops ([emerg] host not found in upstream). Matches the bare
      # depends_on convention used for the other backends.
      - sign-service
    # Reload loop (Ruling 4): pick up a renewed cert every 6h without a restart.
    # NO docker socket mounted anywhere (rejected: root-equivalent surface).
    # E18: the inner exec chains through the image's ENTRYPOINT
    # (/docker-entrypoint.sh nginx …). That entrypoint gates its template-render
    # scripts (envsubst → conf.d) on `$1 == nginx`; a bare `exec nginx …` here
    # made $1 the wrapper /bin/sh, so the render was SKIPPED → empty conf.d →
    # nginx served nothing (the 2026-07-26 window; this line is the proven
    # hot-fix). conf-check assertion (i) pins this shape.
    command:
      - /bin/sh
      - -c
      - |
        trap exit TERM
        while :; do sleep 6h & wait $${!}; nginx -s reload; done &
        exec /docker-entrypoint.sh nginx -g 'daemon off;'

  # certbot DNS-01 sidecar — owns the *.aramo.ai WILDCARD cert (no apex SAN,
  # PR-0b R4). Renew-loop ONLY; INITIAL issuance is a cutover-runbook step (PR-3):
  #   certbot certonly --dns-route53 -d '*.aramo.ai' \
  #     --agree-tos -m admin@aramo.ai --non-interactive
  # Credentials are PR-0's certbot IAM principal (CERTBOT_AWS_*, PR-0 Ruling 7),
  # mapped onto the AWS_* the plugin reads — kept SEPARATE from the box-wide AWS_*
  # app credentials.
  certbot:
    image: certbot/dns-route53:v3.1.0
    container_name: aramo-prod-certbot
    restart: unless-stopped
    environment:
      - AWS_ACCESS_KEY_ID=${CERTBOT_AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${CERTBOT_AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    volumes:
      - aramo-prod-letsencrypt:/etc/letsencrypt
    # 12h renew loop, TERM-trapped. No initial issuance here (PR-3 cutover step).
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap exit TERM
        while :; do certbot renew --non-interactive; sleep 12h & wait $${!}; done

  api:
    # D1 image, UNCHANGED — referenced, not rebuilt. Override ARAMO_API_IMAGE
    # to point at the ECR tag (D2) on the box; defaults to the local D1 tag.
    image: ${ARAMO_API_IMAGE:-aramo/api:local}
    container_name: aramo-prod-api
    restart: unless-stopped
    environment:
      # Domain-Enforcement P3 §5 — delegated domain-verification links point at the
      # Sign host (the delegate page lives in sign-web). Default https://sign.aramo.ai.
      - ARAMO_SIGN_BASE_URL
      - PORT=3000
      - NODE_ENV=production
      # host localhost → compose-network service names; creds from POSTGRES_*
      # (same source as the postgres service → cannot drift).
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aramo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-aramo}?schema=public
      - REDIS_URL=redis://redis:6379
      # ATI-SEP-1 T0/T8 — the Talent Intelligence origin (compose-internal, no nginx route).
      # ALL TI vars are OPTIONAL (directive invariant: the ATS works with TI absent).
      # Without the client credentials the integration is inert (publisher outcome
      # TI_NOT_CONFIGURED). The api uses them only for the gated portal identifier
      # verification; the publisher / inbound sync run in talent-intake-worker.
      - INTELLIGENCE_SERVICE_URL=${INTELLIGENCE_SERVICE_URL:-http://talent-intelligence-service:3004}
      - INTELLIGENCE_ATS_CLIENT_ID
      - INTELLIGENCE_ATS_CLIENT_SECRET
      # Verifies the TI → ATS webhook (POST /v1/integrations/intelligence/events);
      # same value as the TI service's. Unset ⇒ every delivery is refused 401.
      - INTELLIGENCE_WEBHOOK_SIGNING_SECRET
      # Portal identifier verification through TI. DARK by default (only "true"
      # routes it); the legacy trust email verification is unchanged until T10.
      - INTELLIGENCE_VERIFICATION_ENABLED=${INTELLIGENCE_VERIFICATION_ENABLED:-false}
      # CI-B6P — Conversation Intelligence processing. DARK by default: the
      # activation flag must be explicitly "true" to enable any model call. Both
      # carry safe defaults (optional ${VAR:-default} form → exempt from the
      # env-passthrough documentation assertion). The Anthropic API key is NOT an
      # env var here — it is fetched via the existing Secrets Manager custody.
      - CI_PROCESSING_ENABLED=${CI_PROCESSING_ENABLED:-false}
      - CI_ANTHROPIC_MODEL=${CI_ANTHROPIC_MODEL:-claude-sonnet-4-6}
      # GS-2 Enterprise Search — the semantic embedding reconcile+worker + the search semantic leg.
      # DARK by default: must be exactly "true" to enable. Absent / "false" ⇒ reconcile + worker are
      # no-ops and the /v1/search semantic leg is skipped (GS-1 behavior, byte-identical). Safe default
      # (${VAR:-default} form) → exempt from the env-passthrough assertion; landing this changes NO
      # runtime behavior. Only flip to "true" per doc/runbooks/pgvector-prod-enablement.md (STEP 10),
      # AFTER the pgvector runtime + both vector migrations are verified.
      - EMBEDDING_PROCESSING_ENABLED=${EMBEDDING_PROCESSING_ENABLED:-false}
      # Aramo Sign launch — the App Home Sign tile (GET /v1/me/products). DARK by
      # default: only the literal "true" lights it; lighting it is an activation
      # decision made in the box .env (separately authorized). The target URL
      # defaults to https://sign.aramo.ai/ in code (Sign Unified Product S-2).
      - ARAMO_SIGN_ENTRY_ENABLED=${ARAMO_SIGN_ENTRY_ENABLED:-false}
      - ARAMO_SIGN_ENTRY_URL=${ARAMO_SIGN_ENTRY_URL:-https://sign.aramo.ai/}
      # pass-through by name from the sourced shell env (multi-line-safe):
      - AUTH_AUDIENCE
      - AUTH_PUBLIC_KEY
      - AUTH_COGNITO_TENANT_USER_POOL_ID
      - AUTH_COGNITO_ENDPOINT
      - S3_RESUME_BUCKET
      - S3_ENDPOINT
      - ARAMO_ENV
      - AWS_REGION
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      # transactional mailer (Email-S1): ses|stub + the fixed SES sender
      - MAILER_PROVIDER
      - SES_FROM_ADDRESS
      # E-Sign OC v2 — shared HMAC secret Core uses to VERIFY the E-Sign lifecycle
      # webhook (POST /v1/integrations/sign/events). Same value as sign-service's
      # SIGN_WEBHOOK_SIGNING_SECRET; unset ⇒ the receiver returns 503 (dark).
      # ES-2: the same secret verifies sign-service → Core source requests.
      - SIGN_WEBHOOK_SIGNING_SECRET
      # E-Sign production wiring — the sign-service origin Core calls (envelope
      # create/send/remind/void for RTR + Offer, executed-artifact pull for the
      # completion write-back). Box value: http://sign-service:3003 (compose service
      # name + its PORT). Unset ⇒ the api defaults to its OWN localhost:3003 (dark).
      # Aramo Sign Unified Product — Addendum S6: the ATS as a client of the Sign API.
      # SIGN_ATS_TRANSPORT=internal (default) keeps the internal path; `api` uses the
      # authenticated Sign API (separately authorized activation). The client
      # credential is the operator-issued first-party aramo-ats credential; the
      # subscription secret verifies completion webhooks from the ATS subscription.
      - SIGN_ATS_TRANSPORT=${SIGN_ATS_TRANSPORT:-internal}
      - SIGN_ATS_CLIENT_ID
      - SIGN_ATS_CLIENT_SECRET
      - SIGN_EVENTS_SUBSCRIPTION_SECRET
      - SIGN_SERVICE_URL
      # ES-2 — source-route authentication mode: enforce (default) | log (temporary,
      # only with a future SIGN_S2S_AUTH_LOG_UNTIL ≤ 7 days ahead).
      - SIGN_S2S_AUTH_MODE
      - SIGN_S2S_AUTH_LOG_UNTIL
      # DNS resolver for domain verification (Domain-Enforcement P2b): node|stub.
      # REQUIRED — loadDnsConfig fails LOUD if unset (api crash-loops). api-only;
      # auth-service does not load the DNS module.
      - DNS_PROVIDER
      # invite links (Invite-S2 / Pattern-2): accept-page + sign-in-page bases
      - INVITE_ACCEPT_URL
      - INVITE_SIGNIN_URL
      - ADDRESS_AUTOCOMPLETE_ENABLED
      - ADDRESS_AUTOCOMPLETE_PROVIDER
      - GOOGLE_PLACES_API_KEY
      # Microsoft 365 delegated-OAuth "Connect" (D-INT-1): the authorize/START step
      # reads these two from process.env (apps/api microsoft-config.resolver.ts +
      # libs/microsoft-graph oauth-state). Bare-name passthrough — a var read by
      # code but ABSENT here never reaches the container → the start step 500s and
      # the recruiter sees "We couldn't start the Microsoft connection". api-only
      # (the /v1/integrations/microsoft/callback route lives on the api).
      - MSGRAPH_REDIRECT_URI
      - MSGRAPH_OAUTH_STATE_KEY
      - IMPORT_FAILURE_THRESHOLD_PCT
      # identity fingerprint pepper (Step 4b / ADR-0016): the platform secret
      # keying the cross-tenant email fingerprint, held SEPARATE from the DB.
      # REQUIRED — loadIdentityPepper fails LOUD if unset (api canonicalization
      # STOPS rather than mis-resolving with an unkeyed fingerprint). SHARED with
      # auth-service (Portal P1 eligibility fingerprint) — the value MUST match, so
      # this is the SINGLE SOURCE: the YAML anchor below is referenced by
      # auth-service (*identity_pepper) so the two passthroughs cannot drift.
      # Migrate to KMS/HSM later.
      - &identity_pepper ARAMO_IDENTITY_PEPPER
      # identity index admission policy (TR-2b B1 / Ruling D15): PORTABLE_ONLY |
      # ALL_ARRIVALS — the platform-global switch gating the aperture-1
      # fingerprint mint. REQUIRED — loadIdentityAdmissionPolicy fails LOUD on the
      # mint path if unset/unknown, so canonicalization STOPS rather than minting
      # under an undeclared gate. api-only. Launch value: PORTABLE_ONLY.
      - ARAMO_IDENTITY_ADMISSION_POLICY
      # Indeed Apply inbound webhook secret (SRC-1 PR-2 / R9). Bare-name
      # passthrough — a var read by container code but ABSENT here never reaches
      # the container, so the fix is inert (the D-AUTH-PLATFORM-HOSTS-1 defect
      # class). api-only. UNSET → the webhook refuses all traffic (503, dark).
      - ARAMO_INDEED_APPLY_WEBHOOK_SECRET
      # COMM-B6 — Zoom Phone webhook signing-secret REFERENCE (not the raw secret):
      # an opaque Secrets Manager id resolved server-side, memory-only. Bare-name
      # passthrough (api-only). UNSET/unresolvable → the webhook refuses all traffic
      # (503, dark by construction).
      - ZOOM_WEBHOOK_SECRET_REF
      # SRC-2 PR-3 (R7) — Indeed Job Sync partner OAuth credentials + connector
      # config. Bare-name passthroughs (the D-AUTH-PLATFORM-HOSTS-1 defect class).
      # api-only. UNSET client id/secret → the freshness sweep is fail-closed
      # (disabled, skips every tick). Scope/base default in code when unset.
      - ARAMO_INDEED_CLIENT_ID
      - ARAMO_INDEED_CLIENT_SECRET
      - ARAMO_INDEED_OAUTH_SCOPE
      - ARAMO_INDEED_GRAPHQL_BASE
      # ADR-0033 Talent Intake transport. `singlebox` = the lease-safe outbox drain
      # delivers directly to the in-process TalentIntakeMessageHandler (single-box
      # topology; no EventBridge/SQS/Lambda). The API itself does NOT drain — the
      # dedicated talent-intake-worker does — so DRAIN is disabled here; the API only
      # WRITES the outbox on upload. Safe-default form (exempt from the
      # env-passthrough assertion). Flip TRANSPORT to `eventbridge` only once the AWS
      # plane is applied; it stays fail-closed when its bus is unconfigured.
      - TALENT_INTAKE_TRANSPORT=${TALENT_INTAKE_TRANSPORT:-singlebox}
      - TALENT_INTAKE_DRAIN_ENABLED=0
      # ATI-SEP-1 A3 — the ATS talent outbox (talent.* business-fact events) is
      # drained by the talent-intake-worker ONLY; the API just writes it. Pinned
      # explicitly (env-passthrough literal manifest) so the API never drains.
      - ATS_TALENT_EVENTS_DRAIN_ENABLED=0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ADR-0033 / single-box — the Talent Intake ASYNC WORKER. Same production image as
  # the API (ARAMO_API_IMAGE), different command: it runs ONLY the lease-safe outbox
  # drain + in-process extraction (TALENT_INTAKE_TRANSPORT=singlebox), NOT the HTTP
  # API and NOT the other background workers. This is where résumé extraction
  # executes — OFF the API request path — on the single box. No HTTP port.
  talent-intake-worker:
    image: ${ARAMO_API_IMAGE:-aramo/api:local}
    container_name: aramo-prod-talent-intake-worker
    restart: unless-stopped
    command: ["node", "dist/apps/api/src/talent-intake-worker.main.js"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aramo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-aramo}?schema=public
      - REDIS_URL=redis://redis:6379
      # This worker IS the single-box drainer (DRAIN enabled by default; no AWS).
      - TALENT_INTAKE_TRANSPORT=${TALENT_INTAKE_TRANSPORT:-singlebox}
      # ATI-SEP-1 A3 — this worker also drains the ATS talent outbox (talent.*
      # events → the in-process dispatcher). Pinned explicitly (env-passthrough
      # literal manifest). The tuning knobs are optional; the defaults equal the
      # in-code defaults.
      - ATS_TALENT_EVENTS_DRAIN_ENABLED=1
      - ATS_TALENT_EVENTS_DRAIN_INTERVAL_MS=${ATS_TALENT_EVENTS_DRAIN_INTERVAL_MS:-5000}
      - ATS_TALENT_EVENTS_DRAIN_LIMIT=${ATS_TALENT_EVENTS_DRAIN_LIMIT:-25}
      - ATS_TALENT_EVENTS_LEASE_SECONDS=${ATS_TALENT_EVENTS_LEASE_SECONDS:-120}
      - ATS_TALENT_EVENTS_MAX_ATTEMPTS=${ATS_TALENT_EVENTS_MAX_ATTEMPTS:-10}
      # ATI-SEP-1 T8 — the Intelligence publisher (a talent.* handler), the inbound
      # sync (TI webhook inbox drain) and the full REPLACE entitlement sync run HERE.
      # All OPTIONAL: without the client credentials every one is a no-op.
      - INTELLIGENCE_SERVICE_URL=${INTELLIGENCE_SERVICE_URL:-http://talent-intelligence-service:3004}
      - INTELLIGENCE_ATS_CLIENT_ID
      - INTELLIGENCE_ATS_CLIENT_SECRET
      - INTELLIGENCE_ENTITLEMENT_SYNC_INTERVAL_MS=${INTELLIGENCE_ENTITLEMENT_SYNC_INTERVAL_MS:-900000}
      - INTELLIGENCE_INBOUND_SYNC_INTERVAL_MS=${INTELLIGENCE_INBOUND_SYNC_INTERVAL_MS:-5000}
      # Extraction reads the résumé from S3 and the tenant-LLM key from Secrets
      # Manager — the SAME credentials/config the API uses.
      - S3_RESUME_BUCKET
      - S3_ENDPOINT
      - ARAMO_ENV
      - AWS_REGION
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - *identity_pepper
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  auth-service:
    # D1 image, UNCHANGED — referenced, not rebuilt.
    image: ${ARAMO_AUTH_IMAGE:-aramo/auth-service:local}
    container_name: aramo-prod-auth
    restart: unless-stopped
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aramo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-aramo}?schema=public
      # pass-through by name from the sourced shell env (multi-line-safe):
      - AUTH_AUDIENCE
      - AUTH_PRIVATE_KEY
      - AUTH_PUBLIC_KEY
      - AUTH_PKCE_STATE_KEY
      - AUTH_COGNITO_DOMAIN
      - AUTH_COGNITO_CLIENT_ID
      - AUTH_COGNITO_ISSUER
      - AUTH_COGNITO_REDIRECT_URI
      - AUTH_COGNITO_ENDPOINT
      - AUTH_POST_LOGIN_REDIRECT
      # D-ORG-2 — explicit per-consumer landing overrides (built-in defaults apply when unset).
      - AUTH_POST_LOGIN_PATH_RECRUITER
      - AUTH_POST_LOGIN_PATH_ORG
      - AUTH_POST_LOGIN_PATH_SIGN
      - AUTH_COGNITO_SIGNOUT_REDIRECT
      - AUTH_TRUSTED_IDP_NAMES
      - AUTH_ALLOW_INSECURE_COOKIES
      - AUTH_REFRESH_GRACE_SECONDS
      # Platform console — the platform host class (exact-match allowlist for
      # admin.aramo.ai). Without it the container reads AUTH_PLATFORM_HOSTS empty
      # → admin.aramo.ai fails the platform-host match → derives an unregistered
      # callback → console login 400s on redirect_uri (D-AUTH-PLATFORM-HOSTS-1).
      - AUTH_PLATFORM_HOSTS
      # Portal P1 — passwordless portal login. The portal host class
      # (exact-match allowlist for candidate.aramo.ai) + the magic-link base.
      - AUTH_PORTAL_HOSTS
      - PORTAL_LOGIN_BASE_URL
      # IC-2 PR-4 — session tenant binding mode (log|enforce; default log when
      # unset), the explicit dev exception for unbound hosts under enforce, and
      # the DARK product-console host class allow-list (F-3). All optional.
      - AUTH_HOST_TENANT_BINDING
      - AUTH_ALLOW_UNBOUND_HOST
      - AUTH_PRODUCT_HOSTS
      # Eligibility rides aperture 1 (the PII-free fingerprint → ClusterFingerprint
      # lookup), so auth-service needs the SAME pepper as api. Single-sourced via
      # the *identity_pepper YAML anchor (defined on api's entry) — one var name,
      # one shell-.env value, cannot drift. loadIdentityAdmissionPolicy is NOT
      # needed here (auth-service reads the index, never mints into it).
      - *identity_pepper
      # Portal login mail rides the standing SES mailer path (SPF/DMARC/sandbox-exit
      # release-blocking, exactly as for TR-3).
      - MAILER_PROVIDER
      - SES_FROM_ADDRESS
      # SES credentials — same as api's. Without them the AWS SDK falls back to the
      # Lightsail instance role, which is NOT allowed ses:SendEmail (mail silently dropped).
      - AWS_REGION
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
    depends_on:
      postgres:
        condition: service_healthy

  sign-service:
    # DOC-3 — Native E-Sign Service Core backend. Container-internal only (never
    # port-published; externally unreachable while NGINX_SIGN_SERVER_NAME is unset).
    # ⚠ REQUIRED whenever nginx runs: the nginx image bakes the sign.aramo.ai block
    # with `proxy_pass http://sign-service:3003`, which nginx resolves at
    # config-load — recreating nginx without sign-service running crash-loops the
    # front door (`[emerg] host not found in upstream`). Built by deploy/build-images.sh
    # (5 images); bring sign-service up BEFORE cutting nginx to a new image.
    image: ${ARAMO_SIGN_IMAGE:-aramo/sign-service:local}
    container_name: aramo-prod-sign
    restart: unless-stopped
    environment:
      # PORT 3003 matches main.ts's default (api=3000, auth=3001, platform-admin=3002).
      - PORT=3003
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aramo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-aramo}?schema=public
      # E-Sign signer notifications ride the standing SES mailer path (SigningNotificationPort → MailerPort).
      - MAILER_PROVIDER
      - SES_FROM_ADDRESS
      # SES credentials — same as api's. Without them the AWS SDK falls back to the
      # Lightsail instance role, which is NOT allowed ses:SendEmail: every signer
      # invitation/reminder failed with "not authorized to perform ses:SendEmail".
      - AWS_REGION
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      # OC-1 — the Sign Web origin used to build signer URLs (the raw capability
      # token is appended in-memory inside sign-service and never leaves it).
      # Sign Unified Product S-2 — ONE base URL for every Sign link (signer, signed
      # copy, console, billing return); the two older names remain fallbacks.
      - ARAMO_SIGN_BASE_URL
      - SIGN_WEB_BASE_URL
      # Aramo Sign launch — the sender console origin used in sender emails
      # (pre-S-2 name; ARAMO_SIGN_BASE_URL wins), the envelope signing window, the signer
      # signed-copy link lifetime, and the expiry sweep (all optional; defaults
      # 30 days / 30 days / enabled every 5 minutes).
      - SIGN_SENDER_WEB_BASE_URL
      - SIGN_ENVELOPE_TTL_DAYS
      - SIGN_EXECUTED_ACCESS_TTL_DAYS
      - SIGN_EXPIRY_WORKER_ENABLED
      - SIGN_EXPIRY_INTERVAL_MS
      # Multi-Signer §4 — the retry worker for SEQUENTIAL next-signer invitations
      # (0 disables; interval default 60000 ms).
      - SIGN_INVITATION_WORKER_ENABLED
      - SIGN_INVITATION_INTERVAL_MS
      # Aramo Sign launch — self-service billing (Stripe). Unset key ⇒ billing is
      # unavailable (503) and nothing is charged; live keys need separate
      # authorization. STRIPE_PLAN_PRICES maps sellable plan keys to provider price
      # ids; the reconcile sweep is opt-in.
      - STRIPE_SECRET_KEY
      - STRIPE_WEBHOOK_SECRET
      - STRIPE_PLAN_PRICES
      - STRIPE_AUTOMATIC_TAX
      - BILLING_PAST_DUE_GRACE_DAYS
      - SIGN_BILLING_RECONCILE_ENABLED
      - SIGN_BILLING_RECONCILE_INTERVAL_MS
      # CCP-C1 — the Stripe command outbox + webhook inbox worker (opt-in; unset ⇒ off).
      - SIGN_BILLING_COMMANDS_ENABLED
      - SIGN_BILLING_COMMANDS_INTERVAL_MS
      # Aramo Sign launch — evidence-manifest signing in KMS (asymmetric SIGN_VERIFY
      # key). Unset ⇒ the software signer (unchanged behaviour). The key is IaC.
      - SIGN_KMS_KEY_ID
      # Sign Unified Product S-5 — the key (32 bytes, base64) that encrypts each
      # webhook subscription's own signing secret at rest. Unset ⇒ no subscription
      # can be created and none is delivered (fail closed); the legacy ATS target
      # (SIGN_WEBHOOK_SIGNING_SECRET) keeps working until the ATS is migrated (S-6).
      - SIGN_WEBHOOK_SECRET_KEY
      - SIGN_KMS_SIGNING_ALGORITHM
      # Commercial Plans Amendment A1 — all inactive until separately approved:
      # the signer disclosure version (default v1; v2 = the legal-pending draft),
      # the post-termination export window (unset until the retention policy is
      # approved) and the Enterprise "Contact sales" link.
      - SIGN_DISCLOSURE_VERSION
      - SIGN_POST_TERMINATION_EXPORT_DAYS
      - SIGN_SALES_CONTACT_URL
      # A1 review — Standard Professional eligibility stays OFF until the PO
      # confirms the qualifying rule (ATS_ENTITLEMENT = live ats + ACTIVE tenant);
      # commitment plans use only an explicit Stripe portal configuration whose
      # cancellation settings match the approved terms (unset ⇒ portal refused).
      - SIGN_PROFESSIONAL_ELIGIBILITY
      - STRIPE_PORTAL_CONFIGURATION
      # E-Sign OC v2 — canonical outbound lifecycle webhook to Aramo Core. Target
      # defaults to the api origin; the shared secret signs the HMAC (empty ⇒ the
      # delivery worker fails closed and the outbox retries).
      - DOCUMENTS_API_URL
      - SIGN_WEBHOOK_TARGET_URL
      - SIGN_WEBHOOK_SIGNING_SECRET
      # PX-1 — the authenticated sender zone (/v1/sign/sender/*, sign.aramo.ai).
      # JwtAuthGuard verifies the shared auth-service JWT; OWNED source PDFs live in
      # the platform document bucket. The console's links back to the tenant host use
      # the code default https://{slug}.aramo.ai (SIGN_TENANT_HOST_URL_TEMPLATE).
      - AUTH_AUDIENCE
      - AUTH_PUBLIC_KEY
      - S3_RESUME_BUCKET
      - S3_ENDPOINT
      # Sign Personal (Free) Launch v1.1 — the Personal send gate. Mode off (the
      # default) keeps today's personal_sending_not_enabled refusal. The send-time
      # network country comes from the same offline GeoLite2 Country database as
      # platform-admin (mounted read-only below); a risk signal only — missing ⇒
      # UNKNOWN, recorded with the send, never a refusal by itself.
      - SIGN_PERSONAL_SIGNUP_MODE
      - SIGN_PERSONAL_ALLOWED_COUNTRIES
      - SIGN_PERSONAL_SEND_WORDING
      - SIGN_SMS_PROVIDER
      - SIGN_GEOIP_DB_PATH=${SIGN_GEOIP_DB_PATH:-/geoip/GeoLite2-Country.mmdb}
      - SIGN_GEOIP_ASN_DB_PATH=${SIGN_GEOIP_ASN_DB_PATH:-/geoip/GeoLite2-ASN.mmdb}
    volumes:
      - /opt/aramo/geoip:/geoip:ro
    depends_on:
      postgres:
        condition: service_healthy

  talent-intelligence-service:
    # ATI-SEP-1 T0 (ADR-0036) — Talent Intelligence, an independently subscribable
    # product with its OWN database (aramo_intelligence, role aramo_intelligence) on
    # the same postgres server. Container-internal ONLY: never port-published and
    # deliberately NO nginx upstream (nginx resolves upstreams at config-load — see the
    # sign-service note above — so the front door never depends on this container).
    # The api reaches it at http://talent-intelligence-service:3004.
    # The role + database are created idempotently by deploy/migrate-prod.sh
    # (tools/ensure-intelligence-db.sh) BEFORE containers are recreated; migrations
    # are libs/intelligence-core (tools/db-sync-intelligence.sh, own ledger).
    image: ${ARAMO_INTELLIGENCE_IMAGE:-aramo/talent-intelligence-service:local}
    container_name: aramo-prod-intelligence
    restart: unless-stopped
    environment:
      # PORT 3004 matches main.ts's default (api=3000, auth=3001, platform-admin=3002, sign=3003).
      - PORT=3004
      - NODE_ENV=production
      # The TI service reads ONLY this URL (no DATABASE_URL fallback; it refuses the shared
      # Aramo DB). INTELLIGENCE_DB_PASSWORD must be URL-safe (tools/ensure-intelligence-db.sh
      # enforces [A-Za-z0-9._~-], 16+ chars).
      - INTELLIGENCE_DATABASE_URL=postgresql://${INTELLIGENCE_DB_USER:-aramo_intelligence}:${INTELLIGENCE_DB_PASSWORD:?INTELLIGENCE_DB_PASSWORD must be set}@postgres:5432/aramo_intelligence
      # ATI-SEP-1 T2–T8 — secrets (each >= 32 chars). Bare-name passthroughs, OPTIONAL
      # for boot: unset ⇒ the dependent surface reports itself unavailable (token
      # exchange 503 / government ids 503 / verification 503 / webhooks deferred)
      # while the service and the ATS keep running.
      - INTELLIGENCE_SERVICE_TOKEN_SECRET
      - INTELLIGENCE_GOV_ID_TOKEN_KEY
      - INTELLIGENCE_VERIFICATION_CODE_KEY
      # Signs the TI → ATS webhook; same value as the api's. Unset ⇒ no delivery is sent.
      - INTELLIGENCE_WEBHOOK_SIGNING_SECRET
      - INTELLIGENCE_ATS_WEBHOOK_URL=${INTELLIGENCE_ATS_WEBHOOK_URL:-http://api:3000/v1/integrations/intelligence/events}
      - INTELLIGENCE_OUTBOX_MAX_ATTEMPTS=${INTELLIGENCE_OUTBOX_MAX_ATTEMPTS:-10}
      # Read posture: tenant-scoped (own assertions + TI-acquired) until Legal L-1.
      - TI_CROSS_TENANT_READ_ENABLED=${TI_CROSS_TENANT_READ_ENABLED:-false}
      - TI_OUTBOX_DRAIN_ENABLED=${TI_OUTBOX_DRAIN_ENABLED:-1}
      - TI_OUTBOX_DRAIN_INTERVAL_MS=${TI_OUTBOX_DRAIN_INTERVAL_MS:-5000}
      - TI_REASSESSMENT_ENABLED=${TI_REASSESSMENT_ENABLED:-1}
      - TI_REASSESSMENT_INTERVAL_MS=${TI_REASSESSMENT_INTERVAL_MS:-3600000}
      - TI_AVAILABILITY_FRESHNESS_DAYS=${TI_AVAILABILITY_FRESHNESS_DAYS:-90}
      # Verification code delivery (T8): with MAILER_PROVIDER set, the TI delivery
      # adapter sends through @aramo/mailer (ses|stub; SES needs the sender + creds);
      # unset ⇒ the LOG adapter (no mail is sent).
      - MAILER_PROVIDER
      - SES_FROM_ADDRESS
      - AWS_REGION
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      # ATI-SEP-1 T10 WP4 — OPTIONAL origin of the confirm-page link in the verification
      # email (<base>/email-verifications/confirm?verification_id=<id>). TI does not know a
      # tenant's host, so this is ONE configured origin. Unset ⇒ the email carries the
      # 6-digit code only.
      - INTELLIGENCE_VERIFY_LINK_BASE
    healthcheck:
      # GET /health answers 200 only when the TI database responds.
      test: ['CMD', 'node', '-e', "require('http').get({host:'127.0.0.1',port:3004,path:'/health',timeout:2500},(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  platform-admin:
    # Inc-3 PR-3.3 — the platform-console backend as a real prod service.
    # Override ARAMO_PLATFORM_ADMIN_IMAGE to the GHCR tag on the box; defaults
    # to the local build tag. Container-internal only (never port-published; the
    # admin.aramo.ai site block is the sole ingress → platform-admin:3002).
    image: ${ARAMO_PLATFORM_ADMIN_IMAGE:-aramo/platform-admin:local}
    container_name: aramo-prod-platform-admin
    restart: unless-stopped
    environment:
      # PORT 3002 matches main.ts's default (api=3000, auth=3001).
      - PORT=3002
      - NODE_ENV=production
      # Same source as postgres/api → cannot drift.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aramo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-aramo}?schema=public
      # Env delta vs api (Inc-3 PR-3.3): platform-admin's module graph consumes
      # a strict subset of api's env PLUS the platform Cognito pool. It does NOT
      # boot the cross-schema BullMQ worker (that lives in api's directly-imported
      # CrossSchemaConsistencyModule), so NO REDIS_URL and no depends_on redis.
      # It runs no DNS module / no canonicalization, so no DNS_PROVIDER /
      # ARAMO_IDENTITY_PEPPER. It sends invites via Cognito AdminCreateUser (its
      # own hosted email), so no mailer / INVITE_* / S3 vars.
      #
      # JWT verification (JwtAuthGuard):
      - AUTH_AUDIENCE
      - AUTH_PUBLIC_KEY
      # Cognito admin invitations (CognitoAdminService). PLATFORM pool is NEW vs
      # api — platform-admin invitations mint into the platform user pool; the
      # TENANT pool is shared (tenant-owner invitations into a provisioned tenant).
      - AUTH_COGNITO_PLATFORM_USER_POOL_ID
      - AUTH_COGNITO_TENANT_USER_POOL_ID
      - AUTH_COGNITO_ENDPOINT
      # AWS SDK (Cognito-IDP client) — region + creds, same as api.
      - AWS_REGION
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      # PLATFORM-UX-1 B-1c — email domains allowed for platform-admin invites
      # (comma list). Unset ⇒ the code default `aramo.ai`.
      - PLATFORM_ADMIN_EMAIL_DOMAINS
      # Aramo Sign launch — public self-service signup (/v1/signup/sign/* via the
      # sign.aramo.ai block). Dark unless SIGN_PUBLIC_SIGNUP_ENABLED=1 (separately
      # authorized). The verification email goes through the shared mailer (SES,
      # same as api); links point at the Sign console origin.
      # A1: signup terms come from the versioned legal registry in code (nothing
      # approved yet ⇒ no terms are offered); there is no env override.
      - SIGN_PUBLIC_SIGNUP_ENABLED
      # Sign Signup Amendment A1 §2.3 — address autocomplete on the organization-
      # details step (Geoapify, proxied server-side; the key never reaches the
      # browser). Unset ⇒ manual address entry only.
      - SIGN_ADDRESS_PROVIDER
      - SIGN_ADDRESS_PROVIDER_KEY
      - ARAMO_SIGN_BASE_URL
      - SIGN_SENDER_WEB_BASE_URL
      - MAILER_PROVIDER
      - SES_FROM_ADDRESS
      # Domain-Enforcement P3 — opt-in expiry sweep of PROVISIONAL domain claims
      # (unset ⇒ off; an expired claim still lapses on the next claim attempt).
      - DOMAIN_CLAIM_SWEEP_ENABLED
      - DOMAIN_CLAIM_SWEEP_INTERVAL_MS
      # CCP-D1 — opt-in usage roll-up worker (unset ⇒ off; roll-ups are derived).
      - CCP_USAGE_ROLLUP_ENABLED
      - CCP_USAGE_ROLLUP_INTERVAL_MS
      # Sign Personal (Free) Launch v1.1 (LOCKED) — public Personal signup + operator
      # review. Dark unless SIGN_PERSONAL_SIGNUP_MODE is invite|open (ships off).
      # GeoLite2 databases are files on the box, kept current by MaxMind's updater
      # (deploy/geoip/docker-compose.geoip.yml, a separate compose project). The network country is a risk signal only
      # (Architect ruling 2026-10-21): unset / missing / unreadable ⇒ UNKNOWN ⇒ risk
      # points, never a refusal by itself. SMS unset ⇒ disabled (step-up signups go
      # to review). Turnstile secret unset ⇒ every signup is refused.
      # SIGN_TURNSTILE_MODE (test-only) is deliberately NOT passed.
      - SIGN_PERSONAL_SIGNUP_MODE
      - SIGN_PERSONAL_PILOT_CAP
      - SIGN_PERSONAL_ALLOWED_COUNTRIES
      - SIGN_PERSONAL_RISK_CONFIG
      # The GeoLite2 files live on the box in /opt/aramo/geoip (mounted read-only below).
      - SIGN_GEOIP_DB_PATH=${SIGN_GEOIP_DB_PATH:-/geoip/GeoLite2-Country.mmdb}
      - SIGN_GEOIP_ASN_DB_PATH=${SIGN_GEOIP_ASN_DB_PATH:-/geoip/GeoLite2-ASN.mmdb}
      - SIGN_SMS_PROVIDER
      - SIGN_TURNSTILE_SECRET
      - SIGN_PERSONAL_LAPSE_SWEEP_ENABLED
      - SIGN_PERSONAL_LAPSE_SWEEP_INTERVAL_MS
      # Signup-attempt cleanup (abandoned: 3 days after expiry; refused: 180 days) — ON unless set to 0.
      - SIGN_PERSONAL_SIGNUP_PURGE_ENABLED
      - SIGN_PERSONAL_SIGNUP_PURGE_INTERVAL_MS
    # Sign Personal (Free) — offline MaxMind GeoLite2 databases, read-only (written by
    # deploy/geoip/docker-compose.geoip.yml; a replaced file is picked up without a restart). A
    # missing directory / file ⇒ network country UNKNOWN ⇒ a risk signal, not a refusal.
    volumes:
      - /opt/aramo/geoip:/geoip:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # GS-2 P1 — desired image is pgvector-capable PG17. This is the REPOSITORY desired-state
    # declaration only. ⚠ OPS PREREQUISITE — NOT YET ATTESTED: the running prod DB container
    # must be recreated on this image (same PG17 major, same volume/data preserved) and prove
    # `CREATE EXTENSION vector;` succeeds BEFORE any vector-requiring migration deploys.
    image: pgvector/pgvector:pg17
    container_name: aramo-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aramo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-aramo}
    # NO ports: container-internal only (never exposed to host/network).
    volumes:
      - aramo-prod-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-aramo} -d ${POSTGRES_DB:-aramo}']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: aramo-prod-redis
    restart: unless-stopped
    # NO ports: container-internal only (never exposed to host/network).
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  aramo-prod-pgdata:
  # Front-Door (ADR-0023) — the certbot-owned wildcard cert store (certbot rw, nginx ro).
  aramo-prod-letsencrypt:
